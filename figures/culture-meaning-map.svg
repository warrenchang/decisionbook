<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">The same action becomes different social acts through cultural meaning</title>
  <desc id="desc">An observable action passes through four evenly spaced meaning lenses—identity, relationship and power, institution and norm, and history and situation—before becoming an interpreted social act that changes attention, value, prediction, and response.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#2b75a0"/>
    </marker>
    <filter id="shadow" x="-12%" y="-15%" width="124%" height="145%">
      <feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#183047" flood-opacity="0.13"/>
    </filter>
  </defs>
  <rect width="1200" height="720" fill="#ffffff"/>
  <text x="600" y="56" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700" fill="#183047">The same action is not always the same act</text>
  <text x="600" y="91" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#60758a">Culture enters early by shaping what an observable event means.</text>

  <g stroke="#7892a8" stroke-width="4" fill="none">
    <path d="M287 352 L325 352 L355 166"/>
    <path d="M287 352 L325 352 L355 290"/>
    <path d="M287 352 L325 352 L355 414"/>
    <path d="M287 352 L325 352 L355 538"/>
    <path d="M605 166 L654 166 L690 352"/>
    <path d="M605 290 L654 290 L690 352"/>
    <path d="M605 414 L654 414 L690 352"/>
    <path d="M605 538 L654 538 L690 352"/>
  </g>
  <line x1="690" y1="352" x2="744" y2="352" stroke="#2b75a0" stroke-width="6" marker-end="url(#arrow)"/>
  <line x1="944" y1="352" x2="978" y2="352" stroke="#2b75a0" stroke-width="6" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)" font-family="Arial, Helvetica, sans-serif">
    <rect x="58" y="282" width="229" height="140" rx="24" fill="#fff8ea" stroke="#d39b34" stroke-width="3"/>
    <text x="172" y="330" text-anchor="middle" font-size="23" font-weight="700" fill="#7d5718">OBSERVABLE</text>
    <text x="172" y="359" text-anchor="middle" font-size="23" font-weight="700" fill="#7d5718">ACTION</text>
    <text x="172" y="393" text-anchor="middle" font-size="18" fill="#5f4c2a">silence · gift · refusal</text>

    <g fill="#edf5fa" stroke="#2b75a0" stroke-width="3">
      <rect x="355" y="124" width="250" height="84" rx="20"/>
      <rect x="355" y="248" width="250" height="84" rx="20"/>
      <rect x="355" y="372" width="250" height="84" rx="20"/>
      <rect x="355" y="496" width="250" height="84" rx="20"/>
    </g>
    <g fill="#183047" text-anchor="middle">
      <text x="480" y="159" font-size="21" font-weight="700">IDENTITY</text>
      <text x="480" y="184" font-size="17" fill="#60758a">Who am I—or are we?</text>
      <text x="480" y="282" font-size="19" font-weight="700">RELATIONSHIP · POWER</text>
      <text x="480" y="307" font-size="17" fill="#60758a">Who may say or refuse?</text>
      <text x="480" y="406" font-size="21" font-weight="700">INSTITUTION · NORM</text>
      <text x="480" y="431" font-size="17" fill="#60758a">What is expected here?</text>
      <text x="480" y="530" font-size="21" font-weight="700">HISTORY · SITUATION</text>
      <text x="480" y="555" font-size="17" fill="#60758a">What happened before?</text>
    </g>

    <rect x="746" y="282" width="198" height="140" rx="24" fill="#f2eef8" stroke="#80639a" stroke-width="3"/>
    <text x="845" y="329" text-anchor="middle" font-size="22" font-weight="700" fill="#664d80">INTERPRETED</text>
    <text x="845" y="358" text-anchor="middle" font-size="22" font-weight="700" fill="#664d80">SOCIAL ACT</text>
    <text x="845" y="391" text-anchor="middle" font-size="17" fill="#60758a">respect? fear? care?</text>

    <rect x="980" y="270" width="190" height="164" rx="24" fill="#edf7ef" stroke="#4f8b61" stroke-width="3"/>
    <text x="1075" y="312" text-anchor="middle" font-size="21" font-weight="700" fill="#2d6740">DECISION</text>
    <text x="1075" y="338" text-anchor="middle" font-size="21" font-weight="700" fill="#2d6740">CONSEQUENCE</text>
    <text x="1075" y="371" text-anchor="middle" font-size="17" fill="#355e43">attention · value</text>
    <text x="1075" y="397" text-anchor="middle" font-size="17" fill="#355e43">prediction · response</text>
  </g>

  <rect x="80" y="626" width="1040" height="55" rx="18" fill="#f4f7f9" stroke="#b9c8d4" stroke-width="2"/>
  <text x="600" y="660" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" fill="#183047">Use culture to generate questions about meaning—not answers about a person.</text>
</svg>

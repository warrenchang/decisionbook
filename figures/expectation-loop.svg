<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="790" viewBox="0 0 1400 790" role="img" aria-labelledby="title desc">
  <title id="title">Four pathways through which expectations can affect outcomes</title>
  <desc id="desc">An expectation branches into four parallel pathways: physiological response, the person's behavior, other people's responses, and resource or opportunity allocation. These pathways can change outcomes. Feedback may reinforce the original expectation, producing a self-fulfilling pattern, or counteract and prevent it, producing a self-defeating pattern.</desc>
  <defs>
    <marker id="arrow-blue" viewBox="0 0 10 8" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0.5 0.8 L9 4 L0.5 7.2 Z" fill="#2f6f9f"/></marker>
    <marker id="arrow-green" viewBox="0 0 10 8" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0.5 0.8 L9 4 L0.5 7.2 Z" fill="#447c55"/></marker>
    <marker id="arrow-orange" viewBox="0 0 10 8" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0.5 0.8 L9 4 L0.5 7.2 Z" fill="#c56a2d"/></marker>
    <style>
      .title{font:700 34px Arial,sans-serif;fill:#17324d}
      .subtitle{font:19px Arial,sans-serif;fill:#607080}
      .label{font:700 23px Arial,sans-serif;fill:#17324d}
      .body{font:18px Arial,sans-serif;fill:#536879}
      .lane{stroke-width:3}
      .flow{fill:none;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}
    </style>
  </defs>
  <rect width="1400" height="790" fill="#ffffff"/>
  <text class="title" x="700" y="48" text-anchor="middle">Expectations can become part of the causal system</text>
  <text class="subtitle" x="700" y="80" text-anchor="middle">Four pathways can reinforce a forecast—or help prevent it from coming true.</text>

  <rect x="55" y="275" width="270" height="150" rx="22" fill="#eaf3f8" stroke="#2f6f9f" stroke-width="3"/>
  <text class="label" x="190" y="325" text-anchor="middle">Expectation</text>
  <text class="body" x="190" y="360" text-anchor="middle"><tspan x="190">belief about what will</tspan><tspan x="190" dy="26">happen or how one will feel</tspan></text>

  <path class="flow" d="M325 350 H390 M390 155 V545" stroke="#2f6f9f"/>
  <circle cx="390" cy="350" r="5" fill="#2f6f9f"/>

  <rect class="lane" x="445" y="110" width="360" height="90" rx="18" fill="#edf4ed" stroke="#447c55"/>
  <text class="label" x="625" y="145" text-anchor="middle">Physiological response</text>
  <text class="body" x="625" y="176" text-anchor="middle">pain, stress, arousal, satiety</text>
  <path class="flow" d="M390 155 H445" stroke="#2f6f9f" stroke-width="4" marker-end="url(#arrow-blue)"/>

  <rect class="lane" x="445" y="240" width="360" height="90" rx="18" fill="#f7f1e8" stroke="#c56a2d"/>
  <text class="label" x="625" y="275" text-anchor="middle">Behavior and effort</text>
  <text class="body" x="625" y="306" text-anchor="middle">practice, avoidance, persistence, trust</text>
  <path class="flow" d="M390 285 H445" stroke="#2f6f9f" stroke-width="4" marker-end="url(#arrow-blue)"/>

  <rect class="lane" x="445" y="370" width="360" height="90" rx="18" fill="#eee9fb" stroke="#7657a8"/>
  <text class="label" x="625" y="405" text-anchor="middle">Other people's responses</text>
  <text class="body" x="625" y="436" text-anchor="middle">warmth, challenge, patience, exclusion</text>
  <path class="flow" d="M390 415 H445" stroke="#2f6f9f" stroke-width="4" marker-end="url(#arrow-blue)"/>

  <rect class="lane" x="445" y="500" width="360" height="90" rx="18" fill="#fff0ed" stroke="#a74343"/>
  <text class="label" x="625" y="535" text-anchor="middle">Resources and opportunities</text>
  <text class="body" x="625" y="566" text-anchor="middle">time, budget, access, information, roles</text>
  <path class="flow" d="M390 545 H445" stroke="#2f6f9f" stroke-width="4" marker-end="url(#arrow-blue)"/>

  <path class="flow" d="M805 155 H875 M875 155 V545" stroke="#447c55"/>
  <path class="flow" d="M805 285 H875 M805 415 H875 M805 545 H875" stroke="#447c55"/>
  <circle cx="875" cy="350" r="5" fill="#447c55"/>
  <path class="flow" d="M875 350 H950" stroke="#447c55" stroke-width="4" marker-end="url(#arrow-green)"/>

  <rect x="950" y="275" width="385" height="150" rx="22" fill="#edf4ed" stroke="#447c55" stroke-width="3"/>
  <text class="label" x="1143" y="325" text-anchor="middle">Changed outcome and evidence</text>
  <text class="body" x="1143" y="360" text-anchor="middle"><tspan x="1143">what occurs may no longer be</tspan><tspan x="1143" dy="26">independent of the expectation</tspan></text>

  <path class="flow" d="M1143 425 C1110 695 210 700 190 425" stroke="#c56a2d" stroke-width="4" marker-end="url(#arrow-orange)"/>
  <rect x="355" y="615" width="690" height="125" rx="20" fill="#fff8ef" stroke="#c56a2d" stroke-width="2.5"/>
  <text class="label" x="700" y="650" text-anchor="middle">Feedback can run in either direction</text>
  <text class="body" x="700" y="683" text-anchor="middle"><tspan x="700">Reinforces the expectation → self-fulfilling pattern</tspan><tspan x="700" dy="27">Counteracts or prevents the outcome → self-defeating pattern</tspan></text>
</svg>

<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" baseProfile="full" height="650" version="1.1" viewBox="0 0 1200 650" width="1200">
  <defs />
  <title>Advanced agreement design</title>
  <desc>MESOs reveal priorities, contingent contracts manage belief differences, post-settlement settlements improve packages, and governance supports implementation.</desc>
  <rect fill="white" height="650" width="1200" x="0" y="0" />
  <text fill="#17324d" font-family="Arial, sans-serif" font-size="34" font-weight="bold" text-anchor="middle" x="600" y="48">Better agreements solve more than the bargaining moment</text>
  <line stroke="#2f6f9f" stroke-width="3" x1="375" x2="500.66" y1="242.95" y2="285.98" />
  <polygon fill="#2f6f9f" points="500.66,285.98 485.9405,288.8671 490.7999,274.6761" />
  <line stroke="#c56a2d" stroke-width="3" x1="825" x2="699.34" y1="242.95" y2="285.98" />
  <polygon fill="#c56a2d" points="699.34,285.98 709.2001,274.6761 714.0595,288.8671" />
  <line stroke="#447c55" stroke-width="3" x1="356.67" x2="504.32" y1="430" y2="363.25" />
  <polygon fill="#447c55" points="504.32,363.25 495.5726,375.4354 489.3935,361.7672" />
  <line stroke="#795a8a" stroke-width="3" x1="843.33" x2="695.68" y1="430" y2="363.25" />
  <polygon fill="#795a8a" points="695.68,363.25 710.6065,361.7672 704.4274,375.4354" />
  <circle cx="600" cy="320" fill="#17324d" r="105" />
  <text fill="white" font-family="Arial, sans-serif" font-size="29" font-weight="bold" text-anchor="middle" x="600" y="310">Better</text>
  <text fill="white" font-family="Arial, sans-serif" font-size="29" font-weight="bold" text-anchor="middle" x="600" y="348">agreement</text>
  <rect fill="#eaf3f8" height="110" rx="16" ry="16" stroke="#2f6f9f" stroke-width="3" width="280" x="95" y="140" />
  <text fill="#17324d" font-family="Arial, sans-serif" font-size="26" font-weight="bold" text-anchor="middle" x="235" y="178.94"><tspan x="235" dy="0">MESOs</tspan></text>
  <text fill="#66737f" font-family="Arial, sans-serif" font-size="17" font-weight="normal" text-anchor="middle" x="235" y="207.06"><tspan x="235" dy="0">reveal priorities without</tspan><tspan x="235" dy="20.06">asking for one answer</tspan></text>
  <rect fill="#f7f1e8" height="110" rx="16" ry="16" stroke="#c56a2d" stroke-width="3" width="280" x="825" y="140" />
  <text fill="#17324d" font-family="Arial, sans-serif" font-size="26" font-weight="bold" text-anchor="middle" x="965" y="173.63"><tspan x="965" dy="0">Contingent</tspan><tspan x="965" dy="30.68">contracts</tspan></text>
  <text fill="#66737f" font-family="Arial, sans-serif" font-size="17" font-weight="normal" text-anchor="middle" x="965" y="232.43"><tspan x="965" dy="0">bet on different forecasts</tspan></text>
  <rect fill="#edf4ed" height="110" rx="16" ry="16" stroke="#447c55" stroke-width="3" width="280" x="95" y="430" />
  <text fill="#17324d" font-family="Arial, sans-serif" font-size="22.46" font-weight="bold" text-anchor="middle" x="235" y="457.87"><tspan x="235" dy="0">Post-settlement</tspan><tspan x="235" dy="26.5079">search</tspan></text>
  <text fill="#66737f" font-family="Arial, sans-serif" font-size="16" font-weight="normal" text-anchor="middle" x="235" y="509.354"><tspan x="235" dy="0">improve without risking</tspan><tspan x="235" dy="17.3321">the signed deal</tspan></text>
  <rect fill="#f5ebf5" height="110" rx="16" ry="16" stroke="#795a8a" stroke-width="3" width="280" x="825" y="430" />
  <text fill="#17324d" font-family="Arial, sans-serif" font-size="26" font-weight="bold" text-anchor="middle" x="965" y="468.94"><tspan x="965" dy="0">Governance</tspan></text>
  <text fill="#66737f" font-family="Arial, sans-serif" font-size="17" font-weight="normal" text-anchor="middle" x="965" y="497.06"><tspan x="965" dy="0">monitor • adapt • repair •</tspan><tspan x="965" dy="20.06">learn</tspan></text>
  <text fill="#66737f" font-family="Arial, sans-serif" font-size="21" font-weight="normal" text-anchor="middle" x="600" y="605">Agreement quality includes allocation, information, implementation, and the capacity to adapt.</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="760" height="850" viewBox="0 0 760 850" role="img" aria-labelledby="title desc">
<title id="title">Choose an agreement tool for the problem</title><desc id="desc">Four optional tools are grouped by the problem they address: package offers reveal priorities, contingent terms address uncertain outcomes, post-settlement search seeks improvements with a protected fallback, and governance makes commitments operable. The footer lists tests that apply to every package. These are design choices, not inevitable stages.</desc>
<rect width="760" height="850" fill="white"/>
<defs>
<marker id="a" viewBox="0 0 12 10" markerWidth="9" markerHeight="8" refX="11" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L11 5 L1 9 Z" fill="#2f6f9f"/></marker>
<marker id="g" viewBox="0 0 12 10" markerWidth="9" markerHeight="8" refX="11" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L11 5 L1 9 Z" fill="#3f7c59"/></marker>
<marker id="o" viewBox="0 0 12 10" markerWidth="9" markerHeight="8" refX="11" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L11 5 L1 9 Z" fill="#b95f2d"/></marker>
</defs>
<text x="380" y="48" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="700" fill="#17324d">Choose an agreement tool</text>
<text x="380" y="89.6" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="700" fill="#17324d">for the problem</text>
<rect x="35" y="135" width="330" height="270" rx="18" fill="#edf5fa" stroke="#2f6f9f" stroke-width="2.5"/>
<text x="200" y="174" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#2f6f9f">Compare packages</text>
<text x="200" y="210.4" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#2f6f9f">(MESOs)</text>
<text x="200" y="259" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="400" fill="#17324d">Offer sincere packages</text>
<text x="200" y="294" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="400" fill="#17324d">that are understandable</text>
<text x="200" y="329" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="400" fill="#17324d">and about equally</text>
<text x="200" y="364" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="400" fill="#17324d">valuable to you.</text>
<rect x="395" y="135" width="330" height="270" rx="18" fill="#fff5ec" stroke="#b95f2d" stroke-width="2.5"/>
<text x="560" y="174" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#b95f2d">Use later evidence</text>
<text x="560" y="210.4" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#b95f2d">(contingent terms)</text>
<text x="560" y="259" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="400" fill="#17324d">Choose a verifiable</text>
<text x="560" y="294" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="400" fill="#17324d">outcome, fair risk,</text>
<text x="560" y="329" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="400" fill="#17324d">workable incentives,</text>
<text x="560" y="364" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="400" fill="#17324d">credible enforcement.</text>
<rect x="35" y="440" width="330" height="270" rx="18" fill="#edf7ef" stroke="#3f7c59" stroke-width="2.5"/>
<text x="200" y="479" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#3f7c59">Look for a better deal</text>
<text x="200" y="515.4" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#3f7c59">after signing</text>
<text x="200" y="564" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="400" fill="#17324d">Agree to protect the</text>
<text x="200" y="599" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="400" fill="#17324d">signed deal as a fallback.</text>
<text x="200" y="634" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="400" fill="#17324d">Replace it only with</text>
<text x="200" y="669" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="400" fill="#17324d">everyone’s free consent.</text>
<rect x="395" y="440" width="330" height="270" rx="18" fill="#f4eff8" stroke="#795a8a" stroke-width="2.5"/>
<text x="560" y="479" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#795a8a">Make promises</text>
<text x="560" y="515.4" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#795a8a">operable</text>
<text x="560" y="564" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="400" fill="#17324d">Set an owner, measure,</text>
<text x="560" y="599" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="400" fill="#17324d">review date, response</text>
<text x="560" y="634" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="400" fill="#17324d">to problems, and route</text>
<text x="560" y="669" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="400" fill="#17324d">to resolution or exit.</text>
<text x="380" y="760" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="400" fill="#53697d">Test the whole package against alternatives,</text>
<text x="380" y="796.4" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="400" fill="#53697d">feasibility, fairness, consent, and implementation.</text>
</svg>

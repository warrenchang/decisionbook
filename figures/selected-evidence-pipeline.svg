<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="820" viewBox="0 0 1500 820" role="img" aria-labelledby="title desc">
  <title id="title">How evidence becomes a visible scientific claim</title>
  <desc id="desc">A five-stage pipeline runs from phenomenon and theory through study design, observed data, analysis and reporting, to the visible literature. Below it, five safeguards—precision, preregistration, audit trails, open workflows, and replication and correction—feed upward into the corresponding stages.</desc>
  <rect width="1500" height="820" fill="#f8fafc"/>
  <text x="750" y="64" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700" fill="#17243a">The literature is a selected signal</text>
  <text x="750" y="102" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#4b5d73">Evidence can be weakened at several stages—and strengthened at each one</text>

  <g font-family="Arial, Helvetica, sans-serif">
    <rect x="45" y="175" width="245" height="190" rx="20" fill="#d9eaf7" stroke="#2878a8" stroke-width="3"/>
    <text x="168" y="222" text-anchor="middle" font-size="24" font-weight="700" fill="#173752">1  Phenomenon</text>
    <text x="168" y="254" text-anchor="middle" font-size="20" fill="#173752">and theory</text>
    <text x="168" y="303" text-anchor="middle" font-size="17" fill="#435d70">Unknown effect</text>
    <text x="168" y="330" text-anchor="middle" font-size="17" fill="#435d70">and boundary conditions</text>

    <rect x="335" y="175" width="245" height="190" rx="20" fill="#dcefe8" stroke="#21866f" stroke-width="3"/>
    <text x="458" y="222" text-anchor="middle" font-size="24" font-weight="700" fill="#174f44">2  Study design</text>
    <text x="458" y="276" text-anchor="middle" font-size="17" fill="#3e645d">Sampling · measures</text>
    <text x="458" y="303" text-anchor="middle" font-size="17" fill="#3e645d">assignment · power</text>
    <text x="458" y="330" text-anchor="middle" font-size="17" fill="#3e645d">implementation</text>

    <rect x="625" y="175" width="245" height="190" rx="20" fill="#f6eccb" stroke="#b38317" stroke-width="3"/>
    <text x="748" y="222" text-anchor="middle" font-size="24" font-weight="700" fill="#604600">3  Observed data</text>
    <text x="748" y="276" text-anchor="middle" font-size="17" fill="#695d38">Signal + random error</text>
    <text x="748" y="303" text-anchor="middle" font-size="17" fill="#695d38">missingness · attrition</text>
    <text x="748" y="330" text-anchor="middle" font-size="17" fill="#695d38">coding and data errors</text>

    <rect x="915" y="175" width="245" height="190" rx="20" fill="#f5dfdf" stroke="#b34d4d" stroke-width="3"/>
    <text x="1038" y="222" text-anchor="middle" font-size="24" font-weight="700" fill="#702d2d">4  Analysis</text>
    <text x="1038" y="254" text-anchor="middle" font-size="20" fill="#702d2d">and reporting</text>
    <text x="1038" y="303" text-anchor="middle" font-size="17" fill="#744b4b">Multiplicity · flexibility</text>
    <text x="1038" y="330" text-anchor="middle" font-size="17" fill="#744b4b">selective disclosure</text>

    <rect x="1205" y="175" width="245" height="190" rx="20" fill="#e7e0f4" stroke="#7657a8" stroke-width="3"/>
    <text x="1328" y="222" text-anchor="middle" font-size="24" font-weight="700" fill="#4b3870">5  Visible</text>
    <text x="1328" y="254" text-anchor="middle" font-size="20" fill="#4b3870">literature</text>
    <text x="1328" y="303" text-anchor="middle" font-size="17" fill="#5d5271">Publication · publicity</text>
    <text x="1328" y="330" text-anchor="middle" font-size="17" fill="#5d5271">citation and correction</text>

    <g fill="#52657a">
      <path d="M290 258 H321 V247 L335 270 L321 293 V282 H290 Z"/>
      <path d="M580 258 H611 V247 L625 270 L611 293 V282 H580 Z"/>
      <path d="M870 258 H901 V247 L915 270 L901 293 V282 H870 Z"/>
      <path d="M1160 258 H1191 V247 L1205 270 L1191 293 V282 H1160 Z"/>
    </g>

    <rect x="45" y="487" width="1405" height="245" rx="24" fill="#ffffff" stroke="#97a6b5" stroke-width="2"/>
    <text x="750" y="535" text-anchor="middle" font-size="25" font-weight="700" fill="#24364a">Safeguards do different jobs</text>

    <g font-size="18" text-anchor="middle">
      <rect x="78" y="580" width="230" height="92" rx="15" fill="#edf6fb" stroke="#2878a8" stroke-width="2"/>
      <text x="193" y="618" font-weight="700" fill="#173752">Theory + precision</text>
      <text x="193" y="646" font-size="17" fill="#435d70">Define effects worth detecting</text>

      <rect x="356" y="580" width="230" height="92" rx="15" fill="#edf8f4" stroke="#21866f" stroke-width="2"/>
      <text x="471" y="618" font-weight="700" fill="#174f44">Preregistration</text>
      <text x="471" y="646" font-size="17" fill="#3e645d">Make planned choices visible</text>

      <rect x="634" y="580" width="230" height="92" rx="15" fill="#fff9e8" stroke="#b38317" stroke-width="2"/>
      <text x="749" y="618" font-weight="700" fill="#604600">Audit trail</text>
      <text x="749" y="646" font-size="17" fill="#695d38">Preserve data provenance</text>

      <rect x="912" y="580" width="230" height="92" rx="15" fill="#fdf1f1" stroke="#b34d4d" stroke-width="2"/>
      <text x="1027" y="618" font-weight="700" fill="#702d2d">Open workflow</text>
      <text x="1027" y="646" font-size="17" fill="#744b4b">Reproduce data and analysis</text>

      <rect x="1190" y="580" width="230" height="92" rx="15" fill="#f4f0fa" stroke="#7657a8" stroke-width="2"/>
      <text x="1305" y="618" font-weight="700" fill="#4b3870">Replication + correction</text>
      <text x="1305" y="646" font-size="17" fill="#5d5271">Test and update the claim</text>
    </g>

    <g stroke="#74869a" stroke-width="3" fill="#74869a">
      <path d="M193 580 V384" fill="none"/>
      <path d="M193 365 L184 385 H202 Z" stroke="none"/>
      <path d="M471 580 V384" fill="none"/>
      <path d="M471 365 L462 385 H480 Z" stroke="none"/>
      <path d="M749 580 V384" fill="none"/>
      <path d="M749 365 L740 385 H758 Z" stroke="none"/>
      <path d="M1027 580 V384" fill="none"/>
      <path d="M1027 365 L1018 385 H1036 Z" stroke="none"/>
      <path d="M1305 580 V384" fill="none"/>
      <path d="M1305 365 L1296 385 H1314 Z" stroke="none"/>
    </g>

    <text x="750" y="780" text-anchor="middle" font-size="19" font-style="italic" fill="#56687b">No single safeguard proves a claim. Credibility comes from an inspectable chain and cumulative evidence.</text>
  </g>
</svg>

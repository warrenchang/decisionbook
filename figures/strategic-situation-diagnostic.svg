<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Diagnose overlapping strategic archetypes before choosing a move</title>
  <desc id="desc">A strategic situation branches to four archetypes that can overlap: coordination, conflict, mixed motives, and anti-coordination. Anti-coordination is identified as a coordination family. The archetypes converge on a game audit of players, actions, payoffs, beliefs, information, and timing.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 8" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0.5 0.8 L9 4 L0.5 7.2 Z" fill="#25678f"/></marker>
    <marker id="greenArrow" viewBox="0 0 10 8" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0.5 0.8 L9 4 L0.5 7.2 Z" fill="#447c55"/></marker>
    <filter id="shadow"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#183047" flood-opacity="0.12"/></filter>
  </defs>
  <rect width="1200" height="760" fill="#ffffff"/>
  <text x="600" y="48" text-anchor="middle" font-family="Georgia, serif" font-size="34" font-weight="700" fill="#183047">Diagnose the payoff structure before choosing a move</text>
  <text x="600" y="80" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#607080">These are overlapping archetypes—not mutually exclusive bins. Check every pattern that the payoffs support.</text>

  <g font-family="Arial, sans-serif" filter="url(#shadow)">
    <rect x="410" y="105" width="380" height="82" rx="19" fill="#183047"/>
    <text x="600" y="139" text-anchor="middle" font-size="23" font-weight="700" fill="#ffffff">PAYOFF FEATURES MAY COEXIST</text>
    <text x="600" y="166" text-anchor="middle" font-size="16" fill="#d8e6ef">My payoff depends on others' actions and responses</text>

    <rect x="38" y="255" width="250" height="190" rx="20" fill="#eaf3f8" stroke="#25678f" stroke-width="3"/>
    <text x="163" y="297" text-anchor="middle" font-size="22" font-weight="700" fill="#183047">COORDINATION</text>
    <text x="163" y="332" text-anchor="middle" font-size="17" fill="#607080">Interests align;</text>
    <text x="163" y="357" text-anchor="middle" font-size="17" fill="#607080">actions must match</text>
    <line x1="78" y1="378" x2="248" y2="378" stroke="#9eb9ca" stroke-width="2"/>
    <text x="163" y="407" text-anchor="middle" font-size="16" font-weight="700" fill="#25678f">Which common signal?</text>

    <rect x="329" y="255" width="250" height="190" rx="20" fill="#fff0e9" stroke="#b95f2d" stroke-width="3"/>
    <text x="454" y="297" text-anchor="middle" font-size="22" font-weight="700" fill="#183047">CONFLICT</text>
    <text x="454" y="332" text-anchor="middle" font-size="17" fill="#607080">One side's gain can</text>
    <text x="454" y="357" text-anchor="middle" font-size="17" fill="#607080">reduce the other's</text>
    <line x1="369" y1="378" x2="539" y2="378" stroke="#dfb59e" stroke-width="2"/>
    <text x="454" y="407" text-anchor="middle" font-size="16" font-weight="700" fill="#b95f2d">What follows my move?</text>

    <rect x="620" y="255" width="250" height="190" rx="20" fill="#f5ebf5" stroke="#795a8a" stroke-width="3"/>
    <text x="745" y="297" text-anchor="middle" font-size="22" font-weight="700" fill="#183047">MIXED MOTIVES</text>
    <text x="745" y="332" text-anchor="middle" font-size="17" fill="#607080">Create value together;</text>
    <text x="745" y="357" text-anchor="middle" font-size="17" fill="#607080">contest its distribution</text>
    <line x1="660" y1="378" x2="830" y2="378" stroke="#c8afd0" stroke-width="2"/>
    <text x="745" y="407" text-anchor="middle" font-size="16" font-weight="700" fill="#795a8a">Create or divide?</text>

    <rect x="911" y="255" width="250" height="190" rx="20" fill="#edf4ed" stroke="#447c55" stroke-width="3"/>
    <text x="1036" y="297" text-anchor="middle" font-size="21" font-weight="700" fill="#183047">ANTI-COORDINATION</text>
    <text x="1036" y="327" text-anchor="middle" font-size="16" fill="#607080">Coordination family:</text>
    <text x="1036" y="350" text-anchor="middle" font-size="16" fill="#607080">different roles or actions</text>
    <text x="1036" y="371" text-anchor="middle" font-size="16" fill="#607080">avoid collision</text>
    <line x1="951" y1="378" x2="1121" y2="378" stroke="#a9c7b1" stroke-width="2"/>
    <text x="1036" y="407" text-anchor="middle" font-size="16" font-weight="700" fill="#447c55">Who acts, yields, rotates?</text>

    <rect x="250" y="530" width="700" height="92" rx="20" fill="#f7f9fc" stroke="#25678f" stroke-width="3"/>
    <text x="600" y="567" text-anchor="middle" font-size="22" font-weight="700" fill="#183047">GAME AUDIT</text>
    <text x="600" y="597" text-anchor="middle" font-size="17" fill="#607080">players • actions • payoffs • beliefs • information • timing</text>

    <rect x="250" y="670" width="700" height="62" rx="20" fill="#edf4ed" stroke="#447c55" stroke-width="3"/>
    <text x="600" y="708" text-anchor="middle" font-size="19" font-weight="700" fill="#183047">DESIGN: communicate • sequence • match • rotate • commit • monitor • exit</text>
  </g>

  <line x1="600" y1="187" x2="600" y2="218" stroke="#25678f" stroke-width="4"/>
  <line x1="163" y1="218" x2="1036" y2="218" stroke="#25678f" stroke-width="4"/>
  <line x1="163" y1="218" x2="163" y2="252" stroke="#25678f" stroke-width="4" marker-end="url(#arrow)"/>
  <line x1="454" y1="218" x2="454" y2="252" stroke="#25678f" stroke-width="4" marker-end="url(#arrow)"/>
  <line x1="745" y1="218" x2="745" y2="252" stroke="#25678f" stroke-width="4" marker-end="url(#arrow)"/>
  <line x1="1036" y1="218" x2="1036" y2="252" stroke="#25678f" stroke-width="4" marker-end="url(#arrow)"/>

  <line x1="163" y1="445" x2="163" y2="485" stroke="#25678f" stroke-width="3.5"/>
  <line x1="454" y1="445" x2="454" y2="485" stroke="#25678f" stroke-width="3.5"/>
  <line x1="745" y1="445" x2="745" y2="485" stroke="#25678f" stroke-width="3.5"/>
  <line x1="1036" y1="445" x2="1036" y2="485" stroke="#25678f" stroke-width="3.5"/>
  <line x1="163" y1="485" x2="1036" y2="485" stroke="#25678f" stroke-width="3.5"/>
  <line x1="600" y1="485" x2="600" y2="527" stroke="#25678f" stroke-width="4" marker-end="url(#arrow)"/>
  <line x1="600" y1="622" x2="600" y2="667" stroke="#447c55" stroke-width="4" marker-end="url(#greenArrow)"/>
</svg>

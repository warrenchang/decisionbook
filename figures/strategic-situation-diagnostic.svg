<svg xmlns="http://www.w3.org/2000/svg" width="760" height="660" viewBox="0 0 760 660" role="img" aria-labelledby="title desc" data-layout="compact">
  <title id="title">Two standards, two compatible outcomes</title>
  <desc id="desc">A two-by-two coordination map. Rows show Department A choosing standard A or B; columns show Department B choosing standard A or B. The two diagonal outcomes use matching standards and are compatible. The two off-diagonal outcomes use different standards and are incompatible. Either matching outcome can be an equilibrium if both departments prefer compatibility.</desc>
  <defs>
    <g id="standard-a">
      <rect x="0" y="0" width="78" height="100" rx="8" fill="#ffffff" stroke="#25678f" stroke-width="3"/>
      <path d="M18 20H60 M18 78H60" fill="none" stroke="#9eb9ca" stroke-width="3" stroke-linecap="round"/>
      <text x="39" y="63" text-anchor="middle" font-family="Arial, sans-serif" font-size="36" font-weight="700" fill="#25678f">A</text>
    </g>
    <g id="standard-b">
      <rect x="0" y="0" width="78" height="100" rx="8" fill="#ffffff" stroke="#795a8a" stroke-width="3"/>
      <path d="M18 20H60 M18 78H60" fill="none" stroke="#c8afd0" stroke-width="3" stroke-linecap="round"/>
      <text x="39" y="63" text-anchor="middle" font-family="Arial, sans-serif" font-size="36" font-weight="700" fill="#795a8a">B</text>
    </g>
  </defs>
  <rect width="760" height="660" fill="#ffffff"/>
  <g font-family="Arial, sans-serif" text-anchor="middle" fill="#183047">
    <text x="99" y="45" font-size="28" font-weight="700">Department</text>
    <text x="99" y="79" font-size="28" font-weight="700">A</text>
    <text x="469" y="45" font-size="30" font-weight="700">Department B</text>
    <text x="338" y="102" font-size="28">Standard A</text>
    <text x="601" y="102" font-size="28">Standard B</text>
    <text x="99" y="249" font-size="28">Standard</text>
    <text x="99" y="285" font-size="32" font-weight="700">A</text>
    <text x="99" y="509" font-size="28">Standard</text>
    <text x="99" y="545" font-size="32" font-weight="700">B</text>

    <rect x="214" y="131" width="248" height="244" rx="17" fill="#edf4ed" stroke="#447c55" stroke-width="3"/>
    <rect x="477" y="131" width="248" height="244" rx="17" fill="#fff4ec" stroke="#dfb59e" stroke-width="2"/>
    <rect x="214" y="391" width="248" height="244" rx="17" fill="#fff4ec" stroke="#dfb59e" stroke-width="2"/>
    <rect x="477" y="391" width="248" height="244" rx="17" fill="#edf4ed" stroke="#447c55" stroke-width="3"/>

    <use href="#standard-a" x="246" y="177"/>
    <use href="#standard-a" x="352" y="177"/>
    <use href="#standard-a" x="509" y="177"/>
    <use href="#standard-b" x="615" y="177"/>
    <use href="#standard-b" x="246" y="437"/>
    <use href="#standard-a" x="352" y="437"/>
    <use href="#standard-b" x="509" y="437"/>
    <use href="#standard-b" x="615" y="437"/>

    <text x="338" y="334" font-size="28" font-weight="700" fill="#2c603c">Compatible</text>
    <text x="601" y="334" font-size="28" fill="#994a20">Incompatible</text>
    <text x="338" y="594" font-size="28" fill="#994a20">Incompatible</text>
    <text x="601" y="594" font-size="28" font-weight="700" fill="#2c603c">Compatible</text>
  </g>
</svg>

<?xml version="1.0" encoding="utf-8" ?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink" baseProfile="full" height="650" version="1.1" viewBox="0 0 1200 650" width="1200">
  <defs/>
  <title>Fast and reflective processing</title>
  <desc>Automatic processing generates impressions; reflective processing can inspect, redirect, and train it.</desc>
  <rect fill="white" height="650" width="1200" x="0" y="0"/>
  <text fill="#17324d" font-family="Arial, sans-serif" font-size="34" font-weight="bold" text-anchor="middle" x="600" y="55">Fast answers and slow inspection</text>
  <rect fill="#eaf3f8" height="260" rx="16" ry="16" stroke="#2f6f9f" stroke-width="3" width="400" x="80" y="150"/>
  <text fill="#17324d" font-family="Arial, sans-serif" font-size="26" font-weight="bold" text-anchor="middle" x="280.0" y="272.0">Automatic processing</text>
  <text fill="#66737f" font-family="Arial, sans-serif" font-size="17" font-weight="normal" text-anchor="middle" x="280.0" y="306.0">fast • associative • practiced</text>
  <text fill="#17324d" font-family="Arial, sans-serif" font-size="26" font-weight="bold" text-anchor="middle" x="280" y="255">impressions</text>
  <text fill="#17324d" font-family="Arial, sans-serif" font-size="23" font-weight="normal" text-anchor="middle" x="280" y="300">pattern recognition</text>
  <text fill="#17324d" font-family="Arial, sans-serif" font-size="23" font-weight="normal" text-anchor="middle" x="280" y="345">action tendencies</text>
  <rect fill="#f7f1e8" height="260" rx="16" ry="16" stroke="#c56a2d" stroke-width="3" width="400" x="720" y="150"/>
  <text fill="#17324d" font-family="Arial, sans-serif" font-size="26" font-weight="bold" text-anchor="middle" x="920.0" y="272.0">Reflective processing</text>
  <text fill="#66737f" font-family="Arial, sans-serif" font-size="17" font-weight="normal" text-anchor="middle" x="920.0" y="306.0">effortful • rule-guided • limited</text>
  <text fill="#17324d" font-family="Arial, sans-serif" font-size="26" font-weight="bold" text-anchor="middle" x="920" y="255">inspection</text>
  <text fill="#17324d" font-family="Arial, sans-serif" font-size="23" font-weight="normal" text-anchor="middle" x="920" y="300">simulation + comparison</text>
  <text fill="#17324d" font-family="Arial, sans-serif" font-size="23" font-weight="normal" text-anchor="middle" x="920" y="345">inhibition + redesign</text>
  <line stroke="#17324d" stroke-width="4" x1="480" x2="720" y1="250" y2="250"/>
  <polygon fill="#17324d" points="720,250 707.0096189432334,257.5 707.0096189432334,242.5"/>
  <line stroke="#c56a2d" stroke-width="4" x1="720" x2="480" y1="340" y2="340"/>
  <polygon fill="#c56a2d" points="480,340 492.9903810567666,332.5 492.9903810567666,347.5"/>
  <text fill="#17324d" font-family="Arial, sans-serif" font-size="23" font-weight="normal" text-anchor="middle" x="600" y="500">Practice can make slow skills fast; reflection can redirect attention and train intuition.</text>
  <text fill="#66737f" font-family="Arial, sans-serif" font-size="20" font-weight="normal" text-anchor="middle" x="600" y="555">Neither mode is always rational. Reliability depends on the task, environment, and feedback.</text>
</svg>

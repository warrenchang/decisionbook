<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">When price becomes evidence about price</title>
  <desc id="desc">A speculative feedback loop connects price increases, attention and extrapolative expectations, demand and strategic resale, and leverage and liquidity. Fundamentals feed price separately. Elastic supply, short selling, risk limits, and skeptical capital can brake the loop, but synchronization and funding risk can delay correction.</desc>
  <defs>
    <marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" refX="14" refY="8" orient="auto"><path d="M1 1 L15 8 L1 15 Z" fill="#b95f2d"/></marker>
    <marker id="blueArrow" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" refX="14" refY="8" orient="auto"><path d="M1 1 L15 8 L1 15 Z" fill="#25678f"/></marker>
    <marker id="brake" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto"><path d="M1 1 L13 7 L1 13 Z" fill="#447c55"/></marker>
    <filter id="shadow"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#183047" flood-opacity="0.12"/></filter>
  </defs>
  <rect width="1200" height="760" fill="#ffffff"/>
  <text x="600" y="50" text-anchor="middle" font-family="Georgia, serif" font-size="34" font-weight="700" fill="#183047">When price becomes evidence about price</text>
  <text x="600" y="82" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#607080">A genuine fundamental improvement can begin a boom; feedback can then make the path fragile.</text>

  <g font-family="Arial, sans-serif" filter="url(#shadow)">
    <rect x="45" y="170" width="225" height="130" rx="18" fill="#eaf3f8" stroke="#25678f" stroke-width="3"/>
    <text x="157" y="212" text-anchor="middle" font-size="22" font-weight="700" fill="#183047">FUNDAMENTALS</text>
    <text x="157" y="246" text-anchor="middle" font-size="16" fill="#607080">cash flows • scarcity</text>
    <text x="157" y="272" text-anchor="middle" font-size="16" fill="#607080">risk • discount rates</text>

    <rect x="430" y="135" width="300" height="115" rx="20" fill="#fff0e9" stroke="#b95f2d" stroke-width="3"/>
    <text x="580" y="179" text-anchor="middle" font-size="24" font-weight="700" fill="#183047">PRICE INCREASE</text>
    <text x="580" y="213" text-anchor="middle" font-size="17" fill="#607080">observable success</text>

    <rect x="805" y="245" width="315" height="125" rx="20" fill="#f7f1e8" stroke="#b95f2d" stroke-width="3"/>
    <text x="962" y="287" text-anchor="middle" font-size="21" font-weight="700" fill="#183047">ATTENTION + EXPECTATIONS</text>
    <text x="962" y="322" text-anchor="middle" font-size="16" fill="#607080">recent return predicts return</text>
    <text x="962" y="348" text-anchor="middle" font-size="16" fill="#607080">stories and social transmission</text>

    <rect x="660" y="470" width="315" height="125" rx="20" fill="#fff0e9" stroke="#b95f2d" stroke-width="3"/>
    <text x="817" y="512" text-anchor="middle" font-size="22" font-weight="700" fill="#183047">DEMAND + RESALE</text>
    <text x="817" y="547" text-anchor="middle" font-size="16" fill="#607080">buy now to sell higher later</text>
    <text x="817" y="573" text-anchor="middle" font-size="16" fill="#607080">entry • momentum • FOMO</text>

    <rect x="285" y="470" width="315" height="125" rx="20" fill="#f7f1e8" stroke="#b95f2d" stroke-width="3"/>
    <text x="442" y="512" text-anchor="middle" font-size="22" font-weight="700" fill="#183047">LEVERAGE + LIQUIDITY</text>
    <text x="442" y="547" text-anchor="middle" font-size="16" fill="#607080">collateral expands purchasing</text>
    <text x="442" y="573" text-anchor="middle" font-size="16" fill="#607080">cash amplifies demand</text>
  </g>

  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- Independent evidence from fundamentals enters the left side of price. -->
    <path d="M270 218 C330 211 377 190 427 177" stroke="#25678f" stroke-width="5" marker-end="url(#blueArrow)"/>
    <!-- The speculative loop enters price separately from below. -->
    <path d="M730 190 C810 185 875 210 911 243" stroke="#b95f2d" stroke-width="5" marker-end="url(#arrow)"/>
    <path d="M1000 370 C1000 415 938 455 893 468" stroke="#b95f2d" stroke-width="5" marker-end="url(#arrow)"/>
    <line x1="660" y1="533" x2="603" y2="533" stroke="#b95f2d" stroke-width="5" marker-end="url(#arrow)"/>
    <path d="M392 470 C346 395 372 292 508 252" stroke="#b95f2d" stroke-width="5" marker-end="url(#arrow)"/>
  </g>

  <text x="645" y="354" text-anchor="middle" font-family="Georgia, serif" font-size="29" font-weight="700" fill="#b95f2d">REINFORCING</text>
  <text x="645" y="388" text-anchor="middle" font-family="Georgia, serif" font-size="29" font-weight="700" fill="#b95f2d">FEEDBACK</text>
  <text x="645" y="421" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#607080">temporarily self-validating</text>

  <g font-family="Arial, sans-serif" filter="url(#shadow)">
    <rect x="80" y="650" width="1040" height="72" rx="18" fill="#edf4ed" stroke="#447c55" stroke-width="3"/>
    <text x="160" y="680" font-size="18" font-weight="700" fill="#183047">BRAKES</text>
    <text x="160" y="705" font-size="14" fill="#607080">can be delayed</text>
    <rect x="260" y="665" width="180" height="42" rx="12" fill="#ffffff" stroke="#447c55" stroke-width="2"/>
    <text x="350" y="692" text-anchor="middle" font-size="16" fill="#183047">Elastic supply</text>
    <rect x="465" y="665" width="180" height="42" rx="12" fill="#ffffff" stroke="#447c55" stroke-width="2"/>
    <text x="555" y="692" text-anchor="middle" font-size="16" fill="#183047">Short selling</text>
    <rect x="670" y="665" width="180" height="42" rx="12" fill="#ffffff" stroke="#447c55" stroke-width="2"/>
    <text x="760" y="692" text-anchor="middle" font-size="16" fill="#183047">Risk limits</text>
    <rect x="875" y="665" width="205" height="42" rx="12" fill="#ffffff" stroke="#447c55" stroke-width="2"/>
    <text x="977" y="692" text-anchor="middle" font-size="16" fill="#183047">Skeptical capital</text>
  </g>

  <path d="M555 665 C550 635 520 618 500 597" fill="none" stroke="#447c55" stroke-width="3" stroke-dasharray="8 7" marker-end="url(#brake)"/>
  <path d="M760 665 C770 635 795 620 805 598" fill="none" stroke="#447c55" stroke-width="3" stroke-dasharray="8 7" marker-end="url(#brake)"/>
  <text x="600" y="744" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#607080">Funding, shorting, model, and synchronization risk can weaken the brakes before correction.</text>
</svg>

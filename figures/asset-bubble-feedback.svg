<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
<title id="title">When price becomes evidence about price</title>
<desc id="desc">A possible reinforcing loop links rising prices, expectations of further gains, and more buying. Fundamentals influence price separately. Financing can amplify buying. Supply, short selling, and durable skeptical capital can weaken the feedback.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" markerWidth="10" markerHeight="10" refX="10" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 5 L0 10 Z" fill="#b95f2d"/></marker><marker id="blue" viewBox="0 0 10 10" markerWidth="10" markerHeight="10" refX="10" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 5 L0 10 Z" fill="#25678f"/></marker></defs>
<rect width="1200" height="760" fill="white"/>
<text x="600" y="49" text-anchor="middle" font-family="Arial, sans-serif" font-size="34" fill="#183047" font-weight="700">When price becomes evidence about price</text>
<text x="600" y="83" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#607080">A reinforcing loop links prices, expectations, and buying.</text>
<rect x="440" y="130" width="320" height="120" rx="18" fill="#fff0e9" stroke="#b95f2d" stroke-width="3"/>
<text x="600" y="174" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" fill="#183047" font-weight="700">RISING PRICES</text>
<text x="600" y="212" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#607080">The recent gain attracts attention</text>
<rect x="820" y="300" width="320" height="120" rx="18" fill="#fff0e9" stroke="#b95f2d" stroke-width="3"/>
<text x="980" y="344" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" fill="#183047" font-weight="700">EXPECTING MORE GAINS</text>
<text x="980" y="382" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#607080">Buyers extrapolate or plan to resell</text>
<rect x="440" y="480" width="320" height="120" rx="18" fill="#fff0e9" stroke="#b95f2d" stroke-width="3"/>
<text x="600" y="524" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" fill="#183047" font-weight="700">MORE BUYING</text>
<text x="600" y="562" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#607080">Demand can push the price up</text>
<rect x="40" y="145" width="265" height="120" rx="18" fill="#eaf3f8" stroke="#25678f" stroke-width="3"/>
<text x="172" y="184" text-anchor="middle" font-family="Arial, sans-serif" font-size="23" fill="#183047" font-weight="700">FUNDAMENTALS</text>
<text x="172" y="218" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" fill="#607080">Cash flows and scarcity</text>
<text x="172" y="245" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" fill="#607080">Risk and discount rates</text>
<rect x="40" y="480" width="265" height="120" rx="18" fill="#eaf3f8" stroke="#25678f" stroke-width="3"/>
<text x="172" y="518" text-anchor="middle" font-family="Arial, sans-serif" font-size="23" fill="#183047" font-weight="700">FINANCING</text>
<text x="172" y="551" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" fill="#607080">Credit or cash can</text>
<text x="172" y="577" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" fill="#607080">amplify buying</text>
<g fill="none" stroke-width="5" stroke-linecap="round">
<path d="M760 190 C965 190 980 245 980 297" stroke="#b95f2d" stroke-width="4" marker-end="url(#arrow)"/>
<path d="M980 420 C980 540 845 540 763 540" stroke="#b95f2d" stroke-width="4" marker-end="url(#arrow)"/>
<path d="M440 540 C325 510 320 302 477 252" stroke="#b95f2d" stroke-width="4" marker-end="url(#arrow)"/>
<path d="M305 203 L437 191" stroke="#25678f" stroke-width="4" marker-end="url(#blue)"/>
<path d="M305 571 C355 639 461 650 536 603" stroke="#25678f" stroke-width="4" stroke-dasharray="8 7" marker-end="url(#blue)"/>
</g>
<text x="602" y="351" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" fill="#b95f2d" font-weight="700">REINFORCING</text>
<text x="602" y="388" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" fill="#b95f2d" font-weight="700">FEEDBACK</text>
<rect x="70" y="665" width="1060" height="67" rx="18" fill="#edf4ed" stroke="#447c55" stroke-width="3"/>
<text x="600" y="693" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" fill="#183047" font-weight="700">Possible brakes: more supply · short selling · risk limits · skeptical capital</text>
<text x="600" y="721" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#607080">Correction can be delayed by funding constraints and uncertainty about when others will act.</text>
</svg>

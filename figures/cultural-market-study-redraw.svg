<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Social influence increased unpredictability in the Music Lab experiments</title>
  <desc id="desc">Two equal-size comparison cards state the published direction: social-influence conditions had greater cross-world unpredictability than independent-choice benchmarks in both experiments. No bar heights or effect sizes are implied. The panel also reports the study's comparison procedure and participant counts.</desc>
  <rect width="1200" height="760" fill="#ffffff"/>
  <text x="600" y="48" text-anchor="middle" font-family="Arial, sans-serif" font-size="33" font-weight="700" fill="#17324d">Popularity can help produce the outcome it appears to report</text>

  <rect x="45" y="112" width="660" height="570" rx="18" fill="#f7fafc" stroke="#c8d7e2" stroke-width="2"/>
  <text x="375" y="151" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#17324d">How much did the worlds diverge?</text>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <rect x="85" y="205" width="580" height="165" rx="16" fill="#ffffff" stroke="#2f6f9f" stroke-width="2"/>
    <text x="375" y="243" font-size="24" font-weight="700" fill="#17324d">Experiment 1 · N = 7,149</text>
    <text x="375" y="288" font-size="22" fill="#17324d">More variation across social worlds</text>
    <text x="375" y="323" font-size="20" fill="#66737f">than across independent-choice samples</text>
    <rect x="85" y="400" width="580" height="165" rx="16" fill="#ffffff" stroke="#2f6f9f" stroke-width="2"/>
    <text x="375" y="438" font-size="24" font-weight="700" fill="#17324d">Experiment 2 · N = 7,192</text>
    <text x="375" y="483" font-size="22" fill="#17324d">The same direction of difference</text>
    <text x="375" y="518" font-size="20" fill="#66737f">with popularity made more visible</text>
    <text x="375" y="619" font-size="19" fill="#17324d">Direction of the result; no effect size plotted</text>
    <text x="375" y="651" font-size="18" fill="#66737f">Salganik, Dodds, and Watts (2006)</text>
  </g>

  <rect x="735" y="112" width="420" height="570" rx="18" fill="#f7f1e8" stroke="#c56a2d" stroke-width="2"/>
  <text x="945" y="151" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#17324d">How to read the comparison</text>

  <rect x="775" y="180" width="340" height="110" rx="14" fill="#ffffff" stroke="#2f6f9f" stroke-width="2"/>
  <text x="800" y="211" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#2f6f9f">1  Social worlds</text>
  <text x="800" y="239" font-family="Arial, sans-serif" font-size="16" fill="#17324d">8 worlds → 28 world-pair comparisons,</text>
  <text x="800" y="263" font-family="Arial, sans-serif" font-size="16" fill="#17324d">averaged across the same 48 songs.</text>

  <rect x="775" y="310" width="340" height="110" rx="14" fill="#ffffff" stroke="#447c55" stroke-width="2"/>
  <text x="800" y="341" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#447c55">2  Independent benchmark</text>
  <text x="800" y="369" font-family="Arial, sans-serif" font-size="16" fill="#17324d">Unpredictability was estimated from</text>
  <text x="800" y="393" font-family="Arial, sans-serif" font-size="16" fill="#17324d">1,000 random splits of the choices.</text>

  <rect x="775" y="440" width="340" height="158" rx="14" fill="#ffffff" stroke="#c56a2d" stroke-width="2"/>
  <text x="800" y="471" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#c56a2d">3  Participant denominators</text>
  <text x="800" y="502" font-family="Arial, sans-serif" font-size="16" fill="#17324d">Experiment 1: 5,708 social +</text>
  <text x="800" y="526" font-family="Arial, sans-serif" font-size="16" fill="#17324d">1,441 independent = 7,149 total</text>
  <text x="800" y="558" font-family="Arial, sans-serif" font-size="16" fill="#17324d">Experiment 2: 5,746 social +</text>
  <text x="800" y="582" font-family="Arial, sans-serif" font-size="16" fill="#17324d">1,446 independent = 7,192 total</text>

  <rect x="780" y="620" width="330" height="42" rx="12" fill="#edf4ed" stroke="#447c55" stroke-width="2"/>
  <text x="945" y="647" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#17324d">Same songs, more path dependence</text>

</svg>

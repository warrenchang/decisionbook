<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="510" viewBox="0 90 1200 510" role="img" aria-labelledby="title desc">
  <title id="title">Social influence increased unpredictability in the Music Lab experiments</title>
  <desc id="desc">Two equal-size comparison cards state the published direction: social-influence conditions had greater cross-world unpredictability than independent-choice benchmarks in both experiments. No bar heights or effect sizes are implied. The panel also reports the study's comparison procedure and participant counts.</desc>
  <rect width="1200" height="630" fill="#ffffff" x="0" y="90"/>
  <rect x="45" y="112" width="660" height="466" rx="18" fill="#f7fafc" stroke="#c8d7e2" stroke-width="2"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <rect x="85" y="165" width="580" height="165" rx="16" fill="#ffffff" stroke="#2f6f9f" stroke-width="2"/>
    <text x="375" y="203" font-size="24" font-weight="700" fill="#17324d">Experiment 1 · N = 7,149</text>
    <text x="375" y="248" font-size="22" fill="#17324d">More variation across social worlds</text>
    <text x="375" y="283" font-size="20" fill="#66737f">than across independent-choice samples</text>
    <rect x="85" y="360" width="580" height="165" rx="16" fill="#ffffff" stroke="#2f6f9f" stroke-width="2"/>
    <text x="375" y="398" font-size="24" font-weight="700" fill="#17324d">Experiment 2 · N = 7,192</text>
    <text x="375" y="443" font-size="22" fill="#17324d">The same direction of difference</text>
    <text x="375" y="478" font-size="20" fill="#66737f">with popularity made more visible</text>
    </g>

  <rect x="735" y="112" width="420" height="466" rx="18" fill="#f7f1e8" stroke="#c56a2d" stroke-width="2"/>
  <rect x="775" y="140" width="340" height="110" rx="14" fill="#ffffff" stroke="#2f6f9f" stroke-width="2"/>
  <text x="800" y="171" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#2f6f9f">1  Social worlds see download counts</text>
  <text x="800" y="199" font-family="Arial, sans-serif" font-size="16" fill="#17324d">8 worlds → 28 world-pair comparisons,</text>
  <text x="800" y="223" font-family="Arial, sans-serif" font-size="16" fill="#17324d">averaged across the same 48 songs.</text>

  <rect x="775" y="270" width="340" height="110" rx="14" fill="#ffffff" stroke="#447c55" stroke-width="2"/>
  <text x="800" y="301" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#447c55">2  No download counts shown</text>
  <text x="800" y="329" font-family="Arial, sans-serif" font-size="16" fill="#17324d">Unpredictability was estimated from</text>
  <text x="800" y="353" font-family="Arial, sans-serif" font-size="16" fill="#17324d">1,000 random splits of the choices.</text>

  <rect x="775" y="400" width="340" height="158" rx="14" fill="#ffffff" stroke="#c56a2d" stroke-width="2"/>
  <text x="800" y="431" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#c56a2d">3  Participant denominators</text>
  <text x="800" y="462" font-family="Arial, sans-serif" font-size="16" fill="#17324d">Experiment 1: 5,708 social +</text>
  <text x="800" y="486" font-family="Arial, sans-serif" font-size="16" fill="#17324d">1,441 independent = 7,149 total</text>
  <text x="800" y="518" font-family="Arial, sans-serif" font-size="16" fill="#17324d">Experiment 2: 5,746 social +</text>
  <text x="800" y="542" font-family="Arial, sans-serif" font-size="16" fill="#17324d">1,446 independent = 7,192 total</text>

  </svg>
<?xml version="1.0" encoding="utf-8" ?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink" baseProfile="full" height="650" version="1.1" viewBox="0 0 1200 650" width="1200">
  <defs/>
  <title>Social learning and cumulative culture</title>
  <desc>People observe, imitate, coordinate, teach, and preserve practices, producing cumulative culture; the same pathway can copy errors and obsolete rituals.</desc>
  <rect fill="white" height="650" width="1200" x="0" y="0"/>
  <text fill="#17324d" font-family="Arial, sans-serif" font-size="34" font-weight="bold" text-anchor="middle" x="600" y="48">Social learning turns individual experience into cumulative culture</text>
  <rect fill="#eaf3f8" height="115" rx="16" ry="16" stroke="#2f6f9f" stroke-width="3" width="180" x="50" y="220"/>
  <text fill="#17324d" font-family="Arial, sans-serif" font-size="26" font-weight="bold" text-anchor="middle" x="140.0" y="269.5">Observe</text>
  <text fill="#66737f" font-family="Arial, sans-serif" font-size="17" font-weight="normal" text-anchor="middle" x="140.0" y="303.5">others become evidence</text>
  <rect fill="#eaf3f8" height="115" rx="16" ry="16" stroke="#2f6f9f" stroke-width="3" width="180" x="280" y="220"/>
  <text fill="#17324d" font-family="Arial, sans-serif" font-size="26" font-weight="bold" text-anchor="middle" x="370.0" y="269.5">Imitate</text>
  <text fill="#66737f" font-family="Arial, sans-serif" font-size="17" font-weight="normal" text-anchor="middle" x="370.0" y="303.5">actions and conventions</text>
  <rect fill="#eaf3f8" height="115" rx="16" ry="16" stroke="#2f6f9f" stroke-width="3" width="180" x="510" y="220"/>
  <text fill="#17324d" font-family="Arial, sans-serif" font-size="26" font-weight="bold" text-anchor="middle" x="600.0" y="269.5">Coordinate</text>
  <text fill="#66737f" font-family="Arial, sans-serif" font-size="17" font-weight="normal" text-anchor="middle" x="600.0" y="303.5">shared expectations</text>
  <rect fill="#f7f1e8" height="115" rx="16" ry="16" stroke="#c56a2d" stroke-width="3" width="180" x="740" y="220"/>
  <text fill="#17324d" font-family="Arial, sans-serif" font-size="26" font-weight="bold" text-anchor="middle" x="830.0" y="269.5">Teach + preserve</text>
  <text fill="#66737f" font-family="Arial, sans-serif" font-size="17" font-weight="normal" text-anchor="middle" x="830.0" y="303.5">high-fidelity transmission</text>
  <rect fill="#f7f1e8" height="115" rx="16" ry="16" stroke="#c56a2d" stroke-width="3" width="180" x="970" y="220"/>
  <text fill="#17324d" font-family="Arial, sans-serif" font-size="26" font-weight="bold" text-anchor="middle" x="1060.0" y="269.5">Cumulative culture</text>
  <text fill="#66737f" font-family="Arial, sans-serif" font-size="17" font-weight="normal" text-anchor="middle" x="1060.0" y="303.5">tools • norms • institutions</text>
  <line stroke="#17324d" stroke-width="4" x1="230" x2="280" y1="277" y2="277"/>
  <polygon fill="#17324d" points="280,277 267.0096189432334,284.5 267.0096189432334,269.5"/>
  <line stroke="#17324d" stroke-width="4" x1="460" x2="510" y1="277" y2="277"/>
  <polygon fill="#17324d" points="510,277 497.0096189432334,284.5 497.0096189432334,269.5"/>
  <line stroke="#17324d" stroke-width="4" x1="690" x2="740" y1="277" y2="277"/>
  <polygon fill="#17324d" points="740,277 727.0096189432334,284.5 727.0096189432334,269.5"/>
  <line stroke="#17324d" stroke-width="4" x1="920" x2="970" y1="277" y2="277"/>
  <polygon fill="#17324d" points="970,277 957.0096189432334,284.5 957.0096189432334,269.5"/>
  <rect fill="#f9e7e7" height="100" rx="16" ry="16" stroke="#a74343" stroke-width="3" width="440" x="380" y="445"/>
  <text fill="#17324d" font-family="Arial, sans-serif" font-size="26" font-weight="bold" text-anchor="middle" x="600.0" y="487.0">Risk of copied error</text>
  <text fill="#66737f" font-family="Arial, sans-serif" font-size="17" font-weight="normal" text-anchor="middle" x="600.0" y="521.0">prestige without expertise • cascades • ritual without function</text>
  <line stroke="#a74343" stroke-width="4" x1="600" x2="600" y1="335" y2="445"/>
  <polygon fill="#a74343" points="600,445 592.5,432.0096189432334 607.5,432.0096189432334"/>
  <text fill="#66737f" font-family="Arial, sans-serif" font-size="21" font-weight="normal" text-anchor="middle" x="600" y="590">The right question is not “Did others do it?” but “What information made their behavior worth copying?”</text>
</svg>

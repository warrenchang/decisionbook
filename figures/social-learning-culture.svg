<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" baseProfile="full" height="650" version="1.1" viewBox="0 0 1200 650" width="1200">
  <defs />
  <title>Social learning and cumulative culture</title>
  <desc>People observe, imitate, coordinate, teach, and preserve practices, producing cumulative culture; the same pathway can copy errors and obsolete rituals.</desc>
  <rect fill="white" height="650" width="1200" x="0" y="0" />
  <text fill="#17324d" font-family="Arial, sans-serif" font-size="31" font-weight="bold" text-anchor="middle" x="600" y="48">Social learning turns individual experience into cumulative culture</text>
  <rect fill="#eaf3f8" height="115" rx="16" ry="16" stroke="#2f6f9f" stroke-width="3" width="180" x="50" y="220" />
  <text fill="#17324d" font-family="Arial, sans-serif" font-size="26" font-weight="bold" text-anchor="middle" x="140" y="261.44"><tspan x="140" dy="0">Observe</tspan></text>
  <text fill="#66737f" font-family="Arial, sans-serif" font-size="17" font-weight="normal" text-anchor="middle" x="140" y="289.56"><tspan x="140" dy="0">others become</tspan><tspan x="140" dy="20.06">evidence</tspan></text>
  <rect fill="#eaf3f8" height="115" rx="16" ry="16" stroke="#2f6f9f" stroke-width="3" width="180" x="280" y="220" />
  <text fill="#17324d" font-family="Arial, sans-serif" font-size="26" font-weight="bold" text-anchor="middle" x="370" y="261.44"><tspan x="370" dy="0">Imitate</tspan></text>
  <text fill="#66737f" font-family="Arial, sans-serif" font-size="17" font-weight="normal" text-anchor="middle" x="370" y="289.56"><tspan x="370" dy="0">actions and</tspan><tspan x="370" dy="20.06">conventions</tspan></text>
  <rect fill="#eaf3f8" height="115" rx="16" ry="16" stroke="#2f6f9f" stroke-width="3" width="180" x="510" y="220" />
  <text fill="#17324d" font-family="Arial, sans-serif" font-size="26" font-weight="bold" text-anchor="middle" x="600" y="261.44"><tspan x="600" dy="0">Coordinate</tspan></text>
  <text fill="#66737f" font-family="Arial, sans-serif" font-size="17" font-weight="normal" text-anchor="middle" x="600" y="289.56"><tspan x="600" dy="0">shared</tspan><tspan x="600" dy="20.06">expectations</tspan></text>
  <rect fill="#f7f1e8" height="115" rx="16" ry="16" stroke="#c56a2d" stroke-width="3" width="180" x="740" y="220" />
  <text fill="#17324d" font-family="Arial, sans-serif" font-size="23.69" font-weight="bold" text-anchor="middle" x="830" y="248.896"><tspan x="830" dy="0">Teach +</tspan><tspan x="830" dy="27.9485">preserve</tspan></text>
  <text fill="#66737f" font-family="Arial, sans-serif" font-size="16" font-weight="normal" text-anchor="middle" x="830" y="302.906"><tspan x="830" dy="0">high-fidelity</tspan><tspan x="830" dy="18.274">transmission</tspan></text>
  <rect fill="#f7f1e8" height="115" rx="16" ry="16" stroke="#c56a2d" stroke-width="3" width="180" x="970" y="220" />
  <text fill="#17324d" font-family="Arial, sans-serif" font-size="23.69" font-weight="bold" text-anchor="middle" x="1060" y="248.896"><tspan x="1060" dy="0">Cumulative</tspan><tspan x="1060" dy="27.9485">culture</tspan></text>
  <text fill="#66737f" font-family="Arial, sans-serif" font-size="16" font-weight="normal" text-anchor="middle" x="1060" y="302.906"><tspan x="1060" dy="0">tools • norms •</tspan><tspan x="1060" dy="18.274">institutions</tspan></text>
  <line stroke="#17324d" stroke-width="4" x1="230" x2="280" y1="277" y2="277" />
  <polygon fill="#17324d" points="280,277 267.0096189432334,284.5 267.0096189432334,269.5" />
  <line stroke="#17324d" stroke-width="4" x1="460" x2="510" y1="277" y2="277" />
  <polygon fill="#17324d" points="510,277 497.0096189432334,284.5 497.0096189432334,269.5" />
  <line stroke="#17324d" stroke-width="4" x1="690" x2="740" y1="277" y2="277" />
  <polygon fill="#17324d" points="740,277 727.0096189432334,284.5 727.0096189432334,269.5" />
  <line stroke="#17324d" stroke-width="4" x1="920" x2="970" y1="277" y2="277" />
  <polygon fill="#17324d" points="970,277 957.0096189432334,284.5 957.0096189432334,269.5" />
  <rect fill="#f9e7e7" height="100" rx="16" ry="16" stroke="#a74343" stroke-width="3" width="440" x="380" y="445" />
  <text fill="#17324d" font-family="Arial, sans-serif" font-size="26" font-weight="bold" text-anchor="middle" x="600" y="478.94"><tspan x="600" dy="0">Risk of copied error</tspan></text>
  <text fill="#66737f" font-family="Arial, sans-serif" font-size="17" font-weight="normal" text-anchor="middle" x="600" y="507.06"><tspan x="600" dy="0">prestige without expertise • cascades •</tspan><tspan x="600" dy="20.06">ritual without function</tspan></text>
  <line stroke="#a74343" stroke-width="4" x1="600" x2="600" y1="335" y2="445" />
  <polygon fill="#a74343" points="600,445 592.5,432.0096189432334 607.5,432.0096189432334" />
  <text fill="#66737f" font-family="Arial, sans-serif" font-size="21" font-weight="normal" text-anchor="middle" x="600" y="590">The right question is not “Did others do it?” but “What information made their behavior worth copying?”</text>
</svg>

<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">Informational and normative influence are distinct pathways</title>
  <desc id="desc">Others' public actions feed two parallel routes. In the informational route, actions are treated as evidence and may update private belief and action, producing an informational cascade without a dissent cost. In the normative route, anticipated approval or sanction produces public conformity even when private belief does not change. Both can create more public actions. Independent private elicitation can interrupt correlated social evidence and conformity pressure.</desc>
  <defs>
    <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="8.5" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1,1 L8.5,5 L1,9 Z" fill="#2f6f9f"/></marker>
    <marker id="arrow-orange" markerWidth="10" markerHeight="10" refX="8.5" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1,1 L8.5,5 L1,9 Z" fill="#bf682d"/></marker>
    <marker id="arrow-gray" markerWidth="10" markerHeight="10" refX="8.5" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1,1 L8.5,5 L1,9 Z" fill="#47647e"/></marker>
  </defs>
  <rect width="1200" height="700" fill="#ffffff"/>
  <rect x="1.5" y="1.5" width="1197" height="697" rx="28" fill="none" stroke="#d5e1ea" stroke-width="3"/>
  <text x="600" y="48" text-anchor="middle" font-family="Arial, sans-serif" font-size="34" font-weight="700" fill="#17324d">Two routes from public behavior to more public behavior</text>
  <text x="600" y="80" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#586d80">Informational inference and normative pressure can interact, but neither requires the other.</text>

  <rect x="405" y="112" width="390" height="84" rx="19" fill="#183047"/>
  <text x="600" y="146" text-anchor="middle" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#ffffff">OTHERS' PUBLIC ACTIONS</text>
  <text x="600" y="175" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="#dbe8f0">observable choices, statements, ratings, or silence</text>

  <!-- Informational route -->
  <text x="315" y="235" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#2f6f9f">INFORMATIONAL ROUTE</text>
  <rect x="65" y="260" width="250" height="112" rx="18" fill="#e5f1f7" stroke="#2f6f9f" stroke-width="3"/>
  <text x="190" y="300" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#17324d">INFER EVIDENCE</text>
  <text x="190" y="337" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="#586d80">“They may know more.”</text>
  <rect x="365" y="260" width="250" height="112" rx="18" fill="#eef4f8" stroke="#7892a8" stroke-width="3"/>
  <text x="490" y="299" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#17324d">UPDATE BELIEF</text>
  <text x="490" y="328" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#17324d">OR ACTION</text>
  <text x="490" y="354" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#586d80">private signal may be overridden</text>
  <path d="M315 316 H365" fill="none" stroke="#2f6f9f" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow-blue)"/>

  <!-- Normative route -->
  <text x="885" y="235" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#bf682d">NORMATIVE ROUTE</text>
  <rect x="665" y="260" width="250" height="112" rx="18" fill="#fff5ec" stroke="#bf682d" stroke-width="3"/>
  <text x="790" y="299" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#17324d">ANTICIPATE APPROVAL</text>
  <text x="790" y="328" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#17324d">OR SANCTION</text>
  <text x="790" y="354" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#586d80">belonging • status • conflict</text>
  <rect x="965" y="260" width="170" height="112" rx="18" fill="#f8f1e7" stroke="#bf682d" stroke-width="3"/>
  <text x="1050" y="299" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#17324d">PUBLIC</text>
  <text x="1050" y="326" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#17324d">CONFORMITY</text>
  <text x="1050" y="353" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#586d80">belief need not change</text>
  <path d="M915 316 H965" fill="none" stroke="#bf682d" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow-orange)"/>

  <!-- Split from public action -->
  <path d="M530 196 V205 H190 V260" fill="none" stroke="#2f6f9f" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-blue)"/>
  <path d="M670 196 V205 H790 V260" fill="none" stroke="#bf682d" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-orange)"/>

  <rect x="330" y="425" width="540" height="82" rx="19" fill="#f2f5f8" stroke="#7892a8" stroke-width="3"/>
  <text x="600" y="458" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#17324d">MORE PUBLIC ACTIONS</text>
  <text x="600" y="486" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="#586d80">apparent consensus can grow even when observations are correlated</text>
  <path d="M490 372 V405 H500 V425" fill="none" stroke="#2f6f9f" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-blue)"/>
  <path d="M1050 372 V405 H700 V425" fill="none" stroke="#bf682d" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-orange)"/>
  <path d="M870 466 H1162 V154 H795" fill="none" stroke="#47647e" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-gray)"/>

  <rect x="150" y="555" width="900" height="86" rx="19" fill="#eaf4ec" stroke="#3f7c59" stroke-width="3"/>
  <text x="600" y="587" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#315f45">PRESERVE INDEPENDENCE BEFORE DISCUSSION</text>
  <text x="600" y="617" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="#586d80">private estimates • anonymous input • evidence provenance • protected dissent • an ally for the first dissenter</text>
  <text x="600" y="674" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#647586">Author's teaching synthesis: an informational cascade can occur without dissent cost; normative conformity can occur without belief revision.</text>
</svg>

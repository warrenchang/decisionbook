<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="690" viewBox="0 0 1200 690" role="img" aria-labelledby="title desc">
  <title id="title">An original illustration of a choice-blindness switch</title>
  <desc id="desc">An illustrative three-stage sequence shows a person choosing one of two abstract cards, a covert switch during handling, and the other card being presented as the chosen option with a request for reasons.</desc>
  <defs>
    <pattern id="stripes" width="16" height="16" patternUnits="userSpaceOnUse" patternTransform="rotate(35)"><rect width="8" height="16" fill="#2d7fab"/><rect x="8" width="8" height="16" fill="#dceef5"/></pattern>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><rect width="22" height="22" fill="#f8e4dc"/><circle cx="11" cy="11" r="5" fill="#c44e52"/></pattern>
    <marker id="arrow" viewBox="0 0 10 8" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0.5,0.8 L9,4 L0.5,7.2 z" fill="#587189"/></marker>
    <marker id="arrow-accent" viewBox="0 0 10 8" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0.5,0.8 L9,4 L0.5,7.2 z" fill="#c44e52"/></marker>
  </defs>
  <style>
    .title{font:700 34px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#183047}
    .sub{font:500 19px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#52677a}
    .step{font:700 22px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#183047}
    .label{font:650 18px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#314b61}
    .small{font:500 16px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#52677a}
    .quote{font:650 20px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#314b61}
  </style>
  <rect x="18" y="18" width="1164" height="654" rx="28" fill="#f7f9fc" stroke="#9fb2c3" stroke-width="2"/>
  <text x="600" y="66" class="title" text-anchor="middle">WHEN THE OUTCOME IS PRESENTED AS “YOUR CHOICE”</text>
  <text x="600" y="101" class="sub" text-anchor="middle">An illustrative switch shows why a fluent reason need not recover the cause of the original choice.</text>

  <rect x="54" y="137" width="320" height="420" rx="22" fill="#ffffff" stroke="#bfd0dd" stroke-width="2"/>
  <text x="214" y="178" class="step" text-anchor="middle">1  CHOOSE</text>
  <rect x="91" y="223" width="110" height="162" rx="14" fill="url(#stripes)" stroke="#175b7e" stroke-width="3"/>
  <rect x="227" y="223" width="110" height="162" rx="14" fill="url(#dots)" stroke="#a94448" stroke-width="3"/>
  <circle cx="146" cy="414" r="17" fill="#2f8a52"/><path d="M137 414 L144 421 L157 406" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="146" y="453" class="label" text-anchor="middle">selected</text>
  <text x="282" y="453" class="label" text-anchor="middle">rejected</text>
  <text x="214" y="511" class="small" text-anchor="middle">The original preference is recorded.</text>

  <path d="M386 347 H416" stroke="#587189" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/>

  <rect x="424" y="137" width="352" height="420" rx="22" fill="#ffffff" stroke="#bfd0dd" stroke-width="2"/>
  <text x="600" y="178" class="step" text-anchor="middle">2  HANDLE AND SWITCH</text>
  <g transform="rotate(-7 510 305)"><rect x="455" y="224" width="110" height="162" rx="14" fill="url(#stripes)" stroke="#175b7e" stroke-width="3"/></g>
  <g transform="rotate(7 690 305)"><rect x="635" y="224" width="110" height="162" rx="14" fill="url(#dots)" stroke="#a94448" stroke-width="3"/></g>
  <path d="M564.6 298.3 H635.4" fill="none" stroke="#c44e52" stroke-width="4" stroke-dasharray="8 7" stroke-linecap="round" marker-start="url(#arrow-accent)" marker-end="url(#arrow-accent)"/>
  <text x="600" y="431" class="label" text-anchor="middle">covert swap</text>
  <text x="600" y="474" class="small" text-anchor="middle">The manipulation is hidden from the chooser.</text>

  <path d="M788 347 H818" stroke="#587189" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/>

  <rect x="826" y="137" width="320" height="420" rx="22" fill="#ffffff" stroke="#bfd0dd" stroke-width="2"/>
  <text x="986" y="178" class="step" text-anchor="middle">3  EXPLAIN</text>
  <rect x="931" y="215" width="110" height="162" rx="14" fill="url(#dots)" stroke="#a94448" stroke-width="3"/>
  <rect x="865" y="410" width="242" height="62" rx="20" fill="#e9f2f7" stroke="#9fbfd0"/>
  <text x="986" y="437" class="quote" text-anchor="middle">“Why did you choose</text>
  <text x="986" y="462" class="quote" text-anchor="middle">this one?”</text>
  <text x="986" y="503" class="small" text-anchor="middle">Some switches are detected;</text>
  <text x="986" y="525" class="small" text-anchor="middle">some are not.</text>

  <rect x="118" y="591" width="964" height="45" rx="22" fill="#f8e4dc" stroke="#d8a69e"/>
  <text x="600" y="620" class="label" text-anchor="middle">Choice-blindness findings bound introspection; they do not show that reasons are always false.</text>
</svg>

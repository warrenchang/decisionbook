<svg xmlns="http://www.w3.org/2000/svg" width="640" height="900" viewBox="0 0 640 900" role="img" aria-labelledby="title desc">
  <title id="title">Choice blindness with faces</title>
  <desc id="desc">Three stages using two fictional illustrated portraits. Face A is selected and face B rejected. A covert exchange substitutes B for A. The participant sees B and is asked why they chose that face. The schematic illustrates an unnoticed switch, not original experimental stimuli or measured detection rates.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M1 1 L9 5 L1 9 Z" fill="#587189"/></marker>
    <marker id="swap" viewBox="0 0 10 10" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M1 1 L9 5 L1 9 Z" fill="#a94448"/></marker>
    <clipPath id="portrait-clip"><rect width="130" height="156" rx="12"/></clipPath>
    <g id="face-a">
      <rect width="130" height="156" rx="12" fill="#eef2f5"/>
      <g clip-path="url(#portrait-clip)">
        <path d="M25 106 Q12 19 63 14 Q116 12 108 112 L92 135 L35 133Z" fill="#42332f"/>
        <path d="M9 159 Q16 124 48 119 L82 119 Q115 124 123 159Z" fill="#597e91"/>
        <path d="M51 103 L51 124 Q65 139 79 124 L79 103Z" fill="#dbac8d"/>
        <ellipse cx="65" cy="69" rx="34" ry="45" fill="#e6bea0"/>
        <path d="M29 62 Q24 19 66 19 Q101 19 103 56 Q77 45 61 31 Q51 53 29 62Z" fill="#42332f"/>
        <path d="M42 63 Q49 59 56 63 M74 63 Q82 59 88 63" stroke="#59413a" stroke-width="2.5" fill="none" stroke-linecap="round"/>
        <ellipse cx="49" cy="71" rx="3" ry="3.5" fill="#35414a"/><ellipse cx="81" cy="71" rx="3" ry="3.5" fill="#35414a"/>
        <path d="M64 74 L61 86 Q65 89 69 86" stroke="#bd896e" stroke-width="2" fill="none" stroke-linecap="round"/>
        <path d="M53 97 Q65 104 77 97" stroke="#a25f59" stroke-width="2.5" fill="none" stroke-linecap="round"/>
      </g>
    </g>
    <g id="face-b">
      <rect width="130" height="156" rx="12" fill="#eef2f5"/>
      <g clip-path="url(#portrait-clip)">
        <path d="M25 113 Q14 85 22 51 Q26 10 66 13 Q112 14 110 64 L111 116 Q91 128 81 116 L45 116Z" fill="#a56b3e"/>
        <path d="M9 159 Q16 124 48 119 L82 119 Q115 124 123 159Z" fill="#597e91"/>
        <path d="M51 103 L51 124 Q65 139 79 124 L79 103Z" fill="#dbac8d"/>
        <ellipse cx="65" cy="70" rx="33" ry="44" fill="#e6bea0"/>
        <path d="M29 66 Q23 17 68 20 Q105 23 104 65 L90 51 L87 39 L77 51 L67 40 L57 51 L44 41 Q43 58 29 66Z" fill="#a56b3e"/>
        <path d="M42 64 Q49 61 56 64 M74 64 Q82 61 88 64" stroke="#865433" stroke-width="2.5" fill="none" stroke-linecap="round"/>
        <ellipse cx="49" cy="72" rx="3" ry="3.5" fill="#35414a"/><ellipse cx="81" cy="72" rx="3" ry="3.5" fill="#35414a"/>
        <path d="M65 75 L62 87 Q66 89 70 86" stroke="#bd896e" stroke-width="2" fill="none" stroke-linecap="round"/>
        <path d="M54 97 Q65 103 76 97" stroke="#a25f59" stroke-width="2.5" fill="none" stroke-linecap="round"/>
      </g>
    </g>
  </defs>
  <style>
    text{font-family:Arial,Helvetica,sans-serif;fill:#183047}
    .step{font-size:26px;font-weight:700}
    .label{font-size:24px;font-weight:600}
    .note{font-size:23px;fill:#52677a}
    .panel{fill:#fff;stroke:#bfd0dd;stroke-width:2}
  </style>
  <rect x="16" y="12" width="608" height="264" rx="18" class="panel"/>
  <text x="320" y="51" class="step" text-anchor="middle">1  CHOOSE A FACE</text>
  <use href="#face-a" x="105" y="77"/><rect x="105" y="77" width="130" height="156" rx="12" fill="none" stroke="#8197a8" stroke-width="2"/><use href="#face-b" x="405" y="77"/><rect x="405" y="77" width="130" height="156" rx="12" fill="none" stroke="#8197a8" stroke-width="2"/>
  <text x="170" y="260" class="label" text-anchor="middle">A · selected</text>
  <text x="470" y="260" class="label" text-anchor="middle">B · rejected</text>
  <path d="M320 276 V310" stroke="#587189" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="16" y="310" width="608" height="264" rx="18" class="panel"/>
  <text x="320" y="350" class="step" text-anchor="middle">2  COVERTLY SWITCH THE CARDS</text>
  <use href="#face-a" x="105" y="376"/><rect x="105" y="376" width="130" height="156" rx="12" fill="none" stroke="#8197a8" stroke-width="2"/><use href="#face-b" x="405" y="376"/><rect x="405" y="376" width="130" height="156" rx="12" fill="none" stroke="#8197a8" stroke-width="2"/>
  <path d="M235 454 H405" stroke="#a94448" stroke-width="3" stroke-dasharray="7 6" marker-start="url(#swap)" marker-end="url(#swap)"/>
  <text x="170" y="560" class="label" text-anchor="middle">A</text>
  <text x="470" y="560" class="label" text-anchor="middle">B</text>
  <path d="M320 574 V608" stroke="#587189" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="16" y="608" width="608" height="278" rx="18" class="panel"/>
  <text x="320" y="648" class="step" text-anchor="middle">3  EXPLAIN THE APPARENT CHOICE</text>
  <use href="#face-b" x="105" y="675"/><rect x="105" y="675" width="130" height="156" rx="12" fill="none" stroke="#8197a8" stroke-width="2"/>
  <rect x="282" y="698" width="310" height="110" rx="16" fill="#e9f2f7" stroke="#9fbfd0"/>
  <text x="437" y="739" class="label" text-anchor="middle">“Why did you choose</text>
  <text x="437" y="775" class="label" text-anchor="middle">this face?”</text>
  <text x="170" y="861" class="label" text-anchor="middle">B · returned</text>
</svg>

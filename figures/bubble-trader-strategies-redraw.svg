<svg xmlns="http://www.w3.org/2000/svg" width="790" height="575" viewBox="40 95 790 575" role="img" aria-labelledby="title desc">
  <title id="title">Strategy shares in an experimental asset market</title>
  <desc id="desc">A horizontal bar chart shows feedback or momentum-consistent behavior at 36.5 percent, passive or fundamental-value-consistent behavior at 33.1 percent, speculator or next-price-consistent behavior at 25.4 percent, and other or unclassified behavior at 4.9 percent. Shares refer to 162 rule-based trader classifications, with fractional allocation of ties.</desc>
  <defs>
    <marker id="blueArrow" viewBox="0 0 10 8" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0.5 0.8 L9 4 L0.5 7.2 Z" fill="#2f6f9f"/></marker>
    <marker id="orangeArrow" viewBox="0 0 10 8" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0.5 0.8 L9 4 L0.5 7.2 Z" fill="#c56a2d"/></marker>
    <filter id="shadow"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#17324d" flood-opacity="0.12"/></filter>
  </defs>
  <rect width="790" height="575" fill="#ffffff" x="40" y="95"/>
<rect x="55" y="112" width="760" height="540" rx="18" fill="#f7fafc" stroke="#c8d7e2" stroke-width="2"/>
<text x="285" y="198" text-anchor="end" font-family="Arial, sans-serif" font-size="17.0" font-weight="700" fill="#17324d">Feedback / momentum</text>
<text x="285" y="219" text-anchor="end" font-family="Arial, sans-serif" font-size="17.0" font-weight="700" fill="#17324d">consistent</text>
<rect x="315" y="175" width="396.9" height="52" rx="8" fill="#c56a2d"/>
<text x="725.9375" y="209" text-anchor="start" font-family="Arial, sans-serif" font-size="22.0" font-weight="700" fill="#c56a2d">36.5%</text>
<text x="285" y="306" text-anchor="end" font-family="Arial, sans-serif" font-size="17.0" font-weight="700" fill="#17324d">Passive / fundamental</text>
<text x="285" y="327" text-anchor="end" font-family="Arial, sans-serif" font-size="17.0" font-weight="700" fill="#17324d">value consistent</text>
<rect x="315" y="283" width="360.0" height="52" rx="8" fill="#2f6f9f"/>
<text x="688.9625" y="317" text-anchor="start" font-family="Arial, sans-serif" font-size="22.0" font-weight="700" fill="#2f6f9f">33.1%</text>
<text x="285" y="414" text-anchor="end" font-family="Arial, sans-serif" font-size="17.0" font-weight="700" fill="#17324d">Speculator / next-price</text>
<text x="285" y="435" text-anchor="end" font-family="Arial, sans-serif" font-size="17.0" font-weight="700" fill="#17324d">consistent</text>
<rect x="315" y="391" width="276.2" height="52" rx="8" fill="#447c55"/>
<text x="605.225" y="425" text-anchor="start" font-family="Arial, sans-serif" font-size="22.0" font-weight="700" fill="#447c55">25.4%</text>
<text x="285" y="522" text-anchor="end" font-family="Arial, sans-serif" font-size="17.0" font-weight="700" fill="#17324d">Other / unclassified</text>
<rect x="315" y="499" width="53.3" height="52" rx="8" fill="#8a7895"/>
<text x="382.2875" y="533" text-anchor="start" font-family="Arial, sans-serif" font-size="22.0" font-weight="700" fill="#8a7895">4.9%</text>
<line x1="315" y1="605" x2="750" y2="605" stroke="#8fa0ad" stroke-width="2"/>
<text x="532" y="634" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.0" font-weight="700" fill="#17324d">Share of trader classifications</text>
</svg>

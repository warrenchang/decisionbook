<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">An insult produced different cortisol responses in one culture-of-honor experiment</title>
  <desc id="desc">An original grouped bar chart redraws between-subject mean percentage changes in cortisol for northern and southern White male University of Michigan students in control and insult conditions. Regional upbringing was measured rather than randomized, while insult assignment was randomized. The figure therefore supports a region-by-insult response difference, not a causal effect of cultural origin. A boundary panel reports recruited and analytic sample sizes and emphasizes the restricted sample.</desc>
  <rect width="1200" height="700" fill="#ffffff"/>
  <text x="600" y="48" text-anchor="middle" font-family="Arial, sans-serif" font-size="33" font-weight="700" fill="#17324d">The same insult can carry different learned stakes</text>
  <text x="600" y="80" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#66737f">Original redraw of one response measure in Cohen et al. (1996), Experiment 2</text>

  <rect x="45" y="112" width="700" height="520" rx="18" fill="#f7fafc" stroke="#c8d7e2" stroke-width="2"/>
  <text x="395" y="151" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#17324d">Percentage change in cortisol level</text>
  <line x1="135" y1="520" x2="690" y2="520" stroke="#8fa0ad" stroke-width="2"/>
  <line x1="135" y1="210" x2="135" y2="520" stroke="#8fa0ad" stroke-width="2"/>
  <g font-family="Arial, sans-serif" font-size="16" fill="#66737f">
    <line x1="135" y1="520" x2="690" y2="520" stroke="#dce5ea"/><text x="121" y="525" text-anchor="end">0%</text>
    <line x1="135" y1="451.1" x2="690" y2="451.1" stroke="#dce5ea"/><text x="121" y="456.1" text-anchor="end">20%</text>
    <line x1="135" y1="382.2" x2="690" y2="382.2" stroke="#dce5ea"/><text x="121" y="387.2" text-anchor="end">40%</text>
    <line x1="135" y1="313.3" x2="690" y2="313.3" stroke="#dce5ea"/><text x="121" y="318.3" text-anchor="end">60%</text>
    <line x1="135" y1="244.4" x2="690" y2="244.4" stroke="#dce5ea"/><text x="121" y="249.4" text-anchor="end">80%</text>
  </g>
  <rect x="185" y="375.3" width="72" height="144.7" rx="5" fill="#d98989"/>
  <rect x="285" y="247.9" width="72" height="272.1" rx="5" fill="#a74343"/>
  <rect x="465" y="385.7" width="72" height="134.3" rx="5" fill="#87b493"/>
  <rect x="565" y="406.3" width="72" height="113.7" rx="5" fill="#447c55"/>
  <g font-family="Arial, sans-serif" font-size="18" font-weight="700" text-anchor="middle">
    <text x="221" y="365" fill="#a74343">42%</text><text x="321" y="238" fill="#a74343">79%</text>
    <text x="501" y="376" fill="#447c55">39%</text><text x="601" y="397" fill="#447c55">33%</text>
  </g>
  <g font-family="Arial, sans-serif" font-size="16" fill="#66737f" text-anchor="middle">
    <text x="221" y="542">Control</text><text x="321" y="542">Insult</text>
    <text x="501" y="542">Control</text><text x="601" y="542">Insult</text>
  </g>
  <text x="271" y="576" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#a74343">Raised in the U.S. South</text>
  <text x="551" y="576" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#447c55">Raised in the U.S. North</text>
  <text x="412" y="612" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#66737f">Between-subject cell means; insult combines public and private conditions</text>

  <rect x="775" y="112" width="380" height="520" rx="18" fill="#f7f1e8" stroke="#c56a2d" stroke-width="2"/>
  <text x="965" y="157" text-anchor="middle" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#17324d">Read the scope with the result</text>
  <rect x="815" y="190" width="300" height="130" rx="14" fill="#edf4ed" stroke="#447c55" stroke-width="2"/>
  <text x="965" y="226" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#17324d">The proposed mechanism</text>
  <text x="965" y="256" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#66737f">An insult threatened reputation more</text>
  <text x="965" y="280" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#66737f">where honor norms made backing down</text>
  <text x="965" y="304" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#66737f">socially costly.</text>
  <text x="965" y="355" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#a74343">What the design identifies</text>
  <text x="965" y="386" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#17324d">Regional upbringing was measured;</text>
  <text x="965" y="409" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#17324d">the insult condition was randomized.</text>
  <text x="965" y="442" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#a74343">Supports: region × insult difference</text>
  <text x="965" y="465" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#a74343">Not: causal effect of cultural origin</text>
  <text x="965" y="493" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#66737f">White male students, one U.S. university, 1990s</text>
  <text x="965" y="519" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#17324d">Recruited N = 173 • analytic cortisol N = 169</text>
  <text x="965" y="542" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#66737f">Exact four-cell Ns were not reported.</text>
  <rect x="815" y="558" width="300" height="58" rx="12" fill="#ffffff" stroke="#2f6f9f" stroke-width="2"/>
  <text x="965" y="582" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#17324d">Use culture to ask what is at stake,</text>
  <text x="965" y="604" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#17324d">not to diagnose a person.</text>
  <text x="600" y="676" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#66737f">Data source: Cohen, Nisbett, Bowdle, &amp; Schwarz (1996). Graphic design and annotations are original to this book.</text>
</svg>

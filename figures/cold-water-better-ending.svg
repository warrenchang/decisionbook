<svg xmlns="http://www.w3.org/2000/svg" width="760" height="575" viewBox="0 0 760 575" role="img" aria-labelledby="title desc">
<title id="title">Cold-water trials: the same first minute, a different ending</title>
<desc id="desc">Protocol timelines, not pain measurements. The short trial lasts 60 seconds at 14 degrees Celsius. The long trial has the same first 60 seconds, then 30 additional seconds as water warms toward 15 degrees Celsius. Twenty-two of the 32 analyzed participants chose to repeat the long trial.</desc>
<style>text{font-family:Arial,Helvetica,sans-serif}</style>
<rect width="760" height="575" fill="white"/>
<line x1="70" y1="67" x2="70" y2="377" stroke="#dce3e8" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="5 7"/>
<line x1="490" y1="67" x2="490" y2="377" stroke="#dce3e8" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="5 7"/>
<line x1="700" y1="67" x2="700" y2="377" stroke="#dce3e8" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="5 7"/>
<text x="70" y="43" font-size="30" fill="#183047" text-anchor="start" font-weight="700" >Short trial</text>
<rect x="70" y="70" width="420" height="80" fill="#254f77"/>
<text x="280" y="120" font-size="30" fill="white" text-anchor="middle" font-weight="700" >14°C</text>
<text x="514" y="120" font-size="30" fill="#536879" text-anchor="start" font-weight="400" >Stop</text>
<text x="70" y="231" font-size="30" fill="#183047" text-anchor="start" font-weight="700" >Long trial</text>
<rect x="70" y="258" width="420" height="80" fill="#254f77"/>
<rect x="490" y="258" width="210" height="80" fill="#c7e7e7"/>
<text x="280" y="308" font-size="30" fill="white" text-anchor="middle" font-weight="700" >14°C</text>
<text x="595" y="289" font-size="28" fill="#183047" text-anchor="middle" font-weight="400" >Warms to</text>
<text x="595" y="322" font-size="30" fill="#183047" text-anchor="middle" font-weight="700" >15°C</text>
<line x1="70" y1="377" x2="700" y2="377" stroke="#536879" stroke-width="2" stroke-linecap="round" />
<line x1="70" y1="377" x2="70" y2="386" stroke="#536879" stroke-width="2" stroke-linecap="round" />
<text x="70" y="418" font-size="28" fill="#536879" text-anchor="middle" font-weight="400" >0</text>
<line x1="490" y1="377" x2="490" y2="386" stroke="#536879" stroke-width="2" stroke-linecap="round" />
<text x="490" y="418" font-size="28" fill="#536879" text-anchor="middle" font-weight="400" >60</text>
<line x1="700" y1="377" x2="700" y2="386" stroke="#536879" stroke-width="2" stroke-linecap="round" />
<text x="700" y="418" font-size="28" fill="#536879" text-anchor="middle" font-weight="400" >90</text>
<text x="385" y="461" font-size="30" fill="#183047" text-anchor="middle" font-weight="400" >Time in water (seconds)</text>
<text x="380" y="531" font-size="30" fill="#087e8b" text-anchor="middle" font-weight="700" >22 of 32 chose the longer trial</text>
</svg>

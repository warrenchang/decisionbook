<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" baseProfile="full" height="650" version="1.1" viewBox="0 0 1200 650" width="1200">
  <defs />
  <title>Attention as gatekeeper</title>
  <desc>A wide stream of world information passes through a narrow attention filter before becoming evidence for judgment.</desc>
  <rect fill="white" height="650" width="1200" x="0" y="0" />
  <text fill="#17324d" font-family="Arial, sans-serif" font-size="34" font-weight="bold" text-anchor="middle" x="600" y="55">Attention is the gatekeeper of evidence</text>
  <text fill="#66737f" font-family="Arial, sans-serif" font-size="20" font-weight="normal" text-anchor="start" x="105" y="135">metrics</text>
  <line stroke="#17324d" stroke-width="2" x1="220" x2="450" y1="128" y2="300" />
  <polygon fill="#17324d" points="450,300 435.1052106751673,298.2265144576707 444.08848887048526,286.213991289513" />
  <text fill="#66737f" font-family="Arial, sans-serif" font-size="20" font-weight="normal" text-anchor="start" x="105" y="197">voices</text>
  <line stroke="#17324d" stroke-width="2" x1="220" x2="450" y1="190" y2="300" />
  <polygon fill="#17324d" points="450,300 435.04501646682337,301.1612353432516 441.5168489263835,287.6292220187169" />
  <text fill="#66737f" font-family="Arial, sans-serif" font-size="20" font-weight="normal" text-anchor="start" x="105" y="259">threats</text>
  <line stroke="#17324d" stroke-width="2" x1="220" x2="450" y1="252" y2="300" />
  <polygon fill="#17324d" points="450,300 435.751385771061,304.68796251636866 438.81579825436603,290.0043193671987" />
  <text fill="#66737f" font-family="Arial, sans-serif" font-size="20" font-weight="normal" text-anchor="start" x="105" y="321">signals</text>
  <line stroke="#17324d" stroke-width="2" x1="220" x2="450" y1="314" y2="300" />
  <polygon fill="#17324d" points="450,300 437.4892959835524,308.27540240790995 436.5779392799873,293.3031137064833" />
  <text fill="#66737f" font-family="Arial, sans-serif" font-size="20" font-weight="normal" text-anchor="start" x="105" y="383">memories</text>
  <line stroke="#17324d" stroke-width="2" x1="220" x2="450" y1="376" y2="300" />
  <polygon fill="#17324d" points="450,300 440.0186817365152,311.1970212879598 435.31243598616925,296.9544354645445" />
  <text fill="#66737f" font-family="Arial, sans-serif" font-size="20" font-weight="normal" text-anchor="start" x="105" y="445">options</text>
  <line stroke="#17324d" stroke-width="2" x1="220" x2="450" y1="438" y2="300" />
  <polygon fill="#17324d" points="450,300 442.71955830721885,313.11469285793663 435.00212197580595,300.25229897224847" />
  <text fill="#66737f" font-family="Arial, sans-serif" font-size="20" font-weight="normal" text-anchor="start" x="105" y="507">social cues</text>
  <line stroke="#17324d" stroke-width="2" x1="220" x2="450" y1="500" y2="300" />
  <polygon fill="#17324d" points="450,300 445.11872708149167,314.18355296443866 435.27604635761986,302.8644701319861" />
  <polygon fill="#eaf3f8" points="450,120 650,250 650,350 450,520" stroke="#2f6f9f" stroke-width="3" />
  <text fill="#17324d" font-family="Arial, sans-serif" font-size="26" font-weight="bold" text-anchor="middle" x="535" y="292">attention</text>
  <text fill="#66737f" font-family="Arial, sans-serif" font-size="18" font-weight="normal" text-anchor="middle" x="535" y="326">goals + salience</text>
  <line stroke="#17324d" stroke-width="4" x1="650" x2="830" y1="300" y2="300" />
  <polygon fill="#17324d" points="830,300 817.0096189432334,307.5 817.0096189432334,292.5" />
  <rect fill="#f7f1e8" height="150" rx="16" ry="16" stroke="#c56a2d" stroke-width="3" width="290" x="830" y="225" />
  <text fill="#17324d" font-family="Arial, sans-serif" font-size="26" font-weight="bold" text-anchor="middle" x="975" y="268.6"><tspan x="975" dy="0">Evidence for</tspan><tspan x="975" dy="30.68">judgment</tspan></text>
  <text fill="#66737f" font-family="Arial, sans-serif" font-size="17" font-weight="normal" text-anchor="middle" x="975" y="327.4"><tspan x="975" dy="0">noticed • trusted •</tspan><tspan x="975" dy="20.06">weighted</tspan></text>
  <text fill="#66737f" font-family="Arial, sans-serif" font-size="22" font-weight="normal" text-anchor="middle" x="600" y="610">What remains outside the filter may never enter the decision.</text>
</svg>
<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">Attention prioritizes information for deliberate use</title>
  <desc id="desc">Many internal and external signals reach the organism. Attention prioritizes a subset for conscious report and deliberate use in judgment. A separate, lighter pathway indicates that some unattended signals can still affect processing and action.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 8" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0.5 0.8 L9 4 L0.5 7.2 Z" fill="#17324d"/>
    </marker>
    <marker id="arrow-light" viewBox="0 0 10 8" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0.5 0.8 L9 4 L0.5 7.2 Z" fill="#7b8c9b"/>
    </marker>
    <style>
      .title{font:700 34px Arial,sans-serif;fill:#17324d}
      .subtitle{font:19px Arial,sans-serif;fill:#607080}
      .label{font:700 24px Arial,sans-serif;fill:#17324d}
      .body{font:18px Arial,sans-serif;fill:#536879}
      .signal{font:20px Arial,sans-serif;fill:#536879}
    </style>
  </defs>
  <rect width="1200" height="680" fill="#ffffff"/>
  <text class="title" x="600" y="52" text-anchor="middle">Attention prioritizes information for deliberate use</text>
  <text class="subtitle" x="600" y="84" text-anchor="middle">Selection is powerful, but it is not an all-or-none wall.</text>

  <rect x="55" y="125" width="245" height="395" rx="22" fill="#f5f8fa" stroke="#9eb1bf" stroke-width="2.5"/>
  <text class="label" x="178" y="170" text-anchor="middle">Available signals</text>
  <g class="signal">
    <text x="90" y="220">metrics</text>
    <text x="90" y="267">voices</text>
    <text x="90" y="314">threats</text>
    <text x="90" y="361">memories</text>
    <text x="90" y="408">options</text>
    <text x="90" y="455">social cues</text>
  </g>

  <path d="M300 323 H410" fill="none" stroke="#17324d" stroke-width="4" marker-end="url(#arrow)"/>
  <rect x="410" y="225" width="300" height="195" rx="24" fill="#eaf3f8" stroke="#2f6f9f" stroke-width="3"/>
  <text class="label" x="560" y="278" text-anchor="middle">Attention prioritizes</text>
  <text class="body" x="560" y="316" text-anchor="middle">
    <tspan x="560">according to goals, salience,</tspan>
    <tspan x="560" dy="27">expectations, and task demands</tspan>
  </text>
  <text class="body" x="560" y="385" text-anchor="middle">limited and dynamically allocated</text>

  <path d="M710 323 H800" fill="none" stroke="#17324d" stroke-width="4" marker-end="url(#arrow)"/>
  <rect x="800" y="225" width="340" height="195" rx="24" fill="#f7f1e8" stroke="#c56a2d" stroke-width="3"/>
  <text class="label" x="970" y="277" text-anchor="middle">Prioritized information</text>
  <text class="body" x="970" y="318" text-anchor="middle">
    <tspan x="970">more likely to become consciously</tspan>
    <tspan x="970" dy="27">reportable and deliberately usable</tspan>
    <tspan x="970" dy="27">in judgment and action</tspan>
  </text>

  <path d="M178 520 C178 610 880 610 970 420" fill="none" stroke="#7b8c9b" stroke-width="3" stroke-dasharray="9 8" marker-end="url(#arrow-light)"/>
  <rect x="315" y="545" width="530" height="82" rx="18" fill="#f5f8fa" stroke="#9eb1bf" stroke-width="2"/>
  <text class="body" x="580" y="579" text-anchor="middle">
    <tspan x="580">Some unattended signals can still affect</tspan>
    <tspan x="580" dy="26">processing or action without conscious report.</tspan>
  </text>
  <text class="subtitle" x="600" y="660" text-anchor="middle">Teaching synthesis: attention changes weighting and access; it does not determine all processing.</text>
</svg>

<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Processing ease can influence several judgments</title>
  <desc id="desc">Four source cues are aligned vertically on the left: repetition, clarity, familiarity, and pronounceability. They converge on processing ease in the center. Depending on task and context, processing ease can influence perceived truth, liking, confidence, or risk and safety judgment. An evidence check below asks whether independent evidence supports the inference.</desc>
  <defs>
    <marker id="arrow-navy" markerWidth="10" markerHeight="9" refX="9" refY="4.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M1 1 L9 4.5 L1 8 Z" fill="#17324d"/>
    </marker>
    <marker id="arrow-orange" markerWidth="10" markerHeight="9" refX="9" refY="4.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M1 1 L9 4.5 L1 8 Z" fill="#c56a2d"/>
    </marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="9" refX="9" refY="4.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M1 1 L9 4.5 L1 8 Z" fill="#447c55"/>
    </marker>
    <style>
      .title{font:700 34px Arial,sans-serif;fill:#17324d}
      .label{font:700 23px Arial,sans-serif;fill:#17324d}
      .body{font:17px Arial,sans-serif;fill:#566878}
      .source{fill:#eaf3f8;stroke:#2f6f9f;stroke-width:3}
      .inference{fill:#f9e7e7;stroke:#a74343;stroke-width:3}
    </style>
  </defs>

  <rect width="1200" height="760" fill="#ffffff"/>
  <text class="title" x="600" y="50" text-anchor="middle">Processing ease can influence judgment</text>
  <text class="body" x="600" y="80" text-anchor="middle">The direction and size of the inference depend on task, attribution, and context.</text>

  <!-- Shared source rail: aligned inputs converge without crossing. -->
  <g>
    <rect class="source" x="65" y="120" width="260" height="82" rx="16"/>
    <text class="label" x="195" y="170" text-anchor="middle">Repetition</text>
    <rect class="source" x="65" y="225" width="260" height="82" rx="16"/>
    <text class="label" x="195" y="275" text-anchor="middle">Clarity</text>
    <rect class="source" x="65" y="330" width="260" height="82" rx="16"/>
    <text class="label" x="195" y="380" text-anchor="middle">Familiarity</text>
    <rect class="source" x="65" y="435" width="260" height="82" rx="16"/>
    <text class="label" x="195" y="485" text-anchor="middle">Pronounceability</text>

    <path d="M325 161 H385 M325 266 H385 M325 371 H385 M325 476 H385 M385 161 V476" fill="none" stroke="#17324d" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="385" cy="319" r="5" fill="#17324d"/>
    <path d="M385 319 H445" fill="none" stroke="#17324d" stroke-width="3" marker-end="url(#arrow-navy)"/>
  </g>

  <!-- Processing experience is deliberately centered between sources and inferences. -->
  <rect x="445" y="245" width="310" height="148" rx="20" fill="#f7f1e8" stroke="#c56a2d" stroke-width="4"/>
  <text class="label" x="600" y="296" text-anchor="middle">Processing ease</text>
  <text class="body" x="600" y="330" text-anchor="middle">
    <tspan x="600">smooth • familiar • coherent</tspan>
    <tspan x="600" dy="24">can become a metacognitive cue</tspan>
  </text>

  <!-- Shared inference rail: one experience can invite several distinct conclusions. -->
  <g>
    <path d="M755 319 H815" fill="none" stroke="#c56a2d" stroke-width="3"/>
    <circle cx="815" cy="319" r="5" fill="#c56a2d"/>
    <path d="M815 161 V476" fill="none" stroke="#c56a2d" stroke-width="3" stroke-linecap="round"/>
    <path d="M815 161 H875" fill="none" stroke="#c56a2d" stroke-width="3" marker-end="url(#arrow-orange)"/>
    <path d="M815 266 H875" fill="none" stroke="#c56a2d" stroke-width="3" marker-end="url(#arrow-orange)"/>
    <path d="M815 371 H875" fill="none" stroke="#c56a2d" stroke-width="3" marker-end="url(#arrow-orange)"/>
    <path d="M815 476 H875" fill="none" stroke="#c56a2d" stroke-width="3" marker-end="url(#arrow-orange)"/>

    <rect class="inference" x="875" y="120" width="260" height="82" rx="16"/>
    <text class="label" x="1005" y="170" text-anchor="middle">Perceived truth</text>
    <rect class="inference" x="875" y="225" width="260" height="82" rx="16"/>
    <text class="label" x="1005" y="275" text-anchor="middle">Liking</text>
    <rect class="inference" x="875" y="330" width="260" height="82" rx="16"/>
    <text class="label" x="1005" y="369" text-anchor="middle">Risk / safety</text>
    <text class="body" x="1005" y="394" text-anchor="middle">context-specific</text>
    <rect class="inference" x="875" y="435" width="260" height="82" rx="16"/>
    <text class="label" x="1005" y="485" text-anchor="middle">Confidence</text>
  </g>

  <!-- Evidence audit sits below the causal path and does not cross it. -->
  <path d="M600 393 V565" fill="none" stroke="#447c55" stroke-width="3" stroke-dasharray="8 7" marker-end="url(#arrow-green)"/>
  <text x="617" y="475" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#447c55">AUDIT</text>
  <rect x="380" y="565" width="440" height="120" rx="18" fill="#edf4ed" stroke="#447c55" stroke-width="3"/>
  <text class="label" x="600" y="607" text-anchor="middle">Evidence check</text>
  <text class="body" x="600" y="640" text-anchor="middle">
    <tspan x="600">Why is this easy to process?</tspan>
    <tspan x="600" dy="24">What independent evidence supports the inference?</tspan>
  </text>

  <text class="body" x="600" y="724" text-anchor="middle">Teaching synthesis: fluency can influence these judgments; it does not establish any of them.</text>
</svg>

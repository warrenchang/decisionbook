<svg xmlns="http://www.w3.org/2000/svg" width="760" height="1040" viewBox="0 0 760 1040" role="img" aria-labelledby="title desc" data-layout="compact">
<title id="title">When ease becomes evidence</title><desc id="desc">Repetition, clarity, familiarity, and pronounceability can produce processing ease. That ease may inform truth, liking, safety, or confidence judgments. A separate evidence check asks whether the inference is warranted.</desc>
<defs><style>
text {font-family:Arial,Helvetica,sans-serif;fill:#183047}
.title {font-family:Georgia,serif;font-size:38px;font-weight:bold}
</style>
<marker id="blue" markerWidth="8" markerHeight="8" refX="8" refY="4" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8 Z" fill="#25678f"/></marker>
<marker id="green" markerWidth="8" markerHeight="8" refX="8" refY="4" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8 Z" fill="#2b7a78"/></marker>
<marker id="warm" markerWidth="8" markerHeight="8" refX="8" refY="4" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8 Z" fill="#b95f2d"/></marker>
</defs><rect width="760" height="1040" fill="white"/>
<text x="380" y="59" text-anchor="middle" font-size="38" font-weight="normal" style="fill:#183047" class="title"><tspan x="380" dy="0">When ease</tspan><tspan x="380" dy="47.12">becomes evidence</tspan></text>
<rect x="65" y="171" width="630" height="152" rx="18" fill="#f4f7fa" stroke="#25678f" stroke-width="2.5"/>
<text x="380.0" y="214" text-anchor="middle" font-size="32" font-weight="bold" style="fill:#25678f" class=""><tspan x="380.0" dy="0">Possible sources</tspan></text>
<text x="380.0" y="255" text-anchor="middle" font-size="28" font-weight="normal" style="fill:#183047" class=""><tspan x="380.0" dy="0">Repetition, clarity, familiarity,</tspan><tspan x="380.0" dy="34.72">and pronounceability</tspan></text>
<rect x="65" y="390" width="630" height="146" rx="18" fill="#fff8f3" stroke="#b95f2d" stroke-width="2.5"/>
<text x="380.0" y="433" text-anchor="middle" font-size="32" font-weight="bold" style="fill:#b95f2d" class=""><tspan x="380.0" dy="0">Processing ease</tspan></text>
<text x="380.0" y="474" text-anchor="middle" font-size="28" font-weight="normal" style="fill:#183047" class=""><tspan x="380.0" dy="0">The information feels smooth,</tspan><tspan x="380.0" dy="34.72">familiar, or coherent.</tspan></text>
<rect x="65" y="603" width="630" height="145" rx="18" fill="#f4f7fa" stroke="#25678f" stroke-width="2.5"/>
<text x="380.0" y="646" text-anchor="middle" font-size="32" font-weight="bold" style="fill:#25678f" class=""><tspan x="380.0" dy="0">Possible judgments</tspan></text>
<text x="380.0" y="687" text-anchor="middle" font-size="28" font-weight="normal" style="fill:#183047" class=""><tspan x="380.0" dy="0">“True.” “Likable.” “Safe.”</tspan><tspan x="380.0" dy="34.72">“I am confident.”</tspan></text>
<path d="M380 323 V390" fill="none" stroke="#25678f" stroke-width="3" stroke-linejoin="round" marker-end="url(#blue)"/>
<path d="M380 536 V603" fill="none" stroke="#25678f" stroke-width="3" stroke-linejoin="round" marker-end="url(#blue)"/>
<rect x="65" y="823" width="630" height="169" rx="18" fill="#edf7f3" stroke="#2b7a78" stroke-width="2.5"/>
<text x="380.0" y="866" text-anchor="middle" font-size="32" font-weight="bold" style="fill:#2b7a78" class=""><tspan x="380.0" dy="0">Check the inference</tspan></text>
<text x="380.0" y="907" text-anchor="middle" font-size="28" font-weight="normal" style="fill:#183047" class=""><tspan x="380.0" dy="0">Why was this easy to process?</tspan><tspan x="380.0" dy="34.72">What independent evidence supports it?</tspan></text>
<path d="M380 748 V823" fill="none" stroke="#2b7a78" stroke-width="3" stroke-linejoin="round" marker-end="url(#green)" stroke-dasharray="7 6"/>
</svg>

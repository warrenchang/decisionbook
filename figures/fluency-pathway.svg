<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" baseProfile="full" height="650" version="1.1" viewBox="0 0 1200 650" width="1200">
  <defs>
    <marker id="navy-arrow" markerWidth="11" markerHeight="11" refX="9.5" refY="5.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0 L11 5.5 L0 11 Z" fill="#17324d" />
    </marker>
    <marker id="orange-arrow" markerWidth="11" markerHeight="11" refX="9.5" refY="5.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0 L11 5.5 L0 11 Z" fill="#c56a2d" />
    </marker>
    <marker id="green-arrow" markerWidth="11" markerHeight="11" refX="9.5" refY="5.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0 L11 5.5 L0 11 Z" fill="#447c55" />
    </marker>
  </defs>
  <title>Processing fluency pathway</title>
  <desc>Repetition, clarity, familiarity, and pronunciation increase processing ease, which can be misattributed to truth, liking, safety, and confidence. An evidence check separates ease from validity.</desc>
  <rect fill="white" height="650" width="1200" x="0" y="0" />
  <text fill="#17324d" font-family="Arial, sans-serif" font-size="34" font-weight="bold" text-anchor="middle" x="600" y="48">The mind often treats ease as evidence</text>
  <rect fill="#eaf3f8" height="80" rx="16" ry="16" stroke="#2f6f9f" stroke-width="3" width="165" x="95" y="145" />
  <text fill="#17324d" font-family="Arial, sans-serif" font-size="23" font-weight="bold" text-anchor="middle" x="177.5" y="191.5"><tspan x="177.5" dy="0">repetition</tspan></text>
  <line stroke="#17324d" stroke-width="2" x1="177.5" x2="520" y1="225" y2="270" marker-end="url(#navy-arrow)" />
  <rect fill="#eaf3f8" height="80" rx="16" ry="16" stroke="#2f6f9f" stroke-width="3" width="165" x="285" y="145" />
  <text fill="#17324d" font-family="Arial, sans-serif" font-size="26" font-weight="bold" text-anchor="middle" x="367.5" y="191.5"><tspan x="367.5" dy="0">clarity</tspan></text>
  <line stroke="#17324d" stroke-width="2" x1="367.5" x2="560" y1="225" y2="270" marker-end="url(#navy-arrow)" />
  <rect fill="#eaf3f8" height="80" rx="16" ry="16" stroke="#2f6f9f" stroke-width="3" width="165" x="475" y="145" />
  <text fill="#17324d" font-family="Arial, sans-serif" font-size="22" font-weight="bold" text-anchor="middle" x="557.5" y="191.5"><tspan x="557.5" dy="0">familiarity</tspan></text>
  <line stroke="#17324d" stroke-width="2" x1="557.5" x2="600" y1="225" y2="270" marker-end="url(#navy-arrow)" />
  <rect fill="#eaf3f8" height="80" rx="16" ry="16" stroke="#2f6f9f" stroke-width="3" width="165" x="665" y="145" />
  <text fill="#17324d" font-family="Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="middle" x="747.5" y="181"><tspan x="747.5" dy="0">pronounce-</tspan><tspan x="747.5" dy="24">ability</tspan></text>
  <line stroke="#17324d" stroke-width="2" x1="747.5" x2="650" y1="225" y2="270" marker-end="url(#navy-arrow)" />
  <rect fill="#f7f1e8" height="120" rx="16" ry="16" stroke="#c56a2d" stroke-width="3" width="230" x="485" y="270" />
  <text fill="#17324d" font-family="Arial, sans-serif" font-size="24.91" font-weight="bold" text-anchor="middle" x="600" y="299.921"><tspan x="600" dy="0">Processing</tspan><tspan x="600" dy="29.3892">ease</tspan></text>
  <text fill="#66737f" font-family="Arial, sans-serif" font-size="16.28" font-weight="normal" text-anchor="middle" x="600" y="356.458"><tspan x="600" dy="0">smooth • familiar •</tspan><tspan x="600" dy="19.216">coherent</tspan></text>
  <rect fill="#f9e7e7" height="80" rx="16" ry="16" stroke="#a74343" stroke-width="3" width="145" x="850" y="145" />
  <text fill="#17324d" font-family="Arial, sans-serif" font-size="26" font-weight="bold" text-anchor="middle" x="922.5" y="191.5"><tspan x="922.5" dy="0">truth</tspan></text>
  <path d="M715 330 C755 285 790 230 850 185" fill="none" marker-end="url(#orange-arrow)" stroke="#c56a2d" stroke-width="2" />
  <rect fill="#f9e7e7" height="80" rx="16" ry="16" stroke="#a74343" stroke-width="3" width="145" x="1025" y="145" />
  <text fill="#17324d" font-family="Arial, sans-serif" font-size="26" font-weight="bold" text-anchor="middle" x="1097.5" y="191.5"><tspan x="1097.5" dy="0">liking</tspan></text>
  <path d="M715 330 C790 300 875 245 1025 185" fill="none" marker-end="url(#orange-arrow)" stroke="#c56a2d" stroke-width="2" />
  <rect fill="#f9e7e7" height="80" rx="16" ry="16" stroke="#a74343" stroke-width="3" width="145" x="850" y="390" />
  <text fill="#17324d" font-family="Arial, sans-serif" font-size="26" font-weight="bold" text-anchor="middle" x="922.5" y="436.5"><tspan x="922.5" dy="0">safety</tspan></text>
  <path d="M715 330 C760 355 795 395 850 430" fill="none" marker-end="url(#orange-arrow)" stroke="#c56a2d" stroke-width="2" />
  <rect fill="#f9e7e7" height="80" rx="16" ry="16" stroke="#a74343" stroke-width="3" width="145" x="1025" y="390" />
  <text fill="#17324d" font-family="Arial, sans-serif" font-size="21" font-weight="bold" text-anchor="middle" x="1097.5" y="436.5"><tspan x="1097.5" dy="0">confidence</tspan></text>
  <path d="M715 330 C790 345 875 390 1025 430" fill="none" marker-end="url(#orange-arrow)" stroke="#c56a2d" stroke-width="2" />
  <rect fill="#edf4ed" height="105" rx="16" ry="16" stroke="#447c55" stroke-width="3" width="420" x="120" y="430" />
  <text fill="#17324d" font-family="Arial, sans-serif" font-size="26" font-weight="bold" text-anchor="middle" x="330" y="466.44"><tspan x="330" dy="0">Evidence check</tspan></text>
  <text fill="#66737f" font-family="Arial, sans-serif" font-size="17" font-weight="normal" text-anchor="middle" x="330" y="494.56"><tspan x="330" dy="0">Why is this easy? What independent</tspan><tspan x="330" dy="20.06">evidence supports it?</tspan></text>
  <line marker-end="url(#green-arrow)" stroke="#447c55" stroke-width="4" x1="540" x2="600" y1="480" y2="390" />
</svg>

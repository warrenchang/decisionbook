<svg xmlns="http://www.w3.org/2000/svg" width="760" height="815" viewBox="0 0 760 815" role="img" aria-labelledby="title desc">
<title id="title">How much do you each know?</title><desc id="desc">A first-offer preparation heuristic crosses each party’s information about the bargaining situation. With good information, consider a defensible anchor and guard against exploitation or an extreme offer. With weak information, learn before centering the negotiation on a number. Low information can lead to a mispriced offer.</desc>
<rect width="760" height="815" fill="white"/>
<defs>
<marker id="a" viewBox="0 0 12 10" markerWidth="9" markerHeight="8" refX="11" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L11 5 L1 9 Z" fill="#2f6f9f"/></marker>
<marker id="g" viewBox="0 0 12 10" markerWidth="9" markerHeight="8" refX="11" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L11 5 L1 9 Z" fill="#3f7c59"/></marker>
<marker id="o" viewBox="0 0 12 10" markerWidth="9" markerHeight="8" refX="11" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L11 5 L1 9 Z" fill="#b95f2d"/></marker>
</defs>
<text x="380" y="48" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="700" fill="#17324d">How much do you each know?</text>
<text x="435" y="104" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#17324d">Counterpart’s information</text>
<text x="275" y="152" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#2f6f9f">Little</text>
<text x="595" y="152" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#2f6f9f">Good</text>
<rect x="125" y="190" width="290" height="225" rx="18" fill="#edf7ef" stroke="#3f7c59" stroke-width="2.5"/>
<text x="270" y="234" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#17324d">Anchor responsibly</text>
<text x="270" y="281" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="400" fill="#53697d">Use a defensible</text>
<text x="270" y="316" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="400" fill="#53697d">standard; avoid</text>
<text x="270" y="351" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="400" fill="#53697d">exploiting their</text>
<text x="270" y="386" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="400" fill="#53697d">lack of information.</text>
<rect x="445" y="190" width="290" height="225" rx="18" fill="#edf5fa" stroke="#2f6f9f" stroke-width="2.5"/>
<text x="590" y="234" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#17324d">Consider going first</text>
<text x="590" y="281" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="400" fill="#53697d">Explain the number.</text>
<text x="590" y="316" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="400" fill="#53697d">An extreme anchor</text>
<text x="590" y="351" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="400" fill="#53697d">may undermine</text>
<text x="590" y="386" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="400" fill="#53697d">your credibility.</text>
<rect x="125" y="450" width="290" height="225" rx="18" fill="#fff5ec" stroke="#b95f2d" stroke-width="2.5"/>
<text x="270" y="494" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#17324d">Research first</text>
<text x="270" y="541" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="400" fill="#53697d">An arbitrary offer</text>
<text x="270" y="576" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="400" fill="#53697d">can become a</text>
<text x="270" y="611" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="400" fill="#53697d">misleading reference</text>
<text x="270" y="646" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="400" fill="#53697d">for both sides.</text>
<rect x="445" y="450" width="290" height="225" rx="18" fill="#f4eff8" stroke="#795a8a" stroke-width="2.5"/>
<text x="590" y="494" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#17324d">Learn, then offer</text>
<text x="590" y="541" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="400" fill="#53697d">Your opening may be</text>
<text x="590" y="576" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="400" fill="#53697d">mispriced and reveal</text>
<text x="590" y="611" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="400" fill="#53697d">how little you know.</text>
<text x="590" y="646" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="400" fill="#53697d">Ask and investigate.</text>
<text x="57" y="302" transform="rotate(-90 57 302)" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#17324d">Yours: good</text>
<text x="57" y="562" transform="rotate(-90 57 562)" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#17324d">Yours: little</text>

<text x="380" y="777" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="400" fill="#53697d">Know your alternative and walk-away value first.</text>
</svg>

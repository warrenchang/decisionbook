<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="offer-title offer-desc">
  <title id="offer-title">First-offer information matrix</title>
  <desc id="offer-desc">A two-by-two matrix crosses the negotiator's information quality with the counterpart's information quality. Good information supports a defensible first offer; weak information calls for learning, especially when the counterpart is well informed. Each cell identifies a default move and a risk.</desc>
  <rect width="1200" height="760" fill="#ffffff"/>
  <text x="600" y="54" text-anchor="middle" font-family="Arial, sans-serif" font-size="36" font-weight="700" fill="#17324d">A first offer anchors—and reveals what you know</text>
  <text x="600" y="87" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" fill="#66737f">Treat this as a preparation heuristic, not an automatic rule.</text>

  <text x="650" y="130" text-anchor="middle" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#17324d">Counterpart's information</text>
  <text x="430" y="166" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#2f6f9f">WEAK</text>
  <text x="870" y="166" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#2f6f9f">GOOD</text>
  <text x="68" y="430" transform="rotate(-90 68 430)" text-anchor="middle" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#17324d">Your information</text>
  <text x="120" y="320" transform="rotate(-90 120 320)" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#2f6f9f">GOOD</text>
  <text x="120" y="570" transform="rotate(-90 120 570)" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#2f6f9f">WEAK</text>

  <rect x="190" y="190" width="420" height="220" rx="18" fill="#edf4ed" stroke="#447c55" stroke-width="3"/>
  <text x="400" y="230" text-anchor="middle" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#17324d">Anchor with restraint</text>
  <text x="220" y="268" font-family="Arial, sans-serif" font-size="19" fill="#17324d">Your evidence can support an opening,</text>
  <text x="220" y="294" font-family="Arial, sans-serif" font-size="19" fill="#17324d">but the other side may be easy to mislead.</text>
  <text x="220" y="334" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#447c55">Default</text>
  <text x="300" y="334" font-family="Arial, sans-serif" font-size="18" fill="#17324d">Use a defensible standard.</text>
  <text x="220" y="370" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#a74343">Risk</text>
  <text x="278" y="370" font-family="Arial, sans-serif" font-size="18" fill="#17324d">Exploitation or avoidable impasse.</text>

  <rect x="630" y="190" width="420" height="220" rx="18" fill="#eaf3f8" stroke="#2f6f9f" stroke-width="3"/>
  <text x="840" y="230" text-anchor="middle" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#17324d">Consider opening first</text>
  <text x="660" y="268" font-family="Arial, sans-serif" font-size="19" fill="#17324d">Both sides can evaluate an ambitious,</text>
  <text x="660" y="294" font-family="Arial, sans-serif" font-size="19" fill="#17324d">well-justified anchor.</text>
  <text x="660" y="334" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#447c55">Default</text>
  <text x="740" y="334" font-family="Arial, sans-serif" font-size="18" fill="#17324d">Anchor and explain.</text>
  <text x="660" y="370" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#a74343">Risk</text>
  <text x="718" y="370" font-family="Arial, sans-serif" font-size="18" fill="#17324d">Chilling effect or lost credibility.</text>

  <rect x="190" y="430" width="420" height="220" rx="18" fill="#f7f1e8" stroke="#c56a2d" stroke-width="3"/>
  <text x="400" y="470" text-anchor="middle" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#17324d">Research before centering a number</text>
  <text x="220" y="508" font-family="Arial, sans-serif" font-size="19" fill="#17324d">With little information on either side,</text>
  <text x="220" y="534" font-family="Arial, sans-serif" font-size="19" fill="#17324d">an arbitrary number can become the frame.</text>
  <text x="220" y="574" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#447c55">Default</text>
  <text x="300" y="574" font-family="Arial, sans-serif" font-size="16" fill="#17324d">Investigate; use a provisional range if needed.</text>
  <text x="220" y="610" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#a74343">Risk</text>
  <text x="278" y="610" font-family="Arial, sans-serif" font-size="18" fill="#17324d">False precision and accidental anchoring.</text>

  <rect x="630" y="430" width="420" height="220" rx="18" fill="#fbecec" stroke="#a74343" stroke-width="3"/>
  <text x="840" y="470" text-anchor="middle" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#17324d">Learn before you reveal</text>
  <text x="660" y="508" font-family="Arial, sans-serif" font-size="19" fill="#17324d">The counterpart can evaluate your number;</text>
  <text x="660" y="534" font-family="Arial, sans-serif" font-size="19" fill="#17324d">you may not be able to evaluate theirs.</text>
  <text x="660" y="574" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#447c55">Default</text>
  <text x="740" y="574" font-family="Arial, sans-serif" font-size="17" fill="#17324d">Ask, investigate, and invite information.</text>
  <text x="660" y="610" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#a74343">Risk</text>
  <text x="718" y="610" font-family="Arial, sans-serif" font-size="18" fill="#17324d">Winner's curse and exposed ignorance.</text>

  <rect x="165" y="684" width="870" height="52" rx="14" fill="#17324d"/>
  <text x="600" y="717" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#ffffff">Before any offer: know your BATNA, reservation value, target, standards, and ethical boundary.</text>
</svg>

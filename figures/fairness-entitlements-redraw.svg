<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Four market-fairness survey scenarios</title>
  <desc id="desc">Four horizontal bars show the percentage rating an action unfair or very unfair: 82 percent for raising a snow-shovel price after a storm, 21 percent for passing through a lettuce wholesale-cost increase, 71 percent for charging above list price for a scarce car, and 42 percent for withdrawing an equivalent discount.</desc>
  <style>
    .title{font:700 31px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#183047}
    .sub{font:500 18px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#52677a}
    .group{font:700 21px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#183047}
    .label{font:650 18px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#314b61}
    .detail{font:500 16px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#52677a}
    .value{font:750 20px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#ffffff}
    .axis{font:500 16px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#617485}
    .foot{font:500 16px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#52677a}
  </style>
  <rect x="18" y="18" width="1164" height="684" rx="28" fill="#f7f9fc" stroke="#9fb2c3" stroke-width="2"/>
  <text x="600" y="64" class="title" text-anchor="middle">PRICE CHANGES CAN CARRY DIFFERENT FAIRNESS MEANINGS</text>
  <text x="600" y="96" class="sub" text-anchor="middle">Percentage rating the seller’s action unfair or very unfair in four historical survey scenarios</text>

  <text x="74" y="145" class="group">DIFFERENT PRICE-CHANGE SCENARIOS</text>
  <text x="74" y="185" class="label">Snow shovel after a large storm</text>
  <text x="74" y="208" class="detail">Price rises from $15 to $20; N = 107</text>
  <rect x="510" y="167" width="560" height="42" rx="10" fill="#e3e9ee"/>
  <rect x="510" y="167" width="459" height="42" rx="10" fill="#c44e52"/>
  <text x="948" y="194" class="value" text-anchor="end">82%</text>

  <text x="74" y="256" class="label">Lettuce wholesale-cost pass-through</text>
  <text x="74" y="279" class="detail">Wholesale and retail price each rise $0.30; N = 101</text>
  <rect x="510" y="238" width="560" height="42" rx="10" fill="#e3e9ee"/>
  <rect x="510" y="238" width="118" height="42" rx="10" fill="#2f8a52"/>
  <text x="616" y="265" class="value" text-anchor="end">21%</text>

  <line x1="74" y1="326" x2="1126" y2="326" stroke="#bfd0dd" stroke-width="2"/>
  <text x="74" y="370" class="group">TWO REFERENCE-POINT DESCRIPTIONS</text>
  <text x="74" y="410" class="label">Scarce car: add a $200 surcharge</text>
  <text x="74" y="433" class="detail">Formerly list price; now $200 above list; N = 130</text>
  <rect x="510" y="392" width="560" height="42" rx="10" fill="#e3e9ee"/>
  <rect x="510" y="392" width="398" height="42" rx="10" fill="#c44e52"/>
  <text x="887" y="419" class="value" text-anchor="end">71%</text>

  <text x="74" y="481" class="label">Scarce car: withdraw a $200 discount</text>
  <text x="74" y="504" class="detail">Formerly $200 below list; now list price; N = 123</text>
  <rect x="510" y="463" width="560" height="42" rx="10" fill="#e3e9ee"/>
  <rect x="510" y="463" width="235" height="42" rx="10" fill="#d18a2c"/>
  <text x="734" y="490" class="value" text-anchor="end">42%</text>

  <path d="M510 545 H1070" stroke="#7d91a2" stroke-width="2"/>
  <path d="M510 539 V551 M650 539 V551 M790 539 V551 M930 539 V551 M1070 539 V551" stroke="#7d91a2" stroke-width="2"/>
  <text x="510" y="574" class="axis" text-anchor="middle">0%</text><text x="650" y="574" class="axis" text-anchor="middle">25%</text><text x="790" y="574" class="axis" text-anchor="middle">50%</text><text x="930" y="574" class="axis" text-anchor="middle">75%</text><text x="1070" y="574" class="axis" text-anchor="middle">100%</text>

  <rect x="74" y="606" width="1052" height="65" rx="18" fill="#e9f2f7" stroke="#9fbfd0"/>
  <text x="600" y="631" class="foot" text-anchor="middle">Kahneman, Knetsch, and Thaler (1986). Separate Toronto and Vancouver samples, 1984–85.</text>
  <text x="600" y="654" class="foot" text-anchor="middle">The findings describe those respondents; they do not establish a universal or normative definition of a fair price.</text>
</svg>

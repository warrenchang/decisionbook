<?xml version="1.0" encoding="utf-8" ?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink" baseProfile="full" height="650" version="1.1" viewBox="0 0 1200 650" width="1200">
  <defs/>
  <title>Priming pathway</title>
  <desc>A prior cue increases accessibility of a concept, which can shape interpretation and evaluation of ambiguous input. Effects depend on timing, relevance, awareness, goals, and context.</desc>
  <rect fill="white" height="650" width="1200" x="0" y="0"/>
  <text fill="#17324d" font-family="Arial, sans-serif" font-size="34" font-weight="bold" text-anchor="middle" x="600" y="48">Priming changes what is ready to interpret the next event</text>
  <rect fill="#f7f1e8" height="125" rx="16" ry="16" stroke="#c56a2d" stroke-width="3" width="230" x="50" y="225"/>
  <text fill="#17324d" font-family="Arial, sans-serif" font-size="26" font-weight="bold" text-anchor="middle" x="165.0" y="279.5">Prior cue</text>
  <text fill="#66737f" font-family="Arial, sans-serif" font-size="17" font-weight="normal" text-anchor="middle" x="165.0" y="313.5">word • image • identity • goal</text>
  <rect fill="#eaf3f8" height="125" rx="16" ry="16" stroke="#2f6f9f" stroke-width="3" width="230" x="330" y="225"/>
  <text fill="#17324d" font-family="Arial, sans-serif" font-size="26" font-weight="bold" text-anchor="middle" x="445.0" y="279.5">Accessibility</text>
  <text fill="#66737f" font-family="Arial, sans-serif" font-size="17" font-weight="normal" text-anchor="middle" x="445.0" y="313.5">related concepts become easier</text>
  <rect fill="#eaf3f8" height="125" rx="16" ry="16" stroke="#2f6f9f" stroke-width="3" width="230" x="610" y="225"/>
  <text fill="#17324d" font-family="Arial, sans-serif" font-size="26" font-weight="bold" text-anchor="middle" x="725.0" y="279.5">Ambiguous input</text>
  <text fill="#66737f" font-family="Arial, sans-serif" font-size="17" font-weight="normal" text-anchor="middle" x="725.0" y="313.5">email • face • offer • event</text>
  <rect fill="#edf4ed" height="125" rx="16" ry="16" stroke="#447c55" stroke-width="3" width="230" x="890" y="225"/>
  <text fill="#17324d" font-family="Arial, sans-serif" font-size="26" font-weight="bold" text-anchor="middle" x="1005.0" y="279.5">Interpretation + evaluation</text>
  <text fill="#66737f" font-family="Arial, sans-serif" font-size="17" font-weight="normal" text-anchor="middle" x="1005.0" y="313.5">which meaning wins?</text>
  <line stroke="#17324d" stroke-width="4" x1="280" x2="330" y1="287" y2="287"/>
  <polygon fill="#17324d" points="330,287 317.0096189432334,294.5 317.0096189432334,279.5"/>
  <line stroke="#17324d" stroke-width="4" x1="560" x2="610" y1="287" y2="287"/>
  <polygon fill="#17324d" points="610,287 597.0096189432334,294.5 597.0096189432334,279.5"/>
  <line stroke="#17324d" stroke-width="4" x1="840" x2="890" y1="287" y2="287"/>
  <polygon fill="#17324d" points="890,287 877.0096189432334,294.5 877.0096189432334,279.5"/>
  <rect fill="white" height="95" rx="16" ry="16" stroke="#2b7a78" stroke-width="3" width="500" x="350" y="445"/>
  <text fill="#17324d" font-family="Arial, sans-serif" font-size="26" font-weight="bold" text-anchor="middle" x="600.0" y="484.5">Boundary conditions</text>
  <text fill="#66737f" font-family="Arial, sans-serif" font-size="17" font-weight="normal" text-anchor="middle" x="600.0" y="518.5">timing • relevance • awareness • motivation • measurement • replication</text>
  <text fill="#66737f" font-family="Arial, sans-serif" font-size="22" font-weight="normal" text-anchor="middle" x="600" y="585">Priming is altered accessibility, not a remote control for complex behavior.</text>
</svg>

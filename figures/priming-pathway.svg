<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="640" viewBox="0 0 1000 640">
<title>How an earlier cue can shape interpretation</title><desc>An earlier cue can make a meaning easier to retrieve. That meaning and the current input both contribute to interpretation; the earlier cue does not cause the current input.</desc>
<rect width="1000" height="640" fill="white"/>
<defs><marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0 L9 4 L0 8 Z" fill="context-stroke"/></marker></defs>
<g font-family="Arial, sans-serif" fill="#17324d">
<text x="500" y="50" font-size="34" font-weight="bold" fill="#17324d" text-anchor="middle">
<tspan x="500" dy="0">How an earlier cue can shape interpretation</tspan>
</text>
<rect x="50" y="140" width="260" height="140" rx="17" fill="#f7f1e8" stroke="#c56a2d" stroke-width="3"/>
<text x="180.0" y="178" font-size="27" font-weight="bold" fill="#17324d" text-anchor="middle">
<tspan x="180.0" dy="0">Earlier cue</tspan>
</text>
<text x="180.0" y="213.0" font-size="22" font-weight="normal" fill="#52677b" text-anchor="middle">
<tspan x="180.0" dy="0">A related word,</tspan>
<tspan x="180.0" dy="27.5">image, or event</tspan>
</text>
<rect x="400" y="140" width="280" height="140" rx="17" fill="#eaf3f8" stroke="#2f6f9f" stroke-width="3"/>
<text x="540.0" y="178" font-size="25" font-weight="bold" fill="#17324d" text-anchor="middle">
<tspan x="540.0" dy="0">What comes to mind</tspan>
</text>
<text x="540.0" y="213.0" font-size="22" font-weight="normal" fill="#52677b" text-anchor="middle">
<tspan x="540.0" dy="0">A meaning becomes</tspan>
<tspan x="540.0" dy="27.5">easier to retrieve</tspan>
</text>
<rect x="50" y="380" width="300" height="135" rx="17" fill="#eaf3f8" stroke="#2f6f9f" stroke-width="3"/>
<text x="200.0" y="418" font-size="27" font-weight="bold" fill="#17324d" text-anchor="middle">
<tspan x="200.0" dy="0">Current input</tspan>
</text>
<text x="200.0" y="453.0" font-size="22" font-weight="normal" fill="#52677b" text-anchor="middle">
<tspan x="200.0" dy="0">What the person</tspan>
<tspan x="200.0" dy="27.5">actually encounters</tspan>
</text>
<rect x="720" y="315" width="240" height="165" rx="17" fill="#edf4ed" stroke="#447c55" stroke-width="3"/>
<text x="840.0" y="353" font-size="27" font-weight="bold" fill="#17324d" text-anchor="middle">
<tspan x="840.0" dy="0">Interpretation</tspan>
</text>
<text x="840.0" y="388.0" font-size="22" font-weight="normal" fill="#52677b" text-anchor="middle">
<tspan x="840.0" dy="0">How the input</tspan>
<tspan x="840.0" dy="27.5">is understood</tspan>
</text>
<path d="M310 210 H400" fill="none" stroke="#c56a2d" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M680 210 H840 V315" fill="none" stroke="#2b7a78" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M350 447 H720" fill="none" stroke="#2f6f9f" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="500" y="565" font-size="22" font-weight="normal" fill="#52677b" text-anchor="middle">
<tspan x="500" dy="0">Effects vary with the cue, task, timing, and context.</tspan>
<tspan x="500" dy="27.5">This is a possible influence, not a guaranteed response.</tspan>
</text>
</g></svg>

<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="760" height="690" viewBox="0 0 760 690" role="img" aria-labelledby="title desc">
  <title id="title">Sampling and assignment answer different questions</title>
  <desc id="desc">Random sampling selects people from a population and supports inference to that population under the sampling design. Random assignment allocates study participants to conditions and supports an internal causal comparison under the design and implementation assumptions.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 8" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0.5 0.8 L9 4 L0.5 7.2 Z" fill="#5f7080"/>
    </marker>
    <marker id="blue-arrow" viewBox="0 0 10 8" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0.5 0.8 L9 4 L0.5 7.2 Z" fill="#2f6f9f"/>
    </marker>
    <marker id="red-arrow" viewBox="0 0 10 8" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0.5 0.8 L9 4 L0.5 7.2 Z" fill="#a74343"/>
    </marker>
  </defs>
  <rect width="760" height="690" fill="#f8fafc"/>
<text x="380" y="52" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700" fill="#17324d" >Two different uses of randomness</text>
<text x="195" y="109" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700" fill="#2f6f9f" >SAMPLING</text>
<g id="sampling-0">
<rect x="25" y="140" width="340" height="110" rx="18" fill="#eaf3f8" stroke="#2f6f9f" stroke-width="2"/>
<text x="195" y="182" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="700" fill="#17324d" >Population</text>
<text x="195" y="223" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="400" fill="#17324d" >Who is eligible?</text>
</g>
<path d="M195 250 V290" stroke="#5f7080" stroke-width="3" marker-end="url(#arrow)"/>
<g id="sampling-1">
<rect x="25" y="290" width="340" height="110" rx="18" fill="#eaf3f8" stroke="#2f6f9f" stroke-width="2"/>
<text x="195" y="332" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="700" fill="#17324d" >Sample</text>
<text x="195" y="373" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="400" fill="#17324d" >Who is selected?</text>
</g>
<path d="M195 400 V440" stroke="#5f7080" stroke-width="3" marker-end="url(#arrow)"/>
<g id="sampling-2">
<rect x="25" y="440" width="340" height="110" rx="18" fill="#eaf3f8" stroke="#2f6f9f" stroke-width="2"/>
<text x="195" y="482" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="700" fill="#17324d" >Population claim</text>
<text x="195" y="523" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="400" fill="#17324d" >What can we infer?</text>
</g>
<text x="565" y="109" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700" fill="#447c55" >ASSIGNMENT</text>
<g id="assignment-0">
<rect x="395" y="140" width="340" height="110" rx="18" fill="#edf4ed" stroke="#447c55" stroke-width="2"/>
<text x="565" y="182" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="700" fill="#17324d" >Study sample</text>
<text x="565" y="223" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="400" fill="#17324d" >Who takes part?</text>
</g>
<path d="M565 250 V290" stroke="#5f7080" stroke-width="3" marker-end="url(#arrow)"/>
<g id="assignment-1">
<rect x="395" y="290" width="340" height="110" rx="18" fill="#edf4ed" stroke="#447c55" stroke-width="2"/>
<text x="565" y="332" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="700" fill="#17324d" >Groups A and B</text>
<text x="565" y="373" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="400" fill="#17324d" >Who gets what?</text>
</g>
<path d="M565 400 V440" stroke="#5f7080" stroke-width="3" marker-end="url(#arrow)"/>
<g id="assignment-2">
<rect x="395" y="440" width="340" height="110" rx="18" fill="#edf4ed" stroke="#447c55" stroke-width="2"/>
<text x="565" y="482" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="700" fill="#17324d" >Causal contrast</text>
<text x="565" y="523" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="400" fill="#17324d" >What differs?</text>
</g>
<text x="380" y="612" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#17324d" >Inference still depends on the design</text>
<text x="380" y="648" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="400" fill="#17324d" >and on how the study is carried out.</text>
</svg>

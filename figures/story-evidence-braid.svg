  <text fill="#66737f" font-family="Arial, sans-serif" font-size="15.49" font-weight="normal" text-anchor="middle" x="1085" y="317.906"><tspan x="1085" dy="0">attention +</tspan><tspan x="1085" dy="18.274">scale + agency</tspan></text>
  <text fill="#66737f" font-family="Arial, sans-serif" font-size="21" font-weight="normal" text-anchor="middle" x="600" y="575">Anecdote without evidence distorts scale; evidence without lived meaning may never guide action.</text>

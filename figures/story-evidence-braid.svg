<?xml version="1.0" encoding="utf-8" ?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink" baseProfile="full" height="650" version="1.1" viewBox="0 0 1200 650" width="1200">
  <defs/>
  <title>Story-evidence braid</title>
  <desc>Story supplies character, stakes, causal simulation, and action readiness; evidence supplies prevalence, comparison, mechanism, uncertainty, and limits. The strands converge on informed judgment.</desc>
  <rect fill="white" height="650" width="1200" x="0" y="0"/>
  <text fill="#17324d" font-family="Arial, sans-serif" font-size="34" font-weight="bold" text-anchor="middle" x="600" y="48">Story creates meaning; evidence creates proportion</text>
  <text fill="#c56a2d" font-family="Arial, sans-serif" font-size="22" font-weight="bold" text-anchor="start" x="115" y="150">STORY STRAND</text>
  <text fill="#2f6f9f" font-family="Arial, sans-serif" font-size="22" font-weight="bold" text-anchor="start" x="115" y="420">EVIDENCE STRAND</text>
  <rect fill="#f7f1e8" height="80" rx="16" ry="16" stroke="#c56a2d" stroke-width="3" width="160" x="200" y="115"/>
  <text fill="#17324d" font-family="Arial, sans-serif" font-size="26" font-weight="bold" text-anchor="middle" x="280.0" y="147.0">character</text>
  <rect fill="#f7f1e8" height="80" rx="16" ry="16" stroke="#c56a2d" stroke-width="3" width="160" x="400" y="115"/>
  <text fill="#17324d" font-family="Arial, sans-serif" font-size="26" font-weight="bold" text-anchor="middle" x="480.0" y="147.0">stakes</text>
  <rect fill="#f7f1e8" height="80" rx="16" ry="16" stroke="#c56a2d" stroke-width="3" width="160" x="600" y="115"/>
  <text fill="#17324d" font-family="Arial, sans-serif" font-size="26" font-weight="bold" text-anchor="middle" x="680.0" y="147.0">conflict + change</text>
  <rect fill="#f7f1e8" height="80" rx="16" ry="16" stroke="#c56a2d" stroke-width="3" width="160" x="800" y="115"/>
  <text fill="#17324d" font-family="Arial, sans-serif" font-size="26" font-weight="bold" text-anchor="middle" x="880.0" y="147.0">action</text>
  <rect fill="#eaf3f8" height="80" rx="16" ry="16" stroke="#2f6f9f" stroke-width="3" width="160" x="200" y="385"/>
  <text fill="#17324d" font-family="Arial, sans-serif" font-size="26" font-weight="bold" text-anchor="middle" x="280.0" y="417.0">base rate</text>
  <rect fill="#eaf3f8" height="80" rx="16" ry="16" stroke="#2f6f9f" stroke-width="3" width="160" x="400" y="385"/>
  <text fill="#17324d" font-family="Arial, sans-serif" font-size="26" font-weight="bold" text-anchor="middle" x="480.0" y="417.0">comparison</text>
  <rect fill="#eaf3f8" height="80" rx="16" ry="16" stroke="#2f6f9f" stroke-width="3" width="160" x="600" y="385"/>
  <text fill="#17324d" font-family="Arial, sans-serif" font-size="26" font-weight="bold" text-anchor="middle" x="680.0" y="417.0">mechanism</text>
  <rect fill="#eaf3f8" height="80" rx="16" ry="16" stroke="#2f6f9f" stroke-width="3" width="160" x="800" y="385"/>
  <text fill="#17324d" font-family="Arial, sans-serif" font-size="26" font-weight="bold" text-anchor="middle" x="880.0" y="417.0">uncertainty</text>

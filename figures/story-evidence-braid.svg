  <polygon fill="#2b7a78" points="600,195 599.4043943329597,209.98817046504973 586.7220607874951,201.97827559423"/>
  <line stroke="#c56a2d" stroke-width="4" x1="960" x2="1030" y1="155" y2="265"/>
  <polygon fill="#c56a2d" points="1030,265 1016.698321618381,258.06708198289 1029.3532439343626,250.01394959999263"/>
  <line stroke="#2f6f9f" stroke-width="4" x1="960" x2="1030" y1="425" y2="315"/>
  <polygon fill="#2f6f9f" points="1030,315 1029.3532439343626,329.9860504000074 1016.698321618381,321.93291801711"/>
  <rect fill="#edf4ed" height="115" rx="16" ry="16" stroke="#447c55" stroke-width="3" width="170" x="1000" y="235"/>
  <text fill="#17324d" font-family="Arial, sans-serif" font-size="26" font-weight="bold" text-anchor="middle" x="1085.0" y="284.5">Informed judgment</text>
  <text fill="#66737f" font-family="Arial, sans-serif" font-size="17" font-weight="normal" text-anchor="middle" x="1085.0" y="318.5">attention + scale + agency</text>
  <text fill="#66737f" font-family="Arial, sans-serif" font-size="21" font-weight="normal" text-anchor="middle" x="600" y="575">Anecdote without evidence distorts scale; evidence without lived meaning may never guide action.</text>
</svg>

  <text fill="#17324d" font-family="Arial, sans-serif" font-size="34" font-weight="bold" text-anchor="middle" x="600" y="48">Story creates meaning; evidence creates proportion</text>
  <text fill="#c56a2d" font-family="Arial, sans-serif" font-size="22" font-weight="bold" text-anchor="start" x="115" y="150">STORY STRAND</text>
  <text fill="#2f6f9f" font-family="Arial, sans-serif" font-size="22" font-weight="bold" text-anchor="start" x="115" y="420">EVIDENCE STRAND</text>

<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="390" viewBox="0 95 1200 390" role="img" aria-labelledby="title desc">
  <title id="title">Synthesis of income and subjective well-being evidence</title>
  <desc id="desc">Three schematic panels plot well-being against log annual household income. Kahneman and Deaton (2010): solid life evaluation rises, while dashed emotional well-being flattens. Killingsworth (2021): average emotional well-being rises. Killingsworth et al. (2023): emotional well-being flattens mainly among the least happy respondents and rises among happier respondents.</desc>
  <defs>
    <marker id="blueArrow" viewBox="0 0 10 8" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0.5 0.8 L9 4 L0.5 7.2 Z" fill="#2f6f9f" />
    </marker>
    <marker id="orangeArrow" viewBox="0 0 10 8" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0.5 0.8 L9 4 L0.5 7.2 Z" fill="#c56a2d" />
    </marker>
    <filter id="shadow">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#17324d" flood-opacity="0.12" />
    </filter>
  </defs>
  <rect width="1200" height="585" fill="#ffffff" x="0" y="95" />
  <rect x="45" y="115" width="350" height="350" rx="20" fill="#f7fafc" stroke="#c8d7e2" stroke-width="2" />
  <text x="220" y="165" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="600" fill="#2f6f9f">Kahneman and Deaton (2010)</text>
  <line x1="110" y1="420" x2="350" y2="420" stroke="#8fa0ad" stroke-width="2" />
  <line x1="110" y1="240" x2="110" y2="420" stroke="#8fa0ad" stroke-width="2" />
  <text x="230" y="447" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#66737f">log annual household income</text>
  <path d="M115 400 L335 265" fill="none" stroke="#2f6f9f" stroke-width="5" />
  <path d="M115 395 C170 322 210 299 270 299 L335 299" fill="none" stroke="#c56a2d" stroke-width="5" stroke-dasharray="9 7" />
  <text x="355" y="247" text-anchor="end" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#2f6f9f">Life evaluation</text>
  <text x="370" y="365" text-anchor="end" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#c56a2d">
    <tspan x="370" dy="0">Emotional</tspan>
    <tspan x="370" dy="26">well-being</tspan>
  </text>
  <rect x="425" y="115" width="350" height="350" rx="20" fill="#f7fafc" stroke="#c8d7e2" stroke-width="2" />
  <text x="600" y="165" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="600" fill="#2f6f9f">Killingsworth (2021)</text>
  <line x1="490" y1="420" x2="730" y2="420" stroke="#8fa0ad" stroke-width="2" />
  <line x1="490" y1="240" x2="490" y2="420" stroke="#8fa0ad" stroke-width="2" />
  <text x="610" y="447" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#66737f">log annual household income</text>
  <path d="M495 398 L715 265" fill="none" stroke="#447c55" stroke-width="5" />
  <text x="750" y="218" text-anchor="end" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#447c55">
    <tspan x="750" dy="0">Average</tspan>
    <tspan x="750" dy="27">emotional well-being</tspan>
  </text>
  <rect x="805" y="115" width="350" height="350" rx="20" fill="#f7fafc" stroke="#c8d7e2" stroke-width="2" />
  <text x="980" y="165" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="600" fill="#2f6f9f">Killingsworth et al. (2023)</text>
  <line x1="870" y1="420" x2="1110" y2="420" stroke="#8fa0ad" stroke-width="2" />
  <line x1="870" y1="240" x2="870" y2="420" stroke="#8fa0ad" stroke-width="2" />
  <text x="990" y="447" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#66737f">log annual household income</text>
  <path d="M875 400 C935 330 990 312 1095 310" fill="none" stroke="#a74343" stroke-width="5" />
  <path d="M875 345 C930 309 985 277 1095 235" fill="none" stroke="#447c55" stroke-width="5" />
  <text x="1130" y="367" text-anchor="end" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#a74343">
    <tspan x="1130" dy="0">Least happy</tspan>
    <tspan x="1130" dy="26">respondents</tspan>
  </text>
  <text x="1130" y="220" text-anchor="end" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#447c55">Happier respondents</text>
</svg>

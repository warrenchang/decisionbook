<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="390" viewBox="0 95 1200 390" role="img" aria-labelledby="title desc">
  <title id="title">Synthesis of income and subjective well-being evidence</title>
  <desc id="desc">Three schematic panels summarize the 2010 finding of rising life evaluation and flattening emotional well-being, the 2021 finding of experienced well-being rising beyond the earlier threshold, and the 2023 reconciliation showing flattening mainly among the least happy group.</desc>
  <defs>
    <marker id="blueArrow" viewBox="0 0 10 8" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0.5 0.8 L9 4 L0.5 7.2 Z" fill="#2f6f9f"/></marker>
    <marker id="orangeArrow" viewBox="0 0 10 8" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0.5 0.8 L9 4 L0.5 7.2 Z" fill="#c56a2d"/></marker>
    <filter id="shadow"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#17324d" flood-opacity="0.12"/></filter>
  </defs>

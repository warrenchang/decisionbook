<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440" role="img" aria-labelledby="title desc">
  <title id="title">Income and well-being across three studies</title>
  <desc id="desc">A shared legend identifies solid blue lines as life evaluation and dashed orange lines as emotional well-being throughout three schematic panels. Kahneman and Deaton (2010): life evaluation rises while emotional well-being flattens. Killingsworth (2021): emotional well-being continues rising. Killingsworth et al. (2023): emotional well-being flattens mainly among the least happy respondents and continues rising among happier respondents. All horizontal axes show log annual household income.</desc>
  <rect width="1200" height="440" fill="#ffffff"/>
  <g font-family="Arial, sans-serif" fill="#344654">
    <g id="measure-legend" font-size="22">
      <line x1="303" y1="34" x2="351" y2="34" stroke="#2f6f9f" stroke-width="4" stroke-linecap="round"/>
      <text x="365" y="41">Life evaluation</text>
      <line x1="577" y1="34" x2="625" y2="34" stroke="#bf6b32" stroke-width="4" stroke-dasharray="9 7" stroke-linecap="round"/>
      <text x="639" y="41">Emotional well-being</text>
    </g>
    <g id="study-labels" font-size="18" fill="#647480" text-anchor="middle">
      <text x="207" y="94">Kahneman and Deaton (2010)</text>
      <text x="597" y="94">Killingsworth (2021)</text>
      <text x="987" y="94">Killingsworth et al. (2023)</text>
    </g>
    <g id="panel-dividers" stroke="#e5eaee" stroke-width="1.5">
      <line x1="410" y1="78" x2="410" y2="371"/>
      <line x1="800" y1="78" x2="800" y2="371"/>
    </g>
    <g id="axes" fill="none" stroke="#aab6bf" stroke-width="1.5">
      <path d="M67 134 V354 H347"/>
      <path d="M457 134 V354 H737"/>
      <path d="M847 134 V354 H1127"/>
    </g>
    <g id="curves" fill="none" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
      <path id="life-evaluation-2010" d="M75 337 L337 159" stroke="#2f6f9f"/>
      <g stroke="#bf6b32" stroke-dasharray="9 7">
        <path id="emotional-wellbeing-2010" d="M75 330 C139 255 190 222 252 222 H337"/>
        <path id="emotional-wellbeing-2021" d="M465 337 L727 159"/>
        <path id="emotional-wellbeing-happier-2023" d="M855 269 L1117 164"/>
        <path id="emotional-wellbeing-least-happy-2023" d="M855 337 C919 269 976 251 1044 251 H1117"/>
      </g>
    </g>
    <g id="respondent-annotations" font-size="19" fill="#647480" text-anchor="end">
      <text x="1135" y="143">Happier respondents</text>
      <text x="1135" y="320">Least happy respondents</text>
    </g>
    <text x="600" y="413" text-anchor="middle" font-size="21">Annual household income (log scale)</text>
  </g>
</svg>

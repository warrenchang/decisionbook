<svg role="img" aria-labelledby="title desc" xmlns:xlink="http://www.w3.org/1999/xlink" width="489.6pt" height="662.4pt" viewBox="0 0 489.6 662.4" xmlns="http://www.w3.org/2000/svg" version="1.1">
<title id="title">Laptop multitasking and lecture comprehension</title><desc id="desc">Two experiments by Sana and colleagues (2013). In Experiment 1, mean test scores were 66% for note-taking only and 55% with unrelated online tasks, n=20 per group. In Experiment 2, scores were 73% with no view of multitasking and 56% with a view, n=19 per group. Error bars are standard errors derived from rounded reported standard deviations. The experiments should not be compared as if they were one randomized design.</desc>


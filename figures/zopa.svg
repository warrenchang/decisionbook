<svg xmlns="http://www.w3.org/2000/svg" width="760" height="500" viewBox="0 0 760 500" role="img" aria-labelledby="title desc">
<title id="title">The zone of possible agreement</title><desc id="desc">A uniform number line marks prices from seven to eleven thousand euros. The seller’s reservation value is eight thousand and the buyer’s is ten thousand, leaving two thousand euros of bargaining surplus. At an endpoint one party is indifferent to its alternative; an interior price improves on both alternatives under these assumptions.</desc>
<rect width="760" height="500" fill="white"/>
<defs>
<marker id="a" viewBox="0 0 12 10" markerWidth="9" markerHeight="8" refX="11" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L11 5 L1 9 Z" fill="#2f6f9f"/></marker>
<marker id="g" viewBox="0 0 12 10" markerWidth="9" markerHeight="8" refX="11" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L11 5 L1 9 Z" fill="#3f7c59"/></marker>
<marker id="o" viewBox="0 0 12 10" markerWidth="9" markerHeight="8" refX="11" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L11 5 L1 9 Z" fill="#b95f2d"/></marker>
</defs>
<text x="380" y="48" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="31" font-weight="700" fill="#17324d">The zone of possible agreement</text>
<text x="380" y="88.3" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="31" font-weight="700" fill="#17324d">(ZOPA)</text>
<text x="380" y="150" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#3f7c59">Bargaining surplus = €2,000</text>
<rect x="230" y="192" width="300" height="70" fill="#edf5fa" stroke="#2f6f9f" stroke-width="2"/>
<line x1="50" y1="227" x2="710" y2="227" stroke="#17324d" stroke-width="2"/>
<line x1="80" y1="211" x2="80" y2="243" stroke="#17324d" stroke-width="2"/>
<text x="80" y="301" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="400" fill="#17324d">€7,000</text>
<line x1="230" y1="211" x2="230" y2="243" stroke="#17324d" stroke-width="2"/>
<text x="230" y="301" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="400" fill="#17324d">€8,000</text>
<line x1="380" y1="211" x2="380" y2="243" stroke="#17324d" stroke-width="2"/>
<text x="380" y="301" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="400" fill="#17324d">€9,000</text>
<line x1="530" y1="211" x2="530" y2="243" stroke="#17324d" stroke-width="2"/>
<text x="530" y="301" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="400" fill="#17324d">€10,000</text>
<line x1="680" y1="211" x2="680" y2="243" stroke="#17324d" stroke-width="2"/>
<text x="680" y="301" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="400" fill="#17324d">€11,000</text>
<text x="230" y="354" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#b95f2d">Seller’s</text>
<text x="230" y="390.4" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#b95f2d">minimum</text>
<text x="530" y="354" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#2f6f9f">Buyer’s</text>
<text x="530" y="390.4" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#2f6f9f">maximum</text>
<text x="380" y="447" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="400" fill="#53697d">At either boundary, one party is indifferent</text>
<text x="380" y="483.4" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="400" fill="#53697d">between the deal and its alternative.</text>
</svg>

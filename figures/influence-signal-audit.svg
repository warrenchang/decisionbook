<?xml version="1.0" encoding="utf-8" ?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink" baseProfile="full" height="650" version="1.1" viewBox="0 0 1200 650" width="1200">
  <defs/>
  <title>Influence signal audit</title>
  <desc>A trigger is evaluated by whether it tracks reality, whether material facts are visible, and whether refusal remains meaningful. The outcome distinguishes informative influence from manipulation.</desc>
  <rect fill="white" height="650" width="1200" x="0" y="0"/>
  <text fill="#17324d" font-family="Arial, sans-serif" font-size="34" font-weight="bold" text-anchor="middle" x="600" y="48">A four-question audit for influence triggers</text>
  <rect fill="#f7f1e8" height="110" rx="16" ry="16" stroke="#c56a2d" stroke-width="3" width="200" x="60" y="235"/>
  <text fill="#17324d" font-family="Arial, sans-serif" font-size="26" font-weight="bold" text-anchor="middle" x="160.0" y="282.0">Trigger detected</text>
  <text fill="#66737f" font-family="Arial, sans-serif" font-size="17" font-weight="normal" text-anchor="middle" x="160.0" y="316.0">authority • scarcity • liking • reciprocity</text>
  <line stroke="#17324d" stroke-width="4" x1="260" x2="385" y1="290" y2="290"/>
  <polygon fill="#17324d" points="385,290 372.0096189432334,297.5 372.0096189432334,282.5"/>
  <rect fill="#eaf3f8" height="105" rx="16" ry="16" stroke="#2f6f9f" stroke-width="3" width="225" x="385" y="155"/>
  <text fill="#17324d" font-family="Arial, sans-serif" font-size="26" font-weight="bold" text-anchor="middle" x="497.5" y="199.5">1. Does the cue track reality?</text>
  <text fill="#66737f" font-family="Arial, sans-serif" font-size="17" font-weight="normal" text-anchor="middle" x="497.5" y="233.5">relevant expertise, demand, obligation?</text>
  <rect fill="#eaf3f8" height="105" rx="16" ry="16" stroke="#2f6f9f" stroke-width="3" width="225" x="385" y="365"/>
  <text fill="#17324d" font-family="Arial, sans-serif" font-size="26" font-weight="bold" text-anchor="middle" x="497.5" y="409.5">2. Are material facts visible?</text>
  <text fill="#66737f" font-family="Arial, sans-serif" font-size="17" font-weight="normal" text-anchor="middle" x="497.5" y="443.5">costs, alternatives, uncertainty?</text>
  <line stroke="#17324d" stroke-width="4" x1="610" x2="760" y1="207" y2="240"/>
  <polygon fill="#17324d" points="760,240 745.7015528504548,244.5336970688022 748.9244795905817,229.88403006822585"/>
  <line stroke="#17324d" stroke-width="4" x1="610" x2="760" y1="417" y2="360"/>
  <polygon fill="#17324d" points="760,360 750.5209382872255,371.62529092304413 745.1926718778719,357.6035372142189"/>
  <rect fill="#eaf3f8" height="160" rx="16" ry="16" stroke="#2f6f9f" stroke-width="3" width="220" x="760" y="220"/>
  <text fill="#17324d" font-family="Arial, sans-serif" font-size="26" font-weight="bold" text-anchor="middle" x="870.0" y="292.0">3. Can the person refuse?</text>
  <text fill="#66737f" font-family="Arial, sans-serif" font-size="17" font-weight="normal" text-anchor="middle" x="870.0" y="326.0">time to think • no hidden penalty • reversible exit</text>
  <line stroke="#447c55" stroke-width="4" x1="980" x2="1070" y1="300" y2="220"/>
  <polygon fill="#447c55" points="1070,220 1065.2735969361454,234.23590931686437 1055.3081393536966,223.02476953660945"/>
  <line stroke="#a74343" stroke-width="4" x1="980" x2="1070" y1="300" y2="430"/>
  <polygon fill="#a74343" points="1070,430 1056.4393040363518,423.58848496987656 1068.7721869110087,415.05033528742194"/>
  <rect fill="#edf4ed" height="95" rx="16" ry="16" stroke="#447c55" stroke-width="3" width="150" x="1030" y="145"/>
  <text fill="#17324d" font-family="Arial, sans-serif" font-size="26" font-weight="bold" text-anchor="middle" x="1105.0" y="184.5">Legitimate</text>
  <text fill="#66737f" font-family="Arial, sans-serif" font-size="17" font-weight="normal" text-anchor="middle" x="1105.0" y="218.5">informative + agency-preserving</text>
  <rect fill="#f9e7e7" height="95" rx="16" ry="16" stroke="#a74343" stroke-width="3" width="150" x="1030" y="405"/>
  <text fill="#17324d" font-family="Arial, sans-serif" font-size="26" font-weight="bold" text-anchor="middle" x="1105.0" y="444.5">Manipulative</text>
  <text fill="#66737f" font-family="Arial, sans-serif" font-size="17" font-weight="normal" text-anchor="middle" x="1105.0" y="478.5">counterfeit cue + obscured exit</text>
  <text fill="#66737f" font-family="Arial, sans-serif" font-size="22" font-weight="normal" text-anchor="middle" x="600" y="590">Ethical influence remains defensible when its mechanism is made explicit.</text>
</svg>

<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Why later loses to now</title>
  <desc id="desc">A decision point branches to a smaller sooner outcome and a larger later outcome. The delayed path passes through uncertainty, weak future imagery, friction, and changing states. Four design levers strengthen the bridge to the future.</desc>
  <defs>
    <marker id="blueArrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0 L12 6 L0 12 Z" fill="#25678f"/></marker>
    <marker id="orangeArrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0 L12 6 L0 12 Z" fill="#b95f2d"/></marker>
    <filter id="shadow"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#183047" flood-opacity="0.12"/></filter>
  </defs>
  <rect width="1200" height="720" fill="#fff"/>
  <text x="600" y="52" text-anchor="middle" font-family="Georgia, serif" font-size="34" font-weight="700" fill="#183047">Why later loses to now</text>
  <text x="600" y="84" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#607080">Delay changes attention, uncertainty, imagination, emotion, and the credibility of the outcome.</text>

  <g filter="url(#shadow)" font-family="Arial, sans-serif">
    <rect x="60" y="245" width="220" height="130" rx="18" fill="#eaf3f8" stroke="#25678f" stroke-width="3"/>
    <text x="170" y="295" text-anchor="middle" font-size="25" font-weight="700" fill="#183047">Choice point</text>
    <text x="170" y="330" text-anchor="middle" font-size="17" fill="#607080">what matters now</text>
    <text x="170" y="354" text-anchor="middle" font-size="17" fill="#607080">and later?</text>

    <rect x="880" y="135" width="260" height="130" rx="18" fill="#f7f1e8" stroke="#b95f2d" stroke-width="3"/>
    <text x="1010" y="185" text-anchor="middle" font-size="24" font-weight="700" fill="#183047">Smaller, sooner</text>
    <text x="1010" y="220" text-anchor="middle" font-size="17" fill="#607080">salient • certain • relief now</text>

    <rect x="880" y="455" width="260" height="130" rx="18" fill="#edf4ed" stroke="#447c55" stroke-width="3"/>
    <text x="1010" y="505" text-anchor="middle" font-size="24" font-weight="700" fill="#183047">Larger, later</text>
    <text x="1010" y="540" text-anchor="middle" font-size="17" fill="#607080">valuable if the path survives</text>
  </g>

  <line x1="280" y1="285" x2="877" y2="200" stroke="#b95f2d" stroke-width="5" marker-end="url(#orangeArrow)"/>
  <text x="550" y="205" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#b95f2d">immediate pull</text>

  <path d="M280 335 C430 430 710 470 877 518" fill="none" stroke="#25678f" stroke-width="5" marker-end="url(#blueArrow)"/>

  <g font-family="Arial, sans-serif">
    <rect x="360" y="360" width="145" height="72" rx="14" fill="#f7f9fc" stroke="#d7e0e7" stroke-width="2"/>
    <text x="432" y="392" text-anchor="middle" font-size="18" font-weight="700" fill="#183047">Uncertainty</text>
    <text x="432" y="416" text-anchor="middle" font-size="14" fill="#607080">will it arrive?</text>
    <rect x="525" y="400" width="145" height="72" rx="14" fill="#f7f9fc" stroke="#d7e0e7" stroke-width="2"/>
    <text x="597" y="432" text-anchor="middle" font-size="18" font-weight="700" fill="#183047">Weak image</text>
    <text x="597" y="456" text-anchor="middle" font-size="14" fill="#607080">can I feel it?</text>
    <rect x="690" y="420" width="145" height="72" rx="14" fill="#f7f9fc" stroke="#d7e0e7" stroke-width="2"/>
    <text x="762" y="452" text-anchor="middle" font-size="18" font-weight="700" fill="#183047">Friction</text>
    <text x="762" y="476" text-anchor="middle" font-size="14" fill="#607080">can I act now?</text>
  </g>

  <text x="60" y="635" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#607080" letter-spacing="1.1">DESIGN THE BRIDGE</text>
  <g font-family="Arial, sans-serif" font-size="17" fill="#183047">
    <rect x="260" y="605" width="205" height="70" rx="14" fill="#eaf3f8" stroke="#25678f" stroke-width="2"/>
    <text x="362" y="647" text-anchor="middle">Make future concrete</text>
    <rect x="485" y="605" width="205" height="70" rx="14" fill="#edf4ed" stroke="#447c55" stroke-width="2"/>
    <text x="587" y="647" text-anchor="middle">Reduce uncertainty</text>
    <rect x="710" y="605" width="205" height="70" rx="14" fill="#f7f1e8" stroke="#b95f2d" stroke-width="2"/>
    <text x="812" y="637" text-anchor="middle">Add immediate</text><text x="812" y="660" text-anchor="middle">bridge reward</text>
    <rect x="935" y="605" width="205" height="70" rx="14" fill="#f5ebf5" stroke="#795a8a" stroke-width="2"/>
    <text x="1037" y="637" text-anchor="middle">Commit before</text><text x="1037" y="660" text-anchor="middle">the hot state</text>
  </g>
</svg>

<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Meaning is inferred, tested, and repaired</title>
  <desc id="desc">A message leads to several possible interpretations. Words, tone, relationship, history, power, culture, local context, and common ground provide evidence for contextual inference. Questions, reflection, verification, and correction then establish shared-enough meaning or repair it. A feedback arrow shows that communication is joint construction rather than recovery of a fixed hidden quantity.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8.5" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1,1 L8.5,5 L1,9 Z" fill="#47647e"/></marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="10" refX="8.5" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1,1 L8.5,5 L1,9 Z" fill="#3f7c59"/></marker>
  </defs>
  <rect width="1200" height="720" fill="#ffffff"/>
  <rect x="1.5" y="1.5" width="1197" height="717" rx="28" fill="none" stroke="#d5e1ea" stroke-width="3"/>
  <text x="600" y="50" text-anchor="middle" font-family="Arial, sans-serif" font-size="35" font-weight="700" fill="#17324d">Meaning is inferred, tested, and repaired</text>
  <text x="600" y="83" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" fill="#586d80">A message constrains interpretation; it does not contain a fixed hidden quantity of meaning.</text>

  <g font-family="Arial, sans-serif">
    <rect x="38" y="205" width="210" height="170" rx="20" fill="#183047"/>
    <text x="143" y="248" text-anchor="middle" font-size="22" font-weight="700" fill="#ffffff">UTTERANCE</text>
    <text x="143" y="289" text-anchor="middle" font-size="19" fill="#dbe8f0">“We need to discuss</text>
    <text x="143" y="318" text-anchor="middle" font-size="19" fill="#dbe8f0">accountability.”</text>
    <text x="143" y="353" text-anchor="middle" font-size="16" fill="#b9cedc">words + delivery</text>

    <rect x="300" y="150" width="280" height="280" rx="20" fill="#eef4f8" stroke="#7892a8" stroke-width="3"/>
    <text x="440" y="190" text-anchor="middle" font-size="21" font-weight="700" fill="#17324d">POSSIBLE</text>
    <text x="440" y="218" text-anchor="middle" font-size="21" font-weight="700" fill="#17324d">INTERPRETATIONS</text>
    <rect x="330" y="244" width="220" height="46" rx="14" fill="#ffffff" stroke="#b7c8d6" stroke-width="2"/><text x="440" y="274" text-anchor="middle" font-size="17" fill="#40566a">clarify ownership</text>
    <rect x="330" y="307" width="220" height="46" rx="14" fill="#ffffff" stroke="#b7c8d6" stroke-width="2"/><text x="440" y="337" text-anchor="middle" font-size="17" fill="#40566a">assign blame</text>
    <rect x="330" y="370" width="220" height="46" rx="14" fill="#ffffff" stroke="#b7c8d6" stroke-width="2"/><text x="440" y="400" text-anchor="middle" font-size="17" fill="#40566a">signal a warning</text>

    <rect x="632" y="150" width="250" height="280" rx="20" fill="#f8f1e7" stroke="#bf682d" stroke-width="3"/>
    <text x="757" y="190" text-anchor="middle" font-size="21" font-weight="700" fill="#17324d">CONTEXTUAL</text>
    <text x="757" y="218" text-anchor="middle" font-size="21" font-weight="700" fill="#17324d">INFERENCE</text>
    <text x="757" y="260" text-anchor="middle" font-size="17" fill="#40566a">intent • tone • emotion</text>
    <text x="757" y="292" text-anchor="middle" font-size="17" fill="#40566a">relationship • history</text>
    <text x="757" y="324" text-anchor="middle" font-size="17" fill="#40566a">power • culture • setting</text>
    <text x="757" y="356" text-anchor="middle" font-size="17" fill="#40566a">common ground</text>
    <rect x="670" y="378" width="174" height="34" rx="12" fill="#ffffff" stroke="#dfb58e" stroke-width="2"/>
    <text x="757" y="401" text-anchor="middle" font-size="16" fill="#7a5c47">evidence, not certainty</text>

    <rect x="934" y="150" width="228" height="280" rx="20" fill="#eaf4ec" stroke="#3f7c59" stroke-width="3"/>
    <text x="1048" y="190" text-anchor="middle" font-size="21" font-weight="700" fill="#17324d">GROUNDING</text>
    <text x="1048" y="232" text-anchor="middle" font-size="17" fill="#40566a">ask • listen • reflect</text>
    <text x="1048" y="264" text-anchor="middle" font-size="17" fill="#40566a">test the interpretation</text>
    <text x="1048" y="296" text-anchor="middle" font-size="17" fill="#40566a">correct • clarify • repair</text>
    <rect x="965" y="330" width="166" height="72" rx="15" fill="#ffffff" stroke="#8fb69a" stroke-width="2"/>
    <text x="1048" y="358" text-anchor="middle" font-size="16" font-weight="700" fill="#315f45">SHARED-ENOUGH</text>
    <text x="1048" y="382" text-anchor="middle" font-size="16" font-weight="700" fill="#315f45">FOR THIS PURPOSE</text>
  </g>

  <path d="M248 290 H288" fill="none" stroke="#47647e" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/>
  <path d="M580 290 H620" fill="none" stroke="#47647e" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/>
  <path d="M882 290 H922" fill="none" stroke="#47647e" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/>
  <path d="M1048 430 V486 Q1048 504 1030 504 H458 Q440 504 440 442" fill="none" stroke="#3f7c59" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-green)"/>
  <rect x="548" y="478" width="390" height="52" rx="26" fill="#eaf4ec" stroke="#3f7c59" stroke-width="2.5"/>
  <text x="743" y="511" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#315f45">Correction revises the working interpretation</text>

  <rect x="110" y="575" width="980" height="82" rx="19" fill="#f7f9fb" stroke="#b7c8d6" stroke-width="2.5"/>
  <text x="600" y="607" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#17324d">DESIGN FOR RECOVERABILITY</text>
  <text x="600" y="637" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="#586d80">add context • state intent • name the next action • invite correction • preserve a repair path</text>
  <text x="600" y="694" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#647586">Author's teaching synthesis informed by grounding theory (Clark &amp; Brennan, 1991).</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">The communication iceberg</title>
  <desc id="desc">Words form the small visible tip of communication. Beneath the surface, meaning is reconstructed from intent, emotion, relationship, history, power, culture, context, and common knowledge.</desc>
  <defs>
    <filter id="shadow" x="-15%" y="-15%" width="130%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#16324a" flood-opacity="0.14"/>
    </filter>
    <linearGradient id="sea" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#dff3fb"/>
      <stop offset="1" stop-color="#b9deee"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="720" fill="#ffffff"/>
  <text x="600" y="58" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700" fill="#183047">Words are the tip; meaning is reconstructed below</text>
  <text x="600" y="94" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#60758a">The same sentence can carry different meanings when the hidden context changes.</text>

  <path d="M0 274 C170 254 340 292 520 272 C700 252 870 290 1200 266 L1200 720 L0 720 Z" fill="url(#sea)"/>
  <path d="M0 274 C170 254 340 292 520 272 C700 252 870 290 1200 266" fill="none" stroke="#2b75a0" stroke-width="5"/>
  <text x="1058" y="245" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#2b75a0">VISIBLE</text>
  <text x="1058" y="310" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#2b75a0">SUBMERGED</text>

  <path d="M474 265 L600 126 L726 265 Z" fill="#f4f8fb" stroke="#7993a9" stroke-width="4" filter="url(#shadow)"/>
  <text x="600" y="198" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="700" fill="#183047">WORDS</text>
  <text x="600" y="230" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#60758a">literal content</text>

  <path d="M355 286 L845 286 L785 642 L415 642 Z" fill="#e8f1f6" stroke="#7993a9" stroke-width="4" filter="url(#shadow)"/>
  <text x="600" y="343" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="700" fill="#183047">RECONSTRUCTED MEANING</text>

  <g font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#183047">
    <g>
      <rect x="406" y="381" width="174" height="55" rx="16" fill="#ffffff" stroke="#9bb3c4" stroke-width="2"/>
      <text x="493" y="416" text-anchor="middle">intent</text>
    </g>
    <g>
      <rect x="620" y="381" width="174" height="55" rx="16" fill="#ffffff" stroke="#9bb3c4" stroke-width="2"/>
      <text x="707" y="416" text-anchor="middle">emotion</text>
    </g>
    <g>
      <rect x="406" y="456" width="174" height="55" rx="16" fill="#ffffff" stroke="#9bb3c4" stroke-width="2"/>
      <text x="493" y="491" text-anchor="middle">relationship</text>
    </g>
    <g>
      <rect x="620" y="456" width="174" height="55" rx="16" fill="#ffffff" stroke="#9bb3c4" stroke-width="2"/>
      <text x="707" y="491" text-anchor="middle">history</text>
    </g>
    <g>
      <rect x="406" y="531" width="174" height="55" rx="16" fill="#ffffff" stroke="#9bb3c4" stroke-width="2"/>
      <text x="493" y="566" text-anchor="middle">power · culture</text>
    </g>
    <g>
      <rect x="620" y="531" width="174" height="55" rx="16" fill="#ffffff" stroke="#9bb3c4" stroke-width="2"/>
      <text x="707" y="556" text-anchor="middle">context · common</text>
      <text x="707" y="580" text-anchor="middle">knowledge</text>
    </g>
  </g>

  <rect x="64" y="374" width="250" height="156" rx="22" fill="#fff8ea" stroke="#d39b34" stroke-width="3"/>
  <text x="189" y="416" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" fill="#7d5718">RECOVERABILITY</text>
  <text x="189" y="452" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#5f4c2a">add context · state intent</text>
  <text x="189" y="482" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#5f4c2a">name the next action</text>
  <text x="189" y="512" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#5f4c2a">invite correction</text>

  <rect x="886" y="374" width="250" height="156" rx="22" fill="#edf7ef" stroke="#4f8b61" stroke-width="3"/>
  <text x="1011" y="416" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" fill="#2d6740">GROUNDING</text>
  <text x="1011" y="452" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#355e43">ask · listen · reflect</text>
  <text x="1011" y="482" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#355e43">verify the interpretation</text>
  <text x="1011" y="512" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#355e43">repair when needed</text>

  <text x="600" y="690" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#183047">Do not ask only, “Were the words clear?” Ask, “Can the intended meaning be recovered?”</text>
</svg>

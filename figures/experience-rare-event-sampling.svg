<text x="1027" y="407" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.0" font-weight="400" fill="#66737f" >has not appeared</text>
<rect x="930" y="470" width="195" height="125" rx="14" fill="#ffffff" stroke="#c8d7e2" stroke-width="2" />
<text x="1027" y="502" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.0" font-weight="700" fill="#17324d" >Absence from a sample</text>

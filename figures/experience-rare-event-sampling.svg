<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="725" viewBox="0 0 1200 725" role="img" aria-labelledby="title desc">
  <title id="title">Probability that a rare event is absent from an experience sample</title>
  <desc id="desc">Two curves show the chance that a one-percent or five-percent event has not appeared after up to one hundred independent observations. A highlighted band marks samples of eleven to nineteen observations. At fifteen observations, the absence probabilities are eighty-six percent and forty-six percent.</desc>
  <defs>
    <marker id="blueArrow" viewBox="0 0 10 8" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0.5 0.8 L9 4 L0.5 7.2 Z" fill="#2f6f9f"/></marker>
    <marker id="orangeArrow" viewBox="0 0 10 8" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0.5 0.8 L9 4 L0.5 7.2 Z" fill="#c56a2d"/></marker>
    <filter id="shadow"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#17324d" flood-opacity="0.12"/></filter>
  </defs>
  <rect width="1200" height="725" fill="#ffffff"/>
<text x="600" y="48" text-anchor="middle" font-family="Georgia, serif" font-size="33.0" font-weight="700" fill="#17324d" >A rare event can disappear from a small experience sample</text>
<text x="600" y="80" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.0" font-weight="400" fill="#66737f" >The probability of seeing no rare event after n independent draws is (1 − p)ⁿ.</text>

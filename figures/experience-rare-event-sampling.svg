<text x="1027" y="554" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.0" font-weight="700" fill="#17324d" >impossibility.</text>
<text x="600" y="700" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#66737f" >Mathematical derivation for independent sampling; real experience can also be selective, dependent, censored, or remembered unevenly.</text>

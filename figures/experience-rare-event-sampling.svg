<text x="390.0" y="637" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#66737f" >40</text>
<line x1="530.0" y1="150" x2="530.0" y2="610" stroke="#dce5ea" stroke-width="1"/>
<text x="530.0" y="637" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#66737f" >60</text>

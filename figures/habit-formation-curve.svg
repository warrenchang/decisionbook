<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">Habit automaticity grows gradually, not by a fixed schedule</title>
  <desc id="desc">A smooth curve rises quickly at first and then approaches a plateau. Below it, a range line shows that modeled time to reach 95 percent of the plateau ranged from 18 to 254 days, with a median of 66 days.</desc>

  <rect width="1200" height="620" fill="#ffffff"/>
  <text x="600" y="52" text-anchor="middle" font-family="Arial, sans-serif" font-size="34" font-weight="700" fill="#17324d">Habit automaticity grows gradually—not by a fixed schedule</text>
  <text x="600" y="83" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#5e6f7d">Lally et al. (2010)</text>

  <line x1="150" y1="400" x2="1065" y2="400" stroke="#17324d" stroke-width="2.5"/>
  <line x1="150" y1="400" x2="150" y2="130" stroke="#17324d" stroke-width="2.5"/>
  <text x="610" y="438" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#17324d">Time</text>
  <text x="74" y="265" transform="rotate(-90 74 265)" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#17324d">Automaticity</text>

  <line x1="176" y1="151" x2="1035" y2="151" stroke="#9cb2c3" stroke-width="2" stroke-dasharray="8 8"/>
  <text x="1042" y="157" font-family="Arial, sans-serif" font-size="18" fill="#5e6f7d">plateau</text>
  <path d="M176 382 C350 215 570 151 1035 151" fill="none" stroke="#2f6f9f" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>

  <text x="600" y="492" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#17324d">Modeled time to reach 95% of the plateau</text>
  <line x1="215" y1="532" x2="985" y2="532" stroke="#9cb2c3" stroke-width="7" stroke-linecap="round"/>
  <circle cx="215" cy="532" r="8" fill="#2f6f9f"/>
  <circle cx="372" cy="532" r="11" fill="#c56a2d"/>
  <circle cx="985" cy="532" r="8" fill="#2f6f9f"/>
  <text x="215" y="574" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#17324d">18 days</text>
  <text x="372" y="574" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#a6531e">median 66 days</text>
  <text x="985" y="574" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#17324d">254 days</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="760" height="930" viewBox="0 0 760 930" role="img" aria-labelledby="title desc" data-layout="compact">
<title id="title">Habit formation has no fixed deadline</title><desc id="desc">A schematic automaticity curve approaches a plateau. The study summary separately reports modeled time to reach 95 percent of the plateau: 18 to 254 days, median 66. These are study estimates, not a guarantee for an individual habit.</desc>
<defs><style>
text {font-family:Arial,Helvetica,sans-serif;fill:#183047}
.title {font-family:Georgia,serif;font-size:38px;font-weight:bold}
</style>
<marker id="blue" markerWidth="8" markerHeight="8" refX="8" refY="4" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8 Z" fill="#25678f"/></marker>
<marker id="green" markerWidth="8" markerHeight="8" refX="8" refY="4" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8 Z" fill="#2b7a78"/></marker>
<marker id="warm" markerWidth="8" markerHeight="8" refX="8" refY="4" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8 Z" fill="#b95f2d"/></marker>
</defs><rect width="760" height="930" fill="white"/>
<text x="380" y="56" text-anchor="middle" font-size="38" font-weight="normal" style="fill:#183047" class="title"><tspan x="380" dy="0">Habit formation has</tspan><tspan x="380" dy="47.12">no fixed deadline</tspan></text>
<text x="380" y="156" text-anchor="middle" font-size="28" font-weight="normal" style="fill:#183047" class=""><tspan x="380" dy="0">Illustrative shape of automaticity</tspan></text>
<path d="M115 204 V475 H692" fill="none" stroke="#183047" stroke-width="2.5"/><path d="M127 454 C165 250 271 239 675 229" fill="none" stroke="#25678f" stroke-width="7" stroke-linecap="round"/><path d="M127 217 H681" stroke="#607080" stroke-width="2" stroke-dasharray="7 6"/>
<text x="380" y="519" text-anchor="middle" font-size="28" font-weight="normal" style="fill:#183047" class=""><tspan x="380" dy="0">Time</tspan></text>
<text x="52" y="353" font-size="28" text-anchor="middle" transform="rotate(-90 52 353)">Automaticity</text>
<text x="675" y="201" text-anchor="end" font-size="28" font-weight="normal" style="fill:#183047" class=""><tspan x="675" dy="0">Plateau</tspan></text>
<rect x="55" y="587" width="650" height="280" rx="18" fill="#f4f7fa" stroke="#25678f" stroke-width="2.5"/>
<text x="380.0" y="630" text-anchor="middle" font-size="31" font-weight="bold" style="fill:#25678f" class=""><tspan x="380.0" dy="0">What Lally et al. (2010) estimated</tspan></text>
<text x="380" y="681" text-anchor="middle" font-size="28" font-weight="normal" style="fill:#183047" class=""><tspan x="380" dy="0">Modeled days to reach</tspan><tspan x="380" dy="34.72">95% of the plateau</tspan></text>
<text x="202" y="782" text-anchor="middle" font-size="44" font-weight="bold" style="fill:#25678f" class=""><tspan x="202" dy="0">18–254</tspan></text>
<text x="202" y="827" text-anchor="middle" font-size="28" font-weight="normal" style="fill:#183047" class=""><tspan x="202" dy="0">Range</tspan></text>
<text x="558" y="782" text-anchor="middle" font-size="44" font-weight="bold" style="fill:#b95f2d" class=""><tspan x="558" dy="0">66</tspan></text>
<text x="558" y="827" text-anchor="middle" font-size="28" font-weight="normal" style="fill:#183047" class=""><tspan x="558" dy="0">Median</tspan></text>
</svg>

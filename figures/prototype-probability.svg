<svg xmlns="http://www.w3.org/2000/svg" width="760" height="1120" viewBox="0 0 760 1120" role="img" aria-labelledby="title desc">
<title id="title">Representativeness and probability</title><desc id="desc">The representativeness heuristic uses category fit to form a quick impression. A separate probability update combines prior probability with evidence that distinguishes alternatives. Similarity can suggest a hypothesis but does not replace those comparisons.</desc>
<defs><marker id="blue-arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L9 4 L0 8 Z" fill="#2f6f9f"/></marker><marker id="orange-arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L9 4 L0 8 Z" fill="#c56a2d"/></marker></defs>
<rect width="760" height="1120" fill="white"/>
<text text-anchor="middle" font-family="Arial, sans-serif" font-size="36" font-weight="700" fill="#17324d"><tspan x="380" y="54">Representativeness</tspan><tspan x="380" y="98">and probability</tspan></text>
<rect x="70" y="155" width="620" height="135" rx="18" fill="#f7f1e8" stroke="#c56a2d" stroke-width="2.5"/>
<text text-anchor="middle" font-family="Arial, sans-serif" font-size="32" font-weight="700" fill="#17324d"><tspan x="380" y="200">Representativeness</tspan></text>
<text text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="400" fill="#17324d"><tspan x="380" y="249">How closely does the case fit a category?</tspan></text>
<path d="M380 290 V350" fill="none" stroke="#c56a2d" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#orange-arrow)"/>
<rect x="120" y="350" width="520" height="111" rx="18" fill="#f7f1e8" stroke="#c56a2d" stroke-width="2.5"/>
<text text-anchor="middle" font-family="Arial, sans-serif" font-size="32" font-weight="700" fill="#17324d"><tspan x="380" y="393">Quick impression</tspan></text>
<text text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="400" fill="#17324d"><tspan x="380" y="434">“It fits, so it seems likely.”</tspan></text>
<text text-anchor="middle" font-family="Arial, sans-serif" font-size="32" font-weight="700" fill="#17324d"><tspan x="380" y="551">Probability update</tspan></text>
<rect x="30" y="600" width="320" height="174" rx="18" fill="#eaf3f8" stroke="#2f6f9f" stroke-width="2.5"/>
<rect x="410" y="600" width="320" height="174" rx="18" fill="#eaf3f8" stroke="#2f6f9f" stroke-width="2.5"/>
<text text-anchor="middle" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#17324d"><tspan x="190" y="644">Prior probability</tspan></text>
<text text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="400" fill="#17324d"><tspan x="190" y="694">How common is</tspan><tspan x="190" y="730">the category?</tspan></text>
<text text-anchor="middle" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#17324d"><tspan x="570" y="644">Diagnostic evidence</tspan></text>
<text text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="400" fill="#17324d"><tspan x="570" y="694">Does this evidence</tspan><tspan x="570" y="730">separate alternatives?</tspan></text>
<path d="M190 774 V815 H570 V774" fill="none" stroke="#2f6f9f" stroke-width="3" stroke-linejoin="round"/>
<path d="M380 815 V852" fill="none" stroke="#2f6f9f" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#blue-arrow)"/>
<rect x="90" y="852" width="580" height="172" rx="18" fill="#edf4ed" stroke="#447c55" stroke-width="2.5"/>
<text text-anchor="middle" font-family="Arial, sans-serif" font-size="32" font-weight="700" fill="#17324d"><tspan x="380" y="900">Updated probability</tspan></text>
<text text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="400" fill="#17324d"><tspan x="380" y="947">Combine the prior with how likely</tspan><tspan x="380" y="983">the evidence is under each alternative.</tspan></text>
<text text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="400" fill="#17324d"><tspan x="380" y="1083">Similarity can suggest a hypothesis.</tspan></text>
</svg>

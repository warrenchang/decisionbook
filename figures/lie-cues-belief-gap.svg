<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820" viewBox="0 0 1200 820" role="img" aria-labelledby="title desc">
  <title id="title">Believed nonverbal signs of deception are much stronger than observed associations</title>
  <desc id="desc">A dot plot reproduces all nine rows in Sporer and Schwandt's comparison figure. Observed weighted mean correlations are zero for blinking, minus point zero one for gaze aversion, point zero six for head movements, minus point zero three for smiling, point zero two for adaptor movements, point zero two for illustrator gestures, minus point zero seven for foot and leg movements, minus point zero nine for nodding, and minus point one nine for hand movements. Student and professional belief effect sizes are respectively point three two and point five three for blinking; point five three and point four five for gaze aversion; point two nine and point four nine for head movements; point one five and point two three for smiling; point eight five and point seven nine for adaptor movements; point one zero and point five eight for illustrator gestures; and point five six and point five six for foot and leg movements. Belief estimates were not reported in the source figure for nodding or hand movements. A boundary panel explains that an association is not an individual diagnosis and recommends verifying claims rather than reading demeanor.</desc>
  <rect width="1200" height="820" fill="#ffffff"/>

  <text x="600" y="43" text-anchor="middle" font-family="Arial, sans-serif" font-size="31" font-weight="700" fill="#17324d">Believed “tells” are much stronger than observed associations</text>
  <text x="600" y="75" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#66737f">Positive values mean that the behavior is expected to increase during deception</text>

  <rect x="38" y="102" width="792" height="660" rx="18" fill="#f7fafc" stroke="#c8d7e2" stroke-width="2"/>
  <text x="434" y="137" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#17324d">Observed associations and reported beliefs, when available</text>

  <!-- Legend -->
  <circle cx="172" cy="171" r="8" fill="#17324d"/>
  <text x="189" y="177" font-family="Arial, sans-serif" font-size="16" fill="#17324d">Observed weighted mean <tspan font-style="italic">r</tspan></text>
  <path d="M 450 161 L 460 171 L 450 181 L 440 171 Z" fill="#c56a2d"/>
  <text x="469" y="177" font-family="Arial, sans-serif" font-size="16" fill="#17324d">Students’ beliefs</text>
  <rect x="646" y="162" width="18" height="18" rx="2" fill="#a74343"/>
  <text x="673" y="177" font-family="Arial, sans-serif" font-size="16" fill="#17324d">Professionals’ beliefs</text>

  <!-- Plot rows and labels -->
  <g font-family="Arial, sans-serif" font-size="16" fill="#17324d">
    <text x="177" y="233" text-anchor="end">Blinking</text>
    <text x="177" y="282" text-anchor="end">Gaze aversion</text>
    <text x="177" y="331" text-anchor="end">Head movements</text>
    <text x="177" y="380" text-anchor="end">Smiling</text>
    <text x="177" y="429" text-anchor="end">Adaptor movements</text>
    <text x="177" y="478" text-anchor="end">Illustrator gestures</text>
    <text x="177" y="527" text-anchor="end">Foot / leg movements</text>
    <text x="177" y="576" text-anchor="end">Nodding</text>
    <text x="177" y="625" text-anchor="end">Hand movements</text>
  </g>
  <g stroke="#e1e8ed" stroke-width="1.5">
    <line x1="195" y1="228" x2="770" y2="228"/>
    <line x1="195" y1="277" x2="770" y2="277"/>
    <line x1="195" y1="326" x2="770" y2="326"/>
    <line x1="195" y1="375" x2="770" y2="375"/>
    <line x1="195" y1="424" x2="770" y2="424"/>
    <line x1="195" y1="473" x2="770" y2="473"/>
    <line x1="195" y1="522" x2="770" y2="522"/>
    <line x1="195" y1="571" x2="770" y2="571"/>
    <line x1="195" y1="620" x2="770" y2="620"/>
  </g>

  <!-- Range connectors for the seven rows with belief comparisons -->
  <g stroke="#aab8c2" stroke-width="3" stroke-linecap="round">
    <line x1="300" y1="228" x2="577" y2="228"/>
    <line x1="294" y1="277" x2="577" y2="277"/>
    <line x1="331" y1="326" x2="556" y2="326"/>
    <line x1="284" y1="375" x2="420" y2="375"/>
    <line x1="310" y1="424" x2="744" y2="424"/>
    <line x1="310" y1="473" x2="603" y2="473"/>
    <line x1="263" y1="522" x2="592" y2="522"/>
  </g>

  <!-- Observed r: circles -->
  <g fill="#17324d">
    <circle cx="300" cy="228" r="9"/>
    <circle cx="294" cy="277" r="9"/>
    <circle cx="331" cy="326" r="9"/>
    <circle cx="284" cy="375" r="9"/>
    <circle cx="310" cy="424" r="9"/>
    <circle cx="310" cy="473" r="9"/>
    <circle cx="263" cy="522" r="9"/>
    <circle cx="252" cy="571" r="9"/>
    <circle cx="200" cy="620" r="9"/>
  </g>

  <!-- Students: diamonds -->
  <g fill="#c56a2d">
    <path d="M 467 216 L 479 228 L 467 240 L 455 228 Z"/>
    <path d="M 577 265 L 589 277 L 577 289 L 565 277 Z"/>
    <path d="M 451 314 L 463 326 L 451 338 L 439 326 Z"/>
    <path d="M 378 363 L 390 375 L 378 387 L 366 375 Z"/>
    <path d="M 744 412 L 756 424 L 744 436 L 732 424 Z"/>
    <path d="M 352 461 L 364 473 L 352 485 L 340 473 Z"/>
    <path d="M 592 510 L 604 522 L 592 534 L 580 522 Z"/>
  </g>

  <!-- Professionals: squares -->
  <g fill="#a74343">
    <rect x="568" y="219" width="18" height="18" rx="2"/>
    <rect x="526" y="268" width="18" height="18" rx="2"/>
    <rect x="547" y="317" width="18" height="18" rx="2"/>
    <rect x="411" y="366" width="18" height="18" rx="2"/>
    <rect x="703" y="415" width="18" height="18" rx="2"/>
    <rect x="594" y="464" width="18" height="18" rx="2"/>
    <rect x="583" y="513" width="18" height="18" rx="2"/>
  </g>

  <!-- Missing belief comparisons are made explicit rather than silently omitted -->
  <g font-family="Arial, sans-serif" font-size="16" fill="#7d8b96">
    <rect x="455" y="554" width="240" height="31" rx="11" fill="#eef2f5" stroke="#c8d7e2"/>
    <text x="575" y="575" text-anchor="middle">belief estimates not reported</text>
    <rect x="455" y="603" width="240" height="31" rx="11" fill="#eef2f5" stroke="#c8d7e2"/>
    <text x="575" y="624" text-anchor="middle">belief estimates not reported</text>
  </g>

  <!-- Axis: range expanded to include every observed value in the source comparison figure -->
  <line x1="195" y1="673" x2="770" y2="673" stroke="#8fa0ad" stroke-width="2"/>
  <line x1="300" y1="204" x2="300" y2="673" stroke="#66737f" stroke-width="2" stroke-dasharray="7 7"/>
  <g stroke="#8fa0ad" stroke-width="2" font-family="Arial, sans-serif" font-size="16" fill="#66737f">
    <line x1="195" y1="673" x2="195" y2="681"/><text x="195" y="702" text-anchor="middle" stroke="none">−.2</text>
    <line x1="247" y1="673" x2="247" y2="681"/><text x="247" y="702" text-anchor="middle" stroke="none">−.1</text>
    <line x1="300" y1="673" x2="300" y2="681"/><text x="300" y="702" text-anchor="middle" stroke="none">0</text>
    <line x1="352" y1="673" x2="352" y2="681"/><text x="352" y="702" text-anchor="middle" stroke="none">.1</text>
    <line x1="404" y1="673" x2="404" y2="681"/><text x="404" y="702" text-anchor="middle" stroke="none">.2</text>
    <line x1="457" y1="673" x2="457" y2="681"/><text x="457" y="702" text-anchor="middle" stroke="none">.3</text>
    <line x1="509" y1="673" x2="509" y2="681"/><text x="509" y="702" text-anchor="middle" stroke="none">.4</text>
    <line x1="561" y1="673" x2="561" y2="681"/><text x="561" y="702" text-anchor="middle" stroke="none">.5</text>
    <line x1="614" y1="673" x2="614" y2="681"/><text x="614" y="702" text-anchor="middle" stroke="none">.6</text>
    <line x1="666" y1="673" x2="666" y2="681"/><text x="666" y="702" text-anchor="middle" stroke="none">.7</text>
    <line x1="718" y1="673" x2="718" y2="681"/><text x="718" y="702" text-anchor="middle" stroke="none">.8</text>
    <line x1="770" y1="673" x2="770" y2="681"/><text x="770" y="702" text-anchor="middle" stroke="none">.9</text>
  </g>
  <text x="483" y="738" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#66737f">Effect-size scale reported in the source figure</text>

  <!-- Scientific boundary -->
  <rect x="855" y="102" width="307" height="660" rx="18" fill="#f7f1e8" stroke="#c56a2d" stroke-width="2"/>
  <text x="1008" y="137" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#17324d">Association is not</text>
  <text x="1008" y="163" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#17324d">diagnosis</text>

  <rect x="885" y="188" width="247" height="140" rx="14" fill="#ffffff" stroke="#c8d7e2" stroke-width="2"/>
  <text x="1008" y="222" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#17324d">All nine observed rows</text>
  <text x="1008" y="260" text-anchor="middle" font-family="Arial, sans-serif" font-size="27" font-weight="700" fill="#2f6f9f">max |r| = .19</text>
  <text x="1008" y="290" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#66737f">small overall; several estimates</text>
  <text x="1008" y="313" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#66737f">were heterogeneous</text>

  <text x="891" y="370" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#a74343">Do not infer:</text>
  <text x="891" y="401" font-family="Arial, sans-serif" font-size="16" fill="#17324d">• one cue proves that a person lied;</text>
  <text x="891" y="431" font-family="Arial, sans-serif" font-size="16" fill="#17324d">• nervousness identifies deception;</text>
  <text x="891" y="461" font-family="Arial, sans-serif" font-size="16" fill="#17324d">• the same cue may not travel</text>
  <text x="906" y="486" font-family="Arial, sans-serif" font-size="16" fill="#17324d">across settings.</text>

  <line x1="891" y1="512" x2="1126" y2="512" stroke="#d8c5aa" stroke-width="2"/>
  <text x="1008" y="552" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#447c55">Verify the claim</text>
  <text x="1008" y="585" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#17324d">Ask for records, dates, tests,</text>
  <text x="1008" y="610" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#17324d">independent sources, warranties,</text>
  <text x="1008" y="635" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#17324d">or measurable contingent terms.</text>

  <rect x="885" y="674" width="247" height="68" rx="12" fill="#edf4ed" stroke="#447c55" stroke-width="2"/>
  <text x="1008" y="703" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#447c55">Read evidence,</text>
  <text x="1008" y="728" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#447c55">not demeanor.</text>

  <text x="600" y="802" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#66737f">Original redraw of Sporer &amp; Schwandt (2007), Figure 1; belief estimates reported there from Zuckerman et al. (1981) and Köhnken (1988).</text>
</svg>

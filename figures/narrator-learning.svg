<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" baseProfile="full" height="650" version="1.1" viewBox="0 0 1200 650" width="1200">
  <defs>
    <marker id="navy-arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0 L12 6 L0 12 Z" fill="#17324d" />
    </marker>
    <marker id="orange-arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0 L12 6 L0 12 Z" fill="#c56a2d" />
    </marker>
  </defs>
  <title>Choice, explanation, and learning</title>
  <desc>A choice produces an outcome; the narrator explains it. Hindsight and outcome bias can distort learning unless a contemporaneous decision record is compared with results.</desc>
  <rect fill="white" height="650" width="1200" x="0" y="0" />
  <text fill="#17324d" font-family="Arial, sans-serif" font-size="34" font-weight="bold" text-anchor="middle" x="600" y="48">The narrator can protect identity—or protect learning</text>
  <!-- Equal-width stages and equal gaps keep the learning sequence visually regular. -->
  <line stroke="#17324d" stroke-width="4" stroke-linecap="round" x1="260" x2="340" y1="270" y2="270" marker-end="url(#navy-arrow)" />
  <line stroke="#17324d" stroke-width="4" stroke-linecap="round" x1="560" x2="640" y1="270" y2="270" marker-end="url(#navy-arrow)" />
  <line stroke="#17324d" stroke-width="4" stroke-linecap="round" x1="860" x2="940" y1="270" y2="270" marker-end="url(#navy-arrow)" />

  <!-- Both record comparisons leave from one shared point. -->
  <line stroke="#c56a2d" stroke-width="4" stroke-linecap="round" x1="600" x2="750" y1="430" y2="320" marker-end="url(#orange-arrow)" />
  <line stroke="#c56a2d" stroke-width="4" stroke-linecap="round" x1="600" x2="1050" y1="430" y2="320" marker-end="url(#orange-arrow)" />

  <rect fill="#eaf3f8" height="100" rx="16" ry="16" stroke="#2f6f9f" stroke-width="3" width="220" x="40" y="220" />
  <text fill="#17324d" font-family="Arial, sans-serif" font-size="26" font-weight="bold" text-anchor="middle" x="150" y="263.97"><tspan x="150" dy="0">Choice</tspan></text>
  <text fill="#66737f" font-family="Arial, sans-serif" font-size="17" font-weight="normal" text-anchor="middle" x="150" y="292.09"><tspan x="150" dy="0">reasons felt now</tspan></text>

  <rect fill="#eaf3f8" height="100" rx="16" ry="16" stroke="#2f6f9f" stroke-width="3" width="220" x="340" y="220" />
  <text fill="#17324d" font-family="Arial, sans-serif" font-size="26" font-weight="bold" text-anchor="middle" x="450" y="263.97"><tspan x="450" dy="0">Outcome</tspan></text>
  <text fill="#66737f" font-family="Arial, sans-serif" font-size="17" font-weight="normal" text-anchor="middle" x="450" y="292.09"><tspan x="450" dy="0">luck + process</tspan></text>

  <rect fill="#eaf3f8" height="100" rx="16" ry="16" stroke="#2f6f9f" stroke-width="3" width="220" x="640" y="220" />
  <text fill="#17324d" font-family="Arial, sans-serif" font-size="26" font-weight="bold" text-anchor="middle" x="750" y="263.97"><tspan x="750" dy="0">Narrative</tspan></text>
  <text fill="#66737f" font-family="Arial, sans-serif" font-size="17" font-weight="normal" text-anchor="middle" x="750" y="292.09"><tspan x="750" dy="0">“why it happened”</tspan></text>

  <rect fill="#eaf3f8" height="100" rx="16" ry="16" stroke="#2f6f9f" stroke-width="3" width="220" x="940" y="220" />
  <text fill="#17324d" font-family="Arial, sans-serif" font-size="24.67" font-weight="bold" text-anchor="middle" x="1050" y="249.723"><tspan x="1050" dy="0">Future</tspan><tspan x="1050" dy="29.1109">rule</tspan></text>
  <text fill="#66737f" font-family="Arial, sans-serif" font-size="16.13" font-weight="normal" text-anchor="middle" x="1050" y="305.771"><tspan x="1050" dy="0">what repeats</tspan></text>

  <rect fill="#f7f1e8" height="105" rx="16" ry="16" stroke="#c56a2d" stroke-width="3" width="300" x="450" y="430" />
  <text fill="#17324d" font-family="Arial, sans-serif" font-size="26" font-weight="bold" text-anchor="middle" x="600" y="466.44"><tspan x="600" dy="0">Decision record</tspan></text>
  <text fill="#66737f" font-family="Arial, sans-serif" font-size="17" font-weight="normal" text-anchor="middle" x="600" y="494.56"><tspan x="600" dy="0">beliefs • probabilities •</tspan><tspan x="600" dy="20.06">values</tspan></text>
  <text fill="#66737f" font-family="Arial, sans-serif" font-size="22" font-weight="normal" text-anchor="middle" x="600" y="595">A record written before the outcome prevents luck from rewriting the process.</text>
</svg>

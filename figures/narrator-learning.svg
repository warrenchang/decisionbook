<?xml version="1.0" encoding="utf-8" ?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink" baseProfile="full" height="650" version="1.1" viewBox="0 0 1200 650" width="1200">
  <defs/>
  <title>Choice, explanation, and learning</title>
  <desc>A choice produces an outcome; the narrator explains it. Hindsight and outcome bias can distort learning unless a contemporaneous decision record is compared with results.</desc>
  <rect fill="white" height="650" width="1200" x="0" y="0"/>
  <text fill="#17324d" font-family="Arial, sans-serif" font-size="34" font-weight="bold" text-anchor="middle" x="600" y="48">The narrator can protect identity—or protect learning</text>
  <rect fill="#eaf3f8" height="100" rx="16" ry="16" stroke="#2f6f9f" stroke-width="3" width="180" x="50" y="220"/>
  <text fill="#17324d" font-family="Arial, sans-serif" font-size="26" font-weight="bold" text-anchor="middle" x="140.0" y="262.0">Choice</text>
  <text fill="#66737f" font-family="Arial, sans-serif" font-size="17" font-weight="normal" text-anchor="middle" x="140.0" y="296.0">reasons felt now</text>
  <line stroke="#17324d" stroke-width="4" x1="230" x2="390" y1="270" y2="270"/>
  <polygon fill="#17324d" points="390,270 377.0096189432334,277.5 377.0096189432334,262.5"/>
  <rect fill="#eaf3f8" height="100" rx="16" ry="16" stroke="#2f6f9f" stroke-width="3" width="180" x="390" y="220"/>
  <text fill="#17324d" font-family="Arial, sans-serif" font-size="26" font-weight="bold" text-anchor="middle" x="480.0" y="262.0">Outcome</text>
  <text fill="#66737f" font-family="Arial, sans-serif" font-size="17" font-weight="normal" text-anchor="middle" x="480.0" y="296.0">luck + process</text>
  <line stroke="#17324d" stroke-width="4" x1="570" x2="730" y1="270" y2="270"/>
  <polygon fill="#17324d" points="730,270 717.0096189432334,277.5 717.0096189432334,262.5"/>
  <rect fill="#eaf3f8" height="100" rx="16" ry="16" stroke="#2f6f9f" stroke-width="3" width="200" x="730" y="220"/>
  <text fill="#17324d" font-family="Arial, sans-serif" font-size="26" font-weight="bold" text-anchor="middle" x="830.0" y="262.0">Narrative</text>
  <text fill="#66737f" font-family="Arial, sans-serif" font-size="17" font-weight="normal" text-anchor="middle" x="830.0" y="296.0">“why it happened”</text>
  <line stroke="#17324d" stroke-width="4" x1="930" x2="1090" y1="270" y2="270"/>
  <polygon fill="#17324d" points="1090,270 1077.0096189432334,277.5 1077.0096189432334,262.5"/>
  <rect fill="#eaf3f8" height="100" rx="16" ry="16" stroke="#2f6f9f" stroke-width="3" width="160" x="1010" y="400"/>
  <text fill="#17324d" font-family="Arial, sans-serif" font-size="26" font-weight="bold" text-anchor="middle" x="1090.0" y="442.0">Future rule</text>
  <text fill="#66737f" font-family="Arial, sans-serif" font-size="17" font-weight="normal" text-anchor="middle" x="1090.0" y="476.0">what repeats</text>
  <rect fill="#f7f1e8" height="105" rx="16" ry="16" stroke="#c56a2d" stroke-width="3" width="300" x="390" y="430"/>
  <text fill="#17324d" font-family="Arial, sans-serif" font-size="26" font-weight="bold" text-anchor="middle" x="540.0" y="474.5">Decision record</text>
  <text fill="#66737f" font-family="Arial, sans-serif" font-size="17" font-weight="normal" text-anchor="middle" x="540.0" y="508.5">beliefs • probabilities • values</text>
  <line stroke="#c56a2d" stroke-width="4" x1="540" x2="810" y1="430" y2="320"/>
  <polygon fill="#c56a2d" points="810,320 800.7994340076848,331.84692303600616 795.139980697982,317.95553763946293"/>
  <line stroke="#c56a2d" stroke-width="4" x1="690" x2="1010" y1="482" y2="450"/>
  <polygon fill="#c56a2d" points="1010,450 997.8203656261754,458.7553701532231 996.3278098408604,443.8298123000733"/>
  <text fill="#66737f" font-family="Arial, sans-serif" font-size="22" font-weight="normal" text-anchor="middle" x="600" y="595">A record written before the outcome prevents luck from rewriting the process.</text>
</svg>

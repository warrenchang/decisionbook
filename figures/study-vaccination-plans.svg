<svg role="img" aria-labelledby="title desc" xmlns:xlink="http://www.w3.org/1999/xlink" width="489.6pt" height="410.4pt" viewBox="0 0 489.6 410.4" xmlns="http://www.w3.org/2000/svg" version="1.1">
<title id="title">A date-and-time plan increases workplace vaccination uptake</title><desc id="desc">Milkman and colleagues (2011) reported vaccination rates of 33.1% among 1,268 employees receiving a clinic reminder, and 37.1% among 1,270 receiving the reminder plus a prompt to write a date and time. These are raw rates. The covariate-adjusted effect was 4.2 percentage points, with a 95% confidence interval of 0.5 to 7.8 points.</desc>


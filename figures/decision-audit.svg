<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">Decision quality and outcome quality</title>
  <desc id="desc">A two-by-two matrix separates good and poor decision processes from favorable and unfavorable outcomes.</desc>
  <rect width="1600" height="1000" fill="#ffffff"/>
  <text x="800" y="86" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="60" font-weight="700" fill="#183047">Audit the process separately from the outcome</text>
  <text x="800" y="136" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="28" fill="#687887">Uncertainty permits good processes to lose and poor processes to get lucky.</text>

  <text x="860" y="210" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700" fill="#183047">Favorable outcome</text>
  <text x="1280" y="210" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700" fill="#183047">Unfavorable outcome</text>
  <text x="250" y="425" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700" fill="#183047">Sound process</text>
  <text x="250" y="735" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700" fill="#183047">Weak process</text>

  <rect x="440" y="245" width="420" height="290" rx="28" fill="#edf5ee" stroke="#2b8078" stroke-width="6"/>
  <text x="650" y="322" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="38" font-weight="700" fill="#183047">Good decision</text>
  <text x="650" y="368" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="38" font-weight="700" fill="#183047">+ good result</text>
  <text x="650" y="434" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="29" fill="#4f6272">Preserve the process.</text>
  <text x="650" y="474" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="29" fill="#4f6272">Do not learn only from success.</text>

  <rect x="900" y="245" width="420" height="290" rx="28" fill="#e8f2f8" stroke="#2f73a5" stroke-width="6"/>
  <text x="1110" y="322" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="38" font-weight="700" fill="#183047">Good decision</text>
  <text x="1110" y="368" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="38" font-weight="700" fill="#183047">+ bad luck</text>
  <text x="1110" y="434" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="29" fill="#4f6272">Protect a sound process.</text>
  <text x="1110" y="474" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="29" fill="#4f6272">Do not punish calibrated risk.</text>

  <rect x="440" y="575" width="420" height="290" rx="28" fill="#fff4de" stroke="#d89b2b" stroke-width="6"/>
  <text x="650" y="652" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="38" font-weight="700" fill="#183047">Bad decision</text>
  <text x="650" y="698" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="38" font-weight="700" fill="#183047">+ good luck</text>
  <text x="650" y="764" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="29" fill="#4f6272">Most dangerous for learning.</text>
  <text x="650" y="804" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="29" fill="#4f6272">Success can hide the defect.</text>

  <rect x="900" y="575" width="420" height="290" rx="28" fill="#faece9" stroke="#b95345" stroke-width="6"/>
  <text x="1110" y="652" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="38" font-weight="700" fill="#183047">Bad decision</text>
  <text x="1110" y="698" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="38" font-weight="700" fill="#183047">+ bad result</text>
  <text x="1110" y="754" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="29" fill="#4f6272">The failure is easier to see.</text>
  <text x="1110" y="794" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="29" fill="#4f6272">Repair the process.</text>
  <text x="1110" y="832" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="26" fill="#4f6272">Do not hunt for a scapegoat.</text>

  <text x="800" y="943" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="31" font-weight="700" fill="#2b8078">Judge with what was knowable then; learn with what is known now.</text>
</svg>

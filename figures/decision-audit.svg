<svg xmlns="http://www.w3.org/2000/svg" width="760" height="795" viewBox="0 0 760 795" role="img" aria-labelledby="title desc">
<title id="title">Assess process and outcome separately</title><desc id="desc">A matrix crosses sound and weak processes with favorable and unfavorable outcomes. Each cell prompts an evidence-based review.</desc>
<rect width="760" height="795" fill="white"/>
<defs>
<marker id="a" viewBox="0 0 12 10" markerWidth="9" markerHeight="8" refX="11" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L11 5 L1 9 Z" fill="#2f6f9f"/></marker>
<marker id="g" viewBox="0 0 12 10" markerWidth="9" markerHeight="8" refX="11" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L11 5 L1 9 Z" fill="#3f7c59"/></marker>
<marker id="o" viewBox="0 0 12 10" markerWidth="9" markerHeight="8" refX="11" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L11 5 L1 9 Z" fill="#b95f2d"/></marker>
</defs>
<text x="380" y="48" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="700" fill="#17324d">Assess process and outcome</text>
<text x="380" y="89.6" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="700" fill="#17324d">separately</text>
<text x="275" y="151" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#17324d">Favorable</text>
<text x="275" y="187.4" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#17324d">outcome</text>
<text x="595" y="151" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#17324d">Unfavorable</text>
<text x="595" y="187.4" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#17324d">outcome</text>
<rect x="125" y="215" width="290" height="205" rx="18" fill="#edf7ef" stroke="#3f7c59" stroke-width="2.5"/>
<text x="270" y="261" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#17324d">Retain the</text>
<text x="270" y="297.4" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#17324d">supported parts</text>
<text x="270" y="344" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="400" fill="#53697d">Check what actually</text>
<text x="270" y="380.4" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="400" fill="#53697d">produced the result.</text>
<rect x="445" y="215" width="290" height="205" rx="18" fill="#edf5fa" stroke="#2f6f9f" stroke-width="2.5"/>
<text x="590" y="261" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#17324d">Investigate</text>
<text x="590" y="297.4" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#17324d">before changing</text>
<text x="590" y="344" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="400" fill="#53697d">An adverse outcome</text>
<text x="590" y="380.4" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="400" fill="#53697d">can follow good work.</text>
<rect x="125" y="450" width="290" height="205" rx="18" fill="#fff5ec" stroke="#b95f2d" stroke-width="2.5"/>
<text x="270" y="496" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#17324d">Repair weaknesses</text>
<text x="270" y="532.4" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#17324d">despite success</text>
<text x="270" y="579" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="400" fill="#53697d">A favorable result</text>
<text x="270" y="615.4" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="400" fill="#53697d">can hide a defect.</text>
<rect x="445" y="450" width="290" height="205" rx="18" fill="#f4eff8" stroke="#795a8a" stroke-width="2.5"/>
<text x="590" y="496" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#17324d">Repair weaknesses</text>
<text x="590" y="532.4" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#17324d">and examine causes</text>
<text x="590" y="579" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="400" fill="#53697d">A failure alone does</text>
<text x="590" y="615.4" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="400" fill="#53697d">not explain itself.</text>
<text x="57" y="317" transform="rotate(-90 57 317)" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#17324d">Sound process</text>
<text x="57" y="553" transform="rotate(-90 57 553)" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#17324d">Weak process</text>

<text x="380" y="757" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="400" fill="#53697d">Judge the process using what was knowable then.</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="680" viewBox="0 0 1600 680">
<defs>
<style><![CDATA[.title{font:700 28px Arial, sans-serif; fill:#0b2c5f}.subtitle{font:italic 18px Arial, sans-serif; fill:#334}.boxlabel{font:700 18px Arial, sans-serif; fill:#0b2c5f}.boxsmall{font: 15px Arial, sans-serif; fill:#111}.whitelabel{font:700 16px Arial, sans-serif; fill:white}.whitesmall{font: 13px Arial, sans-serif; fill:white}.small{font: 13px Arial, sans-serif; fill:#333}.redlabel{font:700 18px Arial, sans-serif; fill:#d62828}.redsmall{font: 14px Arial, sans-serif; fill:#333}]]></style>
<marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,3 L0,6 Z" fill="#123c86"/></marker>
<marker id="arrowRed" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,3 L0,6 Z" fill="#d62828"/></marker>
<marker id="arrowGreen" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,3 L0,6 Z" fill="#2e8b57"/></marker>
<marker id="arrowPurple" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,3 L0,6 Z" fill="#6c3eb6"/></marker>
<marker id="arrowOrange" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,3 L0,6 Z" fill="#d97706"/></marker>
</defs>
<rect x="0" y="0" width="1600" height="680" fill="white"/>
<rect x="10" y="40" width="1030" height="560" rx="40" ry="40" fill="none" stroke="#2b6cb0" stroke-width="3" stroke-dasharray="12,10"/>
<text x="515" y="34" class="title" text-anchor="middle">
<tspan x="515" dy="0">Decision-Maker / Predictive Brain</tspan>
</text>
<rect x="1080" y="40" width="180" height="560" rx="25" ry="25" fill="none" stroke="#999" stroke-width="2.5" stroke-dasharray="10,8"/>
<text x="1170" y="34" class="title" text-anchor="middle">
<tspan x="1170" dy="0">Interface with</tspan>
<tspan x="1170" dy="32">the world</tspan>
</text>
<rect x="100" y="95" width="360" height="120" rx="18" ry="18" fill="#f4f8fd" stroke="#2b6cb0" stroke-width="2.5"/>
<text x="285" y="130" class="boxlabel" text-anchor="middle">
<tspan x="285" dy="0">Internal model</tspan>
</text>
<text x="287" y="155" class="boxsmall" text-anchor="middle">
<tspan x="287" dy="0">Beliefs, causal assumptions,</tspan>
<tspan x="287" dy="18">desired outcomes, favored</tspan>
<tspan x="287" dy="18">action plans</tspan>
</text>
<rect x="100" y="285" width="360" height="120" rx="18" ry="18" fill="#f4f8fd" stroke="#2b6cb0" stroke-width="2.5"/>
<text x="210" y="325" class="boxlabel" text-anchor="middle">
<tspan x="210" dy="0">Predictions</tspan>
</text>
<text x="285" y="348" class="boxsmall" text-anchor="middle">
<tspan x="285" dy="0">Expected sensations and</tspan>
<tspan x="285" dy="18">outcomes; guide sensory</tspan>
<tspan x="285" dy="18">processing and</tspan>
<tspan x="285" dy="18">interpretation</tspan>
</text>
<rect x="150" y="445" width="430" height="110" rx="18" ry="18" fill="#fff8ef" stroke="#d97706" stroke-width="2.5"/>
<text x="365" y="482" class="boxlabel" text-anchor="middle">
<tspan x="365" dy="0">Precision/Attention</tspan>
</text>
<text x="366" y="505" class="boxsmall" text-anchor="middle">
<tspan x="366" dy="0">Weights influence of</tspan>
<tspan x="366" dy="18">prediction vs. sensory</tspan>
<tspan x="366" dy="18">evidence</tspan>
</text>
<rect x="520" y="95" width="330" height="120" rx="18" ry="18" fill="#f2fbf4" stroke="#2e8b57" stroke-width="2.5"/>
<text x="685" y="130" class="boxlabel" text-anchor="middle">
<tspan x="685" dy="0">Action plan</tspan>
</text>
<text x="687" y="154" class="boxsmall" text-anchor="middle">
<tspan x="687" dy="0">To reach desired</tspan>
<tspan x="687" dy="18">outcomes or reduce</tspan>
<tspan x="687" dy="18">uncertainty</tspan>
</text>
<rect x="565" y="295" width="350" height="120" rx="18" ry="18" fill="#faf5ff" stroke="#6c3eb6" stroke-width="2.5"/>
<text x="740" y="332" class="boxlabel" text-anchor="middle">
<tspan x="740" dy="0">Perception &amp; judgment</tspan>
</text>
<text x="740" y="356" class="boxsmall" text-anchor="middle">
<tspan x="740" dy="0">Predictions and sensory</tspan>
<tspan x="740" dy="18">evidence are integrated to</tspan>
<tspan x="740" dy="18">infer current situation</tspan>
</text>
<circle cx="110" cy="530" r="75" fill="#fffaf7" stroke="#d62828" stroke-width="2.5"/>
<text x="110" y="520" class="redlabel" text-anchor="middle">
<tspan x="110" dy="0">Prediction</tspan>
<tspan x="110" dy="24">error</tspan>
</text>
<rect x="1115" y="100" width="125" height="90" rx="14" ry="14" fill="#f2fbf4" stroke="#2e8b57" stroke-width="2.5"/>
<text x="1177" y="153" class="boxlabel" text-anchor="middle">
<tspan x="1177" dy="0">Action</tspan>
</text>
<rect x="1095" y="430" width="150" height="90" rx="14" ry="14" fill="#faf5ff" stroke="#6c3eb6" stroke-width="2.5"/>
<text x="1170" y="484" class="boxlabel" text-anchor="middle">
<tspan x="1170" dy="0">Sensation</tspan>
</text>
<rect x="1330" y="175" width="240" height="180" rx="22" ry="22" fill="#faf5ff" stroke="#6c3eb6" stroke-width="2.5"/>
<text x="1450" y="252" class="boxlabel" text-anchor="middle">
<tspan x="1450" dy="0">Environment</tspan>
</text>
<text x="1450" y="278" class="boxsmall" text-anchor="middle">
<tspan x="1450" dy="0">external states generate</tspan>
<tspan x="1450" dy="18">sensory input &amp; feedback</tspan>
</text>
<text x="60" y="305" class="boxlabel" text-anchor="middle">
<tspan x="60" dy="0">Model update</tspan>
</text>
<g transform="translate(62,310) rotate(-90)"><text x="0" y="0" class="boxlabel" text-anchor="middle">↻ Model update</text></g>
<path d="M280 215 V285" fill="none" stroke="#2b6cb0" stroke-width="4" marker-end="url(#arrowBlue)"/>
<path d="M460 350 H565" fill="none" stroke="#2b6cb0" stroke-width="4" marker-end="url(#arrowBlue)"/>
<path d="M915 355 H1095" fill="none" stroke="#6c3eb6" stroke-width="4" marker-end="url(#arrowPurple)"/>
<path d="M850 155 H1115" fill="none" stroke="#2e8b57" stroke-width="4" marker-end="url(#arrowGreen)"/>
<path d="M1240 145 H1420 V175" fill="none" stroke="#2e8b57" stroke-width="4" marker-end="url(#arrowGreen)"/>
<path d="M1450 355 V475 H1245" fill="none" stroke="#6c3eb6" stroke-width="4" marker-end="url(#arrowPurple)"/>
<path d="M1095 475 H915" fill="none" stroke="#6c3eb6" stroke-width="4" marker-end="url(#arrowPurple)"/>
<path d="M700 295 V215" fill="none" stroke="#6c3eb6" stroke-width="4" marker-end="url(#arrowPurple)"/>
<path d="M700 415 V445" fill="none" stroke="#d97706" stroke-width="4" marker-end="url(#arrowOrange)"/>
<path d="M580 500 H185" fill="none" stroke="#d97706" stroke-width="4" stroke-dasharray="8,6" marker-end="url(#arrowOrange)"/>
<path d="M180 530 V95 H100" fill="none" stroke="#d62828" stroke-width="4" marker-end="url(#arrowRed)"/>
<path d="M110 605 H730 V415" fill="none" stroke="#6c3eb6" stroke-width="4" marker-end="url(#arrowPurple)"/>
</svg>
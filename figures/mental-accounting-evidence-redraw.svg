<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="745" viewBox="0 0 1200 745" role="img" aria-labelledby="title desc">
  <title id="title">Mental-accounting evidence in investment decisions</title>
  <desc id="desc">Two panels redraw reported investment findings. Winners sold outperformed losing positions retained by about 3.41 percentage points in market-adjusted return over the following year in Odean's brokerage sample. Participants shown annual return distributions allocated about forty percent to stocks, versus about ninety percent for long-term distributions in Benartzi and Thaler's study.</desc>
  <defs>
    <marker id="blueArrow" viewBox="0 0 10 8" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0.5 0.8 L9 4 L0.5 7.2 Z" fill="#2f6f9f"/></marker>
    <marker id="orangeArrow" viewBox="0 0 10 8" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0.5 0.8 L9 4 L0.5 7.2 Z" fill="#c56a2d"/></marker>
    <filter id="shadow"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#17324d" flood-opacity="0.12"/></filter>
  </defs>
  <rect width="1200" height="745" fill="#ffffff"/>
<text x="600" y="48" text-anchor="middle" font-family="Georgia, serif" font-size="33.0" font-weight="700" fill="#17324d" >Two ways a narrow bracket changes an investment decision</text>
<text x="600" y="80" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.0" font-weight="400" fill="#66737f" >Original redraws of reported results; neither panel supplies a universal effect size.</text>
<rect x="45" y="115" width="540" height="565" rx="20" fill="#f7fafc" stroke="#c8d7e2" stroke-width="2" />
<text x="315" y="158" text-anchor="middle" font-family="Arial, sans-serif" font-size="24.0" font-weight="700" fill="#17324d" >Closing winners, keeping losers</text>
<text x="315" y="188" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.0" font-weight="400" fill="#66737f" >Odean (1998), brokerage sample</text>
<rect x="90" y="235" width="190" height="145" rx="18" fill="#edf4ed" stroke="#447c55" stroke-width="3" />
<text x="185" y="276" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.0" font-weight="700" fill="#447c55" >WINNER</text>
<text x="185" y="311" text-anchor="middle" font-family="Arial, sans-serif" font-size="32.0" font-weight="700" fill="#17324d" >sold</text>
<text x="185" y="347" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#66737f" >account closed</text>
<rect x="350" y="235" width="190" height="145" rx="18" fill="#fff0e9" stroke="#a74343" stroke-width="3" />
<text x="445" y="276" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.0" font-weight="700" fill="#a74343" >LOSER</text>
<text x="445" y="311" text-anchor="middle" font-family="Arial, sans-serif" font-size="32.0" font-weight="700" fill="#17324d" >held</text>
<text x="445" y="347" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#66737f" >loss not realized</text>
<line x1="280" y1="307" x2="346" y2="307" stroke="#2f6f9f" stroke-width="4" stroke-dasharray="8 7"/>
<text x="315" y="438" text-anchor="middle" font-family="Arial, sans-serif" font-size="35.0" font-weight="700" fill="#2f6f9f" >+3.41 percentage points</text>
<text x="315" y="474" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.0" font-weight="400" fill="#66737f" >market-adjusted return of winners sold</text>
<text x="315" y="500" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.0" font-weight="400" fill="#66737f" >relative to losing positions retained</text>
<text x="315" y="526" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.0" font-weight="400" fill="#66737f" >over the following year</text>
<rect x="90" y="575" width="450" height="62" rx="14" fill="#f7f1e8" stroke="#c56a2d" stroke-width="2" />
<text x="315" y="602" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.0" font-weight="700" fill="#c56a2d" >Forward-looking test</text>
<text x="315" y="625" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.0" font-weight="700" fill="#17324d" >Would I buy this position today at this price?</text>
<rect x="615" y="115" width="540" height="565" rx="20" fill="#f7fafc" stroke="#c8d7e2" stroke-width="2" />
<text x="885" y="158" text-anchor="middle" font-family="Arial, sans-serif" font-size="24.0" font-weight="700" fill="#17324d" >The same risk, a different horizon</text>
<text x="885" y="188" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.0" font-weight="400" fill="#66737f" >Benartzi &amp; Thaler (1999)</text>
<line x1="705" y1="555" x2="1080" y2="555" stroke="#8fa0ad" stroke-width="2"/>
<line x1="705" y1="265" x2="705" y2="555" stroke="#8fa0ad" stroke-width="2"/>
<rect x="760" y="447.0" width="105" height="108.0" rx="8" fill="#2f6f9f"/>
<text x="812" y="432.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="27.0" font-weight="700" fill="#2f6f9f" >40%</text>
<text x="812" y="585" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.0" font-weight="700" fill="#17324d" >Annual return</text>
<text x="812" y="608" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.0" font-weight="700" fill="#17324d" >distributions</text>
<rect x="930" y="312.0" width="105" height="243.0" rx="8" fill="#c56a2d"/>
<text x="982" y="297.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="27.0" font-weight="700" fill="#c56a2d" >90%</text>
<text x="982" y="585" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.0" font-weight="700" fill="#17324d" >Long-term return</text>
<text x="982" y="608" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.0" font-weight="700" fill="#17324d" >distributions</text>
<line x1="700" y1="555.0" x2="1080" y2="555.0" stroke="#dce5ea" stroke-width="1"/>
<text x="690" y="560.0" text-anchor="end" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#66737f" >0</text>
<line x1="700" y1="487.5" x2="1080" y2="487.5" stroke="#dce5ea" stroke-width="1"/>
<text x="690" y="492.5" text-anchor="end" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#66737f" >25</text>
<line x1="700" y1="420.0" x2="1080" y2="420.0" stroke="#dce5ea" stroke-width="1"/>
<text x="690" y="425.0" text-anchor="end" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#66737f" >50</text>
<line x1="700" y1="352.5" x2="1080" y2="352.5" stroke="#dce5ea" stroke-width="1"/>
<text x="690" y="357.5" text-anchor="end" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#66737f" >75</text>
<line x1="700" y1="285.0" x2="1080" y2="285.0" stroke="#dce5ea" stroke-width="1"/>
<text x="690" y="290.0" text-anchor="end" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#66737f" >100</text>
<text x="640" y="412" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.0" font-weight="700" fill="#17324d" transform="rotate(-90 640 412)">Allocation to stocks (%)</text>
<text x="885" y="654" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.0" font-weight="700" fill="#c56a2d" >Evaluation frequency changes how often losses enter view.</text>
<text x="600" y="718" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#66737f" >Reported values are context-specific. Taxes, selection, information, implementation, and alternative mechanisms remain part of the audit.</text>
</svg>

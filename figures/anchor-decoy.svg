<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" baseProfile="full" height="650" version="1.1" viewBox="0 0 1200 650" width="1200">
  <defs />
  <title>Anchoring and decoy effects</title>
  <desc>The first number pulls later estimates through insufficient adjustment; a decoy changes the comparison set and can make one option look dominant.</desc>
  <rect fill="white" height="650" width="1200" x="0" y="0" />
  <text fill="#17324d" font-family="Arial, sans-serif" font-size="34" font-weight="bold" text-anchor="middle" x="600" y="48">Context bends numerical and comparative judgment</text>
  <text fill="#17324d" font-family="Arial, sans-serif" font-size="27" font-weight="bold" text-anchor="middle" x="275" y="105">Anchoring</text>
  <text fill="#17324d" font-family="Arial, sans-serif" font-size="27" font-weight="bold" text-anchor="middle" x="895" y="105">Decoy comparison</text>
  <rect fill="#f7f1e8" height="100" rx="16" ry="16" stroke="#c56a2d" stroke-width="3" width="180" x="70" y="175" />
  <text fill="#17324d" font-family="Arial, sans-serif" font-size="20.02" font-weight="bold" text-anchor="middle" x="160" y="200.819"><tspan x="160" dy="0">First</tspan><tspan x="160" dy="23.6266">number</tspan></text>
  <text fill="#66737f" font-family="Arial, sans-serif" font-size="13.09" font-weight="normal" text-anchor="middle" x="160" y="247.25"><tspan x="160" dy="0">offer • list</tspan><tspan x="160" dy="15.4482">price • forecast</tspan></text>
  <line stroke="#c56a2d" stroke-width="4" x1="250" x2="385" y1="225" y2="225" />
  <polygon fill="#c56a2d" points="385,225 372.0096189432334,232.5 372.0096189432334,217.5" />
  <rect fill="#eaf3f8" height="100" rx="16" ry="16" stroke="#2f6f9f" stroke-width="3" width="180" x="385" y="175" />
  <text fill="#17324d" font-family="Arial, sans-serif" font-size="26" font-weight="bold" text-anchor="middle" x="475" y="208.94"><tspan x="475" dy="0">Adjustment</tspan></text>
  <text fill="#66737f" font-family="Arial, sans-serif" font-size="17" font-weight="normal" text-anchor="middle" x="475" y="237.06"><tspan x="475" dy="0">usually</tspan><tspan x="475" dy="20.06">insufficient</tspan></text>
  <line stroke="#17324d" stroke-width="4" x1="475" x2="475" y1="275" y2="390" />
  <polygon fill="#17324d" points="475,390 467.5,377.0096189432334 482.5,377.0096189432334" />
  <rect fill="#f9e7e7" height="105" rx="16" ry="16" stroke="#a74343" stroke-width="3" width="250" x="350" y="390" />
  <text fill="#17324d" font-family="Arial, sans-serif" font-size="26" font-weight="bold" text-anchor="middle" x="475" y="426.44"><tspan x="475" dy="0">Final estimate</tspan></text>
  <text fill="#66737f" font-family="Arial, sans-serif" font-size="17" font-weight="normal" text-anchor="middle" x="475" y="454.56"><tspan x="475" dy="0">still pulled toward the</tspan><tspan x="475" dy="20.06">anchor</tspan></text>
  <rect fill="#eaf3f8" height="100" rx="16" ry="16" stroke="#2f6f9f" stroke-width="3" width="170" x="700" y="175" />
  <text fill="#17324d" font-family="Arial, sans-serif" font-size="26" font-weight="bold" text-anchor="middle" x="785" y="208.94"><tspan x="785" dy="0">Option A</tspan></text>
  <text fill="#66737f" font-family="Arial, sans-serif" font-size="17" font-weight="normal" text-anchor="middle" x="785" y="237.06"><tspan x="785" dy="0">strong on</tspan><tspan x="785" dy="20.06">quality</tspan></text>
  <rect fill="#eaf3f8" height="100" rx="16" ry="16" stroke="#2f6f9f" stroke-width="3" width="170" x="955" y="175" />
  <text fill="#17324d" font-family="Arial, sans-serif" font-size="26" font-weight="bold" text-anchor="middle" x="1040" y="218.97"><tspan x="1040" dy="0">Option B</tspan></text>
  <text fill="#66737f" font-family="Arial, sans-serif" font-size="17" font-weight="normal" text-anchor="middle" x="1040" y="247.09"><tspan x="1040" dy="0">strong on price</tspan></text>
  <rect fill="#f7f1e8" height="100" rx="16" ry="16" stroke="#c56a2d" stroke-width="3" width="170" x="955" y="390" />
  <text fill="#17324d" font-family="Arial, sans-serif" font-size="26" font-weight="bold" text-anchor="middle" x="1040" y="423.94"><tspan x="1040" dy="0">Decoy B−</tspan></text>
  <text fill="#66737f" font-family="Arial, sans-serif" font-size="17" font-weight="normal" text-anchor="middle" x="1040" y="452.06"><tspan x="1040" dy="0">worse than B on</tspan><tspan x="1040" dy="20.06">both</tspan></text>
  <line stroke="#c56a2d" stroke-width="4" x1="1040" x2="1040" y1="390" y2="275" />
  <polygon fill="#c56a2d" points="1040,275 1047.5,287.9903810567666 1032.5,287.9903810567666" />
  <text fill="#c56a2d" font-family="Arial, sans-serif" font-size="22" font-weight="bold" text-anchor="middle" x="910" y="326"><tspan x="910" dy="0">B now looks</tspan><tspan x="910" dy="27">clearly dominant</tspan></text>
  <text fill="#66737f" font-family="Arial, sans-serif" font-size="21" font-weight="normal" text-anchor="middle" x="600" y="585">Independent estimates protect against anchors; stable criteria protect against comparison-set manipulation.</text>
</svg>

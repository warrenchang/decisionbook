<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="800" viewBox="0 0 1400 800" role="img" aria-labelledby="title desc">
  <title id="title">Anchoring and attraction effects with their evidence boundaries</title>
  <desc id="desc">The left panel separates the empirical anchoring pattern—estimates shift toward an available number—from four competing or complementary mechanisms: insufficient adjustment, selective accessibility, scale use, and conversational inference. The right panel shows an attraction-effect pattern in which adding an asymmetrically dominated decoy can increase the choice share of the dominating option. Neither panel claims a universal effect.</desc>
  <defs>
    <marker id="arrow-blue" viewBox="0 0 10 8" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0.5 0.8 L9 4 L0.5 7.2 Z" fill="#2f6f9f"/></marker>
    <marker id="arrow-orange" viewBox="0 0 10 8" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0.5 0.8 L9 4 L0.5 7.2 Z" fill="#c56a2d"/></marker>
    <style>
      .title{font:700 34px Arial,sans-serif;fill:#17324d}
      .subtitle{font:19px Arial,sans-serif;fill:#607080}
      .panel{font:700 27px Arial,sans-serif;fill:#17324d}
      .label{font:700 22px Arial,sans-serif;fill:#17324d}
      .body{font:18px Arial,sans-serif;fill:#536879}
      .small{font:18px Arial,sans-serif;fill:#607080}
      .flow{fill:none;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}
    </style>
  </defs>
  <rect width="1400" height="800" fill="#ffffff"/>
  <text class="title" x="700" y="48" text-anchor="middle">Context can shift estimates and comparison</text>
  <text class="subtitle" x="700" y="80" text-anchor="middle">Observed effects are distinct from the mechanisms proposed to explain them.</text>
  <line x1="700" y1="105" x2="700" y2="725" stroke="#d5e0e8" stroke-width="2"/>

  <text class="panel" x="355" y="130" text-anchor="middle">Anchoring: empirical pattern</text>
  <rect x="65" y="175" width="235" height="115" rx="18" fill="#f7f1e8" stroke="#c56a2d" stroke-width="3"/>
  <text class="label" x="183" y="216" text-anchor="middle">Available number</text>
  <text class="body" x="183" y="250" text-anchor="middle"><tspan x="183">offer, list price,</tspan><tspan x="183" dy="25">random value, forecast</tspan></text>
  <path class="flow" d="M300 233 H395" stroke="#c56a2d" stroke-width="4" marker-end="url(#arrow-orange)"/>
  <rect x="395" y="175" width="250" height="115" rx="18" fill="#fff0ed" stroke="#a74343" stroke-width="3"/>
  <text class="label" x="520" y="216" text-anchor="middle">Shifted estimate</text>
  <text class="body" x="520" y="250" text-anchor="middle"><tspan x="520">judgment is often pulled</tspan><tspan x="520" dy="25">toward the anchor</tspan></text>

  <rect x="65" y="345" width="580" height="285" rx="22" fill="#f5f8fa" stroke="#9eb1bf" stroke-width="2.5"/>
  <text class="label" x="355" y="385" text-anchor="middle">Possible mechanisms—not one settled sequence</text>
  <rect x="95" y="420" width="245" height="72" rx="15" fill="#eaf3f8" stroke="#2f6f9f" stroke-width="2"/>
  <text class="body" x="218" y="451" text-anchor="middle"><tspan x="218">insufficient</tspan><tspan x="218" dy="23">adjustment</tspan></text>
  <rect x="370" y="420" width="245" height="72" rx="15" fill="#eaf3f8" stroke="#2f6f9f" stroke-width="2"/>
  <text class="body" x="493" y="451" text-anchor="middle"><tspan x="493">selective accessibility</tspan><tspan x="493" dy="23">of consistent information</tspan></text>
  <rect x="95" y="520" width="245" height="72" rx="15" fill="#eaf3f8" stroke="#2f6f9f" stroke-width="2"/>
  <text class="body" x="218" y="551" text-anchor="middle"><tspan x="218">scale or response</tspan><tspan x="218" dy="23">mapping</tspan></text>
  <rect x="370" y="520" width="245" height="72" rx="15" fill="#eaf3f8" stroke="#2f6f9f" stroke-width="2"/>
  <text class="body" x="493" y="551" text-anchor="middle"><tspan x="493">conversational</tspan><tspan x="493" dy="23">inference</tspan></text>
  <text class="small" x="355" y="675" text-anchor="middle">Mechanism and effect size depend on task and context.</text>

  <text class="panel" x="1050" y="130" text-anchor="middle">Attraction effect: comparison pattern</text>
  <rect x="760" y="175" width="235" height="105" rx="18" fill="#eaf3f8" stroke="#2f6f9f" stroke-width="3"/>
  <text class="label" x="878" y="216" text-anchor="middle">Option A</text>
  <text class="body" x="878" y="250" text-anchor="middle">stronger on quality</text>
  <rect x="1105" y="175" width="235" height="105" rx="18" fill="#eaf3f8" stroke="#2f6f9f" stroke-width="3"/>
  <text class="label" x="1223" y="216" text-anchor="middle">Option B</text>
  <text class="body" x="1223" y="250" text-anchor="middle">stronger on price</text>
  <text class="small" x="1050" y="320" text-anchor="middle">Without a decoy, neither option dominates the other.</text>

  <rect x="1105" y="375" width="235" height="115" rx="18" fill="#f7f1e8" stroke="#c56a2d" stroke-width="3"/>
  <text class="label" x="1223" y="416" text-anchor="middle">Decoy B−</text>
  <text class="body" x="1223" y="450" text-anchor="middle"><tspan x="1223">worse than B on</tspan><tspan x="1223" dy="25">both attributes</tspan></text>
  <path class="flow" d="M1223 375 V280" stroke="#c56a2d" stroke-width="4" marker-end="url(#arrow-orange)"/>
  <text class="small" x="1060" y="362" text-anchor="middle">B dominates B−</text>

  <rect x="810" y="545" width="480" height="100" rx="20" fill="#fff0ed" stroke="#a74343" stroke-width="3"/>
  <text class="label" x="1050" y="582" text-anchor="middle">Observed pattern</text>
  <text class="body" x="1050" y="616" text-anchor="middle">Adding B− can increase B's choice share.</text>
  <path class="flow" d="M1223 490 V520 H1050 V545" stroke="#c56a2d" stroke-width="4" marker-end="url(#arrow-orange)"/>
  <text class="small" x="1050" y="680" text-anchor="middle">“Can” is essential: attraction effects vary with design and population.</text>

  <rect x="225" y="720" width="950" height="54" rx="18" fill="#17324d"/>
  <text x="700" y="754" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#ffffff">Protect the target: estimate independently, state criteria first, and test sensitivity to the comparison set.</text>
</svg>

<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440" role="img" aria-labelledby="title desc">
  <title id="title">Six perspectives on a choice and its consequences</title>
  <desc id="desc">Four linked stations follow a choice through time: before, predicted utility asks how it will feel; when choosing, decision utility asks what guides the choice; during the outcome, experienced affect asks how it feels now; afterward, remembered utility asks how the episode is remembered. A separate band across the bottom contains two broader perspectives: life evaluation asks how life is going, and meaning and purpose asks whether it is worthwhile.</desc>
  <rect width="1200" height="440" fill="#ffffff"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <g id="time-stages" font-size="18" font-weight="600" letter-spacing="1.4">
      <text x="172.5" y="37" fill="#2f6f9f">BEFORE</text>
      <text x="457.5" y="37" fill="#2f6f9f">CHOOSING</text>
      <text x="742.5" y="37" fill="#447c55">DURING</text>
      <text x="1027.5" y="37" fill="#b96a34">AFTER</text>
    </g>
    <g id="timeline" fill="none" stroke="#91a5b4" stroke-width="2">
      <line x1="80" y1="66" x2="1120" y2="66"/>
      <path d="M172.5 72 V99 M457.5 72 V99 M742.5 72 V99 M1027.5 72 V99"/>
    </g>
    <g id="time-nodes" fill="#ffffff" stroke-width="2">
      <circle cx="172.5" cy="66" r="6" stroke="#2f6f9f"/>
      <circle cx="457.5" cy="66" r="6" stroke="#2f6f9f"/>
      <circle cx="742.5" cy="66" r="6" stroke="#447c55"/>
      <circle cx="1027.5" cy="66" r="6" stroke="#b96a34"/>
    </g>
    <g id="predicted-perspective">
      <rect x="40" y="99" width="265" height="123" rx="12" fill="#f0f6fa" stroke="#dbe6ed"/>
      <text x="172.5" y="146" font-size="22" font-weight="600" fill="#193b51">Predicted utility</text>
      <text x="172.5" y="184" font-size="20" fill="#506473">How will it feel?</text>
    </g>
    <g id="decision-perspective">
      <rect x="325" y="99" width="265" height="123" rx="12" fill="#f0f6fa" stroke="#dbe6ed"/>
      <text x="457.5" y="146" font-size="22" font-weight="600" fill="#193b51">Decision utility</text>
      <text x="457.5" y="184" font-size="20" fill="#506473">What guides my choice?</text>
    </g>
    <g id="experienced-perspective">
      <rect x="610" y="99" width="265" height="123" rx="12" fill="#f0f6f0" stroke="#dfe9df"/>
      <text x="742.5" y="146" font-size="22" font-weight="600" fill="#294e36">Experienced affect</text>
      <text x="742.5" y="184" font-size="20" fill="#506473">How does it feel now?</text>
    </g>
    <g id="remembered-perspective">
      <rect x="895" y="99" width="265" height="123" rx="12" fill="#fcf4ed" stroke="#eee2d6"/>
      <text x="1027.5" y="146" font-size="22" font-weight="600" fill="#88532e">Remembered utility</text>
      <text x="1027.5" y="184" font-size="20" fill="#506473">How do I remember it?</text>
    </g>
    <g id="broader-perspectives">
      <text x="600" y="282" font-size="18" font-weight="600" letter-spacing="1.4" fill="#796183">ACROSS A LIFE</text>
      <rect x="40" y="303" width="1120" height="106" rx="12" fill="#f6f2f7" stroke="#e8e1eb"/>
      <line x1="600" y1="323" x2="600" y2="389" stroke="#ded4e3"/>
      <g id="life-perspective">
        <text x="320" y="345" font-size="22" font-weight="600" fill="#624b6d">Life evaluation</text>
        <text x="320" y="379" font-size="20" fill="#506473">How is my life going?</text>
      </g>
      <g id="meaning-perspective">
        <text x="880" y="345" font-size="22" font-weight="600" fill="#624b6d">Meaning and purpose</text>
        <text x="880" y="379" font-size="20" fill="#506473">Is it worthwhile?</text>
      </g>
    </g>
  </g>
</svg>

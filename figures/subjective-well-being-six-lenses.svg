<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">One decision, six lenses on well-being</title>
  <desc id="desc">A left-to-right timeline separates six measures. Before a choice, predicted utility forecasts future experience and decision utility records what the decision gives weight to. During an outcome, experienced affect records moment-to-moment feeling. Afterward, remembered utility evaluates the episode in memory. Across a life, life evaluation assesses life as a whole and eudaimonic measures assess meaning, purpose, and worthwhile activity. A final audit asks which person, horizon, and measure the decision is meant to improve.</desc>
  <defs>
    <marker id="timeline-arrow" viewBox="0 0 14 12" markerWidth="14" markerHeight="12" refX="13" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0.7 1 L13 6 L0.7 11 Z" fill="#25678f"/>
    </marker>
    <filter id="shadow">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#183047" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect width="1200" height="760" fill="#ffffff"/>
  <text x="600" y="52" text-anchor="middle" font-family="Georgia, serif" font-size="34" font-weight="700" fill="#183047">One decision, six lenses on well-being</text>
  <text x="600" y="84" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#607080">The measure that predicts a choice need not be the measure that captures the life produced by it.</text>

  <line x1="80" y1="354" x2="1118" y2="354" stroke="#9eb9ca" stroke-width="6"/>
  <path d="M1118 348 L1132 354 L1118 360 Z" fill="#25678f"/>

  <g font-family="Arial, sans-serif">
    <text x="205" y="130" text-anchor="middle" font-size="17" font-weight="700" letter-spacing="2" fill="#25678f">BEFORE</text>
    <text x="475" y="130" text-anchor="middle" font-size="17" font-weight="700" letter-spacing="2" fill="#447c55">DURING</text>
    <text x="735" y="130" text-anchor="middle" font-size="17" font-weight="700" letter-spacing="2" fill="#b95f2d">AFTER</text>
    <text x="1000" y="130" text-anchor="middle" font-size="17" font-weight="700" letter-spacing="2" fill="#795a8a">ACROSS A LIFE</text>
  </g>

  <g font-family="Arial, sans-serif" filter="url(#shadow)">
    <rect x="70" y="165" width="270" height="135" rx="19" fill="#eaf3f8" stroke="#25678f" stroke-width="3"/>
    <text x="205" y="207" text-anchor="middle" font-size="22" font-weight="700" fill="#183047">Predicted utility</text>
    <text x="205" y="240" text-anchor="middle" font-size="16" fill="#607080">How will this feel?</text>
    <text x="205" y="267" text-anchor="middle" font-size="16" fill="#607080">A forecast, not yet experience</text>

    <rect x="70" y="410" width="270" height="135" rx="19" fill="#f3f8fb" stroke="#25678f" stroke-width="3"/>
    <text x="205" y="452" text-anchor="middle" font-size="22" font-weight="700" fill="#183047">Decision utility</text>
    <text x="205" y="485" text-anchor="middle" font-size="16" fill="#607080">What does the choice weight?</text>
    <text x="205" y="512" text-anchor="middle" font-size="16" fill="#607080">Weight expressed in the decision</text>

    <rect x="370" y="236" width="210" height="190" rx="21" fill="#edf4ed" stroke="#447c55" stroke-width="3"/>
    <text x="475" y="282" text-anchor="middle" font-size="22" font-weight="700" fill="#183047">Experienced</text>
    <text x="475" y="310" text-anchor="middle" font-size="22" font-weight="700" fill="#183047">affect</text>
    <text x="475" y="348" text-anchor="middle" font-size="16" fill="#607080">Pleasure, pain, stress,</text>
    <text x="475" y="374" text-anchor="middle" font-size="16" fill="#607080">calm, interest—now</text>
    <text x="475" y="405" text-anchor="middle" font-size="16" font-weight="700" fill="#447c55">moment by moment</text>

    <rect x="630" y="236" width="210" height="190" rx="21" fill="#fff4e8" stroke="#b95f2d" stroke-width="3"/>
    <text x="735" y="282" text-anchor="middle" font-size="22" font-weight="700" fill="#183047">Remembered</text>
    <text x="735" y="310" text-anchor="middle" font-size="22" font-weight="700" fill="#183047">utility</text>
    <text x="735" y="348" text-anchor="middle" font-size="16" fill="#607080">How was the episode</text>
    <text x="735" y="374" text-anchor="middle" font-size="16" fill="#607080">as I now remember it?</text>
    <text x="735" y="405" text-anchor="middle" font-size="16" font-weight="700" fill="#b95f2d">memory is selective</text>

    <rect x="880" y="165" width="270" height="135" rx="19" fill="#f5ebf5" stroke="#795a8a" stroke-width="3"/>
    <text x="1015" y="207" text-anchor="middle" font-size="22" font-weight="700" fill="#183047">Life evaluation</text>
    <text x="1015" y="240" text-anchor="middle" font-size="16" fill="#607080">How is my life going</text>
    <text x="1015" y="267" text-anchor="middle" font-size="16" fill="#607080">when I step back?</text>

    <rect x="880" y="410" width="270" height="135" rx="19" fill="#f8f1f8" stroke="#795a8a" stroke-width="3"/>
    <text x="1015" y="452" text-anchor="middle" font-size="22" font-weight="700" fill="#183047">Meaning and purpose</text>
    <text x="1015" y="485" text-anchor="middle" font-size="16" fill="#607080">Is what I do worthwhile,</text>
    <text x="1015" y="512" text-anchor="middle" font-size="16" fill="#607080">coherent, and purposeful?</text>
  </g>

  <g font-family="Arial, sans-serif">
    <rect x="95" y="620" width="1010" height="92" rx="22" fill="#183047"/>
    <text x="600" y="657" text-anchor="middle" font-size="21" font-weight="700" fill="#ffffff">NO MASTER MEASURE</text>
    <text x="600" y="687" text-anchor="middle" font-size="17" fill="#dce8ef">Audit the person • time horizon • distribution • objective conditions • freedom to revise</text>
  </g>
</svg>

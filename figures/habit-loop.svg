<svg xmlns="http://www.w3.org/2000/svg" width="640" height="640" viewBox="0 0 640 640" role="img" aria-labelledby="title desc">
  <title id="title">CIAO: following a routine</title>
  <desc id="desc">Four equal segments form a ring: Cue at the top, Impulse at the right, Action at the bottom, and Outcome at the left. Three solid clockwise arrows trace an episode from cue through impulse and action to outcome. A dashed arrow from Outcome to Cue marks a later encounter with the cue. The center reads Learning across repetitions.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0 L9 5 L0 10 Z" fill="#47647e"/>
    </marker>
  </defs>
  <rect width="640" height="640" fill="#ffffff"/>

  <g id="cue" font-family="Arial, sans-serif" text-anchor="middle">
    <path class="node" d="M143.066 85.201 A294 294 0 0 1 496.934 85.201 L395.829 219.372 A126 126 0 0 0 244.171 219.372 Z" fill="#eaf3f8"/>
    <text x="320.000" y="121.000" font-size="32" font-weight="700" fill="#17324d">Cue</text>
  </g>
  <g id="impulse" font-family="Arial, sans-serif" text-anchor="middle">
    <path class="node" d="M554.799 143.066 A294 294 0 0 1 554.799 496.934 L420.628 395.829 A126 126 0 0 0 420.628 244.171 Z" fill="#e7f1ef"/>
    <text x="530.000" y="331.000" font-size="32" font-weight="700" fill="#17324d">Impulse</text>
  </g>
  <g id="action" font-family="Arial, sans-serif" text-anchor="middle">
    <path class="node" d="M496.934 554.799 A294 294 0 0 1 143.066 554.799 L244.171 420.628 A126 126 0 0 0 395.829 420.628 Z" fill="#eaf3f8"/>
    <text x="320.000" y="541.000" font-size="32" font-weight="700" fill="#17324d">Action</text>
  </g>
  <g id="outcome" font-family="Arial, sans-serif" text-anchor="middle">
    <path class="node" d="M85.201 496.934 A294 294 0 0 1 85.201 143.066 L219.372 244.171 A126 126 0 0 0 219.372 395.829 Z" fill="#f8eee1"/>
    <text x="110.000" y="331.000" font-size="32" font-weight="700" fill="#17324d">Outcome</text>
  </g>
  <g fill="none" stroke="#47647e" stroke-width="3.5" stroke-linecap="round">
    <path id="cue-to-impulse" d="M446.381 152.287 A210 210 0 0 1 487.713 193.619" stroke-width="3.5" marker-end="url(#arrow)"/>
    <path id="impulse-to-action" d="M487.713 446.381 A210 210 0 0 1 446.381 487.713" stroke-width="3.5" marker-end="url(#arrow)"/>
    <path id="action-to-outcome" d="M193.619 487.713 A210 210 0 0 1 152.287 446.381" stroke-width="3.5" marker-end="url(#arrow)"/>
    <path id="outcome-to-next-cue" d="M152.287 193.619 A210 210 0 0 1 193.619 152.287" stroke-width="3.5" stroke-dasharray="6 5" marker-end="url(#arrow)"/>
  </g>
  <g id="learning" font-family="Arial, sans-serif" text-anchor="middle" fill="#245e5c">
    <text x="320" y="310" font-size="28" font-weight="700">Learning</text>
    <text x="320" y="345" font-size="24">across repetitions</text>
  </g>
</svg>

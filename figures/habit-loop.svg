<?xml version="1.0" encoding="utf-8" ?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink" baseProfile="full" height="650" version="1.1" viewBox="0 0 1200 650" width="1200">
  <defs/>
  <title>Habit loop</title>
  <desc>Cue triggers urge, response, reward or relief, and learning, which strengthens the cue-response association.</desc>
  <rect fill="white" height="650" width="1200" x="0" y="0"/>
  <text fill="#17324d" font-family="Arial, sans-serif" font-size="34" font-weight="bold" text-anchor="middle" x="600" y="48">A habit is a context-bound decision loop</text>
  <rect fill="#eaf3f8" height="115" rx="16" ry="16" stroke="#2f6f9f" stroke-width="3" width="175" x="55" y="245"/>
  <text fill="#17324d" font-family="Arial, sans-serif" font-size="26" font-weight="bold" text-anchor="middle" x="142.5" y="294.5">Cue</text>
  <text fill="#66737f" font-family="Arial, sans-serif" font-size="17" font-weight="normal" text-anchor="middle" x="142.5" y="328.5">time • place • emotion</text>
  <rect fill="#eaf3f8" height="115" rx="16" ry="16" stroke="#2f6f9f" stroke-width="3" width="175" x="285" y="245"/>
  <text fill="#17324d" font-family="Arial, sans-serif" font-size="26" font-weight="bold" text-anchor="middle" x="372.5" y="294.5">Urge</text>
  <text fill="#66737f" font-family="Arial, sans-serif" font-size="17" font-weight="normal" text-anchor="middle" x="372.5" y="328.5">wanting • tension</text>
  <rect fill="#eaf3f8" height="115" rx="16" ry="16" stroke="#2f6f9f" stroke-width="3" width="175" x="525" y="245"/>
  <text fill="#17324d" font-family="Arial, sans-serif" font-size="26" font-weight="bold" text-anchor="middle" x="612.5" y="294.5">Response</text>
  <text fill="#66737f" font-family="Arial, sans-serif" font-size="17" font-weight="normal" text-anchor="middle" x="612.5" y="328.5">what the body does</text>
  <rect fill="#f7f1e8" height="115" rx="16" ry="16" stroke="#c56a2d" stroke-width="3" width="175" x="765" y="245"/>
  <text fill="#17324d" font-family="Arial, sans-serif" font-size="26" font-weight="bold" text-anchor="middle" x="852.5" y="294.5">Reward / relief</text>
  <text fill="#66737f" font-family="Arial, sans-serif" font-size="17" font-weight="normal" text-anchor="middle" x="852.5" y="328.5">pleasure • escape • completion</text>
  <rect fill="#f7f1e8" height="115" rx="16" ry="16" stroke="#c56a2d" stroke-width="3" width="150" x="1000" y="245"/>
  <text fill="#17324d" font-family="Arial, sans-serif" font-size="26" font-weight="bold" text-anchor="middle" x="1075.0" y="294.5">Learning</text>
  <text fill="#66737f" font-family="Arial, sans-serif" font-size="17" font-weight="normal" text-anchor="middle" x="1075.0" y="328.5">cue predicts response</text>
  <line stroke="#17324d" stroke-width="4" x1="230" x2="285" y1="302" y2="302"/>
  <polygon fill="#17324d" points="285,302 272.0096189432334,309.5 272.0096189432334,294.5"/>
  <line stroke="#17324d" stroke-width="4" x1="460" x2="525" y1="302" y2="302"/>
  <polygon fill="#17324d" points="525,302 512.0096189432334,309.5 512.0096189432334,294.5"/>
  <line stroke="#17324d" stroke-width="4" x1="700" x2="765" y1="302" y2="302"/>
  <polygon fill="#17324d" points="765,302 752.0096189432334,309.5 752.0096189432334,294.5"/>
  <line stroke="#17324d" stroke-width="4" x1="940" x2="1000" y1="302" y2="302"/>
  <polygon fill="#17324d" points="1000,302 987.0096189432334,309.5 987.0096189432334,294.5"/>
  <line stroke="#2b7a78" stroke-width="4" x1="1075" x2="150" y1="360" y2="470"/>
  <polygon fill="#2b7a78" points="150,470 162.01383927658432,461.01848198596696 163.78514240299234,475.9135310034888"/>
  <line stroke="#2b7a78" stroke-width="4" x1="150" x2="150" y1="470" y2="360"/>
  <polygon fill="#2b7a78" points="150,360 157.5,372.9903810567666 142.5,372.9903810567666"/>
  <text fill="#17324d" font-family="Arial, sans-serif" font-size="22" font-weight="normal" text-anchor="middle" x="600" y="485">Repetition in a stable context compresses prediction and valuation into a cached response.</text>
  <text fill="#66737f" font-family="Arial, sans-serif" font-size="20" font-weight="normal" text-anchor="middle" x="600" y="545">Relief can reinforce behavior even when long-term outcomes worsen.</text>
</svg>

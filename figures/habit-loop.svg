<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" baseProfile="full" height="650" version="1.1" viewBox="0 0 1200 650" width="1200">
  <defs>
    <marker id="teal-arrow" viewBox="0 0 10 8" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0.5 0.8 L9 4 L0.5 7.2 Z" fill="#2b7a78" />
    </marker>
  </defs>
  <title>Habit loop</title>
  <desc>Cue triggers urge, response, reward or relief, and learning, which strengthens the cue-response association.</desc>
  <rect fill="white" height="650" width="1200" x="0" y="0" />
  <text fill="#17324d" font-family="Arial, sans-serif" font-size="34" font-weight="bold" text-anchor="middle" x="600" y="48">A habit is a context-bound decision loop</text>
  <!-- Equal-width stages and equal gaps make the repeated cycle easy to scan. -->
  <rect fill="#eaf3f8" height="115" rx="16" ry="16" stroke="#2f6f9f" stroke-width="3" width="180" x="30" y="245" />
  <text fill="#17324d" font-family="Arial, sans-serif" font-size="26" font-weight="bold" text-anchor="middle" x="120" y="286.44"><tspan x="120" dy="0">Cue</tspan></text>
  <text fill="#66737f" font-family="Arial, sans-serif" font-size="17" font-weight="normal" text-anchor="middle" x="120" y="314.56"><tspan x="120" dy="0">time • place •</tspan><tspan x="120" dy="20.06">emotion</tspan></text>
  <rect fill="#eaf3f8" height="115" rx="16" ry="16" stroke="#2f6f9f" stroke-width="3" width="180" x="270" y="245" />
  <text fill="#17324d" font-family="Arial, sans-serif" font-size="26" font-weight="bold" text-anchor="middle" x="360" y="286.44"><tspan x="360" dy="0">Urge</tspan></text>
  <text fill="#66737f" font-family="Arial, sans-serif" font-size="17" font-weight="normal" text-anchor="middle" x="360" y="314.56"><tspan x="360" dy="0">wanting •</tspan><tspan x="360" dy="20.06">tension</tspan></text>
  <rect fill="#eaf3f8" height="115" rx="16" ry="16" stroke="#2f6f9f" stroke-width="3" width="180" x="510" y="245" />
  <text fill="#17324d" font-family="Arial, sans-serif" font-size="26" font-weight="bold" text-anchor="middle" x="600" y="286.44"><tspan x="600" dy="0">Response</tspan></text>
  <text fill="#66737f" font-family="Arial, sans-serif" font-size="17" font-weight="normal" text-anchor="middle" x="600" y="314.56"><tspan x="600" dy="0">what the body</tspan><tspan x="600" dy="20.06">does</tspan></text>
  <rect fill="#f7f1e8" height="115" rx="16" ry="16" stroke="#c56a2d" stroke-width="3" width="180" x="750" y="245" />
  <text fill="#17324d" font-family="Arial, sans-serif" font-size="19.93" font-weight="bold" text-anchor="middle" x="840" y="270.742"><tspan x="840" dy="0">Reward /</tspan><tspan x="840" dy="23.5179">relief</tspan></text>
  <text fill="#66737f" font-family="Arial, sans-serif" font-size="16" font-weight="normal" text-anchor="middle" x="840" y="316.982"><tspan x="840" dy="0">pleasure •</tspan><tspan x="840" dy="15.3771">escape •</tspan><tspan x="840" dy="15.3771">completion</tspan></text>
  <rect fill="#f7f1e8" height="115" rx="16" ry="16" stroke="#c56a2d" stroke-width="3" width="180" x="990" y="245" />
  <text fill="#17324d" font-family="Arial, sans-serif" font-size="26" font-weight="bold" text-anchor="middle" x="1080" y="286.44"><tspan x="1080" dy="0">Learning</tspan></text>
  <text fill="#66737f" font-family="Arial, sans-serif" font-size="17" font-weight="normal" text-anchor="middle" x="1080" y="314.56"><tspan x="1080" dy="0">cue predicts</tspan><tspan x="1080" dy="20.06">response</tspan></text>
  <line stroke="#17324d" stroke-width="4" x1="210" x2="270" y1="302" y2="302" />
  <polygon fill="#17324d" points="270,302 260,307.5 260,296.5" />
  <line stroke="#17324d" stroke-width="4" x1="450" x2="510" y1="302" y2="302" />
  <polygon fill="#17324d" points="510,302 500,307.5 500,296.5" />
  <line stroke="#17324d" stroke-width="4" x1="690" x2="750" y1="302" y2="302" />
  <polygon fill="#17324d" points="750,302 740,307.5 740,296.5" />
  <line stroke="#17324d" stroke-width="4" x1="930" x2="990" y1="302" y2="302" />
  <polygon fill="#17324d" points="990,302 980,307.5 980,296.5" />
  <path d="M1080 360 V420 H120 V360" fill="none" stroke="#2b7a78" stroke-width="4" stroke-linejoin="round" marker-end="url(#teal-arrow)" />
  <text fill="#17324d" font-family="Arial, sans-serif" font-size="22" font-weight="normal" text-anchor="middle" x="600" y="485">Repetition in a stable context compresses prediction and valuation into a cached response.</text>
  <text fill="#66737f" font-family="Arial, sans-serif" font-size="20" font-weight="normal" text-anchor="middle" x="600" y="545">Relief can reinforce behavior even when long-term outcomes worsen.</text>
</svg>

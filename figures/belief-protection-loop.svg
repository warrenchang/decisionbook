<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" baseProfile="full" height="650" version="1.1" viewBox="0 0 1200 650" width="1200">
  <defs />
  <title>Belief protection loop</title>
  <desc>A belief guides search, interpretation, memory, and confidence, which reinforce the belief. Disconfirming tests and independent standards can interrupt the loop.</desc>
  <rect fill="white" height="650" width="1200" x="0" y="0" />
  <text fill="#17324d" font-family="Arial, sans-serif" font-size="34" font-weight="bold" text-anchor="middle" x="600" y="48">How a belief becomes its own evidence</text>
  <rect fill="#eaf3f8" height="95" rx="16" ry="16" stroke="#2f6f9f" stroke-width="3" width="280" x="460" y="95" />
  <text fill="#17324d" font-family="Arial, sans-serif" font-size="26" font-weight="bold" text-anchor="middle" x="600" y="126.44"><tspan x="600" dy="0">Belief</tspan></text>
  <text fill="#66737f" font-family="Arial, sans-serif" font-size="17" font-weight="normal" text-anchor="middle" x="600" y="154.56"><tspan x="600" dy="0">a conclusion feels</tspan><tspan x="600" dy="20.06">plausible</tspan></text>
  <rect fill="#eaf3f8" height="95" rx="16" ry="16" stroke="#2f6f9f" stroke-width="3" width="280" x="845" y="190" />
  <text fill="#17324d" font-family="Arial, sans-serif" font-size="26" font-weight="bold" text-anchor="middle" x="985" y="231.47"><tspan x="985" dy="0">Selective search</tspan></text>
  <text fill="#66737f" font-family="Arial, sans-serif" font-size="17" font-weight="normal" text-anchor="middle" x="985" y="259.59"><tspan x="985" dy="0">support is easier to seek</tspan></text>
  <rect fill="#eaf3f8" height="95" rx="16" ry="16" stroke="#2f6f9f" stroke-width="3" width="280" x="845" y="420" />
  <text fill="#17324d" font-family="Arial, sans-serif" font-size="26" font-weight="bold" text-anchor="middle" x="985" y="451.44"><tspan x="985" dy="0">Biased reading</tspan></text>
  <text fill="#66737f" font-family="Arial, sans-serif" font-size="17" font-weight="normal" text-anchor="middle" x="985" y="479.56"><tspan x="985" dy="0">ambiguity favors the</tspan><tspan x="985" dy="20.06">belief</tspan></text>
  <rect fill="#f7f1e8" height="95" rx="16" ry="16" stroke="#c56a2d" stroke-width="3" width="280" x="75" y="420" />
  <text fill="#17324d" font-family="Arial, sans-serif" font-size="26" font-weight="bold" text-anchor="middle" x="215" y="451.44"><tspan x="215" dy="0">Confidence</tspan></text>
  <text fill="#66737f" font-family="Arial, sans-serif" font-size="17" font-weight="normal" text-anchor="middle" x="215" y="479.56"><tspan x="215" dy="0">coherence feels like</tspan><tspan x="215" dy="20.06">knowledge</tspan></text>
  <rect fill="#f7f1e8" height="95" rx="16" ry="16" stroke="#c56a2d" stroke-width="3" width="280" x="75" y="190" />
  <text fill="#17324d" font-family="Arial, sans-serif" font-size="26" font-weight="bold" text-anchor="middle" x="215" y="221.44"><tspan x="215" dy="0">Selective memory</tspan></text>
  <text fill="#66737f" font-family="Arial, sans-serif" font-size="17" font-weight="normal" text-anchor="middle" x="215" y="249.56"><tspan x="215" dy="0">support is easier to</tspan><tspan x="215" dy="20.06">retrieve</tspan></text>
  <line stroke="#2b7a78" stroke-width="3" x1="740" x2="845" y1="142" y2="237" />
  <polygon fill="#2b7a78" points="845,237 830.3353177321875,233.84609860900744 840.3990175917244,222.7230619221509" />
  <line stroke="#2b7a78" stroke-width="3" x1="985" x2="985" y1="285" y2="420" />
  <polygon fill="#2b7a78" points="985,420 977.5,407.0096189432334 992.5,407.0096189432334" />
  <line stroke="#2b7a78" stroke-width="3" x1="845" x2="355" y1="468" y2="468" />
  <polygon fill="#2b7a78" points="355,468 367.9903810567666,460.5 367.9903810567666,475.5" />
  <line stroke="#2b7a78" stroke-width="3" x1="215" x2="215" y1="420" y2="285" />
  <polygon fill="#2b7a78" points="215,285 222.5,297.9903810567666 207.5,297.9903810567666" />
  <line stroke="#2b7a78" stroke-width="3" x1="355" x2="460" y1="237" y2="142" />
  <polygon fill="#2b7a78" points="460,142 455.3990175917244,156.2769380778491 445.3353177321875,145.15390139099256" />
  <rect fill="#edf4ed" height="115" rx="16" ry="16" stroke="#447c55" stroke-width="3" width="430" x="385" y="275" />
  <text fill="#17324d" font-family="Arial, sans-serif" font-size="26" font-weight="bold" text-anchor="middle" x="600" y="316.44"><tspan x="600" dy="0">Interrupt the loop</tspan></text>
  <text fill="#66737f" font-family="Arial, sans-serif" font-size="17" font-weight="normal" text-anchor="middle" x="600" y="344.56"><tspan x="600" dy="0">criteria • opposite • independent estimate</tspan><tspan x="600" dy="20.06">• calibration</tspan></text>
</svg>
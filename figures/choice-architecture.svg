<svg xmlns="http://www.w3.org/2000/svg" width="760" height="855" viewBox="0 0 760 855" role="img" aria-labelledby="title desc">
<title id="title">Five places to inspect a choice environment</title><desc id="desc">Five diagnostic questions concern the objective, the menu, understanding, action, and feedback. They are places to inspect, not a validated psychological stage sequence. A final question asks whether people can decline, correct mistakes, and report harm.</desc>
<rect width="760" height="855" fill="white"/>
<defs>
<marker id="a" viewBox="0 0 12 10" markerWidth="9" markerHeight="8" refX="11" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L11 5 L1 9 Z" fill="#2f6f9f"/></marker>
<marker id="g" viewBox="0 0 12 10" markerWidth="9" markerHeight="8" refX="11" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L11 5 L1 9 Z" fill="#3f7c59"/></marker>
<marker id="o" viewBox="0 0 12 10" markerWidth="9" markerHeight="8" refX="11" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L11 5 L1 9 Z" fill="#b95f2d"/></marker>
</defs>
<text x="380" y="48" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="700" fill="#17324d">Inspect the choice environment</text>
<rect x="35" y="105" width="690" height="104" rx="18" fill="#edf5fa" stroke="#2f6f9f" stroke-width="2.5"/>
<text x="65" y="142" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#17324d">Objective</text>
<text x="65" y="182" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="400" fill="#53697d">Whose goal is the design serving?</text>
<rect x="35" y="235" width="690" height="104" rx="18" fill="#edf7ef" stroke="#3f7c59" stroke-width="2.5"/>
<text x="65" y="272" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#17324d">Menu</text>
<text x="65" y="312" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="400" fill="#53697d">What is offered, missing, or preselected?</text>
<rect x="35" y="365" width="690" height="104" rx="18" fill="#fff5ec" stroke="#b95f2d" stroke-width="2.5"/>
<text x="65" y="402" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#17324d">Understanding</text>
<text x="65" y="442" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="400" fill="#53697d">Can people compare the consequences?</text>
<rect x="35" y="495" width="690" height="104" rx="18" fill="#f4eff8" stroke="#795a8a" stroke-width="2.5"/>
<text x="65" y="532" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#17324d">Action</text>
<text x="65" y="572" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="400" fill="#53697d">What makes the next step easy or difficult?</text>
<rect x="35" y="625" width="690" height="104" rx="18" fill="#edf5fa" stroke="#2f6f9f" stroke-width="2.5"/>
<text x="65" y="662" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#17324d">Feedback</text>
<text x="65" y="702" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="400" fill="#53697d">Can people see and correct what happened?</text>
<text x="380" y="789" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="400" fill="#3f7c59">Throughout: can people decline, correct mistakes,</text>
<text x="380" y="825.4" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="400" fill="#3f7c59">and report harm? Test the answer in practice.</text>
</svg>

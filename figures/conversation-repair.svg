<svg xmlns="http://www.w3.org/2000/svg" width="760" height="805" viewBox="0 0 760 805" role="img" aria-labelledby="title desc">
<title id="title">Three moves toward repair</title><desc id="desc">A classroom repair procedure separates observed events from interpretations, asks about the other person’s account, then agrees a possible next action. Safety, coercion, or severe power imbalance may instead call for boundaries, support, or exit.</desc>
<rect width="760" height="805" fill="white"/>
<defs>
<marker id="a" viewBox="0 0 12 10" markerWidth="9" markerHeight="8" refX="11" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L11 5 L1 9 Z" fill="#2f6f9f"/></marker>
<marker id="g" viewBox="0 0 12 10" markerWidth="9" markerHeight="8" refX="11" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L11 5 L1 9 Z" fill="#3f7c59"/></marker>
<marker id="o" viewBox="0 0 12 10" markerWidth="9" markerHeight="8" refX="11" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L11 5 L1 9 Z" fill="#b95f2d"/></marker>
</defs>
<text x="380" y="48" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="700" fill="#17324d">Three moves toward repair</text>
<rect x="60" y="112" width="640" height="140" rx="18" fill="#edf5fa" stroke="#2f6f9f" stroke-width="2.5"/>
<text x="380" y="153" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="700" fill="#17324d">Describe what happened</text>
<text x="380" y="198" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="400" fill="#17324d">“The deadline changed, and</text>
<text x="380" y="234.4" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="400" fill="#17324d">I did not receive the update.”</text>
<path d="M380 252 V297" fill="none" stroke="#2f6f9f" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#a)"/>
<rect x="60" y="297" width="640" height="140" rx="18" fill="#fff5ec" stroke="#b95f2d" stroke-width="2.5"/>
<text x="380" y="338" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="700" fill="#17324d">Check your interpretation</text>
<text x="380" y="383" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="400" fill="#17324d">“I took that to mean my work</text>
<text x="380" y="419.4" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="400" fill="#17324d">was not needed. What happened?”</text>
<path d="M380 437 V482" fill="none" stroke="#2f6f9f" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#a)"/>
<rect x="60" y="482" width="640" height="140" rx="18" fill="#edf7ef" stroke="#3f7c59" stroke-width="2.5"/>
<text x="380" y="523" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="700" fill="#17324d">Agree what happens next</text>
<text x="380" y="568" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="400" fill="#17324d">Name the repair, owner, and time;</text>
<text x="380" y="604.4" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="400" fill="#17324d">check whether both can accept it.</text>
<text x="380" y="682" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#3f7c59">Reconciliation must be voluntary.</text>
<text x="380" y="733" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="400" fill="#53697d">Unsafe or coercive situations may require</text>
<text x="380" y="769.4" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="400" fill="#53697d">a boundary, support, or exit.</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Human and AI roles in governed judgment</title>
  <desc id="desc">A human lane defines goals, values and accountable exceptions. A model lane calculates, retrieves and applies consistent rules. Both feed a governed decision through validation, verification, subgroup audit, documentation, contestability and monitoring.</desc>
  <defs>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="17" markerHeight="17" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#2b75a0"/>
    </marker>
    <marker id="arrowPurple" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="17" markerHeight="17" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#80639a"/>
    </marker>
    <filter id="shadow" x="-12%" y="-15%" width="124%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#183047" flood-opacity="0.13"/>
    </filter>
  </defs>
  <rect width="1200" height="720" fill="#ffffff"/>
  <text x="600" y="56" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700" fill="#183047">AI changes where judgment is needed; it does not remove judgment</text>
  <text x="600" y="92" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#60758a">Assign roles by comparative evidence, then govern the full decision.</text>

  <g font-family="Arial, Helvetica, sans-serif" filter="url(#shadow)">
    <rect x="68" y="142" width="370" height="182" rx="24" fill="#edf5fa" stroke="#2b75a0" stroke-width="3"/>
    <text x="253" y="182" text-anchor="middle" font-size="24" font-weight="700" fill="#245f84">HUMAN JUDGMENT</text>
    <text x="103" y="220" font-size="17" fill="#183047">• define legitimate goals and rights</text>
    <text x="103" y="251" font-size="17" fill="#183047">• weigh values and unusual context</text>
    <text x="103" y="282" font-size="17" fill="#183047">• own reasons, exceptions, accountability</text>

    <rect x="68" y="382" width="370" height="182" rx="24" fill="#f2eef8" stroke="#80639a" stroke-width="3"/>
    <text x="253" y="422" text-anchor="middle" font-size="24" font-weight="700" fill="#664d80">MODEL OR AI</text>
    <text x="103" y="460" font-size="17" fill="#183047">• calculate, retrieve, summarize</text>
    <text x="103" y="491" font-size="17" fill="#183047">• apply an explicit rule consistently</text>
    <text x="103" y="522" font-size="17" fill="#183047">• generate alternatives and stress tests</text>

    <rect x="802" y="238" width="330" height="230" rx="26" fill="#edf7ef" stroke="#4f8b61" stroke-width="4"/>
    <text x="967" y="288" text-anchor="middle" font-size="26" font-weight="700" fill="#2d6740">GOVERNED DECISION</text>
    <text x="967" y="329" text-anchor="middle" font-size="18" fill="#183047">reasoned authority</text>
    <text x="967" y="361" text-anchor="middle" font-size="18" fill="#183047">documented system role</text>
    <text x="967" y="393" text-anchor="middle" font-size="18" fill="#183047">justified exception and appeal</text>
    <text x="967" y="425" text-anchor="middle" font-size="18" fill="#183047">outcome and drift review</text>
  </g>

  <path d="M438 233 C570 233 645 286 802 320" fill="none" stroke="#2b75a0" stroke-width="6" marker-end="url(#arrowBlue)"/>
  <path d="M438 473 C570 473 645 420 802 386" fill="none" stroke="#80639a" stroke-width="6" marker-end="url(#arrowPurple)"/>

  <rect x="464" y="170" width="304" height="360" rx="24" fill="#fff8ea" stroke="#d39b34" stroke-width="3"/>
  <text x="616" y="209" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" fill="#7d5718">GUARDRAILS</text>
  <g font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#183047">
    <text x="498" y="255">✓ correct target</text>
    <text x="498" y="296">✓ out-of-sample validation</text>
    <text x="498" y="337">✓ factual verification</text>
    <text x="498" y="378">✓ subgroup and fairness audit</text>
    <text x="498" y="419">✓ calibrated reliance</text>
    <text x="498" y="460">✓ privacy and security</text>
    <text x="498" y="501">✓ correction and contestability</text>
  </g>

  <rect x="128" y="622" width="944" height="56" rx="18" fill="#f4f7f9" stroke="#b7c6d2" stroke-width="2"/>
  <text x="600" y="656" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" fill="#183047">Neither fluency nor consistency proves validity. Trust should follow comparative evidence.</text>
</svg>

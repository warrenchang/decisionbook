<text x="594.286" y="254" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#447c55">55% with</text>
<text x="710" y="295" text-anchor="end" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="400" fill="#17324d">Benefit: 5 percentage points</text>
</g>
<g id="group-b">
<text x="34" y="394" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700" fill="#17324d">Group B</text>
<line x1="324.286" y1="383" x2="478.571" y2="383" stroke="#526778" stroke-width="5" stroke-linecap="round" />
<circle cx="478.571" cy="383" r="10" fill="#c56a2d" stroke="white" stroke-width="3"/>
<circle cx="324.286" cy="383" r="10" fill="#447c55" stroke="white" stroke-width="3"/>
<text x="478.571" y="352" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#c56a2d">40% without</text>
<text x="324.286" y="434" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#447c55">20% with</text>
<text x="710" y="475" text-anchor="end" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="400" fill="#17324d">Benefit: 20 percentage points</text>
</g>
<line x1="170" y1="505" x2="710" y2="505" stroke="#526778" stroke-width="2" stroke-linecap="round" />
<text x="400" y="605" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="700" fill="#17324d">Risk ranks A first; benefit ranks B first</text>
</svg>

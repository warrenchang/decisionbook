<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="800" height="642" viewBox="0 0 800 642" role="img" aria-labelledby="title desc">
  <title id="title">Risk is not the same as benefit</title>
  <desc id="desc">Completely hypothetical group-average causal comparison, not empirical data or a claim that outreach is effective. Group A's dropout probability is assumed to be 60 percent without outreach and 55 percent with outreach, a reduction of 5 percentage points. Group B's probabilities are 40 percent and 20 percent, a reduction of 20 percentage points. Orange points show probabilities without outreach; green points show probabilities with outreach. The common horizontal axis runs from 0 to 70 percent. Baseline risk ranks A first, but the expected average benefit of outreach ranks B first. The benefit ranking is relevant if outreach costs, feasibility, and the value of preventing a dropout are equal; other values or constraints can change the allocation. Effects are group averages, not identified individual effects. Estimating outcomes with versus without outreach requires causal evidence; a baseline risk model alone does not supply those effects.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 9 8" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0.5 0.5 L8 4 L0.5 7.5 Z" fill="#526778"/>
    </marker>
  </defs>
  <rect width="800" height="642" fill="white"/>
<text x="400" y="49" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="36" font-weight="700" fill="#17324d">Risk is not the same as benefit</text>
<text x="400" y="105" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="400" fill="#17324d">Dropout probability</text>
<line x1="170" y1="139" x2="170" y2="505" stroke="#edf1f4" stroke-width="2" stroke-linecap="round" />
<line x1="170" y1="505" x2="170" y2="515" stroke="#526778" stroke-width="2" stroke-linecap="round" />
<text x="170" y="548" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="400" fill="#526778">0%</text>
<line x1="247.143" y1="139" x2="247.143" y2="505" stroke="#edf1f4" stroke-width="2" stroke-linecap="round" />
<line x1="247.143" y1="505" x2="247.143" y2="515" stroke="#526778" stroke-width="2" stroke-linecap="round" />
<text x="247.143" y="548" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="400" fill="#526778">10%</text>
<line x1="324.286" y1="139" x2="324.286" y2="505" stroke="#edf1f4" stroke-width="2" stroke-linecap="round" />
<line x1="324.286" y1="505" x2="324.286" y2="515" stroke="#526778" stroke-width="2" stroke-linecap="round" />
<text x="324.286" y="548" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="400" fill="#526778">20%</text>
<line x1="401.429" y1="139" x2="401.429" y2="505" stroke="#edf1f4" stroke-width="2" stroke-linecap="round" />
<line x1="401.429" y1="505" x2="401.429" y2="515" stroke="#526778" stroke-width="2" stroke-linecap="round" />
<text x="401.429" y="548" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="400" fill="#526778">30%</text>
<line x1="478.571" y1="139" x2="478.571" y2="505" stroke="#edf1f4" stroke-width="2" stroke-linecap="round" />
<line x1="478.571" y1="505" x2="478.571" y2="515" stroke="#526778" stroke-width="2" stroke-linecap="round" />
<text x="478.571" y="548" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="400" fill="#526778">40%</text>
<line x1="555.714" y1="139" x2="555.714" y2="505" stroke="#edf1f4" stroke-width="2" stroke-linecap="round" />
<line x1="555.714" y1="505" x2="555.714" y2="515" stroke="#526778" stroke-width="2" stroke-linecap="round" />
<text x="555.714" y="548" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="400" fill="#526778">50%</text>
<line x1="632.857" y1="139" x2="632.857" y2="505" stroke="#edf1f4" stroke-width="2" stroke-linecap="round" />
<line x1="632.857" y1="505" x2="632.857" y2="515" stroke="#526778" stroke-width="2" stroke-linecap="round" />
<text x="632.857" y="548" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="400" fill="#526778">60%</text>
<line x1="710" y1="139" x2="710" y2="505" stroke="#edf1f4" stroke-width="2" stroke-linecap="round" />
<line x1="710" y1="505" x2="710" y2="515" stroke="#526778" stroke-width="2" stroke-linecap="round" />
<text x="710" y="548" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="400" fill="#526778">70%</text>
<g id="group-a">
<text x="34" y="214" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700" fill="#17324d">Group A</text>

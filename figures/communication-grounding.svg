<?xml version="1.0" encoding="utf-8" ?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink" baseProfile="full" height="650" version="1.1" viewBox="0 0 1200 650" width="1200">
  <defs/>
  <title>Communication as grounding</title>
  <desc>Speaker expresses a model; listener interprets it; questions, paraphrase and repair build common ground and shared action.</desc>
  <rect fill="white" height="650" width="1200" x="0" y="0"/>
  <text fill="#17324d" font-family="Arial, sans-serif" font-size="34" font-weight="bold" text-anchor="middle" x="600" y="48">Communication is joint inference, not message delivery</text>
  <rect fill="#eaf3f8" height="140" rx="16" ry="16" stroke="#2f6f9f" stroke-width="3" width="260" x="55" y="180"/>
  <text fill="#17324d" font-family="Arial, sans-serif" font-size="26" font-weight="bold" text-anchor="middle" x="185.0" y="242.0">Person A</text>
  <text fill="#66737f" font-family="Arial, sans-serif" font-size="17" font-weight="normal" text-anchor="middle" x="185.0" y="276.0">intention + context</text>
  <rect fill="#f7f1e8" height="140" rx="16" ry="16" stroke="#c56a2d" stroke-width="3" width="260" x="885" y="180"/>
  <text fill="#17324d" font-family="Arial, sans-serif" font-size="26" font-weight="bold" text-anchor="middle" x="1015.0" y="242.0">Person B</text>
  <text fill="#66737f" font-family="Arial, sans-serif" font-size="17" font-weight="normal" text-anchor="middle" x="1015.0" y="276.0">interpretation + context</text>
  <rect fill="#eaf3f8" height="110" rx="16" ry="16" stroke="#2f6f9f" stroke-width="3" width="300" x="450" y="130"/>
  <text fill="#17324d" font-family="Arial, sans-serif" font-size="26" font-weight="bold" text-anchor="middle" x="600.0" y="177.0">Words + signals</text>
  <text fill="#66737f" font-family="Arial, sans-serif" font-size="17" font-weight="normal" text-anchor="middle" x="600.0" y="211.0">content • tone • timing</text>
  <line stroke="#17324d" stroke-width="4" x1="315" x2="450" y1="225" y2="190"/>
  <polygon fill="#17324d" points="450,190 439.30756762193613,200.52007080967286 435.5431352401802,186.00011733718586"/>
  <line stroke="#17324d" stroke-width="4" x1="750" x2="885" y1="190" y2="225"/>
  <polygon fill="#17324d" points="885,225 870.5431352401803,228.99988266281414 874.3075676219361,214.47992919032714"/>
  <rect fill="#edf4ed" height="120" rx="16" ry="16" stroke="#447c55" stroke-width="3" width="300" x="450" y="370"/>
  <text fill="#17324d" font-family="Arial, sans-serif" font-size="26" font-weight="bold" text-anchor="middle" x="600.0" y="422.0">Grounding + repair</text>
  <text fill="#66737f" font-family="Arial, sans-serif" font-size="17" font-weight="normal" text-anchor="middle" x="600.0" y="456.0">ask • paraphrase • correct</text>
  <line stroke="#447c55" stroke-width="4" x1="885" x2="750" y1="305" y2="420"/>
  <polygon fill="#447c55" points="750,420 755.025341223908,405.8668494105776 764.7523380579048,417.28549786787823"/>
  <line stroke="#447c55" stroke-width="4" x1="450" x2="315" y1="420" y2="305"/>
  <polygon fill="#447c55" points="315,305 329.7523380579048,307.71450213212177 320.02534122390796,319.1331505894224"/>
  <text fill="#66737f" font-family="Arial, sans-serif" font-size="21" font-weight="normal" text-anchor="middle" x="600" y="560">Understanding is good enough for the current purpose—not assumed once and for all.</text>
</svg>

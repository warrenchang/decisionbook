<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" baseProfile="full" height="650" version="1.1" viewBox="0 0 1200 650" width="1200">
  <defs />
  <title>Behavior design stack</title>
  <desc>Behavior is supported by motivation, ability and prompt, with upstream tools: environment, friction, plans, social support, and recovery.</desc>
  <rect fill="white" height="650" width="1200" x="0" y="0" />
  <text fill="#17324d" font-family="Arial, sans-serif" font-size="34" font-weight="bold" text-anchor="middle" x="600" y="48">Design behavior upstream of the moment of temptation</text>
  <rect fill="#eaf3f8" height="75" rx="16" ry="16" stroke="#2f6f9f" stroke-width="3" width="960" x="120" y="500" />
  <text fill="#17324d" font-family="Arial, sans-serif" font-size="26" font-weight="bold" text-anchor="middle" x="600" y="531.47"><tspan x="600" dy="0">5. Recovery</tspan></text>
  <text fill="#66737f" font-family="Arial, sans-serif" font-size="17" font-weight="normal" text-anchor="middle" x="600" y="559.59"><tspan x="600" dy="0">relapse plan • restart at next cue</tspan></text>
  <rect fill="#eaf3f8" height="75" rx="16" ry="16" stroke="#2f6f9f" stroke-width="3" width="840" x="180" y="405" />
  <text fill="#17324d" font-family="Arial, sans-serif" font-size="26" font-weight="bold" text-anchor="middle" x="600" y="436.47"><tspan x="600" dy="0">4. Prompt</tspan></text>
  <text fill="#66737f" font-family="Arial, sans-serif" font-size="17" font-weight="normal" text-anchor="middle" x="600" y="464.59"><tspan x="600" dy="0">visible cue at the right moment</tspan></text>
  <rect fill="#edf4ed" height="75" rx="16" ry="16" stroke="#447c55" stroke-width="3" width="720" x="240" y="310" />
  <text fill="#17324d" font-family="Arial, sans-serif" font-size="26" font-weight="bold" text-anchor="middle" x="600" y="341.47"><tspan x="600" dy="0">3. Ability</tspan></text>
  <text fill="#66737f" font-family="Arial, sans-serif" font-size="17" font-weight="normal" text-anchor="middle" x="600" y="369.59"><tspan x="600" dy="0">reduce friction • smallest viable action</tspan></text>
  <rect fill="#f7f1e8" height="75" rx="16" ry="16" stroke="#c56a2d" stroke-width="3" width="600" x="300" y="215" />
  <text fill="#17324d" font-family="Arial, sans-serif" font-size="26" font-weight="bold" text-anchor="middle" x="600" y="246.47"><tspan x="600" dy="0">2. Motivation</tspan></text>
  <text fill="#66737f" font-family="Arial, sans-serif" font-size="17" font-weight="normal" text-anchor="middle" x="600" y="274.59"><tspan x="600" dy="0">meaning • immediate reward • commitment</tspan></text>
  <rect fill="#f5ebf5" height="75" rx="16" ry="16" stroke="#795a8a" stroke-width="3" width="480" x="360" y="120" />
  <text fill="#17324d" font-family="Arial, sans-serif" font-size="26" font-weight="bold" text-anchor="middle" x="600" y="151.47"><tspan x="600" dy="0">1. Environment</tspan></text>
  <text fill="#66737f" font-family="Arial, sans-serif" font-size="17" font-weight="normal" text-anchor="middle" x="600" y="179.59"><tspan x="600" dy="0">availability • defaults • social context</tspan></text>
  <text fill="#66737f" font-family="Arial, sans-serif" font-size="22" font-weight="normal" text-anchor="middle" x="600" y="610">The most reliable intervention is often the one that requires the least heroism.</text>
</svg>
<?xml version="1.0" encoding="utf-8" ?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink" baseProfile="full" height="650" version="1.1" viewBox="0 0 1200 650" width="1200">
  <defs/>
  <title>Rational-choice benchmark</title>
  <desc>Feasible alternatives, beliefs and probabilities, and preferences and values combine in expected utility to guide choice.</desc>
  <rect fill="white" height="650" width="1200" x="0" y="0"/>
  <text fill="#17324d" font-family="Arial, sans-serif" font-size="34" font-weight="bold" text-anchor="middle" x="600" y="55">Rational-choice benchmark under uncertainty</text>
  <rect fill="#eaf3f8" height="110" rx="16" ry="16" stroke="#2f6f9f" stroke-width="3" width="285" x="55" y="115"/>
  <text fill="#17324d" font-family="Arial, sans-serif" font-size="26" font-weight="bold" text-anchor="middle" x="197.5" y="162.0">Feasible alternatives</text>
  <text fill="#66737f" font-family="Arial, sans-serif" font-size="17" font-weight="normal" text-anchor="middle" x="197.5" y="196.0">What can be done?</text>
  <rect fill="#eaf3f8" height="110" rx="16" ry="16" stroke="#2f6f9f" stroke-width="3" width="285" x="55" y="275"/>
  <text fill="#17324d" font-family="Arial, sans-serif" font-size="26" font-weight="bold" text-anchor="middle" x="197.5" y="322.0">Beliefs / probabilities</text>
  <text fill="#66737f" font-family="Arial, sans-serif" font-size="17" font-weight="normal" text-anchor="middle" x="197.5" y="356.0">What may follow?</text>
  <rect fill="#f7f1e8" height="110" rx="16" ry="16" stroke="#c56a2d" stroke-width="3" width="285" x="55" y="435"/>
  <text fill="#17324d" font-family="Arial, sans-serif" font-size="26" font-weight="bold" text-anchor="middle" x="197.5" y="482.0">Preferences / values</text>
  <text fill="#66737f" font-family="Arial, sans-serif" font-size="17" font-weight="normal" text-anchor="middle" x="197.5" y="516.0">How good are outcomes?</text>
  <rect fill="#17324d" height="170" rx="16" ry="16" stroke="#17324d" stroke-width="3" width="300" x="450" y="230"/>
  <text fill="#17324d" font-family="Arial, sans-serif" font-size="26" font-weight="bold" text-anchor="middle" x="600.0" y="307.0">Expected utility</text>
  <text fill="#66737f" font-family="Arial, sans-serif" font-size="17" font-weight="normal" text-anchor="middle" x="600.0" y="341.0">compare probability-weighted outcomes</text>
  <text fill="white" font-family="Arial, sans-serif" font-size="30" font-weight="bold" text-anchor="middle" x="600" y="300">Expected utility</text>
  <text fill="white" font-family="Arial, sans-serif" font-size="17" font-weight="normal" text-anchor="middle" x="600" y="340">compare probability-weighted outcomes</text>
  <rect fill="#eaf3f8" height="110" rx="16" ry="16" stroke="#2f6f9f" stroke-width="3" width="240" x="880" y="260"/>
  <text fill="#17324d" font-family="Arial, sans-serif" font-size="26" font-weight="bold" text-anchor="middle" x="1000.0" y="307.0">Choice</text>
  <text fill="#66737f" font-family="Arial, sans-serif" font-size="17" font-weight="normal" text-anchor="middle" x="1000.0" y="341.0">best feasible option</text>
  <line stroke="#17324d" stroke-width="4" x1="340" x2="450" y1="170" y2="315"/>
  <polygon fill="#17324d" points="450,315 436.1736047696224,309.18357541668496 448.12397383315835,300.11777819607147"/>
  <line stroke="#17324d" stroke-width="4" x1="340" x2="450" y1="330" y2="315"/>
  <polygon fill="#17324d" points="450,315 438.14208759006436,324.1863982756189 436.11538951906465,309.3239457549544"/>
  <line stroke="#17324d" stroke-width="4" x1="340" x2="450" y1="490" y2="315"/>
  <polygon fill="#17324d" points="450,315 449.43666295912794,329.98941797997446 436.73711472096284,322.0068448016993"/>
  <line stroke="#17324d" stroke-width="4" x1="750" x2="880" y1="315" y2="315"/>
  <polygon fill="#17324d" points="880,315 867.0096189432334,322.5 867.0096189432334,307.5"/>
  <text fill="#66737f" font-family="Arial, sans-serif" font-size="21" font-weight="normal" text-anchor="middle" x="600" y="610">Benchmark, not biography: it makes assumptions and trade-offs explicit.</text>
</svg>

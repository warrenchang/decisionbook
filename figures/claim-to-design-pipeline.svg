<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="700" height="680" viewBox="0 0 700 680" role="img" aria-labelledby="title desc">
  <title id="title">Build a claim the study can support</title>
  <desc id="desc">Five connected questions guide an experimental study from its question through measurement, comparison, and estimation to a defensible claim. This is a planning sequence, not a guarantee of validity.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 8" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0.5 0.8 L9 4 L0.5 7.2 Z" fill="#5f7080"/>
    </marker>
    <marker id="blue-arrow" viewBox="0 0 10 8" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0.5 0.8 L9 4 L0.5 7.2 Z" fill="#2f6f9f"/>
    </marker>
    <marker id="red-arrow" viewBox="0 0 10 8" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0.5 0.8 L9 4 L0.5 7.2 Z" fill="#a74343"/>
    </marker>
  </defs>
  <rect width="700" height="680" fill="#f8fafc"/>
<g id="stage-1">
<rect x="60" y="20" width="580" height="100" rx="18" fill="#eaf3f8" stroke="#2f6f9f" stroke-width="2"/>
<text x="350" y="59" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700" fill="#17324d" >1. Question</text>
<text x="350" y="97" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="400" fill="#17324d" >What do we want to learn?</text>
</g>
<path d="M350 120 V155" fill="none" stroke="#5f7080" stroke-width="3" marker-end="url(#arrow)"/>
<g id="stage-2">
<rect x="60" y="155" width="580" height="100" rx="18" fill="#eaf3f8" stroke="#2f6f9f" stroke-width="2"/>
<text x="350" y="194" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700" fill="#17324d" >2. Measure</text>
<text x="350" y="232" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="400" fill="#17324d" >What will count as evidence?</text>
</g>
<path d="M350 255 V290" fill="none" stroke="#5f7080" stroke-width="3" marker-end="url(#arrow)"/>
<g id="stage-3">
<rect x="60" y="290" width="580" height="100" rx="18" fill="#eaf3f8" stroke="#2f6f9f" stroke-width="2"/>
<text x="350" y="329" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700" fill="#17324d" >3. Compare</text>
<text x="350" y="367" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="400" fill="#17324d" >What is the relevant alternative?</text>
</g>
<path d="M350 390 V425" fill="none" stroke="#5f7080" stroke-width="3" marker-end="url(#arrow)"/>
<g id="stage-4">
<rect x="60" y="425" width="580" height="100" rx="18" fill="#eaf3f8" stroke="#2f6f9f" stroke-width="2"/>
<text x="350" y="464" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700" fill="#17324d" >4. Estimate</text>
<text x="350" y="502" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="400" fill="#17324d" >How large and how uncertain?</text>
</g>
<path d="M350 525 V560" fill="none" stroke="#5f7080" stroke-width="3" marker-end="url(#arrow)"/>
<g id="stage-5">
<rect x="60" y="560" width="580" height="100" rx="18" fill="#edf4ed" stroke="#447c55" stroke-width="2"/>
<text x="350" y="599" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700" fill="#17324d" >5. Claim</text>
<text x="350" y="637" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="400" fill="#17324d" >What does this design justify?</text>
</g>
</svg>

<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" baseProfile="full" height="650" version="1.1" viewBox="0 0 1200 650" width="1200">
  <defs />
  <title>Heuristic substitution</title>
  <desc>A hard target question is silently replaced by an easier cue-based question, producing a quick answer that may or may not fit the target.</desc>
  <rect fill="white" height="650" width="1200" x="0" y="0" />
  <text fill="#17324d" font-family="Arial, sans-serif" font-size="34" font-weight="bold" text-anchor="middle" x="600" y="55">Heuristic substitution</text>
  <rect fill="#f7f1e8" height="160" rx="16" ry="16" stroke="#c56a2d" stroke-width="3" width="330" x="60" y="180" />
  <text fill="#17324d" font-family="Arial, sans-serif" font-size="26" font-weight="bold" text-anchor="middle" x="225" y="243.94"><tspan x="225" dy="0">Target question</tspan></text>
  <text fill="#66737f" font-family="Arial, sans-serif" font-size="17" font-weight="normal" text-anchor="middle" x="225" y="272.06"><tspan x="225" dy="0">How likely is this project to</tspan><tspan x="225" dy="20.06">succeed?</tspan></text>
  <line stroke="#17324d" stroke-width="4" x1="390" x2="535" y1="260" y2="260" />
  <polygon fill="#17324d" points="535,260 522.0096189432334,267.5 522.0096189432334,252.5" />
  <rect fill="#eaf3f8" height="210" rx="16" ry="16" stroke="#2f6f9f" stroke-width="3" width="330" x="535" y="155" />
  <text fill="#17324d" font-family="Arial, sans-serif" font-size="26" font-weight="bold" text-anchor="middle" x="700" y="243.94"><tspan x="700" dy="0">Easier question</tspan></text>
  <text fill="#66737f" font-family="Arial, sans-serif" font-size="17" font-weight="normal" text-anchor="middle" x="700" y="272.06"><tspan x="700" dy="0">How impressive does the founder</tspan><tspan x="700" dy="20.06">feel?</tspan></text>
  <line stroke="#17324d" stroke-width="4" x1="865" x2="1030" y1="260" y2="260" />
  <polygon fill="#17324d" points="1030,260 1017.0096189432334,267.5 1017.0096189432334,252.5" />
  <rect fill="#17324d" height="130" rx="16" ry="16" stroke="#17324d" stroke-width="3" width="120" x="1030" y="195" />
  <text fill="white" font-family="Arial, sans-serif" font-size="24" font-weight="bold" text-anchor="middle" x="1090" y="266"><tspan x="1090" dy="0">Likely</tspan></text>
  <text fill="#17324d" font-family="Arial, sans-serif" font-size="24" font-weight="normal" text-anchor="middle" x="600" y="470">The shortcut is useful when the cue predicts the target—and biased when it does not.</text>
  <text fill="#66737f" font-family="Arial, sans-serif" font-size="21" font-weight="normal" text-anchor="middle" x="600" y="535">Affect • availability • representativeness • recognition</text>
</svg>
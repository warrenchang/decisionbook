<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1140" viewBox="0 0 720 1140" role="img" aria-labelledby="title desc">
  <title id="title">A bounded two-issue map of sovereignty and security</title>
  <desc id="desc">A positional frame treats territorial control as a single conflict. A second panel separates territorial sovereignty from security arrangements. A package combines withdrawal and restored sovereignty with limits, monitoring, timing, and implementation assurances. A boundary note says the diagram is not a regional map, full history, causal explanation, or account of every affected party.</desc>
  <style>
    .title{font:700 31px Arial,sans-serif;fill:#17324d}
    .subtitle{font:22px Arial,sans-serif;fill:#536879}
    .head{font:700 25px Arial,sans-serif;fill:#17324d}
    .body{font:23px Arial,sans-serif;fill:#314b60}
    .small{font:21px Arial,sans-serif;fill:#536879}
    .accent{font:700 24px Arial,sans-serif;fill:#2f6f9f}
    .boundary{font:700 23px Arial,sans-serif;fill:#7a3d19}
  </style>
  <rect width="720" height="1140" fill="#ffffff"/>
  <text class="title" x="360" y="48" text-anchor="middle">A two-issue teaching map</text>
  <text class="subtitle" x="360" y="82" text-anchor="middle">One strand of the Egypt–Israel negotiations illustrates issue expansion.</text>

  <rect x="30" y="115" width="660" height="230" rx="22" fill="#fff1f1" stroke="#b34949" stroke-width="2.5"/>
  <text class="head" x="360" y="158" text-anchor="middle">Single-issue positional frame</text>
  <rect x="65" y="185" width="255" height="105" rx="18" fill="#ffffff" stroke="#b34949" stroke-width="2"/>
  <text class="body" x="192" y="226" text-anchor="middle">Retain territorial</text>
  <text class="body" x="192" y="259" text-anchor="middle">control</text>
  <rect x="400" y="185" width="255" height="105" rx="18" fill="#ffffff" stroke="#b34949" stroke-width="2"/>
  <text class="body" x="528" y="226" text-anchor="middle">Recover territorial</text>
  <text class="body" x="528" y="259" text-anchor="middle">control</text>
  <text class="small" x="360" y="324" text-anchor="middle">On one line, each movement looks like the other side's loss.</text>

  <text class="accent" x="360" y="392" text-anchor="middle">↓  Unbundle the problem into distinct issues  ↓</text>

  <rect x="30" y="420" width="660" height="210" rx="22" fill="#eaf3f8" stroke="#2f6f9f" stroke-width="3"/>
  <text class="head" x="360" y="463" text-anchor="middle">Issue 1 · Territorial sovereignty</text>
  <text class="body" x="360" y="507" text-anchor="middle">Withdrawal from Sinai and recovery of territory</text>
  <text class="body" x="360" y="541" text-anchor="middle">addressed a central Egyptian concern.</text>
  <rect x="95" y="573" width="530" height="38" rx="18" fill="#dcecf5"/>
  <text class="small" x="360" y="599" text-anchor="middle">The issue is who exercises territorial authority.</text>

  <rect x="30" y="653" width="660" height="230" rx="22" fill="#eef6ef" stroke="#43825a" stroke-width="3"/>
  <text class="head" x="360" y="696" text-anchor="middle">Issue 2 · Security arrangements</text>
  <text class="body" x="360" y="740" text-anchor="middle">Limits on forces, monitoring, airbases, timing,</text>
  <text class="body" x="360" y="774" text-anchor="middle">and implementation assurances addressed security.</text>
  <rect x="95" y="811" width="530" height="38" rx="18" fill="#dfeee2"/>
  <text class="small" x="360" y="837" text-anchor="middle">The issue is how withdrawal and peace are made credible.</text>

  <rect x="30" y="908" width="660" height="125" rx="22" fill="#f7f1e8" stroke="#c56a2d" stroke-width="2.5"/>
  <text class="head" x="360" y="948" text-anchor="middle">Package logic</text>
  <text class="body" x="360" y="984" text-anchor="middle">Address sovereignty and security together,</text>
  <text class="body" x="360" y="1017" text-anchor="middle">not one after the other.</text>

  <rect x="30" y="1053" width="660" height="72" rx="18" fill="#fff5ec" stroke="#d17b36" stroke-width="2"/>
  <text class="boundary" x="360" y="1083" text-anchor="middle">Boundary: not a map, full history, causal account,</text>
  <text class="small" x="360" y="1112" text-anchor="middle">or representation of every affected party and interest.</text>
</svg>

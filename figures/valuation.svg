<svg xmlns="http://www.w3.org/2000/svg" width="720" height="368" viewBox="0 0 720 368" role="img" aria-labelledby="title description" data-layout="compact">
  <title id="title">Two possible sources of unease about the same invitation</title>
  <desc id="description">In one case, unease about missing time with family suggests checking whether the date can change. In the other, unease carries over from a hard morning and suggests reconsidering the invitation when you are calmer.</desc>
  <rect width="720" height="368" fill="#fff"/>
  <g font-family="Arial, sans-serif" text-anchor="middle" fill="#183047">
    <g id="invitation">
      <rect x="16" y="12" width="688" height="92" rx="12" fill="#e8f1f6"/>
      <text x="360" y="50" font-size="32" font-weight="700">The same invitation</text>
      <text x="360" y="84" font-size="28">You feel uneasy about saying yes.</text>
    </g>
    <g id="integral">
      <rect x="16" y="122" width="335" height="230" rx="12" fill="#f8fafb" stroke="#a8becd" stroke-width="2"/>
      <text x="183.5" y="163" font-size="30" font-weight="700">Integral emotion</text>
      <text x="183.5" y="204" font-size="28">The trip would take
        <tspan x="183.5" y="237">time away from family.</tspan>
      </text>
      <path d="M36 253 H331" stroke="#a8becd" stroke-width="2"/>
      <text x="183.5" y="291" font-size="28" font-weight="700" fill="#215e7c">Would another date
        <tspan x="183.5" y="324">make it worth going?</tspan>
      </text>
    </g>
    <g id="incidental">
      <rect x="369" y="122" width="335" height="230" rx="12" fill="#f8fafb" stroke="#a8becd" stroke-width="2"/>
      <text x="536.5" y="163" font-size="30" font-weight="700">Incidental emotion</text>
      <text x="536.5" y="204" font-size="28">You still feel tense
        <tspan x="536.5" y="237">after a hard morning.</tspan>
      </text>
      <path d="M389 253 H684" stroke="#a8becd" stroke-width="2"/>
      <text x="536.5" y="291" font-size="28" font-weight="700" fill="#215e7c">How does it feel
        <tspan x="536.5" y="324">once you’re calmer?</tspan>
      </text>
    </g>
  </g>
</svg>

<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" baseProfile="full" height="650" version="1.1" viewBox="0 0 1200 650" width="1200">
  <defs />
  <title>One narrative-design template for guided model updating</title>
  <desc>An author's narrative-design template moves from an audience's current story through meaningful trouble and protagonist conflict to a candidate new model, supporting evidence, and a possible action. It is not a scientific definition of story or a universal model of persuasion.</desc>
  <rect fill="white" height="650" width="1200" x="0" y="0" />
  <text fill="#17324d" font-family="Arial, sans-serif" font-size="34" font-weight="bold" text-anchor="middle" x="600" y="48">One narrative-design template for model updating</text>
  <rect fill="#eaf3f8" height="135" rx="16" ry="16" stroke="#2f6f9f" stroke-width="3" width="205" x="35" y="230" />
  <text fill="#17324d" font-family="Arial, sans-serif" font-size="26" font-weight="bold" text-anchor="middle" x="137.5" y="266.1"><tspan x="137.5" dy="0">Current</tspan><tspan x="137.5" dy="30.68">story</tspan></text>
  <text fill="#66737f" font-family="Arial, sans-serif" font-size="17" font-weight="normal" text-anchor="middle" x="137.5" y="324.9"><tspan x="137.5" dy="0">what the audience</tspan><tspan x="137.5" dy="20.06">expects</tspan></text>
  <line stroke="#17324d" stroke-width="4" x1="240" x2="270" y1="298" y2="298" />
  <polygon fill="#17324d" points="270,298 257.0096189432334,305.5 257.0096189432334,290.5" />
  <rect fill="#eaf3f8" height="135" rx="16" ry="16" stroke="#2f6f9f" stroke-width="3" width="205" x="270" y="230" />
  <text fill="#17324d" font-family="Arial, sans-serif" font-size="26" font-weight="bold" text-anchor="middle" x="372.5" y="281.44"><tspan x="372.5" dy="0">BUT</tspan></text>
  <text fill="#66737f" font-family="Arial, sans-serif" font-size="17" font-weight="normal" text-anchor="middle" x="372.5" y="309.56"><tspan x="372.5" dy="0">trouble /</tspan><tspan x="372.5" dy="20.06">prediction error</tspan></text>
  <line stroke="#17324d" stroke-width="4" x1="475" x2="505" y1="298" y2="298" />
  <polygon fill="#17324d" points="505,298 492.0096189432334,305.5 492.0096189432334,290.5" />
  <rect fill="#eaf3f8" height="135" rx="16" ry="16" stroke="#2f6f9f" stroke-width="3" width="205" x="505" y="230" />
  <text fill="#17324d" font-family="Arial, sans-serif" font-size="26" font-weight="bold" text-anchor="middle" x="607.5" y="281.44"><tspan x="607.5" dy="0">Conflict</tspan></text>
  <text fill="#66737f" font-family="Arial, sans-serif" font-size="17" font-weight="normal" text-anchor="middle" x="607.5" y="309.56"><tspan x="607.5" dy="0">a protagonist</tspan><tspan x="607.5" dy="20.06">chooses</tspan></text>
  <line stroke="#17324d" stroke-width="4" x1="710" x2="740" y1="298" y2="298" />
  <polygon fill="#17324d" points="740,298 727.0096189432334,305.5 727.0096189432334,290.5" />
  <rect fill="#f7f1e8" height="135" rx="16" ry="16" stroke="#c56a2d" stroke-width="3" width="205" x="740" y="230" />
  <text fill="#17324d" font-family="Arial, sans-serif" font-size="24" font-weight="bold" text-anchor="middle" x="842.5" y="270"><tspan x="842.5" dy="0">Candidate</tspan><tspan x="842.5" dy="28">model</tspan></text>
  <text fill="#66737f" font-family="Arial, sans-serif" font-size="16" font-weight="normal" text-anchor="middle" x="842.5" y="326"><tspan x="842.5" dy="0">what the old story</tspan><tspan x="842.5" dy="19">missed</tspan></text>
  <line stroke="#17324d" stroke-width="4" x1="945" x2="975" y1="298" y2="298" />
  <polygon fill="#17324d" points="975,298 962.0096189432334,305.5 962.0096189432334,290.5" />
  <rect fill="#f7f1e8" height="135" rx="16" ry="16" stroke="#c56a2d" stroke-width="3" width="205" x="975" y="230" />
  <text fill="#17324d" font-family="Arial, sans-serif" font-size="26" font-weight="bold" text-anchor="middle" x="1077.5" y="291.47"><tspan x="1077.5" dy="0">THEREFORE</tspan></text>
  <text fill="#66737f" font-family="Arial, sans-serif" font-size="16" font-weight="normal" text-anchor="middle" x="1077.5" y="316"><tspan x="1077.5" dy="0">evidence +</tspan><tspan x="1077.5" dy="20">possible action</tspan></text>
  <text fill="#17324d" font-family="Arial, sans-serif" font-size="21" font-weight="normal" text-anchor="middle" x="600" y="485">AND–BUT–THEREFORE is one useful writing template—not a scientific definition of story.</text>
  <text fill="#66737f" font-family="Arial, sans-serif" font-size="19" font-weight="normal" text-anchor="middle" x="600" y="540">Evidence, belief revision, intention, and action remain separate claims to test.</text>
</svg>

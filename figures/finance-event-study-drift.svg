<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="750" viewBox="0 0 1200 750" role="img" aria-labelledby="title desc">
  <title id="title">Event-study design and a schematic post-earnings-announcement drift</title>
  <desc id="desc">A timeline distinguishes the estimation, event, and post-event windows. A schematic cumulative abnormal return chart shows an immediate reaction followed by positive or negative drift after earnings surprises. An audit lists event time, expected-return model, confounds, uncertainty, tradable timing, and costs.</desc>
  <defs>
    <marker id="blueArrow" viewBox="0 0 10 8" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0.5 0.8 L9 4 L0.5 7.2 Z" fill="#2f6f9f"/></marker>
    <marker id="orangeArrow" viewBox="0 0 10 8" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0.5 0.8 L9 4 L0.5 7.2 Z" fill="#c56a2d"/></marker>
    <filter id="shadow"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#17324d" flood-opacity="0.12"/></filter>
  </defs>
  <rect width="1200" height="750" fill="#ffffff"/>
<text x="600" y="48" text-anchor="middle" font-family="Georgia, serif" font-size="33.0" font-weight="700" fill="#17324d" >An event study separates reaction from drift</text>
<text x="600" y="80" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.0" font-weight="400" fill="#66737f" >A schematic of the design logic behind post-earnings-announcement drift—not a reproduced effect-size estimate.</text>
<rect x="55" y="112" width="1090" height="175" rx="18" fill="#f7fafc" stroke="#c8d7e2" stroke-width="2" />
<text x="600" y="148" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.0" font-weight="700" fill="#17324d" >Define the windows before reading the return path</text>
<line x1="125" y1="222" x2="1070" y2="222" stroke="#2f6f9f" stroke-width="5"/>
<rect x="165" y="195" width="360" height="54" rx="8" fill="#eaf3f8" stroke="#2f6f9f" stroke-width="2"/>
<text x="345" y="216" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.0" font-weight="700" fill="#2f6f9f" >ESTIMATION WINDOW</text>
<text x="345" y="239" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#66737f" >fit the expected-return model</text>
<rect x="548" y="188" width="125" height="68" rx="8" fill="#f7f1e8" stroke="#c56a2d" stroke-width="3"/>
<text x="610" y="213" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.0" font-weight="700" fill="#c56a2d" >EVENT</text>
<text x="610" y="239" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#66737f" >first public time</text>
<rect x="700" y="195" width="305" height="54" rx="8" fill="#edf4ed" stroke="#447c55" stroke-width="2"/>
<text x="852" y="216" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.0" font-weight="700" fill="#447c55" >POST-EVENT WINDOW</text>
<text x="852" y="239" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#66737f" >test persistence or reversal</text>
<rect x="55" y="315" width="900" height="370" rx="18" fill="#f7fafc" stroke="#c8d7e2" stroke-width="2" />
<text x="505" y="350" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.0" font-weight="700" fill="#17324d" >Cumulative abnormal return (schematic)</text>
<line x1="150" y1="492.5" x2="910" y2="492.5" stroke="#8fa0ad" stroke-width="2"/>
<rect x="385" y="365" width="130" height="36" rx="9" fill="#f7f1e8" stroke="#c56a2d" stroke-width="2" />
<text x="450" y="390" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#c56a2d" >EVENT · t = 0</text>
<line x1="450" y1="405" x2="450" y2="635" stroke="#c56a2d" stroke-width="3" stroke-dasharray="8 7"/>
<text x="170" y="663" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#66737f" >before</text>
<text x="680" y="663" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#66737f" >after</text>
<path d="M150 492.5 L450 492.5" fill="none" stroke="#17324d" stroke-width="6" stroke-linecap="round"/>
<path d="M450 492.5 C462 450.5 468 420.5 492 404.5 C560 379.5 635 391.5 705 376.5 C780 359.5 850 344.5 910 342.5" fill="none" stroke="#447c55" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M450 492.5 C462 534.5 468 564.5 492 580.5 C560 605.5 635 593.5 705 608.5 C780 625.5 850 640.5 910 642.5" fill="none" stroke="#a74343" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
<circle cx="450" cy="492.5" r="7" fill="#c56a2d"/>
<text x="902" y="332.5" text-anchor="end" font-family="Arial, sans-serif" font-size="16.0" font-weight="700" fill="#447c55" >positive surprise</text>
<text x="902" y="668.5" text-anchor="end" font-family="Arial, sans-serif" font-size="16.0" font-weight="700" fill="#a74343" >negative surprise</text>
<rect x="985" y="315" width="160" height="370" rx="18" fill="#f7f1e8" stroke="#c56a2d" stroke-width="2" />
<text x="1065" y="358" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.0" font-weight="700" fill="#c56a2d" >AUDIT</text>
<text x="1065" y="404" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.0" font-weight="700" fill="#17324d" >event time</text>
<text x="1065" y="442" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.0" font-weight="700" fill="#17324d" >expected-return</text>
<text x="1065" y="480" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.0" font-weight="700" fill="#17324d" >model</text>
<text x="1065" y="518" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.0" font-weight="700" fill="#17324d" >confounds</text>
<text x="1065" y="556" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.0" font-weight="700" fill="#17324d" >uncertainty</text>
<text x="1065" y="594" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.0" font-weight="700" fill="#17324d" >tradable timing</text>
<text x="1065" y="632" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.0" font-weight="700" fill="#17324d" >costs</text>
<text x="600" y="725" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#66737f" >A delayed separation can indicate slow updating, but also benchmark error, overlapping news, frictions, or ex-post sample construction.</text>
</svg>

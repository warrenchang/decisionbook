<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Level-k reasoning in the two-thirds guessing game</title>
  <desc id="desc">Five evenly spaced boxes show a large-group approximate reasoning ladder from a random-choice anchor of fifty, to level-one thirty-three, level-two twenty-two, level-three fifteen, and the Nash equilibrium zero.</desc>
  <defs>
    <marker id="blueArrow" viewBox="0 0 10 8" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0.5 0.8 L9 4 L0.5 7.2 Z" fill="#2f6f9f"/></marker>
    <marker id="orangeArrow" viewBox="0 0 10 8" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0.5 0.8 L9 4 L0.5 7.2 Z" fill="#c56a2d"/></marker>
    <filter id="shadow"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#17324d" flood-opacity="0.12"/></filter>
  </defs>
  <rect width="1200" height="630" fill="#ffffff"/>
<text x="600" y="48" text-anchor="middle" font-family="Georgia, serif" font-size="33.0" font-weight="700" fill="#17324d" >The ⅔ guessing game as a reasoning ladder</text>
<text x="600" y="80" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.0" font-weight="400" fill="#66737f" >Each step aims below the choice predicted for the other players.</text>
<rect x="40" y="170" width="195" height="250" rx="20" fill="#f3eff5" stroke="#8a7895" stroke-width="3" filter="url(#shadow)"/>
<text x="137" y="213" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.0" font-weight="700" fill="#8a7895" >LEVEL 0</text>
<text x="137" y="304" text-anchor="middle" font-family="Georgia, serif" font-size="72.0" font-weight="700" fill="#8a7895" >50</text>
<text x="137" y="347" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.0" font-weight="700" fill="#66737f" >random-choice anchor</text>
<line x1="235" y1="295" x2="269" y2="295" stroke="#2f6f9f" stroke-width="4" marker-end="url(#blueArrow)"/>
<rect x="272" y="170" width="195" height="250" rx="20" fill="#eaf3f8" stroke="#2f6f9f" stroke-width="3" filter="url(#shadow)"/>
<text x="369" y="213" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.0" font-weight="700" fill="#2f6f9f" >LEVEL 1</text>
<text x="369" y="304" text-anchor="middle" font-family="Georgia, serif" font-size="72.0" font-weight="700" fill="#2f6f9f" >33</text>
<text x="369" y="347" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.0" font-weight="700" fill="#66737f" >⅔ of 50</text>
<line x1="467" y1="295" x2="501" y2="295" stroke="#2f6f9f" stroke-width="4" marker-end="url(#blueArrow)"/>
<rect x="504" y="170" width="195" height="250" rx="20" fill="#edf4ed" stroke="#447c55" stroke-width="3" filter="url(#shadow)"/>
<text x="601" y="213" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.0" font-weight="700" fill="#447c55" >LEVEL 2</text>
<text x="601" y="304" text-anchor="middle" font-family="Georgia, serif" font-size="72.0" font-weight="700" fill="#447c55" >22</text>
<text x="601" y="347" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.0" font-weight="700" fill="#66737f" >⅔ of 33</text>
<line x1="699" y1="295" x2="733" y2="295" stroke="#2f6f9f" stroke-width="4" marker-end="url(#blueArrow)"/>
<rect x="736" y="170" width="195" height="250" rx="20" fill="#f7f1e8" stroke="#c56a2d" stroke-width="3" filter="url(#shadow)"/>
<text x="833" y="213" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.0" font-weight="700" fill="#c56a2d" >LEVEL 3</text>
<text x="833" y="304" text-anchor="middle" font-family="Georgia, serif" font-size="72.0" font-weight="700" fill="#c56a2d" >15</text>
<text x="833" y="347" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.0" font-weight="700" fill="#66737f" >⅔ of 22</text>
<line x1="931" y1="295" x2="965" y2="295" stroke="#2f6f9f" stroke-width="4" marker-end="url(#blueArrow)"/>
<rect x="968" y="170" width="195" height="250" rx="20" fill="#fff0e9" stroke="#a74343" stroke-width="3" filter="url(#shadow)"/>
<text x="1065" y="213" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.0" font-weight="700" fill="#a74343" >EQUILIBRIUM</text>
<text x="1065" y="304" text-anchor="middle" font-family="Georgia, serif" font-size="72.0" font-weight="700" fill="#a74343" >0</text>
<text x="1065" y="347" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.0" font-weight="700" fill="#66737f" >continued iteration</text>
<rect x="80" y="485" width="1040" height="70" rx="18" fill="#f7fafc" stroke="#c8d7e2" stroke-width="2" />
<text x="600" y="525" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.0" font-weight="700" fill="#17324d" >Compare the reasoning behind each answer.</text>


<text x="600" y="600" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#66737f" >Large-group illustration (Nagel, 1995).</text>
</svg>

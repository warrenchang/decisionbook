<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="760" height="910" viewBox="0 0 760 910" role="img" aria-labelledby="title desc">
  <title id="title">Participant flow from assignment through analysis</title>
  <desc id="desc">Two assigned groups are followed through receipt, outcome observation, and analysis. The comparison keeps original assignment labels; researchers must account for missing outcomes and possible effects between groups.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 8" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0.5 0.8 L9 4 L0.5 7.2 Z" fill="#5f7080"/>
    </marker>
    <marker id="blue-arrow" viewBox="0 0 10 8" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0.5 0.8 L9 4 L0.5 7.2 Z" fill="#2f6f9f"/>
    </marker>
    <marker id="red-arrow" viewBox="0 0 10 8" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0.5 0.8 L9 4 L0.5 7.2 Z" fill="#a74343"/>
    </marker>
  </defs>
  <rect width="760" height="910" fill="#f8fafc"/>
<text x="380" y="49" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700" fill="#17324d" >Follow people from assignment</text>
<text x="380" y="88" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700" fill="#17324d" >to the final comparison</text>
<rect x="180" y="126" width="400" height="82" rx="18" fill="#f0ecf8" stroke="#6f5aa7" stroke-width="2"/>
<text x="380" y="178" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700" fill="#17324d" >Random assignment</text>
<path d="M380 208 V244 H185 V284" fill="none" stroke="#5f7080" stroke-width="3" marker-end="url(#arrow)"/>
<path d="M380 244 H575 V284" fill="none" stroke="#5f7080" stroke-width="3" marker-end="url(#arrow)"/>
<g id="arm-A-0">
<rect x="25" y="284" width="320" height="133" rx="18" fill="#edf4ed" stroke="#447c55" stroke-width="2"/>
<text x="185" y="323" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700" fill="#17324d" >Assigned A</text>
<text x="185" y="363" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="400" fill="#17324d" >Did they receive</text>
<text x="185" y="397" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="400" fill="#17324d" >the treatment?</text>
</g>
<path d="M185 417 V457" fill="none" stroke="#5f7080" stroke-width="3" marker-end="url(#arrow)"/>
<g id="arm-A-1">
<rect x="25" y="457" width="320" height="133" rx="18" fill="#eaf3f8" stroke="#2f6f9f" stroke-width="2"/>
<text x="185" y="496" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700" fill="#17324d" >Outcomes</text>
<text x="185" y="536" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="400" fill="#17324d" >Who was observed?</text>
</g>
<path d="M185 590 V630" fill="none" stroke="#5f7080" stroke-width="3" marker-end="url(#arrow)"/>
<g id="arm-A-2">
<rect x="25" y="630" width="320" height="133" rx="18" fill="#f7f1e8" stroke="#c56a2d" stroke-width="2"/>
<text x="185" y="669" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700" fill="#17324d" >Analysis</text>
<text x="185" y="709" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="400" fill="#17324d" >Compare groups</text>
<text x="185" y="743" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="400" fill="#17324d" >as assigned.</text>
</g>
<g id="arm-B-0">
<rect x="415" y="284" width="320" height="133" rx="18" fill="#edf4ed" stroke="#447c55" stroke-width="2"/>
<text x="575" y="323" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700" fill="#17324d" >Assigned B</text>
<text x="575" y="363" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="400" fill="#17324d" >Did they receive</text>
<text x="575" y="397" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="400" fill="#17324d" >the treatment?</text>
</g>
<path d="M575 417 V457" fill="none" stroke="#5f7080" stroke-width="3" marker-end="url(#arrow)"/>
<g id="arm-B-1">
<rect x="415" y="457" width="320" height="133" rx="18" fill="#eaf3f8" stroke="#2f6f9f" stroke-width="2"/>
<text x="575" y="496" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700" fill="#17324d" >Outcomes</text>
<text x="575" y="536" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="400" fill="#17324d" >Who was observed?</text>
</g>
<path d="M575 590 V630" fill="none" stroke="#5f7080" stroke-width="3" marker-end="url(#arrow)"/>
<g id="arm-B-2">
<rect x="415" y="630" width="320" height="133" rx="18" fill="#f7f1e8" stroke="#c56a2d" stroke-width="2"/>
<text x="575" y="669" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700" fill="#17324d" >Analysis</text>
<text x="575" y="709" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="400" fill="#17324d" >Compare groups</text>
<text x="575" y="743" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="400" fill="#17324d" >as assigned.</text>
</g>
<text x="380" y="825" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#17324d" >Track nonreceipt and missing outcomes.</text>
<text x="380" y="865" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="400" fill="#17324d" >Check whether one group affects the other.</text>
</svg>

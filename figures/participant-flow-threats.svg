<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="760" height="1015" viewBox="0 0 760 1015" role="img" aria-labelledby="title desc">
  <title id="title">Noncompliance, attrition, spillovers, and the assigned-group comparison</title>
  <desc id="desc">Three separate panels distinguish threats in a randomized evaluation. Noncompliance means treatment receipt differs from assignment: some assigned participants do not receive treatment and some controls do. Attrition leaves outcomes missing after loss to follow-up, so observed groups may no longer be comparable. Spillovers, or interference, mean one person’s treatment affects another person’s outcome, possibly across study groups. Intention-to-treat compares outcomes by original assignment; it does not by itself resolve missing outcomes or spillovers. The panels are distinct mechanisms, not successive stages of one participant’s progress.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 8" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0.5 0.8 L9 4 L0.5 7.2 Z" fill="#5f7080"/>
    </marker>
    <marker id="blue-arrow" viewBox="0 0 10 8" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0.5 0.8 L9 4 L0.5 7.2 Z" fill="#2f6f9f"/>
    </marker>
    <marker id="red-arrow" viewBox="0 0 10 8" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0.5 0.8 L9 4 L0.5 7.2 Z" fill="#a74343"/>
    </marker>
  </defs>
  <rect width="760" height="1015" fill="#f8fafc"/>
<g id="noncompliance">
<rect x="20" y="20" width="720" height="260" rx="18" fill="#f7f1e8" stroke="#c56a2d" stroke-width="2"/>
<text x="45" y="62" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="700" fill="#c56a2d" >Noncompliance</text>
<g id="noncompliance-left">
<rect x="45" y="95" width="255" height="90" rx="12" fill="#ffffff" stroke="#c56a2d" stroke-width="2"/>
<text x="172.5" y="131" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="600" fill="#17324d" >Treatment</text>
<text x="172.5" y="166" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="600" fill="#17324d" >assigned</text>
</g>
<g id="noncompliance-right">
<rect x="460" y="95" width="255" height="90" rx="12" fill="#ffffff" stroke="#c56a2d" stroke-width="2"/>
<text x="587.5" y="131" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="600" fill="#17324d" >Treatment</text>
<text x="587.5" y="166" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="600" fill="#17324d" >received</text>
</g>
<text x="380" y="113" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="400" fill="#17324d" >may differ</text>
<path d="M300 140 H460" fill="none" stroke="#5f7080" stroke-width="3" marker-end="url(#arrow)"/>
<text x="45" y="222" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="400" fill="#17324d" >Some assigned participants may not receive it.</text>
<text x="45" y="258" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="400" fill="#17324d" >Some controls may receive it.</text>
</g>
<g id="attrition">
<rect x="20" y="310" width="720" height="260" rx="18" fill="#fff0e9" stroke="#a74343" stroke-width="2"/>
<text x="45" y="352" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="700" fill="#a74343" >Attrition</text>
<g id="attrition-left">
<rect x="45" y="385" width="255" height="90" rx="12" fill="#ffffff" stroke="#a74343" stroke-width="2"/>
<text x="172.5" y="421" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="600" fill="#17324d" >Randomized</text>
<text x="172.5" y="456" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="600" fill="#17324d" >participants</text>
</g>
<g id="attrition-right">
<rect x="460" y="385" width="255" height="90" rx="12" fill="#ffffff" stroke="#a74343" stroke-width="2"/>
<text x="587.5" y="421" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="600" fill="#17324d" >Participants</text>
<text x="587.5" y="456" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="600" fill="#17324d" >observed</text>
</g>
<text x="380" y="403" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="400" fill="#17324d" >follow-up</text>
<path d="M300 430 H460" fill="none" stroke="#5f7080" stroke-width="3" marker-end="url(#arrow)"/>
<text x="45" y="512" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="400" fill="#17324d" >Loss to follow-up leaves outcomes missing.</text>
<text x="45" y="548" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="400" fill="#17324d" >Observed groups may no longer be comparable.</text>
</g>
<g id="interference">
<rect x="20" y="600" width="720" height="220" rx="18" fill="#f0ecf8" stroke="#6f5aa7" stroke-width="2"/>
<text x="45" y="642" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="700" fill="#6f5aa7" >Spillovers (interference)</text>
<g id="interference-left">
<rect x="45" y="675" width="255" height="90" rx="12" fill="#ffffff" stroke="#6f5aa7" stroke-width="2"/>
<text x="172.5" y="711" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="600" fill="#17324d" >Person A’s</text>
<text x="172.5" y="746" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="600" fill="#17324d" >treatment</text>
</g>
<g id="interference-right">
<rect x="460" y="675" width="255" height="90" rx="12" fill="#ffffff" stroke="#6f5aa7" stroke-width="2"/>
<text x="587.5" y="711" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="600" fill="#17324d" >Person B’s</text>
<text x="587.5" y="746" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="600" fill="#17324d" >outcome</text>
</g>
<text x="380" y="693" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="400" fill="#17324d" >can affect</text>
<path d="M300 720 H460" fill="none" stroke="#5f7080" stroke-width="3" marker-end="url(#arrow)"/>
<text x="45" y="802" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="400" fill="#17324d" >Effects can cross treatment and control groups.</text>
</g>
<g id="intention-to-treat">
<rect x="20" y="850" width="720" height="145" rx="18" fill="#edf4ed" stroke="#447c55" stroke-width="2"/>
<text x="45" y="893" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="700" fill="#447c55" >Intention-to-treat (ITT)</text>
<text x="45" y="936" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="400" fill="#17324d" >Compare outcomes by original assignment.</text>
<text x="45" y="975" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="400" fill="#17324d" >ITT alone does not resolve attrition or spillovers.</text>
</g>
</svg>

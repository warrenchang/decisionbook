<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="760" height="670" viewBox="0 0 760 670" role="img" aria-labelledby="title desc">
  <title id="title">Noncompliance, attrition, and spillovers</title>
  <desc id="desc">Three separate panels distinguish threats in a randomized evaluation. Noncompliance means treatment receipt differs from assignment: some assigned participants do not receive treatment and some controls do. Attrition leaves outcomes missing after loss to follow-up, so observed groups may no longer be comparable. Spillovers, or interference, mean one person’s treatment affects another person’s outcome, possibly across study groups. The panels are distinct mechanisms, not successive stages of one participant’s progress.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 8" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0.5 0.8 L9 4 L0.5 7.2 Z" fill="#5f7080"/>
    </marker>
    <marker id="blue-arrow" viewBox="0 0 10 8" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0.5 0.8 L9 4 L0.5 7.2 Z" fill="#2f6f9f"/>
    </marker>
    <marker id="red-arrow" viewBox="0 0 10 8" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0.5 0.8 L9 4 L0.5 7.2 Z" fill="#a74343"/>
    </marker>
  </defs>
  <rect width="760" height="670" fill="#f8fafc"/>
<g id="noncompliance">
<rect x="20" y="20" width="720" height="190" rx="18" fill="#f7f1e8" stroke="#c56a2d" stroke-width="2"/>
<text x="45" y="62" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="700" fill="#c56a2d" >Noncompliance</text>
<g id="noncompliance-left">
<rect x="45" y="95" width="255" height="90" rx="12" fill="#ffffff" stroke="#c56a2d" stroke-width="2"/>
<text x="172.5" y="131" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="600" fill="#17324d" >Treatment</text>
<text x="172.5" y="166" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="600" fill="#17324d" >assigned</text>
</g>
<g id="noncompliance-right">
<rect x="460" y="95" width="255" height="90" rx="12" fill="#ffffff" stroke="#c56a2d" stroke-width="2"/>
<text x="587.5" y="131" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="600" fill="#17324d" >Treatment</text>
<text x="587.5" y="166" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="600" fill="#17324d" >received</text>
</g>
<text x="380" y="113" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="400" fill="#17324d" >may differ</text>
<path d="M300 140 H460" fill="none" stroke="#5f7080" stroke-width="3" marker-end="url(#arrow)"/>
</g>
<g id="attrition">
<rect x="20" y="240" width="720" height="190" rx="18" fill="#fff0e9" stroke="#a74343" stroke-width="2"/>
<text x="45" y="282" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="700" fill="#a74343" >Attrition</text>
<g id="attrition-left">
<rect x="45" y="315" width="255" height="90" rx="12" fill="#ffffff" stroke="#a74343" stroke-width="2"/>
<text x="172.5" y="351" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="600" fill="#17324d" >Randomized</text>
<text x="172.5" y="386" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="600" fill="#17324d" >participants</text>
</g>
<g id="attrition-right">
<rect x="460" y="315" width="255" height="90" rx="12" fill="#ffffff" stroke="#a74343" stroke-width="2"/>
<text x="587.5" y="351" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="600" fill="#17324d" >Participants</text>
<text x="587.5" y="386" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="600" fill="#17324d" >observed</text>
</g>
<text x="380" y="333" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="400" fill="#17324d" >some lost</text>
<path d="M300 360 H460" fill="none" stroke="#5f7080" stroke-width="3" marker-end="url(#arrow)"/>
</g>
<g id="interference">
<rect x="20" y="460" width="720" height="190" rx="18" fill="#f0ecf8" stroke="#6f5aa7" stroke-width="2"/>
<text x="45" y="502" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="700" fill="#6f5aa7" >Spillovers (interference)</text>
<g id="interference-left">
<rect x="45" y="535" width="255" height="90" rx="12" fill="#ffffff" stroke="#6f5aa7" stroke-width="2"/>
<text x="172.5" y="571" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="600" fill="#17324d" >Person A’s</text>
<text x="172.5" y="606" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="600" fill="#17324d" >treatment</text>
</g>
<g id="interference-right">
<rect x="460" y="535" width="255" height="90" rx="12" fill="#ffffff" stroke="#6f5aa7" stroke-width="2"/>
<text x="587.5" y="571" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="600" fill="#17324d" >Person B’s</text>
<text x="587.5" y="606" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="600" fill="#17324d" >outcome</text>
</g>
<text x="380" y="553" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="400" fill="#17324d" >can affect</text>
<path d="M300 580 H460" fill="none" stroke="#5f7080" stroke-width="3" marker-end="url(#arrow)"/>
</g>
</svg>

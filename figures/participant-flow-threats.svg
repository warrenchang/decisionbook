<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1280" viewBox="0 0 1000 1280" role="img" aria-labelledby="title desc">
  <title id="title">Participant flow from assignment through analysis</title>
  <desc id="desc">Two randomized arms proceed separately through treatment receipt, outcome observation, and analysis. Cross-arm dashed arrows at receipt show spillovers or interference. A lower diagnostic band distinguishes noncompliance, missingness, and interference, and states that there is no universal safe attrition threshold.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 8" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0.5 0.8 L9 4 L0.5 7.2 Z" fill="#5f7080"/>
    </marker>
    <marker id="blue-arrow" viewBox="0 0 10 8" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0.5 0.8 L9 4 L0.5 7.2 Z" fill="#2f6f9f"/>
    </marker>
    <marker id="red-arrow" viewBox="0 0 10 8" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0.5 0.8 L9 4 L0.5 7.2 Z" fill="#a74343"/>
    </marker>
  </defs>
  <rect width="1000" height="1280" fill="#f8fafc"/>
<text x="500" y="54" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700" fill="#17324d" >Follow assignment all the way to analysis</text>
<text x="500" y="90" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" fill="#5f7080" >Receipt, observation, analysis, and exposure to other arms are distinct events.</text>
<rect x="275" y="124" width="450" height="86" rx="18" fill="#f0ecf8" stroke="#6f5aa7" stroke-width="3"/>
<text x="500" y="160" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" fill="#6f5aa7" >ELIGIBLE AND RANDOMIZED</text>
<text x="500" y="190" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" fill="#5f7080" >assignment defines the ITT groups</text>
<line x1="500" y1="210" x2="500" y2="248" stroke="#5f7080" stroke-width="3"/>
<line x1="250" y1="248" x2="750" y2="248" stroke="#5f7080" stroke-width="3"/>
<line x1="250" y1="248" x2="250" y2="296" stroke="#5f7080" stroke-width="3" marker-end="url(#arrow)"/>
<line x1="750" y1="248" x2="750" y2="296" stroke="#5f7080" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="70" y="300" width="360" height="128" rx="18" fill="#edf4ed" stroke="#447c55" stroke-width="2"/>
<rect x="570" y="300" width="360" height="128" rx="18" fill="#edf4ed" stroke="#447c55" stroke-width="2"/>
<text x="250" y="339" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" fill="#2f6f9f" >ASSIGNED A</text>
<text x="750" y="339" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" fill="#c56a2d" >ASSIGNED B</text>
<text x="250" y="372" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" fill="#447c55" >TREATMENT RECEIPT</text>
<text x="750" y="372" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" fill="#447c55" >TREATMENT RECEIPT</text>
<text x="250" y="405" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#5f7080" >some may not receive A</text>
<text x="750" y="405" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#5f7080" >some may access A or miss B</text>
<rect x="70" y="500" width="360" height="128" rx="18" fill="#eaf3f8" stroke="#2f6f9f" stroke-width="2"/>
<rect x="570" y="500" width="360" height="128" rx="18" fill="#eaf3f8" stroke="#2f6f9f" stroke-width="2"/>
<text x="250" y="539" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" fill="#2f6f9f" >OUTCOME OBSERVATION</text>
<text x="750" y="539" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" fill="#2f6f9f" >OUTCOME OBSERVATION</text>
<text x="250" y="572" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" fill="#5f7080" >some outcomes may be missing</text>
<text x="750" y="572" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" fill="#5f7080" >some outcomes may be missing</text>
<text x="250" y="605" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#5f7080" ></text>
<text x="750" y="605" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#5f7080" ></text>
<rect x="70" y="700" width="360" height="128" rx="18" fill="#f7f1e8" stroke="#c56a2d" stroke-width="2"/>
<rect x="570" y="700" width="360" height="128" rx="18" fill="#f7f1e8" stroke="#c56a2d" stroke-width="2"/>
<text x="250" y="739" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" fill="#c56a2d" >ANALYSIS</text>
<text x="750" y="739" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" fill="#c56a2d" >ANALYSIS</text>
<text x="250" y="772" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" fill="#5f7080" >retain assignment label</text>
<text x="750" y="772" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" fill="#5f7080" >retain assignment label</text>
<text x="250" y="805" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#5f7080" ></text>
<text x="750" y="805" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#5f7080" ></text>
<line x1="250" y1="428" x2="250" y2="496" stroke="#5f7080" stroke-width="3" marker-end="url(#arrow)"/>
<line x1="250" y1="628" x2="250" y2="696" stroke="#5f7080" stroke-width="3" marker-end="url(#arrow)"/>
<line x1="750" y1="428" x2="750" y2="496" stroke="#5f7080" stroke-width="3" marker-end="url(#arrow)"/>
<line x1="750" y1="628" x2="750" y2="696" stroke="#5f7080" stroke-width="3" marker-end="url(#arrow)"/>
<path d="M430 375 C475 350 525 350 570 375" fill="none" stroke="#a74343" stroke-width="3" stroke-dasharray="9 8" marker-end="url(#red-arrow)"/>
<path d="M570 410 C525 435 475 435 430 410" fill="none" stroke="#a74343" stroke-width="3" stroke-dasharray="9 8" marker-end="url(#red-arrow)"/>
<text x="500" y="329" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#a74343" >SPILLOVERS</text>
<text x="500" y="350" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#a74343" >between arms</text>
<rect x="45" y="865" width="910" height="263" rx="22" fill="#ffffff" stroke="#d3dee6" stroke-width="2"/>
<text x="500" y="907" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" fill="#17324d" >WHAT EACH BREAK IN THE FLOW MEANS</text>
<rect x="75" y="940" width="260" height="145" rx="18" fill="#edf4ed" stroke="#447c55" stroke-width="2"/>
<text x="205" y="976" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#447c55" >NONCOMPLIANCE</text>
<text x="205" y="1010" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#5f7080" >assignment ≠ receipt</text>
<text x="205" y="1034" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#5f7080" >ITT still compares</text>
<text x="205" y="1058" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#5f7080" >groups as assigned</text>
<rect x="370" y="940" width="260" height="145" rx="18" fill="#eaf3f8" stroke="#2f6f9f" stroke-width="2"/>
<text x="500" y="976" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#2f6f9f" >MISSINGNESS</text>
<text x="500" y="1010" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#5f7080" >observation can depend</text>
<text x="500" y="1034" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#5f7080" >on assignment or outcome</text>
<text x="500" y="1058" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#5f7080" >report reasons by arm</text>
<rect x="665" y="940" width="260" height="145" rx="18" fill="#fff0e9" stroke="#a74343" stroke-width="2"/>
<text x="795" y="976" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#a74343" >INTERFERENCE</text>
<text x="795" y="1010" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#5f7080" >one unit's treatment</text>
<text x="795" y="1034" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#5f7080" >changes another unit's</text>
<text x="795" y="1058" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#5f7080" >outcome or exposure</text>
<rect x="45" y="1148" width="910" height="102" rx="18" fill="#fff0e9" stroke="#a74343" stroke-width="2"/>
<text x="500" y="1183" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#a74343" >NO UNIVERSALLY SAFE ATTRITION PERCENTAGE</text>
<text x="500" y="1216" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#17324d" >Risk depends on why outcomes are missing and how missingness relates</text>
<text x="500" y="1241" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#17324d" >to assignment and potential outcomes—not on one fixed percentage.</text>
</svg>

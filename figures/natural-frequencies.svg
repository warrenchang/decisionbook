<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" baseProfile="full" height="650" version="1.1" viewBox="0 0 1200 650" width="1200">
  <defs />
  <title>Natural frequency tree</title>
  <desc>Out of 10,000 people, 100 have a disease. Ninety test positive. Of 9,900 without it, 891 test positive. Therefore 90 of 981 positive tests are true positives, about 9 percent.</desc>
  <rect fill="white" height="650" width="1200" x="0" y="0" />
  <text fill="#17324d" font-family="Arial, sans-serif" font-size="32" font-weight="bold" text-anchor="middle" x="600" y="48">Why a “90% accurate” test can imply only 9% after a positive</text>
  <rect fill="#eaf3f8" height="95" rx="16" ry="16" stroke="#2f6f9f" stroke-width="3" width="180" x="40" y="245" />
  <text fill="#17324d" font-family="Arial, sans-serif" font-size="23.17" font-weight="bold" text-anchor="middle" x="130" y="273.459"><tspan x="130" dy="0">10,000</tspan><tspan x="130" dy="27.3358">people</tspan></text>
  <text fill="#66737f" font-family="Arial, sans-serif" font-size="15.15" font-weight="normal" text-anchor="middle" x="130" y="326.395"><tspan x="130" dy="0">base population</tspan></text>
  <rect fill="#f7f1e8" height="95" rx="16" ry="16" stroke="#c56a2d" stroke-width="3" width="200" x="330" y="115" />
  <text fill="#17324d" font-family="Arial, sans-serif" font-size="26" font-weight="bold" text-anchor="middle" x="430" y="156.47"><tspan x="430" dy="0">100 diseased</tspan></text>
  <text fill="#66737f" font-family="Arial, sans-serif" font-size="17" font-weight="normal" text-anchor="middle" x="430" y="184.59"><tspan x="430" dy="0">1% base rate</tspan></text>
  <rect fill="#eaf3f8" height="95" rx="16" ry="16" stroke="#2f6f9f" stroke-width="3" width="200" x="330" y="390" />
  <text fill="#17324d" font-family="Arial, sans-serif" font-size="23.17" font-weight="bold" text-anchor="middle" x="430" y="418.459"><tspan x="430" dy="0">9,900 not</tspan><tspan x="430" dy="27.3358">diseased</tspan></text>
  <text fill="#66737f" font-family="Arial, sans-serif" font-size="15.15" font-weight="normal" text-anchor="middle" x="430" y="471.395"><tspan x="430" dy="0">99%</tspan></text>
  <line stroke="#17324d" stroke-width="4" x1="220" x2="330" y1="285" y2="160" />
  <polygon fill="#17324d" points="330,160 327.0485432855437,174.70676386098216 315.7878405317024,164.7973454376018" />
  <line stroke="#17324d" stroke-width="4" x1="220" x2="330" y1="305" y2="435" />
  <polygon fill="#17324d" points="330,435 315.8835670024241,429.92788807054194 327.33436128296086,420.23875444854934" />
  <rect fill="#e7f4ea" height="85" rx="16" ry="16" stroke="#447c55" stroke-width="3" width="210" x="690" y="85" />
  <text fill="#17324d" font-family="Arial, sans-serif" font-size="20.16" font-weight="bold" text-anchor="middle" x="795" y="110.932"><tspan x="795" dy="0">90 true</tspan><tspan x="795" dy="23.7857">positives</tspan></text>
  <text fill="#66737f" font-family="Arial, sans-serif" font-size="13.18" font-weight="normal" text-anchor="middle" x="795" y="157.642"><tspan x="795" dy="0">90% sensitivity</tspan></text>
  <rect fill="#eaf3f8" height="85" rx="16" ry="16" stroke="#2f6f9f" stroke-width="3" width="210" x="690" y="205" />
  <text fill="#17324d" font-family="Arial, sans-serif" font-size="26" font-weight="bold" text-anchor="middle" x="795" y="238.66"><tspan x="795" dy="0">10 false</tspan><tspan x="795" dy="30.68">negatives</tspan></text>
  <rect fill="#f9e7e7" height="85" rx="16" ry="16" stroke="#a74343" stroke-width="3" width="210" x="690" y="360" />
  <text fill="#17324d" font-family="Arial, sans-serif" font-size="18.72" font-weight="bold" text-anchor="middle" x="795" y="384.725"><tspan x="795" dy="0">891 false</tspan><tspan x="795" dy="22.0896">positives</tspan></text>
  <text fill="#66737f" font-family="Arial, sans-serif" font-size="12.24" font-weight="normal" text-anchor="middle" x="795" y="424.461"><tspan x="795" dy="0">9% false-positive</tspan><tspan x="795" dy="14.4432">rate</tspan></text>
  <rect fill="#eaf3f8" height="85" rx="16" ry="16" stroke="#2f6f9f" stroke-width="3" width="210" x="690" y="480" />
  <text fill="#17324d" font-family="Arial, sans-serif" font-size="26" font-weight="bold" text-anchor="middle" x="795" y="513.66"><tspan x="795" dy="0">9,009 true</tspan><tspan x="795" dy="30.68">negatives</tspan></text>
  <line stroke="#17324d" stroke-width="4" x1="530" x2="690" y1="160" y2="125" />
  <polygon fill="#17324d" points="690,125 678.9124231107014,135.10275401679618 675.70696992862,120.44925375585227" />
  <line stroke="#17324d" stroke-width="4" x1="530" x2="690" y1="165" y2="245" />
  <polygon fill="#17324d" points="690,245 675.026947995128,245.89872891318825 681.7351519276274,232.4823210481895" />
  <line stroke="#17324d" stroke-width="4" x1="530" x2="690" y1="435" y2="400" />
  <polygon fill="#17324d" points="690,400 678.9124231107014,410.1027540167962 675.70696992862,395.4492537558523" />
  <line stroke="#17324d" stroke-width="4" x1="530" x2="690" y1="445" y2="520" />
  <polygon fill="#17324d" points="690,520 675.0544893189095,521.277384234054 681.4209974623703,507.69550019467096" />
  <rect fill="#17324d" height="170" rx="16" ry="16" stroke="#17324d" stroke-width="3" width="180" x="980" y="225" />
  <text fill="white" font-family="Arial, sans-serif" font-size="22" font-weight="bold" text-anchor="middle" x="1070" y="289.4"><tspan x="1070" dy="0">Positive</tspan><tspan x="1070" dy="25.96">tests</tspan></text>
  <text fill="white" font-family="Arial, sans-serif" font-size="18" font-weight="normal" text-anchor="middle" x="1070" y="342.96"><tspan x="1070" dy="0">90 + 891 = 981</tspan></text>
  <line stroke="#447c55" stroke-width="4" x1="900" x2="980" y1="125" y2="265" />
  <polygon fill="#447c55" points="980,265 967.0431425677117,257.4422327715552 980.0667896995785,250.00014869620267" />
  <line stroke="#a74343" stroke-width="4" x1="900" x2="980" y1="400" y2="350" />
  <polygon fill="#a74343" points="980,350 972.959170945506,363.2448754703618 965.0091868454583,350.5249009102855" />
  <text fill="#17324d" font-family="Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="middle" x="1070" y="455">P(disease | positive)</text>
  <text fill="#c56a2d" font-family="Arial, sans-serif" font-size="28" font-weight="bold" text-anchor="middle" x="1070" y="493">90 / 981 ≈ 9%</text>
</svg>
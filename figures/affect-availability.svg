<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" baseProfile="full" height="650" version="1.1" viewBox="0 0 1200 650" width="1200">
  <defs />
  <title>Affect and availability as substitutions</title>
  <desc>Feelings and ease of recall can substitute for evidence about risk, benefit, frequency, or probability; a corrective separates value from likelihood and retrieves a denominator.</desc>
  <rect fill="white" height="650" width="1200" x="0" y="0" />
  <text fill="#17324d" font-family="Arial, sans-serif" font-size="34" font-weight="bold" text-anchor="middle" x="600" y="48">When feeling and memory answer the wrong question</text>
  <rect fill="#f7f1e8" height="115" rx="16" ry="16" stroke="#c56a2d" stroke-width="3" width="275" x="70" y="150" />
  <text fill="#17324d" font-family="Arial, sans-serif" font-size="26" font-weight="bold" text-anchor="middle" x="207.5" y="191.44"><tspan x="207.5" dy="0">Affect cue</tspan></text>
  <text fill="#66737f" font-family="Arial, sans-serif" font-size="17" font-weight="normal" text-anchor="middle" x="207.5" y="219.56"><tspan x="207.5" dy="0">How good or bad does it</tspan><tspan x="207.5" dy="20.06">feel?</tspan></text>
  <rect fill="#eaf3f8" height="115" rx="16" ry="16" stroke="#2f6f9f" stroke-width="3" width="275" x="70" y="390" />
  <text fill="#17324d" font-family="Arial, sans-serif" font-size="23.69" font-weight="bold" text-anchor="middle" x="207.5" y="418.896"><tspan x="207.5" dy="0">Available</tspan><tspan x="207.5" dy="27.9485">examples</tspan></text>
  <text fill="#66737f" font-family="Arial, sans-serif" font-size="15.49" font-weight="normal" text-anchor="middle" x="207.5" y="472.906"><tspan x="207.5" dy="0">How easily can I recall</tspan><tspan x="207.5" dy="18.274">it?</tspan></text>
  <line stroke="#c56a2d" stroke-width="4" x1="345" x2="520" y1="205" y2="285" />
  <polygon fill="#c56a2d" points="520,285 505.06738179872906,286.42018085294495 511.30377820274595,272.77806371915796" />
  <line stroke="#2f6f9f" stroke-width="4" x1="345" x2="520" y1="445" y2="325" />
  <polygon fill="#2f6f9f" points="520,325 513.5279206126476,338.53189522586575 505.0449952793747,326.16096244817606" />
  <rect fill="#17324d" height="145" rx="16" ry="16" stroke="#17324d" stroke-width="3" width="265" x="520" y="235" />
  <text fill="white" font-family="Arial, sans-serif" font-size="26" font-weight="bold" text-anchor="middle" x="652.5" y="274.92"><tspan x="652.5" dy="0">Substituted</tspan><tspan x="652.5" dy="30.68">judgment</tspan></text>
  <text fill="white" font-family="Arial, sans-serif" font-size="18" font-weight="normal" text-anchor="middle" x="652.5" y="334.56"><tspan x="652.5" dy="0">high risk • common •</tspan><tspan x="652.5" dy="21.24">valuable</tspan></text>
  <line stroke="#17324d" stroke-width="4" x1="785" x2="920" y1="307" y2="307" />
  <polygon fill="#17324d" points="920,307 907.0096189432334,314.5 907.0096189432334,299.5" />
  <rect fill="#edf4ed" height="205" rx="16" ry="16" stroke="#447c55" stroke-width="3" width="230" x="920" y="205" />
  <text fill="#17324d" font-family="Arial, sans-serif" font-size="26" font-weight="bold" text-anchor="middle" x="1035" y="261.35"><tspan x="1035" dy="0">Decision audit</tspan></text>
  <text fill="#66737f" font-family="Arial, sans-serif" font-size="17" font-weight="normal" text-anchor="middle" x="1035" y="289.47"><tspan x="1035" dy="0">Separate feeling from</tspan><tspan x="1035" dy="20.06">probability.</tspan><tspan x="1035" dy="20.06">Find the denominator.</tspan><tspan x="1035" dy="20.06">Use a reference</tspan><tspan x="1035" dy="20.06">class.</tspan></text>
  <text fill="#66737f" font-family="Arial, sans-serif" font-size="21" font-weight="normal" text-anchor="middle" x="600" y="585">The shortcut is adaptive when the cue samples reality fairly—and biased when salience has been engineered.</text>
</svg>
  <text fill="#66737f" font-family="Arial, sans-serif" font-size="17" font-weight="normal" text-anchor="middle" x="600" y="132.06"><tspan x="600" dy="0">What entered</tspan><tspan x="600" dy="20.06">attention?</tspan></text>
  <rect fill="#eaf3f8" height="94" rx="16" ry="16" stroke="#2f6f9f" stroke-width="3" width="210" x="713.7429987478853" y="211.9260912937621" />
  <text fill="#17324d" font-family="Arial, sans-serif" font-size="26" font-weight="bold" text-anchor="middle" x="818.743" y="242.866"><tspan x="818.743" dy="0">TEST</tspan></text>
  <text fill="#66737f" font-family="Arial, sans-serif" font-size="17" font-weight="normal" text-anchor="middle" x="818.743" y="270.986"><tspan x="818.743" dy="0">What evidence could</tspan><tspan x="818.743" dy="20.06">change the model?</tspan></text>
  <rect fill="#eaf3f8" height="94" rx="16" ry="16" stroke="#2f6f9f" stroke-width="3" width="210" x="630.1906080272688" y="469.07390870623794" />

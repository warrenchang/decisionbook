  <text fill="#66737f" font-family="Arial, sans-serif" font-size="13.48" font-weight="normal" text-anchor="middle" x="735.191" y="518.719"><tspan x="735.191" dy="0">Whose perspective</tspan><tspan x="735.191" dy="15.904">or interest is</tspan><tspan x="735.191" dy="15.904">missing?</tspan></text>
  <rect fill="#f7f1e8" height="94" rx="16" ry="16" stroke="#c56a2d" stroke-width="3" width="210" x="359.8093919727312" y="469.07390870623794" />

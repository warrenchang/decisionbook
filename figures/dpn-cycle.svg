  <text fill="#66737f" font-family="Arial, sans-serif" font-size="17" font-weight="normal" text-anchor="middle" x="464.809" y="528.134"><tspan x="464.809" dy="0">What process or</tspan><tspan x="464.809" dy="20.06">environment helps?</tspan></text>
  <rect fill="#f7f1e8" height="94" rx="16" ry="16" stroke="#c56a2d" stroke-width="3" width="210" x="276.25700125211466" y="211.9260912937621" />
  <text fill="#17324d" font-family="Arial, sans-serif" font-size="26" font-weight="bold" text-anchor="middle" x="381.257" y="242.866"><tspan x="381.257" dy="0">LEARN</tspan></text>
  <text fill="#66737f" font-family="Arial, sans-serif" font-size="17" font-weight="normal" text-anchor="middle" x="381.257" y="270.986"><tspan x="381.257" dy="0">What did the result</tspan><tspan x="381.257" dy="20.06">reveal?</tspan></text>

<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">From probability rules to Bayesian updating and calibration</title>
  <desc id="desc">Three panels show coherent event rules, a natural-frequency medical-test update, and a forecast-score-update feedback cycle.</desc>
  <defs>
    <marker id="arrow-navy" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 z" fill="#17324d"/>
    </marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 z" fill="#447c55"/>
    </marker>
    <style>
      .title { font: 700 32px Arial, sans-serif; fill: #17324d; }
      .panel-title { font: 700 23px Arial, sans-serif; fill: #17324d; }
      .label { font: 700 18px Arial, sans-serif; fill: #17324d; }
      .body { font: 16px Arial, sans-serif; fill: #344b5f; }
      .small { font: 14px Arial, sans-serif; fill: #66737f; }
      .math { font: 700 19px Arial, sans-serif; fill: #17324d; }
    </style>
  </defs>

  <rect width="1200" height="760" fill="#ffffff"/>
  <text class="title" x="600" y="45" text-anchor="middle">Probability keeps the event, denominator, and feedback visible</text>

  <!-- Panel 1: coherent rules -->
  <rect x="25" y="80" width="350" height="590" rx="18" fill="#f7fafc" stroke="#c9d6df" stroke-width="2"/>
  <text class="panel-title" x="200" y="119" text-anchor="middle">1. Coherent event rules</text>

  <rect x="50" y="148" width="300" height="98" rx="14" fill="#eaf3f8" stroke="#2f6f9f" stroke-width="2.5"/>
  <text class="label" x="72" y="180">COMPLEMENT</text>
  <text class="math" x="200" y="216" text-anchor="middle">P(not A) = 1 − P(A)</text>

  <rect x="50" y="268" width="300" height="128" rx="14" fill="#eef6ed" stroke="#447c55" stroke-width="2.5"/>
  <text class="label" x="72" y="300">AND</text>
  <text class="math" x="200" y="336" text-anchor="middle">P(A and B) = P(A) P(B|A)</text>
  <text class="small" x="200" y="370" text-anchor="middle">If independent: P(A) P(B)</text>

  <rect x="50" y="418" width="300" height="128" rx="14" fill="#f7f1e8" stroke="#c56a2d" stroke-width="2.5"/>
  <text class="label" x="72" y="450">OR</text>
  <text class="math" x="200" y="486" text-anchor="middle">P(A or B) = P(A) + P(B)</text>
  <text class="math" x="200" y="516" text-anchor="middle">− P(A and B)</text>

  <text class="body" x="200" y="588" text-anchor="middle">Mutually exclusive ≠ independent.</text>
  <text class="small" x="200" y="616" text-anchor="middle">Define the model before calculating.</text>

  <!-- Panel 2: natural frequencies -->
  <rect x="425" y="80" width="350" height="590" rx="18" fill="#f7fafc" stroke="#c9d6df" stroke-width="2"/>
  <text class="panel-title" x="600" y="119" text-anchor="middle">2. Rebuild the denominator</text>

  <rect x="500" y="148" width="200" height="66" rx="13" fill="#17324d"/>
  <text x="600" y="177" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#ffffff">10,000 people</text>
  <text x="600" y="199" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#dbe7ef">1% prevalence</text>

  <path d="M600 214 L600 242 L510 242 L510 270" fill="none" stroke="#17324d" stroke-width="3" marker-end="url(#arrow-navy)"/>
  <path d="M600 214 L600 242 L690 242 L690 270" fill="none" stroke="#17324d" stroke-width="3" marker-end="url(#arrow-navy)"/>

  <rect x="445" y="274" width="130" height="78" rx="12" fill="#f7f1e8" stroke="#c56a2d" stroke-width="2.5"/>
  <text class="label" x="510" y="305" text-anchor="middle">100</text>
  <text class="small" x="510" y="331" text-anchor="middle">diseased</text>

  <rect x="625" y="274" width="130" height="78" rx="12" fill="#eaf3f8" stroke="#2f6f9f" stroke-width="2.5"/>
  <text class="label" x="690" y="305" text-anchor="middle">9,900</text>
  <text class="small" x="690" y="331" text-anchor="middle">not diseased</text>

  <line x1="510" y1="352" x2="510" y2="400" stroke="#447c55" stroke-width="3" marker-end="url(#arrow-green)"/>
  <line x1="690" y1="352" x2="690" y2="400" stroke="#a74343" stroke-width="3" marker-end="url(#arrow-navy)"/>

  <rect x="445" y="404" width="130" height="86" rx="12" fill="#e7f4ea" stroke="#447c55" stroke-width="2.5"/>
  <text class="label" x="510" y="435" text-anchor="middle">90</text>
  <text class="small" x="510" y="459" text-anchor="middle">true positives</text>
  <text class="small" x="510" y="478" text-anchor="middle">90% sensitivity</text>

  <rect x="625" y="404" width="130" height="86" rx="12" fill="#f9e7e7" stroke="#a74343" stroke-width="2.5"/>
  <text class="label" x="690" y="435" text-anchor="middle">891</text>
  <text class="small" x="690" y="459" text-anchor="middle">false positives</text>
  <text class="small" x="690" y="478" text-anchor="middle">9% false-positive</text>

  <path d="M510 490 L510 520 L575 545" fill="none" stroke="#447c55" stroke-width="3" marker-end="url(#arrow-green)"/>
  <path d="M690 490 L690 520 L625 545" fill="none" stroke="#a74343" stroke-width="3" marker-end="url(#arrow-navy)"/>

  <rect x="470" y="548" width="260" height="92" rx="14" fill="#17324d"/>
  <text x="600" y="579" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#ffffff">Among positive tests</text>
  <text x="600" y="610" text-anchor="middle" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#ffffff">90 / (90 + 891) = 9.2%</text>

  <!-- Panel 3: forecast cycle -->
  <rect x="825" y="80" width="350" height="590" rx="18" fill="#f7fafc" stroke="#c9d6df" stroke-width="2"/>
  <text class="panel-title" x="1000" y="119" text-anchor="middle">3. Make judgment learn</text>

  <rect x="885" y="155" width="230" height="82" rx="14" fill="#eaf3f8" stroke="#2f6f9f" stroke-width="2.5"/>
  <text class="label" x="1000" y="186" text-anchor="middle">FORECAST</text>
  <text class="body" x="1000" y="215" text-anchor="middle">Event + deadline + p</text>

  <line x1="1000" y1="237" x2="1000" y2="277" stroke="#17324d" stroke-width="3" marker-end="url(#arrow-navy)"/>

  <rect x="885" y="283" width="230" height="82" rx="14" fill="#eef6ed" stroke="#447c55" stroke-width="2.5"/>
  <text class="label" x="1000" y="314" text-anchor="middle">OBSERVE</text>
  <text class="body" x="1000" y="343" text-anchor="middle">Outcome o = 0 or 1</text>

  <line x1="1000" y1="365" x2="1000" y2="405" stroke="#17324d" stroke-width="3" marker-end="url(#arrow-navy)"/>

  <rect x="885" y="411" width="230" height="82" rx="14" fill="#f7f1e8" stroke="#c56a2d" stroke-width="2.5"/>
  <text class="label" x="1000" y="442" text-anchor="middle">SCORE</text>
  <text class="body" x="1000" y="471" text-anchor="middle">Brier = (p − o)²</text>

  <line x1="1000" y1="493" x2="1000" y2="533" stroke="#17324d" stroke-width="3" marker-end="url(#arrow-navy)"/>

  <rect x="885" y="539" width="230" height="82" rx="14" fill="#f9e7e7" stroke="#a74343" stroke-width="2.5"/>
  <text class="label" x="1000" y="570" text-anchor="middle">UPDATE</text>
  <text class="body" x="1000" y="599" text-anchor="middle">Model + calibration</text>

  <path d="M885 580 C840 580 840 196 885 196" fill="none" stroke="#447c55" stroke-width="3" marker-end="url(#arrow-green)"/>

  <text class="small" x="600" y="710" text-anchor="middle">A story proposes a hypothesis. A probability model preserves alternatives; a score makes confidence answerable to evidence.</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="760" height="1170" viewBox="0 0 760 1170" role="img" aria-labelledby="title desc" data-layout="compact">
<title id="title">A benchmark for comparing alternatives</title><desc id="desc">Information informs prediction and valuation within judgment. Judgment supports choice and an outcome. Outcome feedback can inform later judgment. This is an analytical benchmark, not a fixed sequence of mental events.</desc>
<defs><style>
text {font-family:Arial,Helvetica,sans-serif;fill:#183047}
.title {font-family:Georgia,serif;font-size:38px;font-weight:bold}
</style>
<marker id="blue" markerWidth="8" markerHeight="8" refX="8" refY="4" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8 Z" fill="#25678f"/></marker>
<marker id="green" markerWidth="8" markerHeight="8" refX="8" refY="4" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8 Z" fill="#2b7a78"/></marker>
<marker id="warm" markerWidth="8" markerHeight="8" refX="8" refY="4" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8 Z" fill="#b95f2d"/></marker>
</defs><rect width="760" height="1170" fill="white"/>
<text x="380" y="53" text-anchor="middle" font-size="38" font-weight="normal" style="fill:#183047" class="title"><tspan x="380" dy="0">A benchmark for comparing</tspan><tspan x="380" dy="47.12">alternatives</tspan></text>
<rect x="150" y="139" width="460" height="113" rx="18" fill="#f4f7fa" stroke="#25678f" stroke-width="2.5"/>
<text x="380.0" y="182" text-anchor="middle" font-size="30" font-weight="bold" style="fill:#25678f" class=""><tspan x="380.0" dy="0">Information on alternatives</tspan></text>
<text x="380.0" y="223" text-anchor="middle" font-size="28" font-weight="normal" style="fill:#183047" class=""><tspan x="380.0" dy="0">What could happen?</tspan></text>
<rect x="115" y="305" width="530" height="380" rx="24" fill="none" stroke="#25678f" stroke-width="2.5" stroke-dasharray="9 7"/>
<text x="380" y="346" text-anchor="middle" font-size="32" font-weight="bold" style="fill:#183047" class=""><tspan x="380" dy="0">Judgment</tspan></text>
<rect x="170" y="373" width="420" height="114" rx="18" fill="#f4f7fa" stroke="#25678f" stroke-width="2.5"/>
<text x="380.0" y="416" text-anchor="middle" font-size="32" font-weight="bold" style="fill:#25678f" class=""><tspan x="380.0" dy="0">Prediction</tspan></text>
<text x="380.0" y="457" text-anchor="middle" font-size="28" font-weight="normal" style="fill:#183047" class=""><tspan x="380.0" dy="0">How likely is each outcome?</tspan></text>
<rect x="170" y="543" width="420" height="114" rx="18" fill="#f4f7fa" stroke="#25678f" stroke-width="2.5"/>
<text x="380.0" y="586" text-anchor="middle" font-size="32" font-weight="bold" style="fill:#25678f" class=""><tspan x="380.0" dy="0">Valuation</tspan></text>
<text x="380.0" y="627" text-anchor="middle" font-size="28" font-weight="normal" style="fill:#183047" class=""><tspan x="380.0" dy="0">How much does it matter?</tspan></text>
<rect x="170" y="743" width="420" height="110" rx="18" fill="#f4f7fa" stroke="#25678f" stroke-width="2.5"/>
<text x="380.0" y="786" text-anchor="middle" font-size="32" font-weight="bold" style="fill:#25678f" class=""><tspan x="380.0" dy="0">Choice</tspan></text>
<text x="380.0" y="827" text-anchor="middle" font-size="28" font-weight="normal" style="fill:#183047" class=""><tspan x="380.0" dy="0">Commit to an option</tspan></text>
<rect x="170" y="910" width="420" height="110" rx="18" fill="#f4f7fa" stroke="#25678f" stroke-width="2.5"/>
<text x="380.0" y="953" text-anchor="middle" font-size="32" font-weight="bold" style="fill:#25678f" class=""><tspan x="380.0" dy="0">Outcome</tspan></text>
<text x="380.0" y="994" text-anchor="middle" font-size="28" font-weight="normal" style="fill:#183047" class=""><tspan x="380.0" dy="0">Observe what happened</tspan></text>
<path d="M380 252 V305" fill="none" stroke="#25678f" stroke-width="3" stroke-linejoin="round" marker-end="url(#blue)"/>
<path d="M380 487 V543" fill="none" stroke="#25678f" stroke-width="3" stroke-linejoin="round" marker-end="url(#blue)"/>
<path d="M380 657 V743" fill="none" stroke="#25678f" stroke-width="3" stroke-linejoin="round" marker-end="url(#blue)"/>
<path d="M380 853 V910" fill="none" stroke="#25678f" stroke-width="3" stroke-linejoin="round" marker-end="url(#blue)"/>
<path d="M590 965 H700 V329 H645" fill="none" stroke="#2b7a78" stroke-width="3" stroke-linejoin="round" marker-end="url(#green)"/>
<text x="685" y="719" text-anchor="end" font-size="28" font-weight="bold" style="fill:#2b7a78" class=""><tspan x="685" dy="0">Feedback</tspan></text>
<text x="380" y="1080" text-anchor="middle" font-size="28" font-weight="normal" style="fill:#183047" class=""><tspan x="380" dy="0">An analytical benchmark;</tspan><tspan x="380" dy="34.72">actual judgment can move back and forth.</tspan></text>
</svg>

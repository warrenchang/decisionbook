<svg xmlns="http://www.w3.org/2000/svg" width="760" height="1000" viewBox="0 0 760 1000" role="img" aria-labelledby="title desc" data-layout="compact">
<title id="title">An urge can change without being acted on</title><desc id="desc">A schematic curve shows one possible rise and fall of urge intensity. Below it, breathe, recognize, allow, investigate, and non-identify and nurture are optional observation prompts, not phases of the curve or guaranteed steps to relief.</desc>
<defs><style>
text {font-family:Arial,Helvetica,sans-serif;fill:#183047}
.title {font-family:Georgia,serif;font-size:38px;font-weight:bold}
</style>
<marker id="blue" markerWidth="8" markerHeight="8" refX="8" refY="4" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8 Z" fill="#25678f"/></marker>
<marker id="green" markerWidth="8" markerHeight="8" refX="8" refY="4" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8 Z" fill="#2b7a78"/></marker>
<marker id="warm" markerWidth="8" markerHeight="8" refX="8" refY="4" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8 Z" fill="#b95f2d"/></marker>
</defs><rect width="760" height="1000" fill="white"/>
<text x="380" y="56" text-anchor="middle" font-size="38" font-weight="normal" style="fill:#183047" class="title"><tspan x="380" dy="0">An urge can change</tspan><tspan x="380" dy="47.12">without being acted on</tspan></text>
<path d="M104 182 V439 H702" fill="none" stroke="#183047" stroke-width="2.5"/><path d="M120 422 C230 422 262 222 367 229 S473 416 680 422" fill="none" stroke="#b95f2d" stroke-width="7" stroke-linecap="round"/>
<text x="390" y="480" text-anchor="middle" font-size="30" font-weight="normal" style="fill:#183047" class=""><tspan x="390" dy="0">Time</tspan></text>
<text x="51" y="315" text-anchor="middle" font-size="30" transform="rotate(-90 51 315)">Urge intensity</text>
<text x="380" y="535" text-anchor="middle" font-size="30" font-weight="normal" style="fill:#183047" class=""><tspan x="380" dy="0">One possible pattern, not a timetable.</tspan><tspan x="380" dy="37.2">Urges can persist or return.</tspan></text>
<rect x="63" y="631" width="634" height="307" rx="18" fill="#edf7f3" stroke="#2b7a78" stroke-width="2.5"/>
<text x="380.0" y="674" text-anchor="middle" font-size="32" font-weight="bold" style="fill:#2b7a78" class=""><tspan x="380.0" dy="0">An optional observation practice</tspan></text>
<text x="100" y="715" text-anchor="start" font-size="30" font-weight="normal" style="fill:#183047" class=""><tspan x="100" dy="0">Breathe and pause.</tspan></text>
<text x="100" y="755" text-anchor="start" font-size="30" font-weight="normal" style="fill:#183047" class=""><tspan x="100" dy="0">Recognize what you feel.</tspan></text>
<text x="100" y="795" text-anchor="start" font-size="30" font-weight="normal" style="fill:#183047" class=""><tspan x="100" dy="0">Allow it without requiring relief.</tspan></text>
<text x="100" y="835" text-anchor="start" font-size="30" font-weight="normal" style="fill:#183047" class=""><tspan x="100" dy="0">Investigate what the urge is like.</tspan></text>
<text x="100" y="875" text-anchor="start" font-size="30" font-weight="normal" style="fill:#183047" class=""><tspan x="100" dy="0">Non-identify and nurture</tspan><tspan x="100" dy="37.2">a caring response.</tspan></text>
</svg>

<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">An urge can be observed as a changing experience</title>
  <desc id="desc">A main urge trajectory and two faint alternatives rise, vary, and recede over unspecified time. Four observation steps—breathe, recognize and allow, investigate, and non-identify and choose—sit below the graph. No universal duration is implied.</desc>
  <rect width="1200" height="650" fill="#ffffff"/>
  <text x="600" y="46" text-anchor="middle" font-family="Arial, sans-serif" font-size="32" font-weight="700" fill="#17324d">An urge is a changing event, not an instruction</text>
  <text x="600" y="76" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="#66737f">The shape and duration vary; this schematic is not a clinical time course.</text>

  <line x1="110" y1="400" x2="1110" y2="400" stroke="#17324d" stroke-width="3"/>
  <line x1="110" y1="400" x2="110" y2="125" stroke="#17324d" stroke-width="3"/>
  <polygon points="1110,400 1094,391 1094,409" fill="#17324d"/>
  <polygon points="110,125 101,141 119,141" fill="#17324d"/>
  <text x="610" y="434" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#17324d">Time and context</text>
  <text x="38" y="270" transform="rotate(-90 38 270)" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#17324d">Urge intensity</text>

  <path d="M125 382 C210 374, 250 270, 330 247 C410 225, 455 305, 525 286 C600 266, 650 185, 735 198 C820 212, 850 314, 935 334 C1000 350, 1045 356, 1090 365" fill="none" stroke="#b9c6cf" stroke-width="3" stroke-dasharray="8 7"/>
  <path d="M125 386 C220 376, 275 330, 340 305 C430 270, 500 155, 600 174 C710 194, 745 300, 845 305 C940 310, 1015 355, 1090 370" fill="none" stroke="#d6b4b4" stroke-width="3" stroke-dasharray="8 7"/>
  <path d="M125 382 C220 370, 265 314, 330 274 C410 224, 485 153, 575 169 C670 187, 706 274, 790 305 C875 337, 982 356, 1090 369" fill="none" stroke="#a74343" stroke-width="7" stroke-linecap="round"/>

  <circle cx="190" cy="363" r="8" fill="#2f6f9f"/>
  <circle cx="360" cy="251" r="8" fill="#c56a2d"/>
  <circle cx="575" cy="169" r="9" fill="#a74343"/>
  <circle cx="870" cy="335" r="8" fill="#447c55"/>
  <line x1="190" y1="363" x2="190" y2="454" stroke="#9babb7" stroke-width="2" stroke-dasharray="5 5"/>
  <line x1="360" y1="251" x2="360" y2="454" stroke="#9babb7" stroke-width="2" stroke-dasharray="5 5"/>
  <line x1="575" y1="169" x2="575" y2="454" stroke="#9babb7" stroke-width="2" stroke-dasharray="5 5"/>
  <line x1="870" y1="335" x2="870" y2="454" stroke="#9babb7" stroke-width="2" stroke-dasharray="5 5"/>

  <g font-family="Arial, sans-serif">
    <rect x="92" y="462" width="196" height="100" rx="15" fill="#eaf3f8" stroke="#2f6f9f" stroke-width="2"/>
    <text x="190" y="494" text-anchor="middle" font-size="19" font-weight="700" fill="#17324d">Breathe</text>
    <text x="190" y="522" text-anchor="middle" font-size="16" fill="#66737f">create one pause</text>
    <text x="190" y="543" text-anchor="middle" font-size="16" fill="#66737f">before action</text>

    <rect x="304" y="462" width="196" height="100" rx="15" fill="#f7f1e8" stroke="#c56a2d" stroke-width="2"/>
    <text x="402" y="494" text-anchor="middle" font-size="19" font-weight="700" fill="#17324d">Recognize + allow</text>
    <text x="402" y="522" text-anchor="middle" font-size="16" fill="#66737f">“an urge is here”</text>
    <text x="402" y="543" text-anchor="middle" font-size="16" fill="#66737f">without obeying</text>

    <rect x="516" y="462" width="196" height="100" rx="15" fill="#f9e7e7" stroke="#a74343" stroke-width="2"/>
    <text x="614" y="494" text-anchor="middle" font-size="19" font-weight="700" fill="#17324d">Investigate</text>
    <text x="614" y="522" text-anchor="middle" font-size="16" fill="#66737f">sensation • image</text>
    <text x="614" y="543" text-anchor="middle" font-size="16" fill="#66737f">prediction • promise</text>

    <rect x="728" y="462" width="380" height="100" rx="15" fill="#edf4ed" stroke="#447c55" stroke-width="2"/>
    <text x="918" y="494" text-anchor="middle" font-size="19" font-weight="700" fill="#17324d">Non-identify + choose</text>
    <text x="918" y="522" text-anchor="middle" font-size="16" fill="#66737f">“This is an urge, not my identity.”</text>
    <text x="918" y="543" text-anchor="middle" font-size="16" fill="#66737f">Take the next wise, caring action.</text>
  </g>

  <text x="600" y="613" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#66737f">Observation can create choice; persistent or dangerous cravings may require clinical support rather than self-help alone.</text>
</svg>

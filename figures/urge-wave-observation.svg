<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="530" viewBox="0 0 1200 530" role="img" aria-labelledby="title desc">
  <title id="title">An urge changes and need not determine action</title>
  <desc id="desc">A single urge-intensity curve rises and then recedes over time. Five points along the curve mark the BRAIN sequence: breathe, recognize, allow, investigate, and nurture.</desc>

  <rect width="1200" height="530" fill="#ffffff"/>
  <text x="600" y="52" text-anchor="middle" font-family="Arial, sans-serif" font-size="34" font-weight="700" fill="#17324d">An urge changes; it does not decide</text>

  <line x1="120" y1="385" x2="1080" y2="385" stroke="#17324d" stroke-width="2.5"/>
  <line x1="120" y1="385" x2="120" y2="112" stroke="#17324d" stroke-width="2.5"/>
  <text x="600" y="425" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#17324d">Time</text>
  <text x="50" y="250" transform="rotate(-90 50 250)" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#17324d">Urge</text>

  <path d="M145 370 C245 360 300 304 365 239 C440 164 512 124 592 147 C690 175 721 276 812 320 C898 361 993 368 1052 370" fill="none" stroke="#a74343" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>

  <g font-family="Arial, sans-serif" text-anchor="middle">
    <circle cx="218" cy="347" r="10" fill="#2f6f9f"/>
    <line x1="218" y1="347" x2="218" y2="455" stroke="#9cb2c3" stroke-width="2" stroke-dasharray="5 5"/>
    <text x="218" y="486" font-size="19" font-weight="700" fill="#17324d">Breathe</text>

    <circle cx="365" cy="239" r="10" fill="#c56a2d"/>
    <line x1="365" y1="239" x2="365" y2="455" stroke="#9cb2c3" stroke-width="2" stroke-dasharray="5 5"/>
    <text x="365" y="486" font-size="19" font-weight="700" fill="#17324d">Recognize</text>

    <circle cx="548" cy="137" r="10" fill="#a74343"/>
    <line x1="548" y1="137" x2="548" y2="455" stroke="#9cb2c3" stroke-width="2" stroke-dasharray="5 5"/>
    <text x="548" y="486" font-size="19" font-weight="700" fill="#17324d">Allow</text>

    <circle cx="744" cy="291" r="10" fill="#735a96"/>
    <line x1="744" y1="291" x2="744" y2="455" stroke="#9cb2c3" stroke-width="2" stroke-dasharray="5 5"/>
    <text x="744" y="486" font-size="19" font-weight="700" fill="#17324d">Investigate</text>

    <circle cx="941" cy="364" r="10" fill="#447c55"/>
    <line x1="941" y1="364" x2="941" y2="455" stroke="#9cb2c3" stroke-width="2" stroke-dasharray="5 5"/>
    <text x="941" y="486" font-size="19" font-weight="700" fill="#17324d">Nurture</text>
  </g>
</svg>

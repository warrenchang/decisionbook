<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" baseProfile="full" height="650" version="1.1" viewBox="0 0 1200 650" width="1200">
  <defs />
  <title>Persuasion as model updating</title>
  <desc>An audience current model meets a credible message that directs attention, provides evidence, connects value, addresses identity and efficacy, and makes action possible.</desc>
  <rect fill="white" height="650" width="1200" x="0" y="0" />
  <text fill="#17324d" font-family="Arial, sans-serif" font-size="34" font-weight="bold" text-anchor="middle" x="600" y="48">Persuasion is guided model updating</text>
  <rect fill="#eaf3f8" height="120" rx="16" ry="16" stroke="#2f6f9f" stroke-width="3" width="230" x="45" y="230" />
  <text fill="#17324d" font-family="Arial, sans-serif" font-size="26" font-weight="bold" text-anchor="middle" x="160" y="273.94"><tspan x="160" dy="0">Audience model</tspan></text>
  <text fill="#66737f" font-family="Arial, sans-serif" font-size="17" font-weight="normal" text-anchor="middle" x="160" y="302.06"><tspan x="160" dy="0">beliefs • values •</tspan><tspan x="160" dy="20.06">identity</tspan></text>
  <line stroke="#17324d" stroke-width="4" x1="275" x2="430" y1="290" y2="290" />
  <polygon fill="#17324d" points="430,290 417.0096189432334,297.5 417.0096189432334,282.5" />
  <rect fill="#eaf3f8" height="290" rx="16" ry="16" stroke="#2f6f9f" stroke-width="3" width="340" x="430" y="145" />
  <text fill="#17324d" font-family="Arial, sans-serif" font-size="26" font-weight="bold" text-anchor="middle" x="600" y="224.41"><tspan x="600" dy="0">Message design</tspan></text>
  <text fill="#66737f" font-family="Arial, sans-serif" font-size="17" font-weight="normal" text-anchor="middle" x="600" y="252.53"><tspan x="600" dy="0">ethos • pathos • logos • kairos</tspan></text>
  <text fill="#17324d" font-family="Arial, sans-serif" font-size="21" font-weight="normal" text-anchor="middle" x="600" y="280.95"><tspan x="600" dy="0">• attention</tspan></text>
  <text fill="#17324d" font-family="Arial, sans-serif" font-size="21" font-weight="normal" text-anchor="middle" x="600" y="310.73"><tspan x="600" dy="0">• evidence</tspan></text>
  <text fill="#17324d" font-family="Arial, sans-serif" font-size="21" font-weight="normal" text-anchor="middle" x="600" y="340.51"><tspan x="600" dy="0">• meaning</tspan></text>
  <text fill="#17324d" font-family="Arial, sans-serif" font-size="21" font-weight="normal" text-anchor="middle" x="600" y="370.29"><tspan x="600" dy="0">• efficacy</tspan></text>
  <line stroke="#17324d" stroke-width="4" x1="770" x2="925" y1="290" y2="290" />
  <polygon fill="#17324d" points="925,290 912.0096189432334,297.5 912.0096189432334,282.5" />
  <rect fill="#f7f1e8" height="120" rx="16" ry="16" stroke="#c56a2d" stroke-width="3" width="230" x="925" y="230" />
  <text fill="#17324d" font-family="Arial, sans-serif" font-size="26" font-weight="bold" text-anchor="middle" x="1040" y="273.94"><tspan x="1040" dy="0">Updated model</tspan></text>
  <text fill="#66737f" font-family="Arial, sans-serif" font-size="17" font-weight="normal" text-anchor="middle" x="1040" y="302.06"><tspan x="1040" dy="0">belief + intention +</tspan><tspan x="1040" dy="20.06">action</tspan></text>
  <text fill="#17324d" font-family="Arial, sans-serif" font-size="22" font-weight="normal" text-anchor="middle" x="600" y="520">A message fails when it answers the obstacle the persuader wishes existed.</text>
  <text fill="#66737f" font-family="Arial, sans-serif" font-size="20" font-weight="normal" text-anchor="middle" x="600" y="565">Ethical persuasion preserves the audience’s ability to inspect and refuse.</text>
</svg>
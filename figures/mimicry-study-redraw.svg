<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">Behavioral mimicry in Chartrand and Bargh's first experiment</title>
  <desc id="desc">A zero-origin grouped bar chart redraws actions per minute for 35 participants. Face rubbing was higher with a face-rubbing partner than with a foot-shaking partner, a statistically significant contrast. Foot shaking was higher with a foot-shaking partner, but that contrast was only marginal, p equals .06. A boundary panel cautions that this one laboratory study does not establish a universal effect size.</desc>
  <rect width="1200" height="700" fill="#ffffff"/>
  <text x="600" y="48" text-anchor="middle" font-family="Arial, sans-serif" font-size="33" font-weight="700" fill="#17324d">Behavior can align before anyone decides to align</text>
  <text x="600" y="80" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#66737f">Original redraw of reported means • Chartrand &amp; Bargh (1999), Experiment 1 • N = 35</text>

  <rect x="45" y="112" width="760" height="520" rx="18" fill="#f7fafc" stroke="#c8d7e2" stroke-width="2"/>
  <text x="425" y="151" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#17324d">Participant behavior by interaction partner’s mannerism</text>
  <line x1="130" y1="520" x2="755" y2="520" stroke="#8fa0ad" stroke-width="2"/>
  <line x1="130" y1="200" x2="130" y2="520" stroke="#8fa0ad" stroke-width="2"/>
  <g font-family="Arial, sans-serif" font-size="16" fill="#66737f">
    <text x="116" y="525" text-anchor="end">0</text>
    <line x1="130" y1="440" x2="755" y2="440" stroke="#dce5ea"/><text x="116" y="445" text-anchor="end">0.2</text>
    <line x1="130" y1="360" x2="755" y2="360" stroke="#dce5ea"/><text x="116" y="365" text-anchor="end">0.4</text>
    <line x1="130" y1="280" x2="755" y2="280" stroke="#dce5ea"/><text x="116" y="285" text-anchor="end">0.6</text>
    <line x1="130" y1="200" x2="755" y2="200" stroke="#dce5ea"/><text x="116" y="205" text-anchor="end">0.8</text>
    <text x="52" y="360" transform="rotate(-90 52 360)" text-anchor="middle" font-size="16">Actions per minute</text>
  </g>

  <rect x="190" y="292" width="82" height="228" rx="7" fill="#2f6f9f"/>
  <rect x="284" y="380" width="82" height="140" rx="7" fill="#c7d7e2" stroke="#2f6f9f" stroke-width="2"/>
  <text x="231" y="282" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#17324d">0.57</text>
  <text x="325" y="370" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#17324d">0.35</text>
  <text x="278" y="553" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#17324d">Participant rubs face</text>
  <line x1="210" y1="252" x2="346" y2="252" stroke="#447c55" stroke-width="2"/>
  <line x1="210" y1="252" x2="210" y2="263" stroke="#447c55" stroke-width="2"/>
  <line x1="346" y1="252" x2="346" y2="263" stroke="#447c55" stroke-width="2"/>
  <text x="278" y="239" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#447c55">statistically significant</text>

  <rect x="505" y="340" width="82" height="180" rx="7" fill="#2f6f9f"/>
  <rect x="599" y="228" width="82" height="292" rx="7" fill="#c7d7e2" stroke="#2f6f9f" stroke-width="2"/>
  <text x="546" y="330" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#17324d">0.45</text>
  <text x="640" y="218" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#17324d">0.73</text>
  <text x="593" y="553" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#17324d">Participant shakes foot</text>
  <line x1="525" y1="188" x2="661" y2="188" stroke="#c56a2d" stroke-width="2"/>
  <line x1="525" y1="188" x2="525" y2="199" stroke="#c56a2d" stroke-width="2"/>
  <line x1="661" y1="188" x2="661" y2="199" stroke="#c56a2d" stroke-width="2"/>
  <text x="593" y="175" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#c56a2d">marginal, p = .06</text>

  <rect x="190" y="586" width="22" height="22" rx="4" fill="#2f6f9f"/><text x="221" y="603" font-family="Arial, sans-serif" font-size="16" fill="#17324d">Partner rubs face</text>
  <rect x="450" y="586" width="22" height="22" rx="4" fill="#c7d7e2" stroke="#2f6f9f" stroke-width="2"/><text x="481" y="603" font-family="Arial, sans-serif" font-size="16" fill="#17324d">Partner shakes foot</text>

  <rect x="835" y="112" width="320" height="520" rx="18" fill="#f7f1e8" stroke="#c56a2d" stroke-width="2"/>
  <text x="995" y="158" text-anchor="middle" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#17324d">Read the two contrasts</text>
  <rect x="875" y="190" width="240" height="132" rx="14" fill="#edf4ed" stroke="#447c55" stroke-width="2"/>
  <text x="995" y="226" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#17324d">Face rubbing</text>
  <text x="995" y="256" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#66737f">The partner-mannerism</text>
  <text x="995" y="279" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#66737f">contrast was significant.</text>
  <text x="995" y="302" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#447c55">This is the clearer result.</text>
  <text x="995" y="367" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#a74343">Boundary</text>
  <text x="995" y="400" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#17324d">Foot shaking moved in the</text>
  <text x="995" y="425" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#17324d">predicted direction, but its</text>
  <text x="995" y="450" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#17324d">contrast was marginal (p = .06).</text>
  <text x="995" y="492" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#17324d">One laboratory task does not</text>
  <text x="995" y="517" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#17324d">establish a universal effect size.</text>
  <line x1="875" y1="546" x2="1115" y2="546" stroke="#d8c5aa"/>
  <text x="995" y="578" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#17324d">Attunement is not mind control.</text>
  <text x="600" y="676" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#66737f">Data source: Chartrand &amp; Bargh (1999). Graphic design and annotations are original to this book.</text>
</svg>

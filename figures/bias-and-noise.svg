<?xml version='1.0' encoding='UTF-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="600" viewBox="50 164 1100 600" role="img" aria-labelledby="bias-title bias-desc" data-text-review="2026-09-14">
  <title id="bias-title">Bias and noise in repeated judgments</title>
  <desc id="bias-desc">Four target diagrams distinguish low and high bias from low and high noise. The dots represent comparable judgments and the center an outcome or accepted benchmark.</desc>

  <rect width="1200" height="840" fill="#ffffff"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <g transform="translate(70,184)">
      <rect width="510" height="270" rx="22" fill="#edf7ef" stroke="#4f8b61" stroke-width="3"/>
      <text x="255" y="55" text-anchor="middle" font-size="40" font-weight="700" fill="#2d6740">LOW BIAS, LOW NOISE</text>
      <g transform="translate(255,180)">
        <circle r="72" fill="#ffffff" stroke="#9fb0bf" stroke-width="2"/>
        <circle r="47" fill="none" stroke="#c3cfda" stroke-width="2"/>
        <circle r="23" fill="none" stroke="#c3cfda" stroke-width="2"/>
        <circle r="5" fill="#183047"/>
        <g fill="#2b75a0"><circle cx="-10" cy="-8" r="6"/><circle cx="9" cy="-5" r="6"/><circle cx="-6" cy="10" r="6"/><circle cx="8" cy="11" r="6"/><circle cx="1" cy="2" r="6"/></g>
      </g>
    </g>

    <g transform="translate(620,184)">
      <rect width="510" height="270" rx="22" fill="#fff8ea" stroke="#d39b34" stroke-width="3"/>
      <text x="255" y="55" text-anchor="middle" font-size="40" font-weight="700" fill="#7d5718">BIAS, LOW NOISE</text>
      <g transform="translate(255,180)">
        <circle r="72" fill="#ffffff" stroke="#9fb0bf" stroke-width="2"/>
        <circle r="47" fill="none" stroke="#c3cfda" stroke-width="2"/>
        <circle r="23" fill="none" stroke="#c3cfda" stroke-width="2"/>
        <circle r="5" fill="#183047"/>
        <g fill="#c05e2b"><circle cx="34" cy="-39" r="6"/><circle cx="49" cy="-36" r="6"/><circle cx="38" cy="-25" r="6"/><circle cx="53" cy="-22" r="6"/><circle cx="44" cy="-31" r="6"/></g>
      </g>
    </g>

    <g transform="translate(70,474)">
      <rect width="510" height="270" rx="22" fill="#eef5fa" stroke="#2b75a0" stroke-width="3"/>
      <text x="255" y="55" text-anchor="middle" font-size="40" font-weight="700" fill="#245f84">LOW BIAS, HIGH NOISE</text>
      <g transform="translate(255,180)">
        <circle r="72" fill="#ffffff" stroke="#9fb0bf" stroke-width="2"/>
        <circle r="47" fill="none" stroke="#c3cfda" stroke-width="2"/>
        <circle r="23" fill="none" stroke="#c3cfda" stroke-width="2"/>
        <circle r="5" fill="#183047"/>
        <g fill="#2b75a0"><circle cx="-52" cy="-27" r="6"/><circle cx="47" cy="-35" r="6"/><circle cx="-44" cy="38" r="6"/><circle cx="51" cy="32" r="6"/><circle cx="-2" cy="-7" r="6"/></g>
      </g>
    </g>

    <g transform="translate(620,474)">
      <rect width="510" height="270" rx="22" fill="#fbefef" stroke="#a55358" stroke-width="3"/>
      <text x="255" y="55" text-anchor="middle" font-size="40" font-weight="700" fill="#843b42">BIAS AND HIGH NOISE</text>
      <g transform="translate(255,180)">
        <circle r="72" fill="#ffffff" stroke="#9fb0bf" stroke-width="2"/>
        <circle r="47" fill="none" stroke="#c3cfda" stroke-width="2"/>
        <circle r="23" fill="none" stroke="#c3cfda" stroke-width="2"/>
        <circle r="5" fill="#183047"/>
        <g fill="#a55358"><circle cx="9" cy="-55" r="6"/><circle cx="57" cy="-28" r="6"/><circle cx="22" cy="4" r="6"/><circle cx="63" cy="20" r="6"/><circle cx="39" cy="43" r="6"/></g>
      </g>
    </g>
  </g>

</svg>

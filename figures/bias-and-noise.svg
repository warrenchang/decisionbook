<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="840" viewBox="0 0 1200 840" role="img" aria-labelledby="bias-title bias-desc">
  <title id="bias-title">A conditional target analogy for bias and noise</title>
  <desc id="bias-desc">Four target diagrams distinguish low and high bias from low and high noise. A condition banner says the analogy requires repeated commensurable judgments and an observable or normatively accepted target. Separate lower panels define level noise as persistent differences in judges' average levels and pattern noise as different reactions to case features. A note identifies the figure as an author's explanatory adaptation.</desc>

  <rect width="1200" height="840" fill="#ffffff"/>
  <text x="600" y="48" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700" fill="#183047">Bias and noise answer different questions</text>
  <text x="600" y="80" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#60758a">Bias concerns the average relative to a target; noise concerns unwanted spread among judgments that should agree.</text>

  <rect x="70" y="104" width="1060" height="58" rx="17" fill="#fff8ea" stroke="#d39b34" stroke-width="2"/>
  <text x="600" y="129" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#7d5718">Use the target analogy only for repeated, commensurable judgments of the same or comparable cases</text>
  <text x="600" y="151" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#60758a">and only when the center represents an observable outcome or a defensible, accepted benchmark.</text>

  <g font-family="Arial, Helvetica, sans-serif">
    <g transform="translate(70,184)">
      <rect width="510" height="222" rx="22" fill="#edf7ef" stroke="#4f8b61" stroke-width="3"/>
      <text x="304" y="50" text-anchor="middle" font-size="23" font-weight="700" fill="#2d6740">LOW BIAS, LOW NOISE</text>
      <text x="304" y="88" text-anchor="middle" font-size="17" fill="#183047">average near the target</text>
      <text x="304" y="116" text-anchor="middle" font-size="17" fill="#183047">judgments tightly clustered</text>
      <g transform="translate(124,124)">
        <circle r="72" fill="#ffffff" stroke="#9fb0bf" stroke-width="2"/>
        <circle r="47" fill="none" stroke="#c3cfda" stroke-width="2"/>
        <circle r="23" fill="none" stroke="#c3cfda" stroke-width="2"/>
        <circle r="5" fill="#183047"/>
        <g fill="#2b75a0"><circle cx="-10" cy="-8" r="6"/><circle cx="9" cy="-5" r="6"/><circle cx="-6" cy="10" r="6"/><circle cx="8" cy="11" r="6"/><circle cx="1" cy="2" r="6"/></g>
      </g>
    </g>

    <g transform="translate(620,184)">
      <rect width="510" height="222" rx="22" fill="#fff8ea" stroke="#d39b34" stroke-width="3"/>
      <text x="304" y="50" text-anchor="middle" font-size="23" font-weight="700" fill="#7d5718">BIAS, LOW NOISE</text>
      <text x="304" y="88" text-anchor="middle" font-size="17" fill="#183047">average displaced from target</text>
      <text x="304" y="116" text-anchor="middle" font-size="17" fill="#183047">judgments tightly clustered</text>
      <g transform="translate(124,124)">
        <circle r="72" fill="#ffffff" stroke="#9fb0bf" stroke-width="2"/>
        <circle r="47" fill="none" stroke="#c3cfda" stroke-width="2"/>
        <circle r="23" fill="none" stroke="#c3cfda" stroke-width="2"/>
        <circle r="5" fill="#183047"/>
        <g fill="#c05e2b"><circle cx="34" cy="-39" r="6"/><circle cx="49" cy="-36" r="6"/><circle cx="38" cy="-25" r="6"/><circle cx="53" cy="-22" r="6"/><circle cx="44" cy="-31" r="6"/></g>
      </g>
    </g>

    <g transform="translate(70,426)">
      <rect width="510" height="222" rx="22" fill="#eef5fa" stroke="#2b75a0" stroke-width="3"/>
      <text x="304" y="50" text-anchor="middle" font-size="23" font-weight="700" fill="#245f84">LOW BIAS, HIGH NOISE</text>
      <text x="304" y="88" text-anchor="middle" font-size="17" fill="#183047">average near the target</text>
      <text x="304" y="116" text-anchor="middle" font-size="17" fill="#183047">judgments widely dispersed</text>
      <g transform="translate(124,124)">
        <circle r="72" fill="#ffffff" stroke="#9fb0bf" stroke-width="2"/>
        <circle r="47" fill="none" stroke="#c3cfda" stroke-width="2"/>
        <circle r="23" fill="none" stroke="#c3cfda" stroke-width="2"/>
        <circle r="5" fill="#183047"/>
        <g fill="#2b75a0"><circle cx="-52" cy="-27" r="6"/><circle cx="47" cy="-35" r="6"/><circle cx="-44" cy="38" r="6"/><circle cx="51" cy="32" r="6"/><circle cx="-2" cy="-7" r="6"/></g>
      </g>
    </g>

    <g transform="translate(620,426)">
      <rect width="510" height="222" rx="22" fill="#fbefef" stroke="#a55358" stroke-width="3"/>
      <text x="304" y="50" text-anchor="middle" font-size="23" font-weight="700" fill="#843b42">BIAS AND HIGH NOISE</text>
      <text x="304" y="88" text-anchor="middle" font-size="17" fill="#183047">average displaced from target</text>
      <text x="304" y="116" text-anchor="middle" font-size="17" fill="#183047">judgments widely dispersed</text>
      <g transform="translate(124,124)">
        <circle r="72" fill="#ffffff" stroke="#9fb0bf" stroke-width="2"/>
        <circle r="47" fill="none" stroke="#c3cfda" stroke-width="2"/>
        <circle r="23" fill="none" stroke="#c3cfda" stroke-width="2"/>
        <circle r="5" fill="#183047"/>
        <g fill="#a55358"><circle cx="9" cy="-55" r="6"/><circle cx="57" cy="-28" r="6"/><circle cx="22" cy="4" r="6"/><circle cx="63" cy="20" r="6"/><circle cx="39" cy="43" r="6"/></g>
      </g>
    </g>
  </g>

  <g font-family="Arial, Helvetica, sans-serif">
    <rect x="70" y="674" width="510" height="116" rx="20" fill="#f4f7f9" stroke="#9fb1c0" stroke-width="2"/>
    <text x="96" y="708" font-size="21" font-weight="700" fill="#17324d">LEVEL NOISE</text>
    <text x="96" y="739" font-size="17" fill="#183047">Persistent differences in judges' average levels:</text>
    <text x="96" y="768" font-size="17" fill="#60758a">some judges are generally harsher or more generous.</text>

    <rect x="620" y="674" width="510" height="116" rx="20" fill="#f4f7f9" stroke="#9fb1c0" stroke-width="2"/>
    <text x="646" y="708" font-size="21" font-weight="700" fill="#17324d">PATTERN NOISE</text>
    <text x="646" y="739" font-size="17" fill="#183047">Judges react differently to features of particular cases:</text>
    <text x="646" y="768" font-size="17" fill="#60758a">their idiosyncratic patterns need not be constant over cases.</text>
  </g>

  <text x="600" y="822" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#60758a">Author's explanatory adaptation of the target analogy; occasion noise is additional within-judge variation across occasions.</text>
</svg>

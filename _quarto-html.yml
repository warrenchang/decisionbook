format:
  html:
    theme:
      - cosmo
      - quarto-custom.scss
    toc: true
    toc-depth: 3
    smooth-scroll: true
    link-external-newwindow: true
    code-copy: false
    syntax-highlighting: none
    minimal: true
    fig-responsive: true

    comments:
      giscus:
        repo: warrenchang/decisionbook
        repo-id: "R_kgDOTpqPRg"
        category: "Announcements"
        category-id: "DIC_kwDOTpqPRs4DCa1q"
        mapping: pathname
        reactions-enabled: true
        input-position: top
        loading: lazy
        language: en
        theme:
          light: light
          dark: dark_dimmed

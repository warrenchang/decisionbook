project:
  type: book
  output-dir: docs
  resources:
    - figures/
  preview:
    port: 8000
    browser: true
    watch-inputs: true
    navigate: true

profile:
  default: html
  group:
    - [html, epub]

book:
  title: "Decision in the Making"
  subtitle: "The Behavioral Science of Choice, Influence, and Agreement"
  output-file: Decision-in-the-Making
  author: "Huanren Warren Zhang"
  date: today
  description: "A cumulative journey through how choices take shape, how minds influence one another, and how people construct better agreements and decision environments."
  cover-image: figures/cover.png
  cover-image-alt: "Cover of Decision in the Making"
  page-navigation: true
  page-footer:
    left: "© 2026 Huanren Warren Zhang. All rights reserved."
  search: true
  repo-url: https://github.com/warrenchang/decisionbook
  repo-actions: [edit, issue, source]
  sidebar:
    style: docked
    background: "#f7f9fc"
    foreground: "#183047"
    border: true
    collapse-level: 1
    pinned: true
    search: true

lang: en
date-format: "MMMM D, YYYY"
number-depth: 0

language:
  title-block-published: "This Version"

editor:
  markdown:
    wrap: none
    canonical: true

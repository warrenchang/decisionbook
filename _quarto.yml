project:
  type: book
  output-dir: docs
  resources:
    - figures/
  preview:
    port: 8000
    browser: true
    watch-inputs: true
    navigate: true

profile:
  default: html
  group:
    - [html, epub]

book:
  title: "Decision in the Making"
  subtitle: "The Behavioral Science of Choice, Influence, and Agreement"
  output-file: Decision-in-the-Making
  author: "Huanren Warren Zhang"
  date: today
  description: "Visible choices are only the endpoint. This book follows decisions in the making—from attention, interpretation, prediction, and valuation to influence, communication, negotiation, and the design of environments that make better judgment and action possible."
  cover-image: figures/cover-v2.png
  cover-image-alt: "Cover of Decision in the Making"
  page-navigation: true
  page-footer:
    left: "© 2026 Huanren Warren Zhang. All rights reserved."
  search: true
  repo-url: https://github.com/warrenchang/decisionbook
  repo-actions: [edit, issue, source]
  sidebar:
    style: docked
    background: "#f7f9fc"
    foreground: "#183047"
    border: true
    collapse-level: 1
    pinned: true
    search: true

lang: en
date-format: "MMMM D, YYYY"
number-depth: 0

language:
  title-block-published: "This Version"

editor:
  markdown:
    wrap: none
    canonical: true

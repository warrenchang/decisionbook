project:
  type: book
  output-dir: docs
  resources:
    - figures/
  preview:
    port: 8000
    browser: true
    watch-inputs: true
    navigate: true

book:
  title: "Decision, Persuasion, and Negotiation"
  subtitle: "How Minds Choose, Influence, Connect, and Bargain"
  author: "Huanren Warren Zhang"
  date: "2026"
  description: "A cumulative textbook on how people choose, influence, communicate, negotiate, and build better decision systems."
  cover-image: figures/cover.png
  cover-image-alt: "Cover of Decision, Persuasion, and Negotiation"
  page-navigation: true
  page-footer:
    left: "© 2026 Huanren Warren Zhang. All rights reserved."
  search: true
  repo-url: https://github.com/warrenchang/decisionbook
  repo-actions: [edit, issue, source]
  sidebar:
    style: docked
    background: "#f7f9fc"
    foreground: "#183047"
    border: true
    collapse-level: 1
    pinned: true
    search: true
  chapters:
    - index.qmd
    - part: parts/part-1.qmd
      chapters:
        - chapters/01-the-choice-is-the-tip-of-the-iceberg.qmd
        - chapters/02-a-rational-benchmark-not-a-portrait.qmd
        - chapters/03-opportunity-cost-information-and-better-options.qmd
        - chapters/04-fast-answers-slow-inspection.qmd
        - chapters/05-attention-is-the-gatekeeper-of-evidence.qmd
        - chapters/06-the-predictive-mind.qmd
        - chapters/07-value-is-constructed.qmd
        - chapters/08-expectations-that-become-causes.qmd
    - part: parts/part-2.qmd
      chapters:
        - chapters/09-heuristics-the-adaptive-toolbox.qmd
        - chapters/10-feeling-and-availability-as-shortcuts.qmd
        - chapters/11-resemblance-is-not-probability.qmd
        - chapters/12-base-rates-randomness-and-calibration.qmd
        - chapters/13-biases-that-protect-a-story.qmd
        - chapters/14-anchors-halos-decoys-and-escalation.qmd
        - chapters/15-frames-change-the-decision.qmd
        - chapters/16-priming-and-the-active-mental-context.qmd
        - chapters/17-fluency-familiarity-and-the-feeling-of-truth.qmd
    - part: parts/part-3.qmd
      chapters:
        - chapters/18-the-narrator-after-the-choice.qmd
        - chapters/19-habits-when-decisions-move-downstairs.qmd
        - chapters/20-wanting-craving-and-self-control.qmd
        - chapters/21-designing-behavior.qmd
    - part: parts/part-4.qmd
      chapters:
        - chapters/22-social-learning-mimicry-and-attribution.qmd
        - chapters/23-conformity-norms-and-social-proof.qmd
        - chapters/24-authority-bystanders-and-influence-triggers.qmd
    - part: parts/part-5.qmd
      chapters:
        - chapters/25-persuasion-is-model-updating.qmd
        - chapters/26-why-stories-move-minds.qmd
        - chapters/27-building-an-evidence-aligned-story.qmd
        - chapters/28-communication-is-joint-inference.qmd
        - chapters/29-the-art-of-conversation-and-repair.qmd
    - part: parts/part-6.qmd
      chapters:
        - chapters/30-negotiation-is-joint-decision-making.qmd
        - chapters/31-preparing-to-claim-value.qmd
        - chapters/32-anchors-concessions-and-bargaining-tactics.qmd
        - chapters/33-interests-priorities-and-trade-offs.qmd
        - chapters/34-mesos-contingent-contracts-and-better-agreements.qmd
    - part: parts/part-7.qmd
      chapters:
        - chapters/35-decision-hygiene-and-the-dpn-studio.qmd
    - references.qmd
    - about.qmd
  appendices:
    - appendices/appendix-a-portable-course-tools.qmd
    - appendices/appendix-b-index-of-major-course-examples.qmd

lang: en
number-depth: 0

format:
  html:
    theme:
      - cosmo
      - quarto-custom.scss
    toc: true
    toc-depth: 3
    smooth-scroll: true
    link-external-newwindow: true
    code-copy: false
    fig-responsive: true

editor:
  markdown:
    wrap: none
    canonical: true

project:
  type: book
  output-dir: docs
  resources:
    - figures/
  preview:
    port: 8000
    browser: true
    watch-inputs: true
    navigate: true

profile:
  default: html
  group:
    - [html, epub]

book:
  title: "Decision, Persuasion, and Negotiation"
  subtitle: "How Minds Choose, Influence, Connect, and Bargain"
  output-file: Decision-Persuasion-and-Negotiation
  author: "Huanren Warren Zhang"
  date: today
  description: "A textbook on how people choose, influence, communicate, negotiate, and build better decision systems."
  cover-image: figures/cover.png
  cover-image-alt: "Cover of Decision, Persuasion, and Negotiation"
  page-navigation: true
  page-footer:
    left: "© 2026 Huanren Warren Zhang. All rights reserved."
  search: true
  repo-url: https://github.com/warrenchang/decisionbook
  repo-actions: [edit, issue, source]
  sidebar:
    style: docked
    background: "#f7f9fc"
    foreground: "#183047"
    border: true
    collapse-level: 1
    pinned: true
    search: true

lang: en
date-format: "MMMM D, YYYY"
number-depth: 0

language:
  title-block-published: "This Version"

format:
  html:
    theme:
      - cosmo
      - quarto-custom.scss
    toc: true
    toc-depth: 3
    smooth-scroll: true
    link-external-newwindow: true
    code-copy: false
    syntax-highlighting: none
    minimal: true
    fig-responsive: true

    comments:
      giscus:
        repo: warrenchang/decisionbook
        repo-id: "R_kgDOTpqPRg"
        category: "Announcements"
        category-id: "DIC_kwDOTpqPRs4DCa1q"
        mapping: pathname
        reactions-enabled: true
        input-position: top
        loading: lazy
        language: en
        theme:
          light: light
          dark: dark_dimmed
editor:
  markdown:
    wrap: none
    canonical: true

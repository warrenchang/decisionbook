project:
  output-dir: _epub
  post-render:
    - python3 scripts/sync_epub_release.py

metadata:
  identifier:
    scheme: URN
    text: "urn:uuid:d5f0cd81-a793-488a-87d3-47257fdb4c0d"
  publisher: "Huanren Warren Zhang"
  rights: "© 2026 Huanren Warren Zhang. All rights reserved."
  subject:
    - "Decision science"
    - "Behavioral economics"
    - "Persuasion"
    - "Communication"
    - "Negotiation"
    - "Behavior design"
  accessModes:
    - textual
    - visual
  accessModeSufficient:
    - "textual,visual"
  accessibilityFeatures:
    - alternativeText
    - readingOrder
    - structuralNavigation
    - tableOfContents
    - MathML
  accessibilityHazards:
    - none
  accessibilitySummary: "This EPUB provides structural navigation, a table of contents, MathML for equations, and alternative text for informative images. Complex figures and tables may be easier to inspect on a larger screen."
  ibooks:
    version: "2026.09.12"


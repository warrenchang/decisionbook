<svg xmlns="http://www.w3.org/2000/svg" width="760" height="1000" viewBox="0 0 760 1000" role="img" aria-labelledby="title desc" data-layout="compact">
<title id="title">Understanding develops through checking</title><desc id="desc">Person A expresses words and signals that person B interprets in context. Questions, paraphrasing, and corrections provide a return path to the speaker. Understanding remains sufficient for the current purpose and open to repair.</desc>
<defs><style>
text {font-family:Arial,Helvetica,sans-serif;fill:#183047}
.title {font-family:Georgia,serif;font-size:38px;font-weight:bold}
</style>
<marker id="blue" markerWidth="8" markerHeight="8" refX="8" refY="4" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8 Z" fill="#25678f"/></marker>
<marker id="green" markerWidth="8" markerHeight="8" refX="8" refY="4" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8 Z" fill="#2b7a78"/></marker>
<marker id="warm" markerWidth="8" markerHeight="8" refX="8" refY="4" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8 Z" fill="#b95f2d"/></marker>
</defs><rect width="760" height="1000" fill="white"/>
<text x="380" y="58" text-anchor="middle" font-size="38" font-weight="normal" style="fill:#183047" class="title"><tspan x="380" dy="0">Understanding develops</tspan><tspan x="380" dy="47.12">through checking</tspan></text>
<rect x="115" y="177" width="530" height="116" rx="18" fill="#f4f7fa" stroke="#25678f" stroke-width="2.5"/>
<text x="380.0" y="220" text-anchor="middle" font-size="32" font-weight="bold" style="fill:#25678f" class=""><tspan x="380.0" dy="0">Person A</tspan></text>
<text x="380.0" y="261" text-anchor="middle" font-size="28" font-weight="normal" style="fill:#183047" class=""><tspan x="380.0" dy="0">Intention and context</tspan></text>
<path d="M380 293 V360" fill="none" stroke="#25678f" stroke-width="3" stroke-linejoin="round" marker-end="url(#blue)"/>
<rect x="115" y="360" width="530" height="116" rx="18" fill="#f4f7fa" stroke="#25678f" stroke-width="2.5"/>
<text x="380.0" y="403" text-anchor="middle" font-size="32" font-weight="bold" style="fill:#25678f" class=""><tspan x="380.0" dy="0">Words and signals</tspan></text>
<text x="380.0" y="444" text-anchor="middle" font-size="28" font-weight="normal" style="fill:#183047" class=""><tspan x="380.0" dy="0">Content, tone, and timing</tspan></text>
<path d="M380 476 V543" fill="none" stroke="#25678f" stroke-width="3" stroke-linejoin="round" marker-end="url(#blue)"/>
<rect x="115" y="543" width="530" height="116" rx="18" fill="#f4f7fa" stroke="#25678f" stroke-width="2.5"/>
<text x="380.0" y="586" text-anchor="middle" font-size="32" font-weight="bold" style="fill:#25678f" class=""><tspan x="380.0" dy="0">Person B</tspan></text>
<text x="380.0" y="627" text-anchor="middle" font-size="28" font-weight="normal" style="fill:#183047" class=""><tspan x="380.0" dy="0">Interpretation and context</tspan></text>
<path d="M380 659 V726" fill="none" stroke="#25678f" stroke-width="3" stroke-linejoin="round" marker-end="url(#blue)"/>
<rect x="115" y="726" width="530" height="116" rx="18" fill="#f4f7fa" stroke="#2b7a78" stroke-width="2.5"/>
<text x="380.0" y="769" text-anchor="middle" font-size="32" font-weight="bold" style="fill:#2b7a78" class=""><tspan x="380.0" dy="0">Check and repair</tspan></text>
<text x="380.0" y="810" text-anchor="middle" font-size="28" font-weight="normal" style="fill:#183047" class=""><tspan x="380.0" dy="0">Ask, paraphrase, and correct</tspan></text>
<path d="M115 784 H47 V235 H115" fill="none" stroke="#2b7a78" stroke-width="3" stroke-linejoin="round" marker-end="url(#green)"/>
<text x="380" y="919" text-anchor="middle" font-size="28" font-weight="normal" style="fill:#183047" class=""><tspan x="380" dy="0">Understanding is sufficient for this purpose</tspan><tspan x="380" dy="34.72">and can be revised in the next exchange.</tspan></text>
</svg>

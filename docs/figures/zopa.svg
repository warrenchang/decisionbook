<?xml version="1.0" encoding="utf-8" ?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink" baseProfile="full" height="650" version="1.1" viewBox="0 0 1200 650" width="1200">
  <defs/>
  <title>Zone of possible agreement</title>
  <desc>Seller reservation value at 8,000 euros and buyer reservation value at 10,000 euros create a 2,000-euro zone of possible agreement.</desc>
  <rect fill="white" height="650" width="1200" x="0" y="0"/>
  <text fill="#17324d" font-family="Arial, sans-serif" font-size="34" font-weight="bold" text-anchor="middle" x="600" y="55">The zone of possible agreement (ZOPA)</text>
  <line stroke="#17324d" stroke-width="8" x1="100" x2="1100" y1="300" y2="300"/>
  <line stroke="#17324d" stroke-width="4" x1="180" x2="180" y1="282" y2="318"/>
  <text fill="#17324d" font-family="Arial, sans-serif" font-size="20" font-weight="normal" text-anchor="middle" x="180" y="358">€7,000</text>
  <line stroke="#17324d" stroke-width="4" x1="380" x2="380" y1="282" y2="318"/>
  <text fill="#17324d" font-family="Arial, sans-serif" font-size="20" font-weight="normal" text-anchor="middle" x="380" y="358">€8,000</text>
  <line stroke="#17324d" stroke-width="4" x1="600" x2="600" y1="282" y2="318"/>
  <text fill="#17324d" font-family="Arial, sans-serif" font-size="20" font-weight="normal" text-anchor="middle" x="600" y="358">€9,000</text>
  <line stroke="#17324d" stroke-width="4" x1="820" x2="820" y1="282" y2="318"/>
  <text fill="#17324d" font-family="Arial, sans-serif" font-size="20" font-weight="normal" text-anchor="middle" x="820" y="358">€10,000</text>
  <line stroke="#17324d" stroke-width="4" x1="1020" x2="1020" y1="282" y2="318"/>
  <text fill="#17324d" font-family="Arial, sans-serif" font-size="20" font-weight="normal" text-anchor="middle" x="1020" y="358">€11,000</text>
  <rect fill="#eaf3f8" height="76" opacity="0.8" stroke="#2f6f9f" stroke-width="2" width="440" x="380" y="262"/>
  <text fill="#17324d" font-family="Arial, sans-serif" font-size="24" font-weight="bold" text-anchor="middle" x="600" y="230">Bargaining surplus = €2,000</text>
  <text fill="#c56a2d" font-family="Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="middle" x="380" y="415">Seller reservation</text>
  <text fill="#2f6f9f" font-family="Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="middle" x="820" y="415">Buyer reservation</text>
  <text fill="#66737f" font-family="Arial, sans-serif" font-size="22" font-weight="normal" text-anchor="middle" x="600" y="520">A negative ZOPA is not a failure of tactics. It is a signal to walk away or add issues.</text>
</svg>

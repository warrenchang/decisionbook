<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">The plausible path of choice architecture</title>
  <desc id="desc">A five-stage path runs from objective to menu, understanding, action, and feedback. Aligned levers beneath the path show how choice architecture changes each stage, while a governance bar applies to the full system.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 8" markerWidth="8" markerHeight="7" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0.5,0.8 L9,4 L0.5,7.2 Z" fill="#25678f"/>
    </marker>
    <filter id="shadow" x="-15%" y="-15%" width="130%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#183047" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect width="1200" height="720" fill="#ffffff"/>
  <text x="600" y="52" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="34" font-weight="700" fill="#183047">The plausible path</text>
  <text x="600" y="84" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#607080">A design is credible only when each step between feature and outcome can be explained and tested.</text>

  <!-- Straight, center-to-center connectors -->
  <g stroke="#25678f" stroke-width="4" fill="none">
    <line x1="250" y1="184" x2="277" y2="184" stroke-width="3" marker-end="url(#arrow)"/>
    <line x1="470" y1="184" x2="497" y2="184" stroke-width="3" marker-end="url(#arrow)"/>
    <line x1="690" y1="184" x2="717" y2="184" stroke-width="3" marker-end="url(#arrow)"/>
    <line x1="910" y1="184" x2="937" y2="184" stroke-width="3" marker-end="url(#arrow)"/>
  </g>

  <!-- Five evenly spaced stages -->
  <g filter="url(#shadow)" font-family="Arial, sans-serif">
    <g>
      <rect x="60" y="126" width="190" height="116" rx="16" fill="#eaf3f8" stroke="#25678f" stroke-width="3"/>
      <text x="155" y="168" text-anchor="middle" font-size="23" font-weight="700" fill="#183047">1. Objective</text>
      <text x="155" y="199" text-anchor="middle" font-size="16" fill="#536678">for whom?</text>
      <text x="155" y="221" text-anchor="middle" font-size="16" fill="#536678">whose welfare?</text>
    </g>
    <g>
      <rect x="280" y="126" width="190" height="116" rx="16" fill="#edf4ed" stroke="#447c55" stroke-width="3"/>
      <text x="375" y="168" text-anchor="middle" font-size="23" font-weight="700" fill="#183047">2. Menu</text>
      <text x="375" y="199" text-anchor="middle" font-size="16" fill="#536678">what is available,</text>
      <text x="375" y="221" text-anchor="middle" font-size="16" fill="#536678">ordered, or missing?</text>
    </g>
    <g>
      <rect x="500" y="126" width="190" height="116" rx="16" fill="#f7f1e8" stroke="#b95f2d" stroke-width="3"/>
      <text x="595" y="168" text-anchor="middle" font-size="23" font-weight="700" fill="#183047">3. Understand</text>
      <text x="595" y="199" text-anchor="middle" font-size="16" fill="#536678">can options map</text>
      <text x="595" y="221" text-anchor="middle" font-size="16" fill="#536678">to consequences?</text>
    </g>
    <g>
      <rect x="720" y="126" width="190" height="116" rx="16" fill="#f5ebf5" stroke="#795a8a" stroke-width="3"/>
      <text x="815" y="168" text-anchor="middle" font-size="23" font-weight="700" fill="#183047">4. Action</text>
      <text x="815" y="199" text-anchor="middle" font-size="16" fill="#536678">can intention survive</text>
      <text x="815" y="221" text-anchor="middle" font-size="16" fill="#536678">friction and timing?</text>
    </g>
    <g>
      <rect x="940" y="126" width="190" height="116" rx="16" fill="#eaf3f8" stroke="#25678f" stroke-width="3"/>
      <text x="1035" y="168" text-anchor="middle" font-size="23" font-weight="700" fill="#183047">5. Feedback</text>
      <text x="1035" y="199" text-anchor="middle" font-size="16" fill="#536678">can people see,</text>
      <text x="1035" y="221" text-anchor="middle" font-size="16" fill="#536678">correct, and learn?</text>
    </g>
  </g>

  <text x="60" y="302" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#607080" letter-spacing="1.2">ARCHITECTURE LEVERS</text>

  <!-- Levers align vertically with the stage they influence -->
  <g font-family="Arial, sans-serif">
    <line x1="375" y1="242" x2="375" y2="322" stroke="#447c55" stroke-width="2.5" stroke-dasharray="7 7"/>
    <line x1="595" y1="242" x2="595" y2="322" stroke="#b95f2d" stroke-width="2.5" stroke-dasharray="7 7"/>
    <line x1="815" y1="242" x2="815" y2="322" stroke="#795a8a" stroke-width="2.5" stroke-dasharray="7 7"/>
    <line x1="1035" y1="242" x2="1035" y2="322" stroke="#25678f" stroke-width="2.5" stroke-dasharray="7 7"/>

    <rect x="60" y="330" width="190" height="112" rx="14" fill="#f7f9fc" stroke="#d7e0e7" stroke-width="2"/>
    <text x="155" y="367" text-anchor="middle" font-size="19" font-weight="700" fill="#183047">Goal and scope</text>
    <text x="155" y="395" text-anchor="middle" font-size="16" fill="#607080">target • population</text>
    <text x="155" y="417" text-anchor="middle" font-size="16" fill="#607080">instrument • metric</text>

    <rect x="280" y="330" width="190" height="112" rx="14" fill="#f7f9fc" stroke="#d7e0e7" stroke-width="2"/>
    <text x="375" y="367" text-anchor="middle" font-size="19" font-weight="700" fill="#183047">Menu and start</text>
    <text x="375" y="395" text-anchor="middle" font-size="16" fill="#607080">options • categories</text>
    <text x="375" y="417" text-anchor="middle" font-size="16" fill="#607080">order • defaults</text>

    <rect x="500" y="330" width="190" height="112" rx="14" fill="#f7f9fc" stroke="#d7e0e7" stroke-width="2"/>
    <text x="595" y="367" text-anchor="middle" font-size="19" font-weight="700" fill="#183047">Meaning</text>
    <text x="595" y="395" text-anchor="middle" font-size="16" fill="#607080">mapping • metrics</text>
    <text x="595" y="417" text-anchor="middle" font-size="16" fill="#607080">frames • salience</text>

    <rect x="720" y="330" width="190" height="112" rx="14" fill="#f7f9fc" stroke="#d7e0e7" stroke-width="2"/>
    <text x="815" y="367" text-anchor="middle" font-size="19" font-weight="700" fill="#183047">Execution</text>
    <text x="815" y="395" text-anchor="middle" font-size="16" fill="#607080">friction • timing</text>
    <text x="815" y="417" text-anchor="middle" font-size="16" fill="#607080">prompts • social cues</text>

    <rect x="940" y="330" width="190" height="112" rx="14" fill="#f7f9fc" stroke="#d7e0e7" stroke-width="2"/>
    <text x="1035" y="367" text-anchor="middle" font-size="19" font-weight="700" fill="#183047">Learning</text>
    <text x="1035" y="395" text-anchor="middle" font-size="16" fill="#607080">progress • warnings</text>
    <text x="1035" y="417" text-anchor="middle" font-size="16" fill="#607080">correction • review</text>
  </g>

  <!-- Governance applies to the entire path -->
  <rect x="60" y="500" width="1070" height="128" rx="18" fill="#183047"/>
  <text x="595" y="541" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#ffffff">Govern the whole path</text>
  <g font-family="Arial, sans-serif" font-size="17" fill="#ffffff" text-anchor="middle">
    <text x="205" y="580">Whose goal?</text>
    <text x="465" y="580">What evidence?</text>
    <text x="725" y="580">Who can refuse or correct?</text>
    <text x="985" y="580">How are harms monitored?</text>
  </g>
  <g fill="#6fb3d2">
    <circle cx="205" cy="603" r="4"/><circle cx="465" cy="603" r="4"/><circle cx="725" cy="603" r="4"/><circle cx="985" cy="603" r="4"/>
  </g>
  <text x="595" y="678" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="21" font-style="italic" fill="#536678">Good architecture makes a better action easier without making the chooser disappear.</text>
</svg>

<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="755" viewBox="0 0 1200 755" role="img" aria-labelledby="title desc">
  <title id="title">Ultimatum, dictator, and take-game designs</title>
  <desc id="desc">Three cards compare the mechanics and reported patterns of ultimatum, dictator, and take or menu-variant games. The historical regularities are explicitly bounded by stakes, anonymity, entitlement, population, culture, repetition, and procedure.</desc>
  <defs>
    <marker id="blueArrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0 L12 6 L0 12 Z" fill="#2f6f9f"/></marker>
    <marker id="orangeArrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0 L12 6 L0 12 Z" fill="#c56a2d"/></marker>
    <filter id="shadow"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#17324d" flood-opacity="0.12"/></filter>
  </defs>
  <rect width="1200" height="755" fill="#ffffff"/>
<text x="600" y="48" text-anchor="middle" font-family="Georgia, serif" font-size="33" font-weight="700" fill="#17324d" >Change one rule, and the meaning of giving changes</text>
<text x="600" y="80" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#66737f" >Game design separates strategic rejection, generosity, and the permission to take.</text>
<rect x="45" y="120" width="350" height="500" rx="20" fill="#eaf3f8" stroke="#2f6f9f" stroke-width="3" filter="url(#shadow)"/>
<text x="220" y="164" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#2f6f9f" >ULTIMATUM</text>
<rect x="80" y="195" width="280" height="125" rx="14" fill="#ffffff" stroke="#2f6f9f" stroke-width="2" />
<text x="220" y="230" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#17324d" >Proposer offers a split</text>
<text x="220" y="261" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#17324d" >Responder accepts or rejects</text>
<text x="220" y="292" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#17324d" >Rejection gives both zero</text>
<text x="220" y="364" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#2f6f9f" >REPORTED PATTERN</text>
<text x="220" y="402" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#17324d" >Modal offers: 40–50%</text>
<text x="220" y="434" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#17324d" >Mean offers: 30–40%</text>
<text x="220" y="466" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#17324d" >Offers below 20%: rejected</text>
<text x="220" y="498" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#17324d" >about half the time</text>
<rect x="425" y="120" width="350" height="500" rx="20" fill="#edf4ed" stroke="#447c55" stroke-width="3" filter="url(#shadow)"/>
<text x="600" y="164" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#447c55" >DICTATOR</text>
<rect x="460" y="195" width="280" height="125" rx="14" fill="#ffffff" stroke="#447c55" stroke-width="2" />
<text x="600" y="230" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#17324d" >Allocator chooses a split</text>
<text x="600" y="261" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#17324d" >Recipient cannot reject</text>
<text x="600" y="292" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#17324d" >Strategic punishment removed</text>
<text x="600" y="364" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#447c55" >REPORTED PATTERN</text>
<text x="600" y="402" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#17324d" >Average giving about 20%</text>
<text x="600" y="434" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#17324d" >in one classic comparison</text>
<text x="600" y="466" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#17324d" >Closer to 10% under</text>
<text x="600" y="498" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#17324d" >double-blind procedures</text>
<rect x="805" y="120" width="350" height="500" rx="20" fill="#f7f1e8" stroke="#c56a2d" stroke-width="3" filter="url(#shadow)"/>
<text x="980" y="164" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#c56a2d" >TAKE / MENU VARIANTS</text>
<rect x="840" y="195" width="280" height="125" rx="14" fill="#ffffff" stroke="#c56a2d" stroke-width="2" />
<text x="980" y="230" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#17324d" >Allocator may give or take</text>
<text x="980" y="261" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#17324d" >Property rights and options vary</text>
<text x="980" y="292" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#17324d" >The action acquires new meaning</text>
<text x="980" y="364" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#c56a2d" >REPORTED PATTERN</text>
<text x="980" y="402" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#17324d" >Giving can fall when taking</text>
<text x="980" y="434" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#17324d" >or sorting out is available</text>
<text x="980" y="466" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#17324d" >Menu and observability are</text>
<text x="980" y="498" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#17324d" >part of the treatment</text>
<rect x="125" y="650" width="950" height="58" rx="14" fill="#f7fafc" stroke="#c8d7e2" stroke-width="2" />
<text x="600" y="676" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#17324d" >Historical regularities, not human constants: stakes, anonymity, entitlement, population, culture, repetition, and procedure matter.</text>
<text x="600" y="733" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="400" fill="#66737f" >Sources for the reported ranges: Forsythe et al. (1994), Hoffman et al. (1994), Camerer (2003), and Oosterbeek et al. (2004).</text>
</svg>

<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1160" viewBox="0 0 720 1160" role="img" aria-labelledby="title desc">
  <title id="title">One environment can provide different detectable cues</title>
  <desc id="desc">A shared flower is sampled differently by human and bee visual systems. Three further examples show infrared detection by pit-bearing snakes, infrasonic components in elephant calls, and geomagnetic orientation cues used by migratory birds. A boundary note distinguishes demonstrated detection and behavior from subjective experience.</desc>
  <style>
    .title{font:700 31px Arial,sans-serif;fill:#17324d}
    .subtitle{font:22px Arial,sans-serif;fill:#536879}
    .head{font:700 25px Arial,sans-serif;fill:#17324d}
    .body{font:23px Arial,sans-serif;fill:#314b60}
    .small{font:21px Arial,sans-serif;fill:#536879}
    .boundary{font:700 23px Arial,sans-serif;fill:#7a3d19}
  </style>
  <rect width="720" height="1160" fill="#ffffff"/>

  <text class="title" x="360" y="48" text-anchor="middle">One environment, different sensory access</text>
  <text class="subtitle" x="360" y="82" text-anchor="middle">The physical world contains more cues than any one organism detects.</text>

  <rect x="30" y="115" width="660" height="128" rx="22" fill="#f5f8fa" stroke="#9eb1bf" stroke-width="2.5"/>
  <text class="head" x="360" y="155" text-anchor="middle">Shared physical source: a flower reflects light</text>
  <g transform="translate(360 207) scale(0.78)">
    <circle cx="0" cy="0" r="19" fill="#e7a23c" stroke="#9b6422" stroke-width="2"/>
    <ellipse cx="0" cy="-30" rx="17" ry="28" fill="#d9b8e8" stroke="#7d5b91" stroke-width="2"/>
    <ellipse cx="29" cy="-9" rx="17" ry="28" transform="rotate(72 29 -9)" fill="#d9b8e8" stroke="#7d5b91" stroke-width="2"/>
    <ellipse cx="18" cy="25" rx="17" ry="28" transform="rotate(144 18 25)" fill="#d9b8e8" stroke="#7d5b91" stroke-width="2"/>
    <ellipse cx="-18" cy="25" rx="17" ry="28" transform="rotate(216 -18 25)" fill="#d9b8e8" stroke="#7d5b91" stroke-width="2"/>
    <ellipse cx="-29" cy="-9" rx="17" ry="28" transform="rotate(288 -29 -9)" fill="#d9b8e8" stroke="#7d5b91" stroke-width="2"/>
  </g>

  <rect x="30" y="270" width="315" height="232" rx="22" fill="#eaf3f8" stroke="#2f6f9f" stroke-width="3"/>
  <text class="head" x="188" y="315" text-anchor="middle">Human visual access</text>
  <text class="body" x="188" y="358" text-anchor="middle">
    <tspan x="188">Visible-wavelength cues</tspan>
    <tspan x="188" dy="34">can guide colour and</tspan>
    <tspan x="188" dy="34">shape judgments.</tspan>
  </text>
  <text class="small" x="188" y="474" text-anchor="middle">Ultraviolet is not seen unaided.</text>

  <rect x="375" y="270" width="315" height="232" rx="22" fill="#f1edf8" stroke="#765b9c" stroke-width="3"/>
  <text class="head" x="532" y="315" text-anchor="middle">Bee visual access</text>
  <text class="body" x="532" y="358" text-anchor="middle">
    <tspan x="532">Ultraviolet-sensitive</tspan>
    <tspan x="532" dy="34">receptors make additional</tspan>
    <tspan x="532" dy="34">spectral contrast available.</tspan>
  </text>
  <text class="small" x="532" y="458" text-anchor="middle">Same reflectance;</text>
  <text class="small" x="532" y="485" text-anchor="middle">different sensory access.</text>

  <text class="head" x="360" y="555" text-anchor="middle">Other well-established forms of sensory access</text>

  <rect x="30" y="585" width="660" height="125" rx="20" fill="#f7f1e8" stroke="#c56a2d" stroke-width="2.5"/>
  <text class="head" x="65" y="625">Infrared cues</text>
  <text class="body" x="65" y="663">Pit-bearing snakes transduce radiant heating</text>
  <text class="body" x="65" y="696">from infrared signals in specialized facial pits.</text>

  <rect x="30" y="730" width="660" height="125" rx="20" fill="#eef6ef" stroke="#43825a" stroke-width="2.5"/>
  <text class="head" x="65" y="770">Infrasonic components</text>
  <text class="body" x="65" y="808">Some elephant calls include frequencies below</text>
  <text class="body" x="65" y="841">the usual lower limit of human hearing.</text>

  <rect x="30" y="875" width="660" height="125" rx="20" fill="#edf4f8" stroke="#4f748f" stroke-width="2.5"/>
  <text class="head" x="65" y="915">Geomagnetic cues</text>
  <text class="body" x="65" y="953">Behavioral studies show that migratory birds use</text>
  <text class="body" x="65" y="986">geomagnetic information for orientation.</text>

  <rect x="30" y="1025" width="660" height="105" rx="20" fill="#fff5ec" stroke="#d17b36" stroke-width="2.5"/>
  <text class="boundary" x="360" y="1062" text-anchor="middle">Evidence boundary</text>
  <text class="small" x="360" y="1096" text-anchor="middle">Detection and behavior do not reveal what a cue feels like</text>
  <text class="small" x="360" y="1122" text-anchor="middle">subjectively—and sensory access is not the same as attention.</text>
</svg>

<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" baseProfile="full" height="650" version="1.1" viewBox="0 0 1200 650" width="1200">
  <defs />
  <title>Predictive inference</title>
  <desc>An internal model generates predictions; sensory evidence produces prediction error; precision weights the balance; action and learning update the model.</desc>
  <rect fill="white" height="650" width="1200" x="0" y="0" />
  <text fill="#17324d" font-family="Arial, sans-serif" font-size="34" font-weight="bold" text-anchor="middle" x="600" y="48">Predictive inference and active learning</text>
  <rect fill="#eaf3f8" height="125" rx="16" ry="16" stroke="#2f6f9f" stroke-width="3" width="230" x="80" y="210" />
  <text fill="#17324d" font-family="Arial, sans-serif" font-size="26" font-weight="bold" text-anchor="middle" x="195" y="256.44"><tspan x="195" dy="0">Internal model</tspan></text>
  <text fill="#66737f" font-family="Arial, sans-serif" font-size="17" font-weight="normal" text-anchor="middle" x="195" y="284.56"><tspan x="195" dy="0">priors • goals •</tspan><tspan x="195" dy="20.06">causal beliefs</tspan></text>
  <rect fill="#eaf3f8" height="120" rx="16" ry="16" stroke="#2f6f9f" stroke-width="3" width="230" x="485" y="95" />
  <text fill="#17324d" font-family="Arial, sans-serif" font-size="26" font-weight="bold" text-anchor="middle" x="600" y="138.94"><tspan x="600" dy="0">Predictions</tspan></text>
  <text fill="#66737f" font-family="Arial, sans-serif" font-size="17" font-weight="normal" text-anchor="middle" x="600" y="167.06"><tspan x="600" dy="0">expected sensations +</tspan><tspan x="600" dy="20.06">outcomes</tspan></text>
  <rect fill="#f7f1e8" height="120" rx="16" ry="16" stroke="#c56a2d" stroke-width="3" width="230" x="485" y="390" />
  <text fill="#17324d" font-family="Arial, sans-serif" font-size="24.91" font-weight="bold" text-anchor="middle" x="600" y="419.921"><tspan x="600" dy="0">Sensory</tspan><tspan x="600" dy="29.3892">evidence</tspan></text>
  <text fill="#66737f" font-family="Arial, sans-serif" font-size="16.28" font-weight="normal" text-anchor="middle" x="600" y="476.458"><tspan x="600" dy="0">observations +</tspan><tspan x="600" dy="19.216">feedback</tspan></text>
  <rect fill="#eaf3f8" height="125" rx="16" ry="16" stroke="#2f6f9f" stroke-width="3" width="230" x="890" y="210" />
  <text fill="#17324d" font-family="Arial, sans-serif" font-size="26" font-weight="bold" text-anchor="middle" x="1005" y="241.1"><tspan x="1005" dy="0">Perception +</tspan><tspan x="1005" dy="30.68">action</tspan></text>
  <text fill="#66737f" font-family="Arial, sans-serif" font-size="17" font-weight="normal" text-anchor="middle" x="1005" y="299.9"><tspan x="1005" dy="0">best current</tspan><tspan x="1005" dy="20.06">inference</tspan></text>
  <line stroke="#17324d" stroke-width="4" x1="310" x2="485" y1="250" y2="155" />
  <polygon fill="#17324d" points="485,155 477.1615480013974,167.78900583570135 470.0051700578339,154.60620436071594" />
  <line stroke="#c56a2d" stroke-width="4" x1="310" x2="485" y1="295" y2="450" />

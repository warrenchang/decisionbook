  <line stroke="#c56a2d" stroke-width="4" x1="715" x2="890" y1="450" y2="295" />
  <polygon fill="#c56a2d" points="890,295 885.2483186246809,309.2274918417635 875.3027899452375,297.998669139166" />
  <rect fill="white" height="90" rx="16" ry="16" stroke="#2b7a78" stroke-width="3" width="250" x="475" y="250" />
  <text fill="#17324d" font-family="Arial, sans-serif" font-size="18.72" font-weight="bold" text-anchor="middle" x="600" y="274.725"><tspan x="600" dy="0">Prediction</tspan><tspan x="600" dy="22.0896">error</tspan></text>
  <text fill="#66737f" font-family="Arial, sans-serif" font-size="12.24" font-weight="normal" text-anchor="middle" x="600" y="314.461"><tspan x="600" dy="0">mismatch weighted by</tspan><tspan x="600" dy="14.4432">precision</tspan></text>

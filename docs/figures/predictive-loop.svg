  <polygon fill="#2b7a78" points="600,340 607.5,352.9903810567666 592.5,352.9903810567666" />
  <line stroke="#2b7a78" stroke-width="4" x1="890" x2="310" y1="335" y2="335" />
  <polygon fill="#2b7a78" points="310,335 322.9903810567666,327.5 322.9903810567666,342.5" />
  <text fill="#66737f" font-family="Arial, sans-serif" font-size="21" font-weight="normal" text-anchor="middle" x="600" y="595">Repeated, credible mismatch changes the model; action can also change the evidence received.</text>

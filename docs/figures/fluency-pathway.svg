<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" baseProfile="full" height="650" version="1.1" viewBox="0 0 1200 650" width="1200">
  <defs />
  <title>Processing fluency pathway</title>
  <desc>Repetition, clarity, familiarity, and pronunciation increase processing ease, which can be misattributed to truth, liking, safety, and confidence. An evidence check separates ease from validity.</desc>
  <rect fill="white" height="650" width="1200" x="0" y="0" />
  <text fill="#17324d" font-family="Arial, sans-serif" font-size="34" font-weight="bold" text-anchor="middle" x="600" y="48">The mind often treats ease as evidence</text>

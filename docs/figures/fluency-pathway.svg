  <text fill="#17324d" font-family="Arial, sans-serif" font-size="22" font-weight="bold" text-anchor="middle" x="557.5" y="191.5"><tspan x="557.5" dy="0">familiarity</tspan></text>
  <line stroke="#17324d" stroke-width="2" x1="557" x2="600" y1="225" y2="305" />
  <polygon fill="#17324d" points="600,305 587.2436105706678,297.10857878913936 600.4559765259025,290.0069320882007" />
  <rect fill="#eaf3f8" height="80" rx="16" ry="16" stroke="#2f6f9f" stroke-width="3" width="165" x="665" y="145" />
  <text fill="#17324d" font-family="Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="middle" x="747.5" y="181"><tspan x="747.5" dy="0">pronounce-</tspan><tspan x="747.5" dy="24">ability</tspan></text>
  <line stroke="#17324d" stroke-width="2" x1="747" x2="600" y1="225" y2="305" />
  <polygon fill="#17324d" points="600,305 607.8250158688252,292.20276878959226 614.9952352607288,305.3780469222151" />
  <rect fill="#f7f1e8" height="120" rx="16" ry="16" stroke="#c56a2d" stroke-width="3" width="230" x="485" y="270" />
  <text fill="#17324d" font-family="Arial, sans-serif" font-size="24.91" font-weight="bold" text-anchor="middle" x="600" y="299.921"><tspan x="600" dy="0">Processing</tspan><tspan x="600" dy="29.3892">ease</tspan></text>
  <text fill="#66737f" font-family="Arial, sans-serif" font-size="16.28" font-weight="normal" text-anchor="middle" x="600" y="356.458"><tspan x="600" dy="0">smooth • familiar •</tspan><tspan x="600" dy="19.216">coherent</tspan></text>
  <rect fill="#f9e7e7" height="80" rx="16" ry="16" stroke="#a74343" stroke-width="3" width="145" x="825" y="145" />
  <text fill="#17324d" font-family="Arial, sans-serif" font-size="26" font-weight="bold" text-anchor="middle" x="897.5" y="191.5"><tspan x="897.5" dy="0">truth</tspan></text>
  <line stroke="#c56a2d" stroke-width="2" x1="715" x2="825" y1="330" y2="185" />
  <polygon fill="#c56a2d" points="825,185 823.1239738331583,199.88222180392853 811.1736047696224,190.81642458331504" />

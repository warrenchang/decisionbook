<?xml version="1.0" encoding="utf-8" ?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink" baseProfile="full" height="650" version="1.1" viewBox="0 0 1200 650" width="1200">
  <defs/>
  <title>Behavior design stack</title>
  <desc>Behavior is supported by motivation, ability and prompt, with upstream tools: environment, friction, plans, social support, and recovery.</desc>
  <rect fill="white" height="650" width="1200" x="0" y="0"/>
  <text fill="#17324d" font-family="Arial, sans-serif" font-size="34" font-weight="bold" text-anchor="middle" x="600" y="48">Design behavior upstream of the moment of temptation</text>
  <rect fill="#eaf3f8" height="75" rx="16" ry="16" stroke="#2f6f9f" stroke-width="3" width="960" x="120" y="500"/>
  <text fill="#17324d" font-family="Arial, sans-serif" font-size="26" font-weight="bold" text-anchor="middle" x="600.0" y="529.5">5. Recovery</text>
  <text fill="#66737f" font-family="Arial, sans-serif" font-size="17" font-weight="normal" text-anchor="middle" x="600.0" y="563.5">relapse plan • restart at next cue</text>
  <rect fill="#eaf3f8" height="75" rx="16" ry="16" stroke="#2f6f9f" stroke-width="3" width="840" x="180" y="405"/>
  <text fill="#17324d" font-family="Arial, sans-serif" font-size="26" font-weight="bold" text-anchor="middle" x="600.0" y="434.5">4. Prompt</text>
  <text fill="#66737f" font-family="Arial, sans-serif" font-size="17" font-weight="normal" text-anchor="middle" x="600.0" y="468.5">visible cue at the right moment</text>
  <rect fill="#edf4ed" height="75" rx="16" ry="16" stroke="#447c55" stroke-width="3" width="720" x="240" y="310"/>
  <text fill="#17324d" font-family="Arial, sans-serif" font-size="26" font-weight="bold" text-anchor="middle" x="600.0" y="339.5">3. Ability</text>
  <text fill="#66737f" font-family="Arial, sans-serif" font-size="17" font-weight="normal" text-anchor="middle" x="600.0" y="373.5">reduce friction • smallest viable action</text>
  <rect fill="#f7f1e8" height="75" rx="16" ry="16" stroke="#c56a2d" stroke-width="3" width="600" x="300" y="215"/>
  <text fill="#17324d" font-family="Arial, sans-serif" font-size="26" font-weight="bold" text-anchor="middle" x="600.0" y="244.5">2. Motivation</text>
  <text fill="#66737f" font-family="Arial, sans-serif" font-size="17" font-weight="normal" text-anchor="middle" x="600.0" y="278.5">meaning • immediate reward • commitment</text>
  <rect fill="#f5ebf5" height="75" rx="16" ry="16" stroke="#795a8a" stroke-width="3" width="480" x="360" y="120"/>
  <text fill="#17324d" font-family="Arial, sans-serif" font-size="26" font-weight="bold" text-anchor="middle" x="600.0" y="149.5">1. Environment</text>
  <text fill="#66737f" font-family="Arial, sans-serif" font-size="17" font-weight="normal" text-anchor="middle" x="600.0" y="183.5">availability • defaults • social context</text>
  <text fill="#66737f" font-family="Arial, sans-serif" font-size="22" font-weight="normal" text-anchor="middle" x="600" y="610">The most reliable intervention is often the one that requires the least heroism.</text>
</svg>

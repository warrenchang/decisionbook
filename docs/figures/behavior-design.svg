<svg xmlns="http://www.w3.org/2000/svg" width="760" height="930" viewBox="0 0 760 930" role="img" aria-labelledby="title desc">
<title id="title">Change one thing, then learn</title><desc id="desc">A practical workflow defines an observable action, finds an obstacle, changes one condition, tries and measures the change, and reviews the results. Feedback returns the review to diagnosis. After a lapse or harm, recovery and support may require a different goal or design.</desc>
<rect width="760" height="930" fill="white"/>
<defs>
<marker id="a" viewBox="0 0 12 10" markerWidth="9" markerHeight="8" refX="11" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L11 5 L1 9 Z" fill="#2f6f9f"/></marker>
<marker id="g" viewBox="0 0 12 10" markerWidth="9" markerHeight="8" refX="11" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L11 5 L1 9 Z" fill="#3f7c59"/></marker>
<marker id="o" viewBox="0 0 12 10" markerWidth="9" markerHeight="8" refX="11" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L11 5 L1 9 Z" fill="#b95f2d"/></marker>
</defs>
<text x="380" y="48" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="700" fill="#17324d">Change one thing, then learn</text>
<rect x="96" y="105" width="620" height="102" rx="18" fill="#f3f6f9" stroke="#53697d" stroke-width="2.5"/>
<text x="406" y="144" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#17324d">1  Define the action</text>
<text x="406" y="182" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="400" fill="#53697d">What would someone actually do?</text>
<path d="M406 207 V245" fill="none" stroke="#2f6f9f" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#a)"/>
<rect x="96" y="245" width="620" height="102" rx="18" fill="#edf5fa" stroke="#2f6f9f" stroke-width="2.5"/>
<text x="406" y="284" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#17324d">2  Find the obstacle</text>
<text x="406" y="322" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="400" fill="#53697d">What makes that action difficult?</text>
<path d="M406 347 V385" fill="none" stroke="#2f6f9f" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#a)"/>
<rect x="96" y="385" width="620" height="102" rx="18" fill="#fff5ec" stroke="#b95f2d" stroke-width="2.5"/>
<text x="406" y="424" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#17324d">3  Change one condition</text>
<text x="406" y="462" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="400" fill="#53697d">Choose a plausible cue, support, or plan.</text>
<path d="M406 487 V525" fill="none" stroke="#2f6f9f" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#a)"/>
<rect x="96" y="525" width="620" height="102" rx="18" fill="#f3f6f9" stroke="#53697d" stroke-width="2.5"/>
<text x="406" y="564" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#17324d">4  Try and measure</text>
<text x="406" y="602" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="400" fill="#53697d">Record the action, outcome, and harms.</text>
<path d="M406 627 V665" fill="none" stroke="#2f6f9f" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#a)"/>
<rect x="96" y="665" width="620" height="102" rx="18" fill="#edf7ef" stroke="#3f7c59" stroke-width="2.5"/>
<text x="406" y="704" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#17324d">5  Review the result</text>
<text x="406" y="742" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="400" fill="#53697d">Compare; keep, revise, or stop the change.</text>
<path d="M96 716 H35 V296 H96" fill="none" stroke="#3f7c59" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#g)"/>
<text x="380" y="818" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#3f7c59">Results can change the diagnosis.</text>
<text x="380" y="866" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="400" fill="#53697d">After a lapse or harm, recover and seek support</text>
<text x="380" y="902.4" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="400" fill="#53697d">as needed; reconsider the goal or conditions.</text>
</svg>

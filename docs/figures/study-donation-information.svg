<svg role="img" aria-labelledby="title desc" xmlns:xlink="http://www.w3.org/1999/xlink" width="489.6pt" height="410.4pt" viewBox="0 0 489.6 410.4" xmlns="http://www.w3.org/2000/svg" version="1.1">
<title id="title">Adding statistics can reduce giving to an identifiable child</title><desc id="desc">In Study 3 of Small and colleagues (2007), 159 participants could donate from a five-dollar payment. Mean donations were $2.38 with an identifiable child, $1.14 with statistical information, and $1.43 with both. The child-only condition exceeded both others; the two lower means were not statistically distinguished. These are donation amounts, not measures of informed allocation quality.</desc>


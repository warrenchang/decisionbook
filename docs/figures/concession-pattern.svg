<?xml version="1.0" encoding="utf-8" ?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink" baseProfile="full" height="650" version="1.1" viewBox="0 0 1200 650" width="1200">
  <defs/>
  <title>Concession pattern</title>
  <desc>A disciplined concession pattern moves in diminishing, conditional steps. Equal or unilateral concessions signal room to continue and give away information about limits.</desc>
  <rect fill="white" height="650" width="1200" x="0" y="0"/>
  <text fill="#17324d" font-family="Arial, sans-serif" font-size="34" font-weight="bold" text-anchor="middle" x="600" y="48">Concessions communicate as much as offers</text>
  <rect fill="#eaf3f8" height="110" rx="16" ry="16" stroke="#2f6f9f" stroke-width="3" width="170" x="120" y="225"/>
  <text fill="#17324d" font-family="Arial, sans-serif" font-size="26" font-weight="bold" text-anchor="middle" x="205.0" y="272.0">Opening</text>
  <text fill="#66737f" font-family="Arial, sans-serif" font-size="17" font-weight="normal" text-anchor="middle" x="205.0" y="306.0">offer index 100</text>
  <rect fill="#eaf3f8" height="110" rx="16" ry="16" stroke="#2f6f9f" stroke-width="3" width="170" x="360" y="225"/>
  <text fill="#17324d" font-family="Arial, sans-serif" font-size="26" font-weight="bold" text-anchor="middle" x="445.0" y="272.0">Move 1</text>
  <text fill="#66737f" font-family="Arial, sans-serif" font-size="17" font-weight="normal" text-anchor="middle" x="445.0" y="306.0">offer index 92</text>
  <rect fill="#f7f1e8" height="110" rx="16" ry="16" stroke="#c56a2d" stroke-width="3" width="170" x="600" y="225"/>
  <text fill="#17324d" font-family="Arial, sans-serif" font-size="26" font-weight="bold" text-anchor="middle" x="685.0" y="272.0">Move 2</text>
  <text fill="#66737f" font-family="Arial, sans-serif" font-size="17" font-weight="normal" text-anchor="middle" x="685.0" y="306.0">offer index 88</text>
  <rect fill="#f7f1e8" height="110" rx="16" ry="16" stroke="#c56a2d" stroke-width="3" width="170" x="840" y="225"/>
  <text fill="#17324d" font-family="Arial, sans-serif" font-size="26" font-weight="bold" text-anchor="middle" x="925.0" y="272.0">Move 3</text>
  <text fill="#66737f" font-family="Arial, sans-serif" font-size="17" font-weight="normal" text-anchor="middle" x="925.0" y="306.0">offer index 86</text>
  <line stroke="#2b7a78" stroke-width="4" x1="290" x2="360" y1="280" y2="280"/>
  <polygon fill="#2b7a78" points="360,280 347.0096189432334,287.5 347.0096189432334,272.5"/>
  <text fill="#2b7a78" font-family="Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="middle" x="325.0" y="255">−8</text>
  <line stroke="#2b7a78" stroke-width="4" x1="530" x2="600" y1="280" y2="280"/>
  <polygon fill="#2b7a78" points="600,280 587.0096189432334,287.5 587.0096189432334,272.5"/>
  <text fill="#2b7a78" font-family="Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="middle" x="565.0" y="255">−4</text>
  <line stroke="#2b7a78" stroke-width="4" x1="770" x2="840" y1="280" y2="280"/>
  <polygon fill="#2b7a78" points="840,280 827.0096189432334,287.5 827.0096189432334,272.5"/>
  <text fill="#2b7a78" font-family="Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="middle" x="805.0" y="255">−2</text>
  <rect fill="#edf4ed" height="105" rx="16" ry="16" stroke="#447c55" stroke-width="3" width="430" x="385" y="440"/>
  <text fill="#17324d" font-family="Arial, sans-serif" font-size="26" font-weight="bold" text-anchor="middle" x="600.0" y="484.5">Each move should be conditional</text>
  <text fill="#66737f" font-family="Arial, sans-serif" font-size="17" font-weight="normal" text-anchor="middle" x="600.0" y="518.5">“If you can move on X, I can move on Y.”</text>
  <text fill="#66737f" font-family="Arial, sans-serif" font-size="21" font-weight="normal" text-anchor="middle" x="600" y="590">Shrinking steps signal a limit. Repeated equal concessions invite the other side to wait for more.</text>
</svg>

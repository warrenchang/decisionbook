    <!-- Split the bold B immediately after its stem; both rows reuse this exact glyph. -->
    <clipPath id="stem-separation" clipPathUnits="userSpaceOnUse">
      <rect x="-1" y="-75" width="17.1152" height="80"/>
      <rect x="18.7152" y="-75" width="45" height="80"/>

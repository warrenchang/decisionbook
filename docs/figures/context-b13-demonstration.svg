  <rect width="1200" height="720" fill="#ffffff"/>

  <text class="figure-title" x="600" y="58" text-anchor="middle">One mark, two readings</text>
  <text class="subtitle" x="600" y="92" text-anchor="middle">Read the middle mark in each row before comparing them.</text>

  <!-- Number-context row -->
  <rect x="90" y="130" width="1020" height="210" rx="24"
        fill="#f5f9fb" stroke="#c9d6df" stroke-width="2"/>
  <text class="context-label" x="135" y="177">NUMBER CONTEXT</text>
  <line x1="135" y1="194" x2="1065" y2="194" stroke="#d9e3ea" stroke-width="2"/>

  <rect x="530" y="205" width="140" height="118" rx="18"
        fill="#fff4dc" stroke="#d89b3c" stroke-width="2.5"/>
  <use class="sequence" href="#glyph-12" transform="translate(378.8447 295)"/>
  <use class="sequence" href="#ambiguous-mark" transform="translate(573.2798 295)"/>
  <use class="sequence" href="#glyph-14" transform="translate(738.8447 295)"/>

  <!-- Letter-context row -->
  <rect x="90" y="370" width="1020" height="210" rx="24"
        fill="#f3f8f6" stroke="#c7d9d1" stroke-width="2"/>
  <text class="context-label" x="135" y="417">LETTER CONTEXT</text>
  <line x1="135" y1="434" x2="1065" y2="434" stroke="#d5e2dd" stroke-width="2"/>

  <rect x="530" y="445" width="140" height="118" rx="18"
        fill="#fff4dc" stroke="#d89b3c" stroke-width="2.5"/>
  <use class="sequence" href="#glyph-A" transform="translate(393.2798 535)"/>
  <use class="sequence" href="#ambiguous-mark" transform="translate(573.2798 535)"/>
  <use class="sequence" href="#glyph-C" transform="translate(753.2798 535)"/>

  <rect x="415" y="602" width="370" height="38" rx="19" fill="#fff4dc" stroke="#d89b3c" stroke-width="2"/>
  <text class="same-label" x="600" y="627" text-anchor="middle">IDENTICAL VECTOR MARK</text>

  <text class="takeaway" x="600" y="684" text-anchor="middle">Context changes the most plausible interpretation.</text>

</svg>

<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">Question wording changed speed estimates and later memory reports</title>
  <desc id="desc">An original two-panel chart redraws Loftus and Palmer's 1974 findings. Stronger collision verbs increased mean speed estimates. One week later, the smashed group more often reported nonexistent broken glass than hit or control groups.</desc>
  <rect width="1200" height="700" fill="#ffffff"/>
  <text x="600" y="48" text-anchor="middle" font-family="Arial, sans-serif" font-size="33" font-weight="700" fill="#17324d">A question can add information to the memory it asks about</text>
  <text x="600" y="80" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#66737f">Original redraw of Loftus and Palmer (1974)</text>

  <rect x="40" y="112" width="700" height="520" rx="18" fill="#f7fafc" stroke="#c8d7e2" stroke-width="2"/>
  <text x="390" y="151" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#17324d">Experiment 1: estimated speed by verb</text>
  <text x="390" y="178" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#66737f">Mean miles per hour after watching the same accident films</text>
  <line x1="112" y1="520" x2="700" y2="520" stroke="#8fa0ad" stroke-width="2"/>
  <line x1="112" y1="220" x2="112" y2="520" stroke="#8fa0ad" stroke-width="2"/>
  <g font-family="Arial, sans-serif" font-size="16" fill="#66737f">
    <line x1="112" y1="460" x2="700" y2="460" stroke="#dce5ea"/><text x="98" y="465" text-anchor="end">10</text>
    <line x1="112" y1="400" x2="700" y2="400" stroke="#dce5ea"/><text x="98" y="405" text-anchor="end">20</text>
    <line x1="112" y1="340" x2="700" y2="340" stroke="#dce5ea"/><text x="98" y="345" text-anchor="end">30</text>
    <line x1="112" y1="280" x2="700" y2="280" stroke="#dce5ea"/><text x="98" y="285" text-anchor="end">40</text>
    <line x1="112" y1="220" x2="700" y2="220" stroke="#dce5ea"/><text x="98" y="225" text-anchor="end">50</text>
  </g>
  <g font-family="Arial, sans-serif">
    <rect x="145" y="275" width="72" height="245" rx="7" fill="#a74343"/><text x="181" y="264" text-anchor="middle" font-size="17" font-weight="700" fill="#17324d">40.8</text><text x="181" y="550" text-anchor="middle" font-size="16" fill="#17324d">smashed</text>
    <rect x="260" y="284" width="72" height="236" rx="7" fill="#c56a2d"/><text x="296" y="273" text-anchor="middle" font-size="17" font-weight="700" fill="#17324d">39.3</text><text x="296" y="550" text-anchor="middle" font-size="16" fill="#17324d">collided</text>
    <rect x="375" y="291" width="72" height="229" rx="7" fill="#d8a66e"/><text x="411" y="280" text-anchor="middle" font-size="17" font-weight="700" fill="#17324d">38.1</text><text x="411" y="550" text-anchor="middle" font-size="16" fill="#17324d">bumped</text>
    <rect x="490" y="316" width="72" height="204" rx="7" fill="#7fb5c8"/><text x="526" y="305" text-anchor="middle" font-size="17" font-weight="700" fill="#17324d">34.0</text><text x="526" y="550" text-anchor="middle" font-size="16" fill="#17324d">hit</text>
    <rect x="605" y="329" width="72" height="191" rx="7" fill="#c7d7e2" stroke="#2f6f9f" stroke-width="2"/><text x="641" y="318" text-anchor="middle" font-size="17" font-weight="700" fill="#17324d">31.8</text><text x="641" y="550" text-anchor="middle" font-size="16" fill="#17324d">contacted</text>
  </g>
  <text x="390" y="594" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#17324d">Stronger wording → higher estimated speed</text>

  <rect x="770" y="112" width="390" height="520" rx="18" fill="#f7f1e8" stroke="#c56a2d" stroke-width="2"/>
  <text x="965" y="151" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#17324d">Experiment 2: “broken glass”</text>
  <text x="965" y="178" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#66737f">Percentage answering “yes” one week later</text>
  <line x1="835" y1="520" x2="1120" y2="520" stroke="#8fa0ad" stroke-width="2"/>
  <line x1="835" y1="230" x2="835" y2="520" stroke="#8fa0ad" stroke-width="2"/>
  <g font-family="Arial, sans-serif" font-size="16" fill="#66737f">
    <line x1="835" y1="447.5" x2="1120" y2="447.5" stroke="#eadfce"/><text x="821" y="452.5" text-anchor="end">10%</text>
    <line x1="835" y1="375" x2="1120" y2="375" stroke="#eadfce"/><text x="821" y="380" text-anchor="end">20%</text>
    <line x1="835" y1="302.5" x2="1120" y2="302.5" stroke="#eadfce"/><text x="821" y="307.5" text-anchor="end">30%</text>
    <line x1="835" y1="230" x2="1120" y2="230" stroke="#eadfce"/><text x="821" y="235" text-anchor="end">40%</text>
  </g>
  <rect x="865" y="288" width="65" height="232" rx="7" fill="#a74343"/><text x="897.5" y="277" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#17324d">32%</text><text x="897.5" y="550" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#17324d">smashed</text>
  <rect x="960" y="418.5" width="65" height="101.5" rx="7" fill="#7fb5c8"/><text x="992.5" y="407.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#17324d">14%</text><text x="992.5" y="550" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#17324d">hit</text>
  <rect x="1055" y="433" width="65" height="87" rx="7" fill="#c7d7e2" stroke="#2f6f9f" stroke-width="2"/><text x="1087.5" y="422" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#17324d">12%</text><text x="1087.5" y="550" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#17324d">control</text>
  <rect x="815" y="568" width="300" height="50" rx="10" fill="#f9e7e7" stroke="#a74343" stroke-width="2"/>
  <text x="965" y="589" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#17324d">
    <tspan x="965">No broken glass appeared</tspan>
    <tspan x="965" dy="18">in the films.</tspan>
  </text>
  <text x="600" y="676" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#66737f">Data source: Loftus &amp; Palmer (1974). Graphic design and annotations are original to this book.</text>
</svg>

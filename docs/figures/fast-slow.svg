<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" baseProfile="full" height="650" version="1.1" viewBox="0 0 1200 650" width="1200">
  <defs />
  <title>Fast and reflective processing</title>
  <desc>Automatic processing generates impressions; reflective processing can inspect, redirect, and train it.</desc>
  <rect fill="white" height="650" width="1200" x="0" y="0" />
  <text fill="#17324d" font-family="Arial, sans-serif" font-size="34" font-weight="bold" text-anchor="middle" x="600" y="55">Fast answers and slow inspection</text>
  <rect fill="#eaf3f8" height="260" rx="16" ry="16" stroke="#2f6f9f" stroke-width="3" width="400" x="80" y="150" />
  <text fill="#17324d" font-family="Arial, sans-serif" font-size="26" font-weight="bold" text-anchor="middle" x="280" y="223.99"><tspan x="280" dy="0">Automatic processing</tspan></text>
  <text fill="#66737f" font-family="Arial, sans-serif" font-size="17" font-weight="normal" text-anchor="middle" x="280" y="252.11"><tspan x="280" dy="0">fast • associative • practiced</tspan></text>
  <text fill="#17324d" font-family="Arial, sans-serif" font-size="26" font-weight="bold" text-anchor="middle" x="280" y="284.73"><tspan x="280" dy="0">impressions</tspan></text>
  <text fill="#17324d" font-family="Arial, sans-serif" font-size="23" font-weight="normal" text-anchor="middle" x="280" y="317.89"><tspan x="280" dy="0">pattern recognition</tspan></text>
  <text fill="#17324d" font-family="Arial, sans-serif" font-size="23" font-weight="normal" text-anchor="middle" x="280" y="350.03"><tspan x="280" dy="0">action tendencies</tspan></text>
  <rect fill="#f7f1e8" height="260" rx="16" ry="16" stroke="#c56a2d" stroke-width="3" width="400" x="720" y="150" />
  <text fill="#17324d" font-family="Arial, sans-serif" font-size="26" font-weight="bold" text-anchor="middle" x="920" y="223.99"><tspan x="920" dy="0">Reflective processing</tspan></text>
  <text fill="#66737f" font-family="Arial, sans-serif" font-size="17" font-weight="normal" text-anchor="middle" x="920" y="252.11"><tspan x="920" dy="0">effortful • rule-guided • limited</tspan></text>
  <text fill="#17324d" font-family="Arial, sans-serif" font-size="26" font-weight="bold" text-anchor="middle" x="920" y="284.73"><tspan x="920" dy="0">inspection</tspan></text>
  <text fill="#17324d" font-family="Arial, sans-serif" font-size="23" font-weight="normal" text-anchor="middle" x="920" y="317.89"><tspan x="920" dy="0">simulation + comparison</tspan></text>
  <text fill="#17324d" font-family="Arial, sans-serif" font-size="23" font-weight="normal" text-anchor="middle" x="920" y="350.03"><tspan x="920" dy="0">inhibition + redesign</tspan></text>
  <line stroke="#17324d" stroke-width="4" x1="480" x2="720" y1="250" y2="250" />
  <polygon fill="#17324d" points="720,250 707.0096189432334,257.5 707.0096189432334,242.5" />
  <line stroke="#c56a2d" stroke-width="4" x1="720" x2="480" y1="340" y2="340" />
  <polygon fill="#c56a2d" points="480,340 492.9903810567666,332.5 492.9903810567666,347.5" />
  <text fill="#17324d" font-family="Arial, sans-serif" font-size="23" font-weight="normal" text-anchor="middle" x="600" y="500">Practice can make slow skills fast; reflection can redirect attention and train intuition.</text>
  <text fill="#66737f" font-family="Arial, sans-serif" font-size="20" font-weight="normal" text-anchor="middle" x="600" y="555">Neither mode is always rational. Reliability depends on the task, environment, and feedback.</text>
</svg>
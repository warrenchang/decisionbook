<svg xmlns="http://www.w3.org/2000/svg" width="760" height="675" viewBox="0 0 760 675" role="img" aria-labelledby="title desc">
<title id="title">When confidence makes Stag the better response</title>
<desc id="desc">Expected payoffs from the illustrative stag-hunt matrix. The horizontal axis is the believed probability that the other player chooses Stag. Stag increases linearly from 2 to 15; Hare remains at 10. The curves cross at 8/13, about 61.5 percent. These are calculated utility payoffs, not measured behavior.</desc>
<style>text{font-family:Arial,Helvetica,sans-serif}</style>
<rect width="760" height="675" fill="white"/>
<line x1="140" y1="520" x2="690" y2="520" stroke="#dce3e8" stroke-width="1.5" stroke-linecap="round" />
<text x="119" y="530" font-size="28" fill="#536879" text-anchor="end" font-weight="400" >0</text>
<line x1="140" y1="379.375" x2="690" y2="379.375" stroke="#dce3e8" stroke-width="1.5" stroke-linecap="round" />
<text x="119" y="389.375" font-size="28" fill="#536879" text-anchor="end" font-weight="400" >5</text>
<line x1="140" y1="238.75" x2="690" y2="238.75" stroke="#dce3e8" stroke-width="1.5" stroke-linecap="round" />
<text x="119" y="248.75" font-size="28" fill="#536879" text-anchor="end" font-weight="400" >10</text>
<line x1="140" y1="98.125" x2="690" y2="98.125" stroke="#dce3e8" stroke-width="1.5" stroke-linecap="round" />
<text x="119" y="108.125" font-size="28" fill="#536879" text-anchor="end" font-weight="400" >15</text>
<line x1="140" y1="70" x2="140" y2="520" stroke="#536879" stroke-width="2" stroke-linecap="round" />
<line x1="140" y1="520" x2="690" y2="520" stroke="#536879" stroke-width="2" stroke-linecap="round" />
<line x1="140" y1="520" x2="140" y2="528" stroke="#536879" stroke-width="2" stroke-linecap="round" />
<text x="140" y="562" font-size="28" fill="#536879" text-anchor="middle" font-weight="400" >0%</text>
<line x1="415" y1="520" x2="415" y2="528" stroke="#536879" stroke-width="2" stroke-linecap="round" />
<text x="415" y="562" font-size="28" fill="#536879" text-anchor="middle" font-weight="400" >50%</text>
<line x1="690" y1="520" x2="690" y2="528" stroke="#536879" stroke-width="2" stroke-linecap="round" />
<text x="690" y="562" font-size="28" fill="#536879" text-anchor="middle" font-weight="400" >100%</text>
<line x1="478.462" y1="238.75" x2="478.462" y2="520" stroke="#536879" stroke-width="2" stroke-linecap="round" stroke-dasharray="6 7"/>
<line x1="140" y1="238.75" x2="690" y2="238.75" stroke="#254f77" stroke-width="5" stroke-linecap="round" stroke-dasharray="12 9"/>
<line x1="140" y1="463.75" x2="690" y2="98.125" stroke="#087e8b" stroke-width="5" stroke-linecap="round" />
<circle cx="478.462" cy="238.75" r="7" fill="white" stroke="#183047" stroke-width="3"/>
<text x="613" y="83.125" font-size="30" fill="#087e8b" text-anchor="middle" font-weight="700" >Stag</text>
<text x="662.5" y="220.75" font-size="30" fill="#254f77" text-anchor="end" font-weight="700" >Hare</text>
<text x="478.462" y="498" font-size="28" fill="#536879" text-anchor="middle" font-weight="400" style="paint-order:stroke;stroke:white;stroke-width:9px;stroke-linejoin:round">61.5%</text>
<text x="42" y="295" font-size="30" fill="#183047" text-anchor="middle" font-weight="400" transform="rotate(-90 42 295)">Expected payoff</text>
<text x="415" y="604" font-size="30" fill="#183047" text-anchor="middle" font-weight="400" >Believed chance the other</text>
<text x="415" y="641" font-size="30" fill="#183047" text-anchor="middle" font-weight="400" >player chooses Stag</text>
</svg>

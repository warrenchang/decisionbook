<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Prospect theory value, probability weighting, and fourfold pattern</title>
  <desc id="desc">A value function is concave for gains, convex and steeper for losses around a reference point. An inverse-S probability-weighting curve emphasizes possibility and certainty. The value curve is a declared power-function illustration with common exponent 0.88 and loss multiplier 1.5. Four cards summarize a common, parameter-dependent pattern for high- and low-probability gains and losses.</desc>
  <defs>
    <marker id="pt-arrow" viewBox="0 0 10 8" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0.5,0.8 L9,4 L0.5,7.2 z" fill="#66737f"/>
    </marker>
    <style>
      .title { font: 700 32px Arial, sans-serif; fill: #17324d; }
      .panel-title { font: 700 23px Arial, sans-serif; fill: #17324d; }
      .label { font: 700 17px Arial, sans-serif; fill: #17324d; }
      .body { font: 16px Arial, sans-serif; fill: #344b5f; }
      .small { font: 16px Arial, sans-serif; fill: #66737f; }
      .axis { stroke: #66737f; stroke-width: 2; }
    </style>
  </defs>

  <rect width="1200" height="760" fill="#ffffff"/>
  <text class="title" x="600" y="45" text-anchor="middle">Prospect value begins at a reference point, not at final wealth</text>

  <!-- Value function panel -->
  <rect x="25" y="80" width="550" height="420" rx="18" fill="#f7fafc" stroke="#c9d6df" stroke-width="2"/>
  <text class="panel-title" x="300" y="119" text-anchor="middle">1. Value of gains and losses</text>

  <line class="axis" x1="70" y1="300" x2="520" y2="300"/>
  <polygon points="520,290 540,300 520,310" fill="#66737f"/>
  <line class="axis" x1="300" y1="460" x2="300" y2="160"/>
  <polygon points="290,160 300,140 310,160" fill="#66737f"/>
  <text class="small" x="532" y="325" text-anchor="end">gain</text>
  <text class="small" x="76" y="325">loss</text>
  <text class="small" x="320" y="156">subjective value</text>

  <!-- Declared teaching functions: gains t^0.88 and losses -1.5|t|^0.88; common horizontal and vertical units. -->
  <path d="M 300.00 300.00 L 297.80 302.61 L 295.60 304.80 L 293.40 306.85 L 291.20 308.83 L 289.00 310.74 L 286.80 312.61 L 284.60 314.45 L 282.40 316.25 L 280.20 318.02 L 278.00 319.77 L 275.80 321.50 L 273.60 323.22 L 271.40 324.91 L 269.20 326.59 L 267.00 328.25 L 264.80 329.90 L 262.60 331.54 L 260.40 333.17 L 258.20 334.79 L 256.00 336.39 L 253.80 337.99 L 251.60 339.58 L 249.40 341.15 L 247.20 342.72 L 245.00 344.29 L 242.80 345.84 L 240.60 347.39 L 238.40 348.93 L 236.20 350.47 L 234.00 351.99 L 231.80 353.52 L 229.60 355.03 L 227.40 356.54 L 225.20 358.05 L 223.00 359.55 L 220.80 361.04 L 218.60 362.53 L 216.40 364.02 L 214.20 365.50 L 212.00 366.97 L 209.80 368.44 L 207.60 369.91 L 205.40 371.37 L 203.20 372.83 L 201.00 374.29 L 198.80 375.74 L 196.60 377.19 L 194.40 378.63 L 192.20 380.07 L 190.00 381.51 L 187.80 382.94 L 185.60 384.37 L 183.40 385.79 L 181.20 387.22 L 179.00 388.64 L 176.80 390.05 L 174.60 391.47 L 172.40 392.88 L 170.20 394.28 L 168.00 395.69 L 165.80 397.09 L 163.60 398.49 L 161.40 399.89 L 159.20 401.28 L 157.00 402.67 L 154.80 404.06 L 152.60 405.45 L 150.40 406.83 L 148.20 408.21 L 146.00 409.59 L 143.80 410.97 L 141.60 412.34 L 139.40 413.71 L 137.20 415.08 L 135.00 416.45 L 132.80 417.82 L 130.60 419.18 L 128.40 420.54 L 126.20 421.90 L 124.00 423.26 L 121.80 424.61 L 119.60 425.96 L 117.40 427.32 L 115.20 428.66 L 113.00 430.01 L 110.80 431.36 L 108.60 432.70 L 106.40 434.04 L 104.20 435.38 L 102.00 436.72 L 99.80 438.05 L 97.60 439.39 L 95.40 440.72 L 93.20 442.05 L 91.00 443.38 L 88.80 444.71 L 86.60 446.03 L 84.40 447.36 L 82.20 448.68 L 80.00 450.00"
        fill="none" stroke="#a74343" stroke-width="6" stroke-linecap="round"/>
  <path d="M 300.00 300.00 L 302.20 298.26 L 304.40 296.80 L 306.60 295.43 L 308.80 294.11 L 311.00 292.84 L 313.20 291.59 L 315.40 290.37 L 317.60 289.17 L 319.80 287.98 L 322.00 286.82 L 324.20 285.66 L 326.40 284.52 L 328.60 283.39 L 330.80 282.27 L 333.00 281.17 L 335.20 280.06 L 337.40 278.97 L 339.60 277.89 L 341.80 276.81 L 344.00 275.74 L 346.20 274.67 L 348.40 273.62 L 350.60 272.56 L 352.80 271.52 L 355.00 270.48 L 357.20 269.44 L 359.40 268.41 L 361.60 267.38 L 363.80 266.36 L 366.00 265.34 L 368.20 264.32 L 370.40 263.31 L 372.60 262.30 L 374.80 261.30 L 377.00 260.30 L 379.20 259.30 L 381.40 258.31 L 383.60 257.32 L 385.80 256.33 L 388.00 255.35 L 390.20 254.37 L 392.40 253.39 L 394.60 252.42 L 396.80 251.44 L 399.00 250.47 L 401.20 249.51 L 403.40 248.54 L 405.60 247.58 L 407.80 246.62 L 410.00 245.66 L 412.20 244.71 L 414.40 243.76 L 416.60 242.80 L 418.80 241.86 L 421.00 240.91 L 423.20 239.96 L 425.40 239.02 L 427.60 238.08 L 429.80 237.14 L 432.00 236.21 L 434.20 235.27 L 436.40 234.34 L 438.60 233.41 L 440.80 232.48 L 443.00 231.55 L 445.20 230.63 L 447.40 229.70 L 449.60 228.78 L 451.80 227.86 L 454.00 226.94 L 456.20 226.02 L 458.40 225.11 L 460.60 224.19 L 462.80 223.28 L 465.00 222.37 L 467.20 221.46 L 469.40 220.55 L 471.60 219.64 L 473.80 218.73 L 476.00 217.83 L 478.20 216.93 L 480.40 216.02 L 482.60 215.12 L 484.80 214.22 L 487.00 213.33 L 489.20 212.43 L 491.40 211.53 L 493.60 210.64 L 495.80 209.75 L 498.00 208.85 L 500.20 207.96 L 502.40 207.07 L 504.60 206.19 L 506.80 205.30 L 509.00 204.41 L 511.20 203.53 L 513.40 202.64 L 515.60 201.76 L 517.80 200.88 L 520.00 200.00"
        fill="none" stroke="#2f6f9f" stroke-width="6" stroke-linecap="round"/>

  <circle cx="300" cy="300" r="7" fill="#17324d"/>
  <line x1="300" y1="300" x2="300" y2="475" stroke="#17324d" stroke-width="2" stroke-dasharray="6 5"/>
  <rect x="222" y="438" width="156" height="30" rx="9" fill="#17324d"/>
  <text x="300" y="459" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#ffffff">reference point r</text>

  <text x="410" y="203" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#2f6f9f">concave gains</text>
  <text x="105" y="465" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#a74343">convex losses</text>

  <path d="M284 314 L240 242" fill="none" stroke="#c56a2d" stroke-width="2.5"/>
  <rect x="65" y="160" width="206" height="78" rx="12" fill="#f7f1e8" stroke="#c56a2d" stroke-width="2"/>
  <text class="label" x="168" y="188" text-anchor="middle">Loss aversion</text>
  <text class="small" x="168" y="212" text-anchor="middle">loss side often steeper</text>
  <text class="small" x="168" y="230" text-anchor="middle">near the reference point</text>

  <text class="body" x="300" y="490" text-anchor="middle">Sensitivity diminishes as distance from r grows.</text>

  <!-- Probability weighting panel -->
  <rect x="625" y="80" width="550" height="420" rx="18" fill="#f7fafc" stroke="#c9d6df" stroke-width="2"/>
  <text class="panel-title" x="900" y="119" text-anchor="middle">2. Probability becomes decision weight</text>

  <line class="axis" x1="690" y1="450" x2="1110" y2="450"/>
  <polygon points="1110,440 1130,450 1110,460" fill="#66737f"/>
  <line class="axis" x1="690" y1="450" x2="690" y2="155"/>
  <polygon points="680,155 690,135 700,155" fill="#66737f"/>
  <text class="small" x="1100" y="430" text-anchor="end">objective probability p</text>
  <text class="small" x="710" y="151">decision weight w(p)</text>

  <line x1="690" y1="450" x2="1110" y2="140" stroke="#9aa9b5" stroke-width="2.5" stroke-dasharray="8 7"/>
  <text class="small" x="980" y="206" transform="rotate(-36 980 206)">w(p) = p</text>

  <path d="M690 450 C704 395,725 372,760 354 C820 324,870 318,915 307 C972 291,1023 261,1065 224 C1088 203,1100 174,1110 140"
        fill="none" stroke="#447c55" stroke-width="6" stroke-linecap="round"/>

  <circle cx="690" cy="450" r="6" fill="#447c55"/>
  <circle cx="1110" cy="140" r="6" fill="#447c55"/>

  <rect x="712" y="377" width="155" height="62" rx="11" fill="#eef6ed" stroke="#447c55" stroke-width="2"/>
  <text class="label" x="790" y="402" text-anchor="middle">Possibility</text>
  <text class="small" x="790" y="425" text-anchor="middle">Small p, large weight</text>

  <rect x="940" y="142" width="154" height="62" rx="11" fill="#eaf3f8" stroke="#2f6f9f" stroke-width="2"/>
  <text class="label" x="1017" y="167" text-anchor="middle">Certainty</text>
  <text class="small" x="1017" y="190" text-anchor="middle">near 1 → 1 is special</text>

  <line x1="900" y1="450" x2="900" y2="458" stroke="#66737f" stroke-width="2"/>
  <line x1="1110" y1="450" x2="1110" y2="458" stroke="#66737f" stroke-width="2"/>
  <text class="small" x="690" y="475" text-anchor="middle">0</text>
  <text class="small" x="900" y="475" text-anchor="middle">0.5</text>
  <text class="small" x="1110" y="475" text-anchor="middle">1</text>

  <text class="body" x="900" y="490" text-anchor="middle">Weights influence choice; they need not be stated beliefs.</text>

  <!-- Fourfold pattern -->
  <rect x="25" y="520" width="1150" height="205" rx="18" fill="#f7fafc" stroke="#c9d6df" stroke-width="2"/>
  <text class="panel-title" x="600" y="555" text-anchor="middle">3. The fourfold pattern</text>

  <rect x="48" y="578" width="260" height="122" rx="14" fill="#eaf3f8" stroke="#2f6f9f" stroke-width="2.5"/>
  <text class="label" x="178" y="606" text-anchor="middle">HIGH-PROBABILITY GAIN</text>
  <text x="178" y="641" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#2f6f9f">Risk averse</text>
  <text class="small" x="178" y="670" text-anchor="middle">protect the likely gain • certainty</text>
  <text class="small" x="178" y="690" text-anchor="middle">example: sure payoff</text>

  <rect x="329" y="578" width="260" height="122" rx="14" fill="#eef6ed" stroke="#447c55" stroke-width="2.5"/>
  <text class="label" x="459" y="606" text-anchor="middle">LOW-PROBABILITY GAIN</text>
  <text x="459" y="641" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#447c55">Risk seeking</text>
  <text class="small" x="459" y="670" text-anchor="middle">pursue the possibility</text>
  <text class="small" x="459" y="690" text-anchor="middle">example: lottery</text>

  <rect x="610" y="578" width="260" height="122" rx="14" fill="#f9e7e7" stroke="#a74343" stroke-width="2.5"/>
  <text class="label" x="740" y="606" text-anchor="middle">HIGH-PROBABILITY LOSS</text>
  <text x="740" y="641" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#a74343">Risk seeking</text>
  <text class="small" x="740" y="670" text-anchor="middle">gamble to avoid the loss</text>
  <text class="small" x="740" y="690" text-anchor="middle">example: break-even attempt</text>

  <rect x="891" y="578" width="260" height="122" rx="14" fill="#f7f1e8" stroke="#c56a2d" stroke-width="2.5"/>
  <text class="label" x="1021" y="606" text-anchor="middle">LOW-PROBABILITY LOSS</text>
  <text x="1021" y="641" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#c56a2d">Risk averse</text>
  <text class="small" x="1021" y="670" text-anchor="middle">pay to remove the possibility</text>
  <text class="small" x="1021" y="690" text-anchor="middle">example: insurance</text>

  <text x="600" y="748" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#536879">Teaching curves; the fourfold pattern depends on payoffs, reference points, and parameters.</text>
</svg>

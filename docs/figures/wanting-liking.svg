<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" baseProfile="full" height="650" version="1.1" viewBox="0 0 1200 650" width="1200">
  <defs />
  <title>Wanting, liking, and craving</title>
  <desc>A cue can create strong wanting and action readiness even when experienced liking is weak. Observing the urge and comparing promised with actual reward supports relearning.</desc>
  <rect fill="white" height="650" width="1200" x="0" y="0" />
  <text fill="#17324d" font-family="Arial, sans-serif" font-size="32" font-weight="bold" text-anchor="middle" x="600" y="48">Wanting can remain strong after liking has faded</text>
  <rect fill="#f7f1e8" height="110" rx="16" ry="16" stroke="#c56a2d" stroke-width="3" width="200" x="65" y="235" />
  <text fill="#17324d" font-family="Arial, sans-serif" font-size="24.95" font-weight="bold" text-anchor="middle" x="165" y="264.961"><tspan x="165" dy="0">Cue</tspan></text>
  <text fill="#66737f" font-family="Arial, sans-serif" font-size="16.32" font-weight="normal" text-anchor="middle" x="165" y="292.15"><tspan x="165" dy="0">notification •</tspan><tspan x="165" dy="19.2522">smell • stress •</tspan><tspan x="165" dy="19.2522">place</tspan></text>
  <line stroke="#c56a2d" stroke-width="4" x1="265" x2="430" y1="290" y2="290" />
  <polygon fill="#c56a2d" points="430,290 417.0096189432334,297.5 417.0096189432334,282.5" />
  <rect fill="#f9e7e7" height="200" rx="16" ry="16" stroke="#a74343" stroke-width="3" width="260" x="430" y="190" />
  <text fill="#17324d" font-family="Arial, sans-serif" font-size="26" font-weight="bold" text-anchor="middle" x="560" y="263.91"><tspan x="560" dy="0">Wanting</tspan></text>
  <text fill="#66737f" font-family="Arial, sans-serif" font-size="17" font-weight="normal" text-anchor="middle" x="560" y="292.03"><tspan x="560" dy="0">incentive salience</tspan><tspan x="560" dy="20.06">attention + action</tspan><tspan x="560" dy="20.06">readiness</tspan></text>
  <line stroke="#a74343" stroke-width="4" x1="690" x2="840" y1="290" y2="290" />
  <polygon fill="#a74343" points="840,290 827.0096189432334,297.5 827.0096189432334,282.5" />
  <rect fill="#eaf3f8" height="170" rx="16" ry="16" stroke="#2f6f9f" stroke-width="3" width="260" x="840" y="205" />
  <text fill="#17324d" font-family="Arial, sans-serif" font-size="26" font-weight="bold" text-anchor="middle" x="970" y="263.91"><tspan x="970" dy="0">Outcome</tspan></text>
  <text fill="#66737f" font-family="Arial, sans-serif" font-size="17" font-weight="normal" text-anchor="middle" x="970" y="292.03"><tspan x="970" dy="0">actual liking may be</tspan><tspan x="970" dy="20.06">brief, weak,</tspan><tspan x="970" dy="20.06">or followed by regret</tspan></text>
  <rect fill="#edf4ed" height="95" rx="16" ry="16" stroke="#447c55" stroke-width="3" width="490" x="355" y="465" />
  <text fill="#17324d" font-family="Arial, sans-serif" font-size="26" font-weight="bold" text-anchor="middle" x="600" y="496.44"><tspan x="600" dy="0">Relearning</tspan></text>
  <text fill="#66737f" font-family="Arial, sans-serif" font-size="17" font-weight="normal" text-anchor="middle" x="600" y="524.56"><tspan x="600" dy="0">observe the wave • delay • compare promise with</tspan><tspan x="600" dy="20.06">experience • change the cue</tspan></text>
  <line stroke="#447c55" stroke-width="4" x1="970" x2="760" y1="375" y2="465" />
  <polygon fill="#447c55" points="760,465 768.985649447024,452.98925048070697 774.8944389257115,466.77642593097784" />
  <line stroke="#447c55" stroke-width="4" x1="355" x2="165" y1="512" y2="345" />
  <polygon fill="#447c55" points="165,345 179.7085130844228,347.9427271102437 169.8057801083352,359.2093095381278" />
</svg>

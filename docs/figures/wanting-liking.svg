<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">Wanting can remain strong when experienced liking is weak</title>
  <desc id="desc">A cue can produce incentive salience, attention, and action readiness even when the resulting liking is brief or weak. Comparing the promised reward with actual experience can supply discrepant evidence for relearning, especially if the cue and environment also change, but it does not guarantee that wanting will diminish.</desc>
  <defs>
    <marker id="orange-arrow" viewBox="0 0 10 8" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0.5 0.8 L9 4 L0.5 7.2 Z" fill="#c56a2d"/></marker>
    <marker id="red-arrow" viewBox="0 0 10 8" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0.5 0.8 L9 4 L0.5 7.2 Z" fill="#a74343"/></marker>
    <marker id="green-arrow" viewBox="0 0 10 8" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0.5 0.8 L9 4 L0.5 7.2 Z" fill="#447c55"/></marker>
    <style>
      .title{font:700 33px Arial,sans-serif;fill:#17324d}
      .subtitle{font:19px Arial,sans-serif;fill:#607080}
      .label{font:700 26px Arial,sans-serif;fill:#17324d}
      .body{font:18px Arial,sans-serif;fill:#536879}
      .small{font:17px Arial,sans-serif;fill:#607080}
      .flow{fill:none;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}
    </style>
  </defs>
  <rect width="1200" height="680" fill="#ffffff"/>
  <text class="title" x="600" y="50" text-anchor="middle">Wanting can remain strong after liking has weakened</text>
  <text class="subtitle" x="600" y="82" text-anchor="middle">Wanting, experienced pleasure, and choice can dissociate.</text>

  <rect x="55" y="195" width="235" height="150" rx="20" fill="#f7f1e8" stroke="#c56a2d" stroke-width="3"/>
  <text class="label" x="173" y="240" text-anchor="middle">Cue</text>
  <text class="body" x="173" y="278" text-anchor="middle"><tspan x="173">notification • smell</tspan><tspan x="173" dy="26">stress • place • person</tspan></text>
  <path class="flow" d="M290 270 H410" stroke="#c56a2d" stroke-width="4" marker-end="url(#orange-arrow)"/>

  <rect x="410" y="170" width="315" height="200" rx="22" fill="#fff0ed" stroke="#a74343" stroke-width="3"/>
  <text class="label" x="568" y="220" text-anchor="middle">Wanting</text>
  <text class="body" x="568" y="258" text-anchor="middle"><tspan x="568">incentive salience</tspan><tspan x="568" dy="27">attention and action readiness</tspan><tspan x="568" dy="27">can be strong</tspan></text>
  <path class="flow" d="M725 270 H845" stroke="#a74343" stroke-width="4" marker-end="url(#red-arrow)"/>

  <rect x="845" y="185" width="300" height="170" rx="22" fill="#eaf3f8" stroke="#2f6f9f" stroke-width="3"/>
  <text class="label" x="995" y="233" text-anchor="middle">Experienced outcome</text>
  <text class="body" x="995" y="272" text-anchor="middle"><tspan x="995">liking may be brief, weak,</tspan><tspan x="995" dy="27">or followed by regret</tspan></text>

  <rect x="300" y="460" width="600" height="135" rx="22" fill="#edf4ed" stroke="#447c55" stroke-width="3"/>
  <text class="label" x="600" y="503" text-anchor="middle">Evidence that can support relearning</text>
  <text class="body" x="600" y="540" text-anchor="middle"><tspan x="600">observe the urge • delay • compare promised with actual reward</tspan><tspan x="600" dy="27">change cue, access, response, or consequence where possible</tspan></text>

  <path class="flow" d="M995 355 C995 420 860 440 800 460" stroke="#447c55" stroke-width="4" stroke-dasharray="9 7" marker-end="url(#green-arrow)"/>
  <path class="flow" d="M400 527 C235 527 173 445 173 345" stroke="#447c55" stroke-width="4" stroke-dasharray="9 7" marker-end="url(#green-arrow)"/>

  <rect x="120" y="606" width="960" height="62" rx="18" fill="#f5f8fa" stroke="#9eb1bf" stroke-width="2"/>
  <text class="small" x="600" y="632" text-anchor="middle"><tspan x="600">Discrepant evidence creates an opportunity for updating;</tspan><tspan x="600" dy="23">it does not guarantee that wanting will diminish.</tspan></text>
</svg>

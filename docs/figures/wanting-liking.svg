<?xml version="1.0" encoding="utf-8" ?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink" baseProfile="full" height="650" version="1.1" viewBox="0 0 1200 650" width="1200">
  <defs/>
  <title>Wanting, liking, and craving</title>
  <desc>A cue can create strong wanting and action readiness even when experienced liking is weak. Observing the urge and comparing promised with actual reward supports relearning.</desc>
  <rect fill="white" height="650" width="1200" x="0" y="0"/>
  <text fill="#17324d" font-family="Arial, sans-serif" font-size="34" font-weight="bold" text-anchor="middle" x="600" y="48">Wanting can remain strong after liking has faded</text>
  <rect fill="#f7f1e8" height="110" rx="16" ry="16" stroke="#c56a2d" stroke-width="3" width="200" x="65" y="235"/>
  <text fill="#17324d" font-family="Arial, sans-serif" font-size="26" font-weight="bold" text-anchor="middle" x="165.0" y="282.0">Cue</text>
  <text fill="#66737f" font-family="Arial, sans-serif" font-size="17" font-weight="normal" text-anchor="middle" x="165.0" y="316.0">notification • smell • stress • place</text>
  <line stroke="#c56a2d" stroke-width="4" x1="265" x2="430" y1="290" y2="290"/>
  <polygon fill="#c56a2d" points="430,290 417.0096189432334,297.5 417.0096189432334,282.5"/>
  <rect fill="#f9e7e7" height="200" rx="16" ry="16" stroke="#a74343" stroke-width="3" width="260" x="430" y="190"/>
  <text fill="#17324d" font-family="Arial, sans-serif" font-size="26" font-weight="bold" text-anchor="middle" x="560.0" y="282.0">Wanting</text>
  <text fill="#66737f" font-family="Arial, sans-serif" font-size="17" font-weight="normal" text-anchor="middle" x="560.0" y="316.0">incentive salience
attention + action readiness</text>
  <text fill="#a74343" font-family="Arial, sans-serif" font-size="29" font-weight="bold" text-anchor="middle" x="560" y="270">Wanting</text>
  <text fill="#17324d" font-family="Arial, sans-serif" font-size="18" font-weight="normal" text-anchor="middle" x="560" y="310">attention + action readiness</text>
  <line stroke="#a74343" stroke-width="4" x1="690" x2="840" y1="290" y2="290"/>
  <polygon fill="#a74343" points="840,290 827.0096189432334,297.5 827.0096189432334,282.5"/>
  <rect fill="#eaf3f8" height="170" rx="16" ry="16" stroke="#2f6f9f" stroke-width="3" width="260" x="840" y="205"/>
  <text fill="#17324d" font-family="Arial, sans-serif" font-size="26" font-weight="bold" text-anchor="middle" x="970.0" y="282.0">Outcome</text>
  <text fill="#66737f" font-family="Arial, sans-serif" font-size="17" font-weight="normal" text-anchor="middle" x="970.0" y="316.0">actual liking may be brief, weak,
or followed by regret</text>
  <rect fill="#edf4ed" height="95" rx="16" ry="16" stroke="#447c55" stroke-width="3" width="490" x="355" y="465"/>
  <text fill="#17324d" font-family="Arial, sans-serif" font-size="26" font-weight="bold" text-anchor="middle" x="600.0" y="504.5">Relearning</text>
  <text fill="#66737f" font-family="Arial, sans-serif" font-size="17" font-weight="normal" text-anchor="middle" x="600.0" y="538.5">observe the wave • delay • compare promise with experience • change the cue</text>
  <line stroke="#447c55" stroke-width="4" x1="970" x2="760" y1="375" y2="465"/>
  <polygon fill="#447c55" points="760,465 768.985649447024,452.98925048070697 774.8944389257115,466.77642593097784"/>
  <line stroke="#447c55" stroke-width="4" x1="355" x2="165" y1="512" y2="345"/>
  <polygon fill="#447c55" points="165,345 179.7085130844228,347.9427271102437 169.8057801083352,359.2093095381278"/>
</svg>

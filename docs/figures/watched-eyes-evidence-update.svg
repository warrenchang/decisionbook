<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="800" viewBox="0 0 1440 800" role="img" aria-labelledby="title desc">
  <title id="title">The watched-eyes result and its cumulative-evidence update</title>
  <desc id="desc">The left panel depicts one university coffee-room field study in which eye and flower posters alternated for ten weeks above an honesty box; contributions per unit consumed were nearly three times higher in eye-image weeks. The right panel shows the later cumulative update: two meta-analyses did not find a reliable overall increase in generosity from artificial surveillance cues.</desc>
  <defs>
    <marker id="update-head" viewBox="0 0 10 8" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0.5 0.8 L9 4 L0.5 7.2 Z" fill="#52657a"/>
    </marker>
    <style>
      .title{font:700 36px Arial,Helvetica,sans-serif;fill:#17324d}
      .subtitle{font:20px Arial,Helvetica,sans-serif;fill:#5d6f80}
      .panel{font:700 25px Arial,Helvetica,sans-serif;fill:#17324d}
      .label{font:700 21px Arial,Helvetica,sans-serif;fill:#17324d}
      .body{font:20px Arial,Helvetica,sans-serif;fill:#4e6071}
      .small{font:20px Arial,Helvetica,sans-serif;fill:#5d6f80}
      .week{font:700 21px Arial,Helvetica,sans-serif;fill:#ffffff}
    </style>
  </defs>

  <rect width="1440" height="800" fill="#ffffff"/>
  <text class="title" x="720" y="54" text-anchor="middle">A memorable field result meets cumulative evidence</text>
  <text class="subtitle" x="720" y="90" text-anchor="middle">A cue can suggest observation without creating a dependable behavioral effect.</text>

  <rect x="55" y="135" width="620" height="500" rx="26" fill="#f7fafc" stroke="#94aabd" stroke-width="3"/>
  <text class="panel" x="365" y="180" text-anchor="middle">One coffee-room field study</text>
  <text class="small" x="365" y="210" text-anchor="middle">Bateson, Nettle, and Roberts (2006)</text>

  <rect x="95" y="242" width="215" height="150" rx="18" fill="#edf6fb" stroke="#2f6f9f" stroke-width="3"/>
  <text class="label" x="203" y="275" text-anchor="middle">Poster cue</text>
  <ellipse cx="165" cy="323" rx="42" ry="23" fill="#ffffff" stroke="#2f6f9f" stroke-width="3"/>
  <circle cx="165" cy="323" r="10" fill="#17324d"/>
  <ellipse cx="240" cy="323" rx="42" ry="23" fill="#ffffff" stroke="#2f6f9f" stroke-width="3"/>
  <circle cx="240" cy="323" r="10" fill="#17324d"/>
  <text class="small" x="203" y="370" text-anchor="middle">eyes or flowers</text>

  <rect x="420" y="242" width="215" height="150" rx="18" fill="#f2f8f1" stroke="#4e8757" stroke-width="3"/>
  <text class="label" x="528" y="275" text-anchor="middle">Honesty box</text>
  <rect x="475" y="300" width="106" height="62" rx="10" fill="#ffffff" stroke="#4e8757" stroke-width="3"/>
  <rect x="506" y="291" width="44" height="9" rx="4" fill="#4e8757"/>
  <text class="small" x="528" y="383" text-anchor="middle">money / unit consumed</text>

  <text class="label" x="365" y="431" text-anchor="middle">Ten alternating weeks</text>
  <g>
    <circle cx="158" cy="475" r="23" fill="#2f6f9f"/><text class="week" x="158" y="481" text-anchor="middle">E</text>
    <circle cx="204" cy="475" r="23" fill="#4e8757"/><text class="week" x="204" y="481" text-anchor="middle">F</text>
    <circle cx="250" cy="475" r="23" fill="#2f6f9f"/><text class="week" x="250" y="481" text-anchor="middle">E</text>
    <circle cx="296" cy="475" r="23" fill="#4e8757"/><text class="week" x="296" y="481" text-anchor="middle">F</text>
    <circle cx="342" cy="475" r="23" fill="#2f6f9f"/><text class="week" x="342" y="481" text-anchor="middle">E</text>
    <circle cx="388" cy="475" r="23" fill="#4e8757"/><text class="week" x="388" y="481" text-anchor="middle">F</text>
    <circle cx="434" cy="475" r="23" fill="#2f6f9f"/><text class="week" x="434" y="481" text-anchor="middle">E</text>
    <circle cx="480" cy="475" r="23" fill="#4e8757"/><text class="week" x="480" y="481" text-anchor="middle">F</text>
    <circle cx="526" cy="475" r="23" fill="#2f6f9f"/><text class="week" x="526" y="481" text-anchor="middle">E</text>
    <circle cx="572" cy="475" r="23" fill="#4e8757"/><text class="week" x="572" y="481" text-anchor="middle">F</text>
  </g>
  <text class="small" x="365" y="520" text-anchor="middle">E = eye image · F = flower image</text>
  <rect x="105" y="548" width="520" height="62" rx="17" fill="#e8f1fa" stroke="#2f6f9f" stroke-width="3"/>
  <text class="label" x="365" y="586" text-anchor="middle">Eye weeks: contributions were nearly 3× higher</text>

  <line x1="690" y1="385" x2="763" y2="385" stroke="#52657a" stroke-width="4" stroke-linecap="round" marker-end="url(#update-head)"/>
  <text class="small" x="720" y="350" text-anchor="middle">update</text>

  <rect x="765" y="135" width="620" height="500" rx="26" fill="#f7fafc" stroke="#94aabd" stroke-width="3"/>
  <text class="panel" x="1075" y="180" text-anchor="middle">Later cumulative evidence</text>
  <text class="small" x="1075" y="210" text-anchor="middle">Northover et al. (2017)</text>

  <rect x="820" y="250" width="510" height="82" rx="18" fill="#eef3f7" stroke="#788da0" stroke-width="3"/>
  <text class="label" x="1075" y="284" text-anchor="middle">Two meta-analyses</text>
  <text class="body" x="1075" y="315" text-anchor="middle">combined a wider set of artificial-surveillance studies</text>

  <line x1="1075" y1="332" x2="1075" y2="378" stroke="#52657a" stroke-width="4" stroke-linecap="round" marker-end="url(#update-head)"/>

  <rect x="820" y="390" width="510" height="132" rx="18" fill="#fff3e9" stroke="#c56a2d" stroke-width="3"/>
  <text class="label" x="1075" y="431" text-anchor="middle">Cumulative conclusion</text>
  <text class="body" x="1075" y="466" text-anchor="middle">No reliable overall increase in generosity</text>
  <text class="small" x="1075" y="488" text-anchor="middle">Effects may depend on task, outcome,</text>
  <text class="small" x="1075" y="512" text-anchor="middle">population, or setting.</text>

  <rect x="820" y="535" width="510" height="90" rx="18" fill="#eef7f1" stroke="#4e8757" stroke-width="3"/>
  <text class="label" x="1075" y="562" text-anchor="middle">What survives</text>
  <text class="small" x="1075" y="588" text-anchor="middle">Observation cues remain a conditional hypothesis—</text>
  <text class="small" x="1075" y="612" text-anchor="middle">not a behavioral remote control.</text>

  <rect x="105" y="672" width="1230" height="78" rx="20" fill="#17324d"/>
  <text x="720" y="705" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="700" fill="#ffffff">An input can be irrelevant to material payoffs and still matter to the decision process.</text>
  <text x="720" y="735" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="19" fill="#dce8f2">One striking result motivates a mechanism; cumulative evidence decides how broadly the claim travels.</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">A self-contained Stroop interference activity</title>
  <desc id="desc">Readers first name the ink colors of neutral strings and then name the ink colors of incongruent color words. The second row creates competition between the practiced response of reading and the instructed response of naming ink color.</desc>
  <style>
    .title{font:700 34px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#183047}
    .sub{font:500 20px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#52677a}
    .panel{font:700 22px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#183047}
    .word{font:750 45px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;letter-spacing:1px}
    .note{font:600 18px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#314b61}
    .small{font:500 16px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#52677a}
  </style>
  <rect x="18" y="18" width="1164" height="614" rx="28" fill="#f7f9fc" stroke="#9fb2c3" stroke-width="2"/>
  <text x="600" y="66" class="title" text-anchor="middle">NAME THE INK COLOUR—DO NOT READ THE WORD</text>
  <text x="600" y="101" class="sub" text-anchor="middle">Move left to right at an even pace. Try the neutral row first, then the conflict row.</text>

  <rect x="64" y="137" width="1072" height="180" rx="22" fill="#ffffff" stroke="#bfd0dd" stroke-width="2"/>
  <rect x="85" y="158" width="150" height="42" rx="21" fill="#e9f2f7"/>
  <text x="160" y="186" class="panel" text-anchor="middle">NEUTRAL</text>
  <text x="283" y="245" class="word" fill="#c0392b">XXXX</text>
  <text x="489" y="245" class="word" fill="#2779a7">XXXX</text>
  <text x="695" y="245" class="word" fill="#2f8a52">XXXX</text>
  <text x="901" y="245" class="word" fill="#d28a16">XXXX</text>
  <text x="600" y="291" class="small" text-anchor="middle">The strings carry colour but no competing colour name.</text>

  <rect x="64" y="342" width="1072" height="180" rx="22" fill="#ffffff" stroke="#bfd0dd" stroke-width="2"/>
  <rect x="85" y="363" width="150" height="42" rx="21" fill="#f8e4dc"/>
  <text x="160" y="391" class="panel" text-anchor="middle">CONFLICT</text>
  <text x="253" y="450" class="word" fill="#c0392b">BLUE</text>
  <text x="452" y="450" class="word" fill="#2779a7">GREEN</text>
  <text x="704" y="450" class="word" fill="#2f8a52">RED</text>
  <text x="878" y="450" class="word" fill="#d28a16">BLUE</text>
  <text x="600" y="496" class="small" text-anchor="middle">Word meaning now competes with the task-relevant ink colour.</text>

  <rect x="122" y="550" width="956" height="50" rx="25" fill="#e9f2f7" stroke="#9fbfd0"/>
  <text x="600" y="581" class="note" text-anchor="middle">The activity demonstrates response conflict; it does not estimate your cognitive ability or a universal effect size.</text>
</svg>

<title id="title">Confidence rises as case information accumulates</title><desc id="desc">Oskamp (1965) asked 32 judges to answer the same 25 five-option questions at four stages of information about one case. Accuracy means were 26.0, 23.0, 28.4 and 27.8 percent. Confidence means were 33.2, 39.2, 46.0 and 52.8 percent. The result concerns this case and task, not all additional information.</desc>


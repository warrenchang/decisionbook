<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">Why people share messages</title>
  <desc id="desc">Five evenly spaced motives surround a message: self-expression, connection, usefulness, status or competence, and collective change.</desc>
  <rect width="1600" height="1000" fill="#ffffff"/>
  <text x="800" y="86" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="54" font-weight="700" fill="#183047">A message spreads when passing it on creates value</text>
  <text x="800" y="136" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="28" fill="#687887">Design for truthful usefulness and connection—not performance, pressure, or outrage bait.</text>

  <line x1="800" y1="495" x2="800" y2="290" stroke="#2b8078" stroke-width="7"/>
  <line x1="800" y1="495" x2="1150" y2="390" stroke="#2b8078" stroke-width="7"/>
  <line x1="800" y1="495" x2="1015" y2="760" stroke="#2b8078" stroke-width="7"/>
  <line x1="800" y1="495" x2="585" y2="760" stroke="#2b8078" stroke-width="7"/>
  <line x1="800" y1="495" x2="450" y2="390" stroke="#2b8078" stroke-width="7"/>

  <circle cx="800" cy="500" r="170" fill="#183047"/>
  <text x="800" y="480" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="48" font-weight="700" fill="#ffffff">Would sharing</text>
  <text x="800" y="538" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="48" font-weight="700" fill="#ffffff">create value?</text>

  <rect x="590" y="185" width="420" height="150" rx="26" fill="#e8f2f8" stroke="#2f73a5" stroke-width="6"/>
  <text x="800" y="248" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="36" font-weight="700" fill="#183047">Self-expression</text>
  <text x="800" y="292" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="26" fill="#687887">“What does this say about me?”</text>

  <rect x="1080" y="315" width="420" height="150" rx="26" fill="#f7efe4" stroke="#c76b29" stroke-width="6"/>
  <text x="1290" y="378" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="36" font-weight="700" fill="#183047">Connection</text>
  <text x="1290" y="422" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="26" fill="#687887">“Who could this help me reach?”</text>

  <rect x="950" y="735" width="470" height="150" rx="26" fill="#edf5ee" stroke="#2b8078" stroke-width="6"/>
  <text x="1185" y="798" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="36" font-weight="700" fill="#183047">Usefulness</text>
  <text x="1185" y="842" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="26" fill="#687887">“Who can act on this?”</text>

  <rect x="180" y="735" width="470" height="150" rx="26" fill="#fff4de" stroke="#d89b2b" stroke-width="6"/>
  <text x="415" y="798" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="36" font-weight="700" fill="#183047">Status / competence</text>
  <text x="415" y="842" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="26" fill="#687887">“Will this help me contribute well?”</text>

  <rect x="100" y="315" width="420" height="150" rx="26" fill="#faece9" stroke="#b95345" stroke-width="6"/>
  <text x="310" y="378" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="36" font-weight="700" fill="#183047">Collective change</text>
  <text x="310" y="422" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#687887">“Can this make a good norm visible?”</text>

  <text x="800" y="950" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700" fill="#183047">Ask both: “Will they believe it?” and “Would passing it on be worthwhile?”</text>
</svg>

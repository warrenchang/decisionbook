<svg xmlns="http://www.w3.org/2000/svg" width="800" height="950" viewBox="0 0 800 950">
<title>A positive test has two routes</title><desc>Hypothetical natural-frequency example: among 10000 people, 100 have the disease and 9900 do not. Ninety percent of the diseased group and nine percent of the nondiseased group test positive, giving 90 true positives and 891 false positives. The proportion with disease among positive tests is 90 divided by 981, about 9.2 percent.</desc>
<rect width="800" height="950" fill="white"/>
<defs><marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0 L9 4 L0 8 Z" fill="context-stroke"/></marker></defs>
<g font-family="Arial, sans-serif" fill="#17324d">
<text x="400" y="48" font-size="34" font-weight="bold" fill="#17324d" text-anchor="middle">
<tspan x="400" dy="0">A positive test has two routes</tspan>
</text>
<text x="400" y="88" font-size="22" font-weight="normal" fill="#52677b" text-anchor="middle">
<tspan x="400" dy="0">Hypothetical example: disease prevalence is 1%</tspan>
</text>
<rect x="220" y="125" width="360" height="105" rx="17" fill="#edf4ed" stroke="#447c55" stroke-width="3"/>
<text x="400.0" y="163" font-size="30" font-weight="bold" fill="#17324d" text-anchor="middle">
<tspan x="400.0" dy="0">10,000 people</tspan>
</text>
<path d="M400 230 V275 H210 V330" fill="none" stroke="#2f6f9f" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M400 275 H590 V330" fill="none" stroke="#2f6f9f" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="170" y="304" font-size="23" font-weight="bold" fill="#17324d" text-anchor="middle">
<tspan x="170" dy="0">1%</tspan>
</text>
<text x="630" y="304" font-size="23" font-weight="bold" fill="#17324d" text-anchor="middle">
<tspan x="630" dy="0">99%</tspan>
</text>
<rect x="60" y="330" width="300" height="120" rx="17" fill="#eaf3f8" stroke="#2f6f9f" stroke-width="3"/>
<text x="210.0" y="368" font-size="27" font-weight="bold" fill="#17324d" text-anchor="middle">
<tspan x="210.0" dy="0">100 with disease</tspan>
</text>
<rect x="440" y="330" width="300" height="120" rx="17" fill="#eaf3f8" stroke="#2f6f9f" stroke-width="3"/>
<text x="590.0" y="368" font-size="25" font-weight="bold" fill="#17324d" text-anchor="middle">
<tspan x="590.0" dy="0">9,900 without disease</tspan>
</text>
<path d="M210 450 V468 H85 V565" fill="none" stroke="#447c55" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M590 450 V468 H715 V565" fill="none" stroke="#c56a2d" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="235" y="496" font-size="22" font-weight="normal" fill="#447c55" text-anchor="middle">
<tspan x="235" dy="0">90% test positive</tspan>
<tspan x="235" dy="27.5">sensitivity</tspan>
</text>
<text x="565" y="496" font-size="22" font-weight="normal" fill="#c56a2d" text-anchor="middle">
<tspan x="565" dy="0">9% test positive</tspan>
<tspan x="565" dy="27.5">false-positive rate</tspan>
</text>
<rect x="60" y="565" width="300" height="125" rx="17" fill="#edf4ed" stroke="#447c55" stroke-width="3"/>
<text x="210.0" y="603" font-size="27" font-weight="bold" fill="#17324d" text-anchor="middle">
<tspan x="210.0" dy="0">90 true positives</tspan>
</text>
<text x="210.0" y="638.0" font-size="20" font-weight="normal" fill="#52677b" text-anchor="middle">
<tspan x="210.0" dy="0">Disease and positive test</tspan>
</text>
<rect x="440" y="565" width="300" height="125" rx="17" fill="#f7f1e8" stroke="#c56a2d" stroke-width="3"/>
<text x="590.0" y="603" font-size="27" font-weight="bold" fill="#17324d" text-anchor="middle">
<tspan x="590.0" dy="0">891 false positives</tspan>
</text>
<text x="590.0" y="638.0" font-size="20" font-weight="normal" fill="#52677b" text-anchor="middle">
<tspan x="590.0" dy="0">No disease, positive test</tspan>
</text>
<path d="M210 690 V725 H330 V770" fill="none" stroke="#447c55" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M590 690 V725 H470 V770" fill="none" stroke="#c56a2d" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="160" y="770" width="480" height="125" rx="17" fill="#edf4ed" stroke="#447c55" stroke-width="3"/>
<text x="400.0" y="808" font-size="27" font-weight="bold" fill="#17324d" text-anchor="middle">
<tspan x="400.0" dy="0">Among all 981 positive tests</tspan>
</text>
<text x="400.0" y="843.0" font-size="23" font-weight="normal" fill="#52677b" text-anchor="middle">
<tspan x="400.0" dy="0">90 / (90 + 891) ≈ 9.2% have the disease</tspan>
</text>
</g></svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">Two questions create different visible menus around an egg choice</title>
  <desc id="desc">One panel asks whether the person wants an egg and presents no and yes. The second asks whether the person wants one or two eggs, making consumption implicit and leaving none outside the visible answer set.</desc>
  <style>
    .title{font:700 34px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#183047}
    .sub{font:500 19px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#52677a}
    .panel-title{font:700 23px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#183047}
    .question{font:650 25px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#314b61}
    .choice{font:700 22px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#183047}
    .small{font:500 17px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#52677a}
    .foot{font:600 18px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#314b61}
  </style>
  <rect x="18" y="18" width="1164" height="584" rx="28" fill="#f7f9fc" stroke="#9fb2c3" stroke-width="2"/>
  <text x="600" y="67" class="title" text-anchor="middle">THE QUESTION ALSO BUILDS THE MENU</text>
  <text x="600" y="101" class="sub" text-anchor="middle">Both questions permit refusal in principle, but only one keeps “none” visible.</text>

  <rect x="62" y="139" width="505" height="360" rx="24" fill="#ffffff" stroke="#9fbfd0" stroke-width="2"/>
  <text x="314" y="179" class="panel-title" text-anchor="middle">OPEN WHETHER TO EAT</text>
  <text x="314" y="227" class="question" text-anchor="middle">“Do you want an egg?”</text>
  <rect x="113" y="280" width="170" height="112" rx="20" fill="#eef2f5" stroke="#9aabb8" stroke-width="2"/>
  <text x="198" y="345" class="choice" text-anchor="middle">NO</text>
  <rect x="345" y="280" width="170" height="112" rx="20" fill="#e9f2f7" stroke="#236b8e" stroke-width="2"/>
  <ellipse cx="430" cy="309" rx="28" ry="36" fill="#fff9e8" stroke="#c8b88b" stroke-width="2"/>
  <circle cx="430" cy="312" r="13" fill="#e3a319"/>
  <text x="430" y="380" class="choice" text-anchor="middle">YES</text>
  <text x="314" y="454" class="small" text-anchor="middle">The visible answers include eating none.</text>

  <rect x="633" y="139" width="505" height="360" rx="24" fill="#ffffff" stroke="#d8a69e" stroke-width="2"/>
  <text x="886" y="179" class="panel-title" text-anchor="middle">ASSUME EATING; CHOOSE QUANTITY</text>
  <text x="886" y="227" class="question" text-anchor="middle">“Would you like one egg or two?”</text>
  <rect x="684" y="280" width="170" height="112" rx="20" fill="#e9f2f7" stroke="#236b8e" stroke-width="2"/>
  <ellipse cx="769" cy="309" rx="28" ry="36" fill="#fff9e8" stroke="#c8b88b" stroke-width="2"/>
  <circle cx="769" cy="312" r="13" fill="#e3a319"/>
  <text x="769" y="380" class="choice" text-anchor="middle">ONE</text>
  <rect x="916" y="280" width="170" height="112" rx="20" fill="#f8e4dc" stroke="#c44e52" stroke-width="2"/>
  <ellipse cx="984" cy="309" rx="25" ry="34" fill="#fff9e8" stroke="#c8b88b" stroke-width="2"/>
  <circle cx="984" cy="312" r="12" fill="#e3a319"/>
  <ellipse cx="1022" cy="309" rx="25" ry="34" fill="#fff9e8" stroke="#c8b88b" stroke-width="2"/>
  <circle cx="1022" cy="312" r="12" fill="#e3a319"/>
  <text x="1001" y="380" class="choice" text-anchor="middle">TWO</text>
  <text x="886" y="454" class="small" text-anchor="middle">“None” is possible, but absent from the displayed menu.</text>

  <rect x="111" y="531" width="978" height="45" rx="22" fill="#e9f2f7" stroke="#9fbfd0"/>
  <text x="600" y="560" class="foot" text-anchor="middle">This is not merely equivalent wording: the second question also changes option salience and implied commitment.</text>
</svg>

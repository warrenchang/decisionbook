<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="755" viewBox="0 0 1200 755" role="img" aria-labelledby="title desc">
  <title id="title">Synthesis of income and subjective well-being evidence</title>
  <desc id="desc">Three schematic panels summarize the 2010 finding of rising life evaluation and flattening emotional well-being, the 2021 finding of experienced well-being rising beyond the earlier threshold, and the 2023 reconciliation showing flattening mainly among the least happy group. The figure warns against a universal income threshold.</desc>
  <defs>
    <marker id="blueArrow" viewBox="0 0 10 8" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0.5 0.8 L9 4 L0.5 7.2 Z" fill="#2f6f9f"/></marker>
    <marker id="orangeArrow" viewBox="0 0 10 8" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0.5 0.8 L9 4 L0.5 7.2 Z" fill="#c56a2d"/></marker>
    <filter id="shadow"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#17324d" flood-opacity="0.12"/></filter>
  </defs>
  <rect width="1200" height="755" fill="#ffffff"/>
<text x="600" y="48" text-anchor="middle" font-family="Georgia, serif" font-size="33.0" font-weight="700" fill="#17324d" >Income and well-being: what changed across three analyses</text>
<text x="600" y="80" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.0" font-weight="400" fill="#66737f" >The apparent conflict becomes smaller when the measure and the position in the well-being distribution are kept visible.</text>
<rect x="45" y="115" width="350" height="500" rx="20" fill="#f7fafc" stroke="#c8d7e2" stroke-width="2" />
<text x="220" y="158" text-anchor="middle" font-family="Arial, sans-serif" font-size="28.0" font-weight="700" fill="#2f6f9f" >2010</text>
<text x="220" y="187" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.0" font-weight="700" fill="#66737f" >Kahneman &amp; Deaton</text>
<line x1="110" y1="420" x2="350" y2="420" stroke="#8fa0ad" stroke-width="2"/>
<line x1="110" y1="240" x2="110" y2="420" stroke="#8fa0ad" stroke-width="2"/>
<text x="230" y="447" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#66737f" >log income</text>
<path d="M115 400 C165 345 215 305 335 272" fill="none" stroke="#2f6f9f" stroke-width="5"/>
<path d="M115 395 C170 322 220 300 335 299" fill="none" stroke="#c56a2d" stroke-width="5" stroke-dasharray="9 7"/>
<text x="330" y="266" text-anchor="end" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#2f6f9f" >evaluation</text>
<text x="330" y="318" text-anchor="end" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#c56a2d" >affect</text>
<text x="220" y="493" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#17324d" >Life evaluation rose with log income.</text>
<text x="220" y="518" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#17324d" >Emotional well-being appeared to flatten</text>
<text x="220" y="543" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#17324d" >near a US income category around $75,000.</text>
<rect x="425" y="115" width="350" height="500" rx="20" fill="#f7fafc" stroke="#c8d7e2" stroke-width="2" />
<text x="600" y="158" text-anchor="middle" font-family="Arial, sans-serif" font-size="28.0" font-weight="700" fill="#2f6f9f" >2021</text>
<text x="600" y="187" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.0" font-weight="700" fill="#66737f" >Killingsworth</text>
<line x1="490" y1="420" x2="730" y2="420" stroke="#8fa0ad" stroke-width="2"/>
<line x1="490" y1="240" x2="490" y2="420" stroke="#8fa0ad" stroke-width="2"/>
<text x="610" y="447" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#66737f" >log income</text>
<path d="M495 398 C550 348 605 320 715 276" fill="none" stroke="#447c55" stroke-width="5"/>
<text x="710" y="268" text-anchor="end" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#447c55" >experienced well-being</text>
<text x="600" y="493" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#17324d" >Repeated experience reports showed</text>
<text x="600" y="518" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#17324d" >experienced well-being continuing to rise</text>
<text x="600" y="543" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#17324d" >beyond that level in the studied sample.</text>
<rect x="805" y="115" width="350" height="500" rx="20" fill="#f7fafc" stroke="#c8d7e2" stroke-width="2" />
<text x="980" y="158" text-anchor="middle" font-family="Arial, sans-serif" font-size="28.0" font-weight="700" fill="#2f6f9f" >2023</text>
<text x="980" y="187" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.0" font-weight="700" fill="#66737f" >Adversarial collaboration</text>
<line x1="870" y1="420" x2="1110" y2="420" stroke="#8fa0ad" stroke-width="2"/>
<line x1="870" y1="240" x2="870" y2="420" stroke="#8fa0ad" stroke-width="2"/>
<text x="990" y="447" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#66737f" >log income</text>
<path d="M875 400 C935 330 990 312 1095 310" fill="none" stroke="#a74343" stroke-width="5"/>
<path d="M875 395 C930 345 985 310 1095 268" fill="none" stroke="#447c55" stroke-width="5"/>
<text x="1090" y="329" text-anchor="end" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#a74343" >least happy group</text>
<text x="1090" y="260" text-anchor="end" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#447c55" >happier groups</text>
<text x="980" y="493" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#17324d" >Flattening appeared mainly among the</text>
<text x="980" y="518" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#17324d" >least happy part of the distribution;</text>
<text x="980" y="543" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#17324d" >other groups continued to rise.</text>
<rect x="105" y="645" width="990" height="62" rx="15" fill="#f7f1e8" stroke="#c56a2d" stroke-width="2" />
<text x="600" y="673" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.0" font-weight="700" fill="#17324d" >No universal magic number follows: year, prices, sample, measure, model, and distribution all matter.</text>
<text x="600" y="730" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#66737f" >Curves are an evidence-synthesis schematic, not digitized effect-size estimates from the published figures.</text>
</svg>

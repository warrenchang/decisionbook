<svg xmlns="http://www.w3.org/2000/svg" width="760" height="805" viewBox="0 0 760 805" role="img" aria-labelledby="title desc">
<title id="title">Check what the message means</title><desc id="desc">The message about accountability can be interpreted as clarifying responsibility or assigning blame. Words and context inform possible meanings. Asking a concrete question and hearing a correction can revise the interpretation.</desc>
<rect width="760" height="805" fill="white"/>
<defs>
<marker id="a" viewBox="0 0 12 10" markerWidth="9" markerHeight="8" refX="11" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L11 5 L1 9 Z" fill="#2f6f9f"/></marker>
<marker id="g" viewBox="0 0 12 10" markerWidth="9" markerHeight="8" refX="11" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L11 5 L1 9 Z" fill="#3f7c59"/></marker>
<marker id="o" viewBox="0 0 12 10" markerWidth="9" markerHeight="8" refX="11" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L11 5 L1 9 Z" fill="#b95f2d"/></marker>
</defs>
<text x="380" y="48" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="700" fill="#17324d">Check what the message means</text>
<rect x="70" y="105" width="620" height="108" rx="18" fill="#edf5fa" stroke="#2f6f9f" stroke-width="2.5"/>
<text x="380" y="148" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#17324d">The message</text>
<text x="380" y="187" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="400" fill="#17324d">“We need to discuss accountability.”</text>
<path d="M380 213 V255" fill="none" stroke="#2f6f9f" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#a)"/>
<rect x="110" y="255" width="580" height="145" rx="18" fill="#fff5ec" stroke="#b95f2d" stroke-width="2.5"/>
<text x="400" y="297" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#17324d">Possible meanings</text>
<text x="400" y="338" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="400" fill="#17324d">Clarify who is responsible?</text>
<text x="400" y="374.4" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="400" fill="#17324d">Find someone to blame?</text>
<text x="380" y="443" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="400" fill="#53697d">Tone, history, and setting provide clues.</text>
<path d="M400 400 V413 H724 V523 H690" fill="none" stroke="#2f6f9f" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#a)"/>
<rect x="110" y="485" width="580" height="145" rx="18" fill="#edf7ef" stroke="#3f7c59" stroke-width="2.5"/>
<text x="400" y="527" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#17324d">Ask and check</text>
<text x="400" y="568" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="400" fill="#17324d">“Do you mean we should decide</text>
<text x="400" y="604.4" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="400" fill="#17324d">who owns each task?”</text>
<path d="M110 558 H40 V328 H110" fill="none" stroke="#3f7c59" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#g)"/>
<text x="380" y="682" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#3f7c59">A correction changes the interpretation.</text>
<text x="380" y="737" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="400" fill="#53697d">Seek enough shared understanding</text>
<text x="380" y="773.4" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="400" fill="#53697d">for the next action.</text>
</svg>

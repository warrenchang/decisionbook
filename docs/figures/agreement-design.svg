<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="agreement-title agreement-desc">
  <title id="agreement-title">Agreement-design tools and their boundary conditions</title>
  <desc id="agreement-desc">An author-designed teaching synthesis presents four agreement-design tools in a balanced grid. MESOs require sincere, understandable, approximately equivalent offers. Contingent terms require measurable and verifiable outcomes, aligned incentives, enforceability, and acceptable risk allocation. Post-settlement search protects the signed deal as the fallback only through an explicit voluntary rule. Governance specifies owners, evidence, review, cure, dispute route, and exit. Candidate terms then pass through a test before implementation.</desc>
  <defs>
    <marker id="agreement-arrow" viewBox="0 0 10 8" markerWidth="10" markerHeight="8" refX="8.7" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0.7 0.8 L8.8 4 L0.7 7.2 Z" fill="#60758a"/>
    </marker>
  </defs>

  <rect width="1200" height="720" fill="#ffffff"/>
  <text x="600" y="48" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700" fill="#17324d">Agreement tools work only under explicit conditions</text>
  <text x="600" y="80" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#60758a">Author's prescriptive teaching synthesis—not evidence that any tool automatically creates a better deal</text>

  <g font-family="Arial, Helvetica, sans-serif">
    <rect x="54" y="112" width="526" height="188" rx="22" fill="#edf5fa" stroke="#2f6f9f" stroke-width="3"/>
    <text x="82" y="150" font-size="24" font-weight="700" fill="#245f84">1  MESOs: compare packages</text>
    <text x="82" y="181" font-size="17" font-weight="700" fill="#17324d">Use as a priority probe only when offers are:</text>
    <text x="94" y="214" font-size="17" fill="#17324d">• sincere and actually available</text>
    <text x="94" y="244" font-size="17" fill="#17324d">• understandable and meaningfully different</text>
    <text x="94" y="274" font-size="17" fill="#17324d">• approximately equivalent to the offer-maker</text>

    <rect x="620" y="112" width="526" height="188" rx="22" fill="#fff7ed" stroke="#c56a2d" stroke-width="3"/>
    <text x="648" y="150" font-size="24" font-weight="700" fill="#9d5122">2  Contingent terms: use later evidence</text>
    <text x="648" y="181" font-size="17" font-weight="700" fill="#17324d">Use only when:</text>
    <text x="660" y="214" font-size="17" fill="#17324d">• the outcome is measurable and independently verifiable</text>
    <text x="660" y="244" font-size="17" fill="#17324d">• control and incentives are aligned; enforcement is credible</text>
    <text x="660" y="274" font-size="17" fill="#17324d">• sabotage risk and risk-bearing remain acceptable</text>

    <rect x="54" y="326" width="526" height="178" rx="22" fill="#edf7ef" stroke="#447c55" stroke-width="3"/>
    <text x="82" y="364" font-size="24" font-weight="700" fill="#356744">3  Post-settlement search: explore safely</text>
    <text x="82" y="397" font-size="17" fill="#17324d">• preserve the signed agreement as the fallback only through</text>
    <text x="104" y="425" font-size="17" fill="#17324d">an explicit, protected, and voluntary rule</text>
    <text x="82" y="458" font-size="17" fill="#17324d">• replace it only when every required party freely prefers the revision</text>
    <text x="82" y="486" font-size="16" fill="#60758a">Otherwise “search” can become pressure to reopen settled terms.</text>

    <rect x="620" y="326" width="526" height="178" rx="22" fill="#f5eff8" stroke="#795a8a" stroke-width="3"/>
    <text x="648" y="364" font-size="24" font-weight="700" fill="#664d80">4  Governance: make promises operable</text>
    <text x="648" y="399" font-size="17" fill="#17324d">Name owners, measures, verification rights, review dates,</text>
    <text x="648" y="429" font-size="17" fill="#17324d">adaptation authority, cure, dispute route, and exit.</text>
    <text x="648" y="466" font-size="17" fill="#17324d">Monitor implementation, harms, incentives, and changed conditions.</text>
  </g>

  <g font-family="Arial, Helvetica, sans-serif">
    <rect x="72" y="552" width="250" height="86" rx="20" fill="#f4f7f9" stroke="#9fb1c0" stroke-width="2"/>
    <text x="197" y="588" text-anchor="middle" font-size="20" font-weight="700" fill="#17324d">Candidate terms</text>
    <text x="197" y="616" text-anchor="middle" font-size="16" fill="#60758a">created with the tools above</text>
    <path d="M322 595 L398 595" stroke="#60758a" stroke-width="4" stroke-linecap="round" marker-end="url(#agreement-arrow)"/>

    <rect x="410" y="534" width="380" height="122" rx="22" fill="#fff8ea" stroke="#d39b34" stroke-width="3"/>
    <text x="600" y="570" text-anchor="middle" font-size="21" font-weight="700" fill="#7d5718">TEST THE PACKAGE</text>
    <text x="600" y="600" text-anchor="middle" font-size="17" fill="#17324d">better than each BATNA • feasible • lawful</text>
    <text x="600" y="628" text-anchor="middle" font-size="17" fill="#17324d">fair enough • understood • implementable</text>
    <path d="M790 595 L866 595" stroke="#60758a" stroke-width="4" stroke-linecap="round" marker-end="url(#agreement-arrow)"/>

    <rect x="878" y="552" width="250" height="86" rx="20" fill="#edf7ef" stroke="#447c55" stroke-width="3"/>
    <text x="1003" y="588" text-anchor="middle" font-size="20" font-weight="700" fill="#356744">Implement and learn</text>
    <text x="1003" y="616" text-anchor="middle" font-size="16" fill="#60758a">with accountability and exit</text>
  </g>

  <text x="600" y="690" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#60758a">A preference, signature, or clever clause is not by itself evidence of value, consent, or durability.</text>
</svg>

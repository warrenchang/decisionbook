<?xml version="1.0" encoding="utf-8" ?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink" baseProfile="full" height="650" version="1.1" viewBox="0 0 1200 650" width="1200">
  <defs/>
  <title>Advanced agreement design</title>
  <desc>MESOs reveal priorities, contingent contracts manage belief differences, post-settlement settlements improve packages, and governance supports implementation.</desc>
  <rect fill="white" height="650" width="1200" x="0" y="0"/>
  <text fill="#17324d" font-family="Arial, sans-serif" font-size="34" font-weight="bold" text-anchor="middle" x="600" y="48">Better agreements solve more than the bargaining moment</text>
  <circle cx="600" cy="320" fill="#17324d" r="105"/>
  <text fill="white" font-family="Arial, sans-serif" font-size="29" font-weight="bold" text-anchor="middle" x="600" y="310">Better</text>
  <text fill="white" font-family="Arial, sans-serif" font-size="29" font-weight="bold" text-anchor="middle" x="600" y="348">agreement</text>
  <rect fill="#eaf3f8" height="110" rx="16" ry="16" stroke="#2f6f9f" stroke-width="3" width="280" x="95" y="140"/>
  <text fill="#17324d" font-family="Arial, sans-serif" font-size="26" font-weight="bold" text-anchor="middle" x="235.0" y="187.0">MESOs</text>
  <text fill="#66737f" font-family="Arial, sans-serif" font-size="17" font-weight="normal" text-anchor="middle" x="235.0" y="221.0">reveal priorities without asking for one answer</text>
  <line stroke="#2f6f9f" stroke-width="3" x1="235" x2="600" y1="195" y2="320"/>
  <polygon fill="#2f6f9f" points="600,320 585.2803794548303,322.88665394639133 590.1402740779056,308.69576164701135"/>
  <rect fill="#f7f1e8" height="110" rx="16" ry="16" stroke="#c56a2d" stroke-width="3" width="280" x="825" y="140"/>
  <text fill="#17324d" font-family="Arial, sans-serif" font-size="26" font-weight="bold" text-anchor="middle" x="965.0" y="187.0">Contingent contracts</text>
  <text fill="#66737f" font-family="Arial, sans-serif" font-size="17" font-weight="normal" text-anchor="middle" x="965.0" y="221.0">bet on different forecasts</text>
  <line stroke="#c56a2d" stroke-width="3" x1="965" x2="600" y1="195" y2="320"/>
  <polygon fill="#c56a2d" points="600,320 609.8597259220944,308.69576164701135 614.7196205451697,322.88665394639133"/>
  <rect fill="#edf4ed" height="110" rx="16" ry="16" stroke="#447c55" stroke-width="3" width="280" x="95" y="430"/>
  <text fill="#17324d" font-family="Arial, sans-serif" font-size="26" font-weight="bold" text-anchor="middle" x="235.0" y="477.0">Post-settlement search</text>
  <text fill="#66737f" font-family="Arial, sans-serif" font-size="17" font-weight="normal" text-anchor="middle" x="235.0" y="511.0">improve without risking the signed deal</text>
  <line stroke="#447c55" stroke-width="3" x1="235" x2="600" y1="485" y2="320"/>
  <polygon fill="#447c55" points="600,320 591.2523200733,332.1851588377013 585.0735029340523,318.5168663781532"/>
  <rect fill="#f5ebf5" height="110" rx="16" ry="16" stroke="#795a8a" stroke-width="3" width="280" x="825" y="430"/>
  <text fill="#17324d" font-family="Arial, sans-serif" font-size="26" font-weight="bold" text-anchor="middle" x="965.0" y="477.0">Governance</text>
  <text fill="#66737f" font-family="Arial, sans-serif" font-size="17" font-weight="normal" text-anchor="middle" x="965.0" y="511.0">monitor • adapt • repair • learn</text>
  <line stroke="#795a8a" stroke-width="3" x1="965" x2="600" y1="485" y2="320"/>
  <polygon fill="#795a8a" points="600,320 614.9264970659477,318.5168663781532 608.7476799267,332.1851588377013"/>
  <text fill="#66737f" font-family="Arial, sans-serif" font-size="21" font-weight="normal" text-anchor="middle" x="600" y="605">Agreement quality includes allocation, information, implementation, and the capacity to adapt.</text>
</svg>

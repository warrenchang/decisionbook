<svg xmlns="http://www.w3.org/2000/svg" width="760" height="658" viewBox="0 111 760 658" role="img" aria-labelledby="title desc">
<title id="title">Choose an agreement tool for the problem</title><desc id="desc">Four optional negotiation tools and their operating conditions. Multiple equivalent simultaneous offers (MESOs) present several sincere, understandable packages of equivalent value to the proposer. Contingent terms use verifiable outcomes and credible enforcement. Post-settlement settlement protects the signed deal as a fallback, replacing it only with free consent. Implementation and governance specify owners, measures, reviews, responses, and routes to resolution or exit.</desc>
<rect width="760" height="850" fill="white" />
<defs>
<marker id="a" viewBox="0 0 12 10" markerWidth="9" markerHeight="8" refX="11" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L11 5 L1 9 Z" fill="#2f6f9f" /></marker>
<marker id="g" viewBox="0 0 12 10" markerWidth="9" markerHeight="8" refX="11" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L11 5 L1 9 Z" fill="#3f7c59" /></marker>
<marker id="o" viewBox="0 0 12 10" markerWidth="9" markerHeight="8" refX="11" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L11 5 L1 9 Z" fill="#b95f2d" /></marker>
</defs>
<rect x="35" y="135" width="330" height="305" rx="18" fill="#edf5fa" stroke="#2f6f9f" stroke-width="2.5" />
<text x="200" y="174" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" fill="#2f6f9f">Simultaneous package</text>
<text x="200" y="210.4" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#2f6f9f">offers (MESOs)</text>
<text x="200" y="259" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="400" fill="#17324d">Offer multiple packages</text>
<text x="200" y="294" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="400" fill="#17324d">of equivalent value</text>
<text x="200" y="329" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="400" fill="#17324d">to you. Keep each</text>
<text x="200" y="364" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="400" fill="#17324d">offer sincere and</text>
<rect x="395" y="135" width="330" height="305" rx="18" fill="#fff5ec" stroke="#b95f2d" stroke-width="2.5" />
<text x="560" y="174" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#b95f2d">Use later evidence</text>
<text x="560" y="210.4" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#b95f2d">(contingent terms)</text>
<text x="560" y="259" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="400" fill="#17324d">Choose a verifiable</text>
<text x="560" y="294" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="400" fill="#17324d">outcome, fair risk,</text>
<text x="560" y="329" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="400" fill="#17324d">workable incentives,</text>
<text x="560" y="364" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="400" fill="#17324d">credible enforcement.</text>
<rect x="35" y="475" width="330" height="270" rx="18" fill="#edf7ef" stroke="#3f7c59" stroke-width="2.5" />
<text x="200" y="514" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#3f7c59">Post-settlement</text>
<text x="200" y="550.4" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#3f7c59">settlement</text>
<text x="200" y="599" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="400" fill="#17324d">Agree to protect the</text>
<text x="200" y="634" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="400" fill="#17324d">signed deal as a fallback.</text>
<text x="200" y="669" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="400" fill="#17324d">Replace it only with</text>
<text x="200" y="704" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="400" fill="#17324d">everyone’s free consent.</text>
<rect x="395" y="475" width="330" height="270" rx="18" fill="#f4eff8" stroke="#795a8a" stroke-width="2.5" />
<text x="560" y="514" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#795a8a">Implementation</text>
<text x="560" y="550.4" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#795a8a">and governance</text>
<text x="560" y="599" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="400" fill="#17324d">Set an owner, measure,</text>
<text x="560" y="634" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="400" fill="#17324d">review date, response</text>
<text x="560" y="669" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="400" fill="#17324d">to problems, and route</text>
<text x="560" y="704" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="400" fill="#17324d">to resolution or exit.</text>
<text x="200" y="399" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="400" fill="#17324d">easy to understand.</text></svg>

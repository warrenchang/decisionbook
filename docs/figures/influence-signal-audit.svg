<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" baseProfile="full" height="650" version="1.1" viewBox="0 0 1200 650" width="1200">
  <defs />
  <title>Influence signal audit</title>
  <desc>A trigger is evaluated by whether it tracks reality, whether material facts are visible, and whether refusal remains meaningful. The outcome distinguishes informative influence from manipulation.</desc>
  <rect fill="white" height="650" width="1200" x="0" y="0" />
  <text fill="#17324d" font-family="Arial, sans-serif" font-size="34" font-weight="bold" text-anchor="middle" x="600" y="48">A three-question audit for influence triggers</text>
  <rect fill="#f7f1e8" height="110" rx="16" ry="16" stroke="#c56a2d" stroke-width="3" width="200" x="60" y="235" />
  <text fill="#17324d" font-family="Arial, sans-serif" font-size="18.9" font-weight="bold" text-anchor="middle" x="160" y="259.879"><tspan x="160" dy="0">Trigger</tspan><tspan x="160" dy="22.3057">detected</tspan></text>
  <text fill="#66737f" font-family="Arial, sans-serif" font-size="12.36" font-weight="normal" text-anchor="middle" x="160" y="303.994"><tspan x="160" dy="0">authority •</tspan><tspan x="160" dy="14.5845">scarcity • liking</tspan><tspan x="160" dy="14.5845">• reciprocity</tspan></text>
  <path d="M260 290 H330 V207 H385 M330 290 V417 H385" fill="none" stroke="#17324d" stroke-width="4" />
  <polygon fill="#17324d" points="385,207 372,214.5 372,199.5" />
  <polygon fill="#17324d" points="385,417 372,424.5 372,409.5" />
  <rect fill="#eaf3f8" height="105" rx="16" ry="16" stroke="#2f6f9f" stroke-width="3" width="225" x="385" y="155" />
  <text fill="#17324d" font-family="Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="middle" x="497.5" y="187"><tspan x="497.5" dy="0">1. Does the cue</tspan><tspan x="497.5" dy="24">track reality?</tspan></text>
  <text fill="#66737f" font-family="Arial, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" x="497.5" y="237"><tspan x="497.5" dy="0">relevant expertise, demand,</tspan><tspan x="497.5" dy="16">or genuine obligation?</tspan></text>
  <rect fill="#eaf3f8" height="105" rx="16" ry="16" stroke="#2f6f9f" stroke-width="3" width="225" x="385" y="365" />
  <text fill="#17324d" font-family="Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="middle" x="497.5" y="397"><tspan x="497.5" dy="0">2. Are material</tspan><tspan x="497.5" dy="24">facts visible?</tspan></text>
  <text fill="#66737f" font-family="Arial, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" x="497.5" y="447"><tspan x="497.5" dy="0">costs, alternatives,</tspan><tspan x="497.5" dy="16">and uncertainty?</tspan></text>
  <line stroke="#17324d" stroke-width="4" x1="610" x2="760" y1="207" y2="240" />
  <polygon fill="#17324d" points="760,240 745.7015528504548,244.5336970688022 748.9244795905817,229.88403006822585" />
  <line stroke="#17324d" stroke-width="4" x1="610" x2="760" y1="417" y2="360" />
  <polygon fill="#17324d" points="760,360 750.5209382872255,371.62529092304413 745.1926718778719,357.6035372142189" />
  <rect fill="#eaf3f8" height="160" rx="16" ry="16" stroke="#2f6f9f" stroke-width="3" width="220" x="760" y="220" />
  <text fill="#17324d" font-family="Arial, sans-serif" font-size="23.48" font-weight="bold" text-anchor="middle" x="870" y="248.726"><tspan x="870" dy="0">3. Can the</tspan><tspan x="870" dy="27.71">person</tspan><tspan x="870" dy="27.71">refuse?</tspan></text>
  <text fill="#66737f" font-family="Arial, sans-serif" font-size="15.35" font-weight="normal" text-anchor="middle" x="870" y="330.027"><tspan x="870" dy="0">time to think • no</tspan><tspan x="870" dy="18.1181">hidden penalty •</tspan><tspan x="870" dy="18.1181">reversible exit</tspan></text>
  <line stroke="#447c55" stroke-width="4" x1="980" x2="1030" y1="300" y2="220" />
  <polygon fill="#447c55" points="1030,220 1029.475,234.991 1016.755,227.041" />
  <line stroke="#a74343" stroke-width="4" x1="980" x2="1030" y1="300" y2="430" />
  <polygon fill="#a74343" points="1030,430 1018.337,420.568 1032.337,415.183" />
  <rect fill="#edf4ed" height="95" rx="16" ry="16" stroke="#447c55" stroke-width="3" width="150" x="1030" y="145" />
  <text fill="#17324d" font-family="Arial, sans-serif" font-size="26" font-weight="bold" text-anchor="middle" x="1105" y="176.44"><tspan x="1105" dy="0">Legitimate</tspan></text>
  <text fill="#66737f" font-family="Arial, sans-serif" font-size="17" font-weight="normal" text-anchor="middle" x="1105" y="204.56"><tspan x="1105" dy="0">informative +</tspan><tspan x="1105" dy="20.06">agency-preserving</tspan></text>
  <rect fill="#f9e7e7" height="95" rx="16" ry="16" stroke="#a74343" stroke-width="3" width="150" x="1030" y="405" />
  <text fill="#17324d" font-family="Arial, sans-serif" font-size="20.88" font-weight="bold" text-anchor="middle" x="1105" y="431.543"><tspan x="1105" dy="0">Manipulative</tspan></text>
  <text fill="#66737f" font-family="Arial, sans-serif" font-size="13.66" font-weight="normal" text-anchor="middle" x="1105" y="455.114"><tspan x="1105" dy="0">counterfeit</tspan><tspan x="1105" dy="16.1133">cue +</tspan><tspan x="1105" dy="16.1133">obscured exit</tspan></text>
  <text fill="#66737f" font-family="Arial, sans-serif" font-size="22" font-weight="normal" text-anchor="middle" x="600" y="590">Ethical influence remains defensible when its mechanism is made explicit.</text>
</svg>

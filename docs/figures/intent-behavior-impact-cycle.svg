<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="303" viewBox="0 166 1200 303" role="img" aria-labelledby="title desc">
  <title id="title">Intent, behavior, impact, and response form an interpersonal cycle</title>
  <desc id="desc">Four evenly spaced boxes show private intent becoming observable behavior, experienced impact, and the other person's next response. A return arrow shows that the response becomes new input.</desc>
  <defs>
    <marker id="cycle-arrow" viewBox="0 0 10 8" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0.5,0.8 L9,4 L0.5,7.2 Z" fill="#17324d" />
    </marker>
    <marker id="return-arrow" viewBox="0 0 10 8" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0.5,0.8 L9,4 L0.5,7.2 Z" fill="#2b7a78" />
    </marker>
  </defs>
  <rect width="1200" height="650" fill="#ffffff" />
  <rect x="40" y="190" width="240" height="170" rx="18" fill="#eaf3f8" stroke="#2f6f9f" stroke-width="3" />
  <text x="160" y="235" text-anchor="middle" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#17324d">Private intent</text>
  <text x="160" y="272" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="#66737f">aim • fear • constraint</text>
  <text x="160" y="303" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#66737f">partly hidden from</text>
  <text x="160" y="325" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#66737f">the other person</text>

  <rect x="335" y="190" width="240" height="170" rx="18" fill="#eaf3f8" stroke="#2f6f9f" stroke-width="3" />
  <text x="455" y="235" text-anchor="middle" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#17324d">Behavior</text>
  <text x="455" y="272" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="#66737f">words • timing • action</text>
  <text x="455" y="303" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#66737f">what the other</text>
  <text x="455" y="325" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#66737f">person can observe</text>

  <rect x="630" y="190" width="240" height="170" rx="18" fill="#f7f1e8" stroke="#c56a2d" stroke-width="3" />
  <text x="750" y="235" text-anchor="middle" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#17324d">Experienced impact</text>
  <text x="750" y="272" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="#66737f">effect • meaning • emotion</text>
  <text x="750" y="314" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#66737f">felt by the other person</text>

  <rect x="925" y="190" width="240" height="170" rx="18" fill="#edf4ed" stroke="#447c55" stroke-width="3" />
  <text x="1045" y="235" text-anchor="middle" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#17324d">Next response</text>
  <text x="1045" y="272" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="#66737f">question • defense • repair</text>
  <text x="1045" y="303" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#66737f">becomes observable</text>
  <text x="1045" y="325" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#66737f">in the next turn</text>

  <line x1="280" y1="275" x2="335" y2="275" stroke="#17324d" stroke-width="4" marker-end="url(#cycle-arrow)" />
  <line x1="575" y1="275" x2="630" y2="275" stroke="#17324d" stroke-width="4" marker-end="url(#cycle-arrow)" />
  <line x1="870" y1="275" x2="925" y2="275" stroke="#17324d" stroke-width="4" marker-end="url(#cycle-arrow)" />

  <path d="M1045 360 V445 H160 V360" fill="none" stroke="#2b7a78" stroke-width="4" stroke-linejoin="round" marker-end="url(#return-arrow)" />
  </svg>

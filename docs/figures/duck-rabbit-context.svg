<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="720" height="400"
     viewBox="0 0 720 400" role="img" aria-labelledby="title desc">
  <title id="title">One contour, two possible animals</title>
  <desc id="desc">An original ambiguous line drawing. Two long shapes point to the right: they can be seen as the bill of a duck facing right or as the ears of a rabbit facing left. Both interpretations share the same eye and head outline.</desc>
  <rect width="720" height="400" fill="#ffffff"/>
  <!-- Original smooth contour: shared extensions, eye, and head boundary. -->
  <g fill="none" stroke="#17324d" stroke-width="5.5"
     stroke-linecap="round" stroke-linejoin="round">
    <path d="M 244,324
             C 220,303 201,280 183,260
             C 166,242 157,229 153,216
             Q 137,208 154,200
             C 162,156 194,119 238,112
             C 279,106 321,121 349,157
             C 407,150 504,105 571,101
             C 591,100 599,108 584,119
             C 533,144 439,173 375,187
             C 432,185 514,159 579,155
             C 597,154 600,165 584,176
             C 522,213 440,245 374,250
             C 353,269 340,292 335,324"/>
    <path d="M 157,221 Q 169,225 181,222" stroke-width="4"/>
    <path d="M 276,173 Q 289,159 304,167" stroke-width="4"/>
  </g>
  <ellipse cx="291" cy="181" rx="7.5" ry="8.5" fill="#17324d"/>
</svg>

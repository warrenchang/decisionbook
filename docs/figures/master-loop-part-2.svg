<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="610" viewBox="0 0 1400 610" role="img" aria-labelledby="title desc">
<title id="title">The recursive decision loop and its social environment</title>
<desc id="desc">Context and information feed noticing and interpretation, prediction and valuation, option construction, choice, action, and learning. Other minds, institutions, and designed environments can alter every stage.</desc>
<defs>
<marker id="arrow" markerWidth="10" markerHeight="10" refX="8.5" refY="3.5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L9,3.5 L0,7 z" fill="#587189"/></marker>
<marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="8.5" refY="3.5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L9,3.5 L0,7 z" fill="#c44e52"/></marker>
<style>.node-label{font:600 22px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.small{font:500 18px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.outer{font:650 24px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.mode{font:600 18px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}</style>
</defs>
<rect x="18" y="18" width="1364" height="574" rx="28" fill="#f7f9fc" stroke="#9fb2c3" stroke-width="2"/>
<rect x="58" y="48" width="1284" height="112" rx="20" fill="#f0f3f6" stroke="#8ea5b7" stroke-width="3"/>
<text x="700" y="86" class="outer" fill="#183047" text-anchor="middle">OTHER MINDS, INSTITUTIONS, AND DESIGNED ENVIRONMENTS</text>
<text x="700" y="122" class="small" fill="#4c6173" text-anchor="middle">can change what is noticed, predicted, valued, possible, chosen, reinforced, and learned</text>
<path d="M700 160 L700 223" stroke="#587189" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="55" y="226" width="165" height="108" rx="17" fill="#eef2f5" stroke="#9aabb8" stroke-width="2"/>
<text class="node-label" fill="#607282" text-anchor="middle"><tspan x="137" y="274">Context &amp;</tspan><tspan x="137" y="300">information</tspan></text>
<path d="M223 280 L233 280" stroke="#587189" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="238" y="226" width="165" height="108" rx="17" fill="#dceef5" stroke="#236b8e" stroke-width="4"/>
<text class="node-label" fill="#12364a" text-anchor="middle"><tspan x="320" y="274">Notice &amp;</tspan><tspan x="320" y="300">interpret</tspan></text>
<path d="M406 280 L416 280" stroke="#c44e52" stroke-width="4" marker-end="url(#arrow-accent)"/>
<rect x="421" y="226" width="165" height="108" rx="17" fill="#dceef5" stroke="#236b8e" stroke-width="4"/>
<text class="node-label" fill="#12364a" text-anchor="middle"><tspan x="503" y="274">Predict &amp;</tspan><tspan x="503" y="300">value</tspan></text>
<path d="M589 280 L599 280" stroke="#587189" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="604" y="226" width="165" height="108" rx="17" fill="#eef2f5" stroke="#9aabb8" stroke-width="2"/>
<text class="node-label" fill="#607282" text-anchor="middle"><tspan x="686" y="274">Construct</tspan><tspan x="686" y="300">options</tspan></text>
<path d="M772 280 L782 280" stroke="#587189" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="787" y="226" width="165" height="108" rx="17" fill="#eef2f5" stroke="#9aabb8" stroke-width="2"/>
<text class="node-label" fill="#607282" text-anchor="middle"><tspan x="869" y="274">Choose &amp;</tspan><tspan x="869" y="300">commit</tspan></text>
<path d="M955 280 L965 280" stroke="#587189" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="970" y="226" width="165" height="108" rx="17" fill="#eef2f5" stroke="#9aabb8" stroke-width="2"/>
<text class="node-label" fill="#607282" text-anchor="middle"><tspan x="1052" y="287">Act</tspan></text>
<path d="M1138 280 L1148 280" stroke="#587189" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="1153" y="226" width="165" height="108" rx="17" fill="#dceef5" stroke="#236b8e" stroke-width="4"/>
<text class="node-label" fill="#12364a" text-anchor="middle"><tspan x="1235" y="274">Observe &amp;</tspan><tspan x="1235" y="300">learn</tspan></text>
<path d="M1235 338 C1235 398, 137 398, 137 338" fill="none" stroke="#587189" stroke-width="3" marker-end="url(#arrow)"/>
<text x="700" y="425" class="small" fill="#4c6173" text-anchor="middle">feedback can revise the model, the environment, or both</text>
<rect x="140" y="457" width="208" height="58" rx="29" fill="#eef2f5" stroke="#9aabb8" stroke-width="2"/>
<text x="244.0" y="494" class="mode" fill="#4b3a36" text-anchor="middle">ASK</text>
<rect x="368" y="457" width="208" height="58" rx="29" fill="#eef2f5" stroke="#9aabb8" stroke-width="2"/>
<text x="472.0" y="494" class="mode" fill="#4b3a36" text-anchor="middle">INFLUENCE</text>
<rect x="596" y="457" width="208" height="58" rx="29" fill="#eef2f5" stroke="#9aabb8" stroke-width="2"/>
<text x="700.0" y="494" class="mode" fill="#4b3a36" text-anchor="middle">COORDINATE</text>
<rect x="824" y="457" width="208" height="58" rx="29" fill="#eef2f5" stroke="#9aabb8" stroke-width="2"/>
<text x="928.0" y="494" class="mode" fill="#4b3a36" text-anchor="middle">NEGOTIATE</text>
<rect x="1052" y="457" width="208" height="58" rx="29" fill="#eef2f5" stroke="#9aabb8" stroke-width="2"/>
<text x="1156.0" y="494" class="mode" fill="#4b3a36" text-anchor="middle">DESIGN</text>
<text x="700" y="558" class="small" fill="#607282" text-anchor="middle">interaction modes—not a required sequence</text>
</svg>

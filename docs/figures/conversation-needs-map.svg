<svg xmlns="http://www.w3.org/2000/svg" width="760" height="1200" viewBox="0 0 760 1200" role="img" aria-labelledby="title desc" data-layout="compact">
<title id="title">The same words can ask for different kinds of help</title><desc id="desc">The statement I cannot keep doing this may concern a practical problem, emotional support, or social and identity stakes. Ask which help is wanted instead of diagnosing from the words alone.</desc>
<defs><style>
text {font-family:Arial,Helvetica,sans-serif;fill:#183047}
.title {font-family:Georgia,serif;font-size:38px;font-weight:bold}
</style>
<marker id="blue" markerWidth="8" markerHeight="8" refX="8" refY="4" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8 Z" fill="#25678f"/></marker>
<marker id="green" markerWidth="8" markerHeight="8" refX="8" refY="4" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8 Z" fill="#2b7a78"/></marker>
<marker id="warm" markerWidth="8" markerHeight="8" refX="8" refY="4" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8 Z" fill="#b95f2d"/></marker>
</defs><rect width="760" height="1200" fill="white"/>
<text x="380" y="61" text-anchor="middle" font-size="38" font-weight="normal" style="fill:#183047" class="title"><tspan x="380" dy="0">“I can’t keep doing this.”</tspan><tspan x="380" dy="47.12">What kind of help is wanted?</tspan></text>
<rect x="55" y="186" width="650" height="237" rx="18" fill="#f4f7fa" stroke="#25678f" stroke-width="2.5"/>
<text x="380.0" y="229" text-anchor="middle" font-size="32" font-weight="bold" style="fill:#25678f" class=""><tspan x="380.0" dy="0">Practical</tspan></text>
<text x="380.0" y="270" text-anchor="middle" font-size="28" font-weight="normal" style="fill:#183047" class=""><tspan x="380.0" dy="0">Options, information, or a next step.</tspan><tspan x="380.0" dy="34.72">Clarify before trying to solve.</tspan><tspan x="380.0" dy="34.72">“Would it help to think through what to do?”</tspan></text>
<rect x="55" y="476" width="650" height="237" rx="18" fill="#f4f7fa" stroke="#b95f2d" stroke-width="2.5"/>
<text x="380.0" y="519" text-anchor="middle" font-size="32" font-weight="bold" style="fill:#b95f2d" class=""><tspan x="380.0" dy="0">Emotional</tspan></text>
<text x="380.0" y="560" text-anchor="middle" font-size="28" font-weight="normal" style="fill:#183047" class=""><tspan x="380.0" dy="0">Recognition, regulation, or company.</tspan><tspan x="380.0" dy="34.72">Acknowledge before redirecting.</tspan><tspan x="380.0" dy="34.72">“Do you want me to listen or help you think?”</tspan></text>
<rect x="55" y="766" width="650" height="237" rx="18" fill="#f4f7fa" stroke="#2b7a78" stroke-width="2.5"/>
<text x="380.0" y="809" text-anchor="middle" font-size="32" font-weight="bold" style="fill:#2b7a78" class=""><tspan x="380.0" dy="0">Social or identity</tspan></text>
<text x="380.0" y="850" text-anchor="middle" font-size="28" font-weight="normal" style="fill:#183047" class=""><tspan x="380.0" dy="0">Respect, belonging, role, or fairness.</tspan><tspan x="380.0" dy="34.72">Explore the relational stake carefully.</tspan><tspan x="380.0" dy="34.72">“What did this seem to say about you or us?”</tspan></text>
<text x="380" y="1101" text-anchor="middle" font-size="28" font-weight="normal" style="fill:#183047" class=""><tspan x="380" dy="0">Ask what would help, then listen and update.</tspan><tspan x="380" dy="34.72">The same conversation can involve several needs.</tspan></text>
</svg>

<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">One sentence can carry three different conversation needs</title>
  <desc id="desc">A shared sentence branches evenly into practical, emotional, and social or identity needs. Each branch offers a diagnostic question rather than assuming the need.</desc>
  <defs>
    <marker id="branch-arrow" viewBox="0 0 10 8" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0.5,0.8 L9,4 L0.5,7.2 Z" fill="#17324d"/>
    </marker>
  </defs>
  <rect width="1200" height="650" fill="#ffffff"/>
  <text x="600" y="46" text-anchor="middle" font-family="Arial, sans-serif" font-size="32" font-weight="700" fill="#17324d">The same words can ask for different kinds of help</text>
  <rect x="410" y="82" width="380" height="78" rx="39" fill="#17324d"/>
  <text x="600" y="116" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" fill="#ffffff">“I can’t keep doing this.”</text>
  <text x="600" y="142" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#d9e6ee">Do not diagnose the need from the sentence alone.</text>

  <path d="M600 160 V194 H200 V218" fill="none" stroke="#17324d" stroke-width="3" marker-end="url(#branch-arrow)"/>
  <path d="M600 160 V218" fill="none" stroke="#17324d" stroke-width="3" marker-end="url(#branch-arrow)"/>
  <path d="M600 160 V194 H1000 V218" fill="none" stroke="#17324d" stroke-width="3" marker-end="url(#branch-arrow)"/>

  <rect x="40" y="226" width="320" height="300" rx="18" fill="#eaf3f8" stroke="#2f6f9f" stroke-width="3"/>
  <circle cx="200" cy="274" r="28" fill="#2f6f9f"/>
  <text x="200" y="283" text-anchor="middle" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="#ffffff">1</text>
  <text x="200" y="327" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#17324d">Practical</text>
  <text x="200" y="357" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="#66737f">options • information • next step</text>
  <line x1="78" y1="380" x2="322" y2="380" stroke="#b9ccd8" stroke-width="2"/>
  <text x="200" y="414" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#17324d">First move</text>
  <text x="200" y="444" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#66737f">Clarify the problem before solving.</text>
  <text x="200" y="481" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-style="italic" fill="#2f6f9f">“Would it help to think</text>
  <text x="200" y="503" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-style="italic" fill="#2f6f9f">through what to do?”</text>

  <rect x="440" y="226" width="320" height="300" rx="18" fill="#f7f1e8" stroke="#c56a2d" stroke-width="3"/>
  <circle cx="600" cy="274" r="28" fill="#c56a2d"/>
  <text x="600" y="283" text-anchor="middle" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="#ffffff">2</text>
  <text x="600" y="327" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#17324d">Emotional</text>
  <text x="600" y="357" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="#66737f">recognition • regulation • company</text>
  <line x1="478" y1="380" x2="722" y2="380" stroke="#dcc7af" stroke-width="2"/>
  <text x="600" y="414" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#17324d">First move</text>
  <text x="600" y="444" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#66737f">Acknowledge before redirecting.</text>
  <text x="600" y="481" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-style="italic" fill="#c56a2d">“Do you want me to listen,</text>
  <text x="600" y="503" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-style="italic" fill="#c56a2d">or help you think?”</text>

  <rect x="840" y="226" width="320" height="300" rx="18" fill="#edf4ed" stroke="#447c55" stroke-width="3"/>
  <circle cx="1000" cy="274" r="28" fill="#447c55"/>
  <text x="1000" y="283" text-anchor="middle" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="#ffffff">3</text>
  <text x="1000" y="327" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#17324d">Social or identity</text>
  <text x="1000" y="357" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="#66737f">respect • belonging • role • fairness</text>
  <line x1="878" y1="380" x2="1122" y2="380" stroke="#bfd0c2" stroke-width="2"/>
  <text x="1000" y="414" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#17324d">First move</text>
  <text x="1000" y="444" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#66737f">Name the relational stake carefully.</text>
  <text x="1000" y="481" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-style="italic" fill="#447c55">“What did this seem to say</text>
  <text x="1000" y="503" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-style="italic" fill="#447c55">about you or us?”</text>

  <rect x="190" y="560" width="820" height="52" rx="26" fill="#ffffff" stroke="#2b7a78" stroke-width="2" stroke-dasharray="7 6"/>
  <text x="600" y="592" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#17324d">Diagnostic move: ask which kind of help would be useful, then update.</text>
</svg>

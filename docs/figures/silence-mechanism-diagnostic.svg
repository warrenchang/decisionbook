<svg xmlns="http://www.w3.org/2000/svg" width="760" height="1300" viewBox="0 0 760 1300" role="img" aria-labelledby="title desc" data-layout="compact">
<title id="title">Silence can have different causes</title><desc id="desc">Five alternative diagnoses pair a question with a possible safeguard: directive authority, suppressed dissent, shared-information bias, pluralistic ignorance, and diffusion of responsibility. A safeguard should be tested against the diagnosed mechanism.</desc>
<defs><style>
text {font-family:Arial,Helvetica,sans-serif;fill:#183047}
.title {font-family:Georgia,serif;font-size:38px;font-weight:bold}
</style>
<marker id="blue" markerWidth="8" markerHeight="8" refX="8" refY="4" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8 Z" fill="#25678f"/></marker>
<marker id="green" markerWidth="8" markerHeight="8" refX="8" refY="4" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8 Z" fill="#2b7a78"/></marker>
<marker id="warm" markerWidth="8" markerHeight="8" refX="8" refY="4" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8 Z" fill="#b95f2d"/></marker>
</defs><rect width="760" height="1300" fill="white"/>
<text x="380" y="56" text-anchor="middle" font-size="38" font-weight="normal" style="fill:#183047" class="title"><tspan x="380" dy="0">Silence can have</tspan><tspan x="380" dy="47.12">different causes</tspan></text>
<text x="380" y="156" text-anchor="middle" font-size="28" font-weight="normal" style="fill:#183047" class=""><tspan x="380" dy="0">Diagnose before choosing a safeguard.</tspan></text>
<rect x="40" y="210" width="680" height="164" rx="18" fill="#f4f7fa" stroke="#25678f" stroke-width="2.5"/>
<text x="380.0" y="253" text-anchor="middle" font-size="31" font-weight="bold" style="fill:#25678f" class=""><tspan x="380.0" dy="0">Directive authority</tspan></text>
<text x="380.0" y="294" text-anchor="middle" font-size="28" font-weight="normal" style="fill:#183047" class=""><tspan x="380.0" dy="0">Did the leader signal the answer first?</tspan><tspan x="380.0" dy="34.72">Collect judgments before the leader speaks.</tspan></text>
<rect x="40" y="407" width="680" height="164" rx="18" fill="#f4f7fa" stroke="#2b7a78" stroke-width="2.5"/>
<text x="380.0" y="450" text-anchor="middle" font-size="31" font-weight="bold" style="fill:#2b7a78" class=""><tspan x="380.0" dy="0">Suppressed dissent</tspan></text>
<text x="380.0" y="491" text-anchor="middle" font-size="28" font-weight="normal" style="fill:#183047" class=""><tspan x="380.0" dy="0">Are objections privately held but costly to voice?</tspan><tspan x="380.0" dy="34.72">Protect a way to record the minority view.</tspan></text>
<rect x="40" y="604" width="680" height="164" rx="18" fill="#f4f7fa" stroke="#25678f" stroke-width="2.5"/>
<text x="380.0" y="647" text-anchor="middle" font-size="31" font-weight="bold" style="fill:#25678f" class=""><tspan x="380.0" dy="0">Shared-information bias</tspan></text>
<text x="380.0" y="688" text-anchor="middle" font-size="28" font-weight="normal" style="fill:#183047" class=""><tspan x="380.0" dy="0">Is unique evidence missing from the discussion?</tspan><tspan x="380.0" dy="34.72">Give unshared evidence a dedicated round.</tspan></text>
<rect x="40" y="801" width="680" height="164" rx="18" fill="#f4f7fa" stroke="#2b7a78" stroke-width="2.5"/>
<text x="380.0" y="844" text-anchor="middle" font-size="31" font-weight="bold" style="fill:#2b7a78" class=""><tspan x="380.0" dy="0">Pluralistic ignorance</tspan></text>
<text x="380.0" y="885" text-anchor="middle" font-size="28" font-weight="normal" style="fill:#183047" class=""><tspan x="380.0" dy="0">Do private views differ from assumed group views?</tspan><tspan x="380.0" dy="34.72">Elicit both privately, then compare distributions.</tspan></text>
<rect x="40" y="998" width="680" height="164" rx="18" fill="#f4f7fa" stroke="#25678f" stroke-width="2.5"/>
<text x="380.0" y="1041" text-anchor="middle" font-size="31" font-weight="bold" style="fill:#25678f" class=""><tspan x="380.0" dy="0">Diffusion of responsibility</tspan></text>
<text x="380.0" y="1082" text-anchor="middle" font-size="28" font-weight="normal" style="fill:#183047" class=""><tspan x="380.0" dy="0">Does each person expect someone else to act?</tspan><tspan x="380.0" dy="34.72">Name an owner, trigger, deadline, and backup.</tspan></text>
<text x="380" y="1256" text-anchor="middle" font-size="28" font-weight="normal" style="fill:#183047" class=""><tspan x="380" dy="0">Test whether the safeguard addresses the problem.</tspan></text>
</svg>

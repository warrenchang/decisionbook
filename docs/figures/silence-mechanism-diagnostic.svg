<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1465" viewBox="0 0 720 1465" role="img" aria-labelledby="title desc">
  <title id="title">Silence is not one mechanism</title>
  <desc id="desc">Five vertically arranged diagnostic cards distinguish directive authority, suppressed dissent, shared-information bias, pluralistic ignorance, and diffusion of responsibility. Each card pairs a test with a bounded safeguard. A boundary note says silence, cohesion, unanimity, and a bad outcome do not by themselves diagnose groupthink.</desc>
  <style>
    .title{font:700 32px Arial,sans-serif;fill:#17324d}
    .subtitle{font:22px Arial,sans-serif;fill:#536879}
    .head{font:700 25px Arial,sans-serif;fill:#17324d}
    .body{font:22px Arial,sans-serif;fill:#314b60}
    .label{font:700 22px Arial,sans-serif;fill:#2f6f9f}
    .boundary{font:700 23px Arial,sans-serif;fill:#8b3e3e}
  </style>
  <rect width="720" height="1465" fill="#ffffff"/>
  <text class="title" x="360" y="48" text-anchor="middle">Silence is not one mechanism</text>
  <text class="subtitle" x="360" y="82" text-anchor="middle">Start with an observation. Diagnose the pathway</text>
  <text class="subtitle" x="360" y="110" text-anchor="middle">before choosing a remedy.</text>

  <rect x="30" y="135" width="660" height="112" rx="20" fill="#fff1f1" stroke="#b34949" stroke-width="2.5"/>
  <text class="boundary" x="360" y="174" text-anchor="middle">Do not diagnose “groupthink” from</text>
  <text class="body" x="360" y="213" text-anchor="middle">silence · cohesion · apparent unanimity · a bad outcome</text>

  <rect x="30" y="275" width="660" height="205" rx="22" fill="#f6f9fb" stroke="#9eb1bf" stroke-width="2.5"/>
  <rect x="30" y="275" width="12" height="205" rx="6" fill="#365f83"/>
  <text class="head" x="60" y="313">Directive authority</text>
  <text class="label" x="60" y="354">Test</text>
  <text class="body" x="130" y="354">Did the leader signal an answer first or raise</text>
  <text class="body" x="130" y="385">the cost of disagreement?</text>
  <text class="label" x="60" y="425">Safeguard</text>
  <text class="body" x="175" y="425">Private judgments first; leader speaks last;</text>
  <text class="body" x="175" y="456">retain an escalation route.</text>

  <rect x="30" y="500" width="660" height="205" rx="22" fill="#fbf7ef" stroke="#c79a4a" stroke-width="2.5"/>
  <rect x="30" y="500" width="12" height="205" rx="6" fill="#9a6a1f"/>
  <text class="head" x="60" y="538">Suppressed dissent</text>
  <text class="label" x="60" y="579">Test</text>
  <text class="body" x="130" y="579">Do private objections exist while public voicing</text>
  <text class="body" x="130" y="610">is personally costly?</text>
  <text class="label" x="60" y="650">Safeguard</text>
  <text class="body" x="175" y="650">Elicit concerns privately and preserve the</text>
  <text class="body" x="175" y="681">unresolved minority view.</text>

  <rect x="30" y="725" width="660" height="205" rx="22" fill="#f0f7f1" stroke="#4d8660" stroke-width="2.5"/>
  <rect x="30" y="725" width="12" height="205" rx="6" fill="#39704d"/>
  <text class="head" x="60" y="763">Shared-information bias</text>
  <text class="label" x="60" y="804">Test</text>
  <text class="body" x="130" y="804">Does discussion repeat common evidence while</text>
  <text class="body" x="130" y="835">unique evidence remains unpooled?</text>
  <text class="label" x="60" y="875">Safeguard</text>
  <text class="body" x="175" y="875">Map who holds which evidence; give unique</text>
  <text class="body" x="175" y="906">information a dedicated round.</text>

  <rect x="30" y="950" width="660" height="205" rx="22" fill="#f3f0f8" stroke="#7b64a2" stroke-width="2.5"/>
  <rect x="30" y="950" width="12" height="205" rx="6" fill="#67518b"/>
  <text class="head" x="60" y="988">Pluralistic ignorance</text>
  <text class="label" x="60" y="1029">Test</text>
  <text class="body" x="130" y="1029">Do private views differ from what members think</text>
  <text class="body" x="130" y="1060">the group's private view is?</text>
  <text class="label" x="60" y="1100">Safeguard</text>
  <text class="body" x="175" y="1100">Elicit both judgments privately, then reveal</text>
  <text class="body" x="175" y="1131">the two distributions.</text>

  <rect x="30" y="1175" width="660" height="205" rx="22" fill="#eef5f8" stroke="#4d7b90" stroke-width="2.5"/>
  <rect x="30" y="1175" width="12" height="205" rx="6" fill="#3f6c80"/>
  <text class="head" x="60" y="1213">Diffusion of responsibility</text>
  <text class="label" x="60" y="1254">Test</text>
  <text class="body" x="130" y="1254">Does each possible actor expect somebody else</text>
  <text class="body" x="130" y="1285">to notice, decide, or act?</text>
  <text class="label" x="60" y="1325">Safeguard</text>
  <text class="body" x="175" y="1325">Name one owner, trigger, deadline, receipt,</text>
  <text class="body" x="175" y="1356">and backup escalation.</text>

  <text class="subtitle" x="360" y="1418" text-anchor="middle">A matched safeguard is a testable intervention,</text>
  <text class="subtitle" x="360" y="1446" text-anchor="middle">not a guarantee of a good decision.</text>
</svg>

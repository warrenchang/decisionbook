<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="700" viewBox="0 0 1600 700" role="img" aria-labelledby="title desc">
  <title id="title">Decision-making according to behavioral evidence</title>
  <desc id="desc">Presented information enters judgment. Prediction, valuation, and selection and interpretation interact inside judgment. External context shapes what is presented, internal state and models shape interpretation, and an outcome provides feedback that may update the internal model.</desc>
  <defs>
    <style><![CDATA[
      .heading{font:700 28px Arial,sans-serif;fill:#0b2c5f}
      .label{font:700 24px Arial,sans-serif;fill:#0b2c5f}
      .small{font:21px Arial,sans-serif;fill:#334}
      .white{font:700 24px Arial,sans-serif;fill:#fff}
      .white-small{font:21px Arial,sans-serif;fill:#eaf2ff}
      .red{font:700 24px Arial,sans-serif;fill:#c62828}
      .red-small{font:21px Arial,sans-serif;fill:#5b3131}
      .node{fill:#edf4fb;stroke:#123c86;stroke-width:2.5}
      .dark{fill:#123f8c;stroke:#123c86;stroke-width:2.5}
      .context{fill:#fff5f5;stroke:#d62828;stroke-width:2.5}
      .flow{fill:none;stroke:#123c86;stroke-width:4}
      .context-flow{fill:none;stroke:#d62828;stroke-width:4}
    ]]></style>
    <marker id="blue-arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto-start-reverse" markerUnits="userSpaceOnUse">
      <path d="M0 0 L12 6 L0 12 Z" fill="#123c86"/>
    </marker>
    <marker id="blue-double-arrow" markerWidth="14" markerHeight="14" refX="14" refY="7" orient="auto-start-reverse" markerUnits="userSpaceOnUse">
      <path d="M0 0 L14 7 L0 14 Z" fill="#123c86"/>
    </marker>
    <marker id="red-arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0 L12 6 L0 12 Z" fill="#d62828"/>
    </marker>
  </defs>

  <rect width="1600" height="700" fill="#fff"/>

  <!-- Containers -->
  <rect x="370" y="45" width="770" height="595" rx="38" fill="none" stroke="#123c86" stroke-width="3" stroke-dasharray="12 10"/>
  <rect x="410" y="95" width="700" height="330" rx="32" fill="none" stroke="#123c86" stroke-width="3" stroke-dasharray="12 10"/>
  <rect x="612" y="66" width="286" height="36" rx="18" fill="#fff"/>
  <text x="755" y="35" class="heading" text-anchor="middle">Decision-maker’s internal process</text>
  <text x="755" y="88" class="heading" text-anchor="middle">Judgment</text>

  <!-- Connectors are drawn before nodes so no line crosses a label. -->
  <path d="M310 278 L620 335" class="flow" stroke-width="4" marker-end="url(#blue-arrow)"/>
  <path d="M180 470 V335" class="context-flow" stroke-width="4" marker-end="url(#red-arrow)"/>
  <path d="M340 540 H545" class="context-flow" stroke-width="4" marker-end="url(#red-arrow)"/>
  <path d="M695 170 H805" class="flow" stroke-width="4" marker-start="url(#blue-double-arrow)" marker-end="url(#blue-double-arrow)"/>
  <path d="M585 215 L685 275" class="flow" stroke-width="4" marker-start="url(#blue-double-arrow)" marker-end="url(#blue-double-arrow)"/>
  <path d="M915 215 L815 275" class="flow" stroke-width="4" marker-start="url(#blue-double-arrow)" marker-end="url(#blue-double-arrow)"/>
  <path d="M750 470 V395" class="context-flow" stroke-width="4" marker-end="url(#red-arrow)"/>
  <path d="M880 335 L1180 290" class="flow" stroke-width="4" marker-end="url(#blue-arrow)"/>
  <path d="M1360 290 H1400" class="flow" stroke-width="4" marker-end="url(#blue-arrow)"/>
  <path d="M1485 340 V500" class="flow" stroke-width="4" marker-end="url(#blue-arrow)"/>
  <path d="M1190 545 H955" class="flow" stroke-width="4" marker-end="url(#blue-arrow)"/>

  <!-- Inputs and contexts -->
  <rect x="20" y="220" width="290" height="115" rx="18" class="node"/>
  <text x="165" y="258" class="label" text-anchor="middle">
    <tspan x="165" dy="0">Presented information</tspan>
    <tspan x="165" dy="24">on alternatives</tspan>
  </text>
  <text x="165" y="310" class="small" text-anchor="middle">what becomes available</text>

  <rect x="20" y="470" width="320" height="140" rx="18" class="context"/>
  <text x="180" y="510" class="red" text-anchor="middle">External context</text>
  <text x="180" y="540" class="red-small" text-anchor="middle">
    <tspan x="180" dy="0">frames, defaults, and option sets</tspan>
    <tspan x="180" dy="23">information format and friction</tspan>
    <tspan x="180" dy="23">social and contextual cues</tspan>
  </text>

  <rect x="545" y="470" width="410" height="140" rx="18" class="context"/>
  <text x="750" y="506" class="red" text-anchor="middle">Internal state and model</text>
  <text x="750" y="535" class="red-small" text-anchor="middle">
    <tspan x="750" dy="0">attention and cognitive resources</tspan>
    <tspan x="750" dy="23">beliefs, goals, affect, and memory</tspan>
    <tspan x="750" dy="23">identity and a causal model</tspan>
  </text>

  <!-- Judgment -->
  <rect x="475" y="125" width="220" height="90" rx="14" class="dark"/>
  <text x="585" y="163" class="white" text-anchor="middle">Prediction</text>
  <text x="585" y="188" class="white-small" text-anchor="middle">what is likely?</text>

  <rect x="805" y="125" width="220" height="90" rx="14" class="dark"/>
  <text x="915" y="163" class="white" text-anchor="middle">Valuation</text>
  <text x="915" y="188" class="white-small" text-anchor="middle">what matters?</text>

  <rect x="620" y="275" width="260" height="120" rx="14" class="dark"/>
  <text x="750" y="319" class="white" text-anchor="middle">
    <tspan x="750" dy="0">Selection and</tspan>
    <tspan x="750" dy="24">interpretation</tspan>
  </text>
  <text x="750" y="374" class="white-small" text-anchor="middle">what becomes evidence?</text>

  <!-- Choice, outcome, and learning -->
  <rect x="1180" y="240" width="180" height="100" rx="16" class="node"/>
  <text x="1270" y="282" class="label" text-anchor="middle">Choice</text>
  <text x="1270" y="308" class="small" text-anchor="middle">commit to action</text>

  <rect x="1400" y="240" width="170" height="100" rx="16" class="node"/>
  <text x="1485" y="282" class="label" text-anchor="middle">Outcome</text>
  <text x="1485" y="308" class="small" text-anchor="middle">what happened?</text>

  <path d="M1230 500 H1480 L1520 545 L1480 590 H1230 L1190 545 Z" class="node"/>
  <text x="1355" y="539" class="label" font-size="22" text-anchor="middle">Feedback / learning</text>
  <text x="1355" y="566" class="small" text-anchor="middle">may update the internal model</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="760" height="1240" viewBox="0 0 760 1240" role="img" aria-labelledby="title desc" data-layout="compact">
<title id="title">How context enters a decision</title><desc id="desc">External context shapes presented information and internal state. Presented information and internal state shape selection and interpretation. Selection, prediction, and valuation interact within judgment. Choice produces an outcome; feedback can revise the internal state and model. The arrows are selected influences, not a complete causal model.</desc>
<defs><style>
text {font-family:Arial,Helvetica,sans-serif;fill:#183047}
.title {font-family:Georgia,serif;font-size:38px;font-weight:bold}
</style>
<marker id="blue" markerWidth="8" markerHeight="8" refX="8" refY="4" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8 Z" fill="#25678f"/></marker>
<marker id="green" markerWidth="8" markerHeight="8" refX="8" refY="4" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8 Z" fill="#2b7a78"/></marker>
<marker id="warm" markerWidth="8" markerHeight="8" refX="8" refY="4" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8 Z" fill="#b95f2d"/></marker>
</defs><rect width="760" height="1240" fill="white"/>
<text x="380" y="52" text-anchor="middle" font-size="38" font-weight="normal" style="fill:#183047" class="title"><tspan x="380" dy="0">How context enters a decision</tspan></text>
<rect x="35" y="92" width="305" height="187" rx="18" fill="#fff8f3" stroke="#b95f2d" stroke-width="2.5"/>
<text x="187.5" y="135" text-anchor="middle" font-size="30" font-weight="bold" style="fill:#b95f2d" class=""><tspan x="187.5" dy="0">External context</tspan></text>
<text x="187.5" y="176" text-anchor="middle" font-size="28" font-weight="normal" style="fill:#183047" class=""><tspan x="187.5" dy="0">Frames and defaults</tspan><tspan x="187.5" dy="34.72">Format and friction</tspan><tspan x="187.5" dy="34.72">Social cues</tspan></text>
<rect x="420" y="92" width="305" height="187" rx="18" fill="#fff8f3" stroke="#b95f2d" stroke-width="2.5"/>
<text x="572.5" y="135" text-anchor="middle" font-size="30" font-weight="bold" style="fill:#b95f2d" class=""><tspan x="572.5" dy="0">Internal state</tspan></text>
<text x="572.5" y="176" text-anchor="middle" font-size="28" font-weight="normal" style="fill:#183047" class=""><tspan x="572.5" dy="0">Beliefs, goals, affect</tspan><tspan x="572.5" dy="34.72">Memory and identity</tspan><tspan x="572.5" dy="34.72">Attention and models</tspan></text>
<path d="M340 183 H420" fill="none" stroke="#b95f2d" stroke-width="3" stroke-linejoin="round" marker-end="url(#warm)"/>
<rect x="35" y="332" width="305" height="126" rx="18" fill="#f4f7fa" stroke="#25678f" stroke-width="2.5"/>
<text x="187.5" y="375" text-anchor="middle" font-size="28" font-weight="bold" style="fill:#25678f" class=""><tspan x="187.5" dy="0">What is presented</tspan></text>
<text x="187.5" y="416" text-anchor="middle" font-size="28" font-weight="normal" style="fill:#183047" class=""><tspan x="187.5" dy="0">About the alternatives</tspan></text>
<path d="M188 279 V332" fill="none" stroke="#b95f2d" stroke-width="3" stroke-linejoin="round" marker-end="url(#warm)"/>
<rect x="45" y="497" width="670" height="381" rx="25" fill="none" stroke="#25678f" stroke-width="2.5" stroke-dasharray="9 7"/>
<text x="380" y="536" text-anchor="middle" font-size="32" font-weight="bold" style="fill:#183047" class=""><tspan x="380" dy="0">Judgment</tspan></text>
<rect x="165" y="565" width="430" height="115" rx="18" fill="#f4f7fa" stroke="#25678f" stroke-width="2.5"/>
<text x="380.0" y="608" text-anchor="middle" font-size="28" font-weight="bold" style="fill:#25678f" class=""><tspan x="380.0" dy="0">Selection and interpretation</tspan></text>
<text x="380.0" y="649" text-anchor="middle" font-size="28" font-weight="normal" style="fill:#183047" class=""><tspan x="380.0" dy="0">What becomes evidence?</tspan></text>
<rect x="70" y="742" width="265" height="110" rx="18" fill="#f4f7fa" stroke="#25678f" stroke-width="2.5"/>
<text x="202.5" y="785" text-anchor="middle" font-size="32" font-weight="bold" style="fill:#25678f" class=""><tspan x="202.5" dy="0">Prediction</tspan></text>
<text x="202.5" y="826" text-anchor="middle" font-size="28" font-weight="normal" style="fill:#183047" class=""><tspan x="202.5" dy="0">What is likely?</tspan></text>
<rect x="425" y="742" width="265" height="110" rx="18" fill="#f4f7fa" stroke="#25678f" stroke-width="2.5"/>
<text x="557.5" y="785" text-anchor="middle" font-size="32" font-weight="bold" style="fill:#25678f" class=""><tspan x="557.5" dy="0">Valuation</tspan></text>
<text x="557.5" y="826" text-anchor="middle" font-size="28" font-weight="normal" style="fill:#183047" class=""><tspan x="557.5" dy="0">What matters?</tspan></text>
<path d="M188 458 V477 H285 V565" fill="none" stroke="#25678f" stroke-width="3" stroke-linejoin="round" marker-end="url(#blue)"/>
<path d="M570 279 V477 H480 V565" fill="none" stroke="#b95f2d" stroke-width="3" stroke-linejoin="round" marker-end="url(#warm)"/>
<path d="M280 680 L205 742" fill="none" stroke="#25678f" stroke-width="3" stroke-linejoin="round" marker-end="url(#blue)" marker-start="url(#blue)"/>
<path d="M480 680 L555 742" fill="none" stroke="#25678f" stroke-width="3" stroke-linejoin="round" marker-end="url(#blue)" marker-start="url(#blue)"/>
<path d="M335 797 H425" fill="none" stroke="#25678f" stroke-width="3" stroke-linejoin="round" marker-end="url(#blue)" marker-start="url(#blue)"/>
<rect x="70" y="940" width="265" height="110" rx="18" fill="#f4f7fa" stroke="#25678f" stroke-width="2.5"/>
<text x="202.5" y="983" text-anchor="middle" font-size="32" font-weight="bold" style="fill:#25678f" class=""><tspan x="202.5" dy="0">Choice</tspan></text>
<text x="202.5" y="1024" text-anchor="middle" font-size="28" font-weight="normal" style="fill:#183047" class=""><tspan x="202.5" dy="0">Commit to action</tspan></text>
<rect x="425" y="940" width="265" height="110" rx="18" fill="#f4f7fa" stroke="#25678f" stroke-width="2.5"/>
<text x="557.5" y="983" text-anchor="middle" font-size="32" font-weight="bold" style="fill:#25678f" class=""><tspan x="557.5" dy="0">Outcome</tspan></text>
<text x="557.5" y="1024" text-anchor="middle" font-size="28" font-weight="normal" style="fill:#183047" class=""><tspan x="557.5" dy="0">What happened?</tspan></text>
<path d="M205 878 V940" fill="none" stroke="#25678f" stroke-width="3" stroke-linejoin="round" marker-end="url(#blue)"/>
<path d="M335 995 H425" fill="none" stroke="#25678f" stroke-width="3" stroke-linejoin="round" marker-end="url(#blue)"/>
<rect x="405" y="1110" width="310" height="103" rx="18" fill="#edf7f3" stroke="#2b7a78" stroke-width="2.5"/>
<text x="560.0" y="1153" text-anchor="middle" font-size="32" font-weight="bold" style="fill:#2b7a78" class=""><tspan x="560.0" dy="0">Feedback</tspan></text>
<text x="560.0" y="1194" text-anchor="middle" font-size="28" font-weight="normal" style="fill:#183047" class=""><tspan x="560.0" dy="0">May revise the model</tspan></text>
<path d="M555 1050 V1110" fill="none" stroke="#2b7a78" stroke-width="3" stroke-linejoin="round" marker-end="url(#green)"/>
<path d="M715 1163 H746 V187 H725" fill="none" stroke="#2b7a78" stroke-width="3" stroke-linejoin="round" marker-end="url(#green)"/>
<text x="192" y="1136" text-anchor="middle" font-size="28" font-weight="normal" style="fill:#183047" class=""><tspan x="192" dy="0">Selected influences,</tspan><tspan x="192" dy="34.72">not a fixed mental</tspan><tspan x="192" dy="34.72">sequence.</tspan></text>
</svg>

<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">Confidence is not evidence; questions can add evidence</title>
  <desc id="desc">The left panel redraws task-specific percentages from Kruger and colleagues' email and voice study. The right panel contrasts imagining another person's perspective with asking, listening, and verifying it.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 Z" fill="#17324d"/>
    </marker>
  </defs>
  <rect width="1200" height="700" fill="#ffffff"/>
  <text x="600" y="46" text-anchor="middle" font-family="Arial, sans-serif" font-size="32" font-weight="700" fill="#17324d">Confidence is not evidence; questions can add evidence</text>

  <rect x="35" y="78" width="545" height="548" rx="18" fill="#f7fafc" stroke="#c8d7e2" stroke-width="2"/>
  <text x="307.5" y="116" text-anchor="middle" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#17324d">Tone decoding in one sarcasm task</text>
  <text x="307.5" y="143" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#66737f">Study 2, 29 dyads — task-specific, not a universal channel score</text>

  <g font-family="Arial, sans-serif" font-size="14" fill="#66737f">
    <line x1="105" y1="480" x2="545" y2="480" stroke="#9babb7" stroke-width="2"/>
    <line x1="105" y1="410" x2="545" y2="410" stroke="#d9e2e8"/>
    <line x1="105" y1="340" x2="545" y2="340" stroke="#d9e2e8"/>
    <line x1="105" y1="270" x2="545" y2="270" stroke="#d9e2e8"/>
    <line x1="105" y1="200" x2="545" y2="200" stroke="#d9e2e8"/>
    <text x="93" y="485" text-anchor="end">0</text>
    <text x="93" y="415" text-anchor="end">25</text>
    <text x="93" y="345" text-anchor="end">50</text>
    <text x="93" y="275" text-anchor="end">75</text>
    <text x="93" y="205" text-anchor="end">100%</text>
  </g>

  <g font-family="Arial, sans-serif">
    <rect x="145" y="261.6" width="42" height="218.4" rx="5" fill="#7fb5c8"/>
    <rect x="194" y="230.8" width="42" height="249.2" rx="5" fill="#2f6f9f"/>
    <rect x="243" y="323.2" width="42" height="156.8" rx="5" fill="#c56a2d"/>
    <text x="166" y="253" text-anchor="middle" font-size="15" font-weight="700" fill="#17324d">78.0</text>
    <text x="215" y="222" text-anchor="middle" font-size="15" font-weight="700" fill="#17324d">89.0</text>
    <text x="264" y="315" text-anchor="middle" font-size="15" font-weight="700" fill="#17324d">56.0</text>
    <text x="215" y="511" text-anchor="middle" font-size="19" font-weight="700" fill="#17324d">Email</text>

    <rect x="365" y="261.9" width="42" height="218.1" rx="5" fill="#7fb5c8"/>
    <rect x="414" y="225.8" width="42" height="254.2" rx="5" fill="#2f6f9f"/>
    <rect x="463" y="275.3" width="42" height="204.7" rx="5" fill="#c56a2d"/>
    <text x="386" y="253" text-anchor="middle" font-size="15" font-weight="700" fill="#17324d">77.9</text>
    <text x="435" y="217" text-anchor="middle" font-size="15" font-weight="700" fill="#17324d">90.8</text>
    <text x="484" y="267" text-anchor="middle" font-size="15" font-weight="700" fill="#17324d">73.1</text>
    <text x="435" y="511" text-anchor="middle" font-size="19" font-weight="700" fill="#17324d">Voice</text>
  </g>

  <g font-family="Arial, sans-serif" font-size="15" fill="#17324d">
    <rect x="112" y="548" width="18" height="18" rx="3" fill="#7fb5c8"/><text x="138" y="562">sender forecast</text>
    <rect x="275" y="548" width="18" height="18" rx="3" fill="#2f6f9f"/><text x="301" y="562">receiver forecast</text>
    <rect x="445" y="548" width="18" height="18" rx="3" fill="#c56a2d"/><text x="471" y="562">actual</text>
  </g>
  <text x="307.5" y="603" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#66737f">Voice improved actual decoding; confidence remained high in both channels.</text>

  <rect x="610" y="78" width="555" height="548" rx="18" fill="#f7fafc" stroke="#c8d7e2" stroke-width="2"/>
  <text x="887.5" y="116" text-anchor="middle" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#17324d">How to learn another person’s perspective</text>

  <rect x="650" y="165" width="195" height="96" rx="14" fill="#f7f1e8" stroke="#c56a2d" stroke-width="3"/>
  <text x="747.5" y="202" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#17324d">Imagine only</text>
  <text x="747.5" y="229" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#66737f">start from my model</text>
  <line x1="845" y1="213" x2="925" y2="213" stroke="#17324d" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="932" y="165" width="190" height="96" rx="14" fill="#f9e7e7" stroke="#a74343" stroke-width="3"/>
  <text x="1027" y="198" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#17324d">Projection risk</text>
  <text x="1027" y="225" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#66737f">more confidence or effort</text>
  <text x="1027" y="246" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#66737f">need not mean more accuracy</text>

  <rect x="650" y="323" width="195" height="116" rx="14" fill="#eaf3f8" stroke="#2f6f9f" stroke-width="3"/>
  <text x="747.5" y="356" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#17324d">Ask → listen</text>
  <text x="747.5" y="383" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#17324d">→ verify</text>
  <text x="747.5" y="414" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#66737f">the person supplies evidence</text>
  <line x1="845" y1="381" x2="925" y2="381" stroke="#17324d" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="932" y="323" width="190" height="116" rx="14" fill="#edf4ed" stroke="#447c55" stroke-width="3"/>
  <text x="1027" y="358" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#17324d">Correctable model</text>
  <text x="1027" y="388" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#66737f">accuracy can improve when</text>
  <text x="1027" y="410" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#66737f">the person can revise</text>
  <text x="1027" y="432" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#66737f">your inference</text>

  <rect x="665" y="493" width="445" height="80" rx="14" fill="#ffffff" stroke="#2b7a78" stroke-width="2" stroke-dasharray="7 6"/>
  <text x="887.5" y="524" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#17324d">Calibration rule</text>
  <text x="887.5" y="551" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#66737f">Use richer channels as stakes rise; keep repair open.</text>

  <text x="600" y="672" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#66737f">Data: Kruger et al. (2005), Study 2. Perspective-getting schematic: Eyal, Steffel, and Epley (2018).</text>
</svg>

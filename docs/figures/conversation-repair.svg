<?xml version="1.0" encoding="utf-8" ?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink" baseProfile="full" height="650" version="1.1" viewBox="0 0 1200 650" width="1200">
  <defs/>
  <title>Conversation and repair sequence</title>
  <desc>An event is interpreted through a private story, producing feeling and need. Perspective-getting and grounding create shared meaning and a repair action.</desc>
  <rect fill="white" height="650" width="1200" x="0" y="0"/>
  <text fill="#17324d" font-family="Arial, sans-serif" font-size="34" font-weight="bold" text-anchor="middle" x="600" y="48">Repair begins when interpretation becomes a hypothesis</text>
  <rect fill="#eaf3f8" height="125" rx="16" ry="16" stroke="#2f6f9f" stroke-width="3" width="205" x="40" y="230"/>
  <text fill="#17324d" font-family="Arial, sans-serif" font-size="26" font-weight="bold" text-anchor="middle" x="142.5" y="284.5">Event</text>
  <text fill="#66737f" font-family="Arial, sans-serif" font-size="17" font-weight="normal" text-anchor="middle" x="142.5" y="318.5">what happened</text>
  <rect fill="#eaf3f8" height="125" rx="16" ry="16" stroke="#2f6f9f" stroke-width="3" width="205" x="270" y="230"/>
  <text fill="#17324d" font-family="Arial, sans-serif" font-size="26" font-weight="bold" text-anchor="middle" x="372.5" y="284.5">Interpretation</text>
  <text fill="#66737f" font-family="Arial, sans-serif" font-size="17" font-weight="normal" text-anchor="middle" x="372.5" y="318.5">private story</text>
  <rect fill="#eaf3f8" height="125" rx="16" ry="16" stroke="#2f6f9f" stroke-width="3" width="205" x="500" y="230"/>
  <text fill="#17324d" font-family="Arial, sans-serif" font-size="26" font-weight="bold" text-anchor="middle" x="602.5" y="284.5">Feeling / need</text>
  <text fill="#66737f" font-family="Arial, sans-serif" font-size="17" font-weight="normal" text-anchor="middle" x="602.5" y="318.5">why it matters</text>
  <rect fill="#f7f1e8" height="125" rx="16" ry="16" stroke="#c56a2d" stroke-width="3" width="205" x="730" y="230"/>
  <text fill="#17324d" font-family="Arial, sans-serif" font-size="26" font-weight="bold" text-anchor="middle" x="832.5" y="284.5">Ask and verify</text>
  <text fill="#66737f" font-family="Arial, sans-serif" font-size="17" font-weight="normal" text-anchor="middle" x="832.5" y="318.5">perspective-getting</text>
  <rect fill="#f7f1e8" height="125" rx="16" ry="16" stroke="#c56a2d" stroke-width="3" width="205" x="960" y="230"/>
  <text fill="#17324d" font-family="Arial, sans-serif" font-size="26" font-weight="bold" text-anchor="middle" x="1062.5" y="284.5">Shared repair</text>
  <text fill="#66737f" font-family="Arial, sans-serif" font-size="17" font-weight="normal" text-anchor="middle" x="1062.5" y="318.5">apology • boundary • next</text>
  <line stroke="#17324d" stroke-width="4" x1="245" x2="270" y1="292" y2="292"/>
  <polygon fill="#17324d" points="270,292 257.0096189432334,299.5 257.0096189432334,284.5"/>
  <line stroke="#17324d" stroke-width="4" x1="475" x2="500" y1="292" y2="292"/>
  <polygon fill="#17324d" points="500,292 487.0096189432334,299.5 487.0096189432334,284.5"/>
  <line stroke="#17324d" stroke-width="4" x1="705" x2="730" y1="292" y2="292"/>
  <polygon fill="#17324d" points="730,292 717.0096189432334,299.5 717.0096189432334,284.5"/>
  <line stroke="#17324d" stroke-width="4" x1="935" x2="960" y1="292" y2="292"/>
  <polygon fill="#17324d" points="960,292 947.0096189432334,299.5 947.0096189432334,284.5"/>
  <rect fill="#edf4ed" height="95" rx="16" ry="16" stroke="#447c55" stroke-width="3" width="440" x="380" y="455"/>
  <text fill="#17324d" font-family="Arial, sans-serif" font-size="26" font-weight="bold" text-anchor="middle" x="600.0" y="494.5">Layered listening</text>
  <text fill="#66737f" font-family="Arial, sans-serif" font-size="17" font-weight="normal" text-anchor="middle" x="600.0" y="528.5">WHAT • HOW • WHY • WHO • WHEN • NEXT</text>
  <line stroke="#447c55" stroke-width="4" x1="600" x2="832" y1="455" y2="355"/>

  <line stroke="#17324d" stroke-width="4" x1="475" x2="500" y1="292" y2="292" />
  <polygon fill="#17324d" points="500,292 487.0096189432334,299.5 487.0096189432334,284.5" />
  <line stroke="#17324d" stroke-width="4" x1="705" x2="730" y1="292" y2="292" />
  <polygon fill="#17324d" points="730,292 717.0096189432334,299.5 717.0096189432334,284.5" />
  <line stroke="#17324d" stroke-width="4" x1="935" x2="960" y1="292" y2="292" />
  <polygon fill="#17324d" points="960,292 947.0096189432334,299.5 947.0096189432334,284.5" />

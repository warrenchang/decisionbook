<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" baseProfile="full" height="650" version="1.1" viewBox="0 0 1200 650" width="1200">
  <defs />
  <title>Conversation and repair sequence</title>
  <desc>An event is interpreted through a private story, producing feeling and need. Perspective-getting and grounding create shared meaning and a repair action.</desc>
  <rect fill="white" height="650" width="1200" x="0" y="0" />
  <text fill="#17324d" font-family="Arial, sans-serif" font-size="34" font-weight="bold" text-anchor="middle" x="600" y="48">Repair begins when interpretation becomes a hypothesis</text>
  <rect fill="#eaf3f8" height="125" rx="16" ry="16" stroke="#2f6f9f" stroke-width="3" width="205" x="40" y="230" />
  <text fill="#17324d" font-family="Arial, sans-serif" font-size="26" font-weight="bold" text-anchor="middle" x="142.5" y="286.47"><tspan x="142.5" dy="0">Event</tspan></text>
  <text fill="#66737f" font-family="Arial, sans-serif" font-size="17" font-weight="normal" text-anchor="middle" x="142.5" y="314.59"><tspan x="142.5" dy="0">what happened</tspan></text>
  <rect fill="#eaf3f8" height="125" rx="16" ry="16" stroke="#2f6f9f" stroke-width="3" width="205" x="270" y="230" />
  <text fill="#17324d" font-family="Arial, sans-serif" font-size="26" font-weight="bold" text-anchor="middle" x="372.5" y="286.47"><tspan x="372.5" dy="0">Interpretation</tspan></text>
  <text fill="#66737f" font-family="Arial, sans-serif" font-size="17" font-weight="normal" text-anchor="middle" x="372.5" y="314.59"><tspan x="372.5" dy="0">private story</tspan></text>
  <rect fill="#eaf3f8" height="125" rx="16" ry="16" stroke="#2f6f9f" stroke-width="3" width="205" x="500" y="230" />
  <text fill="#17324d" font-family="Arial, sans-serif" font-size="26" font-weight="bold" text-anchor="middle" x="602.5" y="271.13"><tspan x="602.5" dy="0">Feeling /</tspan><tspan x="602.5" dy="30.68">need</tspan></text>
  <text fill="#66737f" font-family="Arial, sans-serif" font-size="17" font-weight="normal" text-anchor="middle" x="602.5" y="329.93"><tspan x="602.5" dy="0">why it matters</tspan></text>
  <rect fill="#f7f1e8" height="125" rx="16" ry="16" stroke="#c56a2d" stroke-width="3" width="205" x="730" y="230" />
  <text fill="#17324d" font-family="Arial, sans-serif" font-size="26" font-weight="bold" text-anchor="middle" x="832.5" y="271.13"><tspan x="832.5" dy="0">Ask and</tspan><tspan x="832.5" dy="30.68">verify</tspan></text>
  <text fill="#66737f" font-family="Arial, sans-serif" font-size="17" font-weight="normal" text-anchor="middle" x="832.5" y="329.93"><tspan x="832.5" dy="0">perspective-getting</tspan></text>
  <rect fill="#f7f1e8" height="125" rx="16" ry="16" stroke="#c56a2d" stroke-width="3" width="205" x="960" y="230" />
  <text fill="#17324d" font-family="Arial, sans-serif" font-size="26" font-weight="bold" text-anchor="middle" x="1062.5" y="261.1"><tspan x="1062.5" dy="0">Shared</tspan><tspan x="1062.5" dy="30.68">repair</tspan></text>
  <text fill="#66737f" font-family="Arial, sans-serif" font-size="17" font-weight="normal" text-anchor="middle" x="1062.5" y="319.9"><tspan x="1062.5" dy="0">apology • boundary</tspan><tspan x="1062.5" dy="20.06">• next</tspan></text>

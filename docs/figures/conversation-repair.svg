  <text fill="#66737f" font-family="Arial, sans-serif" font-size="17" font-weight="normal" text-anchor="middle" x="600" y="524.59"><tspan x="600" dy="0">WHAT • HOW • WHY • WHO • WHEN • NEXT</tspan></text>
  <line stroke="#447c55" stroke-width="4" x1="600" x2="832" y1="455" y2="355" />
  <polygon fill="#447c55" points="832,355 823.0393402912802,367.02940470615755 817.1019000777036,353.2545434106598" />
  <text fill="#66737f" font-family="Arial, sans-serif" font-size="21" font-weight="normal" text-anchor="middle" x="600" y="590">Connection improves when people stop treating inferred minds as observed facts.</text>
</svg>
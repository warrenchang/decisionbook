<?xml version="1.0" encoding="utf-8" ?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink" baseProfile="full" height="650" version="1.1" viewBox="0 0 1200 650" width="1200">
  <defs/>
  <title>The decision loop</title>
  <desc>Alternatives and information feed prediction and valuation, which guide choice; outcome and feedback update the loop.</desc>
  <rect fill="white" height="650" width="1200" x="0" y="0"/>
  <text fill="#17324d" font-family="Arial, sans-serif" font-size="34" font-weight="bold" text-anchor="middle" x="600" y="48">The decision loop</text>
  <rect fill="#eaf3f8" height="100" rx="16" ry="16" stroke="#2f6f9f" stroke-width="3" width="200" x="65" y="255"/>
  <text fill="#17324d" font-family="Arial, sans-serif" font-size="26" font-weight="bold" text-anchor="middle" x="165.0" y="297.0">Alternatives +
information</text>
  <rect fill="#eaf3f8" height="100" rx="16" ry="16" stroke="#2f6f9f" stroke-width="3" width="210" x="335" y="135"/>
  <text fill="#17324d" font-family="Arial, sans-serif" font-size="26" font-weight="bold" text-anchor="middle" x="440.0" y="177.0">Prediction</text>
  <rect fill="#eaf3f8" height="100" rx="16" ry="16" stroke="#2f6f9f" stroke-width="3" width="210" x="335" y="350"/>
  <text fill="#17324d" font-family="Arial, sans-serif" font-size="26" font-weight="bold" text-anchor="middle" x="440.0" y="392.0">Valuation</text>
  <rect fill="#eaf3f8" height="100" rx="16" ry="16" stroke="#2f6f9f" stroke-width="3" width="180" x="650" y="255"/>
  <text fill="#17324d" font-family="Arial, sans-serif" font-size="26" font-weight="bold" text-anchor="middle" x="740.0" y="297.0">Choice</text>
  <rect fill="#eaf3f8" height="100" rx="16" ry="16" stroke="#2f6f9f" stroke-width="3" width="180" x="920" y="255"/>
  <text fill="#17324d" font-family="Arial, sans-serif" font-size="26" font-weight="bold" text-anchor="middle" x="1010.0" y="297.0">Outcome</text>
  <line stroke="#17324d" stroke-width="4" x1="265" x2="335" y1="305" y2="185"/>
  <polygon fill="#17324d" points="335,185 334.9328651317166,199.9998497628963 321.9761816182401,192.44178438003502"/>
  <line stroke="#17324d" stroke-width="4" x1="265" x2="335" y1="305" y2="400"/>
  <polygon fill="#17324d" points="335,400 321.25619967307483,393.9910106861793 333.33203723337533,385.0930251154316"/>
  <line stroke="#17324d" stroke-width="4" x1="545" x2="650" y1="185" y2="285"/>
  <polygon fill="#17324d" points="650,285 635.4207585451,281.4721509953334 645.7655861313069,270.61008202981617"/>
  <line stroke="#17324d" stroke-width="4" x1="545" x2="650" y1="400" y2="325"/>
  <polygon fill="#17324d" points="650,325 643.7885785832723,338.6535066552083 635.0700056774859,326.4475045871073"/>
  <line stroke="#17324d" stroke-width="4" x1="830" x2="920" y1="305" y2="305"/>
  <polygon fill="#17324d" points="920,305 907.0096189432334,312.5 907.0096189432334,297.5"/>
  <rect fill="#f7f1e8" height="90" rx="16" ry="16" stroke="#c56a2d" stroke-width="3" width="240" x="650" y="500"/>
  <text fill="#17324d" font-family="Arial, sans-serif" font-size="26" font-weight="bold" text-anchor="middle" x="770.0" y="537.0">Feedback + learning</text>
  <text fill="#66737f" font-family="Arial, sans-serif" font-size="17" font-weight="normal" text-anchor="middle" x="770.0" y="571.0">updates beliefs, values, options</text>
  <line stroke="#c56a2d" stroke-width="4" x1="1010" x2="870" y1="355" y2="500"/>
  <polygon fill="#c56a2d" points="870,500 873.6275364582663,485.4452420410386 884.4185583675275,495.86415974653215"/>
  <line stroke="#c56a2d" stroke-width="4" x1="650" x2="260" y1="545" y2="355"/>
  <polygon fill="#c56a2d" points="260,355 274.9629916369665,353.94696568333603 268.39345028777103,367.43181371589503"/>
  <text fill="#66737f" font-family="Arial, sans-serif" font-size="20" font-weight="normal" text-anchor="middle" x="600" y="625">Functional map, not a fixed conscious sequence</text>
</svg>

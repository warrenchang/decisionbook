<svg xmlns="http://www.w3.org/2000/svg" width="1670" height="736" viewBox="0 0 1670 736" role="img" aria-labelledby="title desc">
<title id="title">Decision loop</title>
<desc id="desc">Information on alternatives flows to prediction, then valuation, choice, and outcome. Prediction and valuation are enclosed within judgment. Outcome connects to feedback and learning, which returns to judgment.</desc>
<defs>
  <linearGradient id="lightGrad" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#fbfdff"/>
    <stop offset="100%" stop-color="#e5effb"/>
  </linearGradient>
  <linearGradient id="darkGrad" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#0d3f7f"/>
    <stop offset="100%" stop-color="#052e67"/>
  </linearGradient>
  <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
    <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0b2f63" flood-opacity="0.18"/>
  </filter>
  <marker id="arrow" markerWidth="15" markerHeight="15" refX="13" refY="7.5" orient="auto" markerUnits="userSpaceOnUse">
    <path d="M0,0 L15,7.5 L0,15 Z" fill="#0a2f68"/>
  </marker>
  <marker id="arrowSmall" markerWidth="11" markerHeight="11" refX="9.5" refY="5.5" orient="auto" markerUnits="userSpaceOnUse">
    <path d="M0,0 L11,5.5 L0,11 Z" fill="#0a2f68"/>
  </marker>
</defs>

<!-- Feedback loop connectors: drawn first so the feedback label sits above them -->
<path d="M 867 60 H 572 V 105" fill="none" stroke="#0a2f68" stroke-width="4" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M 1338 60 H 1485 V 352" fill="none" stroke="#0a2f68" stroke-width="4" stroke-linejoin="round"/>

<!-- Judgment container -->
<rect x="340" y="100" width="522" height="560" rx="48" fill="none" stroke="#173f79" stroke-width="3" stroke-dasharray="10 10"/>
<text x="601" y="169" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="38" font-weight="700" fill="#0a2f68">Judgment</text>

<!-- Information on alternatives -->
<g filter="url(#shadow)">
  <rect x="20" y="140" width="290" height="285" rx="34" fill="url(#lightGrad)" stroke="#0a2f68" stroke-width="3"/>
</g>
<!-- document icon -->
<path d="M108 173 H172 L204 205 V284 H108 Z" fill="none" stroke="#0a2f68" stroke-width="5" stroke-linejoin="round"/>
<path d="M172 173 V205 H204" fill="none" stroke="#0a2f68" stroke-width="5" stroke-linejoin="round"/>
<line x1="131" y1="220" x2="163" y2="220" stroke="#0a2f68" stroke-width="5" stroke-linecap="round"/>
<line x1="131" y1="242" x2="169" y2="242" stroke="#0a2f68" stroke-width="5" stroke-linecap="round"/>
<line x1="131" y1="264" x2="154" y2="264" stroke="#0a2f68" stroke-width="5" stroke-linecap="round"/>
<circle cx="187" cy="262" r="27" fill="url(#lightGrad)" stroke="#0a2f68" stroke-width="5"/>
<line x1="206" y1="281" x2="230" y2="305" stroke="#0a2f68" stroke-width="6" stroke-linecap="round"/>
<text x="165" y="335" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="31" font-weight="700" fill="#0a2f68">
  <tspan x="165" dy="0">Information on</tspan>
  <tspan x="165" dy="39">alternatives</tspan>
</text>

<!-- Prediction box -->
<g filter="url(#shadow)">
  <rect x="399" y="198" width="412" height="165" rx="24" fill="url(#darkGrad)" stroke="#0a2f68" stroke-width="3"/>
</g>
<!-- chart icon -->
<line x1="437" y1="329" x2="560" y2="329" stroke="#fff" stroke-width="5" stroke-linecap="round"/>
<line x1="437" y1="329" x2="437" y2="231" stroke="#fff" stroke-width="5" stroke-linecap="round"/>
<polyline points="458,307 488,273 517,291 549,247" fill="none" stroke="#fff" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/>
<circle cx="458" cy="307" r="6" fill="#0d3f7f" stroke="#fff" stroke-width="4"/>
<circle cx="488" cy="273" r="6" fill="#0d3f7f" stroke="#fff" stroke-width="4"/>
<circle cx="517" cy="291" r="6" fill="#0d3f7f" stroke="#fff" stroke-width="4"/>
<circle cx="549" cy="247" r="6" fill="#0d3f7f" stroke="#fff" stroke-width="4"/>
<text x="681" y="297" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="40" font-weight="700" fill="#fff">Prediction</text>

<!-- Valuation box -->
<g filter="url(#shadow)">
  <rect x="399" y="447" width="412" height="162" rx="24" fill="url(#darkGrad)" stroke="#0a2f68" stroke-width="3"/>
</g>
<!-- balance icon -->
<line x1="490" y1="481" x2="490" y2="565" stroke="#fff" stroke-width="5" stroke-linecap="round"/>
<circle cx="490" cy="478" r="7" fill="#0d3f7f" stroke="#fff" stroke-width="4"/>
<line x1="447" y1="496" x2="533" y2="496" stroke="#fff" stroke-width="5" stroke-linecap="round"/>
<line x1="465" y1="496" x2="448" y2="535" stroke="#fff" stroke-width="4"/>
<line x1="515" y1="496" x2="532" y2="535" stroke="#fff" stroke-width="4"/>
<path d="M429 535 Q448 568 467 535 Z" fill="none" stroke="#fff" stroke-width="4"/>
<path d="M513 535 Q532 568 551 535 Z" fill="none" stroke="#fff" stroke-width="4"/>
<line x1="464" y1="568" x2="516" y2="568" stroke="#fff" stroke-width="5" stroke-linecap="round"/>
<line x1="473" y1="559" x2="507" y2="559" stroke="#fff" stroke-width="5" stroke-linecap="round"/>
<text x="679" y="550" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="40" font-weight="700" fill="#fff">Valuation</text>

<!-- Choice box -->
<g filter="url(#shadow)">
  <rect x="992" y="352" width="248" height="274" rx="26" fill="url(#lightGrad)" stroke="#0a2f68" stroke-width="3"/>
</g>
<!-- clipboard icon -->
<rect x="1068" y="395" width="98" height="119" rx="8" fill="none" stroke="#0a2f68" stroke-width="5"/>
<rect x="1095" y="382" width="44" height="25" rx="8" fill="url(#lightGrad)" stroke="#0a2f68" stroke-width="5"/>
<polyline points="1086,434 1098,445 1117,423" fill="none" stroke="#0a2f68" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
<line x1="1128" y1="435" x2="1150" y2="435" stroke="#0a2f68" stroke-width="5" stroke-linecap="round"/>
<polyline points="1086,468 1098,479 1117,457" fill="none" stroke="#0a2f68" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
<line x1="1128" y1="469" x2="1150" y2="469" stroke="#0a2f68" stroke-width="5" stroke-linecap="round"/>
<line x1="1087" y1="495" x2="1150" y2="495" stroke="#0a2f68" stroke-width="5" stroke-linecap="round"/>
<text x="1116" y="576" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="38" font-weight="700" fill="#0a2f68">Choice</text>

<!-- Outcome box -->
<g filter="url(#shadow)">
  <rect x="1364" y="352" width="253" height="274" rx="26" fill="url(#lightGrad)" stroke="#0a2f68" stroke-width="3"/>
</g>
<!-- bar-chart icon -->
<line x1="1424" y1="503" x2="1558" y2="503" stroke="#0a2f68" stroke-width="5" stroke-linecap="round"/>
<rect x="1441" y="457" width="24" height="46" fill="none" stroke="#0a2f68" stroke-width="5"/>
<rect x="1487" y="423" width="26" height="80" fill="none" stroke="#0a2f68" stroke-width="5"/>
<rect x="1532" y="390" width="28" height="113" fill="none" stroke="#0a2f68" stroke-width="5"/>
<text x="1490" y="576" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="38" font-weight="700" fill="#0a2f68">Outcome</text>

<!-- Main forward-flow arrows -->
<path d="M310 280 H399" fill="none" stroke="#0a2f68" stroke-width="4" marker-end="url(#arrow)"/>
<path d="M605 363 V447" fill="none" stroke="#0a2f68" stroke-width="4" marker-end="url(#arrow)"/>
<path d="M811 528 H992" fill="none" stroke="#0a2f68" stroke-width="4" marker-end="url(#arrow)"/>
<path d="M1240 528 H1364" fill="none" stroke="#0a2f68" stroke-width="4" marker-end="url(#arrow)"/>

<!-- Feedback / learning shape, above the loop lines -->
<g filter="url(#shadow)">
  <polygon points="905,16 1293,16 1338,60 1293,108 905,108 860,60" fill="url(#lightGrad)" stroke="#0a2f68" stroke-width="3"/>
</g>
<!-- circular feedback icon -->
<path d="M 925 58 A 31 31 0 0 1 979 38" fill="none" stroke="#0a2f68" stroke-width="4" stroke-linecap="round" marker-end="url(#arrowSmall)"/>
<path d="M 983 64 A 31 31 0 0 1 929 84" fill="none" stroke="#0a2f68" stroke-width="4" stroke-linecap="round" marker-end="url(#arrowSmall)"/>
<text x="1147" y="73" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700" fill="#0a2f68">Feedback / learning</text>
</svg>
<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="norm-title norm-desc">
  <title id="norm-title">A diagnostic for designing norm messages</title>
  <desc id="norm-desc">A message branches according to whether it describes common behavior or social approval. A common desirable behavior may be stated accurately. A common undesirable behavior should not be advertised as normal. Approval claims must be true and paired with a feasible action. All routes end with a test of accuracy, relevance, privacy, and possible backfire.</desc>
  <defs>
    <marker id="norm-arrow-blue" viewBox="0 0 10 8" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0.5,0.8 L9,4 L0.5,7.2 Z" fill="#2f6f9f"/>
    </marker>
    <marker id="norm-arrow-orange" viewBox="0 0 10 8" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0.5,0.8 L9,4 L0.5,7.2 Z" fill="#c56a2d"/>
    </marker>
    <marker id="norm-arrow-green" viewBox="0 0 10 8" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0.5,0.8 L9,4 L0.5,7.2 Z" fill="#447c55"/>
    </marker>
  </defs>

  <rect width="1200" height="720" fill="#ffffff"/>
  <text x="600" y="54" text-anchor="middle" font-family="Arial, sans-serif" font-size="35" font-weight="700" fill="#17324d">Design the norm signal before broadcasting it</text>
  <text x="600" y="87" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" fill="#66737f">A norm message says both what people do and what people approve—even when only one claim is intended.</text>

  <rect x="430" y="120" width="340" height="88" rx="16" fill="#eaf3f8" stroke="#2f6f9f" stroke-width="3"/>
  <text x="600" y="154" text-anchor="middle" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="#17324d">What signal are you sending?</text>
  <text x="600" y="184" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#66737f">Separate prevalence from approval.</text>

  <path d="M600 208 V235 H300 V260" fill="none" stroke="#2f6f9f" stroke-width="4" marker-end="url(#norm-arrow-blue)"/>
  <path d="M600 208 V235 H900 V260" fill="none" stroke="#c56a2d" stroke-width="4" marker-end="url(#norm-arrow-orange)"/>

  <rect x="100" y="260" width="400" height="94" rx="16" fill="#eaf3f8" stroke="#2f6f9f" stroke-width="3"/>
  <text x="300" y="296" text-anchor="middle" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="#17324d">Descriptive norm</text>
  <text x="300" y="326" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#66737f">“What do relevant others actually do?”</text>

  <rect x="700" y="260" width="400" height="94" rx="16" fill="#f7f1e8" stroke="#c56a2d" stroke-width="3"/>
  <text x="900" y="296" text-anchor="middle" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="#17324d">Injunctive norm</text>
  <text x="900" y="326" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#66737f">“What do relevant others approve?”</text>

  <path d="M300 354 V386" fill="none" stroke="#2f6f9f" stroke-width="4" marker-end="url(#norm-arrow-blue)"/>
  <path d="M900 354 V386" fill="none" stroke="#c56a2d" stroke-width="4" marker-end="url(#norm-arrow-orange)"/>

  <rect x="65" y="388" width="470" height="142" rx="16" fill="#ffffff" stroke="#2f6f9f" stroke-width="3"/>
  <text x="300" y="423" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#17324d">Is the desired behavior truly common?</text>
  <text x="95" y="460" font-family="Arial, sans-serif" font-size="17" fill="#447c55" font-weight="700">YES</text>
  <text x="150" y="460" font-family="Arial, sans-serif" font-size="17" fill="#17324d">State it accurately and locally.</text>
  <text x="95" y="492" font-family="Arial, sans-serif" font-size="17" fill="#a74343" font-weight="700">NO</text>
  <text x="150" y="492" font-family="Arial, sans-serif" font-size="17" fill="#17324d">Do not make harmful behavior sound normal.</text>
  <text x="150" y="516" font-family="Arial, sans-serif" font-size="16" fill="#66737f">Use truthful approval, change, or private correction.</text>

  <rect x="665" y="388" width="470" height="142" rx="16" fill="#ffffff" stroke="#c56a2d" stroke-width="3"/>
  <text x="900" y="423" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#17324d">Is the approval claim true and relevant?</text>
  <text x="695" y="460" font-family="Arial, sans-serif" font-size="17" fill="#447c55" font-weight="700">YES</text>
  <text x="750" y="460" font-family="Arial, sans-serif" font-size="17" fill="#17324d">Pair it with a feasible next action.</text>
  <text x="695" y="492" font-family="Arial, sans-serif" font-size="17" fill="#a74343" font-weight="700">NO</text>
  <text x="750" y="492" font-family="Arial, sans-serif" font-size="17" fill="#17324d">Do not manufacture consensus or pressure.</text>
  <text x="750" y="516" font-family="Arial, sans-serif" font-size="16" fill="#66737f">Ask whose approval matters and why.</text>

  <path d="M300 530 C300 556 480 548 480 576" fill="none" stroke="#447c55" stroke-width="4" stroke-linecap="round" marker-end="url(#norm-arrow-green)"/>
  <path d="M900 530 C900 556 720 548 720 576" fill="none" stroke="#447c55" stroke-width="4" stroke-linecap="round" marker-end="url(#norm-arrow-green)"/>

  <rect x="210" y="576" width="780" height="98" rx="18" fill="#edf4ed" stroke="#447c55" stroke-width="3"/>
  <text x="600" y="610" text-anchor="middle" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#17324d">Backfire test</text>
  <text x="600" y="640" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="#17324d">Is the claim accurate, local, independently grounded, and private where needed?</text>
  <text x="600" y="664" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="#66737f">Could this message normalize the problem, shame the audience, or hide uncertainty?</text>
</svg>

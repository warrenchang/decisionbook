<svg xmlns="http://www.w3.org/2000/svg" width="760" height="680" viewBox="0 0 760 680" role="img" aria-labelledby="title desc">
<title id="title">MPharm's payoff in two approval states</title>
<desc id="desc">Hypothetical payoffs before effort costs, in millions of dollars. Package D leaves MPharm 30 without approval and 30 with approval. Package E leaves 18 without approval and 38 with approval. Approval therefore adds zero under D and 20 under E.</desc>
<rect width="760" height="680" fill="#ffffff"/>
<g font-family="Arial, Helvetica, sans-serif" fill="#183047">
<text x="42" y="80" font-size="36" text-anchor="start" font-weight="bold" fill="#183047">Package D</text>
<line x1="260" y1="113" x2="260" y2="262" stroke="#9aabb5" stroke-width="2"/>
<line x1="360" y1="113" x2="360" y2="262" stroke="#dce3e8" stroke-width="2"/>
<line x1="460" y1="113" x2="460" y2="262" stroke="#dce3e8" stroke-width="2"/>
<line x1="560" y1="113" x2="560" y2="262" stroke="#dce3e8" stroke-width="2"/>
<line x1="660" y1="113" x2="660" y2="262" stroke="#dce3e8" stroke-width="2"/>
<text x="238" y="156" font-size="32" text-anchor="end" font-weight="normal" fill="#183047">No approval</text>
<rect x="260" y="119" width="300" height="52" fill="#254f77"/>
<rect x="566" y="121" width="55" height="48" fill="#ffffff"/>
<text x="572" y="156" font-size="32" text-anchor="start" font-weight="bold" fill="#183047">30</text>
<text x="238" y="241" font-size="32" text-anchor="end" font-weight="normal" fill="#183047">Approval</text>
<rect x="260" y="204" width="300" height="52" fill="#087e8b"/>
<rect x="566" y="206" width="55" height="48" fill="#ffffff"/>
<text x="572" y="241" font-size="32" text-anchor="start" font-weight="bold" fill="#183047">30</text>
<text x="42" y="345" font-size="36" text-anchor="start" font-weight="bold" fill="#183047">Package E</text>
<line x1="260" y1="378" x2="260" y2="527" stroke="#9aabb5" stroke-width="2"/>
<line x1="360" y1="378" x2="360" y2="527" stroke="#dce3e8" stroke-width="2"/>
<line x1="460" y1="378" x2="460" y2="527" stroke="#dce3e8" stroke-width="2"/>
<line x1="560" y1="378" x2="560" y2="527" stroke="#dce3e8" stroke-width="2"/>
<line x1="660" y1="378" x2="660" y2="527" stroke="#dce3e8" stroke-width="2"/>
<text x="238" y="421" font-size="32" text-anchor="end" font-weight="normal" fill="#183047">No approval</text>
<rect x="260" y="384" width="180" height="52" fill="#254f77"/>
<rect x="446" y="386" width="55" height="48" fill="#ffffff"/>
<text x="452" y="421" font-size="32" text-anchor="start" font-weight="bold" fill="#183047">18</text>
<text x="238" y="506" font-size="32" text-anchor="end" font-weight="normal" fill="#183047">Approval</text>
<rect x="260" y="469" width="380" height="52" fill="#087e8b"/>
<rect x="646" y="471" width="55" height="48" fill="#ffffff"/>
<text x="652" y="506" font-size="32" text-anchor="start" font-weight="bold" fill="#183047">38</text>
<line x1="260" y1="550" x2="660" y2="550" stroke="#9aabb5" stroke-width="2"/>
<line x1="260" y1="550" x2="260" y2="558" stroke="#9aabb5" stroke-width="2"/>
<text x="260" y="595" font-size="32" text-anchor="middle" font-weight="normal" fill="#536879">0</text>
<line x1="360" y1="550" x2="360" y2="558" stroke="#9aabb5" stroke-width="2"/>
<text x="360" y="595" font-size="32" text-anchor="middle" font-weight="normal" fill="#536879">10</text>
<line x1="460" y1="550" x2="460" y2="558" stroke="#9aabb5" stroke-width="2"/>
<text x="460" y="595" font-size="32" text-anchor="middle" font-weight="normal" fill="#536879">20</text>
<line x1="560" y1="550" x2="560" y2="558" stroke="#9aabb5" stroke-width="2"/>
<text x="560" y="595" font-size="32" text-anchor="middle" font-weight="normal" fill="#536879">30</text>
<line x1="660" y1="550" x2="660" y2="558" stroke="#9aabb5" stroke-width="2"/>
<text x="660" y="595" font-size="32" text-anchor="middle" font-weight="normal" fill="#536879">40</text>
<text x="460" y="645" font-size="32" text-anchor="middle" font-weight="normal" fill="#183047">MPharm net payoff ($m)</text>
</g>
</svg>

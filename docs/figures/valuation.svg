<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="770" viewBox="0 0 1100 770">
<title>Why an option appeals now</title><desc>An author teaching synthesis groups possible influences on current subjective value into the option and comparisons, current state, goals and experience, and social meaning. Current value can guide motivation and choice. The grouping is not a validated four-input neural model.</desc>
<rect width="1100" height="770" fill="white"/>
<defs><marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0 L9 4 L0 8 Z" fill="context-stroke"/></marker></defs>
<g font-family="Arial, sans-serif" fill="#17324d">
<text x="550" y="50" font-size="36" font-weight="bold" fill="#17324d" text-anchor="middle">
<tspan x="550" dy="0">Why an option appeals now</tspan>
</text>
<rect x="45" y="145" width="400" height="100" rx="17" fill="#eaf3f8" stroke="#2f6f9f" stroke-width="3"/>
<text x="245.0" y="183" font-size="27" font-weight="bold" fill="#17324d" text-anchor="middle">
<tspan x="245.0" dy="0">The option</tspan>
</text>
<text x="245.0" y="218.0" font-size="22" font-weight="normal" fill="#52677b" text-anchor="middle">
<tspan x="245.0" dy="0">Features and comparisons</tspan>
</text>
<rect x="45" y="285" width="400" height="100" rx="17" fill="#eaf3f8" stroke="#2f6f9f" stroke-width="3"/>
<text x="245.0" y="323" font-size="27" font-weight="bold" fill="#17324d" text-anchor="middle">
<tspan x="245.0" dy="0">Current state</tspan>
</text>
<text x="245.0" y="358.0" font-size="22" font-weight="normal" fill="#52677b" text-anchor="middle">
<tspan x="245.0" dy="0">Hunger, fatigue, emotion</tspan>
</text>
<rect x="45" y="425" width="400" height="100" rx="17" fill="#f7f1e8" stroke="#c56a2d" stroke-width="3"/>
<text x="245.0" y="463" font-size="27" font-weight="bold" fill="#17324d" text-anchor="middle">
<tspan x="245.0" dy="0">Goals and experience</tspan>
</text>
<text x="245.0" y="498.0" font-size="22" font-weight="normal" fill="#52677b" text-anchor="middle">
<tspan x="245.0" dy="0">Priorities and memories</tspan>
</text>
<rect x="45" y="565" width="400" height="100" rx="17" fill="#f7f1e8" stroke="#c56a2d" stroke-width="3"/>
<text x="245.0" y="603" font-size="27" font-weight="bold" fill="#17324d" text-anchor="middle">
<tspan x="245.0" dy="0">Social meaning</tspan>
</text>
<text x="245.0" y="638.0" font-size="22" font-weight="normal" fill="#52677b" text-anchor="middle">
<tspan x="245.0" dy="0">Identity and relationships</tspan>
</text>
<path d="M445 195 H495 M445 335 H495 M445 475 H495 M445 615 H495 M495 195 V615" fill="none" stroke="#52677b" stroke-width="3"/>
<circle cx="495" cy="335" r="5" fill="#52677b"/><circle cx="495" cy="475" r="5" fill="#52677b"/>
<path d="M495 422 H555" fill="none" stroke="#52677b" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="555" y="325" width="240" height="195" rx="17" fill="#edf4ed" stroke="#447c55" stroke-width="3"/>
<text x="675.0" y="363" font-size="29" font-weight="bold" fill="#17324d" text-anchor="middle">
<tspan x="675.0" dy="0">Value now</tspan>
</text>
<text x="675.0" y="398.0" font-size="23" font-weight="normal" fill="#52677b" text-anchor="middle">
<tspan x="675.0" dy="0">How attractive</tspan>
<tspan x="675.0" dy="28.75">the option feels</tspan>
</text>
<rect x="890" y="340" width="165" height="160" rx="17" fill="#edf4ed" stroke="#447c55" stroke-width="3"/>
<text x="972.5" y="378" font-size="24" font-weight="bold" fill="#17324d" text-anchor="middle">
<tspan x="972.5" dy="0">Motivation</tspan>
<tspan x="972.5" dy="30.0">and choice</tspan>
</text>
<path d="M795 422 H890" fill="none" stroke="#2b7a78" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="550" y="724" font-size="23" font-weight="normal" fill="#52677b" text-anchor="middle">
<tspan x="550" dy="0">Possible influences; their importance varies across decisions.</tspan>
</text>
</g></svg>

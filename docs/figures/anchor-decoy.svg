<?xml version="1.0" encoding="utf-8" ?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink" baseProfile="full" height="650" version="1.1" viewBox="0 0 1200 650" width="1200">
  <defs/>
  <title>Anchoring and decoy effects</title>
  <desc>The first number pulls later estimates through insufficient adjustment; a decoy changes the comparison set and can make one option look dominant.</desc>
  <rect fill="white" height="650" width="1200" x="0" y="0"/>
  <text fill="#17324d" font-family="Arial, sans-serif" font-size="34" font-weight="bold" text-anchor="middle" x="600" y="48">Context bends numerical and comparative judgment</text>
  <text fill="#17324d" font-family="Arial, sans-serif" font-size="27" font-weight="bold" text-anchor="middle" x="275" y="105">Anchoring</text>
  <text fill="#17324d" font-family="Arial, sans-serif" font-size="27" font-weight="bold" text-anchor="middle" x="895" y="105">Decoy comparison</text>
  <rect fill="#f7f1e8" height="100" rx="16" ry="16" stroke="#c56a2d" stroke-width="3" width="180" x="70" y="175"/>
  <text fill="#17324d" font-family="Arial, sans-serif" font-size="26" font-weight="bold" text-anchor="middle" x="160.0" y="217.0">First number</text>
  <text fill="#66737f" font-family="Arial, sans-serif" font-size="17" font-weight="normal" text-anchor="middle" x="160.0" y="251.0">offer • list price • forecast</text>
  <line stroke="#c56a2d" stroke-width="4" x1="250" x2="385" y1="225" y2="225"/>
  <polygon fill="#c56a2d" points="385,225 372.0096189432334,232.5 372.0096189432334,217.5"/>
  <rect fill="#eaf3f8" height="100" rx="16" ry="16" stroke="#2f6f9f" stroke-width="3" width="180" x="385" y="175"/>
  <text fill="#17324d" font-family="Arial, sans-serif" font-size="26" font-weight="bold" text-anchor="middle" x="475.0" y="217.0">Adjustment</text>
  <text fill="#66737f" font-family="Arial, sans-serif" font-size="17" font-weight="normal" text-anchor="middle" x="475.0" y="251.0">usually insufficient</text>
  <line stroke="#17324d" stroke-width="4" x1="475" x2="475" y1="275" y2="390"/>
  <polygon fill="#17324d" points="475,390 467.5,377.0096189432334 482.5,377.0096189432334"/>
  <rect fill="#f9e7e7" height="105" rx="16" ry="16" stroke="#a74343" stroke-width="3" width="250" x="350" y="390"/>
  <text fill="#17324d" font-family="Arial, sans-serif" font-size="26" font-weight="bold" text-anchor="middle" x="475.0" y="434.5">Final estimate</text>
  <text fill="#66737f" font-family="Arial, sans-serif" font-size="17" font-weight="normal" text-anchor="middle" x="475.0" y="468.5">still pulled toward the anchor</text>
  <rect fill="#eaf3f8" height="100" rx="16" ry="16" stroke="#2f6f9f" stroke-width="3" width="170" x="700" y="175"/>
  <text fill="#17324d" font-family="Arial, sans-serif" font-size="26" font-weight="bold" text-anchor="middle" x="785.0" y="217.0">Option A</text>
  <text fill="#66737f" font-family="Arial, sans-serif" font-size="17" font-weight="normal" text-anchor="middle" x="785.0" y="251.0">strong on quality</text>
  <rect fill="#eaf3f8" height="100" rx="16" ry="16" stroke="#2f6f9f" stroke-width="3" width="170" x="955" y="175"/>
  <text fill="#17324d" font-family="Arial, sans-serif" font-size="26" font-weight="bold" text-anchor="middle" x="1040.0" y="217.0">Option B</text>
  <text fill="#66737f" font-family="Arial, sans-serif" font-size="17" font-weight="normal" text-anchor="middle" x="1040.0" y="251.0">strong on price</text>
  <rect fill="#f7f1e8" height="100" rx="16" ry="16" stroke="#c56a2d" stroke-width="3" width="170" x="955" y="390"/>
  <text fill="#17324d" font-family="Arial, sans-serif" font-size="26" font-weight="bold" text-anchor="middle" x="1040.0" y="432.0">Decoy B−</text>
  <text fill="#66737f" font-family="Arial, sans-serif" font-size="17" font-weight="normal" text-anchor="middle" x="1040.0" y="466.0">worse than B on both</text>
  <line stroke="#c56a2d" stroke-width="4" x1="1040" x2="1040" y1="390" y2="275"/>
  <polygon fill="#c56a2d" points="1040,275 1047.5,287.9903810567666 1032.5,287.9903810567666"/>
  <text fill="#c56a2d" font-family="Arial, sans-serif" font-size="22" font-weight="bold" text-anchor="middle" x="910" y="335">B now looks
clearly dominant</text>
  <text fill="#66737f" font-family="Arial, sans-serif" font-size="21" font-weight="normal" text-anchor="middle" x="600" y="585">Independent estimates protect against anchors; stable criteria protect against comparison-set manipulation.</text>
</svg>

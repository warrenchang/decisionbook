<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">An architecture for robust cooperation</title>
  <desc id="desc">A cooperation challenge branches from one centered point to five evenly spaced supports: repeated interaction, reputation, social preferences, norms and institutions, and networks and space. All five supports converge through a common connector on robust cooperation. A final audit asks about noise, outsiders, punishment, power, transparency, correction, and exit.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 8" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0.5 0.8 L9 4 L0.5 7.2 Z" fill="#25678f"/></marker>
    <marker id="greenArrow" viewBox="0 0 10 8" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0.5 0.8 L9 4 L0.5 7.2 Z" fill="#447c55"/></marker>
    <marker id="auditArrow" viewBox="0 0 10 8" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0.5 0.8 L9 4 L0.5 7.2 Z" fill="#b95f2d"/></marker>
    <filter id="shadow"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#183047" flood-opacity="0.12"/></filter>
  </defs>
  <rect width="1200" height="760" fill="#ffffff"/>
  <text x="600" y="48" text-anchor="middle" font-family="Georgia, serif" font-size="34" font-weight="700" fill="#183047">An architecture for robust cooperation</text>
  <text x="600" y="80" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#607080">The same cooperative outcome can rest on different—and differently fragile—supports.</text>

  <g font-family="Arial, sans-serif" filter="url(#shadow)">
    <rect x="400" y="105" width="400" height="82" rx="20" fill="#183047"/>
    <text x="600" y="139" text-anchor="middle" font-size="23" font-weight="700" fill="#ffffff">COOPERATION CHALLENGE</text>
    <text x="600" y="166" text-anchor="middle" font-size="16" fill="#d8e6ef">private incentive conflicts with joint value</text>

    <rect x="25" y="255" width="210" height="185" rx="19" fill="#eaf3f8" stroke="#25678f" stroke-width="3"/>
    <text x="130" y="294" text-anchor="middle" font-size="20" font-weight="700" fill="#183047">REPEATED</text>
    <text x="130" y="320" text-anchor="middle" font-size="20" font-weight="700" fill="#183047">INTERACTION</text>
    <line x1="58" y1="343" x2="202" y2="343" stroke="#9eb9ca" stroke-width="2"/>
    <text x="130" y="374" text-anchor="middle" font-size="16" fill="#607080">future value</text>
    <text x="130" y="401" text-anchor="middle" font-size="16" fill="#607080">reciprocity • forgiveness</text>

    <rect x="260" y="255" width="210" height="185" rx="19" fill="#f5ebf5" stroke="#795a8a" stroke-width="3"/>
    <text x="365" y="307" text-anchor="middle" font-size="20" font-weight="700" fill="#183047">REPUTATION</text>
    <line x1="293" y1="343" x2="437" y2="343" stroke="#c8afd0" stroke-width="2"/>
    <text x="365" y="374" text-anchor="middle" font-size="16" fill="#607080">history travels</text>
    <text x="365" y="401" text-anchor="middle" font-size="16" fill="#607080">indirect reciprocity</text>

    <rect x="495" y="255" width="210" height="185" rx="19" fill="#fff4e8" stroke="#b95f2d" stroke-width="3"/>
    <text x="600" y="294" text-anchor="middle" font-size="20" font-weight="700" fill="#183047">SOCIAL</text>
    <text x="600" y="320" text-anchor="middle" font-size="20" font-weight="700" fill="#183047">PREFERENCES</text>
    <line x1="528" y1="343" x2="672" y2="343" stroke="#dfb59e" stroke-width="2"/>
    <text x="600" y="374" text-anchor="middle" font-size="16" fill="#607080">fairness • efficiency</text>
    <text x="600" y="401" text-anchor="middle" font-size="16" fill="#607080">intentions • reciprocity</text>

    <rect x="730" y="255" width="210" height="185" rx="19" fill="#edf4ed" stroke="#447c55" stroke-width="3"/>
    <text x="835" y="294" text-anchor="middle" font-size="20" font-weight="700" fill="#183047">NORMS +</text>
    <text x="835" y="320" text-anchor="middle" font-size="20" font-weight="700" fill="#183047">INSTITUTIONS</text>
    <line x1="763" y1="343" x2="907" y2="343" stroke="#a9c7b1" stroke-width="2"/>
    <text x="835" y="374" text-anchor="middle" font-size="16" fill="#607080">expectations • rules</text>
    <text x="835" y="401" text-anchor="middle" font-size="16" fill="#607080">monitoring • sanctions</text>

    <rect x="965" y="255" width="210" height="185" rx="19" fill="#f7f1e8" stroke="#b08a3f" stroke-width="3"/>
    <text x="1070" y="294" text-anchor="middle" font-size="20" font-weight="700" fill="#183047">NETWORKS +</text>
    <text x="1070" y="320" text-anchor="middle" font-size="20" font-weight="700" fill="#183047">SPACE</text>
    <line x1="998" y1="343" x2="1142" y2="343" stroke="#d8c69d" stroke-width="2"/>
    <text x="1070" y="374" text-anchor="middle" font-size="16" fill="#607080">who meets whom</text>
    <text x="1070" y="401" text-anchor="middle" font-size="16" fill="#607080">clustering • matching</text>

    <rect x="365" y="535" width="470" height="82" rx="20" fill="#edf4ed" stroke="#447c55" stroke-width="3"/>
    <text x="600" y="570" text-anchor="middle" font-size="24" font-weight="700" fill="#183047">ROBUST COOPERATION</text>
    <text x="600" y="598" text-anchor="middle" font-size="16" fill="#607080">works under the diagnosed mechanism and its failure conditions</text>

    <rect x="95" y="680" width="1010" height="55" rx="20" fill="#fff0e9" stroke="#b95f2d" stroke-width="3"/>
    <text x="600" y="714" text-anchor="middle" font-size="17" font-weight="700" fill="#183047">AUDIT: noise • outsiders • punishment • power • transparency • correction • meaningful exit</text>
  </g>

  <line x1="600" y1="187" x2="600" y2="218" stroke="#25678f" stroke-width="4"/>
  <line x1="130" y1="218" x2="1070" y2="218" stroke="#25678f" stroke-width="4"/>
  <line x1="130" y1="218" x2="130" y2="252" stroke="#25678f" stroke-width="4" marker-end="url(#arrow)"/>
  <line x1="365" y1="218" x2="365" y2="252" stroke="#25678f" stroke-width="4" marker-end="url(#arrow)"/>
  <line x1="600" y1="218" x2="600" y2="252" stroke="#25678f" stroke-width="4" marker-end="url(#arrow)"/>
  <line x1="835" y1="218" x2="835" y2="252" stroke="#25678f" stroke-width="4" marker-end="url(#arrow)"/>
  <line x1="1070" y1="218" x2="1070" y2="252" stroke="#25678f" stroke-width="4" marker-end="url(#arrow)"/>

  <line x1="130" y1="440" x2="130" y2="485" stroke="#447c55" stroke-width="3.5"/>
  <line x1="365" y1="440" x2="365" y2="485" stroke="#447c55" stroke-width="3.5"/>
  <line x1="600" y1="440" x2="600" y2="485" stroke="#447c55" stroke-width="3.5"/>
  <line x1="835" y1="440" x2="835" y2="485" stroke="#447c55" stroke-width="3.5"/>
  <line x1="1070" y1="440" x2="1070" y2="485" stroke="#447c55" stroke-width="3.5"/>
  <line x1="130" y1="485" x2="1070" y2="485" stroke="#447c55" stroke-width="3.5"/>
  <line x1="600" y1="485" x2="600" y2="532" stroke="#447c55" stroke-width="4" marker-end="url(#greenArrow)"/>
  <line x1="600" y1="617" x2="600" y2="677" stroke="#b95f2d" stroke-width="4" marker-end="url(#auditArrow)"/>
</svg>

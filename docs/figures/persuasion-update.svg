<?xml version="1.0" encoding="utf-8" ?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink" baseProfile="full" height="650" version="1.1" viewBox="0 0 1200 650" width="1200">
  <defs/>
  <title>Persuasion as model updating</title>
  <desc>An audience current model meets a credible message that directs attention, provides evidence, connects value, addresses identity and efficacy, and makes action possible.</desc>
  <rect fill="white" height="650" width="1200" x="0" y="0"/>
  <text fill="#17324d" font-family="Arial, sans-serif" font-size="34" font-weight="bold" text-anchor="middle" x="600" y="48">Persuasion is guided model updating</text>
  <rect fill="#eaf3f8" height="120" rx="16" ry="16" stroke="#2f6f9f" stroke-width="3" width="230" x="45" y="230"/>
  <text fill="#17324d" font-family="Arial, sans-serif" font-size="26" font-weight="bold" text-anchor="middle" x="160.0" y="282.0">Audience model</text>
  <text fill="#66737f" font-family="Arial, sans-serif" font-size="17" font-weight="normal" text-anchor="middle" x="160.0" y="316.0">beliefs • values • identity</text>
  <line stroke="#17324d" stroke-width="4" x1="275" x2="430" y1="290" y2="290"/>
  <polygon fill="#17324d" points="430,290 417.0096189432334,297.5 417.0096189432334,282.5"/>
  <rect fill="#eaf3f8" height="290" rx="16" ry="16" stroke="#2f6f9f" stroke-width="3" width="340" x="430" y="145"/>
  <text fill="#17324d" font-family="Arial, sans-serif" font-size="26" font-weight="bold" text-anchor="middle" x="600.0" y="282.0">Message design</text>
  <text fill="#66737f" font-family="Arial, sans-serif" font-size="17" font-weight="normal" text-anchor="middle" x="600.0" y="316.0">ethos • pathos • logos • kairos</text>
  <text fill="#17324d" font-family="Arial, sans-serif" font-size="21" font-weight="normal" text-anchor="middle" x="600" y="245">• attention</text>
  <text fill="#17324d" font-family="Arial, sans-serif" font-size="21" font-weight="normal" text-anchor="middle" x="600" y="287">• evidence</text>
  <text fill="#17324d" font-family="Arial, sans-serif" font-size="21" font-weight="normal" text-anchor="middle" x="600" y="329">• meaning</text>
  <text fill="#17324d" font-family="Arial, sans-serif" font-size="21" font-weight="normal" text-anchor="middle" x="600" y="371">• efficacy</text>
  <line stroke="#17324d" stroke-width="4" x1="770" x2="925" y1="290" y2="290"/>
  <polygon fill="#17324d" points="925,290 912.0096189432334,297.5 912.0096189432334,282.5"/>
  <rect fill="#f7f1e8" height="120" rx="16" ry="16" stroke="#c56a2d" stroke-width="3" width="230" x="925" y="230"/>
  <text fill="#17324d" font-family="Arial, sans-serif" font-size="26" font-weight="bold" text-anchor="middle" x="1040.0" y="282.0">Updated model</text>
  <text fill="#66737f" font-family="Arial, sans-serif" font-size="17" font-weight="normal" text-anchor="middle" x="1040.0" y="316.0">belief + intention + action</text>
  <text fill="#17324d" font-family="Arial, sans-serif" font-size="22" font-weight="normal" text-anchor="middle" x="600" y="520">A message fails when it answers the obstacle the persuader wishes existed.</text>
  <text fill="#66737f" font-family="Arial, sans-serif" font-size="20" font-weight="normal" text-anchor="middle" x="600" y="565">Ethical persuasion preserves the audience’s ability to inspect and refuse.</text>
</svg>

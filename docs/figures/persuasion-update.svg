<svg xmlns="http://www.w3.org/2000/svg" width="760" height="765" viewBox="0 0 760 765" role="img" aria-labelledby="title desc">
<title id="title">What did the message change?</title><desc id="desc">An audience’s concern informs the message and evidence offered. Three distinct possible outcomes are belief revision, intention, and action. Ethical persuasion permits inspection and refusal.</desc>
<rect width="760" height="765" fill="white"/>
<defs>
<marker id="a" viewBox="0 0 12 10" markerWidth="9" markerHeight="8" refX="11" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L11 5 L1 9 Z" fill="#2f6f9f"/></marker>
<marker id="g" viewBox="0 0 12 10" markerWidth="9" markerHeight="8" refX="11" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L11 5 L1 9 Z" fill="#3f7c59"/></marker>
<marker id="o" viewBox="0 0 12 10" markerWidth="9" markerHeight="8" refX="11" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L11 5 L1 9 Z" fill="#b95f2d"/></marker>
</defs>
<text x="380" y="48" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="700" fill="#17324d">What did the message change?</text>
<rect x="70" y="107" width="620" height="108" rx="18" fill="#edf5fa" stroke="#2f6f9f" stroke-width="2.5"/>
<text x="380" y="149" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="700" fill="#17324d">Understand the concern</text>
<text x="380" y="187" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="400" fill="#53697d">What does this audience doubt or need?</text>
<path d="M380 215 V255" fill="none" stroke="#2f6f9f" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#a)"/>
<rect x="70" y="255" width="620" height="108" rx="18" fill="#fff5ec" stroke="#b95f2d" stroke-width="2.5"/>
<text x="380" y="297" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="700" fill="#17324d">Offer a relevant message</text>
<text x="380" y="335" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="400" fill="#53697d">Make the evidence and proposed action clear.</text>
<path d="M380 363 V394 H140 V437" fill="none" stroke="#2f6f9f" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#a)"/>
<path d="M380 394 V437" fill="none" stroke="#2f6f9f" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#a)"/>
<path d="M380 394 H620 V437" fill="none" stroke="#2f6f9f" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#a)"/>
<rect x="30" y="437" width="220" height="180" rx="18" fill="#edf7ef" stroke="#3f7c59" stroke-width="2.5"/>
<text x="140" y="481" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#17324d">Belief</text>
<text x="140" y="524" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="400" fill="#17324d">Do they see</text>
<text x="140" y="560.4" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="400" fill="#17324d">the issue</text>
<text x="140" y="596.8" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="400" fill="#17324d">differently?</text>
<rect x="270" y="437" width="220" height="180" rx="18" fill="#edf7ef" stroke="#3f7c59" stroke-width="2.5"/>
<text x="380" y="481" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#17324d">Intention</text>
<text x="380" y="524" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="400" fill="#17324d">Do they plan</text>
<text x="380" y="560.4" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="400" fill="#17324d">to do</text>
<text x="380" y="596.8" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="400" fill="#17324d">something?</text>
<rect x="510" y="437" width="220" height="180" rx="18" fill="#edf7ef" stroke="#3f7c59" stroke-width="2.5"/>
<text x="620" y="481" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#17324d">Action</text>
<text x="620" y="524" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="400" fill="#17324d">Do they</text>
<text x="620" y="560.4" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="400" fill="#17324d">actually</text>
<text x="620" y="596.8" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="400" fill="#17324d">do it?</text>
<text x="380" y="671" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#3f7c59">Measure these outcomes separately.</text>
<text x="380" y="725" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="400" fill="#53697d">Keep evidence inspectable and refusal possible.</text>
</svg>

<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1170" viewBox="0 0 900 1170" role="img" aria-labelledby="title desc">
  <title id="title">Stylized discount models and a quasi-hyperbolic preference reversal</title>
  <desc id="desc">The upper plot shows three declared teaching discount functions: exponential delta to the t with delta zero point nine five, hyperbolic one over one plus zero point one five t, and quasi-hyperbolic beta times delta to the t for future periods with beta zero point seven and delta zero point nine five. The lower comparison assumes linear utility. Viewed today, the quasi-hyperbolic model prefers one hundred twenty euros in thirteen months to one hundred euros in twelve months. At month twelve it reverses to one hundred euros immediately. The exponential model keeps the later reward preferred. The figure states that these are model implications, not universal human curves.</desc>
  <defs>
    <style>
      .title{font:700 35px Arial,sans-serif;fill:#17324d}
      .subtitle{font:29px Arial,sans-serif;fill:#536879}
      .axis{stroke:#4f6476;stroke-width:2.5}
      .grid{stroke:#d8e1e8;stroke-width:1.5}
      .tick{font:28px Arial,sans-serif;fill:#536879}
      .axislabel{font:700 30px Arial,sans-serif;fill:#17324d}
      .legend{font:27px Arial,sans-serif;fill:#17324d}
      .heading{font:700 29px Arial,sans-serif;fill:#17324d}
      .rowtitle{font:700 27px Arial,sans-serif;fill:#17324d}
      .rowtext{font:27px Arial,sans-serif;fill:#40566a}
      .choice{font:700 27px Arial,sans-serif;fill:#2f6f43}
      .boundary{font:26px Arial,sans-serif;fill:#40566a}
      .boundaryStrong{font:700 26px Arial,sans-serif;fill:#17324d}
    </style>
  </defs>

  <rect width="900" height="1120" fill="#ffffff"/>
  <text class="title" x="450" y="39" text-anchor="middle">Discount models imply</text>
  <text class="title" x="450" y="76" text-anchor="middle">different consistency predictions</text>
  <text class="subtitle" x="450" y="108" text-anchor="middle">Declared parameters—not fitted data or universal curves</text>

  <rect x="55" y="115" width="790" height="475" rx="22" fill="#f8fafc" stroke="#b8c9d6" stroke-width="2"/>
  <line x1="105" y1="142" x2="160" y2="142" stroke="#2f6f9f" stroke-width="5"/>
  <text class="legend" x="172" y="150">Exponential: 0.95ᵗ</text>
  <line x1="105" y1="178" x2="160" y2="178" stroke="#c96021" stroke-width="5" stroke-dasharray="11 7"/>
  <text class="legend" x="172" y="186">Hyperbolic: 1/(1 + 0.15t)</text>
  <line x1="515" y1="142" x2="565" y2="142" stroke="#3f7f54" stroke-width="5" stroke-dasharray="3 7" stroke-linecap="round"/>
  <text class="legend" x="580" y="150">Quasi: 1 now;</text>
  <text class="legend" x="580" y="180">0.70×0.95ᵗ later</text>

  <line class="grid" x1="90" y1="265" x2="810" y2="265"/>
  <line class="grid" x1="90" y1="350" x2="810" y2="350"/>
  <line class="grid" x1="90" y1="435" x2="810" y2="435"/>
  <line class="grid" x1="270" y1="210" x2="270" y2="520"/>
  <line class="grid" x1="450" y1="210" x2="450" y2="520"/>
  <line class="grid" x1="630" y1="210" x2="630" y2="520"/>
  <line class="axis" x1="90" y1="520" x2="810" y2="520"/>
  <line class="axis" x1="90" y1="180" x2="90" y2="520"/>

  <text class="tick" x="90" y="550" text-anchor="middle">0</text>
  <text class="tick" x="270" y="550" text-anchor="middle">3</text>
  <text class="tick" x="450" y="550" text-anchor="middle">6</text>
  <text class="tick" x="630" y="550" text-anchor="middle">9</text>
  <text class="tick" x="810" y="550" text-anchor="middle">12</text>
  <text class="tick" x="75" y="528" text-anchor="end">0</text>
  <text class="tick" x="75" y="443" text-anchor="end">.25</text>
  <text class="tick" x="75" y="358" text-anchor="end">.50</text>
  <text class="tick" x="75" y="273" text-anchor="end">.75</text>
  <text class="tick" x="75" y="188" text-anchor="end">1</text>
  <text class="axislabel" x="450" y="582" text-anchor="middle">Delay, t (periods)</text>
  <text class="axislabel" x="26" y="350" text-anchor="middle" transform="rotate(-90 26 350)">Decision weight, D(t)</text>

  <path d="M 90.0 180.0 L 105.0 184.3 L 120.0 188.6 L 135.0 192.8 L 150.0 197.0 L 165.0 201.1 L 180.0 205.2 L 195.0 209.2 L 210.0 213.2 L 225.0 217.1 L 240.0 220.9 L 255.0 224.7 L 270.0 228.5 L 285.0 232.2 L 300.0 235.9 L 315.0 239.5 L 330.0 243.1 L 345.0 246.6 L 360.0 250.1 L 375.0 253.5 L 390.0 256.9 L 405.0 260.3 L 420.0 263.6 L 435.0 266.8 L 450.0 270.1 L 465.0 273.3 L 480.0 276.4 L 495.0 279.5 L 510.0 282.6 L 525.0 285.6 L 540.0 288.6 L 555.0 291.5 L 570.0 294.4 L 585.0 297.3 L 600.0 300.1 L 615.0 302.9 L 630.0 305.7 L 645.0 308.4 L 660.0 311.1 L 675.0 313.8 L 690.0 316.4 L 705.0 319.0 L 720.0 321.6 L 735.0 324.1 L 750.0 326.6 L 765.0 329.1 L 780.0 331.5 L 795.0 333.9 L 810.0 336.3" fill="none" stroke="#2f6f9f" stroke-width="5" stroke-linecap="round"/>
  <path d="M 90.0 180.0 L 105.0 192.3 L 120.0 203.7 L 135.0 214.4 L 150.0 224.3 L 165.0 233.7 L 180.0 242.4 L 195.0 250.7 L 210.0 258.5 L 225.0 265.8 L 240.0 272.7 L 255.0 279.3 L 270.0 285.5 L 285.0 291.4 L 300.0 297.0 L 315.0 302.4 L 330.0 307.5 L 345.0 312.4 L 360.0 317.0 L 375.0 321.5 L 390.0 325.7 L 405.0 329.8 L 420.0 333.7 L 435.0 337.4 L 450.0 341.1 L 465.0 344.5 L 480.0 347.8 L 495.0 351.1 L 510.0 354.1 L 525.0 357.1 L 540.0 360.0 L 555.0 362.8 L 570.0 365.5 L 585.0 368.0 L 600.0 370.5 L 615.0 373.0 L 630.0 375.3 L 645.0 377.6 L 660.0 379.8 L 675.0 381.9 L 690.0 384.0 L 705.0 386.0 L 720.0 388.0 L 735.0 389.9 L 750.0 391.7 L 765.0 393.5 L 780.0 395.2 L 795.0 396.9 L 810.0 398.6" fill="none" stroke="#c96021" stroke-width="5" stroke-dasharray="11 7" stroke-linecap="round"/>
  <line x1="90" y1="180" x2="90" y2="282" stroke="#3f7f54" stroke-width="4" stroke-dasharray="4 6"/>
  <circle cx="90" cy="180" r="7" fill="#3f7f54"/>
  <circle cx="90" cy="282" r="7" fill="#ffffff" stroke="#3f7f54" stroke-width="4"/>
  <path d="M 90.2 282.0 L 105.0 285.0 L 120.0 288.0 L 135.0 291.0 L 150.0 293.9 L 165.0 296.8 L 180.0 299.6 L 195.0 302.4 L 210.0 305.2 L 225.0 307.9 L 240.0 310.6 L 255.0 313.3 L 270.0 315.9 L 285.0 318.5 L 300.0 321.1 L 315.0 323.6 L 330.0 326.1 L 345.0 328.6 L 360.0 331.1 L 375.0 333.5 L 390.0 335.8 L 405.0 338.2 L 420.0 340.5 L 435.0 342.8 L 450.0 345.0 L 465.0 347.3 L 480.0 349.5 L 495.0 351.7 L 510.0 353.8 L 525.0 355.9 L 540.0 358.0 L 555.0 360.1 L 570.0 362.1 L 585.0 364.1 L 600.0 366.1 L 615.0 368.1 L 630.0 370.0 L 645.0 371.9 L 660.0 373.8 L 675.0 375.7 L 690.0 377.5 L 705.0 379.3 L 720.0 381.1 L 735.0 382.9 L 750.0 384.6 L 765.0 386.4 L 780.0 388.1 L 795.0 389.7 L 810.0 391.4" fill="none" stroke="#3f7f54" stroke-width="5" stroke-dasharray="3 7" stroke-linecap="round"/>

  <text class="heading" x="450" y="635" text-anchor="middle">One quasi-hyperbolic example: β = .70, δ = .95</text>
  <text class="subtitle" x="450" y="670" text-anchor="middle">Linear utility assumed only to make the arithmetic visible</text>

  <rect x="65" y="700" width="770" height="135" rx="20" fill="#eef5ef" stroke="#8db29a" stroke-width="2"/>
  <text class="rowtitle" x="92" y="739">Viewed today: both rewards are delayed</text>
  <text class="rowtext" x="92" y="777">€100×βδ¹² = €37.8</text>
  <text class="rowtext" x="425" y="777">€120×βδ¹³ = €43.1</text>
  <text class="choice" x="808" y="811" text-anchor="end">Model prefers €120 later</text>

  <rect x="65" y="855" width="770" height="135" rx="20" fill="#f9f1e8" stroke="#d2a16f" stroke-width="2"/>
  <text class="rowtitle" x="92" y="894">At month 12: the smaller reward is immediate</text>
  <text class="rowtext" x="92" y="932">€100 now = €100</text>
  <text class="rowtext" x="425" y="932">€120×βδ = €79.8</text>
  <text x="808" y="966" text-anchor="end" font-family="Arial,sans-serif" font-size="27" font-weight="700" fill="#a94c17">Model reverses to €100 now</text>

  <rect x="65" y="1010" width="770" height="135" rx="18" fill="#edf3f8" stroke="#9db6c8" stroke-width="2"/>
  <text class="boundaryStrong" x="450" y="1043" text-anchor="middle">With exponential δ=.95, the relative ranking stays stable:</text>
  <text class="boundary" x="450" y="1077" text-anchor="middle">€120 next period receives €114 of weight, more than €100 now.</text>
  <text class="boundary" x="450" y="1113" text-anchor="middle">Actual choices can also reflect liquidity, trust, risk, and changing states.</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="780" viewBox="0 0 1100 780">
<title>Perception combines expectations and incoming signals</title><desc>A simplified predictive-processing account. Expectations and incoming signals contribute to perceptual inference. Action changes what is sampled next. Discrepancies between expected and incoming signals may update the internal model; their estimated reliability changes their influence.</desc>
<rect width="1100" height="780" fill="white"/>
<defs><marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0 L9 4 L0 8 Z" fill="context-stroke"/></marker></defs>
<g font-family="Arial, sans-serif" fill="#17324d">
<text x="550" y="48" font-size="32" font-weight="bold" fill="#17324d" text-anchor="middle">
<tspan x="550" dy="0">Perception combines expectations and incoming signals</tspan>
</text>
<rect x="70" y="180" width="320" height="150" rx="17" fill="#eaf3f8" stroke="#2f6f9f" stroke-width="3"/>
<text x="230.0" y="218" font-size="27" font-weight="bold" fill="#17324d" text-anchor="middle">
<tspan x="230.0" dy="0">Expectations</tspan>
</text>
<text x="230.0" y="253.0" font-size="22" font-weight="normal" fill="#52677b" text-anchor="middle">
<tspan x="230.0" dy="0">An internal model predicts</tspan>
<tspan x="230.0" dy="27.5">what may be encountered.</tspan>
</text>
<rect x="70" y="470" width="320" height="135" rx="17" fill="#eaf3f8" stroke="#2f6f9f" stroke-width="3"/>
<text x="230.0" y="508" font-size="27" font-weight="bold" fill="#17324d" text-anchor="middle">
<tspan x="230.0" dy="0">Incoming signals</tspan>
</text>
<text x="230.0" y="543.0" font-size="22" font-weight="normal" fill="#52677b" text-anchor="middle">
<tspan x="230.0" dy="0">Evidence from the</tspan>
<tspan x="230.0" dy="27.5">world and body</tspan>
</text>
<rect x="530" y="325" width="280" height="160" rx="17" fill="#edf4ed" stroke="#447c55" stroke-width="3"/>
<text x="670.0" y="363" font-size="27" font-weight="bold" fill="#17324d" text-anchor="middle">
<tspan x="670.0" dy="0">Perception</tspan>
</text>
<text x="670.0" y="398.0" font-size="23" font-weight="normal" fill="#52677b" text-anchor="middle">
<tspan x="670.0" dy="0">Infer a likely cause</tspan>
<tspan x="670.0" dy="28.75">of the signals.</tspan>
</text>
<rect x="895" y="325" width="170" height="160" rx="17" fill="#edf4ed" stroke="#447c55" stroke-width="3"/>
<text x="980.0" y="363" font-size="24" font-weight="bold" fill="#17324d" text-anchor="middle">
<tspan x="980.0" dy="0">Action and</tspan>
<tspan x="980.0" dy="30.0">sampling</tspan>
</text>
<text x="980.0" y="428.0" font-size="21" font-weight="normal" fill="#52677b" text-anchor="middle">
<tspan x="980.0" dy="0">Look or act.</tspan>
</text>
<path d="M390 255 H455 V370 H530" fill="none" stroke="#2f6f9f" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M390 537 H455 V440 H530" fill="none" stroke="#2f6f9f" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M810 405 H895" fill="none" stroke="#447c55" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M980 485 V675 H230 V605" fill="none" stroke="#447c55" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="660" y="654" font-size="22" font-weight="normal" fill="#447c55" text-anchor="middle">
<tspan x="660" dy="0">Sampling changes the next evidence.</tspan>
</text>
<path d="M330 470 V330" fill="none" stroke="#c56a2d" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="195" y="385" font-size="21" font-weight="normal" fill="#c56a2d" text-anchor="middle">
<tspan x="195" dy="0">Mismatch can</tspan>
<tspan x="195" dy="26.25">update the model.</tspan>
</text>
<text x="550" y="733" font-size="23" font-weight="normal" fill="#52677b" text-anchor="middle">
<tspan x="550" dy="0">The estimated reliability of signals affects how strongly they count.</tspan>
</text>
</g></svg>

<svg xmlns="http://www.w3.org/2000/svg" width="760" height="905" viewBox="0 0 760 905" role="img" aria-labelledby="title desc">
<title id="title">One way to build a story</title><desc id="desc">An author’s writing template starts with what someone expects, introduces trouble, follows a consequential choice, considers another explanation, and asks what follows. Belief revision and action remain separate outcomes to test.</desc>
<rect width="760" height="905" fill="white"/>
<defs>
<marker id="a" viewBox="0 0 12 10" markerWidth="9" markerHeight="8" refX="11" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L11 5 L1 9 Z" fill="#2f6f9f"/></marker>
<marker id="g" viewBox="0 0 12 10" markerWidth="9" markerHeight="8" refX="11" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L11 5 L1 9 Z" fill="#3f7c59"/></marker>
<marker id="o" viewBox="0 0 12 10" markerWidth="9" markerHeight="8" refX="11" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L11 5 L1 9 Z" fill="#b95f2d"/></marker>
</defs>
<text x="380" y="48" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="700" fill="#17324d">One way to build a story</text>
<rect x="45" y="105" width="670" height="102" rx="18" fill="#edf5fa" stroke="#2f6f9f" stroke-width="2.5"/>
<text x="380" y="144" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#17324d">The current story</text>
<text x="380" y="182" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="400" fill="#53697d">What does this person expect?</text>
<path d="M380 207 V250" fill="none" stroke="#2f6f9f" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#a)"/>
<rect x="45" y="250" width="670" height="102" rx="18" fill="#edf5fa" stroke="#2f6f9f" stroke-width="2.5"/>
<text x="380" y="289" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#17324d">But something does not fit</text>
<text x="380" y="327" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="400" fill="#53697d">Why does the mismatch matter?</text>
<path d="M380 352 V395" fill="none" stroke="#2f6f9f" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#a)"/>
<rect x="45" y="395" width="670" height="102" rx="18" fill="#edf5fa" stroke="#2f6f9f" stroke-width="2.5"/>
<text x="380" y="434" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#17324d">A consequential choice</text>
<text x="380" y="472" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="400" fill="#53697d">What do they try, and what happens?</text>
<path d="M380 497 V540" fill="none" stroke="#2f6f9f" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#a)"/>
<rect x="45" y="540" width="670" height="102" rx="18" fill="#fff5ec" stroke="#b95f2d" stroke-width="2.5"/>
<text x="380" y="579" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#17324d">Another way to see it</text>
<text x="380" y="617" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="400" fill="#53697d">What might the first explanation have missed?</text>
<path d="M380 642 V685" fill="none" stroke="#2f6f9f" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#a)"/>
<rect x="45" y="685" width="670" height="102" rx="18" fill="#fff5ec" stroke="#b95f2d" stroke-width="2.5"/>
<text x="380" y="724" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#17324d">Therefore, what follows?</text>
<text x="380" y="762" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="400" fill="#53697d">Connect the evidence to a possible next step.</text>

<text x="380" y="869.4" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="400" fill="#3f7c59">Test belief revision and action separately.</text>
</svg>

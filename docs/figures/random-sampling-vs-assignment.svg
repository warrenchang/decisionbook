<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="885" viewBox="0 0 1000 885" role="img" aria-labelledby="title desc">
  <title id="title">Random sampling and random assignment answer different questions</title>
  <desc id="desc">Two side-by-side panels distinguish random sampling from a defined population into a probability sample, which supports population claims under the sampling design, from random assignment of an eligible study sample into conditions, which supports an internal causal contrast. A boundary box explains that neither process alone fixes noncompliance, missingness, attrition, interference, or transportability.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 8" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0.5 0.8 L9 4 L0.5 7.2 Z" fill="#5f7080"/>
    </marker>
    <marker id="blue-arrow" viewBox="0 0 10 8" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0.5 0.8 L9 4 L0.5 7.2 Z" fill="#2f6f9f"/>
    </marker>
    <marker id="red-arrow" viewBox="0 0 10 8" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0.5 0.8 L9 4 L0.5 7.2 Z" fill="#a74343"/>
    </marker>
  </defs>
  <rect width="1000" height="885" fill="#f8fafc"/>
<text x="500" y="54" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700" fill="#17324d" >Two random processes answer different questions</text>
<text x="500" y="90" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" fill="#5f7080" >Sampling links a sample to a population; assignment creates a causal contrast inside the study.</text>

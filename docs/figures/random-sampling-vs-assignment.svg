<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="760" height="840" viewBox="0 0 760 840" role="img" aria-labelledby="title desc">
  <title id="title">Random sampling and random assignment</title>
  <desc id="desc">The target population passes through random sampling into an evaluation sample and people not in the evaluation. Only the evaluation sample proceeds to random assignment, which divides it into treatment and control groups. Unboxed side labels connect sampling to external validity and assignment to internal validity; they describe the inferences supported, not additional study procedures. Neither procedure alone guarantees validity.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 8" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0.5 0.8 L9 4 L0.5 7.2 Z" fill="#5f7080"/>
    </marker>
    <marker id="blue-arrow" viewBox="0 0 10 8" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0.5 0.8 L9 4 L0.5 7.2 Z" fill="#2f6f9f"/>
    </marker>
    <marker id="red-arrow" viewBox="0 0 10 8" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0.5 0.8 L9 4 L0.5 7.2 Z" fill="#a74343"/>
    </marker>
  </defs>
  <rect width="760" height="840" fill="#f8fafc"/>
<g id="target-population">
<rect x="25" y="20" width="710" height="125" rx="18" fill="#b55b25" stroke="#b55b25" stroke-width="2"/>
<text x="380" y="98" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="600" fill="#ffffff" >Target population</text>
</g>
<g id="random-sampling">
<rect x="255" y="185" width="250" height="110" rx="18" fill="#2b7a78" stroke="#2b7a78" stroke-width="2"/>
<text x="380" y="230" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="600" fill="#ffffff" >Random</text>
<text x="380" y="268" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="600" fill="#ffffff" >sampling</text>
</g>
<g id="evaluation-sample">
<rect x="25" y="365" width="305" height="130" rx="18" fill="#b55b25" stroke="#b55b25" stroke-width="2"/>
<text x="177.5" y="442" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="600" fill="#ffffff" >Evaluation sample</text>
</g>
<g id="not-in-evaluation">
<rect x="370" y="365" width="365" height="130" rx="18" fill="#b55b25" stroke="#b55b25" stroke-width="2"/>
<text x="552.5" y="442" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="600" fill="#ffffff" >Not in evaluation</text>
</g>
<g id="random-assignment">
<rect x="50" y="548" width="255" height="110" rx="18" fill="#2b7a78" stroke="#2b7a78" stroke-width="2"/>
<text x="177.5" y="593" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="600" fill="#ffffff" >Random</text>
<text x="177.5" y="631" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="600" fill="#ffffff" >assignment</text>
</g>
<g id="treatment-group">
<rect x="25" y="718" width="200" height="102" rx="18" fill="#b55b25" stroke="#b55b25" stroke-width="2"/>
<text x="125" y="760" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="600" fill="#ffffff" >Treatment</text>
<text x="125" y="798" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="600" fill="#ffffff" >group</text>
</g>
<g id="control-group">
<rect x="255" y="718" width="200" height="102" rx="18" fill="#b55b25" stroke="#b55b25" stroke-width="2"/>
<text x="355" y="760" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="600" fill="#ffffff" >Control</text>
<text x="355" y="798" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="600" fill="#ffffff" >group</text>
</g>
<path d="M380 145 V185" fill="none" stroke="#5f7080" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M380 295 V327" fill="none" stroke="#5f7080" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M380 327 H177.5 V365" fill="none" stroke="#5f7080" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M380 327 H552.5 V365" fill="none" stroke="#5f7080" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M177.5 495 V548" fill="none" stroke="#5f7080" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M177.5 658 V684" fill="none" stroke="#5f7080" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M177.5 684 H125 V718" fill="none" stroke="#5f7080" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M177.5 684 H355 V718" fill="none" stroke="#5f7080" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M505 240 H565" fill="none" stroke="#2f6f9f" stroke-width="3" stroke-linecap="round" marker-end="url(#blue-arrow)"/>
<path d="M305 603 H375" fill="none" stroke="#2f6f9f" stroke-width="3" stroke-linecap="round" marker-end="url(#blue-arrow)"/>
<g id="external-validity">
<text x="585" y="230" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="400" fill="#2f6f9f" >External</text>
<text x="585" y="268" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="400" fill="#2f6f9f" >validity</text>
</g>
<g id="internal-validity">
<text x="395" y="593" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="400" fill="#2f6f9f" >Internal</text>
<text x="395" y="631" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="400" fill="#2f6f9f" >validity</text>
</g>
</svg>

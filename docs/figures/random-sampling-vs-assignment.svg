<text x="843" y="485" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" fill="#5f7080" >by assignment</text>
<text x="740" y="540" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" fill="#447c55" >COMPARE OUTCOMES</text>
<rect x="567" y="565" width="346" height="92" rx="18" fill="#edf4ed" stroke="#447c55" stroke-width="2"/>
<text x="740" y="600" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#447c55" >SUPPORTS AN INTERNAL CONTRAST</text>
<text x="740" y="632" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" fill="#5f7080" >if assignment and follow-up hold</text>
<rect x="35" y="731" width="930" height="126" rx="20" fill="#fff0e9" stroke="#a74343" stroke-width="2"/>
<text x="500" y="771" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" fill="#a74343" >NEITHER RANDOM PROCESS IS A UNIVERSAL REPAIR</text>
<text x="500" y="807" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" fill="#17324d" >Sampling alone does not identify a treatment effect. Assignment alone does not establish transportability.</text>
<text x="500" y="834" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" fill="#17324d" >Neither one by itself fixes noncompliance, missing outcomes, attrition, or interference.</text>
</svg>

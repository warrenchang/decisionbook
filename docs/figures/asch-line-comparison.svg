<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">An Asch-style line-comparison activity</title>
  <desc id="desc">A target line is shown beside three comparison lines labeled A, B, and C. A lower prompt asks what might change if a unanimous group publicly chose a different line.</desc>
  <style>
    .title{font:700 34px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#183047}
    .sub{font:500 19px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#52677a}
    .panel{font:700 22px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#183047}
    .label{font:700 21px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#314b61}
    .note{font:600 18px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#314b61}
    .small{font:500 16px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#52677a}
  </style>
  <rect x="18" y="18" width="1164" height="584" rx="28" fill="#f7f9fc" stroke="#9fb2c3" stroke-width="2"/>
  <text x="600" y="66" class="title" text-anchor="middle">WHICH COMPARISON LINE MATCHES THE TARGET?</text>
  <text x="600" y="100" class="sub" text-anchor="middle">Write A, B, or C before reading further. The task is deliberately simple.</text>

  <rect x="72" y="139" width="346" height="315" rx="22" fill="#ffffff" stroke="#bfd0dd" stroke-width="2"/>
  <text x="245" y="181" class="panel" text-anchor="middle">TARGET</text>
  <line x1="245" y1="230" x2="245" y2="400" stroke="#183047" stroke-width="8" stroke-linecap="round"/>
  <path d="M230 230 H260 M230 400 H260" stroke="#c44e52" stroke-width="3"/>
  <text x="245" y="432" class="small" text-anchor="middle">170 units</text>

  <rect x="456" y="139" width="672" height="315" rx="22" fill="#ffffff" stroke="#bfd0dd" stroke-width="2"/>
  <text x="792" y="181" class="panel" text-anchor="middle">COMPARISON LINES</text>
  <line x1="596" y1="270" x2="596" y2="400" stroke="#183047" stroke-width="8" stroke-linecap="round"/>
  <line x1="792" y1="210" x2="792" y2="410" stroke="#183047" stroke-width="8" stroke-linecap="round"/>
  <line x1="988" y1="230" x2="988" y2="400" stroke="#183047" stroke-width="8" stroke-linecap="round"/>
  <text x="596" y="432" class="label" text-anchor="middle">A</text>
  <text x="792" y="432" class="label" text-anchor="middle">B</text>
  <text x="988" y="432" class="label" text-anchor="middle">C</text>

  <rect x="97" y="487" width="1006" height="76" rx="24" fill="#f8e4dc" stroke="#d8a69e"/>
  <text x="600" y="518" class="note" text-anchor="middle">Now imagine that several people answer “B” aloud before your turn.</text>
  <text x="600" y="544" class="small" text-anchor="middle">Would their answers change what you believe, the social cost of dissent, your public response—or some combination?</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="760" height="740" viewBox="0 0 760 740" role="img" aria-labelledby="title desc">
<title id="title">Let the story and the evidence do different jobs</title><desc id="desc">A story can make the human situation and choice concrete. Evidence checks frequency, comparison, causal explanation, and uncertainty. These complementary contributions can support a proposal people can inspect..</desc>
<rect width="760" height="740" fill="white"/>
<defs>
<marker id="a" viewBox="0 0 12 10" markerWidth="9" markerHeight="8" refX="11" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L11 5 L1 9 Z" fill="#2f6f9f"/></marker>
<marker id="g" viewBox="0 0 12 10" markerWidth="9" markerHeight="8" refX="11" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L11 5 L1 9 Z" fill="#3f7c59"/></marker>
<marker id="o" viewBox="0 0 12 10" markerWidth="9" markerHeight="8" refX="11" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L11 5 L1 9 Z" fill="#b95f2d"/></marker>
</defs>
<text x="380" y="48" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="700" fill="#17324d">Let story and evidence</text>
<text x="380" y="89.6" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="700" fill="#17324d">do different jobs</text>
<rect x="30" y="150" width="330" height="342" rx="18" fill="#fff5ec" stroke="#b95f2d" stroke-width="2.5"/>
<text x="195" y="195" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700" fill="#b95f2d">Story</text>
<text x="195" y="251" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="400" fill="#17324d">Who faces a choice?</text>
<text x="195" y="313" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="400" fill="#17324d">What matters to them?</text>
<text x="195" y="375" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="400" fill="#17324d">What happens next?</text>
<rect x="400" y="150" width="330" height="342" rx="18" fill="#edf5fa" stroke="#2f6f9f" stroke-width="2.5"/>
<text x="565" y="195" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700" fill="#2f6f9f">Evidence</text>
<text x="565" y="249" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="400" fill="#17324d">How common is it?</text>
<text x="565" y="301" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="400" fill="#17324d">Compared with what?</text>
<text x="565" y="353" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="400" fill="#17324d">What explains it?</text>
<text x="565" y="405" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="400" fill="#17324d">What is uncertain?</text>
<path d="M195 492 V535 H325 V575" fill="none" stroke="#b95f2d" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#o)"/>
<path d="M565 492 V535 H435 V575" fill="none" stroke="#2f6f9f" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#a)"/>
<rect x="75" y="575" width="610" height="95" rx="18" fill="#edf7ef" stroke="#3f7c59" stroke-width="2.5"/>
<text x="380" y="614" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#3f7c59">A proposal people can inspect</text>
<text x="380" y="650.4" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#3f7c59">and judge for themselves</text>
</svg>

<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Optional mental-accounting operations can change valuation and choice</title>
  <desc id="desc">An outcome may be labeled to an account, coded as a gain or loss, bracketed with other outcomes, coupled to consumption, or closed at a chosen time. These are optional representational operations, not required stages. Valuation may compare the representation with a reference point. A boundary may support self-control or distort substitution. Fungibility is a benchmark only for unrestricted, otherwise-equivalent monetary units.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 8" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0.5 0.8 L9 4 L0.5 7.2 Z" fill="#25678f"/></marker>
    <marker id="greenArrow" viewBox="0 0 10 8" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0.5 0.8 L9 4 L0.5 7.2 Z" fill="#447c55"/></marker>
    <marker id="orangeArrow" viewBox="0 0 10 8" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0.5 0.8 L9 4 L0.5 7.2 Z" fill="#b95f2d"/></marker>
    <filter id="shadow"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#183047" flood-opacity="0.13"/></filter>
  </defs>
  <rect width="1200" height="760" fill="#ffffff"/>
  <text x="600" y="52" text-anchor="middle" font-family="Georgia, serif" font-size="34" font-weight="700" fill="#183047">How mental accounts can shape valuation and choice</text>
  <text x="600" y="84" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#607080">For unrestricted, otherwise-equivalent units of money, fungibility is the benchmark.</text>

  <g filter="url(#shadow)" font-family="Arial, sans-serif">
    <rect x="50" y="275" width="190" height="120" rx="18" fill="#eaf3f8" stroke="#25678f" stroke-width="3"/>
    <text x="145" y="320" text-anchor="middle" font-size="23" font-weight="700" fill="#183047">Outcome</text>
    <text x="145" y="352" text-anchor="middle" font-size="16" fill="#607080">payment • gain • loss</text>
    <text x="145" y="377" text-anchor="middle" font-size="16" fill="#607080">purchase • investment</text>

    <rect x="300" y="130" width="520" height="410" rx="24" fill="#f7f9fc" stroke="#9eb9ca" stroke-width="3"/>
    <text x="560" y="168" text-anchor="middle" font-size="24" font-weight="700" fill="#183047">POSSIBLE ACCOUNTING OPERATIONS</text>

    <rect x="340" y="235" width="200" height="95" rx="15" fill="#eaf3f8" stroke="#25678f" stroke-width="2.5"/>
    <text x="440" y="273" text-anchor="middle" font-size="20" font-weight="700" fill="#183047">Label / open</text>
    <text x="440" y="301" text-anchor="middle" font-size="16" fill="#607080">Which account?</text>
    <rect x="580" y="235" width="200" height="95" rx="15" fill="#edf4ed" stroke="#447c55" stroke-width="2.5"/>
    <text x="680" y="273" text-anchor="middle" font-size="20" font-weight="700" fill="#183047">Code / post</text>
    <text x="680" y="301" text-anchor="middle" font-size="16" fill="#607080">Gain, loss, fee, saving?</text>
    <rect x="340" y="375" width="200" height="95" rx="15" fill="#f7f1e8" stroke="#b95f2d" stroke-width="2.5"/>
    <text x="440" y="413" text-anchor="middle" font-size="20" font-weight="700" fill="#183047">Bracket</text>
    <text x="440" y="441" text-anchor="middle" font-size="16" fill="#607080">Separate or combine?</text>
    <rect x="580" y="375" width="200" height="95" rx="15" fill="#f5ebf5" stroke="#795a8a" stroke-width="2.5"/>
    <text x="680" y="413" text-anchor="middle" font-size="20" font-weight="700" fill="#183047">Couple / close</text>
    <text x="680" y="437" text-anchor="middle" font-size="16" fill="#607080"><tspan x="680">Link use and payment?</tspan><tspan x="680" dy="20">Close when?</tspan></text>

    <rect x="880" y="245" width="270" height="180" rx="20" fill="#fff4e8" stroke="#b95f2d" stroke-width="3"/>
    <text x="1015" y="286" text-anchor="middle" font-size="23" font-weight="700" fill="#183047">VALUATION LAYER</text>
    <text x="1015" y="322" text-anchor="middle" font-size="17" fill="#607080">Compare with a reference</text>
    <text x="1015" y="352" text-anchor="middle" font-size="17" fill="#607080">Acquisition value</text>
    <text x="1015" y="379" text-anchor="middle" font-size="17" fill="#607080">Transaction value</text>
    <text x="1015" y="406" text-anchor="middle" font-size="17" fill="#607080">Gain or loss</text>
  </g>

  <line x1="240" y1="335" x2="300" y2="335" stroke="#25678f" stroke-width="5" marker-end="url(#arrow)"/>
  <line x1="820" y1="335" x2="880" y2="335" stroke="#25678f" stroke-width="5" marker-end="url(#arrow)"/>

  <g font-family="Arial, sans-serif" filter="url(#shadow)">
    <rect x="170" y="590" width="370" height="100" rx="18" fill="#edf4ed" stroke="#447c55" stroke-width="3"/>
    <text x="355" y="628" text-anchor="middle" font-size="22" font-weight="700" fill="#183047">May support a goal</text>
    <text x="355" y="658" text-anchor="middle" font-size="17" fill="#607080">protects a goal • reduces temptation</text>

    <rect x="660" y="590" width="370" height="100" rx="18" fill="#fff0e9" stroke="#b95f2d" stroke-width="3"/>
    <text x="845" y="628" text-anchor="middle" font-size="22" font-weight="700" fill="#183047">May distort substitution</text>
    <text x="845" y="658" text-anchor="middle" font-size="17" fill="#607080">hides substitutes • keeps sunk costs salient</text>
  </g>

  <path d="M970 425 C920 500 690 520 520 590" fill="none" stroke="#447c55" stroke-width="4" marker-end="url(#greenArrow)"/>
  <path d="M1060 425 C1080 500 1000 540 925 590" fill="none" stroke="#b95f2d" stroke-width="4" marker-end="url(#orangeArrow)"/>

</svg>

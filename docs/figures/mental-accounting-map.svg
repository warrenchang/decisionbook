<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">How mental accounts turn outcomes into choices</title>
  <desc id="desc">Economic outcomes move through an accounting layer that opens an account, posts an entry, chooses a bracket, and closes the account. A valuation layer compares the coded outcome with a reference point. The result may support self-control or distort trade-offs. A final audit asks whether the boundary still serves the person's goal.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0 L12 6 L0 12 Z" fill="#25678f"/></marker>
    <marker id="greenArrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0 L12 6 L0 12 Z" fill="#447c55"/></marker>
    <marker id="orangeArrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0 L12 6 L0 12 Z" fill="#b95f2d"/></marker>
    <filter id="shadow"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#183047" flood-opacity="0.13"/></filter>
  </defs>
  <rect width="1200" height="760" fill="#ffffff"/>
  <text x="600" y="52" text-anchor="middle" font-family="Georgia, serif" font-size="34" font-weight="700" fill="#183047">How mental accounts turn outcomes into choices</text>
  <text x="600" y="84" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#607080">Money is fungible; its cognitive labels, boundaries, and closing rules are not.</text>

  <g filter="url(#shadow)" font-family="Arial, sans-serif">
    <rect x="50" y="275" width="190" height="120" rx="18" fill="#eaf3f8" stroke="#25678f" stroke-width="3"/>
    <text x="145" y="320" text-anchor="middle" font-size="23" font-weight="700" fill="#183047">Outcome</text>
    <text x="145" y="352" text-anchor="middle" font-size="16" fill="#607080">payment • gain • loss</text>
    <text x="145" y="377" text-anchor="middle" font-size="16" fill="#607080">purchase • investment</text>

    <rect x="300" y="130" width="520" height="410" rx="24" fill="#f7f9fc" stroke="#9eb9ca" stroke-width="3"/>
    <text x="560" y="172" text-anchor="middle" font-size="24" font-weight="700" fill="#183047">ACCOUNTING LAYER</text>
    <text x="560" y="199" text-anchor="middle" font-size="16" fill="#607080">How is the outcome represented?</text>

    <rect x="340" y="235" width="200" height="95" rx="15" fill="#eaf3f8" stroke="#25678f" stroke-width="2.5"/>
    <text x="440" y="273" text-anchor="middle" font-size="20" font-weight="700" fill="#183047">1 · Open</text>
    <text x="440" y="301" text-anchor="middle" font-size="16" fill="#607080">Which account?</text>
    <rect x="580" y="235" width="200" height="95" rx="15" fill="#edf4ed" stroke="#447c55" stroke-width="2.5"/>
    <text x="680" y="273" text-anchor="middle" font-size="20" font-weight="700" fill="#183047">2 · Post</text>
    <text x="680" y="301" text-anchor="middle" font-size="16" fill="#607080">Gain, loss, fee, saving?</text>
    <rect x="340" y="375" width="200" height="95" rx="15" fill="#f7f1e8" stroke="#b95f2d" stroke-width="2.5"/>
    <text x="440" y="413" text-anchor="middle" font-size="20" font-weight="700" fill="#183047">3 · Bracket</text>
    <text x="440" y="441" text-anchor="middle" font-size="16" fill="#607080">Separate or combine?</text>
    <rect x="580" y="375" width="200" height="95" rx="15" fill="#f5ebf5" stroke="#795a8a" stroke-width="2.5"/>
    <text x="680" y="413" text-anchor="middle" font-size="20" font-weight="700" fill="#183047">4 · Close</text>
    <text x="680" y="441" text-anchor="middle" font-size="16" fill="#607080">When is it realized?</text>

    <rect x="880" y="245" width="270" height="180" rx="20" fill="#fff4e8" stroke="#b95f2d" stroke-width="3"/>
    <text x="1015" y="286" text-anchor="middle" font-size="23" font-weight="700" fill="#183047">VALUATION LAYER</text>
    <text x="1015" y="322" text-anchor="middle" font-size="17" fill="#607080">Compare with a reference</text>
    <text x="1015" y="352" text-anchor="middle" font-size="17" fill="#607080">Acquisition value</text>
    <text x="1015" y="379" text-anchor="middle" font-size="17" fill="#607080">Transaction value</text>
    <text x="1015" y="406" text-anchor="middle" font-size="17" fill="#607080">Gain or loss</text>
  </g>

  <line x1="240" y1="335" x2="297" y2="335" stroke="#25678f" stroke-width="5" marker-end="url(#arrow)"/>
  <line x1="820" y1="335" x2="877" y2="335" stroke="#25678f" stroke-width="5" marker-end="url(#arrow)"/>

  <g font-family="Arial, sans-serif" filter="url(#shadow)">
    <rect x="170" y="590" width="370" height="100" rx="18" fill="#edf4ed" stroke="#447c55" stroke-width="3"/>
    <text x="355" y="628" text-anchor="middle" font-size="22" font-weight="700" fill="#183047">Useful boundary</text>
    <text x="355" y="658" text-anchor="middle" font-size="17" fill="#607080">protects a goal • reduces temptation</text>

    <rect x="660" y="590" width="370" height="100" rx="18" fill="#fff0e9" stroke="#b95f2d" stroke-width="3"/>
    <text x="845" y="628" text-anchor="middle" font-size="22" font-weight="700" fill="#183047">Distorting boundary</text>
    <text x="845" y="658" text-anchor="middle" font-size="17" fill="#607080">hides substitutes • preserves sunk cost</text>
  </g>

  <path d="M970 425 C920 500 690 520 520 590" fill="none" stroke="#447c55" stroke-width="4" marker-end="url(#greenArrow)"/>
  <path d="M1060 425 C1080 500 1000 540 925 590" fill="none" stroke="#b95f2d" stroke-width="4" marker-end="url(#orangeArrow)"/>

  <rect x="310" y="706" width="580" height="38" rx="19" fill="#183047"/>
  <text x="600" y="732" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#ffffff">AUDIT: Does this boundary still serve the person's considered goal?</text>
</svg>

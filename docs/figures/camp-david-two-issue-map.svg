<svg xmlns="http://www.w3.org/2000/svg" width="720" height="692" viewBox="0 91 720 692" role="img" aria-labelledby="title desc">
  <title id="title">A two-issue map of sovereignty and security</title>
  <desc id="desc">A positional frame treats territorial control as a single conflict. A second panel separates territorial sovereignty from security arrangements. A package combines withdrawal and restored sovereignty with limits, monitoring, timing, and implementation assurances.</desc>
  <style>
    .title{font:700 31px Arial,sans-serif;fill:#17324d}
    .subtitle{font:22px Arial,sans-serif;fill:#536879}
    .head{font:700 25px Arial,sans-serif;fill:#17324d}
    .body{font:23px Arial,sans-serif;fill:#314b60}
    .small{font:21px Arial,sans-serif;fill:#536879}
    .accent{font:700 24px Arial,sans-serif;fill:#2f6f9f}
    .boundary{font:700 23px Arial,sans-serif;fill:#7a3d19}
  </style>
  <rect width="720" height="1045" fill="#ffffff" />
  <rect x="30" y="115" width="660" height="200" rx="22" fill="#fff1f1" stroke="#b34949" stroke-width="2.5" />
  <text class="head" x="360" y="158" text-anchor="middle">Single-issue positional frame</text>
  <rect x="65" y="185" width="255" height="105" rx="18" fill="#ffffff" stroke="#b34949" stroke-width="2" />
  <text class="body" x="192" y="226" text-anchor="middle">Israel: retain</text>
  <text class="body" x="192" y="259" text-anchor="middle">territorial control</text>
  <rect x="400" y="185" width="255" height="105" rx="18" fill="#ffffff" stroke="#b34949" stroke-width="2" />
  <text class="body" x="528" y="226" text-anchor="middle">Egypt: recover</text>
  <text class="body" x="528" y="259" text-anchor="middle">territorial control</text>

  <text class="accent" x="360" y="392" text-anchor="middle">↓  Unbundle the problem into distinct issues  ↓</text>

  <rect x="30" y="420" width="660" height="158" rx="22" fill="#eaf3f8" stroke="#2f6f9f" stroke-width="3" />
  <text class="head" x="360" y="463" text-anchor="middle">Issue 1 · Territorial sovereignty</text>
  <text class="body" x="360" y="507" text-anchor="middle">Withdrawal from Sinai and recovery of territory</text>
  <text class="body" x="360" y="541" text-anchor="middle">addressed a central Egyptian concern.</text>
  <rect x="30" y="601" width="660" height="158" rx="22" fill="#eef6ef" stroke="#43825a" stroke-width="3" />
  <text class="head" x="360" y="644.0" text-anchor="middle">Issue 2 · Security arrangements</text>
  <text class="body" x="360" y="688.0" text-anchor="middle">Limits on forces, monitoring, airbases, timing,</text>
  <text class="body" x="360" y="722.0" text-anchor="middle">and assurances addressed Israeli security concerns.</text>
</svg>

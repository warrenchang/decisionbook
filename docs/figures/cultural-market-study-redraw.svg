<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">Social influence increased unpredictability in the Music Lab experiments</title>
  <desc id="desc">An original redraw shows greater unpredictability in social-influence conditions than independent conditions in two experiments, especially when the popularity signal was stronger. A parallel-worlds panel explains that the same songs reached different outcomes.</desc>
  <rect width="1200" height="700" fill="#ffffff"/>
  <text x="600" y="48" text-anchor="middle" font-family="Arial, sans-serif" font-size="33" font-weight="700" fill="#17324d">Popularity can help produce the outcome it appears to report</text>
  <text x="600" y="80" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#66737f">Original redraw of the Music Lab unpredictability result (Salganik, Dodds, &amp; Watts, 2006)</text>

  <rect x="45" y="112" width="660" height="520" rx="18" fill="#f7fafc" stroke="#c8d7e2" stroke-width="2"/>
  <text x="375" y="151" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#17324d">Average cross-world difference in song success</text>
  <line x1="130" y1="520" x2="655" y2="520" stroke="#8fa0ad" stroke-width="2"/>
  <line x1="130" y1="195" x2="130" y2="520" stroke="#8fa0ad" stroke-width="2"/>
  <g font-family="Arial, sans-serif" font-size="14" fill="#66737f">
    <line x1="130" y1="455" x2="655" y2="455" stroke="#dce5ea"/><text x="116" y="460" text-anchor="end">.003</text>
    <line x1="130" y1="390" x2="655" y2="390" stroke="#dce5ea"/><text x="116" y="395" text-anchor="end">.006</text>
    <line x1="130" y1="325" x2="655" y2="325" stroke="#dce5ea"/><text x="116" y="330" text-anchor="end">.009</text>
    <line x1="130" y1="260" x2="655" y2="260" stroke="#dce5ea"/><text x="116" y="265" text-anchor="end">.012</text>
    <line x1="130" y1="195" x2="655" y2="195" stroke="#dce5ea"/><text x="116" y="200" text-anchor="end">.015</text>
    <text x="55" y="357" transform="rotate(-90 55 357)" text-anchor="middle" font-size="16">Unpredictability U</text>
  </g>
  <rect x="200" y="338" width="72" height="182" rx="7" fill="#2f6f9f"/>
  <rect x="282" y="412" width="72" height="108" rx="7" fill="#c7d7e2" stroke="#2f6f9f" stroke-width="2"/>
  <text x="277" y="553" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#17324d">Experiment 1</text>
  <rect x="458" y="243" width="72" height="277" rx="7" fill="#2f6f9f"/>
  <rect x="540" y="438" width="72" height="82" rx="7" fill="#c7d7e2" stroke="#2f6f9f" stroke-width="2"/>
  <text x="535" y="553" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#17324d">Experiment 2</text>
  <rect x="180" y="584" width="22" height="22" rx="4" fill="#2f6f9f"/><text x="211" y="601" font-family="Arial, sans-serif" font-size="16" fill="#17324d">Social influence</text>
  <rect x="390" y="584" width="22" height="22" rx="4" fill="#c7d7e2" stroke="#2f6f9f" stroke-width="2"/><text x="421" y="601" font-family="Arial, sans-serif" font-size="16" fill="#17324d">Independent choice</text>

  <rect x="735" y="112" width="420" height="520" rx="18" fill="#f7f1e8" stroke="#c56a2d" stroke-width="2"/>
  <text x="945" y="151" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#17324d">Eight parallel social worlds</text>
  <text x="945" y="181" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#66737f">Same songs, comparable participants, different histories</text>
  <g stroke="#b8c7d1" stroke-width="2" fill="none">
    <path d="M790 244 C860 225 940 230 1095 214"/><path d="M790 268 C865 276 960 250 1095 286"/>
    <path d="M790 292 C870 330 960 292 1095 348"/><path d="M790 316 C870 294 960 350 1095 405"/>
    <path d="M790 340 C860 390 970 330 1095 465"/><path d="M790 364 C870 430 955 420 1095 520"/>
    <path d="M790 388 C870 360 970 490 1095 550"/><path d="M790 412 C870 480 975 510 1095 585"/>
  </g>
  <g fill="#2f6f9f"><circle cx="790" cy="244" r="7"/><circle cx="790" cy="268" r="7"/><circle cx="790" cy="292" r="7"/><circle cx="790" cy="316" r="7"/><circle cx="790" cy="340" r="7"/><circle cx="790" cy="364" r="7"/><circle cx="790" cy="388" r="7"/><circle cx="790" cy="412" r="7"/></g>
  <g fill="#c56a2d"><circle cx="1095" cy="214" r="8"/><circle cx="1095" cy="286" r="8"/><circle cx="1095" cy="348" r="8"/><circle cx="1095" cy="405" r="8"/><circle cx="1095" cy="465" r="8"/><circle cx="1095" cy="520" r="8"/><circle cx="1095" cy="550" r="8"/><circle cx="1095" cy="585" r="8"/></g>
  <text x="790" y="450" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#17324d">initial quality</text>
  <text x="1095" y="615" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#17324d">realized success</text>
  <rect x="805" y="470" width="255" height="62" rx="12" fill="#edf4ed" stroke="#447c55" stroke-width="2"/>
  <text x="932.5" y="496" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#17324d">Quality still mattered.</text>
  <text x="932.5" y="519" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#66737f">Early social signals also changed success.</text>
  <text x="600" y="676" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#66737f">Bar heights are redrawn from the published figure; the parallel-worlds explanation is an original schematic.</text>
</svg>

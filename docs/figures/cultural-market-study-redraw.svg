<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Social influence increased unpredictability in the Music Lab experiments</title>
  <desc id="desc">A qualitative grouped-bar redraw shows the published direction: social-influence conditions had greater cross-world unpredictability than independent-choice benchmarks in both experiments. Bar heights are schematic, not digitized point estimates. The panel also reports the study's comparison procedure and participant counts.</desc>
  <rect width="1200" height="760" fill="#ffffff"/>
  <text x="600" y="48" text-anchor="middle" font-family="Arial, sans-serif" font-size="33" font-weight="700" fill="#17324d">Popularity can help produce the outcome it appears to report</text>
  <text x="600" y="80" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#66737f">Qualitative redraw of the published pattern in Salganik, Dodds, &amp; Watts (2006), Figure 2</text>

  <rect x="45" y="112" width="660" height="570" rx="18" fill="#f7fafc" stroke="#c8d7e2" stroke-width="2"/>
  <text x="375" y="151" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#17324d">Published direction of cross-world unpredictability</text>
  <text x="375" y="176" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#66737f">Schematic heights: compare direction only, not magnitude.</text>
  <line x1="130" y1="525" x2="655" y2="525" stroke="#8fa0ad" stroke-width="2"/>
  <line x1="130" y1="205" x2="130" y2="525" stroke="#8fa0ad" stroke-width="2"/>
  <g font-family="Arial, sans-serif" font-size="16" fill="#66737f">
    <text x="116" y="530" text-anchor="end">lower</text>
    <line x1="130" y1="461" x2="655" y2="461" stroke="#dce5ea"/>
    <line x1="130" y1="397" x2="655" y2="397" stroke="#dce5ea"/>
    <line x1="130" y1="333" x2="655" y2="333" stroke="#dce5ea"/>
    <line x1="130" y1="269" x2="655" y2="269" stroke="#dce5ea"/>
    <line x1="130" y1="205" x2="655" y2="205" stroke="#dce5ea"/><text x="116" y="210" text-anchor="end">higher</text>
    <text x="55" y="365" transform="rotate(-90 55 365)" text-anchor="middle" font-size="16">Cross-world unpredictability</text>
  </g>

  <rect x="200" y="346" width="72" height="179" rx="7" fill="#2f6f9f"/>
  <rect x="282" y="418" width="72" height="107" rx="7" fill="#c7d7e2" stroke="#2f6f9f" stroke-width="2"/>
  <text x="277" y="558" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#17324d">Experiment 1</text>
  <text x="277" y="581" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#66737f">N = 7,149</text>

  <rect x="458" y="252" width="72" height="273" rx="7" fill="#2f6f9f"/>
  <rect x="540" y="444" width="72" height="81" rx="7" fill="#c7d7e2" stroke="#2f6f9f" stroke-width="2"/>
  <text x="535" y="558" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#17324d">Experiment 2</text>
  <text x="535" y="581" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#66737f">N = 7,192</text>

  <rect x="170" y="620" width="22" height="22" rx="4" fill="#2f6f9f"/><text x="201" y="637" font-family="Arial, sans-serif" font-size="16" fill="#17324d">Social influence</text>
  <rect x="380" y="620" width="22" height="22" rx="4" fill="#c7d7e2" stroke="#2f6f9f" stroke-width="2"/><text x="411" y="637" font-family="Arial, sans-serif" font-size="16" fill="#17324d">Independent choice</text>

  <rect x="735" y="112" width="420" height="570" rx="18" fill="#f7f1e8" stroke="#c56a2d" stroke-width="2"/>
  <text x="945" y="151" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#17324d">How to read the comparison</text>

  <rect x="775" y="180" width="340" height="110" rx="14" fill="#ffffff" stroke="#2f6f9f" stroke-width="2"/>
  <text x="800" y="211" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#2f6f9f">1  Social worlds</text>
  <text x="800" y="239" font-family="Arial, sans-serif" font-size="16" fill="#17324d">8 worlds → 28 world-pair comparisons,</text>
  <text x="800" y="263" font-family="Arial, sans-serif" font-size="16" fill="#17324d">averaged across the same 48 songs.</text>

  <rect x="775" y="310" width="340" height="110" rx="14" fill="#ffffff" stroke="#447c55" stroke-width="2"/>
  <text x="800" y="341" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#447c55">2  Independent benchmark</text>
  <text x="800" y="369" font-family="Arial, sans-serif" font-size="16" fill="#17324d">Unpredictability was estimated from</text>
  <text x="800" y="393" font-family="Arial, sans-serif" font-size="16" fill="#17324d">1,000 random splits of independent choices.</text>

  <rect x="775" y="440" width="340" height="158" rx="14" fill="#ffffff" stroke="#c56a2d" stroke-width="2"/>
  <text x="800" y="471" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#c56a2d">3  Participant denominators</text>
  <text x="800" y="502" font-family="Arial, sans-serif" font-size="16" fill="#17324d">Experiment 1: 5,708 social +</text>
  <text x="800" y="526" font-family="Arial, sans-serif" font-size="16" fill="#17324d">1,441 independent = 7,149 total</text>
  <text x="800" y="558" font-family="Arial, sans-serif" font-size="16" fill="#17324d">Experiment 2: 5,746 social +</text>
  <text x="800" y="582" font-family="Arial, sans-serif" font-size="16" fill="#17324d">1,446 independent = 7,192 total</text>

  <rect x="780" y="620" width="330" height="42" rx="12" fill="#edf4ed" stroke="#447c55" stroke-width="2"/>
  <text x="945" y="647" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#17324d">Same songs, more path dependence</text>

  <text x="600" y="721" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#66737f">Source: Salganik et al. (2006), Figure 2 and methods. Bar heights are schematic, not recovered numerical estimates.</text>
  <text x="600" y="743" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#66737f">Graphic design and annotations are original to this book.</text>
</svg>

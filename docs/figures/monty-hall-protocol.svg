<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">The standard Monty Hall information protocol</title>
  <desc id="desc">A three-stage diagram shows an initial door choice with one-third probability, the other two doors carrying two-thirds probability together, a knowledgeable host who must reveal a goat behind an unchosen door and always offer a switch, and the remaining unchosen door retaining the two-thirds branch. When both unchosen doors hide goats, the host chooses between them uniformly at random.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 8" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0.5,0.8 L9,4 L0.5,7.2 z" fill="#587189"/></marker>
  </defs>
  <style>
    .title{font:700 34px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#183047}
    .sub{font:500 18px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#52677a}
    .step{font:700 22px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#183047}
    .door{font:700 19px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#183047}
    .prob{font:750 22px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#c44e52}
    .small{font:500 18px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#52677a}
    .note{font:600 18px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#314b61}
  </style>
  <rect x="18" y="18" width="1164" height="664" rx="28" fill="#f7f9fc" stroke="#9fb2c3" stroke-width="2"/>
  <text x="600" y="66" class="title" text-anchor="middle">MONTY HALL: THE ANSWER DEPENDS ON THE HOST’S PROTOCOL</text>
  <text x="600" y="99" class="sub" text-anchor="middle">One car is placed randomly; the knowledgeable host must reveal a goat and always offer a switch.</text>

  <rect x="46" y="132" width="342" height="452" rx="22" fill="#ffffff" stroke="#bfd0dd" stroke-width="2"/>
  <text x="217" y="171" class="step" text-anchor="middle">1  CHOOSE ONE DOOR</text>
  <g transform="translate(73 226)">
    <rect width="78" height="150" rx="8" fill="#dceef5" stroke="#236b8e" stroke-width="4"/><circle cx="62" cy="79" r="5" fill="#236b8e"/>
    <text x="39" y="179" class="door" text-anchor="middle">1</text>
  </g>
  <g transform="translate(178 226)">
    <rect width="78" height="150" rx="8" fill="#eef2f5" stroke="#8ea5b7" stroke-width="2"/><circle cx="62" cy="79" r="5" fill="#70869a"/>
    <text x="39" y="179" class="door" text-anchor="middle">2</text>
  </g>
  <g transform="translate(283 226)">
    <rect width="78" height="150" rx="8" fill="#eef2f5" stroke="#8ea5b7" stroke-width="2"/><circle cx="62" cy="79" r="5" fill="#70869a"/>
    <text x="39" y="179" class="door" text-anchor="middle">3</text>
  </g>
  <text x="112" y="447" class="prob" text-anchor="middle">1/3</text>
  <path d="M182 425 H361" stroke="#c44e52" stroke-width="3" stroke-linecap="round"/>
  <text x="270" y="458" class="prob" text-anchor="middle">2/3 together</text>
  <text x="217" y="518" class="small" text-anchor="middle">The initial choice gets one branch;</text>
  <text x="217" y="542" class="small" text-anchor="middle">the unchosen pair gets two.</text>

  <path d="M388 358 H432" stroke="#587189" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/>

  <rect x="432" y="132" width="336" height="452" rx="22" fill="#ffffff" stroke="#bfd0dd" stroke-width="2"/>
  <text x="600" y="171" class="step" text-anchor="middle">2  HOST REVEALS A GOAT</text>
  <g transform="translate(458 226)">
    <rect width="78" height="150" rx="8" fill="#dceef5" stroke="#236b8e" stroke-width="4"/><circle cx="62" cy="79" r="5" fill="#236b8e"/><text x="39" y="179" class="door" text-anchor="middle">1</text>
  </g>
  <g transform="translate(552 226)">
    <rect width="78" height="150" rx="8" fill="#eef2f5" stroke="#8ea5b7" stroke-width="2"/><circle cx="62" cy="79" r="5" fill="#70869a"/><text x="39" y="179" class="door" text-anchor="middle">2</text>
  </g>
  <g transform="translate(646 226)">
    <rect width="78" height="150" rx="8" fill="#fff5ee" stroke="#c44e52" stroke-width="3"/>
    <text x="39" y="70" class="door" text-anchor="middle">GOAT</text><path d="M19 91 Q39 111 59 91" fill="none" stroke="#c44e52" stroke-width="3"/>
    <text x="39" y="179" class="door" text-anchor="middle">3 open</text>
  </g>
  <text x="600" y="446" class="note" text-anchor="middle">The reveal is constrained—not a random hint.</text>
  <text x="600" y="487" class="small" text-anchor="middle">The reveal does not divide the original</text>
  <text x="600" y="511" class="small" text-anchor="middle">two-door branch equally.</text>

  <path d="M768 358 H812" stroke="#587189" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/>

  <rect x="812" y="132" width="342" height="452" rx="22" fill="#ffffff" stroke="#bfd0dd" stroke-width="2"/>
  <text x="983" y="171" class="step" text-anchor="middle">3  KEEP OR SWITCH</text>
  <g transform="translate(858 226)">
    <rect width="104" height="150" rx="8" fill="#eef2f5" stroke="#8ea5b7" stroke-width="2"/><circle cx="85" cy="79" r="5" fill="#70869a"/>
    <text x="52" y="179" class="door" text-anchor="middle">KEEP 1</text>
  </g>
  <g transform="translate(1004 226)">
    <rect width="104" height="150" rx="8" fill="#f8e4dc" stroke="#c44e52" stroke-width="4"/><circle cx="85" cy="79" r="5" fill="#c44e52"/>
    <text x="52" y="179" class="door" text-anchor="middle">SWITCH 2</text>
  </g>
  <text x="910" y="449" class="prob" text-anchor="middle">1/3</text>
  <text x="1056" y="449" class="prob" text-anchor="middle">2/3</text>
  <text x="983" y="499" class="small" text-anchor="middle">Switching inherits the probability</text>
  <text x="983" y="523" class="small" text-anchor="middle">of the original two-door branch.</text>

  <rect x="101" y="615" width="998" height="43" rx="21" fill="#e9f2f7" stroke="#9fbfd0"/>
  <text x="600" y="642" class="note" text-anchor="middle">If either goat door could be opened, assume a random tie-break; a different host rule changes the inference.</text>
</svg>

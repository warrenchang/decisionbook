<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">From a research question to a warranted claim</title>
  <desc id="desc">A five-stage evidence pipeline moves from question and hypothesis, to construct and measure, assignment and comparison, estimand and analysis, and finally claim. Below each stage is a threat: a vague target, invalid measurement, confounding or interference, low power or multiplicity, and overclaiming. A lower feedback path labeled reproduce, replicate, and revise returns from the claim to the question.</desc>
  <defs>
    <marker id="blue-arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0 0 L12 6 L0 12 Z" fill="#25678f"/>
    </marker>
    <marker id="orange-arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 L12 6 L0 12 Z" fill="#b95f2d"/>
    </marker>
    <filter id="shadow">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#183047" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect width="1200" height="760" fill="#ffffff"/>
  <text x="600" y="52" text-anchor="middle" font-family="Georgia, serif" font-size="34" font-weight="700" fill="#183047">From a research question to a warranted claim</text>
  <text x="600" y="84" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#607080">Every arrow carries assumptions. A result is only as strong as the weakest link.</text>

  <g font-family="Arial, sans-serif" filter="url(#shadow)">
    <rect x="35" y="190" width="195" height="155" rx="19" fill="#eaf3f8" stroke="#25678f" stroke-width="3"/>
    <text x="132.5" y="230" text-anchor="middle" font-size="20" font-weight="700" fill="#183047">1 · QUESTION</text>
    <text x="132.5" y="264" text-anchor="middle" font-size="16" fill="#607080">Population • contrast</text>
    <text x="132.5" y="291" text-anchor="middle" font-size="16" fill="#607080">outcome • horizon</text>
    <text x="132.5" y="320" text-anchor="middle" font-size="14" font-weight="700" fill="#25678f">What would answer it?</text>

    <rect x="270" y="190" width="195" height="155" rx="19" fill="#edf4ed" stroke="#447c55" stroke-width="3"/>
    <text x="367.5" y="230" text-anchor="middle" font-size="20" font-weight="700" fill="#183047">2 · MEASURE</text>
    <text x="367.5" y="264" text-anchor="middle" font-size="16" fill="#607080">Construct • operation</text>
    <text x="367.5" y="291" text-anchor="middle" font-size="16" fill="#607080">reliability • validity</text>
    <text x="367.5" y="320" text-anchor="middle" font-size="14" font-weight="700" fill="#447c55">Does it capture the target?</text>

    <rect x="505" y="190" width="195" height="155" rx="19" fill="#f7f1e8" stroke="#b98a2d" stroke-width="3"/>
    <text x="602.5" y="230" text-anchor="middle" font-size="20" font-weight="700" fill="#183047">3 · COMPARE</text>
    <text x="602.5" y="264" text-anchor="middle" font-size="16" fill="#607080">Assignment • control</text>
    <text x="602.5" y="291" text-anchor="middle" font-size="16" fill="#607080">timing • interference</text>
    <text x="602.5" y="320" text-anchor="middle" font-size="14" font-weight="700" fill="#8b641e">What is the counterfactual?</text>

    <rect x="740" y="190" width="195" height="155" rx="19" fill="#f5ebf5" stroke="#795a8a" stroke-width="3"/>
    <text x="837.5" y="230" text-anchor="middle" font-size="20" font-weight="700" fill="#183047">4 · ESTIMATE</text>
    <text x="837.5" y="264" text-anchor="middle" font-size="16" fill="#607080">Estimand • model</text>
    <text x="837.5" y="291" text-anchor="middle" font-size="16" fill="#607080">uncertainty • multiplicity</text>
    <text x="837.5" y="320" text-anchor="middle" font-size="14" font-weight="700" fill="#795a8a">What quantity was learned?</text>

    <rect x="975" y="190" width="195" height="155" rx="19" fill="#fff0e9" stroke="#b95f2d" stroke-width="3"/>
    <text x="1072.5" y="230" text-anchor="middle" font-size="20" font-weight="700" fill="#183047">5 · CLAIM</text>
    <text x="1072.5" y="264" text-anchor="middle" font-size="16" fill="#607080">Description • prediction</text>
    <text x="1072.5" y="291" text-anchor="middle" font-size="16" fill="#607080">causation • mechanism</text>
    <text x="1072.5" y="320" text-anchor="middle" font-size="14" font-weight="700" fill="#b95f2d">No stronger than the design</text>
  </g>

  <g stroke="#25678f" stroke-width="4">
    <line x1="230" y1="267.5" x2="267" y2="267.5" marker-end="url(#blue-arrow)"/>
    <line x1="465" y1="267.5" x2="502" y2="267.5" marker-end="url(#blue-arrow)"/>
    <line x1="700" y1="267.5" x2="737" y2="267.5" marker-end="url(#blue-arrow)"/>
    <line x1="935" y1="267.5" x2="972" y2="267.5" marker-end="url(#blue-arrow)"/>
  </g>

  <g font-family="Arial, sans-serif">
    <text x="600" y="415" text-anchor="middle" font-size="17" font-weight="700" letter-spacing="2" fill="#607080">COMMON BREAKS IN THE CHAIN</text>

    <rect x="47" y="445" width="171" height="75" rx="15" fill="#fff4e8" stroke="#b95f2d" stroke-width="2"/>
    <text x="132.5" y="477" text-anchor="middle" font-size="16" font-weight="700" fill="#183047">Vague target</text>
    <text x="132.5" y="502" text-anchor="middle" font-size="14" fill="#607080">moving hypothesis</text>

    <rect x="282" y="445" width="171" height="75" rx="15" fill="#fff4e8" stroke="#b95f2d" stroke-width="2"/>
    <text x="367.5" y="477" text-anchor="middle" font-size="16" font-weight="700" fill="#183047">Invalid measure</text>
    <text x="367.5" y="502" text-anchor="middle" font-size="14" fill="#607080">noise or proxy failure</text>

    <rect x="517" y="445" width="171" height="75" rx="15" fill="#fff4e8" stroke="#b95f2d" stroke-width="2"/>
    <text x="602.5" y="477" text-anchor="middle" font-size="16" font-weight="700" fill="#183047">Confounding</text>
    <text x="602.5" y="502" text-anchor="middle" font-size="14" fill="#607080">selection or spillover</text>

    <rect x="752" y="445" width="171" height="75" rx="15" fill="#fff4e8" stroke="#b95f2d" stroke-width="2"/>
    <text x="837.5" y="477" text-anchor="middle" font-size="16" font-weight="700" fill="#183047">Fragile estimate</text>
    <text x="837.5" y="502" text-anchor="middle" font-size="14" fill="#607080">low power • many tests</text>

    <rect x="987" y="445" width="171" height="75" rx="15" fill="#fff4e8" stroke="#b95f2d" stroke-width="2"/>
    <text x="1072.5" y="477" text-anchor="middle" font-size="16" font-weight="700" fill="#183047">Overclaiming</text>
    <text x="1072.5" y="502" text-anchor="middle" font-size="14" fill="#607080">scope or causal leap</text>
  </g>

  <path d="M1072 548 C1072 640 850 680 600 680 C350 680 15 640 15 548 L15 267 L35 267" fill="none" stroke="#b95f2d" stroke-width="4" marker-end="url(#orange-arrow)"/>
  <rect x="405" y="606" width="390" height="48" rx="24" fill="#183047"/>
  <text x="600" y="637" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#ffffff">REPRODUCE • REPLICATE • REVISE</text>
  <text x="600" y="708" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="#607080">A transparent failure can improve the next design. An opaque success cannot.</text>
</svg>

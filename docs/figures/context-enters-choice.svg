<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1580" viewBox="0 0 900 1580" role="img" aria-labelledby="title desc">
  <title id="title">Seven ways context enters choice</title>
  <desc id="desc">Seven examples are grouped into three mechanism bands. Treatment framing and a subscription decoy change representation or comparison. An organ-donation default and an advertising redesign change the path from an available option to action. Watched eyes, publicity around a product, and a museum message change perceived observability, accessibility, or the active motive. Each example includes an evidence boundary.</desc>
  <defs>
    <style>
      .figure-title{font:700 39px Arial,Helvetica,sans-serif;fill:#17324d}
      .figure-subtitle{font:24px Arial,Helvetica,sans-serif;fill:#536779}
      .band-number{font:700 24px Arial,Helvetica,sans-serif;fill:#ffffff}
      .band-title{font:700 27px Arial,Helvetica,sans-serif;letter-spacing:.3px;fill:#17324d}
      .band-desc{font:23px Arial,Helvetica,sans-serif;fill:#536779}
      .case-title{font:700 27px Arial,Helvetica,sans-serif;fill:#17324d}
      .case-line{font:24px Arial,Helvetica,sans-serif;fill:#334e68}
      .case-key{font-weight:700;fill:#17324d}
      .evidence{font:22px Arial,Helvetica,sans-serif;fill:#536779}
      .footer-strong{font:700 23px Arial,Helvetica,sans-serif;fill:#17324d}
      .footer{font:21px Arial,Helvetica,sans-serif;fill:#536779}
      .icon-stroke{fill:none;stroke:#2f6f9f;stroke-width:3.2;stroke-linecap:round;stroke-linejoin:round}
      .icon-fill{fill:#e8f2f8;stroke:#2f6f9f;stroke-width:2.6}
    </style>
  </defs>

  <rect width="900" height="1580" fill="#ffffff"/>
  <text class="figure-title" x="450" y="54" text-anchor="middle">Seven ways context enters choice</text>
  <text class="figure-subtitle" x="450" y="94" text-anchor="middle">One feature can stay fixed while context changes the route from situation to action.</text>
  <line x1="95" y1="119" x2="805" y2="119" stroke="#d2dee7" stroke-width="2"/>

  <!-- Band 1: representation and comparison -->
  <rect x="28" y="145" width="844" height="370" rx="26" fill="#f4f8fb" stroke="#9fb8ca" stroke-width="2.5"/>
  <circle cx="66" cy="184" r="23" fill="#2f6f9f"/>
  <text class="band-number" x="66" y="192" text-anchor="middle">1</text>
  <text class="band-title" x="103" y="184">REPRESENTATION AND COMPARISON</text>
  <text class="band-desc" x="103" y="217">Context changes how an outcome or option is encoded against alternatives.</text>

  <rect x="50" y="240" width="800" height="125" rx="20" fill="#ffffff" stroke="#c9d7e1" stroke-width="2"/>
  <circle class="icon-fill" cx="96" cy="302" r="32"/>
  <path class="icon-stroke" d="M96 284v36M78 302h36"/>
  <text class="case-title" x="148" y="271">Lung-cancer treatment framing</text>
  <text class="case-line" x="148" y="303"><tspan class="case-key">Held fixed — </tspan><tspan>Outcome probabilities.</tspan></text>
  <text class="case-line" x="148" y="332"><tspan class="case-key">Context — </tspan><tspan>Representation and attention change.</tspan></text>
  <text class="evidence" x="148" y="356">Evidence · Controlled benchmark challenge</text>

  <rect x="50" y="380" width="800" height="125" rx="20" fill="#ffffff" stroke="#c9d7e1" stroke-width="2"/>
  <circle class="icon-fill" cx="96" cy="442" r="32"/>
  <rect x="77" y="426" width="36" height="24" rx="4" fill="none" stroke="#2f6f9f" stroke-width="3"/>
  <rect x="82" y="421" width="36" height="24" rx="4" fill="#ffffff" stroke="#2f6f9f" stroke-width="3"/>
  <line class="icon-stroke" x1="89" y1="430" x2="111" y2="430"/>
  <line class="icon-stroke" x1="89" y1="437" x2="104" y2="437"/>
  <text class="case-title" x="148" y="411">Subscription decoy</text>
  <text class="case-line" x="148" y="443"><tspan class="case-key">Held fixed — </tspan><tspan>Target subscription options.</tspan></text>
  <text class="case-line" x="148" y="472"><tspan class="case-key">Context — </tspan><tspan>The comparison set changes.</tspan></text>
  <text class="evidence" x="148" y="496">Evidence · Controlled benchmark challenge</text>

  <!-- Band 2: path to action -->
  <rect x="28" y="535" width="844" height="370" rx="26" fill="#f3f8f4" stroke="#9fc2aa" stroke-width="2.5"/>
  <circle cx="66" cy="574" r="23" fill="#3f8457"/>
  <text class="band-number" x="66" y="582" text-anchor="middle">2</text>
  <text class="band-title" x="103" y="574">PATH FROM AN AVAILABLE OPTION TO ACTION</text>
  <text class="band-desc" x="103" y="607">Defaults and interface cues change what happens before action is taken.</text>

  <rect x="50" y="630" width="800" height="125" rx="20" fill="#ffffff" stroke="#cadccf" stroke-width="2"/>
  <circle cx="96" cy="692" r="32" fill="#eaf4ed" stroke="#3f8457" stroke-width="2.6"/>
  <rect x="75" y="681" width="42" height="22" rx="11" fill="none" stroke="#3f8457" stroke-width="3"/>
  <circle cx="106" cy="692" r="8" fill="#3f8457"/>
  <text class="case-title" x="148" y="661">Organ-donation default</text>
  <text class="case-line" x="148" y="693"><tspan class="case-key">Held fixed — </tspan><tspan>Formal ability to choose either option.</tspan></text>
  <text class="case-line" x="148" y="722"><tspan class="case-key">Context — </tspan><tspan>Inaction, effort, and implied recommendation.</tspan></text>
  <text class="evidence" x="148" y="746">Evidence · Context-sensitive experiment and policy evidence</text>

  <rect x="50" y="770" width="800" height="125" rx="20" fill="#ffffff" stroke="#cadccf" stroke-width="2"/>
  <circle cx="96" cy="832" r="32" fill="#eaf4ed" stroke="#3f8457" stroke-width="2.6"/>
  <rect x="75" y="815" width="42" height="31" rx="4" fill="none" stroke="#3f8457" stroke-width="3"/>
  <line x1="84" y1="832" x2="107" y2="832" stroke="#3f8457" stroke-width="3.2" stroke-linecap="round"/>
  <path d="M101 825l8 7-8 7" fill="none" stroke="#3f8457" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>
  <text class="case-title" x="148" y="801">Advertising redesign</text>
  <text class="case-line" x="148" y="833"><tspan class="case-key">Held fixed — </tspan><tspan>The underlying offer.</tspan></text>
  <text class="case-line" x="148" y="862"><tspan class="case-key">Context — </tspan><tspan>Salience and action affordance change.</tspan></text>
  <text class="evidence" x="148" y="886">Evidence · Bundled corporate report; the arrow was not isolated</text>

  <!-- Band 3: meaning, accessibility, motive -->
  <rect x="28" y="925" width="844" height="510" rx="26" fill="#fff8f0" stroke="#d7b58f" stroke-width="2.5"/>
  <circle cx="66" cy="964" r="23" fill="#b96a2f"/>
  <text class="band-number" x="66" y="972" text-anchor="middle">3</text>
  <text class="band-title" x="103" y="964">SOCIAL MEANING, ACCESSIBILITY, AND ACTIVE MOTIVE</text>
  <text class="band-desc" x="103" y="997">Context changes what feels observed, comes to mind, or fits the current goal.</text>

  <rect x="50" y="1020" width="800" height="125" rx="20" fill="#ffffff" stroke="#e1cfbb" stroke-width="2"/>
  <circle cx="96" cy="1082" r="32" fill="#fff1e3" stroke="#b96a2f" stroke-width="2.6"/>
  <path d="M73 1082c8-12 16-17 23-17s15 5 23 17c-8 12-16 17-23 17s-15-5-23-17z" fill="none" stroke="#b96a2f" stroke-width="3" stroke-linejoin="round"/>
  <circle cx="96" cy="1082" r="7" fill="#b96a2f"/>
  <text class="case-title" x="148" y="1051">Watched eyes above an honesty box</text>
  <text class="case-line" x="148" y="1083"><tspan class="case-key">Held fixed — </tspan><tspan>Prices and honesty-box rules.</tspan></text>
  <text class="case-line" x="148" y="1112"><tspan class="case-key">Context — </tspan><tspan>Perceived observability may change.</tspan></text>
  <text class="evidence" x="148" y="1136">Evidence · Field study; later meta-analyses: null overall</text>

  <rect x="50" y="1160" width="800" height="125" rx="20" fill="#ffffff" stroke="#e1cfbb" stroke-width="2"/>
  <circle cx="96" cy="1222" r="32" fill="#fff1e3" stroke="#b96a2f" stroke-width="2.6"/>
  <path d="M77 1215l24-10v34l-24-10z" fill="none" stroke="#b96a2f" stroke-width="3" stroke-linejoin="round"/>
  <line x1="105" y1="1213" x2="115" y2="1207" stroke="#b96a2f" stroke-width="3" stroke-linecap="round"/>
  <line x1="105" y1="1222" x2="118" y2="1222" stroke="#b96a2f" stroke-width="3" stroke-linecap="round"/>
  <line x1="105" y1="1231" x2="115" y2="1237" stroke="#b96a2f" stroke-width="3" stroke-linecap="round"/>
  <text class="case-title" x="148" y="1191">Mars publicity and a confectionery product</text>
  <text class="case-line" x="148" y="1223"><tspan class="case-key">Held fixed — </tspan><tspan>The product.</tspan></text>
  <text class="case-line" x="148" y="1252"><tspan class="case-key">Context — </tspan><tspan>Associative accessibility may change.</tspan></text>
  <text class="evidence" x="148" y="1276">Evidence · Anecdote; causal alternatives remain</text>

  <rect x="50" y="1300" width="800" height="125" rx="20" fill="#ffffff" stroke="#e1cfbb" stroke-width="2"/>
  <circle cx="96" cy="1362" r="32" fill="#fff1e3" stroke="#b96a2f" stroke-width="2.6"/>
  <path d="M76 1375h40M80 1358h32M84 1358v17M94 1358v17M104 1358v17M114 1358v17M78 1354l18-12 18 12z" fill="none" stroke="#b96a2f" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <text class="case-title" x="148" y="1331">Museum message</text>
  <text class="case-line" x="148" y="1363"><tspan class="case-key">Held fixed — </tspan><tspan>The venue.</tspan></text>
  <text class="case-line" x="148" y="1392"><tspan class="case-key">Context — </tspan><tspan>The active motive changes message meaning.</tspan></text>
  <text class="evidence" x="148" y="1416">Evidence · Advertising-rating experiment; not attendance</text>

  <rect x="70" y="1457" width="760" height="96" rx="18" fill="#f7fafc" stroke="#c9d7e1" stroke-width="2"/>
  <text class="footer-strong" x="450" y="1487" text-anchor="middle">Read the evidence labels as boundaries, not as a ranking of importance.</text>
  <text class="footer" x="450" y="1518" text-anchor="middle">These cases motivate descriptive and prescriptive decision science.</text>
  <text class="footer" x="450" y="1544" text-anchor="middle">They do not show that every context effect is irrational.</text>
</svg>

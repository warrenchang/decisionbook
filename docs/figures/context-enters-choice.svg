<svg xmlns="http://www.w3.org/2000/svg" width="1900" height="1120" viewBox="0 0 1900 1120" role="img" aria-labelledby="title desc">
  <title id="title">Seven ways context enters choice</title>
  <desc id="desc">Seven examples are arranged in three horizontal mechanism columns. Treatment framing and a subscription decoy change representation or comparison. An organ-donation default and an advertising redesign change the path from an available option to action. Watched eyes, publicity around a product, and a museum message change perceived observability, accessibility, or the active motive. Each example includes an evidence boundary.</desc>
  <defs>
    <style>
      .figure-title{font:700 46px Arial,Helvetica,sans-serif;fill:#17324d}
      .figure-subtitle{font:27px Arial,Helvetica,sans-serif;fill:#536779}
      .band-number{font:700 25px Arial,Helvetica,sans-serif;fill:#ffffff}
      .band-title{font:700 28px Arial,Helvetica,sans-serif;letter-spacing:.2px;fill:#17324d}
      .band-title-long{font:700 25px Arial,Helvetica,sans-serif;letter-spacing:.1px;fill:#17324d}
      .band-desc{font:22px Arial,Helvetica,sans-serif;fill:#536779}
      .case-title{font:700 24px Arial,Helvetica,sans-serif;fill:#17324d}
      .case-line{font:20px Arial,Helvetica,sans-serif;fill:#334e68}
      .case-key{font-weight:700;fill:#17324d}
      .evidence{font:18px Arial,Helvetica,sans-serif;fill:#536779}
      .footer-strong{font:700 24px Arial,Helvetica,sans-serif;fill:#17324d}
      .footer{font:20px Arial,Helvetica,sans-serif;fill:#536779}
      .icon-stroke-blue{fill:none;stroke:#2f6f9f;stroke-width:3.2;stroke-linecap:round;stroke-linejoin:round}
      .icon-fill-blue{fill:#e8f2f8;stroke:#2f6f9f;stroke-width:2.6}
      .icon-stroke-green{fill:none;stroke:#3f8457;stroke-width:3.2;stroke-linecap:round;stroke-linejoin:round}
      .icon-fill-green{fill:#eaf4ed;stroke:#3f8457;stroke-width:2.6}
      .icon-stroke-orange{fill:none;stroke:#b96a2f;stroke-width:3.2;stroke-linecap:round;stroke-linejoin:round}
      .icon-fill-orange{fill:#fff1e3;stroke:#b96a2f;stroke-width:2.6}
    </style>
  </defs>

  <rect width="1900" height="1120" fill="#ffffff"/>
  <text class="figure-title" x="950" y="62" text-anchor="middle">Seven ways context enters choice</text>
  <text class="figure-subtitle" x="950" y="108" text-anchor="middle">One feature can stay fixed while context changes the route from situation to action.</text>
  <line x1="150" y1="139" x2="1750" y2="139" stroke="#d2dee7" stroke-width="2"/>

  <!-- Column 1: representation and comparison -->
  <rect x="30" y="165" width="600" height="820" rx="26" fill="#f4f8fb" stroke="#9fb8ca" stroke-width="2.5"/>
  <circle cx="72" cy="211" r="25" fill="#2f6f9f"/>
  <text class="band-number" x="72" y="220" text-anchor="middle">1</text>
  <text class="band-title" x="112" y="205">REPRESENTATION &amp;</text>
  <text class="band-title" x="112" y="238">COMPARISON</text>
  <text class="band-desc" x="55" y="280">Context changes how an outcome or option</text>
  <text class="band-desc" x="55" y="309">is encoded against alternatives.</text>

  <rect x="52" y="370" width="556" height="200" rx="20" fill="#ffffff" stroke="#c9d7e1" stroke-width="2"/>
  <circle class="icon-fill-blue" cx="91" cy="470" r="29"/>
  <path class="icon-stroke-blue" d="M91 453v34M74 470h34"/>
  <text class="case-title" x="132" y="407">Lung-cancer treatment</text>
  <text class="case-title" x="132" y="436">framing</text>
  <text class="case-line" x="132" y="475"><tspan class="case-key">Held fixed — </tspan><tspan>Outcome probabilities.</tspan></text>
  <text class="case-line" x="132" y="504"><tspan class="case-key">Context — </tspan><tspan>Representation and attention change.</tspan></text>
  <text class="evidence" x="132" y="540">Evidence · Controlled benchmark challenge</text>

  <rect x="52" y="635" width="556" height="200" rx="20" fill="#ffffff" stroke="#c9d7e1" stroke-width="2"/>
  <circle class="icon-fill-blue" cx="91" cy="735" r="29"/>
  <rect x="74" y="722" width="33" height="22" rx="4" fill="none" stroke="#2f6f9f" stroke-width="3"/>
  <rect x="79" y="717" width="33" height="22" rx="4" fill="#ffffff" stroke="#2f6f9f" stroke-width="3"/>
  <line class="icon-stroke-blue" x1="85" y1="725" x2="105" y2="725"/>
  <line class="icon-stroke-blue" x1="85" y1="732" x2="99" y2="732"/>
  <text class="case-title" x="132" y="681">Subscription decoy</text>
  <text class="case-line" x="132" y="725"><tspan class="case-key">Held fixed — </tspan><tspan>Target subscription options.</tspan></text>
  <text class="case-line" x="132" y="754"><tspan class="case-key">Context — </tspan><tspan>The comparison set changes.</tspan></text>
  <text class="evidence" x="132" y="796">Evidence · Controlled benchmark challenge</text>

  <!-- Column 2: path to action -->
  <rect x="650" y="165" width="600" height="820" rx="26" fill="#f3f8f4" stroke="#9fc2aa" stroke-width="2.5"/>
  <circle cx="692" cy="211" r="25" fill="#3f8457"/>
  <text class="band-number" x="692" y="220" text-anchor="middle">2</text>
  <text class="band-title" x="732" y="205">PATH FROM AN AVAILABLE</text>
  <text class="band-title" x="732" y="238">OPTION TO ACTION</text>
  <text class="band-desc" x="675" y="280">Defaults and interface cues change what</text>
  <text class="band-desc" x="675" y="309">happens before action is taken.</text>

  <rect x="672" y="370" width="556" height="200" rx="20" fill="#ffffff" stroke="#cadccf" stroke-width="2"/>
  <circle class="icon-fill-green" cx="711" cy="470" r="29"/>
  <rect x="692" y="460" width="38" height="20" rx="10" class="icon-stroke-green"/>
  <circle cx="720" cy="470" r="7" fill="#3f8457"/>
  <text class="case-title" x="752" y="407">Organ-donation default</text>
  <text class="case-line" x="752" y="451"><tspan class="case-key">Held fixed — </tspan><tspan>Ability to choose either option.</tspan></text>
  <text class="case-line" x="752" y="480"><tspan class="case-key">Context — </tspan><tspan>Inaction, effort, and implied</tspan></text>
  <text class="case-line" x="752" y="506">recommendation.</text>
  <text class="evidence" x="752" y="540">Evidence · Experiment and policy evidence</text>

  <rect x="672" y="635" width="556" height="200" rx="20" fill="#ffffff" stroke="#cadccf" stroke-width="2"/>
  <circle class="icon-fill-green" cx="711" cy="735" r="29"/>
  <rect x="692" y="721" width="38" height="28" rx="4" class="icon-stroke-green"/>
  <line class="icon-stroke-green" x1="700" y1="735" x2="721" y2="735"/>
  <path class="icon-stroke-green" d="M716 729l7 6-7 6"/>
  <text class="case-title" x="752" y="681">Advertising redesign</text>
  <text class="case-line" x="752" y="725"><tspan class="case-key">Held fixed — </tspan><tspan>The underlying offer.</tspan></text>
  <text class="case-line" x="752" y="754"><tspan class="case-key">Context — </tspan><tspan>Salience and action affordance.</tspan></text>
  <text class="evidence" x="752" y="789">Evidence · Bundled corporate report;</text>
  <text class="evidence" x="752" y="812">the arrow was not isolated</text>

  <!-- Column 3: social meaning, accessibility, and active motive -->
  <rect x="1270" y="165" width="600" height="820" rx="26" fill="#fff8f0" stroke="#d7b58f" stroke-width="2.5"/>
  <circle cx="1312" cy="211" r="25" fill="#b96a2f"/>
  <text class="band-number" x="1312" y="220" text-anchor="middle">3</text>
  <text class="band-title-long" x="1352" y="205">SOCIAL MEANING, ACCESSIBILITY</text>
  <text class="band-title-long" x="1352" y="236">&amp; ACTIVE MOTIVE</text>
  <text class="band-desc" x="1295" y="280">Context changes what feels observed, comes</text>
  <text class="band-desc" x="1295" y="309">to mind, or fits the current goal.</text>

  <rect x="1292" y="330" width="556" height="205" rx="20" fill="#ffffff" stroke="#e1cfbb" stroke-width="2"/>
  <circle class="icon-fill-orange" cx="1331" cy="432" r="29"/>
  <path class="icon-stroke-orange" d="M1310 432c7-11 14-15 21-15s14 4 21 15c-7 11-14 15-21 15s-14-4-21-15z"/>
  <circle cx="1331" cy="432" r="6" fill="#b96a2f"/>
  <text class="case-title" x="1372" y="363">Watched eyes above an</text>
  <text class="case-title" x="1372" y="392">honesty box</text>
  <text class="case-line" x="1372" y="427"><tspan class="case-key">Held fixed — </tspan><tspan>Prices and rules.</tspan></text>
  <text class="case-line" x="1372" y="456"><tspan class="case-key">Context — </tspan><tspan>Perceived observability may change.</tspan></text>
  <text class="evidence" x="1372" y="489">Evidence · Field study; later meta-analyses:</text>
  <text class="evidence" x="1372" y="512">null overall</text>

  <rect x="1292" y="550" width="556" height="205" rx="20" fill="#ffffff" stroke="#e1cfbb" stroke-width="2"/>
  <circle class="icon-fill-orange" cx="1331" cy="652" r="29"/>
  <path class="icon-stroke-orange" d="M1314 645l22-9v32l-22-9z"/>
  <line class="icon-stroke-orange" x1="1340" y1="643" x2="1349" y2="638"/>
  <line class="icon-stroke-orange" x1="1340" y1="652" x2="1352" y2="652"/>
  <line class="icon-stroke-orange" x1="1340" y1="661" x2="1349" y2="666"/>
  <text class="case-title" x="1372" y="583">Mars publicity and a</text>
  <text class="case-title" x="1372" y="612">confectionery product</text>
  <text class="case-line" x="1372" y="647"><tspan class="case-key">Held fixed — </tspan><tspan>The product.</tspan></text>
  <text class="case-line" x="1372" y="676"><tspan class="case-key">Context — </tspan><tspan>Accessibility may change.</tspan></text>
  <text class="evidence" x="1372" y="709">Evidence · Anecdote; causal alternatives</text>
  <text class="evidence" x="1372" y="732">remain</text>

  <rect x="1292" y="770" width="556" height="195" rx="20" fill="#ffffff" stroke="#e1cfbb" stroke-width="2"/>
  <circle class="icon-fill-orange" cx="1331" cy="867" r="29"/>
  <path class="icon-stroke-orange" d="M1313 879h36M1317 864h28M1321 864v15M1330 864v15M1339 864v15M1348 864v15M1315 860l16-11 16 11z"/>
  <text class="case-title" x="1372" y="808">Museum message</text>
  <text class="case-line" x="1372" y="847"><tspan class="case-key">Held fixed — </tspan><tspan>The venue.</tspan></text>
  <text class="case-line" x="1372" y="876"><tspan class="case-key">Context — </tspan><tspan>Active motive changes meaning.</tspan></text>
  <text class="evidence" x="1372" y="909">Evidence · Advertising-rating experiment;</text>
  <text class="evidence" x="1372" y="932">not attendance</text>

  <rect x="250" y="1013" width="1400" height="78" rx="18" fill="#f7fafc" stroke="#c9d7e1" stroke-width="2"/>
  <text class="footer-strong" x="950" y="1044" text-anchor="middle">Read the evidence labels as boundaries, not as a ranking of importance.</text>
  <text class="footer" x="950" y="1075" text-anchor="middle">These cases motivate descriptive and prescriptive decision science; they do not show that every context effect is irrational.</text>
</svg>

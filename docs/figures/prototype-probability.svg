<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="670" viewBox="0 0 1100 670">
<title>Resemblance and probability answer different questions</title><desc>A category resemblance can produce a quick impression. A probability update instead combines a prior probability with the comparative likelihood of the evidence; this does not guarantee calibration.</desc>
<rect width="1100" height="670" fill="white"/>
<defs><marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0 L9 4 L0 8 Z" fill="context-stroke"/></marker></defs>
<g font-family="Arial, sans-serif" fill="#17324d">
<text x="550" y="48" font-size="32" font-weight="bold" fill="#17324d" text-anchor="middle">
<tspan x="550" dy="0">Resemblance and probability answer different questions</tspan>
</text>
<rect x="55" y="125" width="330" height="130" rx="17" fill="#f7f1e8" stroke="#c56a2d" stroke-width="3"/>
<text x="220.0" y="163" font-size="27" font-weight="bold" fill="#17324d" text-anchor="middle">
<tspan x="220.0" dy="0">Resemblance</tspan>
</text>
<text x="220.0" y="198.0" font-size="22" font-weight="normal" fill="#52677b" text-anchor="middle">
<tspan x="220.0" dy="0">How well does the case</tspan>
<tspan x="220.0" dy="27.5">fit a familiar category?</tspan>
</text>
<rect x="550" y="125" width="450" height="130" rx="17" fill="#f7f1e8" stroke="#c56a2d" stroke-width="3"/>
<text x="775.0" y="163" font-size="27" font-weight="bold" fill="#17324d" text-anchor="middle">
<tspan x="775.0" dy="0">Quick impression</tspan>
</text>
<text x="775.0" y="198.0" font-size="22" font-weight="normal" fill="#52677b" text-anchor="middle">
<tspan x="775.0" dy="0">“It fits, so it seems likely.”</tspan>
</text>
<path d="M385 190 H550" fill="none" stroke="#c56a2d" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="55" y="350" width="345" height="110" rx="17" fill="#eaf3f8" stroke="#2f6f9f" stroke-width="3"/>
<text x="227.5" y="388" font-size="27" font-weight="bold" fill="#17324d" text-anchor="middle">
<tspan x="227.5" dy="0">Prior probability</tspan>
</text>
<text x="227.5" y="423.0" font-size="21" font-weight="normal" fill="#52677b" text-anchor="middle">
<tspan x="227.5" dy="0">How common is the category?</tspan>
</text>
<rect x="55" y="510" width="345" height="110" rx="17" fill="#eaf3f8" stroke="#2f6f9f" stroke-width="3"/>
<text x="227.5" y="548" font-size="27" font-weight="bold" fill="#17324d" text-anchor="middle">
<tspan x="227.5" dy="0">Diagnostic evidence</tspan>
</text>
<text x="227.5" y="583.0" font-size="20" font-weight="normal" fill="#52677b" text-anchor="middle">
<tspan x="227.5" dy="0">How well does it distinguish</tspan>
<tspan x="227.5" dy="25.0">the competing explanations?</tspan>
</text>
<rect x="650" y="410" width="350" height="150" rx="17" fill="#edf4ed" stroke="#447c55" stroke-width="3"/>
<text x="825.0" y="448" font-size="27" font-weight="bold" fill="#17324d" text-anchor="middle">
<tspan x="825.0" dy="0">Updated probability</tspan>
</text>
<text x="825.0" y="483.0" font-size="22" font-weight="normal" fill="#52677b" text-anchor="middle">
<tspan x="825.0" dy="0">Combine the prior with the</tspan>
<tspan x="825.0" dy="27.5">likelihood of this evidence.</tspan>
</text>
<path d="M400 405 H530 V455 H650" fill="none" stroke="#2f6f9f" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M400 565 H530 V515 H650" fill="none" stroke="#2f6f9f" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow)"/>
</g></svg>

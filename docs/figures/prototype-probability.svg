<?xml version="1.0" encoding="utf-8" ?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink" baseProfile="full" height="650" version="1.1" viewBox="0 0 1200 650" width="1200">
  <defs/>
  <title>Prototype resemblance versus probability</title>
  <desc>Resemblance generates a quick category match, but probability also requires a base rate and evidence diagnosticity.</desc>
  <rect fill="white" height="650" width="1200" x="0" y="0"/>
  <text fill="#17324d" font-family="Arial, sans-serif" font-size="34" font-weight="bold" text-anchor="middle" x="600" y="48">A representative story is not yet a probability</text>
  <rect fill="#f7f1e8" height="155" rx="16" ry="16" stroke="#c56a2d" stroke-width="3" width="300" x="65" y="160"/>
  <text fill="#17324d" font-family="Arial, sans-serif" font-size="26" font-weight="bold" text-anchor="middle" x="215.0" y="229.5">Prototype match</text>
  <text fill="#66737f" font-family="Arial, sans-serif" font-size="17" font-weight="normal" text-anchor="middle" x="215.0" y="263.5">How much does this case resemble the category?</text>
  <line stroke="#c56a2d" stroke-width="4" x1="365" x2="535" y1="238" y2="238"/>
  <polygon fill="#c56a2d" points="535,238 522.0096189432334,245.5 522.0096189432334,230.5"/>
  <rect fill="#f9e7e7" height="115" rx="16" ry="16" stroke="#a74343" stroke-width="3" width="230" x="535" y="180"/>
  <text fill="#17324d" font-family="Arial, sans-serif" font-size="26" font-weight="bold" text-anchor="middle" x="650.0" y="229.5">Quick likelihood</text>
  <text fill="#66737f" font-family="Arial, sans-serif" font-size="17" font-weight="normal" text-anchor="middle" x="650.0" y="263.5">“It fits, so it is likely.”</text>
  <rect fill="#eaf3f8" height="125" rx="16" ry="16" stroke="#2f6f9f" stroke-width="3" width="300" x="65" y="405"/>
  <text fill="#17324d" font-family="Arial, sans-serif" font-size="26" font-weight="bold" text-anchor="middle" x="215.0" y="459.5">Base rate</text>
  <text fill="#66737f" font-family="Arial, sans-serif" font-size="17" font-weight="normal" text-anchor="middle" x="215.0" y="493.5">How common is the category?</text>
  <rect fill="#eaf3f8" height="125" rx="16" ry="16" stroke="#2f6f9f" stroke-width="3" width="300" x="455" y="405"/>
  <text fill="#17324d" font-family="Arial, sans-serif" font-size="26" font-weight="bold" text-anchor="middle" x="605.0" y="459.5">Diagnosticity</text>
  <text fill="#66737f" font-family="Arial, sans-serif" font-size="17" font-weight="normal" text-anchor="middle" x="605.0" y="493.5">How different is this evidence under alternatives?</text>
  <line stroke="#17324d" stroke-width="4" x1="365" x2="455" y1="468" y2="468"/>
  <polygon fill="#17324d" points="455,468 442.0096189432334,475.5 442.0096189432334,460.5"/>
  <line stroke="#2b7a78" stroke-width="4" x1="755" x2="895" y1="468" y2="365"/>
  <polygon fill="#2b7a78" points="895,365 888.9809607598165,378.73940197479976 880.0918092369255,366.65706009902567"/>
  <line stroke="#2b7a78" stroke-width="4" x1="765" x2="895" y1="238" y2="300"/>
  <polygon fill="#2b7a78" points="895,300 880.0462903013146,301.1775254763449 886.5033781745393,287.6384702582931"/>
  <rect fill="#edf4ed" height="170" rx="16" ry="16" stroke="#447c55" stroke-width="3" width="255" x="895" y="245"/>
  <text fill="#17324d" font-family="Arial, sans-serif" font-size="26" font-weight="bold" text-anchor="middle" x="1022.5" y="322.0">Calibrated probability</text>
  <text fill="#66737f" font-family="Arial, sans-serif" font-size="17" font-weight="normal" text-anchor="middle" x="1022.5" y="356.0">prior + diagnostic evidence
+ sample size</text>
  <text fill="#66737f" font-family="Arial, sans-serif" font-size="22" font-weight="normal" text-anchor="middle" x="600" y="595">More detail can improve narrative fit while reducing statistical probability.</text>
</svg>

<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">Habit automaticity develops gradually along different trajectories</title>
  <desc id="desc">Three illustrative asymptotic curves rise at different rates across scheduled cue occasions. Each curve is flat across one shaded missed occasion and then resumes rising, showing no new strengthening during the omission and no reset of prior learning.</desc>
  <rect width="1200" height="650" fill="#ffffff"/>
  <text x="600" y="48" text-anchor="middle" font-family="Arial, sans-serif" font-size="32" font-weight="700" fill="#17324d">Habit formation is a trajectory, not a deadline</text>
  <text x="600" y="78" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="#66737f">Illustrative curves: the rate and eventual level vary across people, behaviors, and contexts.</text>

  <line x1="125" y1="515" x2="1095" y2="515" stroke="#17324d" stroke-width="3"/>
  <line x1="125" y1="515" x2="125" y2="130" stroke="#17324d" stroke-width="3"/>
  <polygon points="1095,515 1079,506 1079,524" fill="#17324d"/>
  <polygon points="125,130 116,146 134,146" fill="#17324d"/>
  <text x="610" y="558" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#17324d">Scheduled cue occasions / days</text>
  <text x="42" y="326" transform="rotate(-90 42 326)" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#17324d">Automaticity</text>
  <text x="108" y="512" text-anchor="end" font-family="Arial, sans-serif" font-size="15" fill="#66737f">low</text>
  <text x="108" y="147" text-anchor="end" font-family="Arial, sans-serif" font-size="15" fill="#66737f">high</text>

  <rect x="505" y="130" width="72" height="385" fill="#f3f5f7"/>
  <line x1="505" y1="130" x2="505" y2="515" stroke="#9babb7" stroke-dasharray="6 6"/>
  <line x1="577" y1="130" x2="577" y2="515" stroke="#9babb7" stroke-dasharray="6 6"/>
  <text x="541" y="493" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#66737f">missed: no</text>
  <text x="541" y="510" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#66737f">repetition</text>

  <path d="M140 495 C220 315, 320 215, 505 169" fill="none" stroke="#2f6f9f" stroke-width="6" stroke-linecap="round"/>
  <path d="M505 169 L577 169" fill="none" stroke="#2f6f9f" stroke-width="6"/>
  <path d="M577 169 C670 142, 855 132, 1060 132" fill="none" stroke="#2f6f9f" stroke-width="6" stroke-linecap="round"/>

  <path d="M140 500 C260 425, 375 330, 505 267" fill="none" stroke="#2b7a78" stroke-width="6" stroke-linecap="round"/>
  <path d="M505 267 L577 267" fill="none" stroke="#2b7a78" stroke-width="6"/>
  <path d="M577 267 C690 198, 870 166, 1060 164" fill="none" stroke="#2b7a78" stroke-width="6" stroke-linecap="round"/>

  <path d="M140 503 C300 480, 420 435, 505 397" fill="none" stroke="#c56a2d" stroke-width="6" stroke-linecap="round"/>
  <path d="M505 397 L577 397" fill="none" stroke="#c56a2d" stroke-width="6"/>
  <path d="M577 397 C700 320, 860 270, 1060 252" fill="none" stroke="#c56a2d" stroke-width="6" stroke-linecap="round"/>

  <circle cx="505" cy="169" r="7" fill="#2f6f9f"/>
  <circle cx="505" cy="267" r="7" fill="#2b7a78"/>
  <circle cx="505" cy="397" r="7" fill="#c56a2d"/>
  <circle cx="577" cy="169" r="7" fill="#2f6f9f"/>
  <circle cx="577" cy="267" r="7" fill="#2b7a78"/>
  <circle cx="577" cy="397" r="7" fill="#c56a2d"/>

  <rect x="720" y="335" width="350" height="133" rx="15" fill="#ffffff" stroke="#c8d7e2" stroke-width="2"/>
  <text x="745" y="370" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#17324d">What the shape teaches</text>
  <text x="745" y="400" font-family="Arial, sans-serif" font-size="16" fill="#66737f">• early repetitions can change more</text>
  <text x="745" y="427" font-family="Arial, sans-serif" font-size="16" fill="#66737f">• gains often level rather than rise forever</text>
  <text x="745" y="454" font-family="Arial, sans-serif" font-size="16" fill="#66737f">• one miss can pause gain without erasing it</text>

  <text x="600" y="606" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#66737f">Schematic grounded in Lally et al. (2010); the flat pause is teaching shorthand because daily automaticity measures can fluctuate.</text>
  <text x="600" y="626" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#66737f">The curves are not individual forecasts, and repeated omissions can hinder acquisition even when one omission does not reset learning.</text>
</svg>

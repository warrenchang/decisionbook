<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820" viewBox="0 0 1200 820" role="img" aria-labelledby="title desc">
  <title id="title">Habit automaticity grows gradually, and one missed opportunity does not reset it</title>
  <desc id="desc">Two-panel evidence synthesis of Lally and colleagues, 2010. Panel A shows one illustrative asymptotic curve: self-reported automaticity rises across study days, with larger modeled gains early and diminishing gains near a plateau. Panel B separates the omission analysis: a performed occasion, one missed opportunity, and performance resumed. The immediate mean change after the miss was minus 0.29 points. For 67 occasions with next-day follow-up, the mean change from before the miss to after performance resumed was plus 0.55 points and was not statistically significant; the uninterrupted comparison was plus 0.79 points.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#506b80"/>
    </marker>
  </defs>

  <rect width="1200" height="820" fill="#ffffff"/>
  <text x="600" y="48" text-anchor="middle" font-family="Arial, sans-serif" font-size="32" font-weight="700" fill="#17324d">Habit automaticity grows gradually—not by a fixed deadline</text>
  <text x="600" y="80" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#5e6f7d">Evidence synthesis of daily self-reports in Lally et al. (2010)</text>

  <!-- Panel A -->
  <rect x="55" y="108" width="1090" height="365" rx="18" fill="#f7fafc" stroke="#c7d5df" stroke-width="2"/>
  <text x="85" y="145" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#17324d">A. The modeled growth pattern</text>
  <text x="85" y="174" font-family="Arial, sans-serif" font-size="18" fill="#5e6f7d">One illustrative asymptotic curve—not a group average or a personal timetable</text>

  <line x1="170" y1="412" x2="1070" y2="412" stroke="#17324d" stroke-width="2.5"/>
  <line x1="170" y1="412" x2="170" y2="208" stroke="#17324d" stroke-width="2.5"/>
  <text x="620" y="448" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#17324d">Day in the 84-day study</text>
  <text x="98" y="310" transform="rotate(-90 98 310)" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#17324d">Self-reported automaticity</text>
  <text x="153" y="410" text-anchor="end" font-family="Arial, sans-serif" font-size="18" fill="#5e6f7d">lower</text>
  <text x="153" y="223" text-anchor="end" font-family="Arial, sans-serif" font-size="18" fill="#5e6f7d">higher</text>

  <line x1="190" y1="225" x2="1045" y2="225" stroke="#86a3b8" stroke-width="2" stroke-dasharray="8 8"/>
  <path d="M190 397 C305 290 445 242 610 230 C770 226 925 225 1045 225" fill="none" stroke="#2f6f9f" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>

  <line x1="330" y1="342" x2="330" y2="316" stroke="#506b80" stroke-width="2"/>
  <text x="330" y="369" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#17324d">Earlier days</text>
  <text x="330" y="392" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#5e6f7d">larger modeled gains</text>

  <line x1="760" y1="222" x2="760" y2="302" stroke="#506b80" stroke-width="2"/>
  <text x="760" y="328" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#17324d">Later days</text>
  <text x="760" y="351" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#5e6f7d">smaller modeled gains</text>

  <line x1="968" y1="224" x2="968" y2="191" stroke="#506b80" stroke-width="2"/>
  <text x="968" y="178" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#17324d">Plateau</text>
  <text x="968" y="201" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#5e6f7d">level and timing varied</text>

  <!-- Panel B -->
  <rect x="55" y="490" width="1090" height="300" rx="18" fill="#fffaf4" stroke="#e1c49e" stroke-width="2"/>
  <text x="85" y="527" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#17324d">B. What happened around one missed opportunity</text>
  <text x="85" y="555" font-family="Arial, sans-serif" font-size="18" fill="#5e6f7d">The omission analysis is separate from the growth curve above.</text>

  <rect x="95" y="575" width="260" height="90" rx="14" fill="#eaf3f8" stroke="#2f6f9f" stroke-width="2.5"/>
  <text x="225" y="607" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#17324d">BEHAVIOR PERFORMED</text>
  <text x="225" y="638" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#5e6f7d">three preceding occasions</text>

  <line x1="355" y1="620" x2="416" y2="620" stroke="#506b80" stroke-width="3" marker-end="url(#arrow)"/>

  <rect x="425" y="575" width="285" height="90" rx="14" fill="#fce9e7" stroke="#c24b45" stroke-width="2.5"/>
  <text x="567.5" y="607" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#8d322e">ONE OPPORTUNITY MISSED</text>
  <text x="567.5" y="638" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#5e6f7d">immediate mean change: −0.29</text>

  <line x1="710" y1="620" x2="771" y2="620" stroke="#506b80" stroke-width="3" marker-end="url(#arrow)"/>

  <rect x="780" y="575" width="325" height="90" rx="14" fill="#eaf4ed" stroke="#3f7f56" stroke-width="2.5"/>
  <text x="942.5" y="607" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#285d3a">PERFORMANCE RESUMED</text>
  <text x="942.5" y="638" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#5e6f7d">no detectable longer-term cost</text>

  <path d="M225 682 L225 695 Q225 705 235 705 L932.5 705 Q942.5 705 942.5 695 L942.5 682" fill="none" stroke="#506b80" stroke-width="2"/>
  <text x="583.75" y="733" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#17324d">For 67 followed occasions: mean change from before the miss to after resuming = +0.55 points (not statistically significant)</text>

  <text x="600" y="769" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#5e6f7d">Omission analysis: 140 occasions across 55 participants. Comparable uninterrupted two-day change: +0.79 points.</text>
</svg>

<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="pareto-title pareto-desc">
  <title id="pareto-title">An illustrative Pareto-efficient set of negotiation packages</title>
  <desc id="pareto-desc">A scatterplot shows a discrete set of feasible packages using separately specified value measures for Party A and Party B. Four nondominated packages are highlighted and joined only as a visual guide. An arrow shows a Pareto improvement from one dominated package to one nondominated package. Notes state that efficiency is relative to the parties, issues, feasible menu, and value measures, and that the frontier need not be smooth or convex.</desc>
  <rect width="1200" height="720" fill="#ffffff"/>
  <text x="600" y="48" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700" fill="#17324d">Efficiency is relative to a specified feasible set</text>

  <rect x="128" y="112" width="944" height="474" rx="24" fill="#f7fafc" stroke="#c7d5df" stroke-width="2"/>
  <line x1="190" y1="520" x2="1014" y2="520" stroke="#17324d" stroke-width="4"/>
  <line x1="190" y1="520" x2="190" y2="150" stroke="#17324d" stroke-width="4"/>
  <path d="M1014 520 L996 510 L996 530 Z" fill="#17324d"/>
  <path d="M190 150 L180 168 L200 168 Z" fill="#17324d"/>

  <text x="610" y="568" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#17324d">Party A value measure for the specified issues</text>
  <text x="92" y="335" text-anchor="middle" transform="rotate(-90 92 335)" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#17324d">Party B value measure for the specified issues</text>

  <g fill="#aebdca" stroke="#ffffff" stroke-width="2">
    <circle cx="292" cy="438" r="10"/>
    <circle cx="386" cy="404" r="10"/>
    <circle cx="478" cy="446" r="10"/>
    <circle cx="548" cy="342" r="10"/>
    <circle cx="652" cy="384" r="10"/>
    <circle cx="738" cy="310" r="10"/>
    <circle cx="842" cy="354" r="10"/>
    <circle cx="920" cy="410" r="10"/>
  </g>

  <path d="M390 192 L590 224 L788 270 L982 350" fill="none" stroke="#c56a2d" stroke-width="4" stroke-dasharray="10 9" stroke-linecap="round" stroke-linejoin="round"/>
  <g fill="#fff7ed" stroke="#c56a2d" stroke-width="4">
    <circle cx="390" cy="192" r="12"/>
    <circle cx="590" cy="224" r="12"/>
    <circle cx="788" cy="270" r="12"/>
    <circle cx="982" cy="350" r="12"/>
  </g>
  <rect x="566" y="128" width="350" height="48" rx="14" fill="#fff7ed" stroke="#e2b182" stroke-width="2"/>
  <text x="741" y="158" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#9d5122">Nondominated packages in this menu</text>

  <circle cx="386" cy="404" r="12" fill="#2f6f9f" stroke="#ffffff" stroke-width="3"/>
  <text x="448" y="440" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#17324d">dominated package</text>
  <path d="M401 392 C462 342 508 288 559 247" fill="none" stroke="#447c55" stroke-width="5" stroke-linecap="round"/>
  <path d="M572 237 L555 241 L563 256 Z" fill="#447c55"/>
  <text x="468" y="313" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#447c55">Pareto improvement</text>

  <rect x="128" y="610" width="944" height="78" rx="18" fill="#eef4f7" stroke="#c7d5df" stroke-width="2"/>
  <text x="600" y="640" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#17324d">No interpersonal comparison is required: each axis uses that party's own stated value measure.</text>
  <text x="600" y="670" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#60758a">Efficiency does not establish fairness, feasibility outside the menu, legality, or implementation quality.</text>
</svg>

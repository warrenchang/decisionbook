<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">Social learning is one contributor to cumulative culture</title>
  <desc id="desc">Five nonsequential contributors—innovation, social observation and copying, teaching and transmission fidelity, retention and institutions, and selection and correction—feed a central cumulative-culture possibility. Two outputs show useful accumulation and copied error or obsolete routines.</desc>
  <defs>
    <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="8.5" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1,1 L8.5,5 L1,9 Z" fill="#47647e"/></marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="10" refX="8.5" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1,1 L8.5,5 L1,9 Z" fill="#3f7c59"/></marker>
    <marker id="arrow-red" markerWidth="10" markerHeight="10" refX="8.5" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1,1 L8.5,5 L1,9 Z" fill="#a74343"/></marker>
  </defs>
  <rect width="1200" height="700" fill="#ffffff"/>
  <rect x="1.5" y="1.5" width="1197" height="697" rx="28" fill="none" stroke="#d5e1ea" stroke-width="3"/>
  <text x="600" y="48" text-anchor="middle" font-family="Arial, sans-serif" font-size="34" font-weight="700" fill="#17324d">Social learning is one ingredient in cumulative culture</text>
  <text x="600" y="80" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#586d80">Accumulation depends on a changing mixture of contributors—not a guaranteed five-step sequence.</text>

  <g font-family="Arial, sans-serif">
    <rect x="25" y="130" width="210" height="122" rx="17" fill="#eef4f8" stroke="#7892a8" stroke-width="2.5"/>
    <text x="130" y="168" text-anchor="middle" font-size="20" font-weight="700" fill="#17324d">INNOVATION</text>
    <text x="130" y="203" text-anchor="middle" font-size="17" fill="#586d80"><tspan x="130" dy="0">variation • discovery</tspan><tspan x="130" dy="23">local adaptation</tspan></text>

    <rect x="260" y="130" width="210" height="122" rx="17" fill="#e5f1f7" stroke="#2f6f9f" stroke-width="2.5"/>
    <text x="365" y="166" text-anchor="middle" font-size="19" font-weight="700" fill="#17324d">SOCIAL LEARNING</text>
    <text x="365" y="201" text-anchor="middle" font-size="17" fill="#586d80"><tspan x="365" dy="0">observation • copying</tspan><tspan x="365" dy="23">inference from others</tspan></text>

    <rect x="495" y="130" width="210" height="122" rx="17" fill="#f8f1e7" stroke="#bf682d" stroke-width="2.5"/>
    <text x="600" y="164" text-anchor="middle" font-size="18" font-weight="700" fill="#17324d">TRANSMISSION</text>
    <text x="600" y="194" text-anchor="middle" font-size="18" font-weight="700" fill="#17324d">FIDELITY</text>
    <text x="600" y="225" text-anchor="middle" font-size="17" fill="#586d80">teaching • demonstration</text>

    <rect x="730" y="130" width="210" height="122" rx="17" fill="#f2edf5" stroke="#795a8a" stroke-width="2.5"/>
    <text x="835" y="164" text-anchor="middle" font-size="18" font-weight="700" fill="#17324d">RETENTION +</text>
    <text x="835" y="193" text-anchor="middle" font-size="18" font-weight="700" fill="#17324d">INSTITUTIONS</text>
    <text x="835" y="225" text-anchor="middle" font-size="17" fill="#586d80">memory • records • roles</text>

    <rect x="965" y="130" width="210" height="122" rx="17" fill="#eaf4ec" stroke="#3f7c59" stroke-width="2.5"/>
    <text x="1070" y="164" text-anchor="middle" font-size="18" font-weight="700" fill="#17324d">SELECTION +</text>
    <text x="1070" y="193" text-anchor="middle" font-size="18" font-weight="700" fill="#17324d">CORRECTION</text>
    <text x="1070" y="225" text-anchor="middle" font-size="17" fill="#586d80">feedback • testing • choice</text>
  </g>

  <g fill="none" stroke="#47647e" stroke-width="3" stroke-linecap="round">
    <path d="M130 252 V292 H390 V338" stroke-width="3" marker-end="url(#arrow-blue)"/>
    <path d="M365 252 V310 H480 V338" stroke-width="3" marker-end="url(#arrow-blue)"/>
    <path d="M600 252 V338" stroke-width="3" marker-end="url(#arrow-blue)"/>
    <path d="M835 252 V310 H720 V338" stroke-width="3" marker-end="url(#arrow-blue)"/>
    <path d="M1070 252 V292 H810 V338" stroke-width="3" marker-end="url(#arrow-blue)"/>
  </g>

  <rect x="330" y="338" width="540" height="112" rx="22" fill="#183047"/>
  <text x="600" y="379" text-anchor="middle" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#ffffff">CUMULATIVE CULTURE CAN EMERGE</text>
  <text x="600" y="407" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="#dbe8f0"><tspan x="600" dy="0">when modifications are transmitted and retained</tspan><tspan x="600" dy="23">across learners, groups, or generations</tspan></text>

  <path d="M500 450 V480 H310 V515" fill="none" stroke="#3f7c59" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-green)"/>
  <path d="M700 450 V480 H890 V515" fill="none" stroke="#a74343" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-red)"/>

  <rect x="80" y="515" width="460" height="100" rx="18" fill="#eaf4ec" stroke="#3f7c59" stroke-width="3"/>
  <text x="310" y="551" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#315f45">USEFUL ACCUMULATION</text>
  <text x="310" y="585" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#586d80">tools • skills • norms • institutions</text>

  <rect x="660" y="515" width="460" height="100" rx="18" fill="#f9e9e9" stroke="#a74343" stroke-width="3"/>
  <text x="890" y="551" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#7f3434">COPIED ERROR OR INERTIA</text>
  <text x="890" y="585" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#586d80">obsolete routines • cascades • copying noise</text>

  <text x="600" y="664" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="#647586">Author's teaching synthesis: each contributor is conditional, and observation alone does not create accumulation.</text>
</svg>

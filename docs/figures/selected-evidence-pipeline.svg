<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="700" height="780" viewBox="0 0 700 780" role="img" aria-labelledby="title desc">
  <title id="title">How a study becomes visible</title>
  <desc id="desc">Five stages show how choices about questions, design, data, analysis, and publication determine what readers see. Selection can occur at every stage.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 8" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0.5 0.8 L9 4 L0.5 7.2 Z" fill="#5f7080"/>
    </marker>
    <marker id="blue-arrow" viewBox="0 0 10 8" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0.5 0.8 L9 4 L0.5 7.2 Z" fill="#2f6f9f"/>
    </marker>
    <marker id="red-arrow" viewBox="0 0 10 8" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0.5 0.8 L9 4 L0.5 7.2 Z" fill="#a74343"/>
    </marker>
  </defs>
  <rect width="700" height="780" fill="#f8fafc"/>
<text x="350" y="52" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700" fill="#17324d" >How a study becomes visible</text>
<g id="stage-1">
<rect x="60" y="90" width="580" height="100" rx="18" fill="#eaf3f8" stroke="#2f6f9f" stroke-width="2"/>
<text x="350" y="129" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700" fill="#17324d" >1. Question</text>
<text x="350" y="167" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="400" fill="#17324d" >Which possibilities are investigated?</text>
</g>
<path d="M350 190 V225" fill="none" stroke="#5f7080" stroke-width="3" marker-end="url(#arrow)"/>
<g id="stage-2">
<rect x="60" y="225" width="580" height="100" rx="18" fill="#eaf3f8" stroke="#2f6f9f" stroke-width="2"/>
<text x="350" y="264" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700" fill="#17324d" >2. Design</text>
<text x="350" y="302" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="400" fill="#17324d" >Who and what get measured?</text>
</g>
<path d="M350 325 V360" fill="none" stroke="#5f7080" stroke-width="3" marker-end="url(#arrow)"/>
<g id="stage-3">
<rect x="60" y="360" width="580" height="100" rx="18" fill="#eaf3f8" stroke="#2f6f9f" stroke-width="2"/>
<text x="350" y="399" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700" fill="#17324d" >3. Data</text>
<text x="350" y="437" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="400" fill="#17324d" >Which observations are recorded?</text>
</g>
<path d="M350 460 V495" fill="none" stroke="#5f7080" stroke-width="3" marker-end="url(#arrow)"/>
<g id="stage-4">
<rect x="60" y="495" width="580" height="100" rx="18" fill="#eaf3f8" stroke="#2f6f9f" stroke-width="2"/>
<text x="350" y="534" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700" fill="#17324d" >4. Analysis</text>
<text x="350" y="572" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="400" fill="#17324d" >Which results are reported?</text>
</g>
<path d="M350 595 V630" fill="none" stroke="#5f7080" stroke-width="3" marker-end="url(#arrow)"/>
<g id="stage-5">
<rect x="60" y="630" width="580" height="100" rx="18" fill="#edf4ed" stroke="#447c55" stroke-width="2"/>
<text x="350" y="669" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700" fill="#17324d" >5. Literature</text>
<text x="350" y="707" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="400" fill="#17324d" >Which findings reach readers?</text>
</g>
</svg>

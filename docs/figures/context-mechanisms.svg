<?xml version="1.0" encoding="utf-8" ?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink" baseProfile="full" height="650" version="1.1" viewBox="0 0 1200 650" width="1200">
  <defs/>
  <title>Framing priming fluency and defaults</title>
  <desc>Four context mechanisms: framing changes meaning; priming changes what is active; fluency changes ease; defaults change what happens without action.</desc>
  <rect fill="white" height="650" width="1200" x="0" y="0"/>
  <text fill="#17324d" font-family="Arial, sans-serif" font-size="34" font-weight="bold" text-anchor="middle" x="600" y="48">Four ways context enters a choice</text>
  <rect fill="#eaf3f8" height="175" rx="16" ry="16" stroke="#2f6f9f" stroke-width="3" width="510" x="70" y="130"/>
  <text fill="#17324d" font-family="Arial, sans-serif" font-size="26" font-weight="bold" text-anchor="middle" x="325.0" y="209.5">Framing</text>
  <text fill="#66737f" font-family="Arial, sans-serif" font-size="17" font-weight="normal" text-anchor="middle" x="325.0" y="243.5">What is the decision about?</text>
  <text fill="#66737f" font-family="Arial, sans-serif" font-size="20" font-weight="normal" text-anchor="middle" x="325" y="265">meaning + reference point</text>
  <rect fill="#f7f1e8" height="175" rx="16" ry="16" stroke="#c56a2d" stroke-width="3" width="510" x="620" y="130"/>
  <text fill="#17324d" font-family="Arial, sans-serif" font-size="26" font-weight="bold" text-anchor="middle" x="875.0" y="209.5">Priming</text>
  <text fill="#66737f" font-family="Arial, sans-serif" font-size="17" font-weight="normal" text-anchor="middle" x="875.0" y="243.5">What is already active?</text>
  <text fill="#66737f" font-family="Arial, sans-serif" font-size="20" font-weight="normal" text-anchor="middle" x="875" y="265">associations + accessibility</text>
  <rect fill="#edf4ed" height="175" rx="16" ry="16" stroke="#447c55" stroke-width="3" width="510" x="70" y="365"/>
  <text fill="#17324d" font-family="Arial, sans-serif" font-size="26" font-weight="bold" text-anchor="middle" x="325.0" y="444.5">Fluency</text>
  <text fill="#66737f" font-family="Arial, sans-serif" font-size="17" font-weight="normal" text-anchor="middle" x="325.0" y="478.5">How easy does it feel?</text>
  <text fill="#66737f" font-family="Arial, sans-serif" font-size="20" font-weight="normal" text-anchor="middle" x="325" y="500">familiarity + confidence</text>
  <rect fill="#f5ebf5" height="175" rx="16" ry="16" stroke="#795a8a" stroke-width="3" width="510" x="620" y="365"/>
  <text fill="#17324d" font-family="Arial, sans-serif" font-size="26" font-weight="bold" text-anchor="middle" x="875.0" y="444.5">Default</text>
  <text fill="#66737f" font-family="Arial, sans-serif" font-size="17" font-weight="normal" text-anchor="middle" x="875.0" y="478.5">What happens if I do nothing?</text>
  <text fill="#66737f" font-family="Arial, sans-serif" font-size="20" font-weight="normal" text-anchor="middle" x="875" y="500">effort + implied norm</text>
</svg>

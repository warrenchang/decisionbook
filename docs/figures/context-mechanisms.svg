<svg xmlns="http://www.w3.org/2000/svg" width="760" height="1040" viewBox="0 0 760 1040" role="img" aria-labelledby="title desc" data-layout="compact">
<title id="title">Four questions about context</title><desc id="desc">Four separate cards distinguish framing, priming, fluency, and defaults. They are alternative diagnostic questions, not a sequence of stages.</desc>
<defs><style>
text {font-family:Arial,Helvetica,sans-serif;fill:#183047}
.title {font-family:Georgia,serif;font-size:38px;font-weight:bold}
</style>
<marker id="blue" markerWidth="8" markerHeight="8" refX="8" refY="4" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8 Z" fill="#25678f"/></marker>
<marker id="green" markerWidth="8" markerHeight="8" refX="8" refY="4" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8 Z" fill="#2b7a78"/></marker>
<marker id="warm" markerWidth="8" markerHeight="8" refX="8" refY="4" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8 Z" fill="#b95f2d"/></marker>
</defs><rect width="760" height="1040" fill="white"/>
<text x="380" y="60" text-anchor="middle" font-size="38" font-weight="normal" style="fill:#183047" class="title"><tspan x="380" dy="0">Four questions</tspan><tspan x="380" dy="47.12">about context</tspan></text>
<rect x="65" y="174" width="630" height="164" rx="18" fill="#f4f7fa" stroke="#25678f" stroke-width="2.5"/>
<text x="380.0" y="217" text-anchor="middle" font-size="32" font-weight="bold" style="fill:#25678f" class=""><tspan x="380.0" dy="0">Framing</tspan></text>
<text x="380.0" y="258" text-anchor="middle" font-size="28" font-weight="normal" style="fill:#183047" class=""><tspan x="380.0" dy="0">What is this decision about?</tspan><tspan x="380.0" dy="34.72">Meaning and reference point</tspan></text>
<rect x="65" y="373" width="630" height="164" rx="18" fill="#f4f7fa" stroke="#b95f2d" stroke-width="2.5"/>
<text x="380.0" y="416" text-anchor="middle" font-size="32" font-weight="bold" style="fill:#b95f2d" class=""><tspan x="380.0" dy="0">Priming</tspan></text>
<text x="380.0" y="457" text-anchor="middle" font-size="28" font-weight="normal" style="fill:#183047" class=""><tspan x="380.0" dy="0">What has just been brought to mind?</tspan><tspan x="380.0" dy="34.72">Associations and accessibility</tspan></text>
<rect x="65" y="572" width="630" height="164" rx="18" fill="#f4f7fa" stroke="#2b7a78" stroke-width="2.5"/>
<text x="380.0" y="615" text-anchor="middle" font-size="32" font-weight="bold" style="fill:#2b7a78" class=""><tspan x="380.0" dy="0">Fluency</tspan></text>
<text x="380.0" y="656" text-anchor="middle" font-size="28" font-weight="normal" style="fill:#183047" class=""><tspan x="380.0" dy="0">How easy does this feel to process?</tspan><tspan x="380.0" dy="34.72">Ease can become a cue</tspan></text>
<rect x="65" y="771" width="630" height="164" rx="18" fill="#f4f7fa" stroke="#25678f" stroke-width="2.5"/>
<text x="380.0" y="814" text-anchor="middle" font-size="32" font-weight="bold" style="fill:#25678f" class=""><tspan x="380.0" dy="0">Default</tspan></text>
<text x="380.0" y="855" text-anchor="middle" font-size="28" font-weight="normal" style="fill:#183047" class=""><tspan x="380.0" dy="0">What happens if I do nothing?</tspan><tspan x="380.0" dy="34.72">The outcome of inaction</tspan></text>
<text x="380" y="1003" text-anchor="middle" font-size="28" font-weight="normal" style="fill:#183047" class=""><tspan x="380" dy="0">Ask which mechanism the evidence supports.</tspan></text>
</svg>

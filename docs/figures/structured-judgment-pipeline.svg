<svg xmlns="http://www.w3.org/2000/svg" width="760" height="1010" viewBox="0 0 760 1010" role="img" aria-labelledby="title desc">
<title id="title">Protect independent judgment, then learn</title><desc id="desc">Six practical steps define a decision, separate its criteria, obtain independent judgments, compare and combine them, decide and record, then review. Review informs the next process while preserving the original record. This author’s workflow should be adapted and tested for the task.</desc>
<rect width="760" height="1010" fill="white"/>
<defs>
<marker id="a" viewBox="0 0 12 10" markerWidth="9" markerHeight="8" refX="11" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L11 5 L1 9 Z" fill="#2f6f9f"/></marker>
<marker id="g" viewBox="0 0 12 10" markerWidth="9" markerHeight="8" refX="11" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L11 5 L1 9 Z" fill="#3f7c59"/></marker>
<marker id="o" viewBox="0 0 12 10" markerWidth="9" markerHeight="8" refX="11" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L11 5 L1 9 Z" fill="#b95f2d"/></marker>
</defs>
<text x="380" y="48" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="700" fill="#17324d">Protect independent judgment,</text>
<text x="380" y="89.6" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="700" fill="#17324d">then learn</text>
<rect x="96" y="130" width="620" height="98" rx="18" fill="#edf5fa" stroke="#2f6f9f" stroke-width="2.5"/>
<text x="406" y="167" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#17324d">Define the decision</text>
<text x="406" y="204" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="400" fill="#53697d">Name the goal, rights, and cost of error.</text>
<path d="M406 228 V262" fill="none" stroke="#2f6f9f" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#a)"/>
<rect x="96" y="262" width="620" height="98" rx="18" fill="#f3f6f9" stroke="#53697d" stroke-width="2.5"/>
<text x="406" y="299" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#17324d">Separate the criteria</text>
<text x="406" y="336" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="400" fill="#53697d">Choose the evidence each criterion needs.</text>
<path d="M406 360 V394" fill="none" stroke="#2f6f9f" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#a)"/>
<rect x="96" y="394" width="620" height="98" rx="18" fill="#f4eff8" stroke="#795a8a" stroke-width="2.5"/>
<text x="406" y="431" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#17324d">Judge independently</text>
<text x="406" y="468" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="400" fill="#53697d">Record estimates before discussing them.</text>
<path d="M406 492 V526" fill="none" stroke="#2f6f9f" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#a)"/>
<rect x="96" y="526" width="620" height="98" rx="18" fill="#fff5ec" stroke="#b95f2d" stroke-width="2.5"/>
<text x="406" y="563" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#17324d">Compare and combine</text>
<text x="406" y="600" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="400" fill="#53697d">Compare reasons; challenge assumptions.</text>
<path d="M406 624 V658" fill="none" stroke="#2f6f9f" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#a)"/>
<rect x="96" y="658" width="620" height="98" rx="18" fill="#f3f6f9" stroke="#53697d" stroke-width="2.5"/>
<text x="406" y="695" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#17324d">Decide and record</text>
<text x="406" y="732" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="400" fill="#53697d">Save the reasons, uncertainty, and owner.</text>
<path d="M406 756 V790" fill="none" stroke="#2f6f9f" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#a)"/>
<rect x="96" y="790" width="620" height="98" rx="18" fill="#edf7ef" stroke="#3f7c59" stroke-width="2.5"/>
<text x="406" y="827" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#17324d">Review the result</text>
<text x="406" y="864" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="400" fill="#53697d">Check outcomes and who was harmed.</text>
<path d="M96 839 H35 V179 H96" fill="none" stroke="#3f7c59" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#g)"/>
<text x="380" y="941" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="400" fill="#3f7c59">Use the review to improve the next process;</text>
<text x="380" y="977.4" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="400" fill="#3f7c59">preserve the record of what was known before.</text>
</svg>

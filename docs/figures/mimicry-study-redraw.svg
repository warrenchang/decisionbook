<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">Behavioral mimicry in Chartrand and Bargh's first experiment</title>
  <desc id="desc">An original redraw of the reported means. Participants rubbed their faces more with a face-rubbing interaction partner and shook their feet more with a foot-shaking interaction partner. A boundary panel notes that the result is task-specific and does not make mimicry mind control.</desc>
  <rect width="1200" height="700" fill="#ffffff"/>
  <text x="600" y="48" text-anchor="middle" font-family="Arial, sans-serif" font-size="33" font-weight="700" fill="#17324d">Behavior can align before anyone decides to align</text>
  <text x="600" y="80" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#66737f">Original redraw of reported means from Chartrand and Bargh (1999), Experiment 1</text>

  <rect x="45" y="112" width="760" height="520" rx="18" fill="#f7fafc" stroke="#c8d7e2" stroke-width="2"/>
  <text x="425" y="151" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#17324d">Participant behavior by interaction partner’s mannerism</text>
  <line x1="130" y1="520" x2="755" y2="520" stroke="#8fa0ad" stroke-width="2"/>
  <line x1="130" y1="200" x2="130" y2="520" stroke="#8fa0ad" stroke-width="2"/>
  <g font-family="Arial, sans-serif" font-size="14" fill="#66737f">
    <line x1="130" y1="456" x2="755" y2="456" stroke="#dce5ea"/><text x="116" y="461" text-anchor="end">0.4</text>
    <line x1="130" y1="392" x2="755" y2="392" stroke="#dce5ea"/><text x="116" y="397" text-anchor="end">0.5</text>
    <line x1="130" y1="328" x2="755" y2="328" stroke="#dce5ea"/><text x="116" y="333" text-anchor="end">0.6</text>
    <line x1="130" y1="264" x2="755" y2="264" stroke="#dce5ea"/><text x="116" y="269" text-anchor="end">0.7</text>
    <line x1="130" y1="200" x2="755" y2="200" stroke="#dce5ea"/><text x="116" y="205" text-anchor="end">0.8</text>
    <text x="52" y="366" transform="rotate(-90 52 366)" text-anchor="middle" font-size="16">Reported mean (study units)</text>
  </g>

  <rect x="190" y="347" width="82" height="173" rx="7" fill="#2f6f9f"/>
  <rect x="284" y="488" width="82" height="32" rx="7" fill="#c7d7e2" stroke="#2f6f9f" stroke-width="2"/>
  <text x="231" y="337" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#17324d">0.57</text>
  <text x="325" y="478" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#17324d">0.35</text>
  <text x="278" y="553" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#17324d">Participant rubs face</text>

  <rect x="505" y="424" width="82" height="96" rx="7" fill="#2f6f9f"/>
  <rect x="599" y="245" width="82" height="275" rx="7" fill="#c7d7e2" stroke="#2f6f9f" stroke-width="2"/>
  <text x="546" y="414" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#17324d">0.45</text>
  <text x="640" y="235" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#17324d">0.73</text>
  <text x="593" y="553" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#17324d">Participant shakes foot</text>

  <rect x="190" y="586" width="22" height="22" rx="4" fill="#2f6f9f"/><text x="221" y="603" font-family="Arial, sans-serif" font-size="16" fill="#17324d">Partner rubs face</text>
  <rect x="450" y="586" width="22" height="22" rx="4" fill="#c7d7e2" stroke="#2f6f9f" stroke-width="2"/><text x="481" y="603" font-family="Arial, sans-serif" font-size="16" fill="#17324d">Partner shakes foot</text>

  <rect x="835" y="112" width="320" height="520" rx="18" fill="#f7f1e8" stroke="#c56a2d" stroke-width="2"/>
  <text x="995" y="158" text-anchor="middle" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#17324d">What the pattern shows</text>
  <rect x="875" y="190" width="240" height="112" rx="14" fill="#edf4ed" stroke="#447c55" stroke-width="2"/>
  <text x="995" y="226" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#17324d">Perception → tendency</text>
  <text x="995" y="256" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#66737f">Observed mannerisms shifted</text>
  <text x="995" y="279" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#66737f">participants’ own behavior.</text>
  <text x="995" y="354" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#a74343">Boundary</text>
  <text x="995" y="389" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#17324d">This is one laboratory task,</text>
  <text x="995" y="414" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#17324d">not a universal effect size.</text>
  <text x="995" y="456" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#17324d">Mimicry varies with goals,</text>
  <text x="995" y="481" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#17324d">relationship, group, status,</text>
  <text x="995" y="506" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#17324d">awareness, and conspicuousness.</text>
  <line x1="875" y1="546" x2="1115" y2="546" stroke="#d8c5aa"/>
  <text x="995" y="578" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#17324d">Attunement is not mind control.</text>
  <text x="600" y="676" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#66737f">Data source: Chartrand &amp; Bargh (1999). Graphic design and annotations are original to this book.</text>
</svg>

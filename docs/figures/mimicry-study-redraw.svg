<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="810" height="525" viewBox="15 125 810 525" role="img" aria-labelledby="title desc">
  <title id="title">Behavioral mimicry in Chartrand and Bargh's first experiment</title>
  <desc id="desc">A zero-origin grouped bar chart redraws actions per minute for 35 participants. Face rubbing was higher with a face-rubbing partner than with a foot-shaking partner, a statistically significant contrast. Foot shaking was higher with a foot-shaking partner, but that contrast was only marginal, p equals .06.</desc>
  <rect width="810" height="595" fill="#ffffff" x="15" y="55"/>
  <rect x="45" y="142" width="760" height="490" rx="18" fill="#f7fafc" stroke="#c8d7e2" stroke-width="2"/>
  <line x1="130" y1="520" x2="755" y2="520" stroke="#8fa0ad" stroke-width="2"/>
  <line x1="130" y1="200" x2="130" y2="520" stroke="#8fa0ad" stroke-width="2"/>
  <g font-family="Arial, sans-serif" font-size="16" fill="#66737f">
    <text x="116" y="525" text-anchor="end">0</text>
    <line x1="130" y1="440" x2="755" y2="440" stroke="#dce5ea"/><text x="116" y="445" text-anchor="end">0.2</text>
    <line x1="130" y1="360" x2="755" y2="360" stroke="#dce5ea"/><text x="116" y="365" text-anchor="end">0.4</text>
    <line x1="130" y1="280" x2="755" y2="280" stroke="#dce5ea"/><text x="116" y="285" text-anchor="end">0.6</text>
    <line x1="130" y1="200" x2="755" y2="200" stroke="#dce5ea"/><text x="116" y="205" text-anchor="end">0.8</text>
    <text x="52" y="360" transform="rotate(-90 52 360)" text-anchor="middle" font-size="16">Actions per minute</text>
  </g>

  <rect x="190" y="292" width="82" height="228" rx="7" fill="#2f6f9f"/>
  <rect x="284" y="380" width="82" height="140" rx="7" fill="#c7d7e2" stroke="#2f6f9f" stroke-width="2"/>
  <text x="231" y="282" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#17324d">0.57</text>
  <text x="325" y="370" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#17324d">0.35</text>
  <text x="278" y="553" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#17324d">Participant rubs face</text>
  <line x1="210" y1="252" x2="346" y2="252" stroke="#447c55" stroke-width="2"/>
  <line x1="210" y1="252" x2="210" y2="263" stroke="#447c55" stroke-width="2"/>
  <line x1="346" y1="252" x2="346" y2="263" stroke="#447c55" stroke-width="2"/>
  <text x="278" y="239" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#447c55">statistically significant</text>

  <rect x="505" y="340" width="82" height="180" rx="7" fill="#2f6f9f"/>
  <rect x="599" y="228" width="82" height="292" rx="7" fill="#c7d7e2" stroke="#2f6f9f" stroke-width="2"/>
  <text x="546" y="330" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#17324d">0.45</text>
  <text x="640" y="218" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#17324d">0.73</text>
  <text x="593" y="553" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#17324d">Participant shakes foot</text>
  <line x1="525" y1="188" x2="661" y2="188" stroke="#c56a2d" stroke-width="2"/>
  <line x1="525" y1="188" x2="525" y2="199" stroke="#c56a2d" stroke-width="2"/>
  <line x1="661" y1="188" x2="661" y2="199" stroke="#c56a2d" stroke-width="2"/>
  <text x="593" y="175" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#c56a2d">marginal, p = .06</text>

  <rect x="190" y="586" width="22" height="22" rx="4" fill="#2f6f9f"/><text x="221" y="603" font-family="Arial, sans-serif" font-size="16" fill="#17324d">Partner rubs face</text>
  <rect x="450" y="586" width="22" height="22" rx="4" fill="#c7d7e2" stroke="#2f6f9f" stroke-width="2"/><text x="481" y="603" font-family="Arial, sans-serif" font-size="16" fill="#17324d">Partner shakes foot</text>

  </svg>
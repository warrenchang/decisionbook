<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="640" height="640" viewBox="0 0 640 640" role="img" aria-labelledby="title desc">
  <title id="title">The habit loop</title>
  <desc id="desc">Four elements arranged clockwise in a circle: cue, impulse, action, and outcome. Impulse means readiness to act and need not be consciously felt. A dashed return arrow labeled Learning leads from outcome back to cue, representing how repetition and its consequences can shape responding when the cue appears again, rather than a change to the cue itself.</desc>
  <defs>
    <marker id="arrow-navy" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M1,1 L10,6 L1,11 Z" fill="#47647e"/>
    </marker>
    <marker id="arrow-teal" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M1,1 L10,6 L1,11 Z" fill="#2b7a78"/>
    </marker>
  </defs>

  <rect width="640" height="640" fill="#ffffff"/>

  <g font-family="Arial, sans-serif" text-anchor="middle">
    <text x="320" y="35" font-size="32" font-weight="700" fill="#17324d">The habit loop</text>

    <g id="cue">
      <rect x="226" y="68" width="188" height="104" rx="18" fill="#eaf3f8" stroke="#2f6f9f" stroke-width="2.5"/>
      <text x="320" y="111" font-size="30" font-weight="700" fill="#17324d">Cue</text>
      <text x="320" y="147" font-size="24" fill="#53677a">What starts it</text>
    </g>

    <g id="impulse">
      <rect x="426" y="268" width="188" height="104" rx="18" fill="#eaf3f8" stroke="#2f6f9f" stroke-width="2.5"/>
      <text x="520" y="311" font-size="30" font-weight="700" fill="#17324d">Impulse</text>
      <text x="520" y="347" font-size="24" fill="#53677a">Ready to act</text>
    </g>

    <g id="action">
      <rect x="226" y="468" width="188" height="104" rx="18" fill="#eef4f8" stroke="#7892a8" stroke-width="2.5"/>
      <text x="320" y="511" font-size="30" font-weight="700" fill="#17324d">Action</text>
      <text x="320" y="547" font-size="24" fill="#53677a">What you do</text>
    </g>

    <g id="outcome">
      <rect x="26" y="268" width="188" height="104" rx="18" fill="#f8f1e7" stroke="#bf682d" stroke-width="2.5"/>
      <text x="120" y="311" font-size="30" font-weight="700" fill="#17324d">Outcome</text>
      <text x="120" y="347" font-size="24" fill="#53677a">What follows</text>
    </g>

    <text x="100" y="193" font-size="24" font-weight="700" fill="#245e5c">Learning</text>
    <text x="320" y="615" font-size="24" fill="#53677a">An impulse need not be consciously felt.</text>
  </g>

  <!-- All four connectors follow the same circle, centered at (320,320), radius 200.
       Endpoints meet card boundaries; the dashed arc denotes learning across episodes. -->
  <g fill="none" stroke-linecap="round">
    <path d="M414 143.467 A200 200 0 0 1 513.122 268" stroke="#47647e" stroke-width="3.5" marker-end="url(#arrow-navy)"/>
    <path d="M513.122 372 A200 200 0 0 1 414 496.533" stroke="#47647e" stroke-width="3.5" marker-end="url(#arrow-navy)"/>
    <path d="M226 496.533 A200 200 0 0 1 126.878 372" stroke="#47647e" stroke-width="3.5" marker-end="url(#arrow-navy)"/>
    <path d="M126.878 268 A200 200 0 0 1 226 143.467" stroke="#2b7a78" stroke-width="3.5" stroke-dasharray="8 7" marker-end="url(#arrow-teal)"/>
  </g>
</svg>

<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="850" viewBox="0 0 1400 850" role="img" aria-labelledby="title desc">
  <title id="title">A reported classroom demonstration of the subscription decoy effect</title>
  <desc id="desc">Two panels compare reported choices by groups of one hundred participants. With a dominated print-only option present, 16 chose web only, none chose print only, and 84 chose print plus web. With the print-only option removed, 68 chose web only and 32 chose print plus web. These are classroom choice counts reported by Ariely, not sales data from The Economist.</desc>
  <defs>
    <style>
      .title{font:700 34px Arial,sans-serif;fill:#17324d}
      .subtitle{font:19px Arial,sans-serif;fill:#607080}
      .panel-title{font:700 24px Arial,sans-serif;fill:#17324d}
      .panel-note{font:18px Arial,sans-serif;fill:#607080}
      .option{font:700 22px Arial,sans-serif;fill:#17324d}
      .price{font:700 24px Arial,sans-serif;fill:#17324d}
      .detail{font:18px Arial,sans-serif;fill:#607080}
      .count{font:700 23px Arial,sans-serif;fill:#17324d}
      .small{font:18px Arial,sans-serif;fill:#607080}
      .footer-strong{font:700 22px Arial,sans-serif;fill:#17324d}
      .footer{font:18px Arial,sans-serif;fill:#536879}
    </style>
  </defs>

  <rect width="1400" height="850" fill="#ffffff"/>
  <text class="title" x="700" y="48" text-anchor="middle">The option nobody chose changed what others chose</text>
  <text class="subtitle" x="700" y="80" text-anchor="middle">A dominated alternative can make one of the remaining options easier to prefer.</text>

  <rect x="40" y="120" width="640" height="590" rx="24" fill="#f7fafc" stroke="#b8c9d6" stroke-width="2.5"/>
  <text class="panel-title" x="360" y="163" text-anchor="middle">WITH THE PRINT-ONLY DECOY</text>
  <text class="panel-note" x="360" y="193" text-anchor="middle">Reported classroom group: 100 choices</text>

  <rect x="72" y="225" width="576" height="112" rx="18" fill="#eaf3f8" stroke="#2f6f9f" stroke-width="2.5"/>
  <text class="option" x="102" y="265">WEB ONLY</text>
  <text class="price" x="102" y="304">US$59</text>
  <rect x="320" y="255" width="32" height="42" rx="8" fill="#80b7d6"/>
  <text class="count" x="620" y="284" text-anchor="end">16 chose</text>

  <rect x="72" y="360" width="576" height="112" rx="18" fill="#f3f5f7" stroke="#8294a3" stroke-width="2.5" stroke-dasharray="9 7"/>
  <text class="option" x="102" y="400">PRINT ONLY</text>
  <text class="price" x="102" y="439">US$125</text>
  <rect x="314" y="386" width="180" height="34" rx="17" fill="#e8ecef" stroke="#8294a3" stroke-width="1.5"/>
  <text class="small" x="404" y="409" text-anchor="middle">dominated decoy</text>
  <text class="count" x="620" y="419" text-anchor="end">0 chose</text>

  <rect x="72" y="495" width="576" height="112" rx="18" fill="#eaf5ee" stroke="#3f7f54" stroke-width="3"/>
  <text class="option" x="102" y="535">PRINT + WEB</text>
  <text class="price" x="102" y="574">US$125</text>
  <rect x="320" y="525" width="168" height="42" rx="8" fill="#76aa87"/>
  <text class="count" x="620" y="554" text-anchor="end">84 chose</text>

  <rect x="72" y="630" width="576" height="52" rx="16" fill="#17324d"/>
  <text x="360" y="663" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#ffffff">The target looks easy to compare with the decoy.</text>

  <rect x="720" y="120" width="640" height="590" rx="24" fill="#f7fafc" stroke="#b8c9d6" stroke-width="2.5"/>
  <text class="panel-title" x="1040" y="163" text-anchor="middle">WITHOUT THE DECOY</text>
  <text class="panel-note" x="1040" y="193" text-anchor="middle">A different classroom group: 100 choices</text>

  <rect x="752" y="270" width="576" height="128" rx="18" fill="#eaf3f8" stroke="#2f6f9f" stroke-width="2.5"/>
  <text class="option" x="782" y="314">WEB ONLY</text>
  <text class="price" x="782" y="356">US$59</text>
  <rect x="990" y="299" width="136" height="44" rx="8" fill="#80b7d6"/>
  <text class="count" x="1300" y="329" text-anchor="end">68 chose</text>

  <rect x="752" y="430" width="576" height="128" rx="18" fill="#eaf5ee" stroke="#3f7f54" stroke-width="3"/>
  <text class="option" x="782" y="474">PRINT + WEB</text>
  <text class="price" x="782" y="516">US$125</text>
  <rect x="990" y="459" width="64" height="44" rx="8" fill="#76aa87"/>
  <text class="count" x="1300" y="489" text-anchor="end">32 chose</text>

  <rect x="752" y="630" width="576" height="52" rx="16" fill="#17324d"/>
  <text x="1040" y="663" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#ffffff">Removing the decoy changed the target choices.</text>

  <rect x="90" y="746" width="1220" height="78" rx="20" fill="#f7f1e8" stroke="#c9ad83" stroke-width="2"/>
  <text class="footer-strong" x="700" y="778" text-anchor="middle">Reported classroom demonstration (Ariely, 2008)—not customer sales data</text>
  <text class="footer" x="700" y="807" text-anchor="middle">The general attraction effect is established, but its size and occurrence depend on the menu, task, and population (Huber et al., 1982).</text>
</svg>

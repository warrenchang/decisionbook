<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1540" viewBox="0 0 800 1540" role="img" aria-labelledby="title desc">
  <title id="title">The recursive decision loop and its social environment</title>
  <desc id="desc">Other minds, institutions, and designed environments feed every function in a loop from context and information through attention, option construction, prediction, valuation, choice and action, and learning. Feedback returns to the beginning.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 9 7" markerWidth="9" markerHeight="7" refX="8.2" refY="3.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0.7 0.7 L8.2 3.5 L0.7 6.3 Z" fill="#587189"/>
    </marker>
    <style>
      .outer-title{font:700 27px Arial,Helvetica,sans-serif;fill:#183047}
      .outer-copy{font:21px Arial,Helvetica,sans-serif;fill:#4c6173}
      .node{font:700 29px Arial,Helvetica,sans-serif;fill:#12364a}
      .small{font:22px Arial,Helvetica,sans-serif;fill:#4c6173}
    </style>
  </defs>

  <rect width="800" height="1540" fill="#ffffff"/>
  <rect x="45" y="35" width="710" height="165" rx="24" fill="#e9f2f7" stroke="#236b8e" stroke-width="3"/>
  <text class="outer-title" x="400" y="83" text-anchor="middle">OTHER MINDS, INSTITUTIONS,</text>
  <text class="outer-title" x="400" y="119" text-anchor="middle">AND DESIGNED ENVIRONMENTS</text>
  <text class="outer-copy" x="400" y="161" text-anchor="middle">can change what is available, noticed, predicted, valued,</text>
  <text class="outer-copy" x="400" y="188" text-anchor="middle">chosen, reinforced, and learned</text>

  <path d="M400 200 V225 H90 V1352" fill="none" stroke="#587189" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

  <path d="M90 307.5 H145" fill="none" stroke="#587189" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M90 462.5 H145" fill="none" stroke="#587189" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M90 617.5 H145" fill="none" stroke="#587189" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M90 772.5 H145" fill="none" stroke="#587189" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M90 927.5 H145" fill="none" stroke="#587189" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M90 1082.5 H145" fill="none" stroke="#587189" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M90 1237.5 H145" fill="none" stroke="#587189" stroke-width="3" marker-end="url(#arrow)"/>

  <rect x="145" y="250" width="610" height="115" rx="20" fill="#dceef5" stroke="#9aabb8" stroke-width="2.5"/>
  <text class="node" x="450" y="318" text-anchor="middle">Context and information</text>

  <path d="M450 365 V405" fill="none" stroke="#587189" stroke-width="4" marker-end="url(#arrow)"/>
  <rect x="145" y="405" width="610" height="115" rx="20" fill="#dceef5" stroke="#9aabb8" stroke-width="2.5"/>
  <text class="node" x="450" y="473" text-anchor="middle">Notice and interpret</text>

  <path d="M450 520 V560" fill="none" stroke="#587189" stroke-width="4" marker-end="url(#arrow)"/>
  <rect x="145" y="560" width="610" height="115" rx="20" fill="#dceef5" stroke="#9aabb8" stroke-width="2.5"/>
  <text class="node" x="450" y="628" text-anchor="middle">Construct options</text>

  <path d="M450 675 V715" fill="none" stroke="#587189" stroke-width="4" marker-end="url(#arrow)"/>
  <rect x="145" y="715" width="610" height="115" rx="20" fill="#dceef5" stroke="#9aabb8" stroke-width="2.5"/>
  <text class="node" x="450" y="783" text-anchor="middle">Predict</text>

  <path d="M450 830 V870" fill="none" stroke="#587189" stroke-width="4" marker-end="url(#arrow)"/>
  <rect x="145" y="870" width="610" height="115" rx="20" fill="#dceef5" stroke="#9aabb8" stroke-width="2.5"/>
  <text class="node" x="450" y="938" text-anchor="middle">Value</text>

  <path d="M450 985 V1025" fill="none" stroke="#587189" stroke-width="4" marker-end="url(#arrow)"/>
  <rect x="145" y="1025" width="610" height="115" rx="20" fill="#dceef5" stroke="#9aabb8" stroke-width="2.5"/>
  <text class="node" x="450" y="1093" text-anchor="middle">Choose, commit, and act</text>

  <path d="M450 1140 V1180" fill="none" stroke="#587189" stroke-width="4" marker-end="url(#arrow)"/>
  <rect x="145" y="1180" width="610" height="115" rx="20" fill="#dceef5" stroke="#9aabb8" stroke-width="2.5"/>
  <text class="node" x="450" y="1248" text-anchor="middle">Observe and learn</text>

  <path d="M450 1295 V1375 H775 V307.5 H755" fill="none" stroke="#587189" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
  <text class="small" x="450" y="1428" text-anchor="middle">Feedback can revise the model, the environment, or both.</text>
  <text class="small" x="450" y="1480" text-anchor="middle">The functions can overlap, repeat, or be skipped.</text>
</svg>

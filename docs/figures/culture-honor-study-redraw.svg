<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">An insult produced different cortisol responses in one culture-of-honor experiment</title>
  <desc id="desc">An original line chart redraws percentage changes in cortisol for northern and southern White male University of Michigan students in control and insult conditions. A boundary panel emphasizes the restricted sample, historical setting, and non-diagnostic use of the study.</desc>
  <rect width="1200" height="700" fill="#ffffff"/>
  <text x="600" y="48" text-anchor="middle" font-family="Arial, sans-serif" font-size="33" font-weight="700" fill="#17324d">The same insult can carry different learned stakes</text>
  <text x="600" y="80" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#66737f">Original redraw of one response measure in Cohen et al. (1996), Experiment 2</text>

  <rect x="45" y="112" width="700" height="520" rx="18" fill="#f7fafc" stroke="#c8d7e2" stroke-width="2"/>
  <text x="395" y="151" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#17324d">Percentage change in cortisol level</text>
  <line x1="135" y1="520" x2="690" y2="520" stroke="#8fa0ad" stroke-width="2"/>
  <line x1="135" y1="210" x2="135" y2="520" stroke="#8fa0ad" stroke-width="2"/>
  <g font-family="Arial, sans-serif" font-size="14" fill="#66737f">
    <line x1="135" y1="463.6" x2="690" y2="463.6" stroke="#dce5ea"/><text x="121" y="468.6" text-anchor="end">40%</text>
    <line x1="135" y1="407.3" x2="690" y2="407.3" stroke="#dce5ea"/><text x="121" y="412.3" text-anchor="end">50%</text>
    <line x1="135" y1="350.9" x2="690" y2="350.9" stroke="#dce5ea"/><text x="121" y="355.9" text-anchor="end">60%</text>
    <line x1="135" y1="294.5" x2="690" y2="294.5" stroke="#dce5ea"/><text x="121" y="299.5" text-anchor="end">70%</text>
    <line x1="135" y1="238.2" x2="690" y2="238.2" stroke="#dce5ea"/><text x="121" y="243.2" text-anchor="end">80%</text>
  </g>
  <text x="265" y="558" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#17324d">Control</text>
  <text x="565" y="558" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#17324d">Insult</text>
  <path d="M265 452.4 L565 243.8" fill="none" stroke="#a74343" stroke-width="6"/>
  <circle cx="265" cy="452.4" r="9" fill="#a74343"/><circle cx="565" cy="243.8" r="9" fill="#a74343"/>
  <text x="245" y="436" text-anchor="end" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#a74343">42%</text>
  <text x="585" y="233" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#a74343">79%</text>
  <path d="M265 469.3 L565 503.1" fill="none" stroke="#447c55" stroke-width="6"/>
  <circle cx="265" cy="469.3" r="9" fill="#447c55"/><circle cx="565" cy="503.1" r="9" fill="#447c55"/>
  <text x="245" y="492" text-anchor="end" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#447c55">39%</text>
  <text x="585" y="508" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#447c55">33%</text>
  <rect x="235" y="576" width="22" height="7" fill="#a74343"/><text x="270" y="586" font-family="Arial, sans-serif" font-size="16" fill="#17324d">participants raised in the U.S. South</text>
  <rect x="235" y="608" width="22" height="7" fill="#447c55"/><text x="270" y="618" font-family="Arial, sans-serif" font-size="16" fill="#17324d">participants raised in the U.S. North</text>

  <rect x="775" y="112" width="380" height="520" rx="18" fill="#f7f1e8" stroke="#c56a2d" stroke-width="2"/>
  <text x="965" y="157" text-anchor="middle" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#17324d">Read the scope with the result</text>
  <rect x="815" y="190" width="300" height="130" rx="14" fill="#edf4ed" stroke="#447c55" stroke-width="2"/>
  <text x="965" y="226" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#17324d">The proposed mechanism</text>
  <text x="965" y="256" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#66737f">An insult threatened reputation more</text>
  <text x="965" y="280" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#66737f">where honor norms made backing down</text>
  <text x="965" y="304" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#66737f">socially costly.</text>
  <text x="965" y="370" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#a74343">Do not turn this into a trait</text>
  <text x="965" y="405" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#17324d">The sample was White male students</text>
  <text x="965" y="430" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#17324d">at one U.S. university in the 1990s.</text>
  <text x="965" y="471" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#17324d">Region, person, role, generation, and</text>
  <text x="965" y="496" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#17324d">situation overlap and change.</text>
  <rect x="815" y="535" width="300" height="58" rx="12" fill="#ffffff" stroke="#2f6f9f" stroke-width="2"/>
  <text x="965" y="559" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#17324d">Use culture to ask what is at stake,</text>
  <text x="965" y="581" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#17324d">not to diagnose a person.</text>
  <text x="600" y="676" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#66737f">Data source: Cohen, Nisbett, Bowdle, &amp; Schwarz (1996). Graphic design and annotations are original to this book.</text>
</svg>

<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="750" height="440" viewBox="15 160 750 440" role="img" aria-labelledby="title desc">
  <title id="title">An insult produced different cortisol responses in one culture-of-honor experiment</title>
  <desc id="desc">An original grouped bar chart redraws between-subject mean percentage changes in cortisol for northern and southern White male University of Michigan students in control and insult conditions. Regional upbringing was measured rather than randomized, while insult assignment was randomized. The plot combines public and private insult conditions; the caption and nearby text report the design and sample limits.</desc>
  <rect width="1200" height="700" fill="#ffffff"/>
  <rect x="45" y="185" width="700" height="405" rx="18" fill="#f7fafc" stroke="#c8d7e2" stroke-width="2"/>
  <text x="40" y="365" transform="rotate(-90 40 365)" text-anchor="middle" font-family="Arial, sans-serif" font-size="26" fill="#17324d">Cortisol change (%)</text>
  <line x1="135" y1="520" x2="690" y2="520" stroke="#8fa0ad" stroke-width="2"/>
  <line x1="135" y1="210" x2="135" y2="520" stroke="#8fa0ad" stroke-width="2"/>
  <g font-family="Arial, sans-serif" font-size="26" fill="#66737f">
    <line x1="135" y1="520" x2="690" y2="520" stroke="#dce5ea"/><text x="121" y="525" text-anchor="end">0%</text>
    <line x1="135" y1="451.1" x2="690" y2="451.1" stroke="#dce5ea"/><text x="121" y="456.1" text-anchor="end">20%</text>
    <line x1="135" y1="382.2" x2="690" y2="382.2" stroke="#dce5ea"/><text x="121" y="387.2" text-anchor="end">40%</text>
    <line x1="135" y1="313.3" x2="690" y2="313.3" stroke="#dce5ea"/><text x="121" y="318.3" text-anchor="end">60%</text>
    <line x1="135" y1="244.4" x2="690" y2="244.4" stroke="#dce5ea"/><text x="121" y="249.4" text-anchor="end">80%</text>
  </g>
  <rect x="185" y="375.3" width="72" height="144.7" rx="5" fill="#d98989"/>
  <rect x="285" y="247.9" width="72" height="272.1" rx="5" fill="#a74343"/>
  <rect x="465" y="385.7" width="72" height="134.3" rx="5" fill="#87b493"/>
  <rect x="565" y="406.3" width="72" height="113.7" rx="5" fill="#447c55"/>
  <g font-family="Arial, sans-serif" font-size="26" font-weight="700" text-anchor="middle">
    <text x="221" y="365" fill="#a74343">42%</text><text x="321" y="238" fill="#a74343">79%</text>
    <text x="501" y="376" fill="#447c55">39%</text><text x="601" y="397" fill="#447c55">33%</text>
  </g>
  <g font-family="Arial, sans-serif" font-size="26" fill="#66737f" text-anchor="middle">
    <text x="221" y="542">Control</text><text x="321" y="542">Insult</text>
    <text x="501" y="542">Control</text><text x="601" y="542">Insult</text>
  </g>
  <text x="271" y="576" text-anchor="middle" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="#a74343">U.S. South</text>
  <text x="551" y="576" text-anchor="middle" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="#447c55">U.S. North</text>

</svg>

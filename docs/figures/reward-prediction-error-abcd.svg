 <title id="title">Reward prediction error: panels A–D</title><desc id="desc">A cue that does not yet predict reward elicits no learned reward response in panel A; an unexpected reward elicits a burst. Later panels show a learned cue, reward omission and unexpected delay. Curves show schematic neuronal firing changes around baseline, not absolute dopamine levels.</desc><metadata>

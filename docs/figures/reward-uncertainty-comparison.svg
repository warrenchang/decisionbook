 <title id="title">Certain and uncertain rewards</title><desc id="desc">The solid teal curve represents certain reward. The dashed orange curve shows shared anticipation under fifty-percent reward probability. At the outcome, the blue dashed branch rises for reward received and the orange dashed branch falls for reward omitted. Curves are schematic neuronal firing changes around baseline.</desc><metadata>

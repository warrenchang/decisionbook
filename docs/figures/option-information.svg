<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" baseProfile="full" height="650" version="1.1" viewBox="0 0 1200 650" width="1200">
  <defs />
  <title>Option generation, opportunity cost, and value of information</title>
  <desc>Better decisions expand the feasible set, identify the best forgone alternative, seek information only when it could change action, and test whether the choice survives plausible assumptions.</desc>
  <rect fill="white" height="650" width="1200" x="0" y="0" />
  <text fill="#17324d" font-family="Arial, sans-serif" font-size="34" font-weight="bold" text-anchor="middle" x="600" y="48">Better choices begin before comparison</text>
  <rect fill="#eaf3f8" height="125" rx="16" ry="16" stroke="#2f6f9f" stroke-width="3" width="230" x="50" y="230" />
  <text fill="#17324d" font-family="Arial, sans-serif" font-size="26" font-weight="bold" text-anchor="middle" x="165" y="261.1"><tspan x="165" dy="0">Expand the</tspan><tspan x="165" dy="30.68">feasible set</tspan></text>
  <text fill="#66737f" font-family="Arial, sans-serif" font-size="17" font-weight="normal" text-anchor="middle" x="165" y="319.9"><tspan x="165" dy="0">generate • combine •</tspan><tspan x="165" dy="20.06">negotiate</tspan></text>
  <rect fill="#eaf3f8" height="125" rx="16" ry="16" stroke="#2f6f9f" stroke-width="3" width="230" x="330" y="230" />
  <text fill="#17324d" font-family="Arial, sans-serif" font-size="26" font-weight="bold" text-anchor="middle" x="445" y="271.13"><tspan x="445" dy="0">Name the best</tspan><tspan x="445" dy="30.68">forgone option</tspan></text>
  <text fill="#66737f" font-family="Arial, sans-serif" font-size="17" font-weight="normal" text-anchor="middle" x="445" y="329.93"><tspan x="445" dy="0">opportunity cost</tspan></text>
  <rect fill="#f7f1e8" height="125" rx="16" ry="16" stroke="#c56a2d" stroke-width="3" width="230" x="610" y="230" />
  <text fill="#17324d" font-family="Arial, sans-serif" font-size="23.76" font-weight="bold" text-anchor="middle" x="725" y="258.956"><tspan x="725" dy="0">Ask what could</tspan><tspan x="725" dy="28.0338">change the</tspan><tspan x="725" dy="28.0338">choice</tspan></text>
  <text fill="#66737f" font-family="Arial, sans-serif" font-size="15.53" font-weight="normal" text-anchor="middle" x="725" y="341.15"><tspan x="725" dy="0">value of information</tspan></text>
  <rect fill="#f7f1e8" height="125" rx="16" ry="16" stroke="#c56a2d" stroke-width="3" width="230" x="890" y="230" />
  <text fill="#17324d" font-family="Arial, sans-serif" font-size="26" font-weight="bold" text-anchor="middle" x="1005" y="261.1"><tspan x="1005" dy="0">Stress-test</tspan><tspan x="1005" dy="30.68">the ranking</tspan></text>
  <text fill="#66737f" font-family="Arial, sans-serif" font-size="17" font-weight="normal" text-anchor="middle" x="1005" y="319.9"><tspan x="1005" dy="0">sensitivity +</tspan><tspan x="1005" dy="20.06">reversibility</tspan></text>
  <line stroke="#17324d" stroke-width="4" x1="280" x2="330" y1="292" y2="292" />
  <polygon fill="#17324d" points="330,292 317.0096189432334,299.5 317.0096189432334,284.5" />
  <line stroke="#17324d" stroke-width="4" x1="560" x2="610" y1="292" y2="292" />
  <polygon fill="#17324d" points="610,292 597.0096189432334,299.5 597.0096189432334,284.5" />
  <line stroke="#17324d" stroke-width="4" x1="840" x2="890" y1="292" y2="292" />
  <polygon fill="#17324d" points="890,292 877.0096189432334,299.5 877.0096189432334,284.5" />
  <text fill="#17324d" font-family="Arial, sans-serif" font-size="23" font-weight="normal" text-anchor="middle" x="600" y="470">The “best” calculation cannot rescue a menu that omitted the best feasible option.</text>
  <text fill="#66737f" font-family="Arial, sans-serif" font-size="21" font-weight="normal" text-anchor="middle" x="600" y="530">Information is valuable only when it can change action enough to justify its cost.</text>
</svg>
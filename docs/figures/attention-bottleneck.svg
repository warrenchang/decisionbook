<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">The attention bottleneck</title>
  <desc id="desc">A very wide stream of sensory input narrows through attention into a much smaller stream of conscious report and action.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="12" markerHeight="12" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#183047"/>
    </marker>
  </defs>
  <rect width="1600" height="900" fill="#ffffff"/>
  <text x="800" y="92" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="62" font-weight="700" fill="#183047">The attention bottleneck</text>
  <text x="800" y="145" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="28" fill="#687887">The senses sample far more information than deliberate behavior can express.</text>

  <rect x="110" y="278" width="380" height="300" rx="28" fill="#e8f2f8" stroke="#2f73a5" stroke-width="6"/>
  <text x="300" y="354" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="42" font-weight="700" fill="#183047">Sensory systems</text>
  <text x="300" y="430" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="70" font-weight="700" fill="#2f73a5">~10⁹ bits/s</text>
  <text x="300" y="492" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="29" fill="#687887">parallel, high-dimensional</text>
  <text x="300" y="532" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="29" fill="#687887">signals from the senses</text>

  <path d="M 490 428 L 690 428" fill="none" stroke="#183047" stroke-width="8" marker-end="url(#arrow)"/>

  <path d="M 690 258 L 900 345 L 900 511 L 690 598 Z" fill="#f7efe4" stroke="#c76b29" stroke-width="7"/>
  <text x="785" y="388" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="44" font-weight="700" fill="#183047">Attention</text>
  <text x="785" y="440" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="29" fill="#687887">goals</text>
  <text x="785" y="478" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="29" fill="#687887">salience</text>
  <text x="785" y="516" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="29" fill="#687887">precision</text>

  <path d="M 900 428 L 1100 428" fill="none" stroke="#183047" stroke-width="8" marker-end="url(#arrow)"/>

  <rect x="1100" y="278" width="390" height="300" rx="28" fill="#edf5ee" stroke="#2b8078" stroke-width="6"/>
  <text x="1295" y="344" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="39" font-weight="700" fill="#183047">Conscious report</text>
  <text x="1295" y="392" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="39" font-weight="700" fill="#183047">and action</text>
  <text x="1295" y="470" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="70" font-weight="700" fill="#2b8078">~10 bits/s</text>
  <text x="1295" y="526" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="29" fill="#687887">serial, selected control</text>

  <rect x="250" y="650" width="1100" height="166" rx="24" fill="#f7f9fc" stroke="#b9c6d1" stroke-width="3"/>
  <text x="800" y="699" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="700" fill="#183047">The contrast is an order-of-magnitude estimate,</text>
  <text x="800" y="737" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="700" fill="#183047">not a literal count of everything the brain computes.</text>
  <text x="800" y="783" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="27" fill="#687887">If information is not selected, it cannot guide deliberate judgment.</text>
</svg>

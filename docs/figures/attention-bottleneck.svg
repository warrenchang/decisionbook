<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Sensory acquisition and deliberate behavior have different estimated information rates</title>
  <desc id="desc">Two separate cards compare an order-of-magnitude estimate of sensory acquisition with an estimate of deliberate behavioral throughput. No funnel connects them. A central caution says these are unlike channels and do not directly measure attention. A lower panel states the separate evidence-based role of attention in prioritizing information.</desc>
  <rect width="1600" height="900" fill="#ffffff"/>
  <rect x="2" y="2" width="1596" height="896" rx="32" fill="none" stroke="#d5e1ea" stroke-width="4"/>

  <text x="800" y="82" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="56" font-weight="700" fill="#183047">Two information rates—not one measured funnel</text>
  <text x="800" y="132" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="27" fill="#607285">The estimates describe unlike channels and cannot by themselves identify attention as the bottleneck.</text>

  <rect x="100" y="215" width="545" height="330" rx="30" fill="#e8f2f8" stroke="#2f73a5" stroke-width="6"/>
  <text x="372" y="285" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="39" font-weight="700" fill="#183047">SENSORY ACQUISITION</text>
  <text x="372" y="385" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="76" font-weight="700" fill="#2f73a5">~10⁹ bits/s</text>
  <text x="372" y="445" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="29" fill="#4f6477">Parallel physical signals estimated</text>
  <text x="372" y="485" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="29" fill="#4f6477">across multiple sensory systems</text>

  <rect x="955" y="215" width="545" height="330" rx="30" fill="#edf5ee" stroke="#2b8078" stroke-width="6"/>
  <text x="1227" y="285" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="39" font-weight="700" fill="#183047">DELIBERATE BEHAVIOR</text>
  <text x="1227" y="385" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="76" font-weight="700" fill="#2b8078">~10 bits/s</text>
  <text x="1227" y="445" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="29" fill="#4f6477">Serial throughput estimated from</text>
  <text x="1227" y="485" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="29" fill="#4f6477">human task performance and output</text>

  <rect x="675" y="270" width="250" height="220" rx="26" fill="#fff5ec" stroke="#c76b29" stroke-width="5"/>
  <text x="800" y="322" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="31" font-weight="700" fill="#914c20">CAUTION</text>
  <text x="800" y="372" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="25" fill="#53677a">Not the same</text>
  <text x="800" y="406" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="25" fill="#53677a">measurement</text>
  <text x="800" y="451" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#786556">Do not subtract</text>
  <text x="800" y="480" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#786556">as “lost bits”</text>

  <rect x="165" y="620" width="1270" height="175" rx="28" fill="#f7f9fc" stroke="#b9c9d6" stroke-width="4"/>
  <text x="800" y="675" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="31" font-weight="700" fill="#183047">What attention research supports separately</text>
  <text x="800" y="728" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="28" fill="#4f6477">Goals, salience, expectations, and task demand bias which signals are prioritized,</text>
  <text x="800" y="769" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="28" fill="#4f6477">enhanced, suppressed, and made available for report and action.</text>

  <text x="800" y="853" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#687887">Rates are broad order-of-magnitude estimates from Zheng and Meister (2025), not a direct input–output calculation.</text>
</svg>

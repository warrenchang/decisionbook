<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="800" height="990" viewBox="0 0 800 990" role="img" aria-labelledby="title desc">
  <title id="title">Prediction informs; people govern</title>
  <desc id="desc">Author's prescriptive decision architecture, not an empirical result. Humans set goals, rights, and prediction targets upstream. Prediction asks what may happen, with AI estimates validated for the task. A separate valuation branch asks what matters, with humans responsible for value judgments. Comparing feasible actions combines causal evidence with agreed values. A human authority then chooses, explains, and takes responsibility. Outcomes, errors, harms, and change are reviewed. The arrows denote information and authority in this proposed workflow; they are not claims that baseline prediction establishes causal effects.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 9 8" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0.5 0.5 L8 4 L0.5 7.5 Z" fill="#526778"/>
    </marker>
  </defs>
  <rect width="800" height="990" fill="white"/>
<text x="400" y="46" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="36" font-weight="700" fill="#17324d">Prediction informs; people govern</text>
<g id="human-mandate">
<rect x="140" y="80" width="520" height="120" rx="18" fill="#f0f5ef" stroke="#447c55" stroke-width="2"/>
<text x="400" y="128" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="700" fill="#447c55">Human mandate</text>
<text x="400" y="169" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="400" fill="#17324d">Goals, rights, prediction targets</text>
</g>
<path d="M400 200 V228" fill="none" stroke="#526778" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M400 228 H210 V260" fill="none" stroke="#526778" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M400 228 H590 V260" fill="none" stroke="#526778" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<g id="prediction">
<rect x="40" y="260" width="340" height="158" rx="18" fill="#edf4f8" stroke="#2f6f9f" stroke-width="2"/>
<text x="210" y="307" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="700" fill="#2f6f9f">Prediction</text>
<text x="210" y="350" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="400" fill="#17324d">What may happen?</text>
<text x="210" y="391" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="400" fill="#17324d">Validated AI estimates</text>
</g>
<g id="valuation">
<rect x="420" y="260" width="340" height="158" rx="18" fill="#f0f5ef" stroke="#447c55" stroke-width="2"/>
<text x="590" y="307" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="700" fill="#447c55">Valuation</text>
<text x="590" y="350" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="400" fill="#17324d">What matters?</text>
<text x="590" y="391" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="400" fill="#17324d">Human value judgments</text>
</g>
<path d="M210 418 V450 H400" fill="none" stroke="#526778" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M590 418 V450 H400" fill="none" stroke="#526778" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M400 450 V482" fill="none" stroke="#526778" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<g id="compare-actions">
<rect x="120" y="482" width="560" height="120" rx="18" fill="#edf4f8" stroke="#2f6f9f" stroke-width="2"/>
<text x="400" y="530" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="700" fill="#17324d">Compare feasible actions</text>
<text x="400" y="571" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="400" fill="#17324d">Causal evidence + agreed values</text>
</g>
<path d="M400 602 V662" fill="none" stroke="#526778" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<g id="human-authorization">
<rect x="140" y="662" width="520" height="120" rx="18" fill="#f0f5ef" stroke="#447c55" stroke-width="2"/>
<text x="400" y="710" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="700" fill="#447c55">Human authorization</text>
<text x="400" y="751" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="400" fill="#17324d">Choose, explain, take responsibility</text>
</g>
<path d="M400 782 V842" fill="none" stroke="#526778" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<g id="review-outcomes">
<rect x="140" y="842" width="520" height="120" rx="18" fill="#fbf2e9" stroke="#c56a2d" stroke-width="2"/>
<text x="400" y="890" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="700" fill="#c56a2d">Review outcomes</text>
<text x="400" y="931" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="400" fill="#17324d">Check errors, harms, and change</text>
</g>
</svg>

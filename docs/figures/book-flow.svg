<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" baseProfile="full" height="720" version="1.1" viewBox="0 0 1200 720" width="1200">
  <defs />
  <title>Reading map for the textbook</title>
  <desc>Seven parts move from the architecture of individual choice through uncertainty, habit, social influence, persuasion and communication, negotiation, and better decision systems.</desc>
  <rect fill="white" height="720" width="1200" x="0" y="0" />
  <text fill="#17324d" font-family="Arial, sans-serif" font-size="32" font-weight="bold" text-anchor="middle" x="600" y="48">A reading map: from private judgment to joint decision systems</text>
  <rect fill="#eaf3f8" height="105" rx="16" ry="16" stroke="#2f6f9f" stroke-width="3" width="210" x="70" y="125" />
  <text fill="#17324d" font-family="Arial, sans-serif" font-size="26" font-weight="bold" text-anchor="middle" x="175" y="161.44"><tspan x="175" dy="0">Part 1</tspan></text>
  <text fill="#66737f" font-family="Arial, sans-serif" font-size="17" font-weight="normal" text-anchor="middle" x="175" y="189.56"><tspan x="175" dy="0">Architecture of</tspan><tspan x="175" dy="20.06">choice</tspan></text>
  <rect fill="#f7f1e8" height="105" rx="16" ry="16" stroke="#c56a2d" stroke-width="3" width="210" x="355" y="125" />
  <text fill="#17324d" font-family="Arial, sans-serif" font-size="26" font-weight="bold" text-anchor="middle" x="460" y="161.44"><tspan x="460" dy="0">Part 2</tspan></text>
  <text fill="#66737f" font-family="Arial, sans-serif" font-size="17" font-weight="normal" text-anchor="middle" x="460" y="189.56"><tspan x="460" dy="0">Uncertainty +</tspan><tspan x="460" dy="20.06">context</tspan></text>
  <rect fill="#edf4ed" height="105" rx="16" ry="16" stroke="#447c55" stroke-width="3" width="210" x="640" y="125" />
  <text fill="#17324d" font-family="Arial, sans-serif" font-size="26" font-weight="bold" text-anchor="middle" x="745" y="171.47"><tspan x="745" dy="0">Part 3</tspan></text>
  <text fill="#66737f" font-family="Arial, sans-serif" font-size="17" font-weight="normal" text-anchor="middle" x="745" y="199.59"><tspan x="745" dy="0">Stories + habits</tspan></text>
  <rect fill="#f5ebf5" height="105" rx="16" ry="16" stroke="#795a8a" stroke-width="3" width="210" x="925" y="125" />
  <text fill="#17324d" font-family="Arial, sans-serif" font-size="26" font-weight="bold" text-anchor="middle" x="1030" y="171.47"><tspan x="1030" dy="0">Part 4</tspan></text>
  <text fill="#66737f" font-family="Arial, sans-serif" font-size="17" font-weight="normal" text-anchor="middle" x="1030" y="199.59"><tspan x="1030" dy="0">The social mind</tspan></text>
  <rect fill="#eaf3f8" height="105" rx="16" ry="16" stroke="#2f6f9f" stroke-width="3" width="210" x="210" y="390" />
  <text fill="#17324d" font-family="Arial, sans-serif" font-size="26" font-weight="bold" text-anchor="middle" x="315" y="426.44"><tspan x="315" dy="0">Part 5</tspan></text>
  <text fill="#66737f" font-family="Arial, sans-serif" font-size="17" font-weight="normal" text-anchor="middle" x="315" y="454.56"><tspan x="315" dy="0">Persuasion +</tspan><tspan x="315" dy="20.06">connection</tspan></text>
  <rect fill="#f7f1e8" height="105" rx="16" ry="16" stroke="#c56a2d" stroke-width="3" width="210" x="495" y="390" />
  <text fill="#17324d" font-family="Arial, sans-serif" font-size="26" font-weight="bold" text-anchor="middle" x="600" y="436.47"><tspan x="600" dy="0">Part 6</tspan></text>
  <text fill="#66737f" font-family="Arial, sans-serif" font-size="17" font-weight="normal" text-anchor="middle" x="600" y="464.59"><tspan x="600" dy="0">Negotiation</tspan></text>
  <rect fill="#edf4ed" height="105" rx="16" ry="16" stroke="#447c55" stroke-width="3" width="210" x="780" y="390" />
  <text fill="#17324d" font-family="Arial, sans-serif" font-size="26" font-weight="bold" text-anchor="middle" x="885" y="426.44"><tspan x="885" dy="0">Part 7</tspan></text>
  <text fill="#66737f" font-family="Arial, sans-serif" font-size="17" font-weight="normal" text-anchor="middle" x="885" y="454.56"><tspan x="885" dy="0">Better decision</tspan><tspan x="885" dy="20.06">systems</tspan></text>
  <line stroke="#2b7a78" stroke-width="3" x1="280" x2="355" y1="178" y2="178" />
  <polygon fill="#2b7a78" points="355,178 342.0096189432334,185.5 342.0096189432334,170.5" />
  <line stroke="#2b7a78" stroke-width="3" x1="565" x2="640" y1="178" y2="178" />
  <polygon fill="#2b7a78" points="640,178 627.0096189432334,185.5 627.0096189432334,170.5" />
  <line stroke="#2b7a78" stroke-width="3" x1="850" x2="925" y1="178" y2="178" />
  <polygon fill="#2b7a78" points="925,178 912.0096189432334,185.5 912.0096189432334,170.5" />
  <line stroke="#2b7a78" stroke-width="3" x1="1030" x2="315" y1="230" y2="390" />
  <polygon fill="#2b7a78" points="315,390 326.0390411317867,379.8442345984795 329.3146713984852,394.48220735278835" />
  <line stroke="#2b7a78" stroke-width="3" x1="420" x2="495" y1="442" y2="442" />
  <polygon fill="#2b7a78" points="495,442 482.0096189432334,449.5 482.0096189432334,434.5" />
  <line stroke="#2b7a78" stroke-width="3" x1="705" x2="780" y1="442" y2="442" />
  <polygon fill="#2b7a78" points="780,442 767.0096189432334,449.5 767.0096189432334,434.5" />
  <text fill="#17324d" font-family="Arial, sans-serif" font-size="19" font-weight="normal" text-anchor="middle" x="600" y="606"><tspan x="600" dy="0">Each part changes the question: What happened? → What is likely? → What matters?</tspan><tspan x="600" dy="28">Whose mind enters? → How do we update together?</tspan></text>
</svg>

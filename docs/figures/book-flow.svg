<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg" height="720" viewBox="0 0 1200 720" width="1200">
  <title>The book's ten-part reading journey</title>
  <desc>Ten connected parts move from the decision process through attention, judgment, risk, money, social interaction, persuasion, communication, negotiation, and accountable decision design.</desc>
  <rect fill="#ffffff" height="720" width="1200"/>
  <text x="600" y="48" text-anchor="middle" fill="#17324d" font-family="Arial, sans-serif" font-size="30" font-weight="700">From private judgment to joint action and accountable design</text>
  <text x="35" y="96" fill="#66737f" font-family="Arial, sans-serif" font-size="15" font-weight="700" letter-spacing="1.4">UNDERSTAND THE DECISION-MAKER</text>

  <g font-family="Arial, sans-serif" text-anchor="middle">
    <rect x="35" y="120" width="200" height="95" rx="14" fill="#eaf3f8" stroke="#2f6f9f" stroke-width="2.5"/>
    <text x="135" y="151" fill="#17324d" font-size="20" font-weight="700">Part I</text>
    <text x="135" y="180" fill="#526474" font-size="15"><tspan x="135">Decision</tspan><tspan x="135" dy="18">process</tspan></text>

    <rect x="265" y="120" width="200" height="95" rx="14" fill="#f7f1e8" stroke="#c56a2d" stroke-width="2.5"/>
    <text x="365" y="151" fill="#17324d" font-size="20" font-weight="700">Part II</text>
    <text x="365" y="180" fill="#526474" font-size="15"><tspan x="365">Attention +</tspan><tspan x="365" dy="18">prediction</tspan></text>

    <rect x="495" y="120" width="200" height="95" rx="14" fill="#edf4ed" stroke="#447c55" stroke-width="2.5"/>
    <text x="595" y="151" fill="#17324d" font-size="20" font-weight="700">Part III</text>
    <text x="595" y="180" fill="#526474" font-size="15"><tspan x="595">Heuristics +</tspan><tspan x="595" dy="18">probability</tspan></text>

    <rect x="725" y="120" width="200" height="95" rx="14" fill="#f5ebf5" stroke="#795a8a" stroke-width="2.5"/>
    <text x="825" y="151" fill="#17324d" font-size="20" font-weight="700">Part IV</text>
    <text x="825" y="180" fill="#526474" font-size="15"><tspan x="825">Risk +</tspan><tspan x="825" dy="18">self-control</tspan></text>

    <rect x="955" y="120" width="200" height="95" rx="14" fill="#eaf3f8" stroke="#2f6f9f" stroke-width="2.5"/>
    <text x="1055" y="151" fill="#17324d" font-size="20" font-weight="700">Part V</text>
    <text x="1055" y="180" fill="#526474" font-size="15"><tspan x="1055">Money +</tspan><tspan x="1055" dy="18">well-being</tspan></text>

    <text x="35" y="356" text-anchor="start" fill="#66737f" font-size="15" font-weight="700" letter-spacing="1.4">UNDERSTAND AND DESIGN INTERACTION</text>

    <rect x="35" y="380" width="200" height="95" rx="14" fill="#f7f1e8" stroke="#c56a2d" stroke-width="2.5"/>
    <text x="135" y="411" fill="#17324d" font-size="20" font-weight="700">Part VI</text>
    <text x="135" y="440" fill="#526474" font-size="15"><tspan x="135">Strategy +</tspan><tspan x="135" dy="18">society</tspan></text>

    <rect x="265" y="380" width="200" height="95" rx="14" fill="#edf4ed" stroke="#447c55" stroke-width="2.5"/>
    <text x="365" y="411" fill="#17324d" font-size="20" font-weight="700">Part VII</text>
    <text x="365" y="440" fill="#526474" font-size="15"><tspan x="365">Influence +</tspan><tspan x="365" dy="18">persuasion</tspan></text>

    <rect x="495" y="380" width="200" height="95" rx="14" fill="#f5ebf5" stroke="#795a8a" stroke-width="2.5"/>
    <text x="595" y="411" fill="#17324d" font-size="20" font-weight="700">Part VIII</text>
    <text x="595" y="449" fill="#526474" font-size="15">Communication</text>

    <rect x="725" y="380" width="200" height="95" rx="14" fill="#eaf3f8" stroke="#2f6f9f" stroke-width="2.5"/>
    <text x="825" y="411" fill="#17324d" font-size="20" font-weight="700">Part IX</text>
    <text x="825" y="449" fill="#526474" font-size="15">Negotiation</text>

    <rect x="955" y="380" width="200" height="95" rx="14" fill="#f7f1e8" stroke="#c56a2d" stroke-width="2.5"/>
    <text x="1055" y="411" fill="#17324d" font-size="20" font-weight="700">Part X</text>
    <text x="1055" y="440" fill="#526474" font-size="15"><tspan x="1055">Decision</tspan><tspan x="1055" dy="18">design</tspan></text>
  </g>

  <g fill="#2b7a78" stroke="#2b7a78" stroke-width="3">
    <line x1="235" y1="168" x2="265" y2="168"/><polygon stroke="none" points="265,168 253,175 253,161"/>
    <line x1="465" y1="168" x2="495" y2="168"/><polygon stroke="none" points="495,168 483,175 483,161"/>
    <line x1="695" y1="168" x2="725" y2="168"/><polygon stroke="none" points="725,168 713,175 713,161"/>
    <line x1="925" y1="168" x2="955" y2="168"/><polygon stroke="none" points="955,168 943,175 943,161"/>
    <path d="M1055 215 V285 H135 V380" fill="none"/><polygon stroke="none" points="135,380 127,366 143,366"/>
    <line x1="235" y1="428" x2="265" y2="428"/><polygon stroke="none" points="265,428 253,435 253,421"/>
    <line x1="465" y1="428" x2="495" y2="428"/><polygon stroke="none" points="495,428 483,435 483,421"/>
    <line x1="695" y1="428" x2="725" y2="428"/><polygon stroke="none" points="725,428 713,435 713,421"/>
    <line x1="925" y1="428" x2="955" y2="428"/><polygon stroke="none" points="955,428 943,435 943,421"/>
  </g>

  <rect x="120" y="555" width="960" height="84" rx="14" fill="#f7f9fc" stroke="#b7c7d6" stroke-width="1.5"/>
  <text x="600" y="585" text-anchor="middle" fill="#17324d" font-family="Arial, sans-serif" font-size="18" font-weight="700">The question changes as the reader moves downstream</text>
  <text x="600" y="615" text-anchor="middle" fill="#526474" font-family="Arial, sans-serif" font-size="16">What happened? → What is likely? → What matters? → What will others do?</text>
  <text x="600" y="636" text-anchor="middle" fill="#526474" font-family="Arial, sans-serif" font-size="16">How can we understand, agree, act, and learn together?</text>
</svg>

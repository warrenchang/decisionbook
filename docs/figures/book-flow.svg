<?xml version="1.0" encoding="utf-8" ?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink" baseProfile="full" height="720" version="1.1" viewBox="0 0 1200 720" width="1200">
  <defs/>
  <title>Reading map for the textbook</title>
  <desc>Seven parts move from the architecture of individual choice through uncertainty, habit, social influence, persuasion and communication, negotiation, and better decision systems.</desc>
  <rect fill="white" height="720" width="1200" x="0" y="0"/>
  <text fill="#17324d" font-family="Arial, sans-serif" font-size="32" font-weight="bold" text-anchor="middle" x="600" y="48">A reading map: from private judgment to joint decision systems</text>
  <rect fill="#eaf3f8" height="105" rx="16" ry="16" stroke="#2f6f9f" stroke-width="3" width="210" x="70" y="125"/>
  <text fill="#17324d" font-family="Arial, sans-serif" font-size="26" font-weight="bold" text-anchor="middle" x="175.0" y="169.5">Part 1</text>
  <text fill="#66737f" font-family="Arial, sans-serif" font-size="17" font-weight="normal" text-anchor="middle" x="175.0" y="203.5">Architecture of choice</text>
  <rect fill="#f7f1e8" height="105" rx="16" ry="16" stroke="#c56a2d" stroke-width="3" width="210" x="355" y="125"/>
  <text fill="#17324d" font-family="Arial, sans-serif" font-size="26" font-weight="bold" text-anchor="middle" x="460.0" y="169.5">Part 2</text>
  <text fill="#66737f" font-family="Arial, sans-serif" font-size="17" font-weight="normal" text-anchor="middle" x="460.0" y="203.5">Uncertainty + context</text>
  <rect fill="#edf4ed" height="105" rx="16" ry="16" stroke="#447c55" stroke-width="3" width="210" x="640" y="125"/>
  <text fill="#17324d" font-family="Arial, sans-serif" font-size="26" font-weight="bold" text-anchor="middle" x="745.0" y="169.5">Part 3</text>
  <text fill="#66737f" font-family="Arial, sans-serif" font-size="17" font-weight="normal" text-anchor="middle" x="745.0" y="203.5">Stories + habits</text>
  <rect fill="#f5ebf5" height="105" rx="16" ry="16" stroke="#795a8a" stroke-width="3" width="210" x="925" y="125"/>
  <text fill="#17324d" font-family="Arial, sans-serif" font-size="26" font-weight="bold" text-anchor="middle" x="1030.0" y="169.5">Part 4</text>
  <text fill="#66737f" font-family="Arial, sans-serif" font-size="17" font-weight="normal" text-anchor="middle" x="1030.0" y="203.5">The social mind</text>
  <rect fill="#eaf3f8" height="105" rx="16" ry="16" stroke="#2f6f9f" stroke-width="3" width="210" x="210" y="390"/>
  <text fill="#17324d" font-family="Arial, sans-serif" font-size="26" font-weight="bold" text-anchor="middle" x="315.0" y="434.5">Part 5</text>
  <text fill="#66737f" font-family="Arial, sans-serif" font-size="17" font-weight="normal" text-anchor="middle" x="315.0" y="468.5">Persuasion + connection</text>
  <rect fill="#f7f1e8" height="105" rx="16" ry="16" stroke="#c56a2d" stroke-width="3" width="210" x="495" y="390"/>
  <text fill="#17324d" font-family="Arial, sans-serif" font-size="26" font-weight="bold" text-anchor="middle" x="600.0" y="434.5">Part 6</text>
  <text fill="#66737f" font-family="Arial, sans-serif" font-size="17" font-weight="normal" text-anchor="middle" x="600.0" y="468.5">Negotiation</text>
  <rect fill="#edf4ed" height="105" rx="16" ry="16" stroke="#447c55" stroke-width="3" width="210" x="780" y="390"/>
  <text fill="#17324d" font-family="Arial, sans-serif" font-size="26" font-weight="bold" text-anchor="middle" x="885.0" y="434.5">Part 7</text>
  <text fill="#66737f" font-family="Arial, sans-serif" font-size="17" font-weight="normal" text-anchor="middle" x="885.0" y="468.5">Better decision systems</text>

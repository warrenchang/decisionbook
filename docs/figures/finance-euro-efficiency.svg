<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="740" viewBox="0 0 1200 740" role="img" aria-labelledby="title desc">
  <title id="title">The €20 note and three meanings of market efficiency</title>
  <desc id="desc">A stylized teaching note points to three separate claims: rapid information incorporation, no free lunch after risk and costs, and prices equal fundamental value. The first two claims do not imply the third.</desc>
  <defs>
    <marker id="blueArrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0 L12 6 L0 12 Z" fill="#2f6f9f"/></marker>
    <marker id="orangeArrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0 L12 6 L0 12 Z" fill="#c56a2d"/></marker>
    <filter id="shadow"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#17324d" flood-opacity="0.12"/></filter>
  </defs>
  <rect width="1200" height="740" fill="#ffffff"/>
<text x="600" y="48" text-anchor="middle" font-family="Georgia, serif" font-size="33" font-weight="700" fill="#17324d" >The €20 note: three different efficiency claims</text>
<text x="600" y="80" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#66737f" >Finding a reward is not the same as proving that prices are always right.</text>
<rect x="55" y="145" width="365" height="455" rx="26" fill="#ece9f8" stroke="#665b9a" stroke-width="3" filter="url(#shadow)"/>
<circle cx="150" cy="280" r="68" fill="#d9d3f1" stroke="#665b9a" stroke-width="3"/>
<circle cx="325" cy="430" r="54" fill="none" stroke="#8f83bd" stroke-width="12" opacity="0.55"/>
<path d="M85 500 L385 210 M90 545 L390 255" stroke="#b9afd9" stroke-width="14" opacity="0.55"/>
<text x="238" y="355" text-anchor="middle" font-family="Georgia, serif" font-size="104" font-weight="700" fill="#544981" >€20</text>
<text x="238" y="398" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#665b9a" >A REWARD THAT MAY REMAIN</text>
<rect x="80" y="520" width="315" height="48" rx="8" fill="#fff0e9" stroke="#a74343" stroke-width="2" />
<text x="237" y="551" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#a74343" >TEACHING ILLUSTRATION — NOT CURRENCY</text>
<path d="M420 372 L478 372" fill="none" stroke="#2f6f9f" stroke-width="5"/>
<path d="M478 212 L478 552" fill="none" stroke="#2f6f9f" stroke-width="5"/>
<line x1="478" y1="212" x2="516" y2="212" stroke="#2f6f9f" stroke-width="5" marker-end="url(#blueArrow)"/>
<rect x="520" y="145" width="625" height="135" rx="18" fill="#eaf3f8" stroke="#2f6f9f" stroke-width="3" filter="url(#shadow)"/>
<text x="548" y="183" text-anchor="start" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#17324d" >1  INFORMATION MOVES QUICKLY</text>
<text x="548" y="215" text-anchor="start" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#66737f" >A specified signal can enter price</text>
<text x="548" y="239" text-anchor="start" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#66737f" >within a short event window.</text>
<text x="1117" y="261" text-anchor="end" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#2f6f9f" >Speed is an empirical claim.</text>
<line x1="478" y1="382" x2="516" y2="382" stroke="#2f6f9f" stroke-width="5" marker-end="url(#blueArrow)"/>
<rect x="520" y="315" width="625" height="135" rx="18" fill="#edf4ed" stroke="#447c55" stroke-width="3" filter="url(#shadow)"/>
<text x="548" y="353" text-anchor="start" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#17324d" >2  NO FREE LUNCH</text>
<text x="548" y="385" text-anchor="start" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#66737f" >A public rule does not reliably earn</text>
<text x="548" y="409" text-anchor="start" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#66737f" >abnormal return after risk and costs.</text>
<text x="1117" y="431" text-anchor="end" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#447c55" >Search and implementation are costly.</text>
<line x1="478" y1="552" x2="516" y2="552" stroke="#2f6f9f" stroke-width="5" marker-end="url(#blueArrow)"/>
<rect x="520" y="485" width="625" height="135" rx="18" fill="#f7f1e8" stroke="#c56a2d" stroke-width="3" filter="url(#shadow)"/>
<text x="548" y="523" text-anchor="start" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#17324d" >3  THE PRICE IS RIGHT</text>
<text x="548" y="555" text-anchor="start" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#66737f" >Market price equals a well-defined</text>
<text x="548" y="579" text-anchor="start" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#66737f" >fundamental value.</text>
<text x="1117" y="601" text-anchor="end" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#c56a2d" >This is the strongest claim.</text>
<rect x="110" y="650" width="980" height="64" rx="16" fill="#f7fafc" stroke="#c8d7e2" stroke-width="2" />
<text x="600" y="679" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#17324d" >The first two claims do not automatically establish the third.</text>
<text x="600" y="703" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="400" fill="#66737f" >An opportunity may exist because discovering and exploiting it consumes attention, information, capital, and risk-bearing capacity.</text>
</svg>

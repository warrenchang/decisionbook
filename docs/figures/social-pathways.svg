<?xml version="1.0" encoding="utf-8" ?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink" baseProfile="full" height="650" version="1.1" viewBox="0 0 1200 650" width="1200">
  <defs/>
  <title>From private information to a social cascade</title>
  <desc>Private judgments become public actions; observed actions become social evidence; apparent consensus raises the cost of dissent and can produce a cascade. Independent elicitation interrupts the loop.</desc>
  <rect fill="white" height="650" width="1200" x="0" y="0"/>
  <text fill="#17324d" font-family="Arial, sans-serif" font-size="34" font-weight="bold" text-anchor="middle" x="600" y="48">How apparent consensus can manufacture more consensus</text>
  <rect fill="#eaf3f8" height="115" rx="16" ry="16" stroke="#2f6f9f" stroke-width="3" width="220" x="60" y="220"/>
  <text fill="#17324d" font-family="Arial, sans-serif" font-size="26" font-weight="bold" text-anchor="middle" x="170.0" y="269.5">Private signal</text>
  <text fill="#66737f" font-family="Arial, sans-serif" font-size="17" font-weight="normal" text-anchor="middle" x="170.0" y="303.5">what I saw or believe</text>
  <rect fill="#eaf3f8" height="115" rx="16" ry="16" stroke="#2f6f9f" stroke-width="3" width="220" x="320" y="220"/>
  <text fill="#17324d" font-family="Arial, sans-serif" font-size="26" font-weight="bold" text-anchor="middle" x="430.0" y="269.5">Public action</text>
  <text fill="#66737f" font-family="Arial, sans-serif" font-size="17" font-weight="normal" text-anchor="middle" x="430.0" y="303.5">what others can observe</text>
  <rect fill="#f7f1e8" height="115" rx="16" ry="16" stroke="#c56a2d" stroke-width="3" width="220" x="580" y="220"/>
  <text fill="#17324d" font-family="Arial, sans-serif" font-size="26" font-weight="bold" text-anchor="middle" x="690.0" y="269.5">Social evidence</text>
  <text fill="#66737f" font-family="Arial, sans-serif" font-size="17" font-weight="normal" text-anchor="middle" x="690.0" y="303.5">“they may know more”</text>
  <rect fill="#f7f1e8" height="115" rx="16" ry="16" stroke="#c56a2d" stroke-width="3" width="220" x="840" y="220"/>
  <text fill="#17324d" font-family="Arial, sans-serif" font-size="26" font-weight="bold" text-anchor="middle" x="950.0" y="269.5">Dissent cost</text>
  <text fill="#66737f" font-family="Arial, sans-serif" font-size="17" font-weight="normal" text-anchor="middle" x="950.0" y="303.5">isolation • embarrassment • conflict</text>
  <line stroke="#17324d" stroke-width="4" x1="280" x2="320" y1="277" y2="277"/>
  <polygon fill="#17324d" points="320,277 307.0096189432334,284.5 307.0096189432334,269.5"/>
  <line stroke="#17324d" stroke-width="4" x1="540" x2="580" y1="277" y2="277"/>
  <polygon fill="#17324d" points="580,277 567.0096189432334,284.5 567.0096189432334,269.5"/>
  <line stroke="#17324d" stroke-width="4" x1="800" x2="840" y1="277" y2="277"/>
  <polygon fill="#17324d" points="840,277 827.0096189432334,284.5 827.0096189432334,269.5"/>
  <line stroke="#a74343" stroke-width="4" x1="1060" x2="170" y1="335" y2="430"/>
  <polygon fill="#a74343" points="170,430 182.12096314287803,421.16358373043727 183.71304253929443,436.07885386528585"/>
  <line stroke="#a74343" stroke-width="4" x1="170" x2="170" y1="430" y2="335"/>
  <polygon fill="#a74343" points="170,335 177.5,347.9903810567666 162.5,347.9903810567666"/>
  <rect fill="#edf4ed" height="100" rx="16" ry="16" stroke="#447c55" stroke-width="3" width="440" x="380" y="455"/>
  <text fill="#17324d" font-family="Arial, sans-serif" font-size="26" font-weight="bold" text-anchor="middle" x="600.0" y="497.0">Interrupt the cascade</text>
  <text fill="#66737f" font-family="Arial, sans-serif" font-size="17" font-weight="normal" text-anchor="middle" x="600.0" y="531.0">independent estimates • anonymous input • first ally • visible dissent norm</text>
</svg>

<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" baseProfile="full" height="650" version="1.1" viewBox="0 0 1200 650" width="1200">
  <defs>
    <marker id="cascade-arrow" viewBox="0 0 10 8" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0.5 0.8 L9 4 L0.5 7.2 Z" fill="#a74343" />
    </marker>
  </defs>
  <title>From private information to a social cascade</title>
  <desc>Private judgments become public actions; observed actions become social evidence; apparent consensus raises the cost of dissent and can produce a cascade. Independent elicitation interrupts the loop.</desc>
  <rect fill="white" height="650" width="1200" x="0" y="0" />
  <text fill="#17324d" font-family="Arial, sans-serif" font-size="34" font-weight="bold" text-anchor="middle" x="600" y="48">How apparent consensus can manufacture more consensus</text>
  <rect fill="#eaf3f8" height="115" rx="16" ry="16" stroke="#2f6f9f" stroke-width="3" width="220" x="60" y="220" />
  <text fill="#17324d" font-family="Arial, sans-serif" font-size="23.69" font-weight="bold" text-anchor="middle" x="170" y="248.896"><tspan x="170" dy="0">Private</tspan><tspan x="170" dy="27.9485">signal</tspan></text>
  <text fill="#66737f" font-family="Arial, sans-serif" font-size="16" font-weight="normal" text-anchor="middle" x="170" y="302.906"><tspan x="170" dy="0">what I saw or</tspan><tspan x="170" dy="18.274">believe</tspan></text>
  <rect fill="#eaf3f8" height="115" rx="16" ry="16" stroke="#2f6f9f" stroke-width="3" width="220" x="320" y="220" />
  <text fill="#17324d" font-family="Arial, sans-serif" font-size="26" font-weight="bold" text-anchor="middle" x="430" y="261.44"><tspan x="430" dy="0">Public action</tspan></text>
  <text fill="#66737f" font-family="Arial, sans-serif" font-size="17" font-weight="normal" text-anchor="middle" x="430" y="289.56"><tspan x="430" dy="0">what others can</tspan><tspan x="430" dy="20.06">observe</tspan></text>
  <rect fill="#f7f1e8" height="115" rx="16" ry="16" stroke="#c56a2d" stroke-width="3" width="220" x="580" y="220" />
  <text fill="#17324d" font-family="Arial, sans-serif" font-size="26" font-weight="bold" text-anchor="middle" x="690" y="256.13"><tspan x="690" dy="0">Social</tspan><tspan x="690" dy="30.68">evidence</tspan></text>
  <text fill="#66737f" font-family="Arial, sans-serif" font-size="17" font-weight="normal" text-anchor="middle" x="690" y="314.93"><tspan x="690" dy="0">“they may know more”</tspan></text>
  <rect fill="#f7f1e8" height="115" rx="16" ry="16" stroke="#c56a2d" stroke-width="3" width="220" x="840" y="220" />
  <text fill="#17324d" font-family="Arial, sans-serif" font-size="26" font-weight="bold" text-anchor="middle" x="950" y="251.41"><tspan x="950" dy="0">Dissent cost</tspan></text>
  <text fill="#66737f" font-family="Arial, sans-serif" font-size="17" font-weight="normal" text-anchor="middle" x="950" y="279.53"><tspan x="950" dy="0">isolation •</tspan><tspan x="950" dy="20.06">embarrassment •</tspan><tspan x="950" dy="20.06">conflict</tspan></text>
  <line stroke="#17324d" stroke-width="4" x1="280" x2="320" y1="277" y2="277" />
  <polygon fill="#17324d" points="320,277 307.0096189432334,284.5 307.0096189432334,269.5" />
  <line stroke="#17324d" stroke-width="4" x1="540" x2="580" y1="277" y2="277" />
  <polygon fill="#17324d" points="580,277 567.0096189432334,284.5 567.0096189432334,269.5" />
  <line stroke="#17324d" stroke-width="4" x1="800" x2="840" y1="277" y2="277" />
  <polygon fill="#17324d" points="840,277 827.0096189432334,284.5 827.0096189432334,269.5" />
  <path d="M1060 335 V405 H170 V335" fill="none" stroke="#a74343" stroke-width="4" stroke-linejoin="round" marker-end="url(#cascade-arrow)" />
  <rect fill="#edf4ed" height="100" rx="16" ry="16" stroke="#447c55" stroke-width="3" width="440" x="380" y="455" />
  <text fill="#17324d" font-family="Arial, sans-serif" font-size="26" font-weight="bold" text-anchor="middle" x="600" y="488.94"><tspan x="600" dy="0">Interrupt the cascade</tspan></text>
  <text fill="#66737f" font-family="Arial, sans-serif" font-size="17" font-weight="normal" text-anchor="middle" x="600" y="517.06"><tspan x="600" dy="0">independent estimates • anonymous input •</tspan><tspan x="600" dy="20.06">first ally • visible dissent norm</tspan></text>
</svg>

<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="840" viewBox="0 0 1200 840" role="img" aria-labelledby="title desc">
  <title id="title">Informational and normative influence are distinct pathways</title>
  <desc id="desc">Others' public actions feed two parallel routes. In the informational route, actions are treated as evidence and may update private belief and action, producing an informational cascade without a dissent cost. In the normative route, anticipated approval or sanction produces public conformity even when private belief does not change. Both can create more public actions. Independent private elicitation can interrupt correlated social evidence and conformity pressure.</desc>
  <defs>
    <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="8.5" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1,1 L8.5,5 L1,9 Z" fill="#2f6f9f"/></marker>
    <marker id="arrow-orange" markerWidth="10" markerHeight="10" refX="8.5" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1,1 L8.5,5 L1,9 Z" fill="#bf682d"/></marker>
    <marker id="arrow-gray" markerWidth="10" markerHeight="10" refX="8.5" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1,1 L8.5,5 L1,9 Z" fill="#47647e"/></marker>
  </defs>
  <rect width="1200" height="840" fill="#ffffff"/>
  <rect x="1.5" y="1.5" width="1197" height="837" rx="28" fill="none" stroke="#d5e1ea" stroke-width="3"/>
  <text x="600" y="48" text-anchor="middle" font-family="Arial, sans-serif" font-size="34" font-weight="700" fill="#17324d">Two routes from public behavior to more public behavior</text>
  <text x="600" y="80" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#586d80">Informational inference and normative pressure can interact, but neither requires the other.</text>

  <rect x="230" y="105" width="740" height="82" rx="19" fill="#183047"/>
  <text x="600" y="139" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#ffffff">OTHERS' PUBLIC ACTIONS</text>
  <text x="600" y="168" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#dbe8f0">observable choices, statements, ratings, or silence</text>

  <!-- The two routes occupy parallel lanes, so connectors never cross labels. -->
  <path d="M315 187 V235" fill="none" stroke="#2f6f9f" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow-blue)"/>
  <path d="M885 187 V235" fill="none" stroke="#bf682d" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow-orange)"/>

  <rect x="60" y="235" width="510" height="295" rx="22" fill="#f4f8fb" stroke="#2f6f9f" stroke-width="3"/>
  <text x="315" y="274" text-anchor="middle" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#2f6f9f">INFORMATIONAL ROUTE</text>
  <rect x="110" y="300" width="410" height="82" rx="16" fill="#e5f1f7" stroke="#2f6f9f" stroke-width="3"/>
  <text x="315" y="333" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#17324d">INFER EVIDENCE</text>
  <text x="315" y="361" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#586d80">“They may know more.”</text>
  <path d="M315 382 V414" fill="none" stroke="#2f6f9f" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow-blue)"/>
  <rect x="110" y="414" width="410" height="96" rx="16" fill="#eef4f8" stroke="#7892a8" stroke-width="3"/>
  <text x="315" y="447" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#17324d">UPDATE PRIVATE BELIEF OR ACTION</text>
  <text x="315" y="475" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#586d80"><tspan x="315" dy="0">A correlated social signal may override</tspan><tspan x="315" dy="22">private evidence.</tspan></text>

  <rect x="630" y="235" width="510" height="295" rx="22" fill="#fff8f1" stroke="#bf682d" stroke-width="3"/>
  <text x="885" y="274" text-anchor="middle" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#bf682d">NORMATIVE ROUTE</text>
  <rect x="680" y="300" width="410" height="82" rx="16" fill="#fff5ec" stroke="#bf682d" stroke-width="3"/>
  <text x="885" y="333" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#17324d">ANTICIPATE APPROVAL OR SANCTION</text>
  <text x="885" y="361" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#586d80">belonging • status • conflict</text>
  <path d="M885 382 V414" fill="none" stroke="#bf682d" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow-orange)"/>
  <rect x="680" y="414" width="410" height="96" rx="16" fill="#f8f1e7" stroke="#bf682d" stroke-width="3"/>
  <text x="885" y="447" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#17324d">PUBLIC CONFORMITY</text>
  <text x="885" y="475" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#586d80"><tspan x="885" dy="0">Public action can change while</tspan><tspan x="885" dy="22">private belief does not.</tspan></text>

  <path d="M315 510 V575" fill="none" stroke="#2f6f9f" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow-blue)"/>
  <path d="M885 510 V575" fill="none" stroke="#bf682d" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow-orange)"/>
  <rect x="200" y="575" width="800" height="82" rx="19" fill="#f2f5f8" stroke="#7892a8" stroke-width="3"/>
  <text x="600" y="608" text-anchor="middle" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#17324d">MORE PUBLIC ACTIONS</text>
  <text x="600" y="637" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#586d80">apparent consensus can grow even when observations are correlated</text>

  <path d="M1000 616 H1160 V146 H970" fill="none" stroke="#47647e" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-gray)"/>

  <rect x="150" y="700" width="900" height="88" rx="19" fill="#eaf4ec" stroke="#3f7c59" stroke-width="3"/>
  <text x="600" y="733" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#315f45">PRESERVE INDEPENDENCE BEFORE DISCUSSION</text>
  <text x="600" y="765" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#586d80">private estimates • anonymous input • evidence provenance • protected dissent • support for the first dissenter</text>
  <text x="600" y="820" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#647586">Teaching synthesis: cascades need no dissent cost; conformity needs no private belief revision.</text>
</svg>

<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" baseProfile="full" height="650" version="1.1" viewBox="0 0 1200 650" width="1200">
  <defs>
    <marker id="navy-arrow" markerWidth="11" markerHeight="11" refX="9.5" refY="5.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0 L11 5.5 L0 11 Z" fill="#17324d" />
    </marker>
  </defs>
  <title>Rational-choice benchmark</title>
  <desc>Feasible alternatives, beliefs about consequences, and values over consequences combine in an overall consequence-based value that guides choice.</desc>
  <rect fill="white" height="650" width="1200" x="0" y="0" />
  <text fill="#17324d" font-family="Arial, sans-serif" font-size="34" font-weight="bold" text-anchor="middle" x="600" y="55">Rational-choice benchmark</text>
  <rect fill="#eaf3f8" height="110" rx="16" ry="16" stroke="#2f6f9f" stroke-width="3" width="285" x="55" y="115" />
  <text fill="#17324d" font-family="Arial, sans-serif" font-size="26" font-weight="bold" text-anchor="middle" x="197.5" y="148.63"><tspan x="197.5" dy="0">Feasible</tspan><tspan x="197.5" dy="30.68">alternatives</tspan></text>
  <text fill="#66737f" font-family="Arial, sans-serif" font-size="17" font-weight="normal" text-anchor="middle" x="197.5" y="207.43"><tspan x="197.5" dy="0">What can be done?</tspan></text>
  <rect fill="#eaf3f8" height="110" rx="16" ry="16" stroke="#2f6f9f" stroke-width="3" width="285" x="55" y="275" />
  <text fill="#17324d" font-family="Arial, sans-serif" font-size="26" font-weight="bold" text-anchor="middle" x="197.5" y="308.63"><tspan x="197.5" dy="0">Beliefs /</tspan><tspan x="197.5" dy="30.68">probabilities</tspan></text>
  <text fill="#66737f" font-family="Arial, sans-serif" font-size="17" font-weight="normal" text-anchor="middle" x="197.5" y="367.43"><tspan x="197.5" dy="0">What may follow?</tspan></text>
  <rect fill="#f7f1e8" height="110" rx="16" ry="16" stroke="#c56a2d" stroke-width="3" width="285" x="55" y="435" />
  <text fill="#17324d" font-family="Arial, sans-serif" font-size="26" font-weight="bold" text-anchor="middle" x="197.5" y="468.63"><tspan x="197.5" dy="0">Preferences /</tspan><tspan x="197.5" dy="30.68">values</tspan></text>
  <text fill="#66737f" font-family="Arial, sans-serif" font-size="17" font-weight="normal" text-anchor="middle" x="197.5" y="527.43"><tspan x="197.5" dy="0">How good are outcomes?</tspan></text>
  <rect fill="#17324d" height="170" rx="16" ry="16" stroke="#17324d" stroke-width="3" width="300" x="450" y="230" />
  <text fill="white" font-family="Arial, sans-serif" font-size="28" font-weight="bold" text-anchor="middle" x="600" y="286"><tspan x="600" dy="0">Consequence-based</tspan><tspan x="600" dy="34">value</tspan></text>
  <text fill="white" font-family="Arial, sans-serif" font-size="17" font-weight="normal" text-anchor="middle" x="600" y="348"><tspan x="600" dy="0">combine predictions</tspan><tspan x="600" dy="20.06">with values</tspan></text>
  <rect fill="#eaf3f8" height="110" rx="16" ry="16" stroke="#2f6f9f" stroke-width="3" width="240" x="880" y="260" />
  <text fill="#17324d" font-family="Arial, sans-serif" font-size="26" font-weight="bold" text-anchor="middle" x="1000" y="308.97"><tspan x="1000" dy="0">Choice</tspan></text>
  <text fill="#66737f" font-family="Arial, sans-serif" font-size="17" font-weight="normal" text-anchor="middle" x="1000" y="337.09"><tspan x="1000" dy="0">best feasible option</tspan></text>
  <line marker-end="url(#navy-arrow)" stroke="#17324d" stroke-width="4" x1="340" x2="450" y1="170" y2="270" />
  <line marker-end="url(#navy-arrow)" stroke="#17324d" stroke-width="4" x1="340" x2="450" y1="330" y2="315" />
  <line marker-end="url(#navy-arrow)" stroke="#17324d" stroke-width="4" x1="340" x2="450" y1="490" y2="360" />
  <line marker-end="url(#navy-arrow)" stroke="#17324d" stroke-width="4" x1="750" x2="880" y1="315" y2="315" />
  <text fill="#66737f" font-family="Arial, sans-serif" font-size="21" font-weight="normal" text-anchor="middle" x="600" y="610">Benchmark, not biography: it makes assumptions and trade-offs explicit.</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="760" height="940" viewBox="0 0 760 940" role="img" aria-labelledby="title desc" data-layout="compact">
<title id="title">Notice when the question changes</title><desc id="desc">A question about project success is replaced by an easier judgment about the founder. The resulting answer may feel like a probability judgment. The audit checks whether the cue is diagnostic of the original target.</desc>
<defs><style>
text {font-family:Arial,Helvetica,sans-serif;fill:#183047}
.title {font-family:Georgia,serif;font-size:38px;font-weight:bold}
</style>
<marker id="blue" markerWidth="8" markerHeight="8" refX="8" refY="4" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8 Z" fill="#25678f"/></marker>
<marker id="green" markerWidth="8" markerHeight="8" refX="8" refY="4" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8 Z" fill="#2b7a78"/></marker>
<marker id="warm" markerWidth="8" markerHeight="8" refX="8" refY="4" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8 Z" fill="#b95f2d"/></marker>
</defs><rect width="760" height="940" fill="white"/>
<text x="380" y="58" text-anchor="middle" font-size="38" font-weight="normal" style="fill:#183047" class="title"><tspan x="380" dy="0">Notice when the</tspan><tspan x="380" dy="47.12">question changes</tspan></text>
<rect x="65" y="170" width="630" height="146" rx="18" fill="#fff8f3" stroke="#b95f2d" stroke-width="2.5"/>
<text x="380.0" y="213" text-anchor="middle" font-size="32" font-weight="bold" style="fill:#b95f2d" class=""><tspan x="380.0" dy="0">The target question</tspan></text>
<text x="380.0" y="254" text-anchor="middle" font-size="28" font-weight="normal" style="fill:#183047" class=""><tspan x="380.0" dy="0">How likely is this project to succeed?</tspan></text>
<rect x="65" y="393" width="630" height="146" rx="18" fill="#f4f7fa" stroke="#25678f" stroke-width="2.5"/>
<text x="380.0" y="436" text-anchor="middle" font-size="32" font-weight="bold" style="fill:#25678f" class=""><tspan x="380.0" dy="0">An easier question</tspan></text>
<text x="380.0" y="477" text-anchor="middle" font-size="28" font-weight="normal" style="fill:#183047" class=""><tspan x="380.0" dy="0">How impressive does the founder seem?</tspan></text>
<rect x="65" y="616" width="630" height="110" rx="18" fill="#f4f7fa" stroke="#25678f" stroke-width="2.5"/>
<text x="380.0" y="659" text-anchor="middle" font-size="32" font-weight="bold" style="fill:#25678f" class=""><tspan x="380.0" dy="0">An answer that feels like a forecast</tspan></text>
<text x="380.0" y="700" text-anchor="middle" font-size="28" font-weight="normal" style="fill:#183047" class=""><tspan x="380.0" dy="0">“It will probably succeed.”</tspan></text>
<path d="M380 316 V393" fill="none" stroke="#25678f" stroke-width="3" stroke-linejoin="round" marker-end="url(#blue)"/>
<path d="M380 539 V616" fill="none" stroke="#25678f" stroke-width="3" stroke-linejoin="round" marker-end="url(#blue)"/>
<text x="380" y="793" text-anchor="middle" font-size="28" font-weight="normal" style="fill:#183047" class=""><tspan x="380" dy="0">Does the founder’s impression provide</tspan><tspan x="380" dy="34.72">good evidence about project success?</tspan></text>
<text x="380" y="887" text-anchor="middle" font-size="28" font-weight="normal" style="fill:#183047" class=""><tspan x="380" dy="0">An informative cue can still receive too much weight.</tspan></text>
</svg>

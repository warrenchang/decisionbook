<svg xmlns="http://www.w3.org/2000/svg" width="760" height="330" viewBox="0 170 760 330" role="img" aria-labelledby="title desc" data-layout="compact">
<title id="title">An urge can change without being acted on</title><desc id="desc">A schematic curve shows one possible rise and fall of urge intensity without a fixed timescale. This is not a timetable: urges can persist or return.</desc>
<defs><style>
text {font-family:Arial,Helvetica,sans-serif;fill:#183047}
.title {font-family:Georgia,serif;font-size:38px;font-weight:bold}

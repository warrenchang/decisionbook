<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="800" height="780" viewBox="0 0 800 780" role="img" aria-labelledby="title desc">
  <title id="title">The hidden-zero frame in an intertemporal choice</title>
  <desc id="desc">The upper panel abbreviates the choice as one hundred euros today or one hundred twenty euros in one month, leaving the other date blank. The lower panel shows the same complete streams: one hundred euros today and zero next month, versus zero today and one hundred twenty euros next month. A boundary note says the fuller frame changes what is attended to but does not make the later option normatively correct.</desc>
  <defs>
    <style>
      .title{font:700 38px Arial,sans-serif;fill:#17324d}
      .subtitle{font:29px Arial,sans-serif;fill:#536879}
      .paneltitle{font:700 29px Arial,sans-serif;fill:#17324d}
      .column{font:700 28px Arial,sans-serif;fill:#536879}
      .option{font:700 30px Arial,sans-serif;fill:#17324d}
      .amount{font:700 34px Arial,sans-serif;fill:#17324d}
      .missing{font:25px Arial,sans-serif;fill:#8b99a4}
      .same{font:700 26px Arial,sans-serif;fill:#a94c17}
      .note{font:27px Arial,sans-serif;fill:#40566a}
      .noteStrong{font:700 28px Arial,sans-serif;fill:#17324d}
    </style>
  </defs>

  <rect width="800" height="780" fill="#ffffff"/>
  <text class="title" x="400" y="48" text-anchor="middle">The hidden-zero frame</text>
  <text class="subtitle" x="400" y="88" text-anchor="middle">Same payoffs, but a more complete representation</text>

  <rect x="45" y="120" width="710" height="225" rx="22" fill="#f8fafc" stroke="#b8c9d6" stroke-width="2"/>
  <text class="paneltitle" x="400" y="158" text-anchor="middle">ABBREVIATED FRAME</text>
  <text class="column" x="405" y="194" text-anchor="middle">Today</text>
  <text class="column" x="625" y="194" text-anchor="middle">In one month</text>

  <rect x="72" y="210" width="656" height="55" rx="13" fill="#eaf3f8" stroke="#8fb2c8" stroke-width="1.8"/>
  <text class="option" x="95" y="247">Option A</text>
  <text class="amount" x="405" y="249" text-anchor="middle">€100</text>
  <text class="missing" x="625" y="246" text-anchor="middle">not shown</text>

  <rect x="72" y="275" width="656" height="55" rx="13" fill="#eef5ef" stroke="#9cbea7" stroke-width="1.8"/>
  <text class="option" x="95" y="312">Option B</text>
  <text class="missing" x="405" y="311" text-anchor="middle">not shown</text>
  <text class="amount" x="625" y="314" text-anchor="middle">€120</text>

  <text class="same" x="400" y="379" text-anchor="middle">SAME TWO OUTCOME STREAMS • DIFFERENT DISPLAY</text>

  <rect x="45" y="405" width="710" height="245" rx="22" fill="#f8fafc" stroke="#b8c9d6" stroke-width="2"/>
  <text class="paneltitle" x="400" y="444" text-anchor="middle">COMPLETE-STREAM FRAME</text>
  <text class="column" x="405" y="481" text-anchor="middle">Today</text>
  <text class="column" x="625" y="481" text-anchor="middle">In one month</text>

  <rect x="72" y="497" width="656" height="62" rx="13" fill="#eaf3f8" stroke="#2f6f9f" stroke-width="2.2"/>
  <text class="option" x="95" y="538">Option A</text>
  <text class="amount" x="405" y="540" text-anchor="middle">€100</text>
  <text class="amount" x="625" y="540" text-anchor="middle">€0</text>

  <rect x="72" y="571" width="656" height="62" rx="13" fill="#eef5ef" stroke="#3f7f54" stroke-width="2.2"/>
  <text class="option" x="95" y="612">Option B</text>
  <text class="amount" x="405" y="614" text-anchor="middle">€0</text>
  <text class="amount" x="625" y="614" text-anchor="middle">€120</text>

  <rect x="45" y="680" width="710" height="76" rx="18" fill="#f9f1e8" stroke="#d2a16f" stroke-width="2"/>
  <text class="noteStrong" x="400" y="711" text-anchor="middle">The complete stream can redirect attention.</text>
  <text class="note" x="400" y="742" text-anchor="middle">It does not make the delayed option normatively superior.</text>
</svg>

<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="hai-title hai-desc">
  <title id="hai-title">Task-specific governance of human judgment and computational tools</title>
  <desc id="hai-desc">An author's prescriptive synthesis separates accountable human responsibilities from fixed or predictive tools and generative models. A fixed pipeline may make a procedure reproducible, but predictions still require out-of-sample validation. Generative outputs can vary, fabricate, or fail instructions. Every proposed role passes through a task-specific comparative evidence gate before a governed decision with accountability, documentation, correction, appeal, and monitoring.</desc>
  <defs>
    <marker id="hai-arrow" viewBox="0 0 10 8" markerWidth="10" markerHeight="8" refX="8.7" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0.7 0.8 L8.8 4 L0.7 7.2 Z" fill="#60758a"/>
    </marker>
  </defs>

  <rect width="1200" height="800" fill="#ffffff"/>
  <text x="600" y="48" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700" fill="#183047">Assign system roles from task-specific evidence</text>
  <text x="600" y="80" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#60758a">“Human” and “AI” are not fixed capability bundles; validate the actual people, tool, version, task, and context.</text>

  <g font-family="Arial, Helvetica, sans-serif">
    <rect x="40" y="118" width="340" height="220" rx="22" fill="#edf5fa" stroke="#2b75a0" stroke-width="3"/>
    <text x="210" y="157" text-anchor="middle" font-size="22" font-weight="700" fill="#245f84">HUMAN RESPONSIBILITY</text>
    <text x="70" y="198" font-size="16" fill="#183047">• define legitimate objective and rights</text>
    <text x="70" y="229" font-size="16" fill="#183047">• decide whose values and errors count</text>
    <text x="70" y="260" font-size="16" fill="#183047">• inspect context and justified exceptions</text>
    <text x="70" y="291" font-size="16" fill="#183047">• retain authority, reasons, accountability</text>
    <text x="210" y="321" text-anchor="middle" font-size="16" fill="#60758a">Accountability does not prove accuracy.</text>

    <rect x="40" y="366" width="340" height="166" rx="22" fill="#f2eef8" stroke="#80639a" stroke-width="3"/>
    <text x="210" y="403" text-anchor="middle" font-size="20" font-weight="700" fill="#664d80">FIXED / PREDICTIVE TOOL</text>
    <text x="70" y="440" font-size="16" fill="#183047">Versioning can make a fixed procedure</text>
    <text x="70" y="466" font-size="16" fill="#183047">reproducible; prediction still requires</text>
    <text x="70" y="492" font-size="16" fill="#183047">out-of-sample evaluation for the task.</text>
    <text x="210" y="516" text-anchor="middle" font-size="16" font-weight="700" fill="#843b42">Repeatability does not prove validity.</text>

    <rect x="40" y="554" width="340" height="166" rx="22" fill="#fff3f3" stroke="#a55358" stroke-width="3"/>
    <text x="210" y="592" text-anchor="middle" font-size="21" font-weight="700" fill="#843b42">GENERATIVE MODEL</text>
    <text x="70" y="628" font-size="16" fill="#183047">May propose text, summaries, alternatives,</text>
    <text x="70" y="654" font-size="16" fill="#183047">or tests; outputs can vary, fabricate,</text>
    <text x="70" y="680" font-size="16" fill="#183047">or fail instructions.</text>
    <text x="210" y="705" text-anchor="middle" font-size="16" font-weight="700" fill="#843b42">Not inherently truthful or rule-bound.</text>
  </g>

  <g font-family="Arial, Helvetica, sans-serif">
    <rect x="420" y="118" width="420" height="602" rx="24" fill="#fff8ea" stroke="#d39b34" stroke-width="3"/>
    <text x="630" y="157" text-anchor="middle" font-size="21" font-weight="700" fill="#7d5718">TASK-SPECIFIC EVIDENCE GATE</text>
    <text x="630" y="185" text-anchor="middle" font-size="16" fill="#60758a">Compare the proposed division of labor with alternatives.</text>

    <text x="454" y="220" font-size="18" font-weight="700" fill="#17324d">Target and population</text>
    <text x="454" y="247" font-size="16" fill="#183047">Is the objective legitimate?</text>
    <text x="454" y="271" font-size="16" fill="#183047">Is it measured as intended?</text>

    <text x="454" y="307" font-size="18" font-weight="700" fill="#17324d">Comparative performance</text>
    <text x="454" y="334" font-size="16" fill="#183047">Compare feasible human, rule, and model</text>
    <text x="454" y="358" font-size="16" fill="#183047">baselines on the deployment task and subgroups.</text>

    <text x="454" y="394" font-size="18" font-weight="700" fill="#17324d">Output-specific checks</text>
    <text x="454" y="421" font-size="16" fill="#183047">For predictions: calibration and error.</text>
    <text x="454" y="445" font-size="16" fill="#183047">For generation: sources, facts, uncertainty,</text>
    <text x="454" y="469" font-size="16" fill="#183047">and instruction following.</text>

    <text x="454" y="505" font-size="18" font-weight="700" fill="#17324d">System conditions</text>
    <text x="454" y="532" font-size="16" fill="#183047">Version, data, privacy, security, and workload;</text>
    <text x="454" y="556" font-size="16" fill="#183047">overrides and failure handling.</text>

    <text x="454" y="592" font-size="18" font-weight="700" fill="#17324d">Rights and control</text>
    <text x="454" y="619" font-size="16" fill="#183047">Document roles; enable correction and appeal,</text>
    <text x="454" y="643" font-size="16" fill="#183047">monitoring, and authority to stop use.</text>

    <rect x="454" y="666" width="352" height="34" rx="11" fill="#ffffff" stroke="#d39b34" stroke-width="2"/>
    <text x="630" y="689" text-anchor="middle" font-size="16" font-weight="700" fill="#7d5718">Revalidate after material change.</text>
  </g>

  <g font-family="Arial, Helvetica, sans-serif">
    <rect x="880" y="236" width="280" height="366" rx="24" fill="#edf7ef" stroke="#4f8b61" stroke-width="4"/>
    <text x="1020" y="282" text-anchor="middle" font-size="23" font-weight="700" fill="#2d6740">GOVERNED DECISION</text>
    <text x="1020" y="329" text-anchor="middle" font-size="16" fill="#183047">accountable authority</text>
    <text x="1020" y="362" text-anchor="middle" font-size="16" fill="#183047">documented role and version</text>
    <text x="1020" y="395" text-anchor="middle" font-size="16" fill="#183047">owned reasons and exceptions</text>
    <text x="1020" y="428" text-anchor="middle" font-size="16" fill="#183047">correction and meaningful appeal</text>
    <text x="1020" y="461" text-anchor="middle" font-size="16" fill="#183047">outcome, subgroup, and drift review</text>
    <line x1="916" y1="492" x2="1124" y2="492" stroke="#b7c6d2" stroke-width="2"/>
    <text x="1020" y="526" text-anchor="middle" font-size="16" font-weight="700" fill="#843b42">Human review needs both</text>
    <text x="1020" y="552" text-anchor="middle" font-size="16" font-weight="700" fill="#843b42">information and power to act.</text>
    <text x="1020" y="579" text-anchor="middle" font-size="16" fill="#60758a">No rubber-stamp review.</text>
  </g>

  <path d="M380 228 L420 228" fill="none" stroke="#60758a" stroke-width="4" stroke-linecap="round" marker-end="url(#hai-arrow)"/>
  <path d="M380 449 L420 449" fill="none" stroke="#60758a" stroke-width="4" stroke-linecap="round" marker-end="url(#hai-arrow)"/>
  <path d="M380 637 L420 637" fill="none" stroke="#60758a" stroke-width="4" stroke-linecap="round" marker-end="url(#hai-arrow)"/>
  <path d="M840 419 L880 419" fill="none" stroke="#60758a" stroke-width="4" stroke-linecap="round" marker-end="url(#hai-arrow)"/>

  <text x="600" y="776" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#60758a">Author's prescriptive synthesis. Fluency, repeatability, and consistency are not substitutes for task-specific validity.</text>
</svg>

<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1610" viewBox="0 0 900 1610" role="img" aria-labelledby="title desc">
  <title id="title">Noisy estimates passing through a significance-only reporting gate</title>
  <desc id="desc">A deterministic simulation of 2000 independent two-arm studies with true standardized effect 0.2, outcome variance 1.0, 50 observations per arm, alpha 0.05, and seed 20260830. All estimates are noisy around the true effect. A reporting rule shows only two-sided p-values below alpha. The selected subset is smaller and has a larger mean estimate. This is a teaching simulation, not an estimate of real publication bias.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 8" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0.5 0.8 L9 4 L0.5 7.2 Z" fill="#5f7080"/>
    </marker>
    <marker id="blue-arrow" viewBox="0 0 10 8" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0.5 0.8 L9 4 L0.5 7.2 Z" fill="#2f6f9f"/>
    </marker>
    <marker id="red-arrow" viewBox="0 0 10 8" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0.5 0.8 L9 4 L0.5 7.2 Z" fill="#a74343"/>
    </marker>
  </defs>
  <rect width="900" height="1610" fill="#f8fafc"/>
<text x="450" y="54" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="35" font-weight="700" fill="#17324d" >A significance gate changes the literature we see</text>
<text x="450" y="94" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="400" fill="#5f7080" >Noisy estimates enter; a systematically different subset emerges.</text>
<rect x="35" y="126" width="830" height="112" rx="18" fill="#ffffff" stroke="#d3dee6" stroke-width="2"/>
<text x="450" y="165" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" fill="#17324d" >TRUE EFFECT = 0.20 SD   ·   VARIANCE = 1.0   ·   n = 50 PER ARM</text>
<text x="450" y="205" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" fill="#5f7080" >α = 0.05   ·   2,000 studies   ·   known-variance two-sided z test   ·   seed 20260830</text>
<rect x="45" y="275" width="810" height="390" rx="22" fill="#ffffff" stroke="#2f6f9f" stroke-width="3"/>
<text x="450" y="319" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#2f6f9f" >1  ALL SIMULATED ESTIMATES</text>
<text x="450" y="355" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400" fill="#5f7080" >mean = 0.202 across 2,000 studies</text>
<line x1="450" y1="665" x2="450" y2="707" stroke="#a74343" stroke-width="4" marker-end="url(#red-arrow)"/>
<rect x="200" y="715" width="500" height="184" rx="22" fill="#fff0e9" stroke="#a74343" stroke-width="3"/>
<text x="450" y="758" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" fill="#a74343" >2  SIGNIFICANCE / REPORTING GATE</text>
<text x="450" y="805" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="700" fill="#17324d" >visible only if two-sided p &lt; .05</text>
<text x="450" y="847" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400" fill="#5f7080" >estimate &lt; −0.392  or  estimate &gt; 0.392</text>
<line x1="450" y1="899" x2="450" y2="941" stroke="#a74343" stroke-width="4" marker-end="url(#red-arrow)"/>
<rect x="45" y="950" width="810" height="390" rx="22" fill="#ffffff" stroke="#c56a2d" stroke-width="3"/>
<text x="450" y="994" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#c56a2d" >3  SELECTED VISIBLE ESTIMATES</text>
<text x="450" y="1030" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400" fill="#5f7080" >mean = 0.490 across 328 studies</text>

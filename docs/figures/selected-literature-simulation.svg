<text x="450" y="1413" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" fill="#17324d" >328 of 2,000 studies (16.4%) pass the reporting gate.</text>
<text x="450" y="1450" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#17324d" >4 selected estimates have the wrong sign; selected mean = 2.5× the truth.</text>
<text x="450" y="1482" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" fill="#17324d" >Theoretical power under the declared model = 17.0%.</text>
<text x="450" y="1535" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" fill="#5f7080" >Teaching simulation—not an estimate of any field's publication process.</text>
<text x="450" y="1562" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" fill="#5f7080" >Real selection can also depend on novelty, direction, outcomes,</text>
<text x="450" y="1589" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" fill="#5f7080" >analyses, and editorial decisions.</text>

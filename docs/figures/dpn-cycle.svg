  <circle cx="600" cy="330" fill="#17324d" r="85"/>
  <text fill="white" font-family="Arial, sans-serif" font-size="24" font-weight="bold" text-anchor="middle" x="600" y="326">Decision</text>
  <text fill="white" font-family="Arial, sans-serif" font-size="24" font-weight="bold" text-anchor="middle" x="600" y="356">hygiene</text>
</svg>

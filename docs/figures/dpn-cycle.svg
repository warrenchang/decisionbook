<?xml version="1.0" encoding="utf-8" ?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink" baseProfile="full" height="650" version="1.1" viewBox="0 0 1200 650" width="1200">
  <defs/>
  <title>DPN cycle</title>
  <desc>Notice, test, ask, design and learn form a repeating cycle for decision, persuasion and negotiation.</desc>
  <rect fill="white" height="650" width="1200" x="0" y="0"/>
  <text fill="#17324d" font-family="Arial, sans-serif" font-size="36" font-weight="bold" text-anchor="middle" x="600" y="48">The DPN cycle</text>
  <rect fill="#eaf3f8" height="94" rx="16" ry="16" stroke="#2f6f9f" stroke-width="3" width="210" x="495.0" y="53.0"/>
  <text fill="#17324d" font-family="Arial, sans-serif" font-size="26" font-weight="bold" text-anchor="middle" x="600.0" y="92.0">NOTICE</text>
  <text fill="#66737f" font-family="Arial, sans-serif" font-size="17" font-weight="normal" text-anchor="middle" x="600.0" y="126.0">What entered attention?</text>
  <rect fill="#eaf3f8" height="94" rx="16" ry="16" stroke="#2f6f9f" stroke-width="3" width="210" x="713.7429987478853" y="211.9260912937621"/>
  <text fill="#17324d" font-family="Arial, sans-serif" font-size="26" font-weight="bold" text-anchor="middle" x="818.7429987478853" y="250.9260912937621">TEST</text>
  <text fill="#66737f" font-family="Arial, sans-serif" font-size="17" font-weight="normal" text-anchor="middle" x="818.7429987478853" y="284.9260912937621">What evidence could change the model?</text>
  <rect fill="#eaf3f8" height="94" rx="16" ry="16" stroke="#2f6f9f" stroke-width="3" width="210" x="630.1906080272688" y="469.07390870623794"/>
  <text fill="#17324d" font-family="Arial, sans-serif" font-size="26" font-weight="bold" text-anchor="middle" x="735.1906080272688" y="508.07390870623794">ASK</text>
  <text fill="#66737f" font-family="Arial, sans-serif" font-size="17" font-weight="normal" text-anchor="middle" x="735.1906080272688" y="542.073908706238">Whose perspective or interest is missing?</text>
  <rect fill="#f7f1e8" height="94" rx="16" ry="16" stroke="#c56a2d" stroke-width="3" width="210" x="359.8093919727312" y="469.07390870623794"/>
  <text fill="#17324d" font-family="Arial, sans-serif" font-size="26" font-weight="bold" text-anchor="middle" x="464.8093919727312" y="508.07390870623794">DESIGN</text>
  <text fill="#66737f" font-family="Arial, sans-serif" font-size="17" font-weight="normal" text-anchor="middle" x="464.8093919727312" y="542.073908706238">What process or environment helps?</text>
  <rect fill="#f7f1e8" height="94" rx="16" ry="16" stroke="#c56a2d" stroke-width="3" width="210" x="276.25700125211466" y="211.9260912937621"/>
  <text fill="#17324d" font-family="Arial, sans-serif" font-size="26" font-weight="bold" text-anchor="middle" x="381.25700125211466" y="250.9260912937621">LEARN</text>
  <text fill="#66737f" font-family="Arial, sans-serif" font-size="17" font-weight="normal" text-anchor="middle" x="381.25700125211466" y="284.9260912937621">What did the result reveal?</text>
  <line stroke="#2b7a78" stroke-width="3" x1="600.0" x2="818.7429987478853" y1="100.0" y2="258.9260912937621"/>
  <polygon fill="#2b7a78" points="818.7429987478853,258.9260912937621 803.8251703173612,257.3581643447473 812.6419491017483,245.2229094291231"/>

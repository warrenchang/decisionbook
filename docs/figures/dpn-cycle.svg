  <polygon fill="#2b7a78" points="735.1906080272688,516.073908706238 732.0719326650025,501.40169469523084 746.3377804094297,506.03694961085506"/>
  <line stroke="#2b7a78" stroke-width="3" x1="735.1906080272688" x2="464.8093919727312" y1="516.073908706238" y2="516.073908706238"/>
  <polygon fill="#2b7a78" points="464.8093919727312,516.073908706238 477.79977302949777,508.57390870623794 477.79977302949777,523.573908706238"/>
  <line stroke="#2b7a78" stroke-width="3" x1="464.8093919727312" x2="381.25700125211466" y1="516.073908706238" y2="258.9260912937621"/>

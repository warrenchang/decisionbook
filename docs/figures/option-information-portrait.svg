<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1160" viewBox="0 0 800 1160" role="img" aria-labelledby="title desc">
  <title id="title">A practical sequence for building a better decision</title>
  <desc id="desc">The sequence expands the feasible set, names the best forgone option, asks what information could change action, and stress-tests the recommendation.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 11 9" markerWidth="11" markerHeight="9" refX="10" refY="4.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0.8 0.8 L10 4.5 L0.8 8.2 Z" fill="#17324d"/>
    </marker>
    <style>
      .title{font:700 37px Arial,Helvetica,sans-serif;fill:#17324d}
      .subtitle{font:23px Arial,Helvetica,sans-serif;fill:#536779}
      .step{font:700 25px Arial,Helvetica,sans-serif;fill:#ffffff}
      .box-title{font:700 30px Arial,Helvetica,sans-serif;fill:#17324d}
      .box-copy{font:23px Arial,Helvetica,sans-serif;fill:#536779}
      .footer-strong{font:700 23px Arial,Helvetica,sans-serif;fill:#17324d}
      .footer{font:22px Arial,Helvetica,sans-serif;fill:#536779}
    </style>
  </defs>

  <rect width="800" height="1160" fill="#ffffff"/>
  <text class="title" x="400" y="54" text-anchor="middle">Better decisions begin before comparison</text>
  <text class="subtitle" x="400" y="93" text-anchor="middle">Build the menu, sacrifice, information, and uncertainty into the process.</text>

  <rect x="80" y="135" width="640" height="160" rx="22" fill="#eaf3f8" stroke="#2f6f9f" stroke-width="3"/>
  <circle cx="130" cy="180" r="27" fill="#2f6f9f"/>
  <text class="step" x="130" y="189" text-anchor="middle">1</text>
  <text class="box-title" x="400" y="190" text-anchor="middle">Expand the feasible set</text>
  <text class="box-copy" x="400" y="244" text-anchor="middle">Generate, combine, negotiate, stage, search, or exit.</text>

  <path d="M400 295 V350" fill="none" stroke="#17324d" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/>
  <rect x="80" y="350" width="640" height="160" rx="22" fill="#eaf3f8" stroke="#2f6f9f" stroke-width="3"/>
  <circle cx="130" cy="395" r="27" fill="#2f6f9f"/>
  <text class="step" x="130" y="404" text-anchor="middle">2</text>
  <text class="box-title" x="400" y="405" text-anchor="middle">Name the best forgone option</text>
  <text class="box-copy" x="400" y="459" text-anchor="middle">Make the opportunity cost of commitment visible.</text>

  <path d="M400 510 V565" fill="none" stroke="#17324d" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/>
  <rect x="80" y="565" width="640" height="160" rx="22" fill="#f7f1e8" stroke="#c56a2d" stroke-width="3"/>
  <circle cx="130" cy="610" r="27" fill="#c56a2d"/>
  <text class="step" x="130" y="619" text-anchor="middle">3</text>
  <text class="box-title" x="430" y="607" text-anchor="middle">
    <tspan x="430" dy="0">Ask what information</tspan>
    <tspan x="430" dy="37">could change action</tspan>
  </text>
  <text class="box-copy" x="400" y="681" text-anchor="middle">
    <tspan x="400" dy="0">Seek evidence only when a plausible result</tspan>
    <tspan x="400" dy="29">can change the decision.</tspan>
  </text>

  <path d="M400 725 V780" fill="none" stroke="#17324d" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/>
  <rect x="80" y="780" width="640" height="160" rx="22" fill="#f7f1e8" stroke="#c56a2d" stroke-width="3"/>
  <circle cx="130" cy="825" r="27" fill="#c56a2d"/>
  <text class="step" x="130" y="834" text-anchor="middle">4</text>
  <text class="box-title" x="400" y="835" text-anchor="middle">Stress-test the recommendation</text>
  <text class="box-copy" x="400" y="889" text-anchor="middle">Test sensitivity, thresholds, reversibility, and safeguards.</text>

  <text class="footer-strong" x="400" y="1010" text-anchor="middle">A precise calculation cannot rescue an incomplete menu.</text>
  <text class="footer" x="400" y="1054" text-anchor="middle">
    <tspan x="400" dy="0">Information is valuable only when it can improve action</tspan>
    <tspan x="400" dy="29">enough to justify its cost.</tspan>
  </text>
</svg>

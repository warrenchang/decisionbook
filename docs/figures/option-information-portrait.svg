<svg xmlns="http://www.w3.org/2000/svg" width="760" height="1190" viewBox="0 0 760 1190" role="img" aria-labelledby="title desc" data-layout="compact">
<title id="title">Better decisions begin before comparison</title><desc id="desc">Four questions for building a better decision: expand the feasible set, name the best forgone option, seek information that could improve the choice, and stress-test the ranking. Earlier steps can be revisited.</desc>
<defs><style>
text {font-family:Arial,Helvetica,sans-serif;fill:#183047}
.title {font-family:Georgia,serif;font-size:38px;font-weight:bold}
</style>
<marker id="blue" markerWidth="8" markerHeight="8" refX="8" refY="4" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8 Z" fill="#25678f"/></marker>
<marker id="green" markerWidth="8" markerHeight="8" refX="8" refY="4" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8 Z" fill="#2b7a78"/></marker>
<marker id="warm" markerWidth="8" markerHeight="8" refX="8" refY="4" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8 Z" fill="#b95f2d"/></marker>
</defs><rect width="760" height="1190" fill="white"/>
<text x="380" y="54" text-anchor="middle" font-size="38" font-weight="normal" style="fill:#183047" class="title"><tspan x="380" dy="0">Better decisions begin</tspan><tspan x="380" dy="47.12">before comparison</tspan></text>
<rect x="30" y="146" width="700" height="177" rx="20" fill="#edf5fa" stroke="#25678f" stroke-width="2.5"/>
<circle cx="77" cy="192" r="24" fill="#25678f"/>
<text x="77" y="202" text-anchor="middle" font-size="30" font-weight="bold" style="fill:white" class=""><tspan x="77" dy="0">1</tspan></text>
<text x="411" y="190" text-anchor="middle" font-size="32" font-weight="bold" style="fill:#25678f" class=""><tspan x="411" dy="0">Expand the feasible set</tspan></text>
<text x="380" y="261" text-anchor="middle" font-size="30" font-weight="normal" style="fill:#183047" class=""><tspan x="380" dy="0">Generate, combine, negotiate, stage,</tspan><tspan x="380" dy="37.2">keep searching, or walk away.</tspan></text>
<path d="M380 323 V367" fill="none" stroke="#25678f" stroke-width="3" stroke-linejoin="round" marker-end="url(#blue)"/>
<rect x="30" y="367" width="700" height="177" rx="20" fill="#edf5fa" stroke="#25678f" stroke-width="2.5"/>
<circle cx="77" cy="413" r="24" fill="#25678f"/>
<text x="77" y="423" text-anchor="middle" font-size="30" font-weight="bold" style="fill:white" class=""><tspan x="77" dy="0">2</tspan></text>
<text x="411" y="411" text-anchor="middle" font-size="32" font-weight="bold" style="fill:#25678f" class=""><tspan x="411" dy="0">Name the best forgone option</tspan></text>
<text x="380" y="482" text-anchor="middle" font-size="30" font-weight="normal" style="fill:#183047" class=""><tspan x="380" dy="0">What is the best feasible alternative</tspan><tspan x="380" dy="37.2">you would give up by committing?</tspan></text>
<path d="M380 544 V588" fill="none" stroke="#25678f" stroke-width="3" stroke-linejoin="round" marker-end="url(#blue)"/>
<rect x="30" y="588" width="700" height="177" rx="20" fill="#fff8f3" stroke="#b95f2d" stroke-width="2.5"/>
<circle cx="77" cy="634" r="24" fill="#b95f2d"/>
<text x="77" y="644" text-anchor="middle" font-size="30" font-weight="bold" style="fill:white" class=""><tspan x="77" dy="0">3</tspan></text>
<text x="411" y="624" text-anchor="middle" font-size="32" font-weight="bold" style="fill:#b95f2d" class=""><tspan x="411" dy="0">Ask what information</tspan><tspan x="411" dy="39.68">could change your choice</tspan></text>
<text x="380" y="710" text-anchor="middle" font-size="30" font-weight="normal" style="fill:#183047" class=""><tspan x="380" dy="0">Seek it when it could improve action</tspan><tspan x="380" dy="37.2">enough to justify its cost.</tspan></text>
<path d="M380 765 V809" fill="none" stroke="#25678f" stroke-width="3" stroke-linejoin="round" marker-end="url(#blue)"/>
<rect x="30" y="809" width="700" height="177" rx="20" fill="#fff8f3" stroke="#b95f2d" stroke-width="2.5"/>
<circle cx="77" cy="855" r="24" fill="#b95f2d"/>
<text x="77" y="865" text-anchor="middle" font-size="30" font-weight="bold" style="fill:white" class=""><tspan x="77" dy="0">4</tspan></text>
<text x="411" y="853" text-anchor="middle" font-size="32" font-weight="bold" style="fill:#b95f2d" class=""><tspan x="411" dy="0">Stress-test the ranking</tspan></text>
<text x="380" y="924" text-anchor="middle" font-size="30" font-weight="normal" style="fill:#183047" class=""><tspan x="380" dy="0">Vary assumptions; check thresholds,</tspan><tspan x="380" dy="37.2">reversibility, and safeguards.</tspan></text>
<text x="380" y="1060" text-anchor="middle" font-size="30" font-weight="bold" style="fill:#183047" class=""><tspan x="380" dy="0">A precise calculation cannot rescue</tspan><tspan x="380" dy="37.2">an incomplete menu.</tspan></text>
<text x="380" y="1154" text-anchor="middle" font-size="30" font-weight="normal" style="fill:#183047" class=""><tspan x="380" dy="0">Revisit earlier steps as you learn more.</tspan></text>
</svg>

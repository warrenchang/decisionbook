<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">From a return pattern to a defensible decision</title>
  <desc id="desc">A documented return pattern enters a joint-test audit with five competing explanations: priced risk, behavioral mispricing, market frictions, model misspecification, and data mining. The paths converge on an implementation gate and then an out-of-sample and post-publication test. The conclusion can be a bounded regularity, an implementable strategy, or insufficient evidence.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 8" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0.5 0.8 L9 4 L0.5 7.2 Z" fill="#25678f"/></marker>
    <filter id="shadow"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#183047" flood-opacity="0.12"/></filter>
  </defs>
  <rect width="1200" height="760" fill="#ffffff"/>
  <text x="600" y="50" text-anchor="middle" font-family="Georgia, serif" font-size="34" font-weight="700" fill="#183047">From a return pattern to a defensible decision</text>
  <text x="600" y="82" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#607080">An anomaly is the beginning of an audit—not the end of an argument.</text>

  <g font-family="Arial, sans-serif" filter="url(#shadow)">
    <rect x="45" y="270" width="210" height="130" rx="18" fill="#eaf3f8" stroke="#25678f" stroke-width="3"/>
    <text x="150" y="312" text-anchor="middle" font-size="22" font-weight="700" fill="#183047">Documented</text>
    <text x="150" y="340" text-anchor="middle" font-size="22" font-weight="700" fill="#183047">return pattern</text>
    <text x="150" y="371" text-anchor="middle" font-size="16" fill="#607080">sample • rule • horizon</text>

    <rect x="315" y="115" width="350" height="440" rx="24" fill="#f7f9fc" stroke="#9eb9ca" stroke-width="3"/>
    <text x="490" y="155" text-anchor="middle" font-size="23" font-weight="700" fill="#183047">JOINT-TEST AUDIT</text>
    <text x="490" y="183" text-anchor="middle" font-size="16" fill="#607080">Which explanation survives?</text>

    <rect x="355" y="215" width="270" height="54" rx="13" fill="#eaf3f8" stroke="#25678f" stroke-width="2"/>
    <text x="490" y="249" text-anchor="middle" font-size="18" font-weight="700" fill="#183047">Priced risk</text>
    <rect x="355" y="280" width="270" height="54" rx="13" fill="#edf4ed" stroke="#447c55" stroke-width="2"/>
    <text x="490" y="314" text-anchor="middle" font-size="18" font-weight="700" fill="#183047">Behavioral mispricing</text>
    <rect x="355" y="345" width="270" height="54" rx="13" fill="#f7f1e8" stroke="#b95f2d" stroke-width="2"/>
    <text x="490" y="379" text-anchor="middle" font-size="18" font-weight="700" fill="#183047">Market frictions</text>
    <rect x="355" y="410" width="270" height="54" rx="13" fill="#f5ebf5" stroke="#795a8a" stroke-width="2"/>
    <text x="490" y="444" text-anchor="middle" font-size="18" font-weight="700" fill="#183047">Model misspecification</text>
    <rect x="355" y="475" width="270" height="54" rx="13" fill="#fff0e9" stroke="#b95f2d" stroke-width="2"/>
    <text x="490" y="509" text-anchor="middle" font-size="18" font-weight="700" fill="#183047">Data mining</text>

    <rect x="725" y="195" width="250" height="280" rx="22" fill="#fff4e8" stroke="#b95f2d" stroke-width="3"/>
    <text x="850" y="237" text-anchor="middle" font-size="23" font-weight="700" fill="#183047">IMPLEMENTATION</text>
    <text x="850" y="278" text-anchor="middle" font-size="17" fill="#607080">Timing and observability</text>
    <text x="850" y="312" text-anchor="middle" font-size="17" fill="#607080">Liquidity and market impact</text>
    <text x="850" y="346" text-anchor="middle" font-size="17" fill="#607080">Trading and financing costs</text>
    <text x="850" y="380" text-anchor="middle" font-size="17" fill="#607080">Capacity and shorting</text>
    <text x="850" y="414" text-anchor="middle" font-size="17" fill="#607080">Taxes and constraints</text>
    <text x="850" y="449" text-anchor="middle" font-size="16" font-weight="700" fill="#b95f2d">Net of risk and costs?</text>

    <rect x="1020" y="270" width="150" height="130" rx="18" fill="#edf4ed" stroke="#447c55" stroke-width="3"/>
    <text x="1095" y="311" text-anchor="middle" font-size="19" font-weight="700" fill="#183047">OUT OF</text>
    <text x="1095" y="337" text-anchor="middle" font-size="19" font-weight="700" fill="#183047">SAMPLE</text>
    <text x="1095" y="370" text-anchor="middle" font-size="16" fill="#607080">and after</text>
    <text x="1095" y="391" text-anchor="middle" font-size="16" fill="#607080">publication</text>
  </g>

  <line x1="255" y1="335" x2="312" y2="335" stroke="#25678f" stroke-width="5" marker-end="url(#arrow)"/>
  <line x1="665" y1="335" x2="722" y2="335" stroke="#25678f" stroke-width="5" marker-end="url(#arrow)"/>
  <line x1="975" y1="335" x2="1017" y2="335" stroke="#25678f" stroke-width="5" marker-end="url(#arrow)"/>

  <g font-family="Arial, sans-serif" filter="url(#shadow)">
    <rect x="120" y="620" width="290" height="85" rx="17" fill="#eaf3f8" stroke="#25678f" stroke-width="2.5"/>
    <text x="265" y="655" text-anchor="middle" font-size="20" font-weight="700" fill="#183047">Bounded regularity</text>
    <text x="265" y="682" text-anchor="middle" font-size="16" fill="#607080">evidence, not a promise</text>
    <rect x="455" y="620" width="290" height="85" rx="17" fill="#edf4ed" stroke="#447c55" stroke-width="2.5"/>
    <text x="600" y="655" text-anchor="middle" font-size="20" font-weight="700" fill="#183047">Implementable strategy</text>
    <text x="600" y="682" text-anchor="middle" font-size="16" fill="#607080">rare, conditional, monitored</text>
    <rect x="790" y="620" width="290" height="85" rx="17" fill="#fff0e9" stroke="#b95f2d" stroke-width="2.5"/>
    <text x="935" y="655" text-anchor="middle" font-size="20" font-weight="700" fill="#183047">Insufficient evidence</text>
    <text x="935" y="682" text-anchor="middle" font-size="16" fill="#607080">revise, test, or do nothing</text>
  </g>

  <path d="M1095 400 C1095 545 265 545 265 617" fill="none" stroke="#25678f" stroke-width="3.5" marker-end="url(#arrow)"/>
  <path d="M1095 400 C1095 545 600 545 600 617" fill="none" stroke="#25678f" stroke-width="3.5" marker-end="url(#arrow)"/>
  <path d="M1095 400 C1095 545 935 545 935 617" fill="none" stroke="#25678f" stroke-width="3.5" marker-end="url(#arrow)"/>
</svg>

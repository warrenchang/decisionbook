<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="850" viewBox="0 0 900 850" role="img" aria-labelledby="title desc">
  <title id="title">Regression to the mean in a declared teaching model</title>
  <desc id="desc">A fixed-seed simulation of fifty observations uses independent standard-normal z one and epsilon, with z two equal to zero point four z one plus the square root of zero point eight four times epsilon. Seed 50273 produces a displayed sample correlation of about zero point four. The conditional prediction line has slope zero point four. An initial observation two standard deviations above average predicts a second measurement zero point eight standard deviations above average, not a reversal below average. A note states that individual outcomes can move either way and that regression does not identify an intervention effect.</desc>
  <defs>
    <style>
      .title{font:700 35px Arial,sans-serif;fill:#17324d}
      .subtitle{font:29px Arial,sans-serif;fill:#536879}
      .axis{stroke:#4f6476;stroke-width:2.5}
      .grid{stroke:#d8e1e8;stroke-width:1.5}
      .tick{font:27px Arial,sans-serif;fill:#536879}
      .axislabel{font:700 30px Arial,sans-serif;fill:#17324d}
      .point{fill:#80b7d6;stroke:#2f6f9f;stroke-width:1.2;opacity:.72}
      .identity{fill:none;stroke:#9aa9b5;stroke-width:3;stroke-dasharray:10 8}
      .prediction{fill:none;stroke:#c96021;stroke-width:5;stroke-linecap:round}
      .guide{fill:none;stroke:#3f7f54;stroke-width:2.5;stroke-dasharray:7 6}
      .label{font:700 28px Arial,sans-serif;fill:#17324d}
      .orange{font:700 28px Arial,sans-serif;fill:#a94c17}
      .green{font:700 28px Arial,sans-serif;fill:#2f6f43}
      .note{font:25px Arial,sans-serif;fill:#40566a}
      .noteStrong{font:700 26px Arial,sans-serif;fill:#17324d}
    </style>
  </defs>

  <rect width="900" height="850" fill="#ffffff"/>
  <text class="title" x="450" y="42" text-anchor="middle">An extreme observation predicts</text>
  <text class="title" x="450" y="79" text-anchor="middle">a less extreme conditional average</text>
  <text class="subtitle" x="450" y="114" text-anchor="middle">n=50; z₂=.40z₁+√.84ε; seed 50273; sample r≈.40</text>

  <rect x="105" y="125" width="740" height="525" rx="22" fill="#f8fafc" stroke="#b8c9d6" stroke-width="2"/>

  <line class="grid" x1="130" y1="236.7" x2="820" y2="236.7"/>

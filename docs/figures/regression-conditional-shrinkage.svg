  <line class="grid" x1="705" y1="160" x2="705" y2="620"/>

  <line class="axis" x1="130" y1="620" x2="820" y2="620"/>
  <line class="axis" x1="130" y1="160" x2="130" y2="620"/>

  <text class="tick" x="245" y="650" text-anchor="middle">−2</text>
  <text class="tick" x="360" y="650" text-anchor="middle">−1</text>
  <text class="tick" x="475" y="650" text-anchor="middle">0</text>
  <text class="tick" x="590" y="650" text-anchor="middle">1</text>
  <text class="tick" x="705" y="650" text-anchor="middle">2</text>
  <text class="tick" x="98" y="551" text-anchor="end">−2</text>

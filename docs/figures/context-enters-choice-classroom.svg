<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="title desc">
  <title id="title">Seven ways context enters choice</title>
  <desc id="desc">A classroom figure groups seven examples into three mechanisms. Treatment framing and a subscription decoy change representation or comparison. An organ-donation default and an advertising redesign change the path to action. Watched eyes, Mars publicity, and a museum message change social meaning, accessibility, or active motive. Each card states what stayed fixed, what context changed, and the evidence boundary.</desc>
  <defs>
    <style>
      .title{font:700 58px Arial,Helvetica,sans-serif;fill:#17324d}
      .subtitle{font:30px Arial,Helvetica,sans-serif;fill:#536779}
      .panel-kicker{font:700 22px Arial,Helvetica,sans-serif;letter-spacing:1.8px}
      .panel-title{font:700 34px Arial,Helvetica,sans-serif;fill:#17324d}
      .panel-desc{font:25px Arial,Helvetica,sans-serif;fill:#536779}
      .case-number{font:700 25px Arial,Helvetica,sans-serif;fill:#ffffff}
      .case-title{font:700 31px Arial,Helvetica,sans-serif;fill:#17324d}
      .case-line{font:24px Arial,Helvetica,sans-serif;fill:#334e68}
      .case-key{font-weight:700;fill:#17324d}
      .evidence{font:24px Arial,Helvetica,sans-serif;fill:#536779}
      .footer-strong{font:700 28px Arial,Helvetica,sans-serif;fill:#17324d}
      .footer{font:24px Arial,Helvetica,sans-serif;fill:#536779}
    </style>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#17324d" flood-opacity="0.10"/>
    </filter>
  </defs>

  <rect width="1920" height="1080" fill="#ffffff"/>
  <text id="title-text" class="title" x="960" y="70" text-anchor="middle">Seven ways context enters choice</text>
  <text class="subtitle" x="960" y="116" text-anchor="middle">The option can stay similar while context changes representation, action, or meaning.</text>
  <line x1="120" y1="143" x2="1800" y2="143" stroke="#d2dee7" stroke-width="3"/>

  <!-- Panel 1 -->
  <rect x="45" y="170" width="590" height="770" rx="28" fill="#f4f8fb" stroke="#9fb8ca" stroke-width="3"/>
  <text class="panel-kicker" x="75" y="213" fill="#2f6f9f">MECHANISM 1</text>
  <text class="panel-title" x="75" y="258">Representation &amp; comparison</text>
  <text class="panel-desc" x="75" y="294">Context changes how an option is encoded</text>
  <text class="panel-desc" x="75" y="327">or compared with alternatives.</text>

  <rect x="72" y="355" width="536" height="248" rx="22" fill="#ffffff" stroke="#c9d7e1" stroke-width="2.5" filter="url(#shadow)"/>
  <circle cx="112" cy="397" r="24" fill="#2f6f9f"/>
  <text class="case-number" x="112" y="406" text-anchor="middle">1</text>
  <text class="case-title" x="153" y="407">Treatment framing</text>
  <text class="case-line" x="101" y="456"><tspan class="case-key">Held fixed:</tspan><tspan dx="8">outcome probabilities.</tspan></text>
  <text class="case-line" x="101" y="493"><tspan class="case-key">Context:</tspan><tspan dx="8">survival or mortality</tspan></text>
  <text class="case-line" x="101" y="527">is foregrounded.</text>
  <text class="evidence" x="101" y="570">Evidence: controlled framing study;</text>
  <text class="evidence" x="101" y="596">hypothetical treatment choice.</text>

  <rect x="72" y="626" width="536" height="248" rx="22" fill="#ffffff" stroke="#c9d7e1" stroke-width="2.5" filter="url(#shadow)"/>
  <circle cx="112" cy="668" r="24" fill="#2f6f9f"/>
  <text class="case-number" x="112" y="677" text-anchor="middle">2</text>
  <text class="case-title" x="153" y="678">Subscription decoy</text>
  <text class="case-line" x="101" y="727"><tspan class="case-key">Held fixed:</tspan><tspan dx="8">target subscription options.</tspan></text>
  <text class="case-line" x="101" y="764"><tspan class="case-key">Context:</tspan><tspan dx="8">the comparison set changes.</tspan></text>
  <text class="evidence" x="101" y="817">Evidence: attraction-effect literature;</text>
  <text class="evidence" x="101" y="843">exact classroom counts were not sales.</text>

  <!-- Panel 2 -->
  <rect x="665" y="170" width="590" height="770" rx="28" fill="#f3f8f4" stroke="#9fc2aa" stroke-width="3"/>
  <text class="panel-kicker" x="695" y="213" fill="#3f8457">MECHANISM 2</text>
  <text class="panel-title" x="695" y="258">Path from option to action</text>
  <text class="panel-desc" x="695" y="294">Defaults and interfaces change what</text>
  <text class="panel-desc" x="695" y="327">happens before action is taken.</text>

  <rect x="692" y="355" width="536" height="248" rx="22" fill="#ffffff" stroke="#cadccf" stroke-width="2.5" filter="url(#shadow)"/>
  <circle cx="732" cy="397" r="24" fill="#3f8457"/>
  <text class="case-number" x="732" y="406" text-anchor="middle">3</text>
  <text class="case-title" x="773" y="407">Organ-donation default</text>
  <text class="case-line" x="721" y="456"><tspan class="case-key">Held fixed:</tspan><tspan dx="8">ability to choose either.</tspan></text>
  <text class="case-line" x="721" y="493"><tspan class="case-key">Context:</tspan><tspan dx="8">inaction, effort, and</tspan></text>
  <text class="case-line" x="721" y="527">implied recommendation.</text>
  <text class="evidence" x="721" y="570">Evidence: experimental and policy;</text>
  <text class="evidence" x="721" y="596">the wider institutional system matters.</text>

  <rect x="692" y="626" width="536" height="248" rx="22" fill="#ffffff" stroke="#cadccf" stroke-width="2.5" filter="url(#shadow)"/>
  <circle cx="732" cy="668" r="24" fill="#3f8457"/>
  <text class="case-number" x="732" y="677" text-anchor="middle">4</text>
  <text class="case-title" x="773" y="678">Advertising redesign</text>
  <text class="case-line" x="721" y="727"><tspan class="case-key">Held fixed:</tspan><tspan dx="8">the underlying offer.</tspan></text>
  <text class="case-line" x="721" y="764"><tspan class="case-key">Context:</tspan><tspan dx="8">salience and action path.</tspan></text>
  <text class="evidence" x="721" y="817">Evidence: bundled corporate report;</text>
  <text class="evidence" x="721" y="843">the arrow was not isolated.</text>

  <!-- Panel 3 -->
  <rect x="1285" y="170" width="590" height="770" rx="28" fill="#fff8f0" stroke="#d7b58f" stroke-width="3"/>
  <text class="panel-kicker" x="1315" y="213" fill="#b96a2f">MECHANISM 3</text>
  <text class="panel-title" x="1315" y="258">Meaning, accessibility &amp; motive</text>
  <text class="panel-desc" x="1315" y="294">Context changes what feels observed,</text>
  <text class="panel-desc" x="1315" y="327">comes to mind, or fits the current goal.</text>

  <rect x="1312" y="355" width="536" height="167" rx="22" fill="#ffffff" stroke="#e1cfbb" stroke-width="2.5" filter="url(#shadow)"/>
  <circle cx="1352" cy="395" r="24" fill="#b96a2f"/>
  <text class="case-number" x="1352" y="404" text-anchor="middle">5</text>
  <text class="case-title" x="1393" y="405">Watched eyes</text>
  <text class="case-line" x="1341" y="449"><tspan class="case-key">Held fixed:</tspan><tspan dx="8">prices and rules.</tspan></text>
  <text class="case-line" x="1341" y="479"><tspan class="case-key">Context:</tspan><tspan dx="8">observability cue.</tspan></text>
  <text class="evidence" x="1341" y="509">Small field study; meta-analyses null overall.</text>

  <rect x="1312" y="542" width="536" height="167" rx="22" fill="#ffffff" stroke="#e1cfbb" stroke-width="2.5" filter="url(#shadow)"/>
  <circle cx="1352" cy="582" r="24" fill="#b96a2f"/>
  <text class="case-number" x="1352" y="591" text-anchor="middle">6</text>
  <text class="case-title" x="1393" y="592">Mars publicity</text>
  <text class="case-line" x="1341" y="632"><tspan class="case-key">Held fixed:</tspan><tspan dx="8">the product.</tspan></text>
  <text class="case-line" x="1341" y="662"><tspan class="case-key">Context:</tspan><tspan dx="8">accessibility may change.</tspan></text>
  <text class="evidence" x="1341" y="696">Anecdote; serious causal alternatives remain.</text>

  <rect x="1312" y="729" width="536" height="167" rx="22" fill="#ffffff" stroke="#e1cfbb" stroke-width="2.5" filter="url(#shadow)"/>
  <circle cx="1352" cy="769" r="24" fill="#b96a2f"/>
  <text class="case-number" x="1352" y="778" text-anchor="middle">7</text>
  <text class="case-title" x="1393" y="779">Museum message</text>
  <text class="case-line" x="1341" y="819"><tspan class="case-key">Held fixed:</tspan><tspan dx="8">the venue.</tspan></text>
  <text class="case-line" x="1341" y="849"><tspan class="case-key">Context:</tspan><tspan dx="8">motive changes meaning.</tspan></text>
  <text class="evidence" x="1341" y="883">Factorial rating experiment; not attendance.</text>

  <text class="footer-strong" x="960" y="997" text-anchor="middle">A rational benchmark identifies what should matter; behavioral evidence asks what actually enters the process.</text>
  <text class="footer" x="960" y="1036" text-anchor="middle">Evidence labels are boundaries—not a ranking, and not a claim that every context effect is irrational.</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="760" viewBox="0 0 1440 760" role="img" aria-labelledby="title desc">
  <title id="title">A small interface cue can redirect action</title>
  <desc id="desc">Two generic display advertisements contain the same offer. The second includes a prominent right-pointing arrow as one element of a broader redesign. Google reported higher clicks after a bundled redesign, but its public report did not isolate the arrow, report an effect size, or establish user welfare.</desc>
  <defs>
    <marker id="flow-head" viewBox="0 0 10 8" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0.5 0.8 L9 4 L0.5 7.2 Z" fill="#2f6f9f"/>
    </marker>
    <style>
      .title{font:700 36px Arial,Helvetica,sans-serif;fill:#17324d}
      .subtitle{font:20px Arial,Helvetica,sans-serif;fill:#5d6f80}
      .panel{font:700 24px Arial,Helvetica,sans-serif;fill:#17324d}
      .adtitle{font:700 29px Arial,Helvetica,sans-serif;fill:#1e5c99}
      .url{font:21px Arial,Helvetica,sans-serif;fill:#247341}
      .body{font:21px Arial,Helvetica,sans-serif;fill:#4e6071}
      .label{font:700 21px Arial,Helvetica,sans-serif;fill:#17324d}
      .small{font:19px Arial,Helvetica,sans-serif;fill:#5d6f80}
    </style>
  </defs>

  <rect width="1440" height="760" fill="#ffffff"/>
  <text class="title" x="720" y="54" text-anchor="middle">A small interface cue can redirect action</text>
  <text class="subtitle" x="720" y="90" text-anchor="middle">The offer can remain the same while the path to acting becomes more salient.</text>

  <rect x="70" y="140" width="500" height="350" rx="26" fill="#f7fafc" stroke="#9fb3c3" stroke-width="3"/>
  <text class="panel" x="320" y="182" text-anchor="middle">Generic display advertisement</text>
  <rect x="115" y="218" width="410" height="210" rx="18" fill="#ffffff" stroke="#c6d2dc" stroke-width="3"/>
  <text class="adtitle" x="150" y="270">Hotel offers</text>
  <text class="url" x="150" y="307">example.test/hotels</text>
  <text class="body" x="150" y="352">Compare rooms, dates, and prices.</text>
  <text class="body" x="150" y="387">Choose only when the offer fits.</text>
  <text class="small" x="320" y="462" text-anchor="middle">Offer information and action path</text>

  <line x1="590" y1="315" x2="868" y2="315" stroke="#2f6f9f" stroke-width="4" stroke-linecap="round" marker-end="url(#flow-head)"/>
  <text class="label" x="720" y="258" text-anchor="middle">Bundled redesign</text>
  <text class="small" x="720" y="286" text-anchor="middle">arrow + type + spacing</text>
  <text class="small" x="720" y="309" text-anchor="middle">layout changed too</text>

  <rect x="870" y="140" width="500" height="350" rx="26" fill="#edf6fb" stroke="#2f6f9f" stroke-width="3"/>
  <text class="panel" x="1120" y="182" text-anchor="middle">Action made more prominent</text>
  <rect x="915" y="218" width="410" height="210" rx="18" fill="#ffffff" stroke="#8fb8d2" stroke-width="3"/>
  <text class="adtitle" x="950" y="270">Hotel offers</text>
  <text class="url" x="950" y="307">example.test/hotels</text>
  <text class="body" x="950" y="352">Compare rooms, dates, and prices.</text>
  <text class="body" x="950" y="387">Choose only when the offer fits.</text>
  <rect x="1235" y="245" width="64" height="64" rx="14" fill="#2f6f9f"/>
  <line x1="1251" y1="277" x2="1282" y2="277" stroke="#ffffff" stroke-width="5" stroke-linecap="round"/>
  <path d="M1270 263 L1284 277 L1270 291" fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <text class="small" x="1120" y="462" text-anchor="middle">The cue clarifies where to act next</text>

  <rect x="120" y="535" width="1200" height="82" rx="20" fill="#e9f4ee" stroke="#3f8457" stroke-width="3"/>
  <text class="label" x="720" y="572" text-anchor="middle">Reported observation</text>
  <text class="body" x="720" y="603" text-anchor="middle">Google reported higher clicks after the bundled redesign across Display Network publishers.</text>

  <rect x="120" y="642" width="1200" height="72" rx="20" fill="#fff4e8" stroke="#c56a2d" stroke-width="3"/>
  <text x="720" y="672" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="700" fill="#7b3e18">Evidence boundary</text>
  <text x="720" y="701" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="19" fill="#6b5546">The public report does not isolate the arrow, disclose an effect size, or establish profit or user welfare.</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="760" height="1130" viewBox="0 0 760 1130" role="img" aria-labelledby="title desc" data-layout="compact">
<title id="title">An interface can make the next step more salient</title><desc id="desc">Two versions of an illustrative hotel advertisement carry the same offer. A bundled redesign changes the action arrow, type, spacing, and layout. Reported higher clicks concern the bundle and do not isolate the arrow or establish better decisions.</desc>
<defs><style>
text {font-family:Arial,Helvetica,sans-serif;fill:#183047}
.title {font-family:Georgia,serif;font-size:38px;font-weight:bold}
</style>
<marker id="blue" markerWidth="8" markerHeight="8" refX="8" refY="4" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8 Z" fill="#25678f"/></marker>
<marker id="green" markerWidth="8" markerHeight="8" refX="8" refY="4" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8 Z" fill="#2b7a78"/></marker>
<marker id="warm" markerWidth="8" markerHeight="8" refX="8" refY="4" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8 Z" fill="#b95f2d"/></marker>
</defs><rect width="760" height="1130" fill="white"/>
<text x="380" y="57" text-anchor="middle" font-size="38" font-weight="normal" style="fill:#183047" class="title"><tspan x="380" dy="0">Make the next step</tspan><tspan x="380" dy="47.12">easier to notice</tspan></text>
<rect x="75" y="168" width="610" height="284" rx="18" fill="#f4f7fa" stroke="#25678f" stroke-width="2.5"/>
<text x="380.0" y="211" text-anchor="middle" font-size="32" font-weight="bold" style="fill:#25678f" class=""><tspan x="380.0" dy="0">Original presentation</tspan></text>
<rect x="124" y="253" width="512" height="162" rx="18" fill="#f4f7fa" stroke="#25678f" stroke-width="2.5"/>
<text x="380.0" y="296" text-anchor="middle" font-size="31" font-weight="bold" style="fill:#25678f" class=""><tspan x="380.0" dy="0">Hotel offers</tspan></text>
<text x="380.0" y="337" text-anchor="middle" font-size="28" font-weight="normal" style="fill:#183047" class=""><tspan x="380.0" dy="0">Compare rooms, dates, and prices.</tspan><tspan x="380.0" dy="34.72">Choose only when the offer fits.</tspan></text>
<rect x="90" y="478" width="580" height="84" rx="14" fill="white" stroke="#607080" stroke-width="2"/>
<path d="M380 452 V478" fill="none" stroke="#25678f" stroke-width="3" stroke-linejoin="round" marker-end="url(#blue)"/>
<path d="M380 562 V592" fill="none" stroke="#25678f" stroke-width="3" stroke-linejoin="round" marker-end="url(#blue)"/>
<text x="380" y="509" text-anchor="middle" font-size="28" font-weight="normal" style="fill:#183047" class=""><tspan x="380" dy="0">Bundled redesign:</tspan><tspan x="380" dy="34.72">arrow, type, spacing, and layout</tspan></text>
<rect x="75" y="592" width="610" height="284" rx="18" fill="#f4f7fa" stroke="#25678f" stroke-width="2.5"/>
<text x="380.0" y="635" text-anchor="middle" font-size="32" font-weight="bold" style="fill:#25678f" class=""><tspan x="380.0" dy="0">More prominent action cue</tspan></text>
<rect x="124" y="677" width="512" height="162" rx="18" fill="#f4f7fa" stroke="#25678f" stroke-width="2.5"/>
<text x="380.0" y="720" text-anchor="middle" font-size="31" font-weight="bold" style="fill:#25678f" class=""><tspan x="380.0" dy="0">Hotel offers</tspan></text>
<text x="380.0" y="761" text-anchor="middle" font-size="28" font-weight="normal" style="fill:#183047" class=""><tspan x="380.0" dy="0">Compare rooms, dates, and prices.</tspan><tspan x="380.0" dy="34.72">Choose only when the offer fits.</tspan></text>
<rect x="557" y="693" width="52" height="48" rx="10" fill="#25678f"/><path d="M568 717 H596 M585 706 L596 717 L585 728" fill="none" stroke="white" stroke-width="3" stroke-linejoin="round"/>
<text x="380" y="946" text-anchor="middle" font-size="28" font-weight="normal" style="fill:#183047" class=""><tspan x="380" dy="0">Reported clicks rose after the bundle.</tspan><tspan x="380" dy="34.72">That does not isolate the arrow’s effect</tspan><tspan x="380" dy="34.72">or show that choices improved.</tspan></text>
</svg>
